<script>/* js/ui/ui-crime.js */
/* ui-crime.js - the optional 🕶️ crime screen. Icon rows, tap for info, details behind buttons. */
(function () {
  const TG = globalThis.TG; const U = TG.U; const UI = TG.UI; const esc = UI.esc, m = UI.m;
  const N = (x) => Math.round(x).toLocaleString();
  const K = () => TG.CONFIG.crime;
  const S = () => (UI.S.cr = UI.S.cr || { sup: 'plug', ht: 'branch', hm: 1, hg: 1, hp: 0 });
  const tone = (p) => (p > 0.08 ? 'bad' : p > 0.025 ? 'warn' : 'good');
  const oddsPill = (p) => UI.pill(p < 0.001 ? '0%' : U.pct(p, p < 0.1 ? 1 : 0), tone(p));
  const rows = (list, pre) => list.map((x, i) => { const key = pre + i; return `<div class="irow"><span class="dot ${x.tone}"></span><span class="ic">${x.i}</span><span class="lb" data-act="tip" data-arg="${key}" data-nosave="1">${esc(x.t)}</span><span class="vl">${UI.fmtN(x.v, x.u)}</span>${x.tip ? UI.tipBtn(key) : ''}${UI.tipLine(key, x.tip)}</div>`; }).join('');

  UI.screens.crime = () => {
    const g = TG.G; const CR = TG.CR; const c = CR.ensure(g);
    if (!CR.on(g)) return `<h2>🕶️ Crime</h2><div class="card">Crime is turned off in ☰ More → ⚙️ Settings.</div>`;
    const tabs = [['home', '🏠'], ['goods', '📦 Goods'], ['crew', '👥 Crew'], ['turf', '🗺️ Turf'], ['clean', '🧼 Clean'], ['jobs', '🎯 Jobs'], ['law', '⚖️ Law'], ['rep', '📊 Reports']];
    const t = UI.curTab('crime', 'home');
    let o = `<h2>🕶️ Crime ${UI.tipBtn('crIntro')}</h2>${UI.tipLine('crIntro', 'A risky side path. Crime money is street cash: it only becomes normal cash by laundering it through your businesses. Police heat, raids, robberies, snitches, jail and seizure can wipe you out. Nothing here is guaranteed.')}`;
    if (CR.jailed(g)) o += `<div class="banner">⛓️ You are in jail: ${c.jail} months left. Your managers run the businesses; your crew works at half speed and gets restless. You can only skip time.</div>`;
    o += UI.tabs('crime', tabs);
    return o + ({ home, goods, crew, turf, clean, jobs, law, rep: report }[t] || home)(g, c, CR);
  };

  // ---------- 🏠 overview ----------
  function home(g, c, CR) {
    let o = `<div class="tiles">${UI.tile('crD', '💵', m(c.dirty), 'Street cash', c.dirty > 0 ? 'g' : '', 'Dirty money. Pays crew and supplies. Raids and robbers take it. Clean it in 🧼 to use it normally. Counts 60% in net worth.')}
      ${UI.tile('crH', '🚨', Math.round(c.heat), 'Heat', c.heat > 60 ? 'r' : c.heat > 30 ? 'y' : 'g', 'How much the police watch you (0-100). Sales, crew, turf and big jobs raise it. It cools a bit each month; lookouts cool it faster.')}
      ${UI.tile('crC', '🧲', N(c.clients), 'Clients', '', `Loyal buyers. Room for ${N(c.last.room || 60 + c.blocks * K().perBlock)} on your ${c.blocks} blocks. Cheap prices bring them faster; high prices send them to rivals.`)}
      ${UI.tile('crR', '⭐', Math.round(c.rep), 'Street rep', c.rep < 30 ? 'r' : c.rep > 60 ? 'g' : '', 'What the street thinks of you. Fair prices and full shelves raise it. It unlocks better goods and suppliers.')}</div>`;
    if (!c.started) {
      o += `<div class="card"><h3>🚪 Start</h3>${UI.irow('crS1', '💵', 'Move cash to the street', null, 'Moves normal cash into street cash so you can buy goods and pay crew. Moving more than $10,000 at once adds heat (banks report it).')}
        <div class="row"><input type="number" id="crW" placeholder="$ amount" value="20000">${UI.btn('Move', 'crDo', 'withdraw', 'pri')}</div>
        <div class="mute">Then: 📦 buy goods, set a price, and sell to clients. You sell yourself at first (about ${N(K().youDeal)} a month).</div></div>`;
      return o;
    }
    // sales vs what you could sell
    const cap = CR.capacity(g); const L = { demand: ['🧲', 'Not enough clients', 'Everyone who wanted to buy got served. More blocks, better rep or lower prices bring more.'], stock: ['📦', 'Ran out of goods', 'Buy more or get a stash house for more room.'], dealers: ['🧍', 'Not enough dealers', 'Hire dealers in 👥 Crew.'], runners: ['🏃', 'Not enough runners', 'Hire runners or buy a van.'] }[c.last.limit || 'demand'];
    o += `<div class="card"><h3>🛒 Sales ${UI.tipBtn('crSl')}</h3>${UI.tipLine('crSl', 'Sales = the smallest of: what clients want, what your dealers and runners can move, and your stock.')}
      <div class="tiles">${UI.tile('crS', '🛒', N(c.last.sold_ || 0), 'Sold', '', 'Units sold last month.')}${UI.tile('crW2', '🧲', N(c.last.wanted || 0), 'Wanted', '', 'Units clients wanted at your prices.')}${UI.tile('crCap', '🧱', N(Math.min(cap.deal, cap.run)), 'Could move', '', 'The most dealers and runners can handle (bigger goods take more effort).')}</div>
      ${UI.irow('crLim', L[0], 'Held back by: ' + L[1], null, L[2])}</div>`;
    o += workCard(g, c, CR);
    o += `<div class="card"><h3>⚠️ Danger this month ${UI.tipBtn('crOdd')}</h3>${UI.tipLine('crOdd', 'Odds that each bad thing happens next month, and why. They can be lowered, never to zero.')}
      ${CR.odds(g).filter((x) => x.p > 0).map((x) => UI.irow('cro' + x.id, x.i, x.t, oddsPill(x.p), x.why)).join('') || '<div class="mute">Nothing yet.</div>'}</div>`;
    o += `<div class="card"><div class="btns">${UI.btn('👥 See crew', 'crDetail', 'crew', 'sm')}${UI.btn('📦 See stash', 'crDetail', 'stash', 'sm')}${UI.btn('📜 Crime log', 'crDetail', 'log', 'sm')}${UI.btn('📊 Reports', 'tab', 'crime:rep', 'sm')}</div></div>`;
    return o;
  }
  // ---------- 📊 reports: what happened this month and what to expect next (v6: kept off the working view) ----------
  function report(g, c) {
    if (!c.started) return '<div class="card mute">Nothing to report yet.</div>';
    let o = `<div class="card"><h3>📅 This month</h3>${c.flow.length ? rows(c.flow, 'crf') : '<div class="mute">Press ▶ Next Month.</div>'}</div>`;
    if (c.next.length) o += `<div class="card"><h3>🔮 Next month</h3>${rows(c.next, 'crn')}</div>`;
    return o;
  }
  function workCard(g, c, CR) {
    const cap = CR.capacity(g); const need = c.last.workNeed || 0;
    const r = (k, i, t, n, load, capV, u, tip) => { const ut = capV > 0 ? load / capV : 0; const tn = TG.WK.tone(ut); return `<div class="link" data-act="tip" data-arg="${k}" data-nosave="1"><span class="ico">${i}</span><span class="grow">${esc(t)} <span class="mute">x${n}</span> <span class="mute">${N(load)}/${N(capV)} ${u}</span></span>${UI.pill(Math.round(ut * 100) + '%', tn === 'r' ? 'bad' : tn === 'y' ? 'warn' : 'good')}</div>${UI.tipLine(k, tip)}`; };
    const D = K().crew;
    return `<div class="card"><h3>💪 Work ${UI.tipBtn('crWk')}</h3>${UI.tipLine('crWk', 'Each crew member handles a set amount (more with skill). Over 100% = lost sales; busy vans wear out faster.')}
      ${r('crw1', '🧍', 'Dealers' + (c.selfDeal && !TG.CR.jailed(g) ? ' + you' : ''), CR.count(g, 'dealer'), need, cap.deal, 'deals', `${D.dealer.desc} You add ${N(K().youDeal)} while free.`)}
      ${r('crw2', '🏃', 'Runners & vans', CR.count(g, 'runner') + cap.vans, need, cap.run, 'moved', `${D.runner.desc} Each van adds ${N(K().gear.van.cap)}.`)}
      ${r('crw3', '👀', 'Lookouts', CR.count(g, 'lookout'), c.blocks, cap.watch, 'blocks', D.lookout.desc)}
      ${r('crw4', '💪', 'Enforcers', CR.count(g, 'enforcer'), c.blocks, cap.guard, 'blocks', D.enforcer.desc)}
      ${CR.count(g, 'cook') ? r('crw5', '🧪', 'Cooks in workshops', CR.count(g, 'cook'), CR.count(g, 'cook'), cap.shops, 'cooks', 'Each workshop fits 2 cooks.') : ''}</div>`;
  }

  // ---------- 📦 goods: buy, price, sell back ----------
  function goods(g, c, CR) {
    const s = S(); const Sp = K().suppliers;
    let o = `<div class="card"><h3>📦 Stash ${N(CR.units(g))}/${N(CR.room(g))} ${UI.tipBtn('crSt')}</h3>${UI.tipLine('crSt', 'How many units you can hold. Stash houses add room (🗺️ Turf). Raids and robbers take stash.')}${UI.bar(CR.units(g), CR.room(g), true)}</div>`;
    o += `<div class="card"><h3>🤝 Supplier</h3><div class="btns">${Object.entries(Sp).map(([k, v]) => UI.btn(`${v.icon} ${v.label}`, 'crSup', k, 'sm' + (s.sup === k ? ' pri' : ''), !CR.unlocked(g, v.unlock))).join('')}</div>`;
    const sp = Sp[s.sup]; const od = CR.supOdds(g, s.sup);
    o += UI.irow('crSp', sp.icon, sp.label, `x${sp.mult.toFixed(2)} price`, `${sp.desc} Full order ${U.pct(od.ok)} · short ${U.pct(od.short)} · no-show ${U.pct(od.none)} (lose ${U.pct(K().noShowLoss)} of the money)${od.sting ? ` · police sting ${U.pct(od.sting)}` : ''}. Max order ${N(sp.maxOrder)}${sp.minOrder ? `, min ${m(sp.minOrder)}` : ''}. Unlock: ${sp.unlock.turf} blocks, ${sp.unlock.rep} rep.`)
      + `<div class="small">✅ ${U.pct(od.ok)} full · ⚠️ ${U.pct(od.short)} short · ❌ ${U.pct(od.none)} no-show${od.sting ? ` · 🚔 ${U.pct(od.sting)} sting` : ''}</div></div>`;
    for (const [p, P] of Object.entries(K().products)) {
      const un = CR.unlocked(g, P.unlock); const st = CR.street(g, p), pr = CR.price(g, p), r = pr / st; const wb = CR.wholesale(g, p) * sp.mult;
      const k = 'crp' + p;
      o += `<div class="card">${UI.irow(k, P.icon, P.label, un ? `${N(c.stock[p])} in stash` : '🔒', `${P.desc} Each client wants about ${P.want}/month. Heat per sale ${P.heat}. ${un ? '' : `Unlocks at ${P.unlock.turf} blocks and ${P.unlock.rep} street rep.`}`)}`;
      if (!un) { o += '</div>'; continue; }
      o += `<div class="small">🏷️ Street ${m(st)} · you buy at ${m(wb)} · margin ${m(pr - wb)} a unit</div>
        <div class="row" style="gap:6px;flex-wrap:wrap">🏷️ Your price <b>${m(pr)}</b> ${UI.pill(c.ask[p] == null ? 'street price' : (r < 0.97 ? 'cheap ' : r > 1.03 ? 'dear ' : 'fair ') + Math.round(r * 100) + '%', r > 1.1 ? 'warn' : r < 0.9 ? 'info' : 'good')}
        ${UI.btn('➖', 'crAsk', p + '|-', 'xs')}${UI.btn('➕', 'crAsk', p + '|+', 'xs')}${UI.btn('Street', 'crAsk', p + '|m', 'xs')}${UI.tipBtn(k + 'pr')}</div>${UI.tipLine(k + 'pr', 'Cheap: more buyers, clients grow faster, street rep rises, less heat per sale, but a thin margin. Dear: bigger margin, but clients leave for rivals, fewer fit on your turf and rep falls. Neither always wins.')}
        <div class="row"><input type="number" id="crQ${p}" placeholder="units" value="${Math.max(10, Math.round(c.clients * P.want))}" style="max-width:110px">${UI.btn('🛒 Buy', 'crBuy', p, 'sm goodb', !sp.goods.includes(p))}${UI.btn('Sell back', 'crDump', p, 'sm')}</div>
        <div class="small mute">${sp.goods.includes(p) ? `Cost ${m(wb)} each from ${sp.label}` : `${sp.label} does not sell this`} · sell back pays ${m(CR.wholesale(g, p) * K().sellBackShare)}</div></div>`;
    }
    return o;
  }

  // ---------- 👥 crew ----------
  function crew(g, c, CR) {
    const D = K().crew; let o = `<div class="card"><h3>👥 Your crew (${c.crew.length}) · wages ${m(U.sum(c.crew, (e) => e.wage))}/mo</h3>`;
    o += c.crew.length ? c.crew.map((e) => crewRow(g, e, CR)).join('') : '<div class="mute">Nobody yet. You do everything yourself.</div>';
    o += `<div class="row" style="margin-top:6px">${UI.btn(c.selfDeal ? '🙋 You sell on the street ✓' : '🙋 You stay off the street', 'crSelf', null, 'sm')}${UI.tipBtn('crSelf')}</div>${UI.tipLine('crSelf', `Selling yourself adds ${K().youDeal} deals and ${K().youRun} runs a month, but if police raid you are 30% more likely to be arrested.`)}</div>`;
    o += `<div class="card"><h3>🧑‍🤝‍🧑 Who wants in ${UI.tipBtn('crHire')}</h3>${UI.tipLine('crHire', `New faces each month. Hiring costs ${U.pct(K().hireCost)} of a month's wage up front. Skill = how much they get done. Loyalty = how likely they stay quiet and stay.`)}`;
    for (const k of CR.candidates(g)) {
      const d = D[k.role]; const cap = CR.capOf(k); const u = k.role === 'enforcer' || k.role === 'lookout' ? 'blocks' : k.role === 'cook' ? 'workshop slot' : k.role === 'dealer' ? 'deals/mo' : 'runs/mo';
      o += `<div class="irow"><span class="ic">${d.icon}</span><span class="lb" data-act="tip" data-arg="crk${k.id}" data-nosave="1">${esc(k.name)}<small>${d.label} · adds ${k.role === 'cook' ? N(K().cookMakes.sugar * (0.6 + 0.8 * k.skill / 100)) + ' Sugar/mo' : (cap < 10 ? cap.toFixed(1) : N(cap)) + ' ' + u}</small></span>
        <span class="small">🎯 ${k.skill} · 🤝 ${k.loyalty} · ${m(k.wage)}/mo</span>${UI.btn(`Hire ${m(k.wage * K().hireCost)}`, 'crHire', k.id, 'xs goodb')}${UI.tipLine('crk' + k.id, `${d.desc} Skill ${k.skill}: does ${Math.round((0.6 + 0.8 * k.skill / 100) * 100)}% of a normal ${d.label.toLowerCase()} (skill 50 = 100%). Loyalty ${k.loyalty}: under 60 they may snitch, more when heat is high.`)}</div>`;
    }
    return o + '</div>';
  }
  const crewRow = (g, e, CR) => {
    const d = K().crew[e.role]; const k = 'cre' + e.id;
    return `<div class="irow"><span class="ic">${d.icon}</span><span class="lb" data-act="tip" data-arg="${k}" data-nosave="1">${esc(e.name)}<small>${d.label}${e.inj ? ' · 🤕 hurt' : ''}</small></span><span class="small">🎯 ${Math.round(e.skill)} · 🤝 ${Math.round(e.loyalty)}</span>
      ${UI.btn('🎓', 'crCrew', e.id + '|train', 'xs')}${UI.btn('🎁', 'crCrew', e.id + '|bonus', 'xs')}${UI.btn('✖', 'crCrew', e.id + '|fire', 'xs badb')}
      ${UI.tipLine(k, `${d.desc} Handles ${N(CR.capOf(e))} now; +10 skill → ${N(K().crew[e.role].cap * (0.6 + 0.8 * Math.min(99, e.skill + 10) / 100))}. 🎓 Train ${m(K().trainCost)}: +${K().trainSkill[0]}-${K().trainSkill[1]} skill (${TG.USES.left(e, 'train', g.month, K().trainPerMonth)} left this month). 🎁 Bonus ${m(e.wage * 0.5)}: +10 loyalty (${TG.USES.left(e, 'bonus', g.month, K().bonusPerMonth)} left). More than that backfires: loyalty drops.`)}</div>`;
  };

  // ---------- 🗺️ turf & gear ----------
  function turf(g, c, CR) {
    const p = CR.turfOdds(g);
    let o = `<div class="card"><h3>🗺️ Turf: ${c.blocks} blocks</h3>${UI.irow('crTf', '🏘️', 'Take a new block', m(CR.turfCost(g)), `Each block holds about ${K().perBlock} more clients and brings new ones each month. Win odds ${U.pct(p)} (more enforcers and rep help). Losing hurts crew and adds heat. One try a month. Each block adds a little heat every month.`, UI.btn(`Try (${U.pct(p)})`, 'crDo', 'expand', 'sm'))}
      ${UI.irow('crRk', '🛡️', 'Protection racket', c.racket ? 'ON' : 'off', `Shops on your blocks pay you ${m(K().racket.perBlock)} each a month (half if you have fewer enforcers than half your blocks). Adds ${K().racket.heat} heat per block a month and shop owners may call police.`, UI.btn(c.racket ? 'Stop' : 'Start', 'crDo', 'racket', 'sm'))}</div>`;
    o += `<div class="card"><h3>🧰 Gear</h3>`;
    for (const [k, G] of Object.entries(K().gear)) {
      const n = c.gear.filter((x) => x.type === k).length;
      o += UI.irow('crg' + k, G.icon, G.label + (n ? ` ×${n}` : ''), m(G.price * g.world.priceIdx), `${G.desc} Upkeep ${m(G.upkeep)}/mo. Lasts about ${Math.round(G.life / 12) || 1} years.`, UI.btn('Buy', 'crGear', k, 'xs goodb'));
    }
    const own = c.gear;
    if (own.length) o += `<h4>Owned</h4>` + own.map((it) => `<div class="irow"><span class="ic">${K().gear[it.type].icon}</span><span class="lb">${K().gear[it.type].label}<small>wear ${Math.round(it.wear)}%${it.broken ? ' · broken' : ''}</small></span>${UI.btn('Sell ' + m(CR.gearValue(g, it)), 'crSell', it.id, 'xs')}</div>`).join('');
    return o + '</div>';
  }

  // ---------- 🧼 laundering ----------
  function clean(g, c, CR) {
    const L = CR.launderCap(g); const plan = Math.min(c.launder, c.dirty); const a = CR.auditOdds(g, Math.min(plan, L.total));
    let o = `<div class="card"><h3>🧼 Clean street cash ${UI.tipBtn('crCl')}</h3>${UI.tipLine('crCl', `Your businesses can hide some street cash in their sales each month. You lose a ${U.pct(K().launderFee)} fee and it is taxed as business income. The closer you get to the limit, the higher the audit odds. Businesses used for this can be seized if you are convicted.`)}
      <div class="tiles">${UI.tile('crL1', '🧼', m(L.total), 'Can clean/mo', '', 'Each business can hide a share of its sales: cash-heavy ones (car wash, food truck, cafe) more.')}${UI.tile('crL2', '🧾', U.pct(a, 1), 'Audit odds', a > 0.05 ? 'r' : a > 0.02 ? 'y' : 'g', `Fine ${U.pct(K().audit.fine)} of a year of laundering, heat +15, and ${U.pct(K().audit.seize)} odds a business is seized.`)}</div>
      ${L.rows.map((r) => UI.irow('crLb' + r.b.id, TG.CONFIG.businesses[r.b.type].icon, r.b.name, m(r.cap) + '/mo', `${U.pct(K().cashShare[r.b.type] || 0.1)} of its sales. If you are convicted: ${U.pct(CR.seizeOdds(g, r.b))} odds it is seized.`)).join('')}
      ${L.total ? '' : UI.irow('crLs', '🕴️', 'Shady money man', m(L.shady) + '/mo', `With no business he cleans up to ${m(L.shady)} a month for a ${U.pct(K().shadyFee)} fee.`)}
      <div class="row"><span>Clean each month</span><input type="number" id="crLa" value="${c.launder}" style="max-width:120px">${UI.btn('Save', 'crDo', 'launder', 'sm pri')}</div></div>`;
    o += `<div class="card"><h3>💵 Move cash to the street</h3><div class="row"><input type="number" id="crW" placeholder="$ amount">${UI.btn('Move', 'crDo', 'withdraw', 'sm')}${UI.tipBtn('crWd')}</div>${UI.tipLine('crWd', 'Normal cash → street cash. Over $10,000 adds heat. Moving it back costs the laundering fee, so there is no free loop.')}</div>`;
    return o;
  }

  // ---------- 🎯 one-off jobs ----------
  function jobs(g, c, CR) {
    const s = S(); const H = K().heists; const h = H[s.ht]; const p = CR.heistOdds(g, s.ht, s.hm, s.hg, s.hp); const cost = CR.heistCost(g, s.ht, s.hg, s.hp);
    const cd = Math.max(0, (c.cd.heist || 0) - g.month);
    let o = `<div class="card"><h3>🏦 Bank job ${UI.tipBtn('crBk')}</h3>${UI.tipLine('crBk', `Plan, pick gear and pros, then go. Success pays big street cash; failure often means arrest (${U.pct(K().heistArrest)}). Every job adds heat. Then you must lie low ${K().heistCooldown} months.`)}
      <div class="btns">${Object.entries(H).map(([k, v]) => UI.btn(`${v.icon} ${v.label}`, 'crH', 't|' + k, 'sm' + (s.ht === k ? ' pri' : ''))).join('')}</div>
      ${UI.irow('crHp', h.icon, h.label, `${m(h.pay[0])}-${m(h.pay[1])}`, `Needs ${h.crew} people (you count). Best possible odds ${U.pct(h.max)}. Heat +${h.heat}.`)}
      <div class="row" style="flex-wrap:wrap;gap:4px">🗓️ Plan ${[0, 1, 2, 3].map((x) => UI.btn(x + 'mo', 'crH', 'm|' + x, 'xs' + (s.hm === x ? ' pri' : ''))).join('')}${UI.tipBtn('crHm')}</div>${UI.tipLine('crHm', `Each month of planning adds ${U.pct(K().heistPlan.perMonth)} odds, but ${U.pct(K().heistPlan.leak)} a month that word leaks and it is off.`)}
      <div class="row" style="flex-wrap:wrap;gap:4px">🧰 Gear ${K().heistGear.map((x, i) => UI.btn(`${i ? m(x[0]) : 'none'}`, 'crH', 'g|' + i, 'xs' + (s.hg === i ? ' pri' : ''))).join('')}</div>
      <div class="row" style="flex-wrap:wrap;gap:4px">🧑‍💻 Pros ${['none', 'good', 'elite'].map((x, i) => UI.btn(x, 'crH', 'p|' + i, 'xs' + (s.hp === i ? ' pri' : ''))).join('')}${UI.tipBtn('crHpro')}</div>${UI.tipLine('crHpro', 'Hired specialists: good +7% odds for 5% of the expected take up front; elite +14% for 12%.')}
      <div class="tiles">${UI.tile('crHo', '🎯', U.pct(p), 'Odds', p > 0.5 ? 'g' : p > 0.3 ? 'y' : 'r', `Base ${U.pct(h.odds)} + planning + gear + pros + crew skill, cut if your crew is too small or heat is high.`)}${UI.tile('crHc', '💸', m(cost), 'Costs now', '', 'Gear and pros, paid from street cash even if it fails.')}</div>
      ${c.plan ? `<div class="banner">🗓️ Planning ${H[c.plan.t].label}: ${c.plan.left} months left</div>` : UI.btn(cd ? `Lie low ${cd} mo` : (s.hm ? '🗓️ Start planning' : '🚀 Go now'), 'crDo', 'heist', 'pri', !!cd)}</div>`;
    // sabotage
    o += `<div class="card"><h3>⚔️ Hit a rival business ${UI.tipBtn('crSb')}</h3>${UI.tipLine('crSb', 'Hurt a competitor of one of your businesses so more customers come to you for a while. They may sue, hit back or you may be arrested.')}`;
    if (!g.businesses.length) o += '<div class="mute">You need a business first.</div>';
    for (const b of g.businesses) for (const [k, v] of Object.entries(K().sabotage)) {
      const wait = Math.max(0, (c.cd['sab' + b.id] || 0) - g.month);
      o += UI.irow('crsb' + b.id + k, v.icon, `${v.label}: ${b.name}`, m(v.cost), `Works ${U.pct(v.ok)}: your demand x${v.boost} for ${v.months} months. Caught ${U.pct(v.caught)}: lawsuit ${m(v.suit[0])}-${m(v.suit[1])}, rep -10, heat +${v.heat}${v.arrest ? `, ${U.pct(v.arrest)} arrest` : ''}. They hit back ${U.pct(v.revenge)}.`, UI.btn(wait ? `${wait} mo` : 'Do it', 'crSab', b.id + '|' + k, 'xs', !!wait));
    }
    o += '</div>';
    const I = K().insider, T = K().theft;
    o += `<div class="card"><h3>🎲 Other jobs</h3>
      ${UI.irow('crIn', '📈', 'Insider trade', `${U.pct(I.odds)} right`, `Bet normal cash on a tip. Right: +${U.pct(I.up[0])}-${U.pct(I.up[1])}. Wrong: -${U.pct(I.down[0])}-${U.pct(I.down[1])}. Investigation odds ${U.pct(I.probe)} + more for bigger trades: fine ${I.fine}x the gain, heat +${I.heat}, ${U.pct(I.arrest)} arrest. Once every ${I.cooldown} months.`)}
      <div class="row"><input type="number" id="crIa" placeholder="$ stake" style="max-width:120px">${UI.btn('Trade', 'crDo', 'insider', 'sm')}</div>
      ${UI.irow('crTh', '🚗', 'Car theft run', `${U.pct(T.ok)} works`, `Pays ${m(T.pay[0])}-${m(T.pay[1])} per person (up to ${T.maxCrew}). ${U.pct(T.arrest)} odds someone is caught. Heat +${T.heat}. Once a month.`, UI.btn('Go', 'crDo', 'theft', 'xs'))}</div>`;
    return o;
  }

  // ---------- ⚖️ law ----------
  function law(g, c, CR) {
    let o = `<div class="card"><h3>⚖️ If you are caught ${UI.tipBtn('crLw')}</h3>${UI.tipLine('crLw', 'Arrests come from raids, failed jobs and snitches. Lawyers lower conviction odds and jail time; bribes lower raid odds. Nothing makes you safe.')}
      <div class="tiles">${UI.tile('crCv', '⚖️', U.pct(CR.convictOdds(g)), 'Conviction odds', '', `Never below ${U.pct(K().convictMin)}. A record raises it.`)}${UI.tile('crJm', '⛓️', CR.jailMonths(g) + ' mo', 'Jail if convicted', '', 'Grows with heat and your record; good lawyers shorten it. Businesses keep running with managers.')}${UI.tile('crRc', '📁', c.record, 'Record', '', 'Past convictions.')}</div></div>`;
    o += `<div class="card"><h3>👔 Lawyer (normal cash)</h3>${Object.entries(K().lawyers).map(([k, v]) => UI.irow('crly' + k, '👔', v.label, v.cost ? m(v.cost) + '/mo' : 'free', `Conviction odds -${U.pct(v.cut)}, jail time x${v.jail}.`, UI.btn(c.lawyer === k ? '✓' : 'Pick', 'crLaw', 'l|' + k, 'xs' + (c.lawyer === k ? ' pri' : '')))).join('')}</div>`;
    o += `<div class="card"><h3>💸 Bribes (street cash)</h3>${Object.entries(K().bribes).map(([k, v]) => UI.irow('crbr' + k, '💸', v.label, v.cost ? m(v.cost) + '/mo' : 'none', `Raid odds -${U.pct(K().raid.bribe * v.lvl)}${v.judge ? `, conviction odds -${U.pct(v.judge)}` : ''}. Scandal odds ${U.pct(v.lvl ? K().bribeScandal * (1 + v.lvl * 2) : 0, 1)} a month.`, UI.btn(c.bribe === k ? '✓' : 'Pick', 'crLaw', 'b|' + k, 'xs' + (c.bribe === k ? ' pri' : '')))).join('')}</div>`;
    if (g.businesses.length) o += `<div class="card"><h3>🏢 Could be seized</h3>${g.businesses.map((b) => UI.irow('crsz' + b.id, '🏢', b.name, U.pct(CR.seizeOdds(g, b)), 'Odds the state takes it if you are convicted. Grows with how much dirty money went through it (fades over a year).')).join('')}</div>`;
    return o;
  }

  // ---------- details ----------
  UI.A.crDetail = (k) => {
    const g = TG.G, c = TG.CR.ensure(g), CR = TG.CR;
    if (k === 'crew') return UI.modal('👥 Crew', `<div class="card">${c.crew.length ? `<table class="tbl"><tr><th></th><th>Name</th><th>Skill</th><th>Loyal</th><th>Does</th><th>Wage</th></tr>${c.crew.map((e) => `<tr><td>${K().crew[e.role].icon}</td><td>${esc(e.name)}</td><td>${Math.round(e.skill)}</td><td>${Math.round(e.loyalty)}</td><td>${N(CR.capOf(e))}</td><td>${m(e.wage)}</td></tr>`).join('')}</table>` : 'Nobody yet.'}</div>`);
    if (k === 'stash') return UI.modal('📦 Stash', `<div class="card">${Object.entries(K().products).map(([p, P]) => UI.irow('crsd' + p, P.icon, P.label, N(c.stock[p]), `Worth about ${m(c.stock[p] * CR.wholesale(g, p))} at wholesale.`)).join('')}${UI.irow('crsdr', '📦', 'Room', `${N(CR.units(g))}/${N(CR.room(g))}`, '')}</div>`);
    if (k === 'log') return UI.modal('📜 Crime log', `<div class="card">${g.log.filter((e) => String(e.text).startsWith('🕶️')).slice(-40).reverse().map((e) => `<div class="small"><b>${U.dateStr(e.m)}</b> ${UI.ev(e)}</div>`).join('') || 'Nothing yet.'}</div>`);
  };

  // ---------- actions ----------
  const res = (r, ok) => { if (r && r.ok === false) UI.toast(r.msg || 'Not possible.', true); else if (ok) UI.toast(typeof ok === 'function' ? ok(r) : ok, r && r.bad); UI.refresh(); };
  UI.A.crSup = (k) => { S().sup = k; UI.refresh(); };
  UI.A.crAsk = (arg) => { const g = TG.G; const [p, d] = arg.split('|'); if (d === 'm') TG.CR.setAsk(g, p, null); else TG.CR.setAsk(g, p, TG.CR.price(g, p) * (d === '+' ? 1.05 : 0.95)); UI.refresh(); };
  UI.A.crBuy = (p) => { const r = TG.CR.buy(TG.G, S().sup, p, UI.num('crQ' + p, 0)); res(r, (x) => (x.out === 'ok' ? `Got ${N(x.got)} for ${m(x.cost)}` : x.out === 'short' ? `Short order: got ${N(x.got)} for ${m(x.cost)}` : x.out === 'sting' ? 'It was a police sting!' : 'They never showed.')); };
  UI.A.crDump = (p) => res(TG.CR.dump(TG.G, p, UI.num('crQ' + p, 0)), (x) => `Sold back for ${m(x.v)}`);
  UI.A.crHire = (id) => res(TG.CR.hire(TG.G, id), 'Hired.');
  UI.A.crCrew = (arg) => { const [id, a] = arg.split('|'); const g = TG.G; if (a === 'fire') { TG.CR.fire(g, id); return res({}, 'Let go.'); } const r = a === 'train' ? TG.CR.train(g, id) : TG.CR.bonus(g, id); res(r, (x) => (x.spam ? 'Too much this month: it backfired (loyalty down).' : a === 'train' ? `Skill +${x.gain}` : 'Loyalty +10')); };
  UI.A.crSelf = () => { const c = TG.CR.ensure(TG.G); c.selfDeal = !c.selfDeal; UI.refresh(); };
  UI.A.crGear = (k) => res(TG.CR.buyGear(TG.G, k), 'Bought.');
  UI.A.crSell = (id) => res(TG.CR.sellGear(TG.G, id), (x) => `Sold for ${m(x.v)}`);
  UI.A.crH = (arg) => { const [k, v] = arg.split('|'); const s = S(); if (k === 't') s.ht = v; else s['h' + k] = Number(v); UI.refresh(); };
  UI.A.crSab = (arg) => { const [id, k] = arg.split('|'); res(TG.CR.sabotage(TG.G, id, k), (x) => (x.worked ? 'It worked.' : 'It did not work.')); };
  UI.A.crLaw = (arg) => { const [k, v] = arg.split('|'); const c = TG.CR.ensure(TG.G); if (k === 'l') c.lawyer = v; else c.bribe = v; UI.refresh(); };
  UI.A.crDo = (a) => {
    const g = TG.G, CR = TG.CR, c = CR.ensure(g), s = S();
    if (a === 'withdraw') return res(CR.withdraw(g, UI.num('crW', 0)), (x) => `Moved.${x.heat ? ` Heat +${x.heat.toFixed(1)}` : ''}`);
    if (a === 'expand') return res(CR.expand(g), (x) => (x.won ? 'You took a new block!' : `Lost the fight (${U.pct(x.p)} odds).`));
    if (a === 'racket') { c.racket = !c.racket; return res({}, c.racket ? 'Racket started.' : 'Racket stopped.'); }
    if (a === 'launder') { c.launder = Math.max(0, Math.round(UI.num('crLa', 0))); return res({}, 'Saved.'); }
    if (a === 'heist') return res(CR.heist(g, s.ht, s.hm, s.hg, s.hp), (x) => (x.planned ? 'Planning started.' : x.won ? `It worked: ${m(x.v)}!` : x.partial ? `Botched: only ${m(x.v)}.` : 'It failed.'));
    if (a === 'insider') return res(CR.insider(g, UI.num('crIa', 0)), (x) => (x.gain >= 0 ? `Made ${m(x.gain)}` : `Lost ${m(-x.gain)}`));
    if (a === 'theft') return res(CR.theft(g), (x) => (x.v ? `Got ${m(x.v)}` : 'Nothing this time.'));
  };
})();

</script>
<script>/* js/ui/ui-v6.js */
/* ui-v6.js - v6 screens: Industry Outlook, credit score + loan applications, financing preview,
   rent setting + tenant search (one applicant at a time), the "do it yourself" list, and the business Reports tab. */
(function () {
  const TG = globalThis.TG; const U = TG.U; const UI = TG.UI; const esc = UI.esc, m = UI.m;
  const N = (x) => Math.round(x || 0).toLocaleString();
  const after = (r, msg) => { UI.res(r, msg); UI.refresh(); };
  const MK = { good: ['✅', 'good'], ok: ['⚠️', 'warn'], bad: ['❌', 'bad'] };
  const mark = (x) => `<span class="${MK[x][1]}">${MK[x][0]}</span>`;
  const biz = () => TG.B.get(TG.G, UI.bizId);

  // ================= 📈 INDUSTRY OUTLOOK =================
  UI.screens.ind = () => {
    const g = TG.G; const L = TG.IN.list(g); const mine = new Set(g.businesses.map((b) => TG.IN.ofBiz(b)));
    let o = `<div class="row sp"><h2>📈 Industry Outlook</h2>${UI.btn('◀ Back', 'go', 'home', 'sm')}</div>
      <div class="card"><div class="mute">Every industry has good and bad years. Booms raise demand and prices; slumps cut them. They turn slowly and partly follow the economy, but nobody can time them exactly: the arrow shows where things are heading now, not where they will be in two years. Tap a row for the reasons.</div></div>`;
    L.sort((a, c) => (mine.has(c.k) - mine.has(a.k)) || c.s.x - a.s.x);
    o += `<div class="card">`;
    for (const it of L) {
      const k = 'ind' + it.k; const n = it.s.news[0];
      o += UI.irow(k, it.d.icon, it.d.label + (mine.has(it.k) ? ' ⭐' : ''), `${UI.pill(it.st.label, it.st.tone)} ${TG.IN.arrow(it.s)}`,
        `${it.d.label} is ${it.st.label.toLowerCase()} and ${TG.IN.dir(it.s)}. Customers x${it.demand.toFixed(2)}, selling prices x${it.price.toFixed(2)}, costs x${it.cost.toFixed(2)}.${n ? ' Latest: ' + n.why + '.' : ''} Businesses: ${it.d.biz.map((t) => TG.CONFIG.businesses[t].name).join(', ')}.`,
        null, `customers x${it.demand.toFixed(2)} · prices x${it.price.toFixed(2)} · costs x${it.cost.toFixed(2)}`);
      if (UI.S.tips[k]) o += `<div style="margin:0 0 8px 48px">${UI.spark(it.s.hist.slice(-60), it.s.x >= 0 ? '#16a34a' : '#dc2626')}${it.s.news.map((x) => `<div class="small"><span class="mute">${U.dateStr(x.m)}</span> <span class="${x.tone}">${esc(x.text)}</span></div>`).join('')}</div>`;
    }
    return o + `</div><div class="mute">⭐ = you are in this industry.</div>`;
  };

  // ================= 🏦 CREDIT SCORE + LOAN APPLICATIONS =================
  const CRD = () => TG.CREDIT;
  UI.creditCards = (g) => {
    const sc = CRD().score(g); const s = sc.score; const C = TG.CONFIG, F = TG.F;
    let o = `<div class="card"><h3>🏦 Credit score ${UI.tipBtn('crs')}</h3>${UI.tipLine('crs', 'Worked out every month from your record. Paying on time (once a month counts), using little of your credit line, not owing too much, a long history and few applications all help. Missed payments, defaults and bankruptcy hurt for years.')}
      <div class="row sp"><div style="font-size:2em;font-weight:700" class="${CRD().tone(s)}">${s}</div>${UI.pill(CRD().label(s), CRD().tone(s))}</div>${UI.bar(s - 300, 550)}`;
    for (const p of sc.parts) o += UI.irow('crp' + p.k, p.icon, p.label, `${mark(p.mark)} ${p.max ? `${Math.round(p.pts)}/${p.max}` : Math.round(p.pts)}`, p.why);
    o += `<div class="mute">300 = worst, 850 = best. Tap a line to see why.</div></div>`;
    // apply
    const S = UI.S.ln = UI.S.ln || { type: 'business', amount: 50000, term: null };
    const terms = C.credit.terms[S.type] || [C.finance.loans[S.type].term]; if (S.term == null || terms.indexOf(S.term) < 0) S.term = S.type === 'loc' ? 0 : C.finance.loans[S.type].term;
    const q = CRD().quote(g, S.type, S.amount, { term: S.term });
    o += `<div class="card" id="loanCard"><h3>📝 Apply for a loan ${UI.tipBtn('lnap')}</h3>${UI.tipLine('lnap', 'Pick a type, amount and length. You see the odds and what helps or hurts BEFORE you apply. It is never a sure thing. Every application (yes or no) counts as a recent application on your score. Every loan has a small fee, so borrowing and paying back right away always loses money.')}
      <div class="kv"><span>Type</span><span><select data-change="lnT">${['business', 'equipment', 'loc', 'emergency'].map((t) => `<option value="${t}"${S.type === t ? ' selected' : ''}>${esc(C.finance.loans[t].label)}</option>`).join('')}</select></span>
      <span>Amount</span><span><input type="number" id="lnAmt" value="${S.amount}" min="1000" step="1000" aria-label="amount"></span>
      ${S.type !== 'loc' ? `<span>Length</span><span><select data-change="lnTerm">${terms.map((t) => `<option value="${t}"${S.term === t ? ' selected' : ''}>${t >= 24 ? t / 12 + ' years' : t + ' months'}</option>`).join('')}</select></span>` : ''}</div>
      <div class="btns">${UI.btn('🔍 Check my odds', 'lnCheck', null, 'sm')}</div>
      <div class="mute">Mortgages are applied for when you buy a building (you see the payment first).</div>`;
    o += `<div class="ev ${q.block ? 'bad' : q.odds >= 0.7 ? 'good' : q.odds >= 0.4 ? 'warn' : 'bad'}"><b>Approval odds: ${q.block ? 'no chance' : U.pct(q.odds)}</b>${q.block ? `<div class="small">${esc(q.block)}</div>` : ''}
      <div class="small">Rate ${U.pct(q.rate, 1)} · ${S.type === 'loc' ? `minimum payment ${m(q.pay)}/mo when fully used` : `${m(q.pay)}/mo for ${S.term} months`} · fee ${m(q.fee)}</div></div>
      <table>${q.factors.map((f) => `<tr><td>${mark(f.mark)} ${esc(f.label)}<div class="mute">${esc(f.why)}</div></td><td class="n">${esc(f.val)}</td></tr>`).join('')}</table>
      <div class="btns">${UI.btn(`📝 Apply (${q.block ? 'blocked' : U.pct(q.odds) + ' odds'})`, 'lnApply', null, 'sm pri', !!q.block)}</div></div>`;
    // credit line
    const lim = F.locLimit(g);
    o += `<div class="card"><h3>💳 Credit line</h3><div class="kv"><span>Limit</span><span>${lim ? m(lim) : '<span class="mute">none: apply above</span>'}</span><span>Owed</span><span>${m(g.loc.balance)}</span><span>Used</span><span>${lim ? U.pct(g.loc.balance / lim) : '–'}</span><span>Rate</span><span>~${U.pct(F.rateFor(g, 'loc'), 1)}</span></div>
      ${lim ? `<div class="row" style="margin-top:6px"><input type="number" id="locAmt" placeholder="amount">${UI.btn('Draw', 'loc', 'draw', 'sm')}${UI.btn('Repay', 'loc', 'repay', 'sm')}</div>` : ''}
      <div class="mute">Using under 30% of the line keeps your score healthy. Only an accountant or CEO draws on it for you when cash runs short.</div></div>`;
    return o;
  };
  UI.A.lnT = (v) => { UI.S.ln.type = v; UI.S.ln.term = null; UI.S.ln.amount = UI.num('lnAmt', UI.S.ln.amount); UI.refresh(); };
  UI.A.lnTerm = (v) => { UI.S.ln.term = Number(v); UI.S.ln.amount = UI.num('lnAmt', UI.S.ln.amount); UI.refresh(); };
  UI.A.lnCheck = () => { UI.S.ln.amount = Math.max(0, Math.round(UI.num('lnAmt', 0))); UI.refresh(); };
  UI.A.lnApply = () => {
    const g = TG.G, S = UI.S.ln; S.amount = Math.max(0, Math.round(UI.num('lnAmt', S.amount)));
    const r = CRD().apply(g, S.type, S.amount, { term: S.term || undefined });
    if (r.ok) UI.toast(S.type === 'loc' ? `Approved! Credit line now ${m(r.limit)} (fee ${m(r.quote.fee)}).` : `Approved! ${m(S.amount)} at ${U.pct(r.quote.rate, 1)} (fee ${m(r.quote.fee)}).`);
    else UI.toast(r.msg, true);
    UI.refresh();
  };

  // ================= 🏠 FINANCING PREVIEW (before you buy with a mortgage) =================
  // shows: down payment, rate from YOUR score, length, principal & interest, estimated taxes + insurance, approval odds
  UI.finPreview = (g, price, ltv, extra, term) => {
    const loan = Math.round(price * ltv), down = price - loan; const q = CRD().quote(g, 'mortgage', loan, { term, ltv, asset: price, extraIncome: extra.rent || 0 });
    const tax = price * (extra.taxPct || 0.012) / 12, ins = price * (extra.insPct || 0.00035);
    const fees = Math.round(price * TG.CONFIG.property.buyCostPct);
    return { loan, down, fees, q, tax, ins, total: q.pay + tax + ins, cash: down + fees + q.fee };
  };
  const finHtml = (g, p, act, id) => {
    const terms = TG.CONFIG.credit.terms.mortgage;
    const row = (a, b) => `<tr><td>${a}</td><td class="n">${b}</td></tr>`;
    return `<div class="card"><h3>🏦 Your monthly payment</h3><table>
      ${row('Price', m(p.loan + p.down))}${row('Down payment', `${m(p.down)} (${U.pct(p.down / (p.loan + p.down))})`)}${row('Loan', m(p.loan))}
      ${row('Length', `<select data-change="finTerm" data-id="${id}" data-act2="${act}">${terms.map((t) => `<option value="${t}"${p.q.term === t ? ' selected' : ''}>${t / 12} years</option>`).join('')}</select>`)}
      ${row(`Rate <span class="mute">(score ${p.q.score})</span>`, U.pct(p.q.rate, 2))}${row('Loan payment', `<b>${m(p.q.pay)}/mo</b>`)}${row('Property tax', `${m(p.tax)}/mo`)}${row('Insurance', `${m(p.ins)}/mo`)}
      ${row('<b>Total each month</b>', `<b>${m(p.total)}/mo</b>`)}${row('<b>Cash today</b>', `<b>${m(p.cash)}</b>`)}</table>
      <div class="mute">Cash today = down payment + closing ${m(p.fees)} + loan fee ${m(p.q.fee)}. Tax and insurance are estimates.</div>
      <div class="ev ${p.q.block ? 'bad' : p.q.odds >= 0.7 ? 'good' : p.q.odds >= 0.4 ? 'warn' : 'bad'}"><b>Approval odds: ${p.q.block ? 'no chance' : U.pct(p.q.odds)}</b>${p.q.block ? ` · ${esc(p.q.block)}` : ''}</div>
      <table>${p.q.factors.map((f) => `<tr><td>${mark(f.mark)} ${esc(f.label)}</td><td class="n">${esc(f.val)}</td></tr>`).join('')}</table>
      <div class="mute">Applying counts as a loan application even if the bank says no.</div></div>`;
  };
  UI.A.finTerm = (v, el) => { UI.S.finTerm = Number(v); UI.A[el.dataset.act2](el.dataset.id); };
  // real estate listing
  UI.A.reFin = (id) => {
    const g = TG.G; const l = g.re.listings.find((x) => x.id === id); if (!l) return;
    const k = TG.CONFIG.realEstate.kinds[l.kind]; const ltv = k.commercial ? 0.75 : 0.8; const rc = TG.CONFIG.realEstate;
    const p = UI.finPreview(g, l.price, ltv, { rent: TG.RE.estRent(g, l), taxPct: rc.propertyTax, insPct: rc.insurancePct }, UI.S.finTerm || 300);
    const rent = TG.RE.estRent(g, l);
    UI.modal(`🏠 ${esc(l.name)}`, finHtml(g, p, 'reFin', id) + `<div class="card"><div class="kv kvl"><span>Rent if ${l.units ? 'rented (est.)' : '—'}</span><span>${l.units ? m(rent) + '/mo' : 'no rent (land)'}</span></div></div>
      <div class="btns">${UI.btn('📝 Apply & buy', 'reFinGo', id, 'sm pri', !!p.q.block || g.cash < p.cash)}${UI.btn('Cancel', 'closeModal', null, 'sm')}</div>`);
  };
  UI.A.reFinGo = (id) => { const r = TG.RE.buy(TG.G, id, true, UI.S.finTerm || 300); UI.closeModal(); after(r && r.ok === false ? r : { ok: true }, 'Approved and bought.'); };
  // business property listing
  UI.A.propFin = (id) => {
    const g = TG.G; const p0 = g.listings.find((x) => x.id === id); if (!p0) return; const C = TG.CONFIG;
    const p = UI.finPreview(g, p0.price, 1 - C.property.mortgageDown, { taxPct: 0.012, insPct: C.finance.insurance.property.val }, UI.S.finTerm || C.finance.loans.mortgage.term);
    UI.modal(`🏢 ${esc(p0.name || 'Property')}`, finHtml(g, p, 'propFin', id) + `<div class="btns">${UI.btn('📝 Apply & buy', 'propFinGo', id, 'sm pri', !!p.q.block || g.cash < p.cash)}${UI.btn('Cancel', 'closeModal', null, 'sm')}</div>`);
  };
  UI.A.propFinGo = (id) => { const r = TG.P.acquire(TG.G, id, 'mortgage', UI.S.finTerm); UI.closeModal(); after(r, 'Approved and bought.'); };

  // ================= 🔑 RENT + TENANT SEARCH =================
  UI.rentRows = (g, h) => {
    const RE = TG.RE, T = TG.CONFIG.tenants; if (!h.units || h.kind === 'land') return '';
    const mr = RE.marketRent(g, h), ask = RE.askRent(g, h), vac = RE.vacant(h); const pv = RE.poolPreview(g, h); const cur = RE.current(g, h);
    let o = `<div class="row small" style="margin-top:4px"><span>Your rent</span><select data-change="reRent" data-h="${h.id}">${T.rentSteps.map((r) => `<option value="${r}"${Math.abs((h.rentR || 1) - r) < 0.001 ? ' selected' : ''}>${m(mr * r)} (${r === 1 ? 'market' : Math.round(r * 100) + '%'})</option>`).join('')}</select><span class="mute">market ${m(mr)}/unit</span></div>`;
    o += `<div class="small">${(h.rentR || 1) > 1.08 ? '<span class="warn">Above market: fewer, riskier applicants and longer empty months.</span>' : (h.rentR || 1) < 0.95 ? '<span class="warn">Below market: lots of great applicants, but you leave money on the table.</span>' : 'Near market: a fair number of decent applicants.'}</div>`;
    if (vac && h.mode === 'rent' && !g.re.manager) o += `<div class="small warn">🔑 ${vac} empty unit${vac > 1 ? 's' : ''}: no property manager, so each one needs its own tenant search (below). Expect about ${Math.max(0, Math.round(pv.n))} applicant(s) per search, mostly ${pv.label}.</div>`;
    void cur;
    return o;
  };
  UI.A.reRent = (v, el) => { const h = TG.G.re.holdings.find((x) => x.id === el.dataset.h); if (h) h.rentR = Number(v); UI.refresh(); };
  // v7: every unit has its own search; you see one applicant at a time and cannot go back
  UI.A.reSearch = (arg) => {
    const g = TG.G, RE = TG.RE; const [hid, us] = String(arg).split('|'); const h = g.re.holdings.find((x) => x.id === hid); if (!h) return;
    const u = RE.pickUnit(g, h, us != null && us !== '' ? Number(us) : null, true); if (u < 0 || h.tenants[u]) { UI.closeModal(); UI.refresh(); return UI.toast('That unit is rented.'); }
    const a = RE.current(g, h, u); const tag = h.units > 1 ? ` · unit ${u + 1}` : ''; const key = `${hid}|${u}`;
    if (!a) {
      const pv = RE.poolPreview(g, h); const s0 = h.searches[u]; const had = s0 && s0.m >= g.month - TG.CONFIG.tenants.search.expires;
      return UI.modal(`🔎 Tenant search${esc(tag)}`, `<div class="card">${had ? '<div class="ev warn"><b>No applicants left.</b> Pay for another search to see more.</div>' : ''}
        <div class="kv kvl"><span>Home</span><span>${esc(h.name)}${esc(tag)}</span><span>Rent you ask</span><span>${m(RE.askRent(g, h))} (${Math.round((h.rentR || 1) * 100)}% of market)</span><span>Search cost</span><span>${m(RE.searchCost(g, h))}</span><span>Expect</span><span>about ${Math.max(0, Math.round(pv.n))} applicant(s), mostly ${pv.label}</span></div>
        <div class="mute">One tenant per home. This search is for this unit only. Ads, showings and background checks. You see one applicant at a time: accept or decline. Declined applicants are gone for good.</div>
        ${RE.unitIssues(h, u).length ? '<div class="ev bad">Fix the repair in this unit first.</div>' : ''}
        <div class="btns">${UI.btn(`💵 Pay ${m(RE.searchCost(g, h))} and search`, 'reSearchGo', key, 'sm pri', g.cash < RE.searchCost(g, h) || RE.unitIssues(h, u).length > 0)}${UI.btn('Close', 'closeModal', null, 'sm')}</div></div>`);
    }
    const s = h.searches[u]; const left = s.list.length - s.i; const marks = RE.applicantMarks(a);
    UI.modal(`👤 Applicant${esc(tag)}`, `<div class="card"><div class="row sp"><b>${esc(a.name)}</b><span class="mute">${left} left for this unit</span></div>
      <table>${marks.map((x) => `<tr><td>${mark(x.mark)} ${esc(x.label)}</td><td class="n">${esc(x.val)}</td></tr>`).join('')}</table>
      <div class="small">Rent ${m(s.rent)}/mo. Rule of thumb: income at least 3x rent, no evictions, credit 650+.</div>
      <div class="mute">These are clues, not guarantees: good tenants can still lose a job, and risky ones sometimes pay fine.</div>
      <div class="btns">${UI.btn('✅ Accept', 'reDecide', key + '|1', 'sm goodb')}${UI.btn('❌ Decline', 'reDecide', key + '|0', 'sm badb')}${UI.btn('Close', 'closeModal', null, 'sm')}</div></div>`);
  };
  UI.A.reSearchGo = (key) => { const [hid, u] = String(key).split('|'); const r = TG.RE.search(TG.G, hid, null, u != null ? Number(u) : null); if (!r.ok) return UI.toast(r.msg, true); UI.toast(r.n ? `${r.n} applicant(s) came.` : 'Nobody applied at this rent.', !r.n); UI.A.reSearch(`${hid}|${r.unit}`); UI.refresh(); };
  UI.A.reDecide = (arg) => {
    const [hid, u, acc] = arg.split('|'); const g = TG.G; const r = TG.RE.decide(g, hid, acc === '1', Number(u)); if (!r.ok) return UI.toast(r.msg || 'Not possible.', true);
    UI.toast(acc === '1' ? `Signed a lease with ${r.tenant.name}.` : 'Declined.');
    if (acc === '1') UI.closeModal(); else UI.A.reSearch(`${hid}|${u}`);
    UI.refresh();
  };
  // ================= ✋ "NO MANAGER: YOU MUST DO THIS YOURSELF" =================
  UI.todoCard = (g, b) => {
    const D = TG.D, out = [];
    const broken = b.equip.filter((x) => x.broken && x.broken !== 'destroyed');
    if (broken.length && !TG.E.hasMech(b)) out.push(['🔧', `${broken.length} broken machine${broken.length > 1 ? 's' : ''}: no mechanic, so they stay broken until you tap Fix (Gear tab).`, 'tab', 'biz:equip']);
    if (b.stock && TG.ST.def(b) && !D.handler(g, b, 'stock')) { const q = TG.ST.suggest(b, g); if (q > 0) out.push(['📦', `Buy supplies: about ${N(q)} more for next month. No manager reorders for you.`, null, null]); }
    if (b.farm && b.farm.areas && !D.handler(g, b, 'farm')) {
      const A = b.farm.areas, M = TG.M;
      if (A.cows.herd) { const fc = M.herdForecast(g, b); if ((b.farm.feed || 0) < fc.buy * 1.5) out.push(['🌽', `Feed: ${N(b.farm.feed || 0)} t in storage, cows need about ${N(fc.buy)} t next month.`, null, null]); if (A.cows.st.ready >= 1) out.push(['🥩', `${N(A.cows.st.ready)} cattle are market-ready: sell them.`, null, null]); if (A.cows.st.bull < 0.5 && A.cows.herd > 5) out.push(['🐃', 'No bull: very few calves. Buy one (See all cows).', 'detail', 'stock']); }
      if (A.crops.acres) { const e = M.areaE(b, 'crops'); const nm = U.moy(g.month + 1); if (e.plant.indexOf(nm) >= 0 && (b.farm.seeds || 0) < A.crops.acres / e.plant.length) out.push(['🌱', `Planting next month: buy seed (have ${N(b.farm.seeds)} acres' worth).`, 'tab', 'biz:model']); }
      for (const k of ['crops', 'orchard']) if (A[k].acres && A[k].soil < 0.5) out.push(['🧪', `${M.areaLabel(k)} soil is ${U.pct(A[k].soil)}: nobody sprays unless you do.`, 'tab', 'biz:model']);
    }
    if (!out.length) return '';
    return `<div class="card"><h3>✋ You must do this yourself</h3><div class="mute">No manager for these jobs. Hire a GM / ops manager / mechanic to hand them off.</div>${out.map(([i, t, a, arg], n) => `<div class="irow"><span class="ic">${i}</span><span class="lb">${esc(t)}</span>${a ? UI.btn('Go', a, arg, 'xs') : ''}</div>`).join('')}</div>`;
  };

  // ================= 📊 REPORTS TAB (results and forecasts live here; the Now tab is for doing) =================
  UI.salesSummary = (g, b) => {
    const lc = UI.lc(b); if (lc.cap == null || b.proj || b.fr || b.farm || b.tech || b.factory) return '';
    return UI.irow('ss' + b.id, '🛒', 'Sold last month', `${N(lc.served)}/${N(lc.cap)}`, `Customers wanted ${N(lc.demand)}. Full sales detail is in 📊 Reports.`, UI.btn('📊', 'tab', 'biz:rep', 'xs'), `wanted ${N(lc.demand)}`);
  };
  UI.reportsTab = (g, b) => {
    const h = b.hist, last = h[h.length - 1];
    let o = UI.flowCard(g, b) + UI.forecastCard(g, b) + UI.salesCard(g, b);
    const risks = TG.B.topRisks(g, b).slice(0, 8);
    o += `<div class="card"><h3>⚠️ Risks next month</h3><table>${risks.map((r) => `<tr><td>${esc(r.label)}<div class="mute">${esc(r.why)}</div></td><td class="n">${UI.risk(r.p)}</td></tr>`).join('') || '<tr><td class="mute">Nothing notable.</td></tr>'}</table></div>`;
    if (last) o += `<div class="card"><details><summary>🧾 Money in & out</summary><table>${Object.entries(last.lines || {}).sort((a, c) => Math.abs(c[1]) - Math.abs(a[1])).map(([k, v]) => `<tr><td>${esc(k)}</td><td class="n ${v >= 0 ? 'good' : 'bad'}">${v >= 0 ? '+' : '-'}${m(Math.abs(v))}</td></tr>`).join('')}</table>${h.length > 2 ? UI.spark(h.slice(-36).map((x) => x.profit), '#2563eb') : ''}</details></div>`;
    const ev = g.log.filter((e) => e.bizId === b.id || e.biz === b.name).slice(-12).reverse();
    if (ev.length) o += `<div class="card"><details><summary>📰 What happened</summary>${ev.map((e) => `<div class="small"><span class="mute">${U.dateStr(e.m)}</span> ${e.type === 'decision' ? `<b>${esc(e.by)}</b>: ` : ''}${esc(e.text)}</div>`).join('')}</details></div>`;
    return o;
  };
  void biz;
})();

</script>
<script>/* js/ui/ui-v7.js */
/* ui-v7.js - v7 screens: the money report (money in, expense groups, what you are left with, who made or lost money),
   skip totals with a month-by-month view, the loans screen with amortization, rental units, closed shops and HR hiring. */
(function () {
  const TG = globalThis.TG; const U = TG.U; const UI = TG.UI; const esc = UI.esc, m = UI.m;
  const N = (x) => Math.round(x || 0).toLocaleString();
  const LG = () => TG.LG;
  const sg = (x) => UI.signed(Math.round(x));
  const plus = (x) => `<span class="good">+${m(Math.round(x))}</span>`, minus = (x) => `<span class="bad">−${m(Math.round(x))}</span>`;
  const grp = (icon, label, val, inner, open) => `<details class="grp"${open ? ' open' : ''}><summary><span class="gl"><span class="car"></span>${icon} ${esc(label)}</span><span class="gv">${val}</span></summary><div class="in1">${inner}</div></details>`;
  const lineRows = (lines, sign) => `<table>${Object.entries(lines).sort((a, b) => b[1] - a[1]).filter(([, v]) => Math.abs(v) >= 0.5).map(([k, v]) => `<tr><td>${esc(k)}${LG().NOTE[k] ? ` <span class="mute">(${esc(LG().NOTE[k])})</span>` : ''}</td><td class="n">${sign > 0 ? plus(v) : minus(v)}</td></tr>`).join('')}</table>`;

  // ================= 💰 THE MONEY REPORT =================
  UI.moneyHtml = (M, opts) => {
    opts = opts || {}; if (!M) return '';
    const L = LG(); let o = '';
    o += `<div class="card"><h3>🟰 You are left with ${sg(M.net)}</h3><div class="row sp"><div><div class="mute">💰 In</div><div class="big good">+${m(M.tin)}</div></div><div><div class="mute">💸 Out</div><div class="big bad">−${m(M.tout)}</div></div><div><div class="mute">💵 Cash now</div><div class="big">${m(M.cashEnd)}</div></div></div>
      <div class="mute">${esc(opts.span || 'This month')}: every dollar in and out, including machines you bought, loan payments and money you moved between months.</div></div>`;
    // money in
    let inn = ''; for (const [k, ic, lb] of L.IN) { const G = M.inG[k]; if (G.t >= 0.5) inn += grp(ic, lb, plus(G.t), lineRows(G.lines, 1)); }
    o += `<div class="card"><h3>💰 Money in</h3>${inn || '<div class="mute">No money came in.</div>'}<div class="tot"><span>Total in</span><span class="good">+${m(M.tin)}</span></div></div>`;
    let out = ''; for (const [k, ic, lb] of L.OUT) { const G = M.outG[k]; if (G.t >= 0.5) out += grp(ic, lb, minus(G.t), lineRows(G.lines, -1)); }
    o += `<div class="card"><h3>💸 Money out</h3>${out || '<div class="mute">No money went out.</div>'}<div class="tot"><span>Total out</span><span class="bad">−${m(M.tout)}</span></div></div>`;
    o += `<div class="card"><h3>🟰 Bottom line</h3><table><tr><td>💵 Cash at the start</td><td class="n">${m(M.cashStart)}</td></tr><tr><td>💰 Money in</td><td class="n">${plus(M.tin)}</td></tr><tr><td>💸 Money out</td><td class="n">${minus(M.tout)}</td></tr>
      <tr><td><b>What you are left with</b></td><td class="n"><b>${sg(M.net)}</b></td></tr><tr><td><b>💵 Cash at the end</b></td><td class="n"><b>${m(M.cashEnd)}</b></td></tr></table>
      <div class="mute">${Math.abs(M.diff) < 1 ? '✔ Matches your real cash change.' : `⚠️ ${m(M.diff)} not explained.`}</div></div>`;
    o += UI.whoHtml(M, opts);
    return o;
  };
  // who made or lost money: every business, every property (grouped), investments, crime, you. Adds up to the bottom line.
  const ownerInner = (ow) => {
    const L = LG(); let t = '';
    for (const [k, ic, lb] of L.IN) { const v = ow.groups['+' + k]; if (v >= 0.5) t += `<tr><td>${ic} ${esc(lb)}</td><td class="n">${plus(v)}</td></tr>`; }
    for (const [k, ic, lb] of L.OUT) { const v = ow.groups['-' + k]; if (v >= 0.5) t += `<tr><td>${ic} ${esc(lb)}</td><td class="n">${minus(v)}</td></tr>`; }
    return `<table>${t}</table>${ow.borrowed >= 0.5 ? `<div class="mute">Includes ${m(ow.borrowed)} of borrowed money.</div>` : ''}`;
  };
  UI.whoHtml = (M, opts) => {
    const by = {}; for (const ow of M.owners) (by[ow.grp] = by[ow.grp] || []).push(ow);
    let o = '';
    for (const ow of (by.biz || []).concat(by.prop || [])) o += grp(ow.i, ow.n, sg(ow.net), ownerInner(ow));
    if (by.re) { const t = U.sum(by.re, (x) => x.net); o += grp('🏘️', `Real estate (${by.re.filter((x) => x.k !== 'rePort').length} properties)`, sg(t), by.re.map((ow) => grp(ow.i, ow.n, sg(ow.net), ownerInner(ow))).join(''), opts.openRE); }
    for (const ow of (by.inv || []).concat(by.crime || [], by.you || [])) o += grp(ow.i, ow.n, sg(ow.net), ownerInner(ow));
    return `<div class="card"><h3>📊 Who made or lost money ${UI.tipBtn('who')}</h3>${UI.tipLine('who', 'Each line counts ALL its real costs: machines bought, repairs and damage, its loan payments, upkeep. Red = it cost you money. The lines add up exactly to what you are left with.')}
      ${o || '<div class="mute">Nothing yet.</div>'}<div class="tot"><span>= Left with</span><span>${sg(M.net)}</span></div></div>`;
  };

  // monthly report: money first, then the why for each business, then events
  UI.reportHtml = (r) => {
    let o = '';
    if (r.money) o += UI.moneyHtml(r.money, { span: r.date });
    else o += `<div class="card"><div class="row sp"><div><div class="mute">Profit (after tax)</div><div class="big">${UI.signed(r.profit)}</div></div><div><div class="mute">Cash</div><div class="big">${m(r.cashEnd)}</div></div></div></div>`;
    o += `<div class="card"><div class="row sp"><div><div class="mute">Profit on paper (after tax)</div><div class="big">${UI.signed(r.profit)}</div></div><div><div class="mute">Net worth</div><div class="big">${m(r.nw)}</div><div class="mute">${UI.signed(r.nw - r.nwStart)}</div></div></div>
      <div class="mute" style="margin-top:4px">Profit on paper leaves out buying machines and buildings and paying down loans; "left with" above counts everything. Economy: ${esc(r.world.phase)} · interest ${U.pct(r.world.rate, 1)}${r.tax ? ` · income tax ${m(r.tax)}` : ''}</div></div>`;
    if (r.ach && r.ach.length) o += `<div class="card" style="border-color:#15803d">🏆 Achievement${r.ach.length > 1 ? 's' : ''}: ${r.ach.map((a) => esc(TG.CONFIG.achievements[a])).join(', ')}</div>`;
    if (r.biz.length) o += `<div class="card"><h3>🏪 Why each business did what it did</h3>${r.biz.map((b) => grp('🏪', b.name, sg(b.cash != null ? b.cash : b.profit), `<div class="mute">True result ${UI.signed(Math.round(b.cash != null ? b.cash : b.profit))} · profit on paper ${UI.signed(b.profit)} · sales ${m(b.rev)}</div><ul class="plain small">${b.why.map((w) => `<li>${esc(w)}</li>`).join('')}</ul>`)).join('')}</div>`;
    const evs = r.events.filter((e) => e.type !== 'news');
    if (evs.length) o += `<div class="card"><h3 style="margin-top:0">What happened (${evs.length})</h3>${evs.slice(0, 60).map(UI.ev).join('')}</div>`;
    if (r.decisions.length) o += `<div class="card"><h3 style="margin-top:0">Decisions made</h3>${r.decisions.map((d) => `<div class="ev ${d.outcome === 'bad' ? 'bad' : d.outcome === 'good' ? 'good' : 'info'}"><b>${esc(d.by)}</b>${d.biz ? ` (${esc(d.biz)})` : ''}: ${esc(d.text)}</div>`).join('')}</div>`;
    if (r.staff.length) o += `<div class="card"><h3 style="margin-top:0">Staff changes</h3>${r.staff.map((s) => `<div class="small">👥 ${s.biz ? esc(s.biz) + ': ' : ''}${esc(s.text)}</div>`).join('')}</div>`;
    if (r.news.length) o += `<div class="card"><h3 style="margin-top:0">News</h3>${r.news.map((n) => `<div class="ev ${n.tone}">📰 ${esc(n.text)}</div>`).join('')}</div>`;
    if (r.warns.length) o += `<div class="card"><h3 style="margin-top:0">Warning signs</h3>${r.warns.map((w) => `<div class="ev warn">${w.biz ? esc(w.biz) + ': ' : ''}${esc(w.text)}${w.p ? ` (${U.pct(w.p, 1)})` : ''}<div class="why">${esc(w.why || '')}</div></div>`).join('')}</div>`;
    return o;
  };

  // skip: totals for the whole stretch, then month by month (tap a month for who made or lost money)
  UI.showSkip = (s) => {
    UI.S.lastSkip = s;
    let o = `<div class="card"><div class="mute">${esc(s.from)} to ${esc(s.to)}: ${s.months} months (${U.yrsMo(s.months)}) simulated one by one${s.months < s.asked ? `, stopped early of ${s.asked}` : ''}</div>
      ${s.stopped ? `<div class="ev bad"><b>Stopped early (${esc(s.stopped.date)}):</b> ${esc(s.stopped.text)}</div>` : ''}
      <div class="row sp" style="margin-top:6px"><div><div class="mute">Net worth</div><div class="big">${m(s.nw1)}</div><div class="mute">from ${m(s.nw0)}</div></div><div><div class="mute">Profit on paper</div><div class="big">${UI.signed(s.profit)}</div></div></div></div>`;
    o += UI.moneyHtml(s.money, { span: `All ${s.months} months together`, openRE: true });
    const PM = s.perMonth || []; const show = PM.slice(-600);
    o += `<div class="card"><details class="grp"><summary><span class="gl"><span class="car"></span>📅 Month by month (${PM.length})</span><span class="gv"></span></summary>
      ${PM.length > show.length ? `<div class="mute">Showing the last ${show.length} months.</div>` : ''}<div class="mute">Tap a month to see who made or lost money.</div>
      ${show.map((x) => grp('', x.date, `${sg(x.net)} <span class="mute small">→ ${m(x.cash)}</span>`, `<table class="mtab"><tr><td>💰 In</td><td class="n">${plus(x.in)}</td></tr><tr><td>💸 Out</td><td class="n">${minus(x.out)}</td></tr>${Object.entries(x.own).sort((a, b) => a[1] - b[1]).map(([k, v]) => { const nm = (s.names && s.names[k]) || LG().nameOf(TG.G, k) || { n: 'Closed / sold', i: '•' }; return `<tr><td>${nm.i} ${esc(nm.n)}</td><td class="n">${sg(v)}</td></tr>`; }).join('')}</table>`)).join('')}</details></div>`;
    o += `<div class="card"><h3 style="margin-top:0">Major events (${s.majorCount})</h3>${s.majors.length ? s.majors.slice(-40).reverse().map((e) => `<div class="ev bad"><b>${esc(e.date)}</b> ${e.biz ? esc(e.biz) + ': ' : ''}${esc(e.text)}<div class="why">${esc(e.why || '')}</div></div>`).join('') : '<div class="mute">None. Quiet stretch.</div>'}</div>`;
    o += `<div class="card"><h3 style="margin-top:0">Manager decisions (${s.decisionCount})</h3>${s.decisions.length ? s.decisions.slice(-30).reverse().map((d) => `<div class="ev ${d.outcome === 'bad' ? 'bad' : d.outcome === 'good' ? 'good' : 'info'}"><b>${esc(d.date)}</b> ${esc(d.by)}: ${esc(d.text)}</div>`).join('') : '<div class="mute">No manager decisions. Without managers, problems sat unhandled.</div>'}</div>`;
    UI.modal('⏩ Skip summary', o + `<div class="btns">${s.pending ? UI.btn(`⚠️ ${s.pending} decision(s) waiting`, 'decisions', null, 'pri') : ''}${UI.btn('Close', 'closeModal')}</div>`);
  };

  // ================= 🏦 LOANS (like real mortgages) =================
  const loanOwnerName = (g, key) => { const nm = LG().nameOf(g, key); return nm ? `${nm.i} ${nm.n}` : '👤 You'; };
  UI.loansCard = (g) => {
    const F = TG.F; let o = `<div class="card" id="loansCard"><h3>🏦 Your loans (${g.loans.length + (g.loc.balance > 0 ? 1 : 0)}) ${UI.tipBtn('lns')}</h3>${UI.tipLine('lns', 'Every payment = interest on what you still owe + the rest off the balance. Early on most of it is interest; near the end most of it pays the loan down. Tap a loan for the full schedule, extra payments or paying it off.')}`;
    const rows = g.loans.map((l) => { const i = F.loanInfo(g, l); return `<div class="link" data-act="loanView" data-arg="${l.id}" style="cursor:pointer"><span class="ico">${l.type === 'mortgage' ? '🏠' : l.type === 'equipment' ? '🛠️' : l.type === 'emergency' ? '🚑' : '🏦'}</span><span class="grow"><b>${esc(l.label)}</b><small>${U.pct(l.rate, 2)} · ${m(l.payment)}/mo · ${i.monthsLeft} mo left${l.missed ? ` · <span class="bad">${l.missed} missed</span>` : ''}</small></span><b>${m(l.balance)}</b></div>`; });
    if (g.loc.balance > 0) { const i = F.locInfo(g); rows.push(`<div class="link" data-act="loanView" data-arg="loc" style="cursor:pointer"><span class="ico">💳</span><span class="grow"><b>Credit line</b><small>${U.pct(i.rate, 2)} · ${m(i.payment)}/mo minimum</small></span><b>${m(g.loc.balance)}</b></div>`); }
    o += rows.join('') || '<div class="mute">No loans.</div>';
    if (rows.length) o += `<div class="tot"><span>Total owed · ${m(F.totalPayments(g))}/mo</span><span>${m(U.sum(g.loans, (l) => l.balance) + g.loc.balance)}</span></div>`;
    return o + '</div>';
  };
  UI.A.loanView = (id) => {
    const g = TG.G, F = TG.F; const loc = id === 'loc'; const l = loc ? null : g.loans.find((x) => x.id === id); if (!loc && !l) { UI.closeModal(); return; }
    const i = loc ? F.locInfo(g) : F.loanInfo(g, l);
    const col = l && l.collateral ? (l.collateral.kind === 'property' ? `🏠 ${esc(((g.re.holdings.find((h) => h.id === l.collateral.id) || g.properties.find((p) => p.id === l.collateral.id) || {}).name) || 'property')} (the lender takes it after ${TG.CONFIG.finance.repoAfterMissed} missed payments)` : '🛠️ a machine') : 'none (unsecured)';
    const row = (a, b) => `<span>${a}</span><span>${b}</span>`;
    let o = `<div class="card"><div class="kv kvl">
      ${loc ? row('Approved limit', m(g.loc.limit || 0)) : row('Borrowed', m(i.original))}
      ${row('<b>Still owed</b>', `<b>${m(i.balance)}</b>`)}${row('Interest rate', `${U.pct(i.rate, 2)} a year`)}
      ${loc ? row('Length', 'no end date: minimum payments') : row('Length', `${i.term} months (${U.yrsMo(i.term)})`)}
      ${row('Monthly payment', `<b>${m(i.payment)}</b>${loc ? ' minimum' : ''}`)}
      ${row('This month: interest', minus(i.thisInt))}${row('This month: principal (off the balance)', `<span class="good">${m(i.thisPrin)}</span>`)}
      ${row('Interest paid so far', m(i.intPaid) + (l && l.histUnknown ? ' <span class="mute">(since v7)</span>' : ''))}${row('Interest still to pay', m(i.intLeft))}
      ${row('Months left', `${i.monthsLeft} (${U.yrsMo(i.monthsLeft)})`)}${row('Paid off in', U.dateStr(i.payoffM))}
      ${loc ? '' : row('Paid by', esc(loanOwnerName(g, i.owner)))}</div>${loc ? '' : `<div class="small" style="margin-top:6px">🔒 Security: ${col}</div>`}
      ${l && l.missed ? `<div class="ev bad">${l.missed} missed payment(s): late interest and fees were added to what you owe.</div>` : ''}</div>`;
    const cut = Math.min(i.balance, Math.max(0, Math.floor(g.cash)));
    o += `<div class="card"><h3>💵 Pay extra</h3><div class="mute">Extra money goes straight off the balance. ${loc ? 'Less owed = less interest.' : 'Your monthly payment stays the same, so the loan ends sooner and you skip the interest on those months.'}</div>
      <div class="row"><input type="number" id="xPay" placeholder="amount" min="0" step="1000" aria-label="extra payment">${UI.btn('Pay extra', 'loanExtra', id, 'sm pri')}</div>
      <div class="btns">${UI.btn(`Pay it all off (${m(i.balance)})`, 'loanExtra', id + '|all', 'sm', g.cash < i.balance)}</div>${cut < i.balance ? `<div class="mute">You have ${m(g.cash)} cash.</div>` : ''}</div>`;
    const S = i.schedule; const show = S.slice(0, 600);
    o += `<div class="card"><details class="grp"><summary><span class="gl"><span class="car"></span>📅 Full payment schedule (${S.length})</span><span class="gv"></span></summary>
      <table class="sched mtab"><tr><th>When</th><th>Pay</th><th>Interest</th><th>Off loan</th><th>Left</th></tr>${show.map((x) => `<tr><td>${U.dateStr(x.m)}</td><td class="n">${m(x.pay)}</td><td class="n bad">${m(x.int)}</td><td class="n good">${m(x.prin)}</td><td class="n">${m(x.bal)}</td></tr>`).join('')}</table>${S.length > show.length ? '<div class="mute">First 600 shown.</div>' : ''}</details></div>`;
    UI.modal(loc ? '💳 Credit line' : `🏦 ${esc(l.label)}`, o + `<div class="btns">${UI.btn('Close', 'closeModal')}</div>`);
  };
  UI.A.loanExtra = (arg) => {
    const g = TG.G, F = TG.F; const [id, how] = String(arg).split('|');
    if (id === 'loc') { const amt = how === 'all' ? g.loc.balance : UI.num('xPay', 0); const v = F.locRepay(g, amt); UI.toast(v ? `Paid ${m(v)} off the credit line.` : 'Nothing paid (check your cash).', !v); }
    else { const l = g.loans.find((x) => x.id === id); if (!l) return UI.closeModal();
      if (how === 'all') { if (g.cash < l.balance) return UI.toast(`Paying it off takes ${m(l.balance)}.`, true); const b = l.balance; F.payoff(g, id); UI.toast(`Paid off: ${m(b)}.`); }
      else { const before = F.loanInfo(g, l); const v = F.prepay(g, id, UI.num('xPay', 0)); if (!v) return UI.toast('Enter an amount you have in cash.', true); const after = g.loans.includes(l) ? F.loanInfo(g, l) : null; UI.toast(after ? `Paid ${m(v)} extra: ${before.monthsLeft - after.monthsLeft} months sooner, ${m(before.intLeft - after.intLeft)} less interest.` : `Paid off with ${m(v)}.`); } }
    if ((id === 'loc' && g.loc.balance > 0) || g.loans.some((x) => x.id === id)) UI.A.loanView(id); else UI.closeModal();
    UI.refresh();
  };

  // ================= 🔑 RENTAL UNITS: one tenant per home / unit =================
  UI.unitsHtml = (g, h) => {
    const RE = TG.RE; RE.ensureUnits(h); if (!h.units || h.kind === 'land' || !TG.CONFIG.realEstate.kinds[h.kind].rentPct) return '';
    const mgr = g.re.manager; const occ = h.tenants.filter((t) => t).length;
    const UL = h.tenants.map((t, u) => {
      const iss = RE.unitIssues(h, u);
      const fix = iss.map((it) => `<div class="small bad">🔧 ${esc(it.what)} ${UI.btn(`Fix ${m(RE.fixCost(g, it))}`, 'reFix', `${h.id}|${it.id}`, 'xs pri')}</div>`).join('');
      if (t) { const q = RE.quality(t); return `<div class="unit"><span class="un">🟢 ${u + 1}</span><span class="ub"><b>${esc(t.name)}</b> ${UI.pill('⭐'.repeat(q.stars) + ' ' + q.label, q.tone)}<br>${m(t.rent)}/mo · ${t.evict ? `<span class="bad">eviction: ${t.evict} mo</span>` : `lease ${RE.leaseLeft(g, t)} mo left`}${t.late ? ` · <span class="bad">${t.late} mo behind</span>` : ''}${fix}</span></div>`; }
      const cur = RE.current(g, h, u); const s = h.searches[u];
      const act = h.mode !== 'rent' ? '<span class="mute">not renting</span>' : iss.length ? '<span class="mute">fix first</span>' : mgr ? '<span class="mute">manager is on it</span>' : cur ? UI.btn(`👤 Applicants (${s.list.length - s.i})`, 'reSearch', `${h.id}|${u}`, 'xs pri') : UI.btn(`🔎 Search ${m(RE.searchCost(g, h))}`, 'reSearch', `${h.id}|${u}`, 'xs');
      return `<div class="unit"><span class="un">🔴 ${u + 1}</span><span class="ub"><b>Empty</b> · would rent for ${m(RE.askRent(g, h))}/mo${fix}</span>${act}</div>`;
    });
    const big = h.tenants.length > 8; const lim = UI.S['units' + h.id] ? UI.S['units' + h.id] : 40;
    const shown = UL.slice(0, lim).join('') + (UL.length > lim ? `<div class="btns">${UI.btn(`Show ${Math.min(40, UL.length - lim)} more units`, 'unitsMore', h.id, 'xs')}</div>` : '');
    const whole = (h.issues || []).filter((x) => x.unit == null).map((it) => `<div class="ev bad">🔧 Building: ${esc(it.what)} ${UI.btn(`Fix ${m(RE.fixCost(g, it))}`, 'reFix', `${h.id}|${it.id}`, 'xs pri')}</div>`).join('');
    return `${whole}<details class="grp"${big ? '' : ' open'}><summary><span class="gl"><span class="car"></span>🚪 Units: ${occ}/${h.tenants.length} rented</span><span class="gv">${h.tenants.length - occ ? `<span class="bad">${h.tenants.length - occ} empty</span>` : '<span class="good">full</span>'}</span></summary>${shown}</details>`;
  };
  UI.A.unitsMore = (hid) => { UI.S['units' + hid] = (UI.S['units' + hid] || 40) + 40; UI.refresh(); };
  UI.A.reFix = (arg) => { const [hid, iid] = arg.split('|'); const r = TG.RE.fixIssue(TG.G, hid, iid); if (UI.res(r, r.ok ? `Fixed for ${m(r.cost)}.` : null)) UI.refresh(); };

  // property manager card: what they do, what they cost, and what you must do without one
  UI.reMgrCard = (g) => {
    const RC = TG.CONFIG.realEstate, r = g.re, RE = TG.RE; const open = U.sum(r.holdings, (h) => (h.issues || []).length); const empty = U.sum(r.holdings, (h) => RE.vacant(h));
    if (r.manager) { const mg = r.manager; const rent = U.sum(r.holdings, (h) => U.sum((h.tenants || []).filter((t) => t), (t) => t.rent));
      return `<div class="ev info">🧑‍💼 <b>Property manager ${esc(mg.name)}</b> (skill ~${mg.skillSeen}) ${UI.btn('Fire', 'reMgrFire', null, 'xs')}<div class="small">Finds and screens a tenant for every empty unit, pays for repairs as they happen and handles evictions. Skill: tenants ${mg.skill >= 60 ? 'better' : mg.skill >= 40 ? 'about average' : 'worse'} than you'd find; searches and repairs cost x${RE.mgrCostMult(g).toFixed(2)}.</div><div class="small">Cost: ${m(mg.wage)}/mo + ${U.pct(RC.managerFeePct)} of rent (≈ ${m(rent * RC.managerFeePct)}) = about <b>${m(mg.wage + rent * RC.managerFeePct)}/mo</b>.</div></div>
        <div class="kv" style="margin-top:6px"><span>Handyman on call</span><span>${UI.btn(r.handyman ? 'Yes' : 'No', 'reHandy', null, 'sm')}</span></div>`; }
    return `<div class="ev warn">🧑‍💼 <b>No property manager: you do it all.</b><div class="small">Each empty unit needs its own tenant search${empty ? ` (${empty} empty now)` : ''}; repairs wait until you tap Fix${open ? ` (<b class="bad">${open} open</b>)` : ''}. Unfixed repairs annoy tenants, wear the building and can bring city fines. Self-managing more than ${RC.selfManageLimit} units gets sloppy (more late rent).</div>
      <div class="btns">${UI.btn('Hire a property manager', 'reMgr', null, 'sm')}</div><div class="mute">A manager costs a wage + ${U.pct(RC.managerFeePct)} of rent: worth it with many units.</div></div>
      <div class="kv" style="margin-top:6px"><span>Handyman on call (repairs −20%)</span><span>${UI.btn(r.handyman ? 'Yes' : 'No', 'reHandy', null, 'sm')}</span></div>`;
  };
  // ================= 🚫 CLOSED SHOP =================
  UI.closedBanner = (g, b) => {
    const lc = UI.lc(b); const closedNow = lc.closed || (b.lastCtx && b.lastCtx.closed);
    if (!closedNow) return '';
    const shut = Math.max(b.shut || 0, 1); const st = b.stock; const q = TG.ST.suggest(b, g);
    const pq = U.avg(b.staff, (e) => TG.B.shutQuitP(Object.assign({}, b, { shut: shut + 1 }), e), 0);
    return `<div class="closed">🚫 ${esc(lc.note || 'Closed: no supplies, no manager')}<div class="small" style="font-weight:600;margin-top:4px">No sales while closed. Wages (${m(TG.S.payroll(b))}/mo), rent and bills keep coming. Idle staff may quit: about ${U.pct(pq)} each next month (more each closed month and when unhappy). ${st ? `You have ${N(st.qty)} supplies.` : ''}</div>
      <div class="btns">${q > 0 ? UI.btn(`📦 Buy ${N(q)} supplies (${m(q * TG.ST.unitCost(g, b))})`, 'stBuyN', `${b.id}|${q}`, 'sm pri') : ''}${UI.btn('🧑‍💼 Hire a manager', 'hireRole', 'ops', 'sm')}</div></div>`;
  };

  UI.A.stBuyN = (arg) => { const [id, q] = String(arg).split('|'); const g = TG.G, b = TG.B.get(g, id); if (!b) return; const n = TG.ST.buy(g, b, Number(q), 0); UI.res(n > 0 ? { ok: true } : { ok: false, msg: 'No room or not enough cash.' }, `Bought ${N(n)}. The shop can open.`); UI.refresh(); };
  // ================= 🤝 HR IN HIRING =================
  UI.hrHiring = (g, b, role) => {
    const C = TG.CONFIG, S = TG.S; if (C.specialists[role] || role === 'ceo') return '';
    const hr = S.hrOf(b); const rd = S.roleDef(b, role) || {};
    if (hr) {
      const d = S.hrDisc(hr), sc = S.hrScreen(hr);
      return `<div class="ev info">🤝 <b>HR manager ${esc(hr.name)}</b> (skill ${Math.round(hr.skill)}, ${m(hr.wage)}/mo): wages about <b>${U.pct(d)} lower</b> for the same skill, and about <b>${U.pct(sc)}</b> of unreliable or dishonest applicants are screened out.
        <div class="mute">Odds, not a promise: the deepest bargains are more often duds, and people paid under the going rate are a bit less happy. HR pays for itself only if you hire a lot (${U.pct(d)} of ${m(S.payroll(b))} payroll ≈ ${m(d * U.sum(b.staff, (e) => e.wage))}/mo vs ${m(hr.wage)} salary).</div></div>`;
    }
    const sp = C.specialists.hr; const mid = Math.round((sp.wage[0] + sp.wage[1]) / 2 * (C.staff.specWageByTier[TG.B.def(b).tier] || 1));
    return `<div class="ev">🤝 <b>No HR manager</b>: you pay full wages and see every applicant. An HR manager (about ${m(mid)}/mo) would get ~${U.pct(S.hrDisc({ skill: 40 }))}–${U.pct(S.hrDisc({ skill: 85 }))} lower wages and screen out ${U.pct(S.hrScreen({ skill: 40 }))}–${U.pct(S.hrScreen({ skill: 85 }))} of bad fits. Worth it when you hire many people (your payroll: ${m(S.payroll(b))}/mo). ${UI.btn('See HR managers', 'hireRole', 'hr', 'xs')}</div>`;
  };
  UI.hrCand = (c) => (c.hrDisc != null ? `<div class="small">🤝 HR deal: ${m(c.wage)} instead of ${m(c.listWage)} (−${U.pct(c.hrDisc)})${c.screened ? ' · ✔ screened' : ''}</div>` : '');
})();

</script>
<script>TG.UI.boot();</script>
</body>
</html>
