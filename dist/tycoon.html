  E.poolOf = (ed) => ed.pool || ed.id;
  E.capacity = (b, poolId) => U.sum(b.equip, (x) => { const ed = E.def(b, x.type); return ed && E.poolOf(ed) === poolId ? E.out(x) * (ed.cap || 0) : 0; });
  // critical capacity pools of a business: [{pool, primary (first item def), label}]
  E.pools = (b) => { const out = [], seen = {}; for (const ed of TG.CONFIG.businesses[b.type].equip) { if (!ed.critical) continue; const p = E.poolOf(ed); if (seen[p]) continue; seen[p] = 1; out.push({ pool: p, primary: TG.CONFIG.businesses[b.type].equip.find((x) => E.poolOf(x) === p && x.critical) }); } return out; };
  // a boost field (ticketBoost, staffBoost, demandBoost): one working item per type counts
  E.boost = (b, field) => { const seen = {}; let t = 0; for (const it of b.equip) { if (it.broken || seen[it.type]) continue; const ed = E.def(b, it.type); if (ed && ed[field]) { seen[it.type] = 1; t += ed[field]; } } return t; };
  E.sumField = (b, field) => U.sum(b.equip, (x) => { const ed = E.def(b, x.type); return ed && ed[field] && !x.broken ? ed[field] * (field === 'store' || field === 'storeTons' || field === 'storeUnits' || field === 'head' ? 1 : E.out(x)) : 0; });
  E.count = (b, typeId) => b.equip.filter((x) => x.type === typeId && x.broken !== 'destroyed').length;
  // most of an item you can own (seats limited by floor space; boosts are one-per-type but extras act as spares)
  E.maxCount = (b, typeId) => {
    const ed = E.def(b, typeId); if (!ed) return 0;
    if (ed.seat) { const s = TG.CONFIG.businesses[b.type].svc; return Math.max(1, Math.ceil(b.sqft * s.perSpace / ed.cap)); }
    if (ed.perTruck) return Math.max(1, E.count(b, 'truck'));
    if (ed.max) return ed.max;
    if (ed.ticketBoost || ed.staffBoost || ed.demandBoost) return 2;
    return 999;
  };

  E.resale = (g, b, it) => {
    const eq = TG.CONFIG.equipment;
    if (it.leased) return 0;
    const base = E.def(b, it.type).price * TG.CONFIG.equipTiers[it.tier].price * g.world.priceIdx;
    const v = base * eq.resaleBase * Math.exp(-eq.resaleAgeDecay * it.age) * (1 - eq.resaleWearWeight * E.effWear(it) / 100) * (it.broken === 'destroyed' ? 0.05 : it.broken ? 0.5 : 1);
    return Math.max(0, Math.round(v));
  };

  E.repairCost = (g, b, it) => {
    const eq = TG.CONFIG.equipment, d = E.def(b, it.type);
    let c = d.price * g.world.priceIdx * (it.broken === 'major' ? eq.repairPct.major : eq.repairPct.minor);
    c *= E.mechRepairMult(b); // v6: your mechanic's skill sets the discount
    if (TG.CONFIG.equipTiers[it.tier].advanced && !E.hasMech(b)) c *= eq.advancedNoMechRepairMult;
    if (d.efficiency) c *= 2;
    return Math.round(c);
  };

  E.repair = (g, b, itId, by) => {
    const it = b.equip.find((x) => x.id === itId); if (!it || !it.broken || it.broken === 'destroyed') return false;
    const cost = it.warranty > 0 || it.leased ? 0 : E.repairCost(g, b, it);
    if (g.cash < cost) return false;
    TG.F.spend(g, cost, 'Repairs', b.id);
    if (TG.D) TG.D.removeFor(g, (d) => d.kind === 'broken' && d.itemId === it.id);
    it.broken = null; it.wear = U.clamp(it.wear - 15, 0, 100);
    TG.rep.decision(g, b, by, `Repaired ${it.label}${cost ? ' for ' + U.money(cost) : ' (covered)'}`);
    return true;
  };
  E.serviceCost = (g, b, it) => Math.round(E.def(b, it.type).price * TG.CONFIG.equipment.serviceCostPct * g.world.priceIdx * E.mechServiceMult(b));
  E.service = (g, b, itId) => {
    const it = b.equip.find((x) => x.id === itId); if (!it || it.broken) return false;
    const eq = TG.CONFIG.equipment; const cost = E.serviceCost(g, b, it); it.lastSvc = cost;
    TG.F.spend(g, cost, 'Maintenance', b.id);
    if (TG.USES.take(it, 'service', g.month) > 1) return 'again'; // one service a month per machine; more just costs money
    it.wear = U.clamp(it.wear - eq.serviceWearCut, 0, 100); it.hidden = Math.max(0, (it.hidden || 0) - 10);
    return true;
  };
  E.inspect = (g, b, itId) => {
    const it = b.equip.find((x) => x.id === itId); if (!it) return;
    TG.F.spend(g, Math.round(E.def(b, it.type).price * TG.CONFIG.equipment.inspectCost * g.world.priceIdx), 'Inspections', b.id);
    it.wear = E.effWear(it); it.hidden = 0; it.inspected = true;
  };
  E.sell = (g, b, itId) => {
    const it = b.equip.find((x) => x.id === itId); if (!it) return 0;
    const v = E.resale(g, b, it);
    b.equip = b.equip.filter((x) => x.id !== itId);
    if (v) TG.F.earn(g, v, 'Asset sales', b.id, true);
    return v;
  };

  // Monthly wear, breakdowns, theft. Returns nothing; pushes events and decisions.
  E.month = (g, b, ctx) => {
    const C = TG.CONFIG, eq = C.equipment;
    E.mechMonth(g, b);
    const cov = E.mechCoverage(b);
    const wearFix = (b.fixesOn && b.fixesOn.wearMult) || 1;
    for (const it of b.equip.slice()) {
      if (it.broken === 'destroyed') continue;
      it.age++; if (it.warranty > 0) it.warranty--;
      const d = E.def(b, it.type);
      const pu = b.workPool ? b.workPool[E.poolOf(d)] : undefined;
      const use = it.broken ? 0.2 : (pu != null ? TG.WK.wearMult(pu) : ctx.util == null ? 1 : 0.4 + 0.8 * U.clamp(ctx.util, 0, 1.2)) * (b.pace === 'rush' ? 1.3 : b.pace === 'careful' ? 0.85 : 1);
      let wg = eq.wearPerMonth * use * (it.maint ? eq.maintPlanWearMult : 1) * (1 - (1 - eq.mechanicWearMult) * cov) * wearFix * (120 / d.life);
      it.wear = U.clamp(it.wear + wg * R.range(0.6, 1.4) * (1 - TG.S.perk(b, 'wearCut')), 0, 100);
      if (it.maint && !it.leased) TG.F.spend(g, Math.round(d.price * eq.maintPlanCostPct * g.world.priceIdx), 'Maintenance plans', b.id);
      if (it.leased) TG.F.spend(g, it.leasePay, 'Equipment lease', b.id);
      if (it.broken) continue;
      if (d.upkeep) TG.F.spend(g, Math.round(d.upkeep * g.world.priceIdx), 'Equipment upkeep', b.id);
      const bc = E.breakChance(g, b, it);
      it.lastP = bc.p;
      if (bc.p >= eq.warnAt && R.chance(0.6)) ctx.warnings.push({ text: `${it.label} #${E.num(b, it)} is making a strange noise`, why: `${U.pct(bc.p, 0)} monthly break chance: ${bc.factors.join(', ')}`, p: bc.p });
      if (R.chance(bc.p * (ctx.streakMult || 1))) E.breakItem(g, b, it, bc, ctx);
      // theft / vandalism for vehicles and sites without security
      if ((d.id === 'truck' || d.id === 'mower' || d.id === 'trailer' || d.heavy) && R.chance(eq.theftBase * (C.locations[b.loc] ? C.locations[b.loc].crime : 1) * (g.world.crime > 0 ? 2 : 1) * (b.fixes.gps ? 0.3 : 1))) {
        it.broken = 'major';
        TG.rep.event(g, b, 'bad', `${it.label} #${E.num(b, it)} was vandalized`, `Location crime level and ${b.fixes.gps ? 'tracking helped little' : 'no security or tracking'}`);
        E.queueBroken(g, b, it);
      }
    }
  };
  E.num = (b, it) => b.equip.filter((x) => x.type === it.type).indexOf(it) + 1;

  E.breakItem = (g, b, it, bc, ctx) => {
    const C = TG.CONFIG, eq = C.equipment, d = E.def(b, it.type);
    const w = E.effWear(it) / 100;
    const sev = R.weighted({ minor: eq.severity.minor * (1.2 - w), major: eq.severity.major, catastrophic: eq.severity.catastrophic * (0.4 + w * 1.6) });
    const why = `${it.label} #${E.num(b, it)}: ${bc.factors.join(', ')}; ${U.pct(bc.p, 1)} monthly break chance`;
    if (it.inspected === undefined && it.hidden > 5) it.hidden = 0; // problems surface
    if (sev === 'minor') {
      const cost = it.warranty > 0 || it.leased ? 0 : Math.round(E.repairCost(g, b, Object.assign({}, it, { broken: 'minor' })));
      TG.F.spend(g, cost, 'Repairs', b.id);
      ctx.down = U.clamp((ctx.down || 0) + (d.critical ? eq.minorDowntime / Math.max(1, b.equip.filter((x) => x.type === it.type).length) : 0.02), 0, 1);
      TG.rep.event(g, b, 'bad', `${it.label} #${E.num(b, it)} had a minor breakdown (slow day, ${U.money(cost)} fix)`, why);
      it.wear = U.clamp(it.wear + 3, 0, 100);
      return;
    }
    if (sev === 'major') {
      it.broken = 'major';
      if (d.breakRevLoss) TG.F.spend(g, Math.round(ctx.revAvg * d.breakRevLoss), 'Spoiled stock', b.id);
      TG.rep.event(g, b, d.critical || d.harvestCritical ? 'major' : 'bad', `${it.label} #${E.num(b, it)} broke down`, why, d.critical ? { major: 'breakdown' } : null);
      E.queueBroken(g, b, it);
      return;
    }
    it.broken = 'destroyed';
    let loss = 0;
    if (!it.leased) {
      loss = E.resale(g, b, Object.assign({}, it, { broken: null }));
      const cov = TG.F.claim(g, b, 'equipment', loss, `${it.label} destroyed`);
      if (cov) loss -= cov;
    }
    TG.rep.event(g, b, 'major', `${it.label} #${E.num(b, it)} was destroyed in a catastrophic failure`, why, { major: 'breakdown' });
    if (d.injuryOnCat && R.chance(d.injuryOnCat)) TG.B.lawsuit(g, b, `Injury from ${it.label} failure`, Math.max(C.lawsuits.suitMin, ctx.revAvg * R.range(0.5, 2)), 'liability', why);
    E.queueBroken(g, b, it);
  };

  E.queueBroken = (g, b, it) => {
    const d = E.def(b, it.type);
    const destroyed = it.broken === 'destroyed';
    const opts = [];
    if (!destroyed) opts.push({ id: 'repair', label: `Repair (${it.warranty > 0 || it.leased ? 'covered' : U.money(E.repairCost(g, b, it))})` });
    for (const tier of ['used', 'budget', 'standard', 'premium']) opts.push({ id: 'replace_' + tier, label: `Sell it (${U.money(E.resale(g, b, it))}) and buy a ${TG.CONFIG.equipTiers[tier].label.toLowerCase()} one (${U.money(E.price(g, b, it.type, tier))})` });
    opts.push({ id: 'leave', label: destroyed ? 'Scrap it, no replacement' : 'Leave it broken' });
    TG.D.add(g, { kind: 'broken', bizId: b.id, itemId: it.id, title: `${d.label} ${destroyed ? 'destroyed' : 'broken'}`,
      text: `${it.label} #${E.num(b, it)} (${TG.CONFIG.equipTiers[it.tier].label}, ${(it.age / 12).toFixed(1)} yrs, ${Math.round(E.effWear(it))}% wear) is out of action.${d.critical ? ' It is critical: capacity drops until it is fixed.' : ''}`,
      why: `Break chance was ${U.pct(it.lastP || 0, 1)} per month.${destroyed ? '' : E.hasMech(b) ? ' Your mechanic will fix it next month if cash allows.' : ' No mechanic: it stays broken until you repair it.'}`, options: opts, def: destroyed ? 'leave' : null });
  };

  // replace a broken/destroyed item (or add new)
  E.replace = (g, b, itId, tier, by) => {
    const it = b.equip.find((x) => x.id === itId);
    const typeId = it ? it.type : null; if (!typeId) return false;
    const price = E.price(g, b, typeId, tier);
    if (g.cash < price) { TG.rep.decision(g, b, by, `Could not afford a replacement ${it.label} (${U.money(price)})`, 'bad'); return false; }
    const sold = E.resale(g, b, it);
    b.equip = b.equip.filter((x) => x.id !== itId);
    if (sold) TG.F.earn(g, sold, 'Asset sales', b.id, true);
    const n = E.buy(g, b, typeId, tier);
    if (n) n.maint = !!(it.maint);
    TG.rep.decision(g, b, by, `Sold the old ${it.label} for ${U.money(sold)} and bought a ${TG.CONFIG.equipTiers[tier].label.toLowerCase()} one (${U.money(price)})`);
    return true;
  };

  E.avgWear = (b, filter) => { const l = b.equip.filter((x) => !filter || filter(x)); return l.length ? U.avg(l, E.effWear) : 0; };
  E.value = (g, b) => U.sum(b.equip, (x) => E.resale(g, b, x));
  TG.E = E;
})();

</script>
<script>/* js/finance.js */
/* finance.js - cash flow, loans, credit line, credit score, taxes, insurance, investors, valuation, bankruptcy. */
(function () {
  const TG = globalThis.TG; const R = TG.R, U = TG.U;
  const F = {};
  const acc = (g) => (g.acc = g.acc || F.newAcc());
  F.newAcc = () => ({ inc: {}, exp: {}, capIn: {}, capOut: {}, led: {}, names: {} });

  F.earn = (g, amt, label, bizId, capital) => {
    amt = U.num(amt); if (!amt) return;
    g.cash += amt; const a = acc(g); if (TG.LG) TG.LG.rec(g, amt, label, bizId);
    const bucket = capital ? a.capIn : a.inc; bucket[label] = (bucket[label] || 0) + amt;
    if (bizId && !capital) { const b = g.businesses.find((x) => x.id === bizId); if (b && b.m) { b.m.rev += amt; b.m.lines[label] = (b.m.lines[label] || 0) + amt; } }
  };
  F.spend = (g, amt, label, bizId, capital) => {
    amt = U.num(amt); if (!amt) return;
    g.cash -= amt; const a = acc(g); if (TG.LG) TG.LG.rec(g, -amt, label, bizId);
    const bucket = capital ? a.capOut : a.exp; bucket[label] = (bucket[label] || 0) + amt;
    if (bizId && !capital) { const b = g.businesses.find((x) => x.id === bizId); if (b && b.m) { b.m.cost += amt; b.m.lines[label] = (b.m.lines[label] || 0) - amt; } }
  };

  // accounting-only expense (e.g. cost of goods sold for stock that was paid for when ordered): hits profit, not cash
  F.book = (g, amt, label, bizId) => {
    amt = U.num(amt); if (!amt) return;
    const a = acc(g); a.exp[label] = (a.exp[label] || 0) + amt; a.capIn[label + ' (non-cash)'] = (a.capIn[label + ' (non-cash)'] || 0) + amt;
    if (bizId) { const b = g.businesses.find((x) => x.id === bizId); if (b && b.m) { b.m.cost += amt; b.m.lines[label] = (b.m.lines[label] || 0) - amt; } }
  };
  // ---------- rates & credit ----------
  F.rateFor = (g, type) => {
    return TG.CREDIT.rate(g, type, g.player.credit); // v6: rate from the credit score (+ industry outlook for business loans)
  };
  F.payment = (P, rate, n) => { const r = rate / 12; return r === 0 ? P / n : (P * r) / (1 - Math.pow(1 + r, -n)); };
  F.assets = (g) => Math.max(0, F.netWorth(g, true).assets);

  F.maxLoan = (g, type) => {
    const C = TG.CONFIG.finance, L = C.loans[type];
    const nw = F.netWorth(g);
    const cf = U.clamp((g.player.credit - 500) / 300, 0.1, 1.2);
    if (type === 'business') return Math.max(0, Math.round((L.maxBase + L.maxNW * Math.max(0, nw) + 4 * Math.max(0, F.avgProfit(g))) * cf));
    if (type === 'emergency') return Math.round(L.maxBase + L.maxAssets * F.assets(g));
    return Infinity;
  };
  // v6: borrowing is an APPLICATION (see credit.js). canBorrow kept for old callers: it applies and, if approved, returns ok.
  F.canBorrow = (g, type, amount, opts) => TG.CREDIT.apply(g, type, amount, Object.assign({}, opts, { dryApprove: true }));
  F.newLoan = (g, type, amount, opts) => {
    opts = opts || {};
    const L = TG.CONFIG.finance.loans[type];
    const rate = opts.rate || F.rateFor(g, type);
    const term = opts.term || L.term;
    const loan = { id: U.uid('l'), type, label: opts.label || L.label, principal: Math.round(amount), balance: Math.round(amount), rate, term, left: term,
      payment: Math.round(F.payment(amount, rate, term)), missed: 0, collateral: opts.collateral || null, bizId: opts.bizId || null, start: g.month, intPaid: 0, prinPaid: 0 };
    g.loans.push(loan);
    if (!opts.noCash) F.own(g, loan, () => F.earn(g, amount, 'Loan proceeds', null, true));
    return loan;
  };
  // v7: money for a loan lands on the line of whatever it pays for (a business, a rental, a building), else on "You"
  F.own = (g, l, fn) => (TG.LG && !g._own ? TG.LG.within(g, TG.LG.loanOwner(g, l), fn) : fn());
  F.takeLoan = (g, type, amount, opts) => {
    amount = Math.round(amount);
    if (!(amount > 0)) return { ok: false, msg: 'Enter an amount.' };
    return TG.CREDIT.apply(g, type, amount, opts);
  };
  F.payoff = (g, loanId, fromSale) => {
    const l = g.loans.find((x) => x.id === loanId); if (!l) return;
    F.own(g, l, () => F.spend(g, l.balance, 'Loan payoff', null, true));
    l.prinPaid = (l.prinPaid || 0) + l.balance;
    g.loans = g.loans.filter((x) => x !== l);
  };
  // v7: an extra payment goes straight to principal; the monthly payment stays the same, so the loan ends sooner
  // and you skip the interest on those months (like a real mortgage).
  F.prepay = (g, loanId, amt) => {
    const l = g.loans.find((x) => x.id === loanId); if (!l) return 0;
    amt = Math.min(Math.round(amt), l.balance, Math.max(0, g.cash)); if (amt <= 0) return 0;
    F.own(g, l, () => F.spend(g, amt, 'Loan prepayment', null, true)); l.balance -= amt; l.prinPaid = (l.prinPaid || 0) + amt;
    if (l.balance <= 1) g.loans = g.loans.filter((x) => x !== l);
    else l.left = Math.max(1, F.nper(l.balance, l.rate, l.payment));
    return amt;
  };
  // months needed to repay P at a fixed payment A
  F.nper = (P, rate, A) => { const r = rate / 12; if (P <= 0) return 0; if (r === 0) return Math.ceil(P / Math.max(1, A)); if (A <= P * r) return 999; return Math.ceil(-Math.log(1 - r * P / A) / Math.log(1 + r) - 1e-9); };
  // the full amortization schedule from now: each payment = interest on what is left + the rest off the balance
  F.schedule = (g, l, max) => {
    const rows = []; let bal = l.balance; const r = l.rate / 12; let left = Math.max(1, l.left || 1); max = max || 600;
    for (let n = 1; bal > 0.5 && n <= max; n++) {
      const int = bal * r; const pay = left <= 1 ? bal + int : Math.min(l.payment, bal + int);
      const prin = pay - int; bal = Math.max(0, bal - prin); left--;
      rows.push({ n, m: g.month + n - 1, pay, int, prin, bal });
    }
    return rows;
  };
  F.loanInfo = (g, l) => {
    const S = F.schedule(g, l); const int0 = l.balance * l.rate / 12;
    return { original: l.principal, balance: l.balance, rate: l.rate, term: l.term, payment: l.payment, thisInt: int0, thisPrin: Math.max(0, Math.min(l.payment, l.balance + int0) - int0),
      intPaid: l.intPaid || 0, prinPaid: l.prinPaid || 0, intLeft: U.sum(S, (x) => x.int), monthsLeft: S.length, payoffM: S.length ? S[S.length - 1].m : g.month, schedule: S, owner: TG.LG ? TG.LG.loanOwner(g, l) : 'you' };
  };
  // credit line as a loan: interest on what you owe + a minimum share of the balance each month
  F.locInfo = (g) => {
    const C = TG.CONFIG.finance.loc; const rate = g.loc.balance > 0 ? (g.loc.rate || F.rateFor(g, 'loc')) : F.rateFor(g, 'loc');
    const rows = []; let bal = g.loc.balance; const r = rate / 12;
    for (let n = 1; bal > 0.5 && n <= 600; n++) { const int = bal * r; const prin = Math.max(Math.min(bal, 25), Math.round(bal * C.minPayPct)); const pr = Math.min(bal, prin); bal -= pr; rows.push({ n, m: g.month + n - 1, pay: int + pr, int, prin: pr, bal }); }
    const int0 = g.loc.balance * r;
    return { original: g.loc.limit || 0, balance: g.loc.balance, rate, term: null, payment: rows.length ? rows[0].pay : 0, thisInt: int0, thisPrin: rows.length ? rows[0].prin : 0,
      intPaid: g.loc.intPaid || 0, prinPaid: g.loc.prinPaid || 0, intLeft: U.sum(rows, (x) => x.int), monthsLeft: rows.length, payoffM: rows.length ? rows[rows.length - 1].m : g.month, schedule: rows, owner: 'you' };
  };
  F.totalPayments = (g) => U.sum(g.loans, (l) => l.payment) + (g.loc ? Math.round(g.loc.balance * TG.CONFIG.finance.loc.minPayPct) : 0);
  F.debt = (g) => U.sum(g.loans, (l) => l.balance) + (g.loc ? g.loc.balance : 0) + (g.invest ? g.invest.marginDebt : 0);
  F.avgProfit = (g) => { const h = g.history.slice(-6); return h.length ? U.avg(h, (x) => x.profit) : 0; };

  // v6: the credit line limit is whatever a lender approved (apply in the Money tab); lenders cut it if your record turns bad
  F.locLimit = (g) => (g.player.noLoanUntil > g.month ? Math.round(g.loc.balance) : Math.max(0, g.loc.limit || 0));
  F.locDraw = (g, amt, by) => {
    const lim = F.locLimit(g); amt = Math.min(Math.round(amt), lim - g.loc.balance);
    if (amt <= 0) return 0;
    g.loc.balance += amt; const go = () => F.earn(g, amt, 'Credit line draw', null, true); if (TG.LG) TG.LG.within(g, 'you', go); else go();
    return amt;
  };
  F.locRepay = (g, amt) => { amt = Math.min(Math.round(amt), g.loc.balance, Math.max(0, g.cash)); if (amt <= 0) return 0; g.loc.balance -= amt; g.loc.prinPaid = (g.loc.prinPaid || 0) + amt; const go = () => F.spend(g, amt, 'Credit line repayment', null, true); if (TG.LG) TG.LG.within(g, 'you', go); else go(); return amt; };

  // ---------- monthly debt service ----------
  F.monthLoans = (g) => {
    const C = TG.CONFIG.finance; TG.CREDIT.month(g); let paidAll = g.loans.length > 0 || g.loc.balance > 0;
    for (const l of g.loans.slice()) F.own(g, l, () => {
      const interest = l.balance * l.rate / 12;
      // v7: amortizing like a real mortgage. The last payment clears whatever is left (nothing is ever forgiven).
      const pay = l.left <= 1 ? l.balance + interest : Math.min(l.payment, l.balance + interest);
      if (g.cash >= pay || F.autoCredit(g, pay - g.cash)) {
        const ri = Math.round(interest), rp = Math.round(pay - interest);
        F.spend(g, ri, 'Loan interest');
        F.spend(g, rp, 'Loan principal', null, true);
        l.balance = Math.max(0, l.balance - (pay - interest)); l.left--; l.missed = 0;
        l.intPaid = (l.intPaid || 0) + ri; l.prinPaid = (l.prinPaid || 0) + rp; l.lastInt = ri; l.lastPrin = rp; l.lastM = g.month;
        if (l.balance < 1 || l.left <= 0) { g.loans = g.loans.filter((x) => x !== l); TG.rep.event(g, null, 'good', `Paid off ${l.label}`, `All payments made. Interest paid over the loan: ${U.money(l.intPaid)}`); }
      } else {
        l.missed++; l.balance += Math.round(interest + pay * C.lateFeePct);
        l.payment = Math.round(F.payment(l.balance, l.rate, Math.max(1, l.left))); // missed interest is added on; payments rise to stay on schedule
        l.lastInt = 0; l.lastPrin = 0; l.lastM = g.month;
        paidAll = false; TG.CREDIT.late(g, 1);
        TG.rep.event(g, null, 'major', `Missed a payment on ${l.label}`, `Cash ${U.money(g.cash)} was below the ${U.money(pay)} payment; credit score now ${Math.round(g.player.credit)}. ${l.collateral ? `After ${C.repoAfterMissed} missed payments the lender takes the ${l.collateral.kind === 'equip' ? 'machine' : 'property'}.` : `After ${TG.CONFIG.credit.collectionsAfter} it goes to collections.`}`, { major: 'cash' });
        if (l.missed >= C.repoAfterMissed && l.collateral) { F.repossess(g, l); TG.CREDIT.derog(g, 'repo'); }
        else if (!l.collateral && l.missed >= TG.CONFIG.credit.collectionsAfter && !l.coll) { l.coll = true; TG.CREDIT.derog(g, 'collections'); TG.rep.event(g, null, 'major', `${l.label} was sent to collections`, `${l.missed} missed payments in a row: a big hit to your credit score for years`, { major: 'cash' }); }
      }
    });
    // credit line
    if (g.loc.balance > 0) {
      g.loc.rate = F.rateFor(g, 'loc');
      const interest = Math.round(g.loc.balance * g.loc.rate / 12);
      const minPay = Math.min(Math.round(g.loc.balance), Math.max(25, Math.round(g.loc.balance * C.loc.minPayPct)));
      F.spend(g, interest, 'Credit line interest'); g.loc.intPaid = (g.loc.intPaid || 0) + interest;
      if (g.cash >= minPay) { F.spend(g, minPay, 'Credit line repayment', null, true); g.loc.balance -= minPay; g.loc.prinPaid = (g.loc.prinPaid || 0) + minPay; }
      else { paidAll = false; TG.CREDIT.late(g, 0.6); TG.rep.event(g, null, 'bad', 'Missed the credit line minimum payment', `Cash ${U.money(g.cash)}`); }
    }
    if (paidAll) TG.CREDIT.onTime(g); // on-time record counts once a month, however many loans you have
    TG.CREDIT.sync(g);
  };
  F.repossess = (g, l) => {
    const c = l.collateral;
    if (c.kind === 'property') {
      const p = g.properties.find((x) => x.id === c.id);
      if (p) {
        if (p.bizId) { const b = g.businesses.find((x) => x.id === p.bizId); if (b) TG.B.close(g, b, 'Property repossessed by the lender', true); }
        const v = Math.round(TG.P.value(g, p) * TG.CONFIG.finance.bankruptcy.fireSale);
        g.properties = g.properties.filter((x) => x !== p);
        const surplus = v - l.balance; if (surplus > 0) F.earn(g, surplus, 'Repossession surplus', null, true);
        TG.rep.event(g, null, 'major', `Lender repossessed ${p.name}`, `${l.missed} missed payments on ${l.label}`, { major: 'cash' });
      }
      const rh = g.re.holdings.find((x) => x.id === c.id);
      if (rh) { const v = Math.round(TG.RE.value(g, rh) * 0.7); g.re.holdings = g.re.holdings.filter((x) => x !== rh); const s = v - l.balance; if (s > 0) F.earn(g, s, 'Repossession surplus', null, true); TG.rep.event(g, null, 'major', `Lender repossessed ${rh.name}`, `${l.missed} missed payments`, { major: 'cash' }); }
    } else if (c.kind === 'equip') {
      for (const b of g.businesses) { const it = b.equip.find((x) => x.id === c.id); if (it) { b.equip = b.equip.filter((x) => x !== it); TG.rep.event(g, b, 'major', `Lender repossessed ${it.label}`, `${l.missed} missed payments`, { major: 'breakdown' }); } }
    }
    g.loans = g.loans.filter((x) => x !== l);
  };
  // accountant / CFO / CEO draw on the credit line in a crunch
  F.autoCredit = (g, need) => {
    if (need <= 0) return true;
    const handler = F.moneyHandler(g); if (!handler) return false; // v6: only an accountant or CEO draws on the credit line for you
    const lim = F.locLimit(g); const room = lim - g.loc.balance;
    if (room < need) return false;
    F.locDraw(g, Math.ceil(need)); TG.rep.decision(g, null, handler ? handler.label : 'Auto-pay setting', `Drew ${U.money(need)} on the credit line to cover a payment`);
    return true;
  };
  F.moneyHandler = (g) => {
    if (g.ceo) return { label: 'CEO ' + g.ceo.name, emp: g.ceo };
    for (const b of g.businesses) if (b.spec && b.spec.accountant) return { label: 'Accountant ' + b.spec.accountant.name, emp: b.spec.accountant };
    return null;
  };

  // ---------- insurance ----------
  F.premium = (g, b, type) => {
    const I = TG.CONFIG.finance.insurance[type]; if (!I) return 0;
    let p = 0;
    const rev = Math.max(b.revAvg || 0, 3000);
    if (I.rev) p = rev * I.rev;
    if (I.val) p = (type === 'property' ? (b.propValue || 0) : TG.E.value(g, b)) * I.val;
    if (I.perAcre) p = (b.farm ? b.farm.acres : 0) * I.perAcre;
    if (I.perUnit) p = b.equip.filter((x) => x.type === 'truck').length * I.perUnit;
    if (type === 'malpractice') p = Math.max(p, I.min * Math.max(1, b.staff.filter((e) => TG.CONFIG.businesses[b.type].roles[e.role] && TG.CONFIG.businesses[b.type].roles[e.role].licensed).length));
    return Math.round(Math.max(I.min, p) * (b.insHike || 1) * g.world.priceIdx);
  };
  F.claim = (g, b, type, loss, label) => {
    const C = TG.CONFIG.finance;
    if (!b || !type || !b.ins || !b.ins[type] || loss <= 0) return 0;
    const pay = Math.round(Math.max(0, loss - C.insDeductible * g.world.priceIdx) * C.insCover);
    if (pay <= 0) return 0;
    F.earn(g, pay, 'Insurance payouts', b.id);
    b.insHike = (b.insHike || 1) + C.insClaimHike;
    TG.rep.event(g, b, 'info', `Insurance (${C.insurance[type].label}) paid ${U.money(pay)} toward ${label}`, `Covered ${Math.round(C.insCover * 100)}% after deductible; premiums rise after claims`);
    return pay;
  };

  // ---------- taxes ----------
  F.monthTax = (g, opProfit) => {
    const C = TG.CONFIG.finance;
    const hasAcc = g.businesses.some((b) => b.spec && b.spec.accountant) || !!g.ceo;
    let taxable = opProfit;
    if (taxable < 0) { g.taxLoss += -taxable; return 0; }
    const use = Math.min(g.taxLoss, taxable); taxable -= use; g.taxLoss -= use;
    let tax = Math.round(taxable * C.incomeTax * (hasAcc ? 1 - C.accountantTaxCut : 1));
    if (tax > 0) F.spend(g, tax, 'Income tax');
    g.taxPaid.push(tax); if (g.taxPaid.length > 12) g.taxPaid.shift();
    const messy = !hasAcc && g.businesses.length > 0;
    if (g.businesses.length && R.chance(C.auditBase * (messy ? C.auditMessyMult : 1))) {
      const t12 = U.sum(g.taxPaid);
      const pen = Math.round(R.range(C.auditPenalty[0], C.auditPenalty[1]) * Math.max(t12 * 4, 20000) * (messy ? 1 : 0.35));
      F.spend(g, pen, 'Tax audit penalty');
      TG.rep.event(g, null, 'bad', `Tax audit: penalties of ${U.money(pen)}`, messy ? `Messy books (no accountant) raise audit odds ${C.auditMessyMult}x and penalties` : 'Random audit; your accountant kept penalties small');
    }
    return tax;
  };

  // ---------- valuation & net worth ----------
  F.bizAssets = (g, b) => TG.E.value(g, b) + (b.inventoryValue ? b.inventoryValue(g) : TG.B.inventoryValue(g, b)) + U.sum(b.recv || [], (r) => r.amt);
  F.bizValue = (g, b) => {
    const C = TG.CONFIG.finance.saleMultiple;
    const h = b.hist.slice(-12); const p12 = U.sum(h, (x) => x.profit) * (12 / Math.max(1, h.length));
    let mult = C.base + C.rep * (b.rep - 50) / 10 * 10;
    mult = U.clamp(C.base + (b.rep - 50) * C.rep, 1, 6);
    let v = F.bizAssets(g, b) + Math.max(0, p12) * mult;
    if (b.type === 'tech' && b.tech && b.tech.phase === 'live') v = Math.max(v, b.tech.users * TG.CONFIG.businesses.tech.tech.arpu * 12 * (2 + 6 * b.tech.pmf));
    if (b.type === 'tech' && b.tech && b.tech.phase === 'build') v = Math.max(v, 400000 + b.tech.dev * 30000 * (0.5 + (b.tech.pmfEst || 0.3)));
    if (b.type === 'franchise' && b.fr) v = Math.max(v, b.fr.locations.length * 120000);
    return Math.round(Math.max(0, v));
  };
  F.netWorth = (g, detail) => {
    let assets = Math.max(0, g.cash);
    for (const p of g.properties) { if (p.owned) assets += TG.P.value(g, p); else if (p.landOwned) assets += p.landOwned * g.world.housing; }
    for (const b of g.businesses) assets += F.bizAssets(g, b) * (1 - (b.outside || 0));
    assets += TG.RE.totalValue(g);
    assets += TG.I.value(g);
    if (TG.CR) assets += TG.CR.value(g);
    const liab = F.debt(g) + Math.max(0, -g.cash);
    const nw = assets - liab;
    return detail ? { assets, liab, nw } : nw;
  };

  // ---------- investors ----------
  F.investorOffer = (g, b, pct) => {
    const v = F.bizValue(g, b);
    const C = TG.CONFIG.finance;
    const cash = Math.round(v * pct * C.investorDiscount);
    return { pct, cash, valuation: v };
  };
  F.takeInvestor = (g, b, pct) => {
    const o = F.investorOffer(g, b, pct);
    if (o.cash < 10000) return { ok: false, msg: 'Investors are not interested yet (valuation too low).' };
    if ((b.outside || 0) + pct > 0.9) return { ok: false, msg: 'You would give away almost everything.' };
    b.outside = (b.outside || 0) + pct;
    F.earn(g, o.cash, 'Investor funding', b.id, true);
    TG.rep.event(g, b, 'info', `Sold ${U.pct(pct)} of ${b.name} to investors for ${U.money(o.cash)}`, `Valuation ${U.money(o.valuation)}; investors now own ${U.pct(b.outside)}`);
    return { ok: true, cash: o.cash };
  };
  F.ipo = (g, b) => {
    const C = TG.CONFIG.finance; const v = F.bizValue(g, b);
    if (v < C.ipoMinValue) return { ok: false, msg: `Needs a valuation of ${U.money(C.ipoMinValue)}.` };
    if (b.public) return { ok: false, msg: 'Already public.' };
    const cash = Math.round(v * C.ipoPct * C.ipoPremium);
    b.outside = (b.outside || 0) + C.ipoPct; b.public = true;
    F.earn(g, cash, 'IPO proceeds', b.id, true);
    TG.rep.event(g, b, 'good', `${b.name} went public, raising ${U.money(cash)}`, `Valuation ${U.money(v)}`);
    return { ok: true, cash };
  };
  F.buyBack = (g, b) => {
    if (!b.outside) return { ok: false, msg: 'No outside owners.' };
    const cost = Math.round(F.bizValue(g, b) * b.outside * 1.2);
    if (g.cash < cost) return { ok: false, msg: `Need ${U.money(cost)}.` };
    F.spend(g, cost, 'Share buy-back', b.id, true); b.outside = 0; b.public = false;
    return { ok: true, cost };
  };

  // ---------- cash crunch & bankruptcy ----------
  F.monthEnd = (g) => {
    const C = TG.CONFIG.finance;
    if (g.cash < 0) F.autoCredit(g, -g.cash);
    if (g.cash < 0) {
      g.negMonths++;
      const fee = Math.round(-g.cash * C.negCashFeePct);
      F.spend(g, fee, 'Late fees');
      TG.CREDIT.late(g, 0.5);
      const left = C.bankruptcyMonths - g.negMonths;
      TG.rep.event(g, null, 'major', left > 0 ? `Unpaid bills: collections letters (${left} month${left === 1 ? '' : 's'} before creditors act)` : 'Creditors are acting on unpaid bills',
        `Cash is ${U.money(g.cash)}. Last chances: sell assets, take an emergency loan, cut staff, or find an investor.`, { major: 'cash' });
      if (g.negMonths >= C.bankruptcyMonths) F.insolvency(g);
    } else g.negMonths = 0;
  };
  F.insolvency = (g) => {
    const C = TG.CONFIG.finance, fs = C.bankruptcy.fireSale;
    const d = F.netWorth(g, true);
    const fireNW = d.assets * fs - d.liab;
    if (fireNW > 0) {
      // forced liquidation: sell assets until cash >= 0
      TG.I.liquidateAll(g, fs);
      let guard = 0;
      while (g.cash < 0 && guard++ < 200) {
        const rh = g.re.holdings[0];
        if (rh) { TG.RE.sell(g, rh.id, fs); continue; }
        const idle = g.properties.find((p) => !p.bizId && p.owned);
        if (idle) { TG.P.sell(g, idle.id); continue; }
        const b = g.businesses.slice().sort((x, y) => F.bizValue(g, x) - F.bizValue(g, y))[0];
        if (b) { TG.B.sell(g, b.id, fs, true); continue; }
        break;
      }
      TG.CREDIT.derog(g, 'collections');
      g.negMonths = 0;
      TG.rep.event(g, null, 'major', 'Creditors forced a liquidation of assets', 'Bills went unpaid for months; assets sold at fire-sale prices', { major: 'cash' });
      if (g.cash < 0) F.bankrupt(g, 'Fire sale did not cover the debts');
    } else F.bankrupt(g, 'Debts exceed the value of everything you own');
  };
  F.bankrupt = (g, why) => {
    const C = TG.CONFIG.finance.bankruptcy;
    for (const b of g.businesses.slice()) TG.B.close(g, b, 'bankruptcy', true);
    g.properties = []; g.re.holdings = []; g.loans = []; g.loc.balance = 0;
    TG.I.wipe(g); g.lawsuits = []; g.decisions = []; g.ceo = null;
    { const d = C.keepCash - g.cash; if (d > 0) F.earn(g, d, 'Debts wiped in bankruptcy', null, true); else if (d < 0) F.spend(g, -d, 'Cash taken in bankruptcy', null, true); }
    g.cash = C.keepCash; g.negMonths = 0;
    g.loc.limit = 0; g.player.bankruptcies++; TG.CREDIT.derog(g, 'bankruptcy'); g.player.noLoanUntil = g.month + C.noLoanMonths;
    g.player.ownerBiz = null;
    TG.rep.event(g, null, 'major', 'Full bankruptcy: you lost almost everything', `${why}. You keep ${U.money(C.keepCash)} and damaged credit. Rebuild from here: lease a cheap lot and start small.`, { major: 'cash' });
    TG.rep.news(g, 'You declared bankruptcy', 'bad');
  };
  // voluntary bankruptcy for one business (its loans are discharged, credit takes a hit)
  F.businessBankruptcy = (g, bizId) => {
    const C = TG.CONFIG.finance; const b = g.businesses.find((x) => x.id === bizId); if (!b) return { ok: false };
    const prop = g.properties.find((p) => p.id === b.propId);
    const linked = g.loans.filter((l) => l.bizId === b.id || (prop && l.collateral && l.collateral.id === prop.id) || (l.collateral && b.equip.some((e) => e.id === l.collateral.id)));
    const debt = U.sum(linked, (l) => l.balance);
    const assets = F.bizAssets(g, b) + (prop && prop.owned ? TG.P.value(g, prop) : 0);
    if (debt <= assets) return { ok: false, msg: 'Court refuses: the business can still cover its debts. Sell it instead.' };
    TG.B.close(g, b, 'business bankruptcy', true);
    if (prop) g.properties = g.properties.filter((p) => p !== prop);
    g.loans = g.loans.filter((l) => linked.indexOf(l) < 0);
    TG.CREDIT.derog(g, 'business');
    g.player.noLoanUntil = g.month + 12;
    TG.rep.event(g, null, 'major', `${b.name} filed for business bankruptcy`, `Debts of ${U.money(debt)} exceeded assets of ${U.money(assets)}; ${linked.length} loans discharged`, { major: 'cash' });
    return { ok: true };
  };
  TG.F = F;
})();

</script>
<script>/* js/credit.js */
/* credit.js - v6 credit score and loan applications.
   The score (300-850) is recomputed from your record: on-time months, late/missed payments (fade over time), credit line use,
   debt vs what you own, credit age, recent applications (hard inquiries), bankruptcies and defaults.
   Loans are APPLIED for: you see the odds and the factors first (good / okay / bad), a denial is possible and counts as an inquiry.
   No exploit: on-time credit counts once a month at most, every application is an inquiry, every loan has a fee. */
(function () {
  const TG = globalThis.TG; const R = TG.R, U = TG.U;
  const CR = {};
  const CC = () => TG.CONFIG.credit;
  CR.ensure = (g) => {
    const p = g.player;
    if (!p.cr) { // old saves / new games: build a past record that matches the score they start with
      const s = p.credit || 700; const q = U.clamp((s - 560) / 220, 0, 1);
      p.cr = { start: g.month, age0: Math.round(18 + q * 150 + R.range(0, 20)), prior: Math.round(8 + q * 40), onTime: 0, lastOn: -1, lates: [], inq: [], derog: [] };
      if (q < 0.45) p.cr.lates.push({ m: g.month - R.int(6, 30), sev: 1 + (0.45 - q) * 6 });
      if (p.bankruptcies) p.cr.derog.push({ m: g.month - 1, kind: 'bankruptcy' });
    }
    if (!g.loc.limit && g.loc.limit !== 0) g.loc.limit = g.loc.balance > 0 ? Math.max(g.loc.balance, 20000) : 0;
    return p.cr;
  };
  const fade = (m, now, half) => Math.pow(0.5, Math.max(0, now - m) / half);
  // utilization -> share of points (under 10% is best)
  const utilF = (u) => { const T = [[0, 1], [0.1, 1], [0.3, 0.88], [0.5, 0.65], [0.75, 0.4], [0.9, 0.2], [1, 0.08]]; for (let i = 1; i < T.length; i++) if (u <= T[i][0]) { const [a, fa] = T[i - 1], [b, fb] = T[i]; return fa + (fb - fa) * (u - a) / (b - a); } return 0.05; };
  CR.score = (g) => {
    const cr = CR.ensure(g), c = CC(), P = c.pts, now = g.month; const parts = [];
    // 1) payment history
    const paid = cr.prior + cr.onTime; const lw = U.sum(cr.lates, (x) => x.sev * fade(x.m, now, c.lateHalfLife));
    const thin = 0.55 + 0.45 * Math.min(1, paid / c.thinMonths); const pay = thin * Math.max(0, 1 - c.lateHit * lw);
    parts.push({ k: 'pay', icon: '🧾', label: 'Payment history', pts: P.pay * pay, max: P.pay, mark: lw > 0.8 ? 'bad' : lw > 0.2 || paid < 12 ? 'ok' : 'good',
      why: `${paid} months paid on time${lw > 0.05 ? `, late/missed payments still count (weight ${lw.toFixed(1)}; they fade by half every ${c.lateHalfLife} months)` : ', no recent late payments'}.` });
    // 2) credit line use
    const lim = g.loc.limit || 0; const u = lim > 0 ? g.loc.balance / lim : null;
    const uf = u == null ? 0.75 : utilF(u);
    parts.push({ k: 'util', icon: '💳', label: 'Credit line use', pts: P.util * uf, max: P.util, mark: u == null ? 'ok' : u <= 0.3 ? 'good' : u <= 0.6 ? 'ok' : 'bad',
      why: u == null ? 'No credit line yet: lenders cannot see how you handle one.' : `Using ${U.pct(u)} of your ${U.money(lim)} line. Under 10% scores best; over 75% hurts a lot.` });
    // 3) debt vs what you own
    const nw = TG.F.netWorth(g, true); const debt = TG.F.debt(g); const d = nw.assets > 0 ? debt / nw.assets : (debt > 0 ? 2 : 0);
    const df = Math.pow(U.clamp(1 - d / 0.9, 0, 1), 0.8);
    parts.push({ k: 'debt', icon: '⚖️', label: 'Debt vs what you own', pts: P.debt * df, max: P.debt, mark: d < 0.35 ? 'good' : d < 0.6 ? 'ok' : 'bad', why: `Debt ${U.money(debt)} is ${U.pct(d)} of everything you own (${U.money(nw.assets)}).` });
    // 4) age
    const age = cr.age0 + Math.max(0, now - cr.start); const af = Math.min(1, age / c.ageFull);
    parts.push({ k: 'age', icon: '📅', label: 'Credit age', pts: P.age * af, max: P.age, mark: age >= 96 ? 'good' : age >= 36 ? 'ok' : 'bad', why: `${Math.floor(age / 12)} years ${age % 12} months of credit history. Grows on its own with time.` });
    // 5) applications
    const inq = cr.inq.filter((m) => now - m < c.inqMonths).length; const inf = Math.max(0, 1 - c.inqHit * inq);
    parts.push({ k: 'inq', icon: '📝', label: 'Recent applications', pts: P.inq * inf, max: P.inq, mark: inq <= 1 ? 'good' : inq <= 3 ? 'ok' : 'bad', why: `${inq} loan application(s) in the last ${c.inqMonths} months. Each one (approved or not) lowers the score a little.` });
    // 6) bankruptcies, defaults, repossessions
    let dg = 0; const dl = [];
    for (const x of cr.derog) { const [pts, mo] = c.derog[x.kind] || [60, 48]; const left = Math.max(0, 1 - (now - x.m) / mo); if (left > 0) { dg += pts * left; dl.push(`${x.kind} (${Math.ceil((mo - (now - x.m)) / 12)} yrs left)`); } }
    if (dg > 0) parts.push({ k: 'derog', icon: '🚨', label: 'Bankruptcy / defaults', pts: -dg, max: 0, mark: 'bad', why: `On your record: ${dl.join(', ')}. Fades over time.` });
    const score = Math.round(U.clamp(300 + U.sum(parts, (x) => x.pts), 300, 850));
    return { score, parts };
  };
  CR.sync = (g) => { g.player.credit = CR.score(g).score; return g.player.credit; };
  CR.label = (s) => (s >= 760 ? 'Excellent' : s >= 700 ? 'Good' : s >= 640 ? 'Fair' : s >= 580 ? 'Poor' : 'Very poor');
  CR.tone = (s) => (s >= 700 ? 'good' : s >= 620 ? 'warn' : 'bad');
  // record events
  CR.onTime = (g) => { const cr = CR.ensure(g); if (cr.lastOn === g.month) return; cr.lastOn = g.month; cr.onTime++; };
  CR.late = (g, sev) => { CR.ensure(g).lates.push({ m: g.month, sev: sev || 1 }); CR.sync(g); };
  CR.inquiry = (g) => { CR.ensure(g).inq.push(g.month); };
  CR.derog = (g, kind) => { CR.ensure(g).derog.push({ m: g.month, kind }); CR.sync(g); };

  // ---------- loan quotes ----------
  const L = (type) => TG.CONFIG.finance.loans[type];
  CR.rate = (g, type, score) => {
    const s = score == null ? CR.score(g).score : score; const ind = type === 'business' ? CR.indScore(g) : 0;
    return U.clamp(g.world.baseRate + L(type).spread + Math.max(0, 760 - s) * CC().rateSpread - ind * CC().indRate, 0.01, 0.45);
  };
  // how your industries are doing (for business loans): average cycle level of the industries you are in
  CR.indScore = (g) => { if (!g.businesses.length || !TG.IN) return 0; return U.avg(g.businesses, (b) => TG.IN.score(g, TG.IN.ofBiz(b))); };
  // money available for debt payments each month. Savings count too (lenders treat spare cash, net of what you owe, as if paid out over 20 years);
  // borrowed cash never counts because debt is subtracted first.
  CR.income = (g) => Math.max(0, TG.F.avgProfit(g)) + TG.F.totalPayments(g) + Math.max(0, g.cash - TG.F.debt(g)) / 240;
  // quote: everything the player sees before applying
  CR.quote = (g, type, amount, opts) => {
    opts = opts || {}; const c = CC(); amount = Math.max(0, Math.round(amount || 0));
    const sc = CR.score(g).score; const term = opts.term || (type === 'loc' ? 0 : L(type).term);
    const rate = CR.rate(g, type, sc); const pay = type === 'loc' ? Math.round(amount * TG.CONFIG.finance.loc.minPayPct) : Math.round(TG.F.payment(amount, rate, term));
    const fee = type === 'loc' ? Math.round(c.fee.loc * g.world.priceIdx) : Math.round(amount * (c.fee[type] || 0.015));
    const nw = TG.F.netWorth(g, true); const debt = TG.F.debt(g) + amount; const dv = nw.assets + (opts.asset || 0) > 0 ? debt / (nw.assets + (opts.asset || 0)) : 2;
    const inc = CR.income(g); const dti = (TG.F.totalPayments(g) + (type === 'loc' ? amount * 0.03 : pay)) / Math.max(1500, inc + (opts.extraIncome || 0));
    const inq = CR.ensure(g).inq.filter((m) => g.month - m < c.inqMonths).length;
    const recentLate = U.sum(CR.ensure(g).lates.filter((x) => g.month - x.m < 12), (x) => x.sev);
    const F = []; let z = c.base[type] || 0;
    const add = (label, val, mark, dz, why) => { F.push({ label, val, mark, why }); z += dz; };
    add('Credit score', String(sc), sc >= 720 ? 'good' : sc >= 640 ? 'ok' : 'bad', (sc - 680) / 45, `${CR.label(sc)}. Higher = better odds and a lower rate.`);
    add('Payments vs income', U.pct(Math.min(dti, 9)), dti < 0.35 ? 'good' : dti < 0.55 ? 'ok' : 'bad', dti < 0.35 ? 0.4 : dti < 0.55 ? -0.3 : -1.6 - Math.min(2, dti - 0.55) * 1.5, `All loan payments would take ${U.pct(Math.min(dti, 9))} of the money you make (${U.money(inc + (opts.extraIncome || 0))}/mo, counting profit and some of your spare savings). Under 35% is comfortable.`);
    add('Debt vs what you own', U.pct(Math.min(dv, 9)), dv < 0.45 ? 'good' : dv < 0.7 ? 'ok' : 'bad', dv < 0.45 ? 0.4 : dv < 0.7 ? -0.3 : -1.4 - Math.min(2, dv - 0.7) * 2, `After this loan you would owe ${U.money(debt)} against ${U.money(nw.assets + (opts.asset || 0))} of things you own.`);
    if (opts.ltv != null) add('Down payment', U.pct(1 - opts.ltv), opts.ltv <= 0.75 ? 'good' : opts.ltv <= 0.85 ? 'ok' : 'bad', opts.ltv <= 0.75 ? 0.5 : opts.ltv <= 0.85 ? 0 : -0.8, 'The property backs the loan. A bigger down payment makes lenders safer.');
    if (type === 'equipment') { const cap = CR.equipCap(g); add('Machines as security', U.money(cap), amount <= cap ? 'good' : 'bad', amount <= cap ? 0.4 : -2.5, `Lenders lend up to 70% of what your machines are worth, minus other equipment loans (${U.money(cap)}).`); }
    if (type === 'business') { const x = CR.indScore(g); const st = x > 0.04 ? 'good' : x > -0.04 ? 'ok' : 'bad'; add('Your industries', g.businesses.length ? (x > 0.04 ? 'doing well' : x > -0.04 ? 'steady' : 'struggling') : 'no business yet', g.businesses.length ? st : 'bad', g.businesses.length ? x * 6 : -0.8, 'Lenders check how your industries are doing right now (Industry Outlook).'); }
    add('Recent applications', String(inq), inq <= 1 ? 'good' : inq <= 3 ? 'ok' : 'bad', -0.25 * Math.max(0, inq - 1), 'Lots of applications in a short time looks desperate.');
    add('Late payments (last year)', recentLate > 0 ? recentLate.toFixed(1) : 'none', recentLate <= 0 ? 'good' : recentLate < 2 ? 'ok' : 'bad', -0.7 * recentLate, 'Missed or late payments in the last 12 months.');
    let odds = U.clamp(1 / (1 + Math.exp(-z)), 0.02, 0.97);
    let block = null;
    if (type !== 'emergency' && g.player.noLoanUntil > g.month) block = `Lenders refuse new loans for ${g.player.noLoanUntil - g.month} more months (bankruptcy).`;
    const max = CR.max(g, type); if (amount > max) block = block || `Lenders cap this at about ${U.money(max)} for you.`;
    if (!(amount > 0)) block = block || 'Enter an amount.';
    if (block) odds = 0;
    return { type, amount, term, rate, pay, fee, odds, factors: F, score: sc, block, max };
  };
  CR.equipCap = (g) => Math.max(0, Math.round(U.sum(g.businesses, (b) => TG.E.value(g, b)) * 0.7 - U.sum(g.loans.filter((l) => l.type === 'equipment'), (l) => l.balance)));
  CR.max = (g, type) => {
    if (type === 'equipment') return CR.equipCap(g);
    if (type === 'loc') { const nw = Math.max(0, TG.F.netWorth(g)); return Math.round((20000 + 0.2 * nw + 6 * Math.max(0, TG.F.avgProfit(g))) / 1000) * 1000; }
    if (type === 'mortgage') return Infinity;
    return TG.F.maxLoan(g, type);
  };
  // apply: always an inquiry; approved -> the loan (fee paid out of the proceeds)
  CR.apply = (g, type, amount, opts) => {
    opts = opts || {}; const q = CR.quote(g, type, amount, opts);
    if (q.block) return { ok: false, msg: q.block, quote: q };
    CR.inquiry(g);
    const ok = R.chance(q.odds);
    if (!ok) { CR.sync(g); TG.rep.event(g, null, 'bad', `Loan application denied: ${L(type).label} ${U.money(q.amount)}`, `Odds were ${U.pct(q.odds)}. Weak spots: ${q.factors.filter((f) => f.mark === 'bad').map((f) => f.label.toLowerCase()).join(', ') || 'none, just unlucky'}. It still counts as an application.`); return { ok: false, denied: true, msg: `Denied (odds were ${U.pct(q.odds)}). It counts as an application.`, quote: q }; }
    if (opts.dryApprove) { CR.sync(g); return { ok: true, quote: q }; }
    if (type === 'loc') { g.loc.limit = (g.loc.limit || 0) + q.amount; TG.F.spend(g, q.fee, 'Loan fees'); CR.sync(g); return { ok: true, quote: q, limit: g.loc.limit }; }
    const loan = TG.F.newLoan(g, type, q.amount, Object.assign({}, opts, { term: q.term, rate: q.rate }));
    if (q.fee) TG.F.spend(g, q.fee, 'Loan fees');
    CR.sync(g); return { ok: true, loan, quote: q };
  };
  // monthly: lenders review credit lines (a poor record shrinks the line)
  CR.month = (g) => {
    CR.ensure(g); const s = CR.sync(g);
    if (g.loc.limit > 0 && (s < 560 || g.loans.some((l) => l.missed >= 2))) { const nl = Math.max(Math.round(g.loc.balance), Math.round(g.loc.limit * 0.5 / 1000) * 1000); if (nl < g.loc.limit) { g.loc.limit = nl; TG.rep.event(g, null, 'bad', `The bank cut your credit line to ${U.money(nl)}`, `Credit score ${s}${g.loans.some((l) => l.missed >= 2) ? ' and missed loan payments' : ''}`); } }
  };
  TG.CR_ = CR; TG.CREDIT = CR;
})();

<script>/* js/business.js */
/* business.js - generic business engine: creation, context, odds/risks, fixes, reputation, marketing,
   lawsuits, receivables, fixed costs, monthly orchestration, selling and closing. Models live in models.js. */
(function () {
  const TG = globalThis.TG; const R = TG.R, U = TG.U;
  const B = {};
  B.def = (b) => TG.CONFIG.businesses[b.type];
  B.get = (g, id) => g.businesses.find((x) => x.id === id);

  B.setupCost = (g, type, prop, opts) => {
    const d = TG.CONFIG.businesses[type];
    let c = d.setupCost * g.world.priceIdx;
    if (d.license) c += d.license.fee;
    if (g.world.licenseFees[type]) c += g.world.licenseFees[type];
    if (type === 'franchise' && opts && opts.fromBiz) c *= 0.7;
    if (type === 'farm' && opts) c += TG.M.farmSetupExtra(g, prop, opts.ent || TG.M.bestEnterprise(prop));
    return Math.round(c);
  };

  B.start = (g, type, propId, opts) => {
    opts = opts || {};
    const C = TG.CONFIG, d = C.businesses[type];
    const prop = g.properties.find((p) => p.id === propId);
    if (!prop) return { ok: false, msg: 'Pick a property you own or lease.' };
    if (prop.bizId) return { ok: false, msg: 'That property already hosts a business.' };
    if (d.model === 'farm' && !opts.ent) opts.ent = TG.M.bestEnterprise(prop);
    const cost = B.setupCost(g, type, prop, opts);
    if (g.cash < cost) return { ok: false, msg: `Setup costs ${U.money(cost)}.` };
    const n = g.businesses.filter((x) => x.type === type).length;
    const bid = U.uid('b'), bname = opts.name || (d.name + (n ? ' #' + (n + 1) : ''));
    if (TG.LG) TG.LG.setName(g, 'b:' + bid, { n: bname, i: d.icon, grp: 'biz' });
    TG.F.spend(g, cost, 'Business setup', bid, true);
    const b = {
      id: bid, type, name: bname, propId, region: prop.region, loc: prop.loc,
      labor: prop.labor, traffic: prop.traffic, sqft: prop.sqft, acres: prop.acres, founded: g.month,
      rep: d.startRep != null ? d.startRep : C.reputation.start, staff: [], spec: {}, equip: [], fixes: {}, ins: {},
      ads: { budget: 0, channel: 'social' }, pace: 'normal', ask: null, hits: [], boost: null, recv: [], hist: [],
      m: { rev: 0, cost: 0, lines: {} }, revAvg: 0, outside: 0, closed: 0, licensePending: d.license ? d.license.months : 0,
      qHits: [], bad: [], insHike: 1, lastUtil: 0.8, setup: cost, orders: {}, backlog: 0, shut: 0,
    };
    prop.bizId = b.id;
    TG.M.init(g, b, prop, opts);
    if (TG.ST) TG.ST.ensure(b); // v7: the supplies shelf exists from day one, so you can stock it before the first month
    g.businesses.push(b);
    TG.rep.event(g, b, 'info', `Opened ${b.name}`, `Setup cost ${U.money(cost)}${d.license ? `; license takes ${d.license.months} months before opening` : ''}`);
    return { ok: true, biz: b };
  };

  // Minimal equipment + staff to open the doors. Returns the cost list (dry run if !apply).
  B.quickSetup = (g, b, apply, tierPref) => {
    const d = B.def(b); const plan = TG.M.needs(g, b);
    let cost = 0; const steps = [];
    for (const n of plan.equip) {
      const have = b.equip.filter((x) => x.type === n.type && x.broken !== 'destroyed').length;
      for (let i = have; i < n.count; i++) { const tier = tierPref || 'standard'; const pr = TG.E.price(g, b, n.type, tier); cost += pr; steps.push({ kind: 'equip', type: n.type, tier, cost: pr }); }
    }
    for (const n of plan.staff) {
      const have = b.staff.filter((e) => e.role === n.role).length;
      for (let i = have; i < n.count; i++) steps.push({ kind: 'staff', role: n.role });
    }
    if (!apply) return { cost, steps };
    for (const s of steps) {
      if (s.kind === 'equip') { if (g.cash >= s.cost) TG.E.buy(g, b, s.type, s.tier); }
      else { const pool = TG.S.poolFor(g, b, s.role); if (pool.length) { const best = pool.slice().sort((x, y) => (y.skill + y.attitude * 0.5) / y.wage - (x.skill + x.attitude * 0.5) / x.wage)[0]; TG.S.hire(g, b, best); } }
    }
    if (TG.D) TG.D.syncTargets(b);
    // v7: a first supplies order (you pay for it); after this, no manager = you reorder yourself
    if (TG.ST && TG.ST.def(b)) { TG.ST.ensure(b); const q = TG.ST.suggest(b, g); if (q > 0 && g.cash > q * TG.ST.unitCost(g, b) * 2) TG.ST.buy(g, b, q, 0); }
    for (const t of d.insurance) if (t === 'liability' || t === 'malpractice' || (t === 'property' && g.properties.find((p) => p.id === b.propId && p.owned))) b.ins[t] = true;
    return { cost, steps };
  };

  // aggregate active fix effects
  B.fixAgg = (b) => {
    const d = B.def(b); const o = { equipBreak: {}, demand: 0, morale: 0, cogsAdd: 0, revCostPct: 0, skillGrowth: 1, repTarget: 0 };
    for (const f of d.fixes) {
      if (!b.fixes[f.id]) continue;
      for (const k in f) {
        if (['id', 'label', 'cost', 'monthly', 'reduces', 'note'].indexOf(k) >= 0) continue;
        const v = f[k];
        if (k === 'equipBreak') { for (const t in v) o.equipBreak[t] = (o.equipBreak[t] || 1) * v[t]; }
        else if (k === 'demand' || k === 'morale' || k === 'cogsAdd' || k === 'revCostPct' || k === 'repTarget' || k === 'payrollAdd' || k === 'materialAdd') o[k] = (o[k] || 0) + v;
        else if (k === 'skillGrowth') o.skillGrowth = Math.max(o.skillGrowth, v);
        else o[k] = v;
      }
    }
    b.fixesOn = o; return o;
  };
  B.fixMonthly = (g, b) => {
    const d = B.def(b); let t = 0;
    const units = b.equip.filter((x) => { const ed = TG.E.def(b, x.type); return ed && (ed.critical || ed.cap) && !ed.support; }).length;
    for (const f of d.fixes) if (b.fixes[f.id]) { t += (f.monthly || 0) * g.world.priceIdx; if (f.perUnitMonthly) t += f.perUnitMonthly * Math.max(1, units) * g.world.priceIdx; }
    return Math.round(t);
  };
  B.buyFix = (g, b, fixId) => {
    const f = B.def(b).fixes.find((x) => x.id === fixId); if (!f || b.fixes[fixId]) return { ok: false };
    const cost = Math.round((f.cost || 0) * g.world.priceIdx);
    if (g.cash < cost) return { ok: false, msg: `Costs ${U.money(cost)}.` };
    TG.F.spend(g, cost, 'Upgrades', b.id, true); b.fixes[fixId] = { since: g.month };
    if (fixId === 'bulk') b.fixes[fixId].until = g.month + (f.lockMonths || 24);
    if (fixId === 'research' && b.tech) TG.M.techResearch(g, b);
    B.fixAgg(b);
    return { ok: true };
  };
  B.dropFix = (g, b, fixId) => { delete b.fixes[fixId]; B.fixAgg(b); };

  B.baseRev = (g, b) => TG.M.baseRev(g, b);
  B.space = (b) => (B.def(b).space.unit === 'acres' ? (b.farm ? b.farm.acres : b.acres) : b.sqft);
  B.owner = () => false; // owner labor was removed: every business is run by its employees

  // ---------- context: staff stats & risk modifiers ----------
  B.ctx = (g, b) => {
    const C = TG.CONFIG, d = B.def(b);
    const key = TG.S.keyStaff(b), all = TG.S.allStaff(b);
    const own = B.owner(g, b);
    const avg = (f, def) => (key.length ? U.avg(key, f) : def);
    const ctx = {
      key, all, own, down: 0, warnings: [], revAvg: Math.max(b.revAvg || 0, B.baseRev(g, b) * 0.3, 2000),
      skill: avg((e) => e.skill, own ? 55 : 35), attitude: avg((e) => e.attitude, own ? 65 : 45), reliability: avg((e) => e.reliability, 60),
      honesty: all.length ? U.avg(all, (e) => e.honesty) : 70, temper: avg((e) => e.temper, 30), morale: all.length ? U.avg(all, (e) => e.morale) : 60,
      ambition: avg((e) => e.ambition, 40), busy: b.lastUtil || 0.8, util: b.lastUtil || 0.8,
      weather: TG.W.weatherOf(g, b.region), streakMult: 1,
    };
    const recentBad = (b.bad || []).filter((m) => g.month - m <= C.streak.window).length;
    if (recentBad >= C.streak.threshold) ctx.streakMult = C.streak.mult;
    // quality
    const exp = g.player.exp[b.type] || 0;
    let q = 50 + (ctx.skill - 50) * 0.5 + (ctx.attitude - 50) * 0.25;
    const eqList = b.equip.filter((x) => x.broken !== 'destroyed');
    if (eqList.length) { q += (1 - TG.E.avgWear(b) / 100) * 10 - 5; q += (U.avg(eqList, (x) => C.equipTiers[x.tier].out) - 1) * 25; }
    if (own) q += C.owner.operatedQuality + Math.min(C.owner.expQualityCap, (exp / 12) * C.owner.expQualityPerYear);
    else if (!b.spec.gm) q += C.owner.absentQuality;
    for (const h of b.qHits) q -= h.amt;
    ctx.quality = U.clamp(q, 0, 100);
    return ctx;
  };

  B.mod = (g, b, ctx, key) => {
    const s = b.spec || {}; const w = ctx.weather;
    switch (key) {
      case 'skill': return 1.6 - ctx.skill / 100;
      case 'attitude': return 1.6 - ctx.attitude / 100;
      case 'temper': return 0.6 + ctx.temper / 100;
      case 'honestyLow': return 1.8 - ctx.honesty / 100;
      case 'reliability': return 1.6 - ctx.reliability / 100;
      case 'morale': return 1.7 - ctx.morale / 85;
      case 'ambition': return 0.6 + ctx.ambition / 100;
      case 'busy': return 0.7 + 0.6 * U.clamp(ctx.busy, 0, 1.3);
      case 'noHR': return s.hr ? 0.7 : 1.15;
      case 'noOps': return s.ops ? 0.6 : s.gm ? 0.85 : 1.2;
      case 'noSafety': return s.safety ? 0.45 : 1.2;
      case 'noMech': return TG.E.hasMech(b) ? 0.6 : 1.2;
      case 'noAccountant': return s.accountant ? 0.6 : 1.2;
      case 'noLawyer': return s.lawyer ? 0.6 : 1.1;
      case 'equipWear': return 0.5 + TG.E.avgWear(b) / 60;
      case 'supportWear': {
        const sup = b.equip.filter((x) => TG.E.def(b, x.type) && TG.E.def(b, x.type).support);
        if (!sup.length) return 2.2;
        if (sup.some((x) => x.broken)) return 3;
        const wv = U.avg(sup, TG.E.effWear) / 100; return 0.4 + 2 * Math.pow(wv, 1.5);
      }
      case 'scale': return U.clamp(Math.sqrt(Math.max(1, b.staff.length) / 5), 0.6, 8);
      case 'econ': return { boom: 0.85, slowdown: 1.1, recession: 1.4, recovery: 1 }[g.world.phase];
      case 'weather': return w.sev > 0 ? 0.5 + w.sev * 3 : 0.4;
      case 'drought': return w.kind === 'drought' || w.kind === 'heat' ? 4 : 0.5;
      case 'rush': return b.pace === 'rush' ? 1.6 : b.pace === 'careful' ? 0.7 : 1;
      case 'priceHigh': { const r = TG.PR.ratio(g, b); return r > 1.05 ? Math.min(4, 1 + (r - 1) * 4) : r < 0.95 ? 0.6 : 1; }
      case 'world_shortage': return g.world.shortage[B.def(b).cat] ? 3 : 0.7;
      case 'crime': return (TG.CONFIG.locations[b.loc] || { crime: 1 }).crime * (g.world.crime > 0 ? 2 : 1);
      case 'rep': return b.rep < 30 ? 1.4 : b.rep > 70 ? 0.7 : 1;
      case 'labor': return 1.6 - b.labor;
      case 'emissions': return g.world.emissions > 0 ? 2.5 : 1;
      case 'launched': return b.tech && b.tech.phase === 'live' ? 1 : 0;
      default: return 1;
    }
  };
  const MODWORDS = {
    skill: (c) => `avg skill ${Math.round(c.skill)}`, attitude: (c) => `staff attitude ${Math.round(c.attitude)}`, temper: () => 'hot tempers on staff',
    honestyLow: (c) => `staff honesty`, reliability: (c) => `reliability ${Math.round(c.reliability)}`, morale: (c) => `morale ${Math.round(c.morale)}`,
    ambition: () => 'ambitious staff', busy: (c) => `workload ${U.pct(c.busy)}`, noHR: () => 'HR manager', noOps: () => 'ops manager',
    noSafety: () => 'safety officer', noMech: () => 'mechanic', noAccountant: () => 'accountant', noLawyer: () => 'lawyer',
    equipWear: () => 'equipment wear', supportWear: () => 'support equipment condition', scale: (c, b) => `${b.staff.length} staff`,
    econ: (c, b, g) => `${TG.W.phaseLabel(g).toLowerCase()} economy`, weather: (c) => (c.weather.sev ? TG.CONFIG.weather.kinds[c.weather.kind].label.toLowerCase() : 'mild weather'),
    drought: (c) => (c.weather.kind === 'drought' ? 'drought' : 'normal water'), rush: (c, b) => `${b.pace} pace`, priceHigh: (c, b) => `price ${TG.PR.label(c.priceR || 1)}`,
    world_shortage: () => 'supply shortage', crime: () => 'local crime', rep: (c, b) => `reputation ${Math.round(b.rep)}`, labor: () => 'labor pool', emissions: () => 'emissions rules',
  };
  const NO = { noHR: 1, noOps: 1, noSafety: 1, noMech: 1, noAccountant: 1, noLawyer: 1 };
  B.riskP = (g, b, ctx, r) => {
    const d = B.def(b); let p = r.base; const parts = [];
    for (const k of r.mods || []) {
      const m = B.mod(g, b, ctx, k); p *= m;
      if (MODWORDS[k] && (m > 1.12 || m < 0.88)) {
        const w = MODWORDS[k](ctx, b, g);
        parts.push(NO[k] ? (m > 1 ? 'no ' + w : w + ' helps') : (m > 1 ? w + ' (raises odds)' : w + ' (lowers odds)'));
      }
    }
    for (const f of d.fixes) if (b.fixes[f.id] && f.reduces && f.reduces[r.id]) { p *= f.reduces[r.id]; parts.push('with ' + f.label.toLowerCase()); }
    const bl = B.backlogMult(b); if (bl > 1.01) { p *= bl; parts.push(`unfinished work x${bl.toFixed(2)}`); }
    p *= (TG.CONFIG.difficulty.eventFreq[g.settings.eventFreq] || 1) * ctx.streakMult;
    return { p: U.clamp(p, 0, 0.95), parts };
  };

  B.rollRisks = (g, b, ctx) => {
    const d = B.def(b);
    for (const r of d.risks) {
      if (!r.base) continue;
      if (r.sev.harvestOnly && !(b.farm && TG.M.isHarvest(g, b))) continue;
      const { p, parts } = B.riskP(g, b, ctx, r);
      if (R.chance(p)) B.applyRisk(g, b, ctx, r, p, parts);
    }
  };
  B.applyRisk = (g, b, ctx, r, p, parts, extraWhy) => {
    const C = TG.CONFIG, s = r.sev;
    const why = `${U.pct(p, 1)} chance this month` + (parts && parts.length ? ': ' + parts.join(', ') : '') + (extraWhy ? '. ' + extraWhy : '');
    let loss = 0, txt = r.label; const bits = [];
    if (s.revPct) loss += ctx.revAvg * R.range(s.revPct[0], s.revPct[1]);
    if (s.cash) loss += R.range(s.cash[0], s.cash[1]) * g.world.priceIdx;
    if (loss > 0) {
      loss = Math.round(loss);
      TG.F.spend(g, loss, 'Incidents', b.id); bits.push(`cost ${U.money(loss)}`);
      if (s.ins) TG.F.claim(g, b, s.ins, loss, r.label);
    }
    if (s.rep) { const x = R.range(s.rep[0], s.rep[1]) * (b.rep > 70 ? 0.75 : b.rep < 30 ? 1.25 : 1); b.rep = U.clamp(b.rep - x, 0, 100); bits.push(`reputation -${Math.round(x)}`); B.prCard(g, b, r.label, x); }
    if (s.down) { const x = R.range(s.down[0], s.down[1]); ctx.down = U.clamp(ctx.down + x, 0, 1); bits.push(`${U.pct(x)} of capacity lost`); }
    if (s.demandHit) { const soft = (b.fixesOn && b.fixesOn.hitSoften) || 0; const mult = 1 - (1 - s.demandHit[0]) * (1 - soft); b.hits.push({ mult, months: s.demandHit[1], label: r.label }); bits.push(`demand x${mult.toFixed(2)} for ${s.demandHit[1]} mo`); }
    if (s.quit) {
      const pool = ctx.key.length ? ctx.key : b.staff;
      if (pool.length) { const e = s.quit === 'best' ? pool.slice().sort((x, y) => y.skill - x.skill)[0] : R.pick(pool); TG.S.leave(g, b, e, r.label.toLowerCase()); }
    }
    if (s.quality && !(b.fixesOn && b.fixesOn.qualityShield)) { b.qHits.push({ amt: s.quality[0], months: s.quality[1] }); bits.push(`quality -${s.quality[0]} for ${s.quality[1]} mo`); }
    if (s.delayExtra) { const x = R.int(s.delayExtra[0], s.delayExtra[1]); for (const rv of b.recv) rv.due += x; bits.push(`payments delayed ${x} mo`); }
    if (s.churn && b.tech) { const x = R.range(s.churn[0], s.churn[1]); b.tech.users = Math.round(b.tech.users * (1 - x)); bits.push(`${U.pct(x)} of users left`); }
    if (s.yield && b.farm) { const x = R.range(s.yield[0], s.yield[1]); TG.M.farmEnsure(b); b.farm.areas.crops.seasonYield *= x; b.farm.areas.orchard.seasonYield *= x; bits.push(`harvest outlook x${x.toFixed(2)}`); }
    let sued = false;
    if (s.suit && (!s.suitChance || R.chance(s.suitChance))) {
      const amt = Math.max(C.lawsuits.suitMin, ctx.revAvg * R.range(s.suit[0], s.suit[1]));
      B.lawsuit(g, b, 'Lawsuit: ' + r.label, amt, s.ins, why); sued = true;
    }
    if (s.injury && !sued && R.chance(s.injury * C.lawsuits.injurySuitChance)) { B.lawsuit(g, b, 'Injury lawsuit: ' + r.label, Math.max(C.lawsuits.suitMin, ctx.revAvg * R.range(0.3, 1.5)), s.ins || 'liability', why); }
    b.bad.push(g.month); if (b.bad.length > 10) b.bad.shift();
    TG.rep.event(g, b, sued || (s.rep && s.rep[1] >= 12) ? 'major' : 'bad', txt + (bits.length ? ` (${bits.join(', ')})` : ''), why, sued ? { major: 'lawsuit' } : null);
  };

  B.prCard = (g, b, label, hit) => {
    if (hit < 6) return;
    const P = TG.CONFIG.reputation.pr;
    const opts = Object.keys(P).map((k) => ({ id: k, label: `${P[k].label} (${P[k].cost != null ? U.money(P[k].cost) : U.money(b.revAvg * P[k].costRev)})` }));
    opts.push({ id: 'none', label: 'Do nothing (reputation recovers slowly)' });
    TG.D.add(g, { kind: 'pr', bizId: b.id, title: `Reputation hit at ${b.name}`, text: `${label}. Reputation is now ${Math.round(b.rep)}/100.`, why: 'Reputation falls fast and recovers slowly; PR can speed it up but can also flop.', options: opts, def: 'none' });
  };
  B.doPR = (g, b, kind, by) => {
    const P = TG.CONFIG.reputation.pr[kind]; if (!P) return;
    const cost = Math.round(P.cost != null ? P.cost * g.world.priceIdx : b.revAvg * P.costRev);
    TG.F.spend(g, cost, 'PR & marketing', b.id);
    const RC = TG.CONFIG.reputation; const nth = TG.USES.take(b, 'pr', g.month);
    if (nth > RC.prPerMonth) { const y = R.range(RC.prSpamLoss[0], RC.prSpamLoss[1]); b.rep = U.clamp(b.rep - y, 0, 100); TG.rep.decision(g, b, by, `${P.label} again? It looks desperate: reputation -${Math.round(y)}`, 'bad'); return; }
    if (R.chance(P.fail)) { TG.rep.decision(g, b, by, `${P.label} flopped (${U.money(cost)})`, 'bad'); return; }
    const x = R.range(P.rep[0], P.rep[1]) * (nth === 1 ? 1 : RC.prSecond); b.rep = U.clamp(b.rep + x, 0, 100);
    TG.rep.decision(g, b, by, `${P.label}: reputation +${Math.round(x)} (${U.money(cost)})`, 'good');
  };

  // ---------- lawsuits ----------
  B.lawsuit = (g, b, label, amount, insType, why) => {
    const C = TG.CONFIG.lawsuits;
    amount = Math.round(amount);
    const ls = { id: U.uid('s'), bizId: b ? b.id : null, own: b ? null : (g._own || null), label, amount, ins: insType || null, left: R.int(C.months[0], C.months[1]), status: 'open', why };
    g.lawsuits.push(ls);
    const win = B.winChance(g, b);
    TG.rep.event(g, b, 'major', `${label}: sued for ${U.money(amount)}`, why || 'See risk factors', { major: 'lawsuit' });
    TG.D.add(g, { kind: 'lawsuit', bizId: b ? b.id : null, suitId: ls.id, title: label, text: `Claim of ${U.money(amount)}${insType && b && b.ins[insType] ? ` (your ${TG.CONFIG.finance.insurance[insType].label.toLowerCase()} insurance covers most of a loss)` : ' (not insured)'}. Decide within ${ls.left} months.`,
      why: `Estimated chance to win in court: ${U.pct(win)}. Legal fees about ${U.money(amount * C.fees)}.`,
      options: [{ id: 'settle', label: `Settle (about ${U.money(amount * (C.settleShare[0] + C.settleShare[1]) / 2)})` }, { id: 'fight', label: `Fight it (${U.pct(win)} win odds)` }], def: null, persist: true });
    return ls;
  };
  B.winChance = (g, b) => {
    const C = TG.CONFIG.lawsuits;
    const lawyer = (b && b.spec && b.spec.lawyer) || (b && b.type === 'law' && b.staff.filter((e) => e.role === 'attorney').sort((x, y) => y.skill - x.skill)[0]);
    return U.clamp(C.baseWin + (lawyer ? C.lawyerWinBonus * (0.5 + lawyer.skill / 100) : 0) + (b ? (b.rep - 50) * C.repWin : 0), 0.05, 0.9);
  };
  B.resolveSuit = (g, suitId, how, by) => {
    const C = TG.CONFIG.lawsuits; const ls = g.lawsuits.find((x) => x.id === suitId); if (!ls || ls.status !== 'open') return;
    const b = ls.bizId ? B.get(g, ls.bizId) : null;
    if (!b && ls.own && TG.LG && !g._own) return TG.LG.within(g, ls.own, () => B.resolveSuit(g, suitId, how, by));
    if (how === 'settle') {
      const amt = Math.round(ls.amount * R.range(C.settleShare[0], C.settleShare[1]));
      TG.F.spend(g, amt, 'Legal settlements', b && b.id); if (b) TG.F.claim(g, b, ls.ins, amt, ls.label);
      ls.status = 'settled'; TG.rep.decision(g, b, by, `Settled "${ls.label}" for ${U.money(amt)}`);
      g.lawsuits = g.lawsuits.filter((x) => x !== ls);
    } else {
      const fees = Math.round(ls.amount * C.fees * (b && b.spec && b.spec.lawyer ? 0.4 : 1));
      TG.F.spend(g, fees, 'Legal fees', b && b.id); ls.status = 'fighting'; ls.win = B.winChance(g, b);
      TG.rep.decision(g, b, by, `Chose to fight "${ls.label}" (${U.pct(ls.win)} win odds, fees ${U.money(fees)})`);
    }
  };
  B.monthSuits = (g) => {
    const C = TG.CONFIG.lawsuits;
    for (const ls of g.lawsuits.slice()) {
      ls.left--;
      if (ls.left > 0) continue;
      const b = ls.bizId ? B.get(g, ls.bizId) : null;
      const prevOwn = g._own; if (!b && ls.own) g._own = ls.own;
      try {
      if (ls.status === 'open') {
        const amt = Math.round(ls.amount * C.defaultMult);
        TG.F.spend(g, amt, 'Court judgments', b && b.id); if (b) TG.F.claim(g, b, ls.ins, amt, ls.label);
        TG.rep.event(g, b, 'major', `Default judgment: ${ls.label} (${U.money(amt)})`, 'Nobody responded to the lawsuit in time (no lawyer or CEO to handle it)', { major: 'lawsuit' });
        TG.D.removeFor(g, (d) => d.suitId === ls.id);
      } else if (ls.status === 'fighting') {
        if (R.chance(ls.win)) { TG.rep.event(g, b, 'good', `Won the lawsuit: ${ls.label}`, `${U.pct(ls.win)} odds`); if (b) b.rep = U.clamp(b.rep + 2, 0, 100); }
        else { TG.F.spend(g, ls.amount, 'Court judgments', b && b.id); if (b) { TG.F.claim(g, b, ls.ins, ls.amount, ls.label); b.rep = U.clamp(b.rep - 4, 0, 100); } TG.rep.event(g, b, 'major', `Lost the lawsuit: ${ls.label} (${U.money(ls.amount)})`, `Had ${U.pct(ls.win)} odds to win`, { major: 'lawsuit' }); }
      }
