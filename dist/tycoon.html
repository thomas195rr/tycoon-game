<script>/* js/managers.js */
/* managers.js - decision cards (player choices) and the manager / CEO AI that handles them.
   Managers decide from context; decision quality depends on skill, morale, traits. No standing orders. */
(function () {
  const TG = globalThis.TG; const R = TG.R, U = TG.U;
  const D = {};
  const COVER = {
    broken: ['ops', 'mechanic', 'gm'], poach: ['hr', 'gm'], theft: ['hr', 'gm', 'accountant'], lawsuit: ['lawyer'],
    pr: ['ads', 'gm'], evict: [], hire: ['hr', 'gm'], maint: ['mechanic', 'ops', 'gm'], raise: ['hr', 'gm'],
    stock: ['ops', 'gm'], bid: ['gm', 'ops'], franchise: ['gm', 'ops'], farm: ['gm', 'ops'], expand: ['ops', 'gm'],
  };

  D.add = (g, dec) => {
    const dup = g.decisions.find((d) => d.kind === dec.kind && d.bizId === dec.bizId && ((dec.itemId && d.itemId === dec.itemId) || (dec.empId && d.empId === dec.empId) || (dec.suitId && d.suitId === dec.suitId) || (dec.reId && d.reId === dec.reId && d.unit === dec.unit) || (dec.kind === 'pr' && d.kind === 'pr')));
    if (dup) return dup;
    dec.id = U.uid('d'); dec.month = g.month; g.decisions.push(dec); return dec;
  };
  D.removeFor = (g, pred) => { g.decisions = g.decisions.filter((d) => !pred(d)); };

  // manager quality: chance a decision is a good one
  D.pGood = (g, e, isCeo) => {
    const C = TG.CONFIG.decisions;
    let p = C.baseGood + e.skill * C.skillWeight + (e.morale - 50) * C.moraleWeight;
    if (isCeo) { const n = g.businesses.length; p -= Math.max(0, n - TG.CONFIG.ceo.spanFree) * TG.CONFIG.ceo.spanPenalty; }
    return U.clamp(p, C.minGood, C.maxGood);
  };
  D.handler = (g, b, kind) => {
    const roles = COVER[kind] || [];
    if (b && b.spec) for (const r of roles) { const e = b.spec[r]; if (e) return { e, label: `${TG.CONFIG.specialists[r].label} ${e.name}`, role: r, p: D.pGood(g, e) }; }
    if (g.ceo && (kind !== 'evict')) return { e: g.ceo, label: `CEO ${g.ceo.name}`, role: 'ceo', p: D.pGood(g, g.ceo, true) };
    if (kind === 'evict' && g.re.manager) return { e: g.re.manager, label: `Property manager ${g.re.manager.name}`, role: 'rem', p: D.pGood(g, g.re.manager) };
    return null;
  };
  // roll good / ok / bad
  D.roll = (h) => { const C = TG.CONFIG.decisions; if (R.chance(h.p)) return 'good'; return R.chance(C.okShare) ? 'ok' : 'bad'; };
  const biz = (g, d) => (d.bizId ? TG.B.get(g, d.bizId) : null);

  // apply a chosen option
  D.resolve = (g, dec, opt, by) => {
    const b = biz(g, dec);
    g.decisions = g.decisions.filter((x) => x !== dec);
    if ((dec.bizId && !b) || opt == null) return;
    const S = TG.S, E = TG.E, cs = TG.CONFIG.staff;
    switch (dec.kind) {
      case 'broken':
        if (opt === 'repair') E.repair(g, b, dec.itemId, by);
        else if (opt.startsWith('replace_')) E.replace(g, b, dec.itemId, opt.slice(8), by);
        else if (by) TG.rep.decision(g, b, by, `Left ${dec.title.toLowerCase()} as is`);
        break;
      case 'poach': {
        const e = S.allStaff(b).find((x) => x.id === dec.empId); if (!e) break;
        if (opt === 'counter') {
          e.wage = Math.round(e.wage * (1 + cs.counterOfferPct)); e.loyalty = U.clamp(e.loyalty + 15, 0, 100); e.morale = U.clamp(e.morale + 8, 0, 100);
          if (R.chance(cs.counterAccept || 0.75)) TG.rep.staff(g, b, `${by ? by + ': ' : ''}${e.name} accepted a counter-offer (now ${U.money(e.wage)}/mo)`);
          else S.leave(g, b, e, 'took the competitor offer anyway', false);
        } else S.leave(g, b, e, 'poached by a competitor', false);
        break;
      }
      case 'theft': {
        const e = S.allStaff(b).find((x) => x.id === dec.empId); if (!e) break;
        if (opt === 'fire') S.fire(g, b, e.id, 'caught stealing'); else { e.morale = U.clamp(e.morale - 6, 0, 100); e.honesty = U.clamp(e.honesty + 8, 0, 100); TG.rep.staff(g, b, `${by ? by + ' gave' : 'Gave'} ${e.name} a warning for theft`); }
        break;
      }
      case 'pr': if (opt !== 'none') TG.B.doPR(g, b, opt, by); break;
      case 'lawsuit': TG.B.resolveSuit(g, dec.suitId, opt, by); break;
      case 'evict': if (opt === 'evict') TG.RE.evict(g, dec.reId, dec.unit, by || 'You'); break;
      default: if (dec.apply) dec.apply(g, opt, by);
    }
  };

  // a manager picks an option for a card (context-aware); returns { opt, outcome, why }
  D.choose = (g, dec, h) => {
    const b = biz(g, dec); const out = D.roll(h); const trait = h.e.trait;
    const good = out === 'good'; const bad = out === 'bad';
    switch (dec.kind) {
      case 'broken': {
        const it = b.equip.find((x) => x.id === dec.itemId); if (!it) return { opt: null };
        const d = TG.E.def(b, it.type); const destroyed = it.broken === 'destroyed';
        const old = it.age / (d.life || 120); const wear = TG.E.effWear(it);
        const mech = TG.E.hasMech(b); const cash = g.cash; const std = TG.E.price(g, b, it.type, 'standard');
        const profitable = U.sum(b.hist.slice(-3), (x) => x.profit) > 0;
        let best, why;
        if (!destroyed && old < 0.75 && wear < 75) { best = 'repair'; why = `still young (${(it.age / 12).toFixed(1)} yrs) and repair is cheaper`; }
        else if (cash < std * 1.5) { best = mech ? 'replace_used' : (destroyed ? 'replace_budget' : 'repair'); why = mech ? `cash is tight (${U.money(cash)}) and a mechanic can keep a used one running` : `cash is tight (${U.money(cash)}) and there is no mechanic to keep a used one alive`; }
        else if (cash > std * 6 && profitable) { best = d.critical ? 'replace_premium' : 'replace_standard'; why = `cash is healthy (${U.money(cash)}) and ${d.critical ? 'it is critical, so reliability pays' : 'standard is good value'}`; }
        else { best = mech ? 'replace_used' : 'replace_standard'; why = mech ? 'a mechanic on staff makes used gear a good deal' : 'no mechanic, so newer gear avoids breakdowns'; }
        if (trait === 'reckless' && !good) { best = 'replace_premium'; why = 'reckless: wants the best regardless of cash'; }
        if (trait === 'cautious' && !destroyed && !good) { best = 'repair'; why = 'cautious: patches it up'; }
        if (bad) {
          const alts = destroyed ? ['replace_premium', 'leave'] : ['repair', 'replace_premium', 'leave'];
          const alt = R.pick(alts.filter((x) => x !== best)) || 'leave';
          why = alt === 'leave' ? 'did not get around to it' : alt === 'repair' ? `patched a worn-out machine (${Math.round(wear)}% wear) that will likely break again` : `bought top-tier with only ${U.money(cash)} in the bank`;
          best = alt;
        }
        if (d.critical === undefined && best === 'leave' && !bad) best = 'repair';
        return { opt: best, outcome: out, why };
      }
      case 'poach': {
        const e = TG.S.allStaff(b).find((x) => x.id === dec.empId); if (!e) return { opt: null };
        const worth = e.skill >= 65 && (e.role in (b.spec || {}) || TG.CONFIG.businesses[b.type].roles[e.role]?.licensed || e.skill >= 75);
        let opt = worth ? 'counter' : 'let'; if (bad) opt = opt === 'counter' ? 'let' : 'counter';
        return { opt, outcome: out, why: worth ? `${e.name} (skill ${Math.round(e.skill)}) is hard to replace` : `${e.name} can be replaced` };
      }
      case 'theft': return { opt: bad ? 'warn' : 'fire', outcome: out, why: bad ? 'went soft on it' : 'zero tolerance for theft' };
      case 'pr': {
        const rep = b.rep; const cash = g.cash;
        let opt = rep < 25 && cash > 60000 ? 'prfirm' : cash > 30000 ? 'charity' : 'apology';
        if (bad) opt = cash < 30000 ? 'prfirm' : 'none';
        return { opt, outcome: out, why: `reputation ${Math.round(rep)}/100, cash ${U.money(cash)}` };
      }
      case 'lawsuit': {
        const ls = g.lawsuits.find((x) => x.id === dec.suitId); if (!ls) return { opt: null };
        const win = TG.B.winChance(g, b); const cfg = TG.CONFIG.lawsuits;
        const settleCost = ls.amount * (cfg.settleShare[0] + cfg.settleShare[1]) / 2;
        const fightCost = ls.amount * cfg.fees * (b && b.spec && b.spec.lawyer ? 0.4 : 1) + (1 - win) * ls.amount;
        let opt = fightCost < settleCost ? 'fight' : 'settle'; if (bad) opt = opt === 'fight' ? 'settle' : 'fight';
        return { opt, outcome: out, why: `win odds ${U.pct(win)}: expected cost to fight ${U.money(fightCost)} vs settle ${U.money(settleCost)}` };
      }
      case 'evict': return { opt: bad ? 'wait' : 'evict', outcome: out, why: 'tenant 2+ months behind' };
      default: return { opt: dec.def, outcome: 'ok', why: '' };
    }
  };

  // Called at the start of each month: anything the player left unanswered goes to a manager, else default.
  D.autoResolve = (g) => {
    for (const dec of g.decisions.slice()) {
      if (dec.month >= g.month) continue;
      const b = biz(g, dec);
      if (dec.bizId && !b) { g.decisions = g.decisions.filter((x) => x !== dec); continue; }
      const h = D.handler(g, b, dec.kind);
      if (h) {
        const c = D.choose(g, dec, h);
        if (c.opt == null) { g.decisions = g.decisions.filter((x) => x !== dec); continue; }
        const lbl = (dec.options.find((o) => o.id === c.opt) || { label: c.opt }).label;
        TG.rep.decision(g, b, h.label, `${dec.title}: chose "${lbl}"${c.why ? ' because ' + c.why : ''}`, c.outcome);
        D.resolve(g, dec, c.opt, h.label);
        h.e.decisions = (h.e.decisions || 0) + 1; if (c.outcome === 'bad') h.e.badCalls = (h.e.badCalls || 0) + 1;
      } else if (dec.def != null) {
        const lbl = (dec.options.find((o) => o.id === dec.def) || { label: dec.def }).label;
        TG.rep.decision(g, b, 'Nobody (no manager)', `${dec.title}: default "${lbl}"`, 'ok');
        D.resolve(g, dec, dec.def, null);
      } // persist with null default (lawsuit): stays open until the deadline
    }
  };

  // ---------- proactive management each month ----------
  const counts = (b) => { const c = {}; for (const e of b.staff) c[e.role] = (c[e.role] || 0) + 1; return c; };
  D.syncTargets = (b) => { b.target = counts(b); };
  D.bestCand = (list, out) => {
    if (!list.length) return null;
    if (out === 'bad') return R.pick(list);
    return list.slice().sort((x, y) => (y.skillSeen - y.wage / 400) - (x.skillSeen - x.wage / 400))[0];
  };
  D.manage = (g, b) => {
    if (!b.target) D.syncTargets(b);
    const S = TG.S, E = TG.E, M = TG.M;
    const profit3 = U.sum(b.hist.slice(-3), (x) => x.profit);
    // 1) replace staff who left (to the target the player set)
    if (b.proj) { const need = Math.ceil(U.sum(b.proj.active, (p) => p.crew)); b.target.laborer = Math.max(6, need); }
    let h = D.handler(g, b, 'hire');
    if (h) {
      const c = counts(b);
      for (const role in b.target) {
        let missing = b.target[role] - (c[role] || 0);
        while (missing > 0) {
          const out = D.roll(h); const cand = D.bestCand(S.poolFor(g, b, role), out);
          if (!cand) { TG.rep.decision(g, b, h.label, `Could not find a ${S.roleDef(b, role).label.toLowerCase()} to hire (thin labor pool)`, 'ok'); break; }
          S.hire(g, b, cand, h.label); missing--;
          if (out === 'bad') TG.rep.decision(g, b, h.label, `Rushed the hire of ${cand.name} without checking references`, 'bad');
        }
      }
    }
    // 2) maintenance & leaving broken gear
    h = D.handler(g, b, 'maint');
    if (h) {
      for (const it of b.equip) {
        const w = E.effWear(it);
        if (!it.broken && w > 58 && g.cash > 20000) { const out = D.roll(h); if (out !== 'bad') E.service(g, b, it.id); else if (R.chance(0.3)) TG.rep.decision(g, b, h.label, `Skipped servicing ${it.label} (${Math.round(w)}% wear)`, 'bad'); }
        if (it.broken && it.broken !== 'destroyed' && !g.decisions.some((d) => d.itemId === it.id) && g.cash > E.repairCost(g, b, it) * 2) E.repair(g, b, it.id, h.label);
      }
    }
    // 3) raises for unhappy good people
    h = D.handler(g, b, 'raise');
    if (h) for (const e of S.allStaff(b)) if (e.morale < 38 && e.skill >= 55 && profit3 > 0 && R.chance(0.5)) { S.raise(g, b, e.id); TG.rep.decision(g, b, h.label, `Gave ${e.name} a raise (morale was ${Math.round(e.morale)})`, 'good'); }
    // 4) model-specific
    if (b.brand) {
      h = D.handler(g, b, 'stock');
      const s = b.brand; const pipe = s.stock + U.sum(s.incoming, (x) => x.units);
      const avgO = s.avgOrders || s.lastOrders;
      if (h && avgO > 0 && pipe < avgO * 3.2) {
        const out = D.roll(h); let units = Math.max(TG.CONFIG.businesses.brand.brand.minBatch, Math.round(avgO * (out === 'bad' ? 7 : 3.5)));
        const r = M.brandOrder(g, b, units, false);
        if (r.ok) TG.rep.decision(g, b, h.label, `Reordered ${units.toLocaleString()} units (${U.money(r.cost)}) because only ${pipe.toLocaleString()} are in stock or on the way vs about ${Math.round(avgO).toLocaleString()} orders/mo`, out === 'bad' ? 'bad' : 'good');
      }
    }
    if (b.proj && b.proj.autoBid) {
      h = D.handler(g, b, 'bid');
      if (h) {
        const crew = M.models.projects.crew(b, TG.B.ctx(g, b));
        let need = U.sum(b.proj.active, (p) => p.crew);
        for (const o of b.proj.offers.slice()) {
          const out = D.roll(h);
          if (need + o.crew > crew * (out === 'bad' ? 1.5 : 1.2)) continue;
          if (o.size === 'large' && out !== 'bad' && (g.cash < o.cost * 0.08 || crew < 25)) continue;
          if (o.bond && !b.fixes.bonds) continue;
          const r = M.bid(g, b, o.id, b.proj.markup || 'normal', h.label);
          if (r.won) need += o.crew;
        }
      }
    }
    if (b.proj) {
      h = D.handler(g, b, 'expand');
      if (h) for (const kind of ['excavator', 'crane']) {
        const need = U.sum(b.proj.active, (p) => (kind === 'excavator' ? p.heavy : p.crane) || 0);
        const have = b.equip.filter((x) => x.type === kind && !x.broken).length;
        if (need > have) {
          const out = D.roll(h); const lease = out !== 'bad' ? g.cash < E.price(g, b, kind, 'standard') * 4 : R.chance(0.5);
          const it = E.buy(g, b, kind, out === 'bad' ? 'premium' : 'standard', { leased: lease });
          if (it) TG.rep.decision(g, b, h.label, `${lease ? 'Leased' : 'Bought'} a ${it.label.toLowerCase()} because active projects need ${need} and only ${have} work`, out);
        }
      }
    }
    if (b.fr) {
      h = D.handler(g, b, 'franchise');
      if (h) for (const a of b.fr.apps.slice()) {
        const out = D.roll(h); const judge = out === 'good' ? a.q : out === 'ok' ? a.signal : R.next();
        if (judge > 0.55) M.franchiseApprove(g, b, a.id, h.label); else if (judge < 0.4) M.franchiseReject(g, b, a.id);
      }
    }
    const lc = b.lastCtx || {};
    // 4b) staff-limited: add a key worker when demand clearly exceeds capacity and it pays
    h = D.handler(g, b, 'hire');
    if (h && lc.limit === 'staff' && lc.demand > lc.cap * 1.2 && profit3 > 0 && b.hist.length >= 3) {
      const kr = TG.M.keyRole(TG.CONFIG.businesses[b.type]);
      if (kr && R.chance(0.5)) { b.target[kr] = (b.target[kr] || 0) + 1; TG.rep.decision(g, b, h.label, `Added a ${S.roleDef(b, kr).label.toLowerCase()} position: demand ${Math.round(lc.demand)} vs capacity ${Math.round(lc.cap)}, limited by staff`, 'good'); }
    }
    if (h && lc.limit === 'support' && lc.demand > lc.cap * 1.1 && b.hist.length >= 3) {
      const d0 = TG.CONFIG.businesses[b.type]; const sr = Object.keys(d0.roles).find((r) => d0.roles[r].support);
      if (sr) { b.target[sr] = (b.target[sr] || 0) + 1; TG.rep.decision(g, b, h.label, `Added a ${S.roleDef(b, sr).label.toLowerCase()} position: support staff were the bottleneck`, 'good'); }
    }
    // 5) capacity: buy another machine when demand outstrips it (context-aware tier)
    h = D.handler(g, b, 'expand');
    if (h && lc.demand && lc.cap && lc.demand > lc.cap * 1.15 && (!lc.limit || lc.limit === 'equipment') && profit3 > 0 && (b.hist.length >= 3) && b.svc !== false) {
      const d = TG.CONFIG.businesses[b.type];
      const crit = d.equip.find((x) => x.id === lc.limitEquip) || d.equip.find((x) => x.critical && x.cap);
      if (crit && (TG.M.models[d.model].spaceCap ? TG.M.models[d.model].spaceCap(b) > lc.cap * 1.1 : true)) {
        const out = D.roll(h); const mech = E.hasMech(b);
        const std = E.price(g, b, crit.id, 'standard');
        let tier = mech && g.cash < std * 5 ? 'used' : g.cash > std * 8 ? 'standard' : g.cash > std * 3 ? 'budget' : null;
        if (h.e.trait === 'reckless') tier = 'premium';
        if (out === 'bad') tier = R.pick(['premium', 'used']);
        if (tier && g.cash > E.price(g, b, crit.id, tier) * 2) {
          E.buy(g, b, crit.id, tier);
          TG.rep.decision(g, b, h.label, `Bought a ${TG.CONFIG.equipTiers[tier].label.toLowerCase()} ${crit.label.toLowerCase()} because demand (${Math.round(lc.demand)}) exceeds capacity (${Math.round(lc.cap)})${mech ? ' and a mechanic is on staff' : ''}`, out);
        }
      }
    }
    // 6) CEO big moves (optional setting): buy the most useful upgrade when cash is plentiful
    if (g.ceo && g.settings.ceoBigMoves && profit3 > 0 && R.chance(0.25)) {
      const d = TG.CONFIG.businesses[b.type];
      const cand = d.fixes.filter((f) => !b.fixes[f.id] && !f.minRep && f.cost * g.world.priceIdx * 8 < g.cash && f.cost > 0);
      if (cand.length) {
        const out = D.roll({ p: D.pGood(g, g.ceo, true) });
        const f = out === 'bad' ? R.pick(cand) : cand.sort((x, y) => Object.keys(y.reduces || {}).length - Object.keys(x.reduces || {}).length)[0];
        const r = TG.B.buyFix(g, b, f.id);
        if (r && r.ok !== false) TG.rep.decision(g, b, `CEO ${g.ceo.name}`, `Invested in "${f.label}" (${U.money(f.cost * g.world.priceIdx)})`, out);
      }
    }
  };

  // farm sell-vs-store policy ('auto'): managers judge prices vs the yearly average
  D.farmPolicy = (g, b) => {
    const f = b.farm; const e = TG.M.models.farm.e(b); const mk = g.markets[e.market]; if (!mk) return 'sell';
    const hist = mk.hist || []; const avg = hist.length ? U.avg(hist.slice(-12), (x) => x.p || x) : mk.price;
    const now = TG.W.price(g, e.market, 0);
    const h = D.handler(g, b, 'farm');
    let ratio = now / Math.max(1, avg);
    if (h && !f.policyRoll) f.policyRoll = { m: g.month, out: D.roll(h) };
    if (f.policyRoll && f.policyRoll.m !== g.month && h) f.policyRoll = { m: g.month, out: D.roll(h) };
    if (f.policyRoll && f.policyRoll.out === 'bad') ratio = 2 - ratio;
    return ratio < 0.92 && f.storageCap > f.stored ? 'store' : 'sell';
  };

  // ---------- CEO ----------
  D.ceoPool = (g) => {
    if (g.ceoPool && g.ceoPool.month === g.month) return g.ceoPool.list;
    const hub = g.businesses[0] || { region: 'harbor', loc: 'city' };
    g.ceoPool = { month: g.month, list: [0, 1, 2].map(() => TG.S.candidate(g, { region: hub.region, loc: hub.loc }, 'ceo', 0.7)) };
    return g.ceoPool.list;
  };
  D.hireCeo = (g, cand) => { g.ceo = cand; cand.hired = g.month; cand.months = 0; TG.rep.staff(g, null, `Hired ${cand.name} as CEO (${U.money(cand.wage)}/mo + ${U.pct(cand.profitShare, 1)} of profit)`); };
  D.fireCeo = (g) => { if (!g.ceo) return; const sev = g.ceo.wage * 3; TG.F.spend(g, sev, 'Severance'); TG.rep.staff(g, null, `Let CEO ${g.ceo.name} go (${U.money(sev)} severance)`); g.ceo = null; };
  D.ceoMonth = (g, profit) => {
    const c = g.ceo; if (!c) return;
    c.months++;
    TG.F.spend(g, c.wage, 'CEO salary');
    if (profit > 0) TG.F.spend(g, Math.round(profit * c.profitShare), 'CEO profit share');
    const target = 60 + (profit > 0 ? 8 : -10) - Math.max(0, g.businesses.length - TG.CONFIG.ceo.spanFree) * 3;
    c.morale = U.clamp(c.morale + (target - c.morale) * 0.15 + R.normal(0, 2), 0, 100);
    if (c.skill < 95 && R.chance(0.3)) c.skill = U.clamp(c.skill + 0.3, 1, 99);
    const quitP = 0.004 + (c.morale < 35 ? 0.04 : 0) + (c.skill > 75 ? 0.006 : 0);
    if (R.chance(quitP)) { TG.rep.event(g, null, 'major', `CEO ${c.name} quit`, c.morale < 35 ? `Morale ${Math.round(c.morale)}/100` : 'Poached by a bigger company', { major: 'keyQuit' }); g.ceo = null; }
  };
  TG.D = D;
})();

</script>
<script>/* js/realestate.js */
/* realestate.js - the real estate path: rentals, tenants, vacancies, repairs, flipping, development,
   refinancing, property managers, neighborhoods, market cycles, and a late-game fund. */
(function () {
  const TG = globalThis.TG; const R = TG.R, U = TG.U;
  const RE = {};
  const RC = () => TG.CONFIG.realEstate;
  const STREETS = ['Maple', 'Birch', 'Sunset', 'Park', 'Grove', 'Union', 'Liberty', 'Spring', 'Garden', 'Highland', 'Bay', 'Summit'];
  const condF = (c) => 0.7 + 0.5 * c / 100;

  RE.init = (g) => { g.re = { holdings: [], listings: [], manager: null, handyman: false, fund: null, flipsDone: 0, flipsProfit: 0, m: { rev: 0, cost: 0 }, hist: [] }; RE.refill(g, RC().listingCount); };

  RE.gen = (g, kindId, opts) => {
    const C = TG.CONFIG, k = RC().kinds[kindId]; opts = opts || {};
    const region = R.pick(Object.keys(C.regions));
    const loc = kindId === 'land' ? R.pick(['suburb', 'town', 'rural']) : R.weighted({ city: 2, suburb: 3, town: 2, rural: 0.7 });
    const grade = R.weighted({ A: 1, B: 2, C: 1.5 });
    const distressed = opts.distressed != null ? opts.distressed : (kindId === 'house' || kindId === 'condo' || kindId === 'duplex') && R.chance(0.3);
    const units = Array.isArray(k.units) ? R.int(k.units[0], k.units[1]) : k.units;
    let price = R.range(k.price[0], k.price[1]) * C.regions[region].price * (grade === 'A' ? 1.25 : grade === 'C' ? 0.78 : 1) * g.world.housing;
    const cond = distressed ? R.range(15, 40) : R.range(45, 95);
    const nb = R.range(0.9, 1.1);
    const trend = R.range(-1, 1);
    price *= condF(cond) / condF(70);
    if (distressed) price *= R.range(RC().flip.distressDiscount[0], RC().flip.distressDiscount[1]);
    price = Math.round(price / 1000) * 1000;
    const acres = kindId === 'land' ? Math.round(R.range(2, 40)) : 0;
    return { id: U.uid('r'), kind: kindId, name: `${R.int(1, 999)} ${R.pick(STREETS)} ${R.pick(['St', 'Ave', 'Ct', 'Blvd'])}`, region, loc, grade, units, price, cond, nb, trend, distressed, acres,
      age: R.int(2, 80), hidden: R.chance(RC().flip.hiddenProblem * (distressed ? 1.5 : 0.6)) ? R.range(RC().flip.hiddenCost[0], RC().flip.hiddenCost[1]) : 0, listed: g.month };
  };
  RE.refill = (g, n) => {
    for (let i = 0; i < n; i++) {
      const w = { condo: 3, house: 4, duplex: 2.5, smallapt: 1.6, apartment: 0.8, strip: 0.6, officebldg: 0.4, warehouse: 0.5, land: 0.8, tower: 0.15 };
      g.re.listings.push(RE.gen(g, R.weighted(w)));
    }
  };
  RE.marketRent = (g, h) => {
    const k = RC().kinds[h.kind]; if (!k.rentPct) return 0;
    const perUnit = (h.basePrice || h.price) * k.rentPct / Math.max(1, h.units);
    return Math.round(perUnit * Math.pow(g.world.housing / (h.housingAtBuy || g.world.housing), 0.6) * h.nb * condF(h.cond) / condF(70) * (h.rentBump || 1));
  };
  RE.value = (g, h) => Math.round((h.base || h.price) * g.world.housing * h.nb * condF(h.cond) * (h.over ? 0.92 : 1));
  RE.totalValue = (g) => (g.re ? U.sum(g.re.holdings, (h) => RE.value(g, h)) : 0);
  RE.unitsOwned = (g) => U.sum(g.re.holdings, (h) => h.units || 0);

  RE.buy = (g, listingId, mortgage) => {
    const C = TG.CONFIG; const l = g.re.listings.find((x) => x.id === listingId); if (!l) return { ok: false, msg: 'Listing gone.' };
    const fees = Math.round(l.price * C.property.buyCostPct);
    if (mortgage) {
      const ltv = RC().kinds[l.kind].commercial ? 0.75 : 0.8; const down = Math.round(l.price * (1 - ltv));
      if (g.cash < down + fees) return { ok: false, msg: `Need ${U.money(down + fees)} down.` };
      const ok = TG.F.canBorrow(g, 'mortgage', l.price - down); if (!ok.ok) return ok;
      TG.F.spend(g, down + fees, 'Real estate purchases', null, true);
      const loan = TG.F.newLoan(g, 'mortgage', l.price - down, { collateral: { kind: 'property', id: l.id }, label: 'Mortgage: ' + l.name, noCash: true });
      l.mortgageId = loan.id;
    } else { if (g.cash < l.price + fees) return { ok: false, msg: `Need ${U.money(l.price + fees)}.` }; TG.F.spend(g, l.price + fees, 'Real estate purchases', null, true); }
    g.re.listings = g.re.listings.filter((x) => x !== l);
    l.base = l.price / (g.world.housing * l.nb * condF(l.cond)); l.basePrice = l.price; l.housingAtBuy = g.world.housing; l.bought = g.month; l.paid = l.price + fees;
    l.tenants = []; for (let i = 0; i < l.units; i++) l.tenants.push(R.chance(l.distressed ? 0.2 : 0.6) ? RE.newTenant(g, l, true) : null);
    l.screen = false; l.upkeep = 'normal'; l.insured = true; l.taxMult = 1; l.mode = l.distressed ? 'hold' : 'rent'; l.spent = 0; l.inspected = false;
    g.re.holdings.push(l);
    return { ok: true, h: l };
  };
  RE.newTenant = (g, h, inherited) => {
    const screened = h.screen || (g.re.manager && g.re.manager.skill > 40);
    const bad = R.chance(screened && !inherited ? RC().screenedBadChance : RC().tenantBadChance);
    return { bad, rent: RE.marketRent(g, h), late: 0, evict: 0, since: g.month, lease: RC().kinds[h.kind].lease || 12 };
  };
  RE.inspect = (g, listingId) => {
    const l = g.re.listings.find((x) => x.id === listingId); if (!l || l.inspected) return null;
    TG.F.spend(g, RC().flip.inspectionCost * g.world.priceIdx, 'Inspections', null, true);
    l.inspected = true; l.found = l.hidden > 0 && R.chance(RC().flip.inspectReveal);
    return l.found ? `Inspection found a problem: about ${U.money(l.hidden * l.price)} of hidden repairs (mold, foundation or wiring)` : 'Inspection found nothing major (it can still miss things)';
  };

  RE.startFlip = (g, hid, level, contractor, contingency) => {
    const F = RC().flip; const h = g.re.holdings.find((x) => x.id === hid); if (!h || h.flip) return { ok: false };
    const L = F.levels[level], K = F.contractors[contractor];
    const budget = Math.round(RE.value(g, h) / condF(h.cond) * condF(70) * L.cost * K.costMult * g.world.priceIdx / g.world.housing * g.world.housing);
    const total = Math.round(budget * (contingency ? 1 + F.contingencyPct : 1));
    if (g.cash < total * 0.3) return { ok: false, msg: `Need at least ${U.money(total * 0.3)} to start (30% upfront).` };
    TG.F.spend(g, Math.round(total * 0.3), 'Renovations', null, true);
    h.flip = { level, contractor, months: L.months, left: L.months, budget, contingency: contingency ? Math.round(budget * F.contingencyPct) : 0, paid: Math.round(total * 0.3), overrun: 0 };
    h.mode = 'reno'; for (let i = 0; i < h.tenants.length; i++) h.tenants[i] = null;
    return { ok: true, budget };
  };
  RE.list = (g, hid, askMult) => { const h = g.re.holdings.find((x) => x.id === hid); if (!h || h.flip || h.dev) return; h.mode = 'sale'; h.ask = Math.round(RE.value(g, h) * (askMult || 1)); };
  RE.unlist = (g, hid) => { const h = g.re.holdings.find((x) => x.id === hid); if (h && h.mode === 'sale') h.mode = 'rent'; };
  RE.sell = (g, hid, mult) => {
    const C = TG.CONFIG; const h = g.re.holdings.find((x) => x.id === hid); if (!h) return 0;
    const v = Math.round((h.mode === 'sale' && h.ask && !mult ? h.ask : RE.value(g, h) * (mult || 1)) * (1 - C.property.sellCostPct));
    TG.F.earn(g, v, 'Real estate sales', null, true);
    if (h.mortgageId) { const l = g.loans.find((x) => x.id === h.mortgageId); if (l) TG.F.payoff(g, l.id); }
    g.re.holdings = g.re.holdings.filter((x) => x !== h);
    if (h.flipped) { const prof = v - h.paid - h.spent; g.re.flipsDone++; if (prof > 0) g.re.flipsProfit++; TG.rep.event(g, null, prof > 0 ? 'good' : 'bad', `Flip of ${h.name} ${prof > 0 ? 'made' : 'lost'} ${U.money(Math.abs(prof))}`, `Bought ${U.money(h.paid)}, renovation ${U.money(h.spent)}, sold ${U.money(v)} after fees`); }
    return v;
  };
  RE.refinance = (g, hid) => {
    const C = RC(); const h = g.re.holdings.find((x) => x.id === hid); if (!h) return { ok: false };
    const v = RE.value(g, h); const old = h.mortgageId ? g.loans.find((x) => x.id === h.mortgageId) : null;
    const bal = old ? old.balance : 0; const newAmt = Math.round(v * C.refinanceLtv);
    const cashOut = newAmt - bal - Math.round(newAmt * C.refinanceFee);
    if (cashOut < 5000) return { ok: false, msg: 'Not enough equity to refinance.' };
    const ok = TG.F.canBorrow(g, 'mortgage', newAmt); if (!ok.ok) return ok;
    if (old) g.loans = g.loans.filter((x) => x !== old);
    const loan = TG.F.newLoan(g, 'mortgage', newAmt, { collateral: { kind: 'property', id: h.id }, label: 'Refi mortgage: ' + h.name, noCash: true });
    h.mortgageId = loan.id; TG.F.earn(g, cashOut, 'Refinance cash-out', null, true); TG.F.spend(g, 0, 'Refinance fees', null, true);
    return { ok: true, cashOut };
  };
  RE.develop = (g, hid, units) => {
    const D = RC().develop; const h = g.re.holdings.find((x) => x.id === hid); if (!h || h.kind !== 'land' || h.dev) return { ok: false };
    units = Math.round(U.clamp(units, 4, Math.min(D.maxUnits, h.acres * D.unitsPerAcre)));
    const cpu = R.range(D.costPerUnit[0], D.costPerUnit[1]) * g.world.priceIdx;
    h.dev = { stage: 'permit', left: R.int(D.permitMonths[0], D.permitMonths[1]), units, cpu, cost: Math.round(units * cpu), paid: 0, buildMonths: R.int(D.buildMonths[0], D.buildMonths[1]) };
    TG.F.spend(g, Math.round(25000 * g.world.priceIdx + units * 800), 'Permits & architects', null, true);
    return { ok: true, dev: h.dev };
  };
  RE.hireManager = (g, cand) => { g.re.manager = cand; TG.rep.staff(g, null, `Hired ${cand.name} as property manager (${U.money(cand.wage)}/mo + ${U.pct(RC().managerFeePct)} of rent)`); };
  RE.managerPool = (g) => {
    g.re.pool = g.re.pool && g.re.pool.month === g.month ? g.re.pool : { month: g.month, list: [0, 1, 2, 3].map(() => TG.S.candidate(g, { region: 'harbor', loc: 'suburb' }, 'rem', 0.6)) };
    return g.re.pool.list;
  };
  RE.raiseFund = (g) => {
    const F = RC().fund; const v = RE.totalValue(g);
    if (g.re.fund) return { ok: false, msg: 'Fund already raised.' };
    if (v < F.minPortfolio) return { ok: false, msg: `Needs a ${U.money(F.minPortfolio)} portfolio.` };
    const cash = Math.round(v * F.raisePct); g.re.fund = { share: F.investorShare, raised: cash, since: g.month };
    TG.F.earn(g, cash, 'Fund raise', null, true);
    return { ok: true, cash };
  };

  RE.month = (g) => {
    const C = TG.CONFIG, rc = RC(), w = g.world; const mgr = g.re.manager;
    g.re.m = { rev: 0, cost: 0 };
    const earn = (amt, label) => { amt = Math.round(amt); if (amt <= 0) return; TG.F.earn(g, amt, label); g.re.m.rev += amt; };
    const spend = (amt, label) => { amt = Math.round(amt); if (amt <= 0) return; TG.F.spend(g, amt, label); g.re.m.cost += amt; };
    const units = RE.unitsOwned(g);
    const overSelf = !mgr ? Math.max(0, units - rc.selfManageLimit) : 0;
    if (g.re.handyman && g.re.holdings.length) spend(Math.round(RC().handymanFee * g.world.priceIdx), 'Handyman retainer');
    if (mgr) { spend(mgr.wage, 'Property manager'); mgr.months++; mgr.morale = U.clamp(mgr.morale + R.normal(0, 3), 0, 100); if (R.chance(0.01 * (mgr.morale < 40 ? 4 : 1))) { TG.rep.event(g, null, 'bad', `Property manager ${mgr.name} quit`, `Morale ${Math.round(mgr.morale)}`, { major: 'keyQuit' }); g.re.manager = null; } }
    for (const h of g.re.holdings.slice()) {
      const k = rc.kinds[h.kind];
      // neighborhood & condition
      h.trend = U.clamp(h.trend + R.normal(0, 0.08), -1, 1);
      h.nb = U.clamp(h.nb * (1 + h.trend * rc.neighborhoodShift / 6), 0.5, 2);
      const decay = rc.conditionDecay * (h.upkeep === 'low' ? 1.8 : h.upkeep === 'high' ? 0.4 : 1);
      h.cond = U.clamp(h.cond - decay * R.range(0.5, 1.5), 0, 100);
      const v = RE.value(g, h);
      spend(v * rc.propertyTax / 12 * h.taxMult, 'Real estate property tax');
      spend(v * rc.upkeepPct * (h.upkeep === 'low' ? 0.4 : h.upkeep === 'high' ? 2.2 : 1), 'Real estate upkeep');
      if (h.upkeep === 'high') h.cond = U.clamp(h.cond + 0.4, 0, 100);
      if (h.insured) spend(v * rc.insurancePct, 'Real estate insurance');
      if (R.chance(rc.taxHikeChance)) { h.taxMult *= 1.2; TG.rep.event(g, null, 'bad', `Property tax hike on ${h.name} (+20%)`, 'Local tax reassessment'); }
      // flip in progress
      if (h.flip) { RE.flipMonth(g, h, spend); continue; }
      if (h.dev) { RE.devMonth(g, h, spend); continue; }
      if (h.mode === 'sale') {
        const pChance = rc.flip.saleChanceBase * Math.pow(w.econ, 2) * Math.pow(h.ask / Math.max(1, RE.value(g, h)), -4) * (w.baseRate > 0.06 ? 0.7 : 1);
        if (R.chance(U.clamp(pChance, 0.01, 0.9))) { const sold = RE.sell(g, h.id); TG.rep.event(g, null, 'good', `Sold ${h.name} for ${U.money(sold)} (after fees)`, `Asking price ${U.money(h.ask)}`); }
        continue;
      }
      if (!k.rentPct) continue; // land
      // rentals
      const rentCapOn = w.rentCap > 0;
      for (let i = 0; i < h.tenants.length; i++) {
        let t = h.tenants[i];
        if (!t) {
          const mr = RE.marketRent(g, h);
          const fill = rc.vacancyFillBase * (k.lease ? 0.3 : 1) * condF(h.cond) * Math.pow(w.econ, k.lease ? 2 : 1) * (mgr ? 1.2 + mgr.skill / 250 : 1) * (overSelf ? 1 - Math.min(0.6, overSelf * rc.selfManagePenalty) : 1) * (h.grade === 'A' ? 1.1 : h.grade === 'C' ? 0.85 : 1);
          if (R.chance(fill)) { if (h.screen) spend(rc.screeningCost * w.priceIdx, 'Tenant screening'); h.tenants[i] = RE.newTenant(g, h); }
          continue;
        }
        // rent collection
        const lateP = (t.bad ? rc.lateRentChance.bad : rc.lateRentChance.good) * (w.phase === 'recession' ? 1.6 : 1) * (overSelf ? 1.3 : 1);
        if (t.evict > 0) { t.evict--; if (t.evict === 0) { h.tenants[i] = null; TG.rep.event(g, null, 'info', `Eviction completed at ${h.name}`, 'Unit is vacant again'); } continue; }
        if (R.chance(lateP)) { t.late++; if (t.late >= 2 && !t.evict) RE.evictCard(g, h, i); }
        else { earn(t.rent * (mgr ? 1 - rc.managerFeePct : 1), 'Rent'); if (mgr) g.re.m.cost += 0; t.late = Math.max(0, t.late - 1); }
        if (mgr && R.chance(0.02) && mgr.honesty < 40) { const sk = Math.round(t.rent * 0.5); spend(sk, 'Theft losses'); }
        if (R.chance(t.bad ? rc.damageChance.bad : rc.damageChance.good)) { const c = v / Math.max(1, h.units) * R.range(rc.damageCost[0], rc.damageCost[1]) * 4; spend(c, 'Tenant damage'); h.cond = U.clamp(h.cond - 5, 0, 100); TG.rep.event(g, null, 'bad', `Tenant damaged a unit at ${h.name} (${U.money(c)})`, t.bad ? 'Bad tenant (not screened)' : 'Accidental damage'); }
        // lease turnover & rent resets
        if (g.month - t.since >= t.lease && R.chance(0.25)) { h.tenants[i] = null; continue; }
        if (g.month - t.since >= 12 && (g.month - t.since) % 12 === 0) { const mr = RE.marketRent(g, h); t.rent = rentCapOn ? Math.round(Math.min(mr, t.rent * 1.02)) : mr; }
      }
      // repairs & disasters
      const nUnits = Math.max(1, h.units);
      const repP = rc.repairChance * Math.sqrt(nUnits) * (1.6 - h.cond / 100) * (h.upkeep === 'low' ? 1.5 : h.upkeep === 'high' ? 0.6 : 1);
      if (R.chance(repP)) { const c = v * R.range(rc.repairCost[0], rc.repairCost[1]) / Math.sqrt(nUnits) * (g.re.handyman || mgr ? 0.8 : 1); spend(c, 'Real estate repairs'); TG.rep.event(g, null, 'bad', `Repair at ${h.name}: ${R.pick(['water heater', 'furnace', 'roof leak', 'plumbing', 'appliances'])} (${U.money(c)})`, `Condition ${Math.round(h.cond)}%, age ${h.age} yrs`); }
      if (R.chance(rc.bigRepairChance * (1.6 - h.cond / 100))) { const c = v * R.range(rc.bigRepairCost[0], rc.bigRepairCost[1]); spend(c, 'Real estate repairs'); h.cond = U.clamp(h.cond + 10, 0, 100); TG.rep.event(g, null, 'major', `Major repair at ${h.name}: ${R.pick(['roof replacement', 'foundation work', 'boiler replacement', 'sewer line'])} (${U.money(c)})`, `Condition ${Math.round(h.cond)}%`); }
      if (R.chance(rc.injuryChance * nUnits * (1.5 - h.cond / 100))) TG.B.lawsuit(g, null, `Tenant injury at ${h.name}`, R.range(rc.injurySuit[0], rc.injurySuit[1]) * w.priceIdx, null, `Condition ${Math.round(h.cond)}%`);
      if (R.chance(rc.disasterChance)) { const c = v * R.range(rc.disasterCost[0], rc.disasterCost[1]); const cov = h.insured ? c * C.finance.insCover : 0; spend(c - cov, 'Disaster damage'); h.cond = U.clamp(h.cond - 30, 0, 100); TG.rep.event(g, null, 'major', `${R.pick(['Fire', 'Flood', 'Storm'])} damaged ${h.name} (${U.money(c)}${h.insured ? ', insurance paid ' + U.money(cov) : ', NOT insured'})`, 'Rare disaster'); }
    }
    // fund distributions
    const net = g.re.m.rev - g.re.m.cost;
    if (g.re.fund && net > 0) spend(net * g.re.fund.share, 'Fund investor distributions');
    g.re.hist.push({ m: g.month, rev: Math.round(g.re.m.rev), cost: Math.round(g.re.m.cost) }); if (g.re.hist.length > 120) g.re.hist.shift();
    // listings
    g.re.listings = g.re.listings.filter((l) => g.month - l.listed < 10 || R.chance(0.5));
    RE.refill(g, rc.newPerMonth);
    while (g.re.listings.length > 20) g.re.listings.shift();
  };
  RE.evictCard = (g, h, i) => {
    const rc = RC(); const t = h.tenants[i];
    if (g.re.manager) { RE.evict(g, h.id, i, 'Property manager ' + g.re.manager.name); return; }
    TG.D.add(g, { kind: 'evict', reId: h.id, unit: i, title: `Tenant behind on rent at ${h.name}`, text: `A tenant is ${t.late} months behind.`, why: t.bad ? 'Unscreened tenants are far more likely to pay late.' : 'Even good tenants fall behind sometimes, more often in a recession.',
      options: [{ id: 'evict', label: `Start eviction (${U.money(rc.evictionCost[0])}-${U.money(rc.evictionCost[1])}, ${rc.evictionMonths[0]}-${rc.evictionMonths[1]} months)` }, { id: 'wait', label: 'Wait and hope they pay' }], def: 'wait' });
  };
  RE.evict = (g, hid, i, by) => {
    const rc = RC(); const h = g.re.holdings.find((x) => x.id === hid); if (!h || !h.tenants[i]) return;
    const lawyer = g.businesses.some((b) => b.spec && b.spec.lawyer);
    const cost = Math.round(R.range(rc.evictionCost[0], rc.evictionCost[1]) * g.world.priceIdx * (lawyer ? 1 - rc.lawyerEvictionCut : 1));
    TG.F.spend(g, cost, 'Evictions'); g.re.m.cost += cost;
    h.tenants[i].evict = R.int(rc.evictionMonths[0], rc.evictionMonths[1]);
    TG.rep.decision(g, null, by, `Started an eviction at ${h.name} (${U.money(cost)})`);
  };
  RE.flipMonth = (g, h, spend) => {
    const F = RC().flip, f = h.flip, K = F.contractors[f.contractor], L = F.levels[f.level];
    const per = f.budget * 0.7 / f.months;
    spend(per, 'Renovations'); h.spent += per; f.paid += per;
    if (R.chance(K.vanish / f.months * 2)) { const lost = Math.round(f.budget * 0.25); spend(lost, 'Renovations'); h.spent += lost; f.left += 2; TG.rep.event(g, null, 'major', `Contractor disappeared with a ${U.money(lost)} deposit at ${h.name}`, `${K.label}: ${U.pct(K.vanish)} chance per job`); return; }
    if (h.hidden > 0 && R.chance(0.35)) { const c = Math.round(h.hidden * h.basePrice); const cov = Math.min(c, f.contingency); f.contingency -= cov; spend(c - cov, 'Renovations'); h.spent += c; TG.rep.event(g, null, 'bad', `Hidden problem found at ${h.name}: ${R.pick(['mold', 'foundation cracks', 'old wiring', 'rotten joists'])} (${U.money(c)})`, `${h.inspected ? 'The inspection missed it' : 'No pre-purchase inspection'}${cov ? '; contingency covered ' + U.money(cov) : ''}`); h.hidden = 0; }
    if (R.chance(K.overrun / f.months)) { const c = Math.round(f.budget * R.range(0.08, 0.25)); const cov = Math.min(c, f.contingency); f.contingency -= cov; spend(c - cov, 'Renovations'); h.spent += c; TG.rep.event(g, null, 'bad', `Renovation cost overrun at ${h.name} (${U.money(c)})`, `${K.label}; ${cov ? 'contingency covered ' + U.money(cov) : 'no contingency budget'}`); }
    if (R.chance(K.delay / f.months)) { f.left += R.int(1, 2); TG.rep.event(g, null, 'bad', `Contractor delay at ${h.name}`, `${K.label}; holding costs keep piling up`); }
    f.left--;
    if (f.left <= 0) {
      h.cond = U.clamp(h.cond + L.cond * K.quality, 0, 100);
      if (L.overNeighborhood && h.grade !== 'A') h.over = true;
      h.base *= 1 + L.value * K.quality * 0.25;
      h.flip = null; h.mode = 'hold'; h.flipped = true;
      TG.rep.event(g, null, 'good', `Renovation finished at ${h.name}: now worth about ${U.money(RE.value(g, h))}`, `${L.label} by ${K.label.toLowerCase()}${h.over ? '; over-renovated for the neighborhood' : ''}. List it for sale or rent it out.`);
    }
  };
  RE.devMonth = (g, h, spend) => {
    const D = RC().develop, d = h.dev;
    if (d.stage === 'permit') {
      if (R.chance(D.stallChance)) { d.left += R.int(2, 6); TG.rep.event(g, null, 'bad', `Zoning approval for ${h.name} stalled (city politics)`, 'Big developments can stall for years'); }
      if (--d.left <= 0) { d.stage = 'build'; d.left = d.buildMonths; TG.rep.event(g, null, 'good', `Permits approved for ${h.name}: construction starts (${d.units} units)`, 'Permit stage complete'); }
      return;
    }
    let per = d.cost / d.buildMonths;
    if (R.chance(D.overrun / d.buildMonths * 2)) { const x = R.range(D.overrunPct[0], D.overrunPct[1]); per *= 1 + x * 3; TG.rep.event(g, null, 'bad', `Development cost overrun at ${h.name}`, 'Construction costs and delays'); }
    spend(per, 'Development construction'); d.paid += per;
    if (--d.left <= 0) {
      h.kind = d.units >= 20 ? 'apartment' : 'smallapt'; h.units = d.units; h.cond = 95; h.age = 0; h.dev = null; h.mode = 'rent';
      h.basePrice = d.cost * 1.25; h.base = (h.base * g.world.housing * h.nb * condF(h.cond) + d.cost * 1.25) / (g.world.housing * h.nb * condF(h.cond));
      h.housingAtBuy = g.world.housing; h.tenants = Array(d.units).fill(null);
      TG.rep.event(g, null, 'good', `Development finished: ${h.name} now has ${d.units} units`, `Total build cost ${U.money(d.paid)}`);
    }
  };
  TG.RE = RE;
})();

</script>
<script>/* js/invest.js */
/* invest.js - stocks, penny stocks & coins, margin, angel investing, casino, horse & sports betting.
   House edges and negative drifts are real; there are no patterns to exploit. */
(function () {
  const TG = globalThis.TG; const R = TG.R, U = TG.U;
  const I = {};
  const IC = () => TG.CONFIG.invest, CC = () => TG.CONFIG.casino;

  I.init = (g) => {
    const A = IC().assets; g.invest = { prices: {}, hist: {}, pos: {}, marginDebt: 0, angels: [], angelOffers: [], casino: { net: 0, bets: 0, banned: false, lifetimeNet: 0 }, habit: 0, gambleNet: 0, betsNet: 0, race: null, game: null };
    for (const s in A) { g.invest.prices[s] = A[s].start; g.invest.hist[s] = [A[s].start]; }
    I.newRace(g); I.newGame(g);
  };
  I.high = (s) => IC().assets[s].kind !== 'stock';
  I.posValue = (g) => U.sum(Object.keys(g.invest.pos), (s) => g.invest.pos[s].qty * g.invest.prices[s]);
  I.angelValue = (g) => U.sum(g.invest.angels, (a) => a.amt * (a.mark != null ? a.mark : 0.7));
  I.value = (g) => (g.invest ? Math.round(I.posValue(g) + I.angelValue(g)) : 0);
  I.equity = (g) => I.posValue(g) - g.invest.marginDebt;
  I.marginRoom = (g) => Math.max(0, Math.round(I.equity(g) * (IC().margin.maxLev - 1) - g.invest.marginDebt));

  I.buy = (g, sym, amount, useMargin) => {
    amount = Math.round(amount); if (!(amount > 0)) return { ok: false, msg: 'Enter an amount.' };
    if (I.high(sym) && !g.settings.gambling) return { ok: false, msg: 'High-risk assets are turned off in settings.' };
    const p = g.invest.prices[sym]; if (!(p > 0)) return { ok: false, msg: 'Not trading.' };
    let fromMargin = 0;
    if (useMargin) {
      if (!g.settings.gambling) return { ok: false, msg: 'Margin is turned off with high-risk investing.' };
      const room = Math.max(0, Math.round((I.equity(g) + amount) * (IC().margin.maxLev - 1) - g.invest.marginDebt));
      fromMargin = Math.min(room, Math.round(amount / 2));
    }
    const cashPart = amount - fromMargin;
    if (g.cash < cashPart) return { ok: false, msg: `Need ${U.money(cashPart)} in cash.` };
    const fee = Math.round(amount * IC().tradeFee);
    TG.F.spend(g, cashPart, 'Investments bought', null, true); TG.F.spend(g, fee, 'Trading fees');
    g.invest.marginDebt += fromMargin;
    const pos = g.invest.pos[sym] || (g.invest.pos[sym] = { qty: 0, cost: 0 });
    pos.qty += amount / p; pos.cost += amount;
    return { ok: true, fromMargin };
  };
  I.sell = (g, sym, frac, mult, quiet) => {
    const pos = g.invest.pos[sym]; if (!pos || pos.qty <= 0) return 0;
    frac = U.clamp(frac == null ? 1 : frac, 0, 1);
    const q = pos.qty * frac; let v = q * g.invest.prices[sym] * (mult || 1);
    const fee = v * IC().tradeFee; v -= fee;
    const costPart = pos.cost * frac; pos.qty -= q; pos.cost -= costPart;
    if (pos.qty < 1e-9) delete g.invest.pos[sym];
    // repay margin first
    const repay = Math.min(g.invest.marginDebt, v); g.invest.marginDebt -= repay;
    TG.F.earn(g, Math.round(v - repay), 'Investments sold', null, true);
    const gain = v - costPart; if (gain > 0) g.invest.realized = (g.invest.realized || 0) + gain;
    if (!quiet) TG.rep.event(g, null, gain >= 0 ? 'good' : 'bad', `Sold ${TG.CONFIG.invest.assets[sym].label}: ${gain >= 0 ? 'gain' : 'loss'} of ${U.money(Math.abs(gain))}`, `Cost basis ${U.money(costPart)}`);
    return v;
  };
  I.repayMargin = (g, amt) => { amt = Math.min(Math.round(amt), g.invest.marginDebt, Math.max(0, g.cash)); if (amt <= 0) return; TG.F.spend(g, amt, 'Margin repayment', null, true); g.invest.marginDebt -= amt; };

  I.month = (g) => {
    const A = IC().assets, iv = g.invest, w = g.world, C = IC();
    const drift = { boom: 0.006, recovery: 0.004, slowdown: -0.004, recession: -0.012 }[w.phase] || 0;
    let mkt = drift + R.normal(0, C.econShockSd);
    const crashP = 0.004 * (w.phase === 'slowdown' || w.phase === 'recession' ? 3 : 0.6);
    if (R.chance(crashP)) { const d = R.range(C.crashDrop[0], C.crashDrop[1]); mkt -= d; TG.rep.news(g, `Stock market crash: index falls about ${U.pct(d)}`, 'bad', true); }
    for (const s in A) {
      const a = A[s]; let p = iv.prices[s];
      if (!(p > 0)) { // relaunch a dead ticker as a fresh one
        iv.prices[s] = a.start; iv.hist[s] = [a.start]; continue;
      }
      if (a.zero && R.chance(a.zero)) {
        if (iv.pos[s]) { TG.rep.event(g, null, 'major', `${a.label} collapsed to zero: you lost ${U.money(iv.pos[s].cost)}`, `${a.kind === 'coin' ? 'Coins' : 'Penny stocks'} carry a ${U.pct(a.zero, 1)} monthly wipe-out risk`, { major: 'cash' }); delete iv.pos[s]; }
        iv.prices[s] = 0; iv.hist[s].push(0); continue;
      }
      const r = a.mu + a.beta * mkt + R.normal(0, a.sd) - a.sd * a.sd / 2;
      p = Math.max(a.start * 0.0005, p * Math.exp(r));
      iv.prices[s] = p; iv.hist[s].push(+p.toFixed(4)); if (iv.hist[s].length > 120) iv.hist[s].shift();
    }
    // margin interest & calls
    if (iv.marginDebt > 0) {
      const int = Math.round(iv.marginDebt * (w.baseRate + C.margin.spread) / 12);
      TG.F.spend(g, int, 'Margin interest');
      const pv = I.posValue(g);
      if (pv <= 0 || (pv - iv.marginDebt) / pv < C.margin.callAt) {
        const before = iv.marginDebt;
        for (const s of Object.keys(iv.pos)) I.sell(g, s, 1, 1, true);
        if (iv.marginDebt > 0) { TG.F.spend(g, iv.marginDebt, 'Margin call shortfall', null, true); iv.marginDebt = 0; }
        TG.rep.event(g, null, 'major', `Margin call! Broker sold all your positions`, `Equity fell below ${U.pct(C.margin.callAt)} of positions; margin debt was ${U.money(before)}`, { major: 'cash' });
      }
    }
    // angel investments
    for (const a of iv.angels.slice()) {
      a.left--;
      if (a.left === Math.floor(a.horizon / 2)) { a.mark = a.outcome[1] === 0 ? R.range(0.1, 0.5) : R.range(0.6, 1.6); TG.rep.event(g, null, 'info', `${a.name} update: ${a.mark < 0.6 ? 'struggling to raise more money' : 'growing, raising a new round'}`, 'Startup progress is noisy; early signals can mislead'); }
      if (a.left <= 0) {
        const pay = Math.round(a.amt * a.mult);
        iv.angels = iv.angels.filter((x) => x !== a);
        if (pay > 0) TG.F.earn(g, pay, 'Angel exits', null, true);
        TG.rep.event(g, null, pay > a.amt ? 'good' : 'bad', pay > 0 ? `${a.name} ${a.mult >= 3 ? 'was acquired' : 'returned money'}: you got ${U.money(pay)} (${a.mult.toFixed(1)}x)` : `${a.name} failed: ${U.money(a.amt)} lost`, 'Most startups fail; a few return many times the money');
      }
    }
    // offers
    iv.angelOffers = iv.angelOffers.filter((o) => o.expires > g.month);
    while (iv.angelOffers.length < IC().angel.offers) iv.angelOffers.push(I.angelOffer(g));
    // casino & habit
    iv.casino.bets = 0;
    iv.habit = Math.max(0, iv.habit - CC().habitDecay);
    if (g.settings.gambling && g.settings.habit && iv.habit >= CC().habitChase && g.cash > 20000) {
      const loss = Math.round(g.cash * R.range(CC().chaseLoss[0], CC().chaseLoss[1]));
      TG.F.spend(g, loss, 'Gambling losses'); iv.gambleNet -= loss;
      TG.rep.event(g, null, 'bad', `You chased losses at the casino (${U.money(loss)})`, `Gambling habit ${Math.round(iv.habit)}/100: big bets build a habit; it fades if you stop`);
    }
    I.newRace(g); I.newGame(g);
  };
  I.angelOffer = (g) => {
    const A = IC().angel; const sectors = ['food delivery app', 'battery startup', 'pet tech', 'farm robotics', 'fintech', 'biotech lab', 'fashion marketplace', 'logistics software', 'game studio'];
    const roll = R.next(); let acc = 0, oc = A.outcomes[0];
    for (const o of A.outcomes) { acc += o[0]; if (roll < acc) { oc = o; break; } }
    const signal = U.clamp((oc[1] > 0 ? 0.6 : 0.4) + R.normal(0, 0.25), 0, 1);
    return { id: U.uid('a'), name: `${R.pick(['Nova', 'Bright', 'Kite', 'Atlas', 'Ember', 'Pivot', 'Orbit', 'Juniper'])} ${R.pick(['Labs', 'Works', 'AI', 'Co', 'Systems'])}`, sector: R.pick(sectors),
      min: Math.round(R.range(A.min, A.max / 4) / 5000) * 5000, buzz: signal > 0.66 ? 'Strong team, early traction' : signal > 0.45 ? 'Promising idea, unproven' : 'Heavy competition, thin traction', outcome: oc, expires: g.month + 2 };
  };
  I.angelInvest = (g, offerId, amt) => {
    if (!g.settings.gambling) return { ok: false, msg: 'High-risk investing is off in settings.' };
    const o = g.invest.angelOffers.find((x) => x.id === offerId); if (!o) return { ok: false, msg: 'Offer gone.' };
    amt = Math.round(Math.max(o.min, Math.min(amt || o.min, IC().angel.max)));
    if (g.cash < amt) return { ok: false, msg: `Need ${U.money(amt)}.` };
    TG.F.spend(g, amt, 'Angel investments', null, true);
    const H = IC().angel.horizon; const horizon = R.int(H[0], H[1]);
    g.invest.angels.push({ id: o.id, name: o.name, sector: o.sector, amt, horizon, left: horizon, outcome: o.outcome, mult: o.outcome[1] === 0 ? 0 : R.range(o.outcome[1], o.outcome[2]), mark: null });
    g.invest.angelOffers = g.invest.angelOffers.filter((x) => x !== o);
    return { ok: true };
  };

  // ---------- casino ----------
  I.betLimit = (g) => { const c = g.invest.casino; let m = CC().maxBet; if (c.net > CC().limitShrinkAt) m *= 0.4; return Math.round(m); };
  I.canBet = (g, amt) => {
    const c = g.invest.casino;
    if (!g.settings.gambling) return 'Gambling is turned off in settings.';
    if (c.banned) return 'The casino has banned you for winning too much.';
    if (c.bets >= CC().betsPerMonth) return `Bet limit reached (${CC().betsPerMonth} per month). Come back next month.`;
    if (!(amt >= CC().minBet)) return `Minimum bet ${U.money(CC().minBet)}.`;
    if (amt > I.betLimit(g)) return `Table limit is ${U.money(I.betLimit(g))}.`;
    if (amt > g.cash) return 'Not enough cash.';
    return null;
  };
  // net > 0 = winnings, net < 0 = loss
  I.settle = (g, amt, net) => {
    const c = g.invest.casino, iv = g.invest; c.bets++;
    if (amt > Math.max(1000, g.cash * 0.02)) iv.habit = Math.min(100, iv.habit + CC().habitPerBigBet);
    net = Math.round(net);
    if (net > 0) TG.F.earn(g, net, 'Gambling winnings'); else if (net < 0) TG.F.spend(g, -net, 'Gambling losses');
    c.net += net; c.lifetimeNet += net; iv.gambleNet += net;
    if (!c.banned && c.net > CC().banAtNetWin) { c.banned = true; TG.rep.event(g, null, 'warn', 'The casino banned you after your winning streak', `Net winnings over ${U.money(CC().banAtNetWin)}`); }
    return net;
  };
  I.casinoBet = (g, game, amt) => {
    amt = Math.round(amt); const err = I.canBet(g, amt); if (err) return { ok: false, msg: err };
    const G = CC().games[game]; if (!G) return { ok: false, msg: 'Unknown game.' };
    if (game === 'slots') {
      // paytable (total returned per $1): 0.1% x200, 1% x20, 5% x5, 20% x1.5 -> 0.95, scaled to the configured RTP
      const r = R.next(); let mult = r < 0.001 ? 200 : r < 0.011 ? 20 : r < 0.061 ? 5 : r < 0.261 ? 1.5 : 0;
      mult *= G.rtp / 0.95;
      const net = I.settle(g, amt, amt * (mult - 1));
      return { ok: true, win: net > 0, text: mult > 0 ? `Slots returned ${mult.toFixed(2)}x (${net >= 0 ? '+' : '-'}${U.money(Math.abs(net))})` : `Slots: nothing (-${U.money(amt)})` };
    }
    const won = R.chance(G.p);
    I.settle(g, amt, won ? amt * G.pays : -amt);
    return { ok: true, win: won, text: won ? `${G.label}: won ${U.money(amt * G.pays)}` : `${G.label}: lost ${U.money(amt)}` };
  };
  I.newRace = (g) => {
    const H = CC().horses; const raw = []; for (let i = 0; i < H.field; i++) raw.push(Math.pow(R.range(0.3, 1), 2.2));
    const tot = U.sum(raw, (x) => x);
    const names = ['Copper Dash', 'Midnight Rye', 'Lucky Seven', 'Paper Moon', 'Iron Lady', 'Quick Sand', 'Blue Comet', 'Old Faithful', 'Silver Bell', 'Prairie Fire'];
    const pick = R.shuffle(names.slice()).slice(0, H.field);
    g.invest.race = { horses: raw.map((x, i) => { const p = x / tot; return { name: pick[i], p, odds: +(1 / (p * H.overround)).toFixed(2) }; }) };
  };
  I.betHorse = (g, idx, amt) => {
    amt = Math.round(amt); const err = I.canBet(g, amt); if (err) return { ok: false, msg: err };
    const hs = g.invest.race.horses; const r = R.next(); let acc = 0, winner = hs.length - 1;
    for (let i = 0; i < hs.length; i++) { acc += hs[i].p; if (r < acc) { winner = i; break; } }
    const won = winner === idx; I.settle(g, amt, won ? amt * (hs[idx].odds - 1) : -amt);
    const txt = `${hs[winner].name} won the race. ${won ? `You won ${U.money(amt * (hs[idx].odds - 1))}` : `You lost ${U.money(amt)}`}`;
    I.newRace(g);
    return { ok: true, win: won, text: txt };
  };
  I.newGame = (g) => {
    const teams = ['Harbor Hawks', 'Maple Miners', 'Mesa Suns', 'River Kings', 'Valley Bears', 'Coast Pilots', 'Ridge Wolves', 'Lake Comets'];
    const [a, c] = R.shuffle(teams.slice()).slice(0, 2); const p = R.range(0.3, 0.7); const v = CC().sports.vig;
    g.invest.game = { a, b: c, p, oddsA: +(1 / (p * (1 + v))).toFixed(2), oddsB: +(1 / ((1 - p) * (1 + v))).toFixed(2) };
  };
  I.betSports = (g, side, amt) => {
    amt = Math.round(amt); const err = I.canBet(g, amt); if (err) return { ok: false, msg: err };
    const gm = g.invest.game; const aWins = R.chance(gm.p); const won = (side === 'a') === aWins; const odds = side === 'a' ? gm.oddsA : gm.oddsB;
    I.settle(g, amt, won ? amt * (odds - 1) : -amt);
    const txt = `${aWins ? gm.a : gm.b} won. ${won ? `You won ${U.money(amt * (odds - 1))}` : `You lost ${U.money(amt)}`}`;
    I.newGame(g);
    return { ok: true, win: won, text: txt };
  };

  I.liquidateAll = (g, mult) => { for (const s of Object.keys(g.invest.pos)) I.sell(g, s, 1, mult || 1, true); for (const a of g.invest.angels) { const v = Math.round(a.amt * (a.mark || 0.5) * 0.3); if (v > 0) TG.F.earn(g, v, 'Angel stakes sold', null, true); } g.invest.angels = []; };
  I.wipe = (g) => { g.invest.pos = {}; g.invest.marginDebt = 0; g.invest.angels = []; };
  TG.I = I;
})();

</script>
<script>/* js/engine.js */
/* engine.js - game creation, the monthly turn, time skip, reports, achievements, leaderboard, save/load. */
(function () {
  const TG = globalThis.TG; const R = TG.R, U = TG.U;
  const VERSION = 1;
  TG.VERSION = VERSION;

  // ================= REPORT HELPERS =================
  const rep = {};
  rep.newBuf = (m) => ({ month: m, events: [], staff: [], decisions: [], news: [], warns: [] });
  const buf = (g) => (g.cur = g.cur || rep.newBuf(g.month));
  const logPush = (g, e) => { g.log.push(e); if (g.log.length > TG.CONFIG.maxLog) g.log.splice(0, g.log.length - TG.CONFIG.maxLog); };
  rep.event = (g, b, type, text, why, opts) => {
    const e = { m: g.month, type, text, why: why || '', biz: b ? b.name : null, bizId: b ? b.id : null, major: opts && opts.major ? opts.major : null };
    buf(g).events.push(e); logPush(g, e);
    if (b && (type === 'bad' || type === 'major')) { b.bad = (b.bad || []).filter((m) => g.month - m <= 6); b.bad.push(g.month); }
  };
  rep.staff = (g, b, text) => { const e = { m: g.month, type: 'staff', text, biz: b ? b.name : null }; buf(g).staff.push(e); logPush(g, e); };
  rep.decision = (g, b, by, text, outcome) => { const e = { m: g.month, type: 'decision', by: by || 'You', text, outcome: outcome || null, biz: b ? b.name : null }; buf(g).decisions.push(e); logPush(g, e); };
  rep.news = (g, text, tone, big) => { const e = { m: g.month, type: 'news', text, tone: tone || 'info', big: !!big }; buf(g).news.push(e); logPush(g, e); g.newsFeed = g.newsFeed || []; g.newsFeed.push(e); if (g.newsFeed.length > 200) g.newsFeed.shift(); };
  rep.warn = (g, b, text, why, p) => { buf(g).warns.push({ m: g.month, text, why, p, biz: b ? b.name : null }); };
  TG.rep = rep;

  // ================= NEW GAME =================
  const E = {};
  E.scenarios = {
    classic:  { label: 'Classic start', desc: 'Random savings and credit. Buy a property and start a business.' },
    farm:     { label: 'Inherit a failing farm', desc: 'A worn-out farm with old equipment, debt, and a bad reputation. Turn it around.' },
    recession:{ label: 'Start in a recession', desc: 'Normal savings, but the economy just turned down. Cheap assets, weak demand.' },
    rebuild:  { label: 'Rebuild after bankruptcy', desc: '$6,000, bad credit, no loans for 18 months. Lease a cheap lot and claw back.' },
    rich:     { label: 'Silver spoon', desc: '$2 million to start. Big moves are possible, and so are big mistakes.' },
  };
  E.newGame = (opts) => {
    opts = opts || {};
    const C = TG.CONFIG;
    const seed = (opts.seed != null ? opts.seed : Math.floor(Math.random() * 2 ** 31)) >>> 0;
    const g = {
      v: VERSION, gameId: 'g' + seed.toString(36) + Date.now().toString(36).slice(-4), seed, rngState: seed || 1, month: 0, nextId: 1,
      cash: 0, player: { name: opts.name || 'You', credit: 700, bankruptcies: 0, noLoanUntil: 0, ownerBiz: null, exp: {} },
      properties: [], listings: [], businesses: [], loans: [], loc: { balance: 0, rate: 0 }, lawsuits: [], decisions: [], log: [], history: [],
      acc: TG.F.newAcc(), taxLoss: 0, taxPaid: [], negMonths: 0, ceo: null, scenario: opts.scenario || 'classic', reports: [], newsFeed: [],
      settings: Object.assign({ gambling: true, habit: true, stopOnMajor: false, majorTypes: { breakdown: true, keyQuit: true, cash: true, lawsuit: true, strike: true, harvest: false, weather: false }, eventFreq: 'normal', autoCredit: true, ceoBigMoves: false, confirmPending: true }, opts.settings || {}),
      achievements: {}, stats: { peakNW: 0, reached: {}, recessionProfitYears: 0 }, started: Date.now(),
    };
    TG.G = g;
    const mult = C.difficulty.startMoney[opts.money || 'random'] || 1;
    g.cash = Math.round(R.range(C.start.cash[0], C.start.cash[1]) * mult / 1000) * 1000;
    g.player.credit = R.int(C.start.credit[0], C.start.credit[1]);
    TG.W.init(g); TG.P.initListings(g); TG.RE.init(g); TG.I.init(g);
    rep.newBuf(0); g.cur = rep.newBuf(0);
    const sc = g.scenario;
    if (sc === 'recession') { const ph = C.economy.phases.recession; Object.assign(g.world, { phase: 'recession', phaseLeft: R.int(ph.dur[0], ph.dur[1]), econ: ph.econ, baseRate: ph.rate }); g.world.housing = 0.9; }
    if (sc === 'rebuild') { const B = C.finance.bankruptcy; g.cash = B.keepCash; g.player.credit = R.int(B.credit[0], B.credit[1]); g.player.bankruptcies = 1; g.player.noLoanUntil = B.noLoanMonths; }
    if (sc === 'rich') g.cash = 2000000;
    if (sc === 'farm') {
      const p = TG.P.gen(g, TG.P.idealFor('farm')); p.owned = true; p.baseValue = p.price; p.housingAtBuy = 1; p.bought = 0; g.properties.push(p);
      g.cash = 1e9; const r = TG.B.start(g, 'farm', p.id, { name: 'Family Farm' }); const b = r.biz;
      TG.B.quickSetup(g, b, true, 'used');
      for (const it of b.equip) { it.wear = R.range(55, 80); it.age = R.int(100, 200); it.warranty = 0; }
      b.rep = 18; for (const e of b.staff) { e.morale = R.range(30, 45); }
      g.cash = 22000; g.acc = TG.F.newAcc();
      TG.F.newLoan(g, 'business', 140000, { label: 'Inherited farm debt', noCash: true, bizId: b.id });
      g.cur = rep.newBuf(0);
      rep.event(g, b, 'major', 'You inherited a struggling farm', 'Old, worn equipment, unhappy workers, a weak reputation and $140,000 of debt. Your call.');
    }
    g.stats.startCash = g.cash; g.lastNW = TG.F.netWorth(g); g.stats.peakNW = g.lastNW;
    return g;
  };

  // ================= THE MONTH =================
  const sumObj = (o) => U.sum(Object.values(o || {}));
  E.nextMonth = (g) => {
    TG.G = g;
    const C = TG.CONFIG; const m = g.month;
    TG.D.autoResolve(g);
    const cashStart = g.cash, nwStart = g.lastNW != null ? g.lastNW : TG.F.netWorth(g);
    const pre = g.acc || TG.F.newAcc(); // money moved by the player's own actions between months
    g.acc = TG.F.newAcc();
    TG.W.month(g); TG.P.month(g);
    for (const p of g.properties) if (!p.bizId) { if (p.leased) TG.F.spend(g, p.rent, 'Rent (unused property)'); else TG.F.spend(g, TG.P.monthlyTax(g, p), 'Property tax (unused property)'); }
    TG.RE.month(g); TG.I.month(g);
    const bizRows = [];
    for (const b of g.businesses.slice()) {
      if (!g.businesses.includes(b)) continue;
      const before = b.rep;
      const ctx = TG.B.month(g, b);
      if (g.businesses.includes(b)) TG.D.manage(g, b);
      bizRows.push(E.bizWhy(g, b, ctx, before));
    }
    TG.B.monthSuits(g); TG.F.monthLoans(g);
    const opPre = sumObj(g.acc.inc) - sumObj(g.acc.exp);
    TG.D.ceoMonth(g, opPre);
    const opProfit = sumObj(g.acc.inc) - sumObj(g.acc.exp);
    const tax = TG.F.monthTax(g, opProfit);
    TG.F.monthEnd(g);
    const inc = Object.assign({}, g.acc.inc), exp = Object.assign({}, g.acc.exp);
    const profit = sumObj(inc) - sumObj(exp);
    const nw = TG.F.netWorth(g);
    g.history.push({ m, cash: Math.round(g.cash), nw: Math.round(nw), profit: Math.round(profit), inc: Math.round(sumObj(inc)), exp: Math.round(sumObj(exp)), phase: g.world.phase });
    if (g.history.length > C.maxHistory) g.history.shift();
    g.lastNW = nw; g.stats.peakNW = Math.max(g.stats.peakNW, nw);
    const ach = E.checkAchievements(g, profit);
    const b0 = g.cur || rep.newBuf(m);
    const report = {
      m, date: U.dateStr(m), cashStart, cashEnd: g.cash, nwStart, nw, profit, tax, inc, exp, capIn: g.acc.capIn, capOut: g.acc.capOut,
      pre: { inc: sumObj(pre.inc) + sumObj(pre.capIn), exp: sumObj(pre.exp) + sumObj(pre.capOut) },
      biz: bizRows, re: g.re.holdings.length ? { rev: g.re.m.rev, cost: g.re.m.cost, units: TG.RE.unitsOwned(g) } : null,
      events: b0.events, staff: b0.staff, decisions: b0.decisions, news: b0.news, warns: b0.warns, ach,
      world: { phase: TG.W.phaseLabel(g), econ: g.world.econ, rate: g.world.baseRate, inflation: g.world.priceIdx },
      majors: b0.events.filter((e) => e.major).map((e) => ({ kind: e.major, text: e.text })),
      pending: g.decisions.length,
    };
    g.reports.push(E.slimReport(report)); if (g.reports.length > 24) g.reports.shift();
    g.lastReport = report;
    g.month++;
    g.cur = rep.newBuf(g.month);
    g.acc = TG.F.newAcc();
    TG.LB.record(g);
    return report;
  };
  E.slimReport = (r) => ({ m: r.m, date: r.date, profit: r.profit, nw: r.nw, cashEnd: r.cashEnd, events: r.events.slice(0, 40), decisions: r.decisions.slice(0, 30), news: r.news, majors: r.majors, biz: r.biz.map((x) => ({ name: x.name, profit: x.profit })) });

  // explain WHY a business did what it did this month, with numbers
  E.bizWhy = (g, b, ctx, repBefore) => {
    const h = b.hist[b.hist.length - 1] || { rev: 0, cost: 0, profit: 0 }; const prev = b.hist[b.hist.length - 2];
    const why = [];
    const lc = b.lastCtx || {};
    if (b.licensePending > 0) why.push(`Waiting for license: ${b.licensePending} months left, costs keep running`);
    if (lc.demand != null && lc.cap != null) why.push(`Demand ${Math.round(lc.demand).toLocaleString()} vs capacity ${Math.round(lc.cap).toLocaleString()} (served ${Math.round(lc.served || 0).toLocaleString()})`);
    if (ctx && ctx.down > 0.01) why.push(`Downtime cut capacity by ${U.pct(ctx.down)}`);
    const dr = b.rep - repBefore; if (Math.abs(dr) >= 0.5) why.push(`Reputation ${dr > 0 ? 'rose' : 'fell'} ${Math.abs(dr).toFixed(1)} to ${Math.round(b.rep)}`);
    why.push(`Quality ${lc.quality}/100 (staff skill ${lc.skill}, morale ${lc.morale})`);
    if (g.world.econ !== 1) why.push(`Economy: ${TG.W.phaseLabel(g)} (demand x${g.world.econ.toFixed(2)})`);
    if (lc.adBoost) why.push(`Ads added about ${U.pct(lc.adBoost)} demand`);
    if (prev) { const d = h.profit - prev.profit; if (Math.abs(d) > Math.max(500, Math.abs(prev.profit) * 0.15)) why.push(`Profit ${d > 0 ? 'up' : 'down'} ${U.money(Math.abs(d))} vs last month`); }
    if (lc.note) why.push(lc.note);
    const lines = Object.entries(h.lines || {}).sort((a, c) => Math.abs(c[1]) - Math.abs(a[1])).slice(0, 8);
    return { id: b.id, name: b.name, type: b.type, rev: h.rev, cost: h.cost, profit: h.profit, why, lines };
  };

  // ================= TIME SKIP =================
  E.yrsMo = (n) => U.yrsMo(n);
  E.skip = (g, n, opts) => {
    opts = opts || {};
    n = Math.max(1, Math.floor(n));
    const startM = g.month, cash0 = g.cash, nw0 = g.lastNW != null ? g.lastNW : TG.F.netWorth(g);
    const inc = {}, exp = {}; const majors = [], decisions = [], bizTot = {}; let profit = 0, done = 0, stopped = null, events = 0;
    const stopOn = opts.stopOnMajor != null ? opts.stopOnMajor : g.settings.stopOnMajor;
    const types = opts.majorTypes || g.settings.majorTypes;
    for (let i = 0; i < n; i++) {
      const r = E.nextMonth(g); done++;
      profit += r.profit; events += r.events.length;
      for (const k in r.inc) inc[k] = (inc[k] || 0) + r.inc[k];
      for (const k in r.exp) exp[k] = (exp[k] || 0) + r.exp[k];
      for (const b of r.biz) { const t = bizTot[b.name] || (bizTot[b.name] = { rev: 0, cost: 0, profit: 0 }); t.rev += b.rev; t.cost += b.cost; t.profit += b.profit; }
      for (const e of r.events) if (e.type === 'major') majors.push(Object.assign({ date: r.date }, e));
      for (const d of r.decisions) if (d.by && d.by !== 'You') decisions.push(Object.assign({ date: r.date }, d));
      if (stopOn && i < n - 1) {
        const hit = r.majors.find((x) => types[x.kind]);
        if (hit) { stopped = { date: r.date, text: hit.text, kind: hit.kind }; break; }
      }
      if (opts.onProgress) opts.onProgress(i + 1, n);
    }
    return { months: done, asked: n, from: U.dateStr(startM), to: U.dateStr(g.month - 1), cash0, cash1: g.cash, nw0, nw1: g.lastNW, profit, inc, exp, majors: majors.slice(-60), majorCount: majors.length, decisions: decisions.slice(-60), decisionCount: decisions.length, bizTot, stopped, events, pending: g.decisions.length };
  };

  // ================= ACHIEVEMENTS =================
  E.checkAchievements = (g, profit) => {
    const A = g.achievements, got = [];
    const give = (id) => { if (!A[id]) { A[id] = g.month; got.push(id); rep.event(g, null, 'good', `Achievement: ${TG.CONFIG.achievements[id]}`, 'Unlocked'); } };
    const nw = g.lastNW;
    if (profit > 0) give('first_profit');
    if (nw >= 1e6) give('nw_1m'); if (nw >= 1e7) give('nw_10m'); if (nw >= 1e8) give('nw_100m'); if (nw >= 1e9) give('nw_1b');
    if (g.businesses.length >= 3) give('three_biz');
    if (new Set(g.businesses.map((b) => b.type)).size >= 5) give('five_ind');
    if (nw >= 1e6 && !g.loans.length && !g.loc.balance) give('no_loans');
    if (nw >= 1e6 && g.player.bankruptcies > 0) give('comeback');
    if (TG.RE.unitsOwned(g) >= 10) give('landlord');
    if (g.re.flipsProfit >= 5) give('flipper');
    for (const id in g.markets) if (TG.W.share(g, id) >= 0.25) give('market_share');
    const last12 = g.history.slice(-12);
    if (last12.length === 12 && last12.filter((h) => h.phase === 'recession').length >= 6 && U.sum(last12, (h) => h.profit) > 0) give('survivor');
    if (g.month + 1 >= 120) give('decade'); if (g.month + 1 >= 1200) give('century');
    for (const t of TG.CONFIG.leaderboardTargets) if (nw >= t && g.stats.reached[t] == null) g.stats.reached[t] = g.month + 1;
    return got;
  };

  // ================= STORAGE (localStorage with in-memory fallback) =================
  const mem = {};
  const store = {
    ok: (() => { try { const k = '__tg_test'; globalThis.localStorage.setItem(k, '1'); globalThis.localStorage.removeItem(k); return true; } catch (e) { return false; } })(),
    get(k) { try { if (store.ok) return globalThis.localStorage.getItem(k); } catch (e) { /* fall through */ } return mem[k] == null ? null : mem[k]; },
    set(k, v) { try { if (store.ok) { globalThis.localStorage.setItem(k, v); return true; } } catch (e) { /* quota or sandbox */ } mem[k] = v; return false; },
    del(k) { try { if (store.ok) globalThis.localStorage.removeItem(k); } catch (e) { /* ignore */ } delete mem[k]; },
  };
  TG.store = store;
  const SAVE_KEY = 'tycoon_save_v1';
  E.serialize = (g) => JSON.stringify(g);
  E.validate = (g) => {
    if (!g || typeof g !== 'object') throw new Error('Not a save file');
    if (g.v == null || g.v > VERSION) throw new Error('Save is from a newer version');
    for (const k of ['cash', 'month', 'world', 'businesses', 'properties', 'loans', 're', 'invest', 'settings', 'player']) if (g[k] == null) throw new Error('Save is missing ' + k);
    if (!Number.isFinite(g.cash)) throw new Error('Save has a broken cash value');
    return true;
  };
  E.migrate = (g) => {
    g.reports = g.reports || []; g.newsFeed = g.newsFeed || []; g.stats = g.stats || { peakNW: 0, reached: {} };
    g.settings.majorTypes = g.settings.majorTypes || { breakdown: true, keyQuit: true, cash: true, lawsuit: true, strike: true };
    return g;
  };
  E.deserialize = (s) => { const g = JSON.parse(s); E.validate(g); return E.migrate(g); };
  E.save = (g) => { try { return store.set(SAVE_KEY, E.serialize(g)); } catch (e) { return false; } };
  E.load = () => { const s = store.get(SAVE_KEY); if (!s) return null; try { const g = E.deserialize(s); TG.G = g; return g; } catch (e) { return null; } };
  E.clearSave = () => store.del(SAVE_KEY);
  const b64e = (s) => (typeof btoa === 'function' ? btoa(unescape(encodeURIComponent(s))) : Buffer.from(s, 'utf8').toString('base64'));
  const b64d = (s) => (typeof atob === 'function' ? decodeURIComponent(escape(atob(s))) : Buffer.from(s, 'base64').toString('utf8'));
  E.exportCode = (g) => 'TYC1:' + b64e(E.serialize(g));
  E.importCode = (code) => {
    code = String(code || '').trim(); if (code.startsWith('TYC1:')) code = code.slice(5);
    let s; try { s = b64d(code); } catch (e) { throw new Error('That code is not valid'); }
    const g = E.deserialize(s); TG.G = g; return g;
  };

  // ================= LOCAL LEADERBOARD =================
  const LB = {};
  const LB_KEY = 'tycoon_leaderboard_v1';
  LB.all = () => { try { return JSON.parse(store.get(LB_KEY) || '[]'); } catch (e) { return []; } };
  LB.record = (g) => {
    if (g.month % 6 !== 0 && !Object.keys(g.stats.reached).length) return;
    const list = LB.all(); let e = list.find((x) => x.id === g.gameId);
    if (!e) { e = { id: g.gameId, name: g.player.name, scenario: g.scenario }; list.push(e); }
    Object.assign(e, { peak: Math.round(g.stats.peakNW), nw: Math.round(g.lastNW), months: g.month, bankruptcies: g.player.bankruptcies, reached: g.stats.reached, when: Date.now() });
    list.sort((a, c) => c.peak - a.peak); store.set(LB_KEY, JSON.stringify(list.slice(0, 30)));
  };
  TG.LB = LB;
  TG.Game = E;
})();

</script>
