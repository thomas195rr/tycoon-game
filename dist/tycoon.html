<script>/* js/ui/ui-core.js */
/* ui-core.js - rendering helpers, navigation, modal, turn controls, actions dispatch, autosave. */
(function () {
  const TG = globalThis.TG; const U = TG.U;
  const UI = (TG.UI = { screen: 'home', tab: {}, bizId: null, A: {}, S: {} });
  const $ = (s) => document.querySelector(s);
  UI.$ = $;
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  UI.esc = esc;
  UI.m = (x) => U.money(x);
  UI.pct = (x, d) => U.pct(x, d);
  UI.tone = (x) => (x > 0 ? 'good' : x < 0 ? 'bad' : '');
  UI.signed = (x) => `<span class="${UI.tone(x)}">${x > 0 ? '+' : x < 0 ? '-' : ''}${U.money(Math.abs(x))}</span>`;
  UI.pill = (txt, tone) => `<span class="pill ${tone || ''}">${esc(txt)}</span>`;
  UI.risk = (p) => { const r = U.riskLabel(p); return UI.pill(`${r.label} ${U.pct(p, p < 0.1 ? 1 : 0)}`, r.tone); };
  UI.btn = (label, act, arg, cls, dis) => `<button class="btn ${cls || ''}" data-act="${act}"${arg != null ? ` data-arg="${esc(arg)}"` : ''}${dis ? ' disabled' : ''}>${label}</button>`;
  UI.bar = (v, max, invert) => { const p = U.clamp(max ? v / max : 0, 0, 1); const t = invert ? (p > 0.7 ? 'bad' : p > 0.45 ? 'warn' : '') : (p < 0.3 ? 'bad' : p < 0.55 ? 'warn' : ''); return `<div class="bar ${t}"><i style="width:${Math.round(p * 100)}%"></i></div>`; };
  UI.tabs = (key, list) => { const cur = UI.tab[key] || list[0][0]; return `<div class="tabs">${list.map(([id, lbl]) => `<button class="btn sm ${cur === id ? 'on' : ''}" data-act="tab" data-arg="${key}:${id}">${lbl}</button>`).join('')}</div>`; };
  UI.curTab = (key, def) => UI.tab[key] || def;
  UI.ev = (e) => `<div class="ev ${e.type === 'major' ? 'bad' : e.type}"><div>${e.biz ? `<b>${esc(e.biz)}:</b> ` : ''}${esc(e.text)}</div>${e.why ? `<div class="why">Why: ${esc(e.why)}</div>` : ''}</div>`;
  UI.spark = (vals, color) => {
    if (!vals || vals.length < 2) return '';
    const mn = Math.min(...vals, 0), mx = Math.max(...vals, 1); const w = 300, h = 46;
    const pts = vals.map((v, i) => `${(i / (vals.length - 1) * w).toFixed(1)},${(h - 2 - (v - mn) / (mx - mn || 1) * (h - 4)).toFixed(1)}`).join(' ');
    const zy = (h - 2 - (0 - mn) / (mx - mn || 1) * (h - 4)).toFixed(1);
    return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><line x1="0" x2="${w}" y1="${zy}" y2="${zy}" stroke="#d1d5db" stroke-width="1"/><polyline fill="none" stroke="${color || '#15803d'}" stroke-width="2" points="${pts}"/></svg>`;
  };
  // ---- icon-first helpers ----
  UI.S.tips = UI.S.tips || {};
  // (i) button: tap to show a short line, tap again to hide it
  UI.tipBtn = (key) => `<button class="tipb" data-act="tip" data-arg="${esc(key)}" data-nosave="1" aria-label="info">i</button>`;
  UI.tipLine = (key, text) => (UI.S.tips[key] && text ? `<div class="tip">${esc(text)}</div>` : '');
  UI.A.tip = (k) => { UI.S.tips[k] = !UI.S.tips[k]; UI.refresh(); };
  // icon row: icon, label (tap = info), value, actions
  UI.irow = (key, icon, label, value, tip, acts, sub) => `<div class="irow"><span class="ic">${icon}</span><span class="lb" data-act="tip" data-arg="${esc(key)}" data-nosave="1">${esc(label)}${sub ? `<small>${sub}</small>` : ''}</span>${tip ? UI.tipBtn(key) : ''}${value != null ? `<span class="vl">${value}</span>` : ''}${acts ? `<span class="acts">${acts}</span>` : ''}${UI.tipLine(key, tip)}</div>`;
  // big stat tile (tap = info)
  UI.tile = (key, icon, value, label, tone, tip) => `<div class="tile ${tone || ''}" data-act="tip" data-arg="${esc(key)}" data-nosave="1"><div class="ti">${icon}</div><div class="tv">${value}</div><div class="tl">${esc(label)}</div></div>${UI.S.tips[key] && tip ? `<div class="tip" style="grid-column:1/-1;margin:0">${esc(tip)}</div>` : ''}`;
  UI.dot = (c) => `<span class="dot ${c || ''}"></span>`;
  UI.fmtN = (v, u) => (u === '$' ? U.money(v) : u === '%' ? Math.round(v) + '%' : Math.round(v).toLocaleString() + (u ? (u[0] === '/' ? '' : ' ') + u : ''));
  UI.num = (id, def) => { const el = document.getElementById(id); const v = el ? Number(String(el.value).replace(/[^0-9.\-]/g, '')) : NaN; return Number.isFinite(v) ? v : def; };
  UI.val = (id) => { const el = document.getElementById(id); return el ? el.value : ''; };

  UI.toast = (msg, bad) => {
    const t = document.createElement('div'); t.className = 'toast' + (bad ? ' bad' : ''); t.textContent = msg;
    document.body.appendChild(t); setTimeout(() => t.remove(), bad ? 3600 : 2400);
  };
  UI.res = (r, okMsg) => { if (r && r.ok === false) { UI.toast(r.msg || 'Not possible.', true); return false; } if (okMsg) UI.toast(okMsg); return true; };

  // ---------- modal ----------
  UI.modal = (title, html) => {
    UI.closeModal();
    const m = document.createElement('div'); m.className = 'modal'; m.id = 'modal';
    m.innerHTML = `<div class="box"><div class="row sp"><h2 style="margin:0">${title}</h2>${UI.btn('Close', 'closeModal', null, 'sm')}</div>${html}</div>`;
    m.addEventListener('click', (e) => { if (e.target === m) UI.closeModal(); });
    document.body.appendChild(m); m.scrollTop = 0;
  };
  UI.closeModal = () => { const m = document.getElementById('modal'); if (m) m.remove(); };
  UI.A.closeModal = () => { UI.closeModal(); UI.render(); };

  // ---------- frame ----------
  const NAV = [['home', '🏠', 'Home'], ['biz', '🏪', 'My Biz'], ['market', '🗺️', 'Shop'], ['money', '💰', 'Money'], ['more', '⚙️', 'More']];
  const JAIL_OK = ['next', 'skip', 'go', 'tab', 'tip', 'closeModal', 'decisions', 'decide', 'saveInfo', 'exportSave', 'lastReport', 'detail', 'crDetail', 'setToggle', 'setMajor', 'setFreq', 'newGameOpen', 'newGame', 'clearSave', 'clearGo', 'importSave', 'importGo', 'copyCode', 'goMoreTab', 'goMoneyTab', 'logF', 'emp', 'crSup', 'crH', 'mkType', 'mkSort', 'mkMax'];
  // v6 instant updates: derived numbers (capacity, work bars, limits, forecast) for a business as it is RIGHT NOW.
  // TG.B.live recomputes them whenever the business changed (it is cached otherwise), so every action shows its effect at once.
  const LV = (b) => (TG.G && b ? TG.B.live(TG.G, b) : null);
  UI.lc = (b) => { const L = LV(b); return (L && L.ok ? L.ctx : b.lastCtx) || {}; };
  UI.wk = (b) => { const L = LV(b); return (L && L.ok ? L.work : b.work) || []; };
  UI.fc = (b) => { const L = LV(b); return L ? L.fc : b.fc; };
  UI.go = (screen, extra) => { UI.screen = screen; if (extra) Object.assign(UI, extra); UI.render(); window.scrollTo(0, 0); };
  UI.A.go = (arg) => { const [s, id] = String(arg).split(':'); if (s === 'bizd') UI.bizId = id; UI.go(s); };
  UI.A.tab = (arg) => { const i = arg.indexOf(':'); UI.tab[arg.slice(0, i)] = arg.slice(i + 1); UI.render(); };

  UI.saveChip = () => {
    const st = TG.Game.saveState || {};
    if (st.ok === false) return `<span class="chip save no" id="saveInd" data-act="exportSave">⚠️ Not saved</span>`;
    if (st.ok) { const d = new Date(st.at); return `<span class="chip save ok" id="saveInd" data-act="saveInfo" data-nosave="1">💾 Saved ✓ ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}</span>`; }
    return `<span class="chip save" id="saveInd" data-act="saveInfo" data-nosave="1">💾</span>`;
  };
  UI.header = () => {
    const g = TG.G; const nw = g.lastNW != null ? g.lastNW : TG.F.netWorth(g);
    const pend = g.decisions.length; const ph = g.world.phase;
    return `<header class="top"><span class="chip">📅 ${U.dateStr(g.month)}</span>
      <span class="chip cash ${g.cash < 0 ? 'neg' : ''}">💵 ${UI.m(g.cash)}</span>
      <span class="chip">📈 ${UI.m(nw)}</span>
      <span class="chip">${ph === 'boom' ? '☀️' : ph === 'recession' ? '🌧️' : '⛅'} ${TG.W.phaseLabel(g)}</span>
      ${pend ? `<span class="chip dec" data-act="decisions">⚠️ ${pend}</span>` : ''}${UI.saveChip()}</header>
      ${TG.Game.saveState && TG.Game.saveState.ok === false ? `<div class="banner" style="margin:8px 10px 0">⚠️ This browser is not keeping your save (${esc(TG.Game.saveState.err || 'storage blocked')}). ${UI.btn('📤 Export save', 'exportSave', null, 'sm pri')}</div>` : ''}`;
  };
  UI.A.saveInfo = () => { const st = TG.Game.saveState || {}; UI.toast(st.ok ? `Saved on this ${st.where || 'device'} after every month and every tap.` : 'Not saved yet.'); };
  TG.Game.onSaved = () => { const el = document.getElementById('saveInd'); if (el) el.outerHTML = UI.saveChip(); };
  UI.footer = () => {
    const v = UI.S.skipVal || '';
    return `<footer class="turn"><div class="in">
      <button class="btn next" data-act="next">Next Month ▶</button>
      <input type="number" id="skipN" min="1" max="2400" placeholder="#" aria-label="months to skip" value="${esc(v)}" inputmode="numeric">
      <span class="yrs" id="skipYrs">${v ? U.yrsMo(Number(v)) : 'months'}</span>
      <button class="btn" data-act="skip">Skip ⏩</button></div></footer>`;
  };
  const navList = () => (TG.G && TG.CR && TG.CR.on(TG.G) ? NAV.slice(0, 4).concat([['crime', '🕶️', 'Crime']], NAV.slice(4)) : NAV);
  UI.nav = () => `<nav class="bottom"><div class="in">${navList().map(([id, ic, lbl]) => `<button class="${UI.screen === id || (id === 'biz' && UI.screen === 'bizd') ? 'on' : ''}" data-act="go" data-arg="${id}"><span class="ic">${ic}</span>${lbl}</button>`).join('')}</div></nav>`;

  UI.render = () => {
    const g = TG.G; if (!g) return;
    const fn = UI.screens[UI.screen] || UI.screens.home;
    let body = '';
    try { body = fn(); } catch (e) { console.error(e); body = `<div class="card bad">Screen error: ${esc(e.message)}</div>`; }
    const sy = window.scrollY;
    $('#app').innerHTML = UI.header() + `<main>${body}</main>` + UI.footer() + UI.nav();
    if (UI.keepScroll) window.scrollTo(0, sy); UI.keepScroll = false;
  };
  UI.refresh = () => { UI.keepScroll = true; UI.render(); };
  UI.screens = {};

  // ---------- save ----------
  UI.save = () => { const ok = TG.Game.save(TG.G); UI.S.saveOk = ok; return ok; };

  // ---------- turn ----------
  UI.A.next = (force) => {
    const g = TG.G;
    if (g.settings.confirmPending && g.decisions.length && force !== 'go') {
      UI.modal('Decisions waiting', `<div class="card"><p>${g.decisions.length} decision(s) are waiting. If you continue, managers decide where they can; otherwise the default happens.</p><div class="btns">${UI.btn('Decide now', 'decisions', null, 'pri')}${UI.btn('Continue anyway', 'next', 'go')}</div></div>`);
      return;
    }
    UI.closeModal();
    const r = TG.Game.nextMonth(g); UI.save();
    UI.render(); UI.showReport(r);
  };
  UI.busy = (msg) => { const d = document.createElement('div'); d.className = 'modal'; d.id = 'busy'; d.innerHTML = `<div class="box"><b>${esc(msg)}</b></div>`; document.body.appendChild(d); };
  UI.A.skip = () => {
    const n = Math.floor(UI.num('skipN', 0));
    if (!(n >= 1)) return UI.toast('Type how many months to skip.', true);
    if (n > 2400) return UI.toast('Max 2,400 months (200 years) per skip.', true);
    const g = TG.G; UI.S.skipVal = '';
    UI.closeModal(); UI.busy(`Simulating ${n} months (${U.yrsMo(n)}) one by one…`);
    setTimeout(() => {
      let s; try { s = TG.Game.skip(g, n); } catch (e) { console.error(e); UI.toast('Error: ' + e.message, true); }
      const b = document.getElementById('busy'); if (b) b.remove();
      UI.save(); UI.render(); if (s) UI.showSkip(s);
    }, 30);
  };

  // ---------- events ----------
  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
    const fn = UI.A[el.dataset.act]; if (!fn) return;
    e.preventDefault();
    // in jail you can look around and pass time, nothing else
    if (TG.G && TG.CR && TG.CR.jailed(TG.G) && !JAIL_OK.includes(el.dataset.act)) { UI.toast(`⛓️ You are in jail for ${TG.G.crime.jail} more months. Skip time; managers run things.`, true); return; }
    try { fn(el.dataset.arg, el); } catch (err) { console.error(err); UI.toast('Error: ' + err.message, true); }
    if (TG.G && !el.dataset.nosave) UI.save();
  });
  document.addEventListener('input', (e) => {
    if (e.target.id === 'skipN') { UI.S.skipVal = e.target.value; const n = Number(e.target.value); const y = document.getElementById('skipYrs'); if (y) y.textContent = n >= 1 ? U.yrsMo(Math.floor(n)) : 'months'; }
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.id === 'skipN') UI.A.skip(); });
  document.addEventListener('change', (e) => { const el = e.target.closest('[data-change]'); if (!el) return; const fn = UI.A[el.dataset.change]; if (fn) { fn(el.value, el); UI.save(); } });

  // save when the app is hidden or closed (phones kill background tabs)
  const saveNow = () => { try { if (TG.G) UI.save(); } catch (e) { return; } };
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') saveNow(); });
  window.addEventListener('pagehide', saveNow);
  window.addEventListener('beforeunload', saveNow);
  UI.boot = () => {
    const done = (g) => {
      if (g) { TG.G = g; UI.render(); if (!TG.store.ok) UI.toast('Browser storage is blocked here: tap ⚠️ to export your save.', true); }
      else UI.newGameScreen(true);
    };
    let fired = false; const once = (g) => { if (!fired) { fired = true; done(g); } };
    try { TG.Game.loadAsync().then(once, () => once(TG.Game.load())); } catch (e) { once(TG.Game.load()); }
    setTimeout(() => once(TG.Game.load()), 2500);
    // installable app (service worker only works over http/https, not file://)
    if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => null);
  };
})();

</script>
<script>/* js/ui/ui-home.js */
/* ui-home.js - dashboard, monthly report, skip summary, decision cards, new game. */
(function () {
  const TG = globalThis.TG; const U = TG.U; const UI = TG.UI; const esc = UI.esc, m = UI.m;

  UI.screens.home = () => {
    const g = TG.G; const h = g.history; const last = h[h.length - 1];
    let out = '';
    if (!g.businesses.length && !g.re.holdings.length) {
      out += `<div class="card hi"><h3>👋 Let's start!</h3>

        <div class="irow"><span class="ic">3️⃣</span><span class="lb">See what happened, fix the red things, grow</span></div>
        <div class="btns">${UI.btn('🗺️ Go shopping', 'go', 'market', 'pri')}${UI.btn('🏘️ Houses to rent out', 'goMoneyTab', 're')}</div>
        ${g.player.noLoanUntil > g.month ? `<div class="mute">🏦 Banks won't lend for ${g.player.noLoanUntil - g.month} more months.</div>` : ''}</div>`;
    }
    out += `<div class="tiles">${UI.tile('h_cash', '💵', m(g.cash), 'Cash', g.cash < 0 ? 'r' : 'g', 'Money you can spend right now.')}
      ${UI.tile('h_nw', '📈', m(g.lastNW), 'Worth', '', 'Everything you own minus everything you owe.')}
      ${(() => { const lr = g.lastReport && g.lastReport.money; const v = lr ? lr.net : last ? last.profit : null; return UI.tile('h_pf', '💰', v != null ? (v >= 0 ? '+' : '−') + m(Math.abs(v)) : '–', 'Left with last month', v == null ? '' : v >= 0 ? 'g' : 'r', 'Cash change last month: everything in minus everything out (sales, rent, wages, machines, loan payments, tax...). Tap 📄 Last month for the full report.'); })()}
      ${UI.tile('h_cr', '🏦', TG.CREDIT.score(g).score, 'Credit score', TG.CREDIT.score(g).score >= 700 ? 'g' : TG.CREDIT.score(g).score >= 620 ? 'y' : 'r', 'Higher = better loan odds and cheaper rates. Details in Money → Finance.')}</div>`;
    { const L = TG.IN.list(g); const mine = new Set(g.businesses.map((b) => TG.IN.ofBiz(b))); const sh = L.filter((x) => mine.has(x.k)); const show = (sh.length ? sh : L.sort((a, c) => c.s.x - a.s.x).slice(0, 3)).slice(0, 4);
      out += `<div class="card"><div class="row sp"><h3 style="margin:0">📈 Industry outlook</h3>${UI.btn('See all', 'go', 'ind', 'xs')}</div>${show.map((x) => `<div class="small">${x.d.icon} ${esc(x.d.label)} ${UI.pill(x.st.label, x.st.tone)} ${TG.IN.arrow(x.s)}</div>`).join('')}</div>`; }
    const al = [];

    for (const ls of g.lawsuits) al.push(`<div class="ev bad">⚖️ Sued: ${esc(ls.label)} (${m(ls.amount)}), ${ls.left} month(s) left</div>`);
    for (const b of g.businesses) {
      const br = b.equip.filter((x) => x.broken); if (br.length) al.push(`<div class="ev bad" data-act="go" data-arg="bizd:${b.id}" style="cursor:pointer">🔧 ${esc(b.name)}: ${br.length} broken</div>`);
      if (b.lastCtx && b.lastCtx.note) al.push(`<div class="ev info" data-act="go" data-arg="bizd:${b.id}" style="cursor:pointer">💡 ${esc(b.name)}: ${esc(b.lastCtx.note)}</div>`);
    }
    if (g.lastReport && g.lastReport.warns) for (const w of g.lastReport.warns.slice(0, 3)) al.push(`<div class="ev warn">⚠️ ${w.biz ? esc(w.biz) + ': ' : ''}${esc(w.text)}</div>`);
    if (al.length) out += `<div class="card"><h3>🔔 Look at these</h3>${al.join('')}</div>`;
    if (g.businesses.length) { out += `<h3>🏪 My businesses</h3>`; for (const b of g.businesses) out += UI.bizCard(b); }
    if (g.re.holdings.length) out += `<div class="card tap" data-act="goMoneyTab" data-arg="re"><div class="row"><span class="ico">🏘️</span><b class="grow">Houses & flats</b><b>${TG.RE.unitsOwned(g)} 🚪</b></div><div class="mute">Last month: ${UI.signed(Math.round(U.sum(g.re.holdings, (h) => h.lastNet || 0)))} after every cost and mortgage payment · ${g.re.holdings.reduce((a, h) => a + (h.tenants || []).filter((t) => !t).length, 0)} empty units</div></div>`;
    out += `<div class="card">${h.length > 2 ? `<div class="mute">📈 Worth</div>${UI.spark(h.slice(-60).map((x) => x.nw))}<div class="mute">💰 Profit each month</div>${UI.spark(h.slice(-60).map((x) => x.profit), '#2563eb')}` : ''}
      <div class="btns">${g.lastReport ? UI.btn('📄 Last month', 'lastReport') : ''}${UI.btn('📰 News', 'goMoreTab', 'news')}${UI.btn('📜 History', 'goMoreTab', 'log')}</div></div>`;
    const risks = [];
    for (const b of g.businesses) for (const r of TG.B.topRisks(g, b).slice(0, 3)) risks.push(Object.assign({ biz: b.name }, r));
    risks.sort((a, b) => b.p - a.p);
    if (risks.length) out += `<div class="card"><details><summary>🎲 Biggest risks next month</summary><table>${risks.slice(0, 6).map((r) => `<tr><td>${esc(r.biz)}: ${esc(r.label)}<div class="mute">${esc(r.why)}</div></td><td class="n">${UI.risk(r.p)}</td></tr>`).join('')}</table></details></div>`;
    return out;
  };
  UI.bizCard = (b) => {
    const g = TG.G, d = TG.CONFIG.businesses[b.type]; const h = b.hist[b.hist.length - 1];
    const lc = UI.lc(b); const fl = b.flow && b.flow.rows ? b.flow.rows : [];
    const bad = fl.filter((x) => x.c === 'r').length, warn = fl.filter((x) => x.c === 'y').length;
    const res = h ? (h.cash != null ? h.cash : h.profit) : 0; const shut = lc.closed || (b.lastCtx && b.lastCtx.closed);
    const tone = !h ? '' : res < 0 || bad || shut ? 'r' : warn > 2 ? 'y' : 'g';
    const top = fl.slice(0, 3).map((x) => `<span class="pill ${x.c === 'r' ? 'bad' : x.c === 'y' ? 'warn' : x.c === 'g' ? 'good' : ''}">${x.i} ${UI.fmtN(x.v, x.u)}</span>`).join(' ');
    return `<div class="card tap" data-act="go" data-arg="bizd:${b.id}"><div class="row"><span class="ico">${d.icon}</span><div class="grow"><div class="row sp"><b>${esc(b.name)}</b><span class="row">${UI.dot(tone)}${h ? UI.signed(Math.round(res)) : '<span class="mute">new</span>'}</span></div>${shut ? `<div class="closed small">🚫 ${esc(lc.note || 'Closed: no supplies, no manager')}</div>` : ''}
      <div class="mute">${b.licensePending > 0 ? `⏳ license ${b.licensePending} mo · ` : ''}⭐ ${Math.round(b.rep)} · 👥 ${TG.S.allStaff(b).length} · 🛠️ ${b.equip.length}${g.player.ownerBiz === b.id ? ' · 👤 you' : b.spec.gm ? ' · 👔 boss' : ' · ⚠️ no boss'}${lc.cap ? ` · 📊 ${Math.round((lc.served || 0) / lc.cap * 100)}%` : ''}</div>${top ? `<div style="margin-top:4px">${top}</div>` : ''}</div></div></div>`;
  };
  UI.A.goMoneyTab = (t) => { UI.tab.money = t; UI.go('money'); };
  UI.A.goMoreTab = (t) => { UI.tab.more = t; UI.go('more'); };

  // ---------- monthly report ----------
  const plTable = (inc, exp) => {
    const rows = []; let ti = 0, te = 0;
    for (const [k, v] of Object.entries(inc || {}).sort((a, b) => b[1] - a[1])) { ti += v; rows.push(`<tr><td>${esc(k)}</td><td class="n good">+${m(v)}</td></tr>`); }
    for (const [k, v] of Object.entries(exp || {}).sort((a, b) => b[1] - a[1])) { te += v; rows.push(`<tr><td>${esc(k)}</td><td class="n bad">-${m(v)}</td></tr>`); }
    rows.push(`<tr><td><b>Operating profit</b></td><td class="n"><b>${UI.signed(ti - te)}</b></td></tr>`);
    return `<table>${rows.join('')}</table>`;
  };
  UI.reportHtml = (r) => {
    let o = `<div class="card"><div class="row sp"><div><div class="mute">Profit (after tax)</div><div class="big">${UI.signed(r.profit)}</div></div><div><div class="mute">Cash</div><div class="big">${m(r.cashEnd)}</div><div class="mute">${UI.signed(r.cashEnd - r.cashStart)} this month</div></div><div><div class="mute">Net worth</div><div class="big">${m(r.nw)}</div><div class="mute">${UI.signed(r.nw - r.nwStart)}</div></div></div>
      <div class="mute" style="margin-top:4px">Economy: ${esc(r.world.phase)} · interest ${U.pct(r.world.rate, 1)} · prices x${r.world.inflation.toFixed(2)}${r.tax ? ` · income tax ${m(r.tax)}` : ''}</div></div>`;
    if (r.ach && r.ach.length) o += `<div class="card" style="border-color:#15803d">🏆 Achievement${r.ach.length > 1 ? 's' : ''}: ${r.ach.map((a) => esc(TG.CONFIG.achievements[a])).join(', ')}</div>`;
    for (const b of r.biz) {
      o += `<div class="card"><div class="row sp"><b>${esc(b.name)}</b>${UI.signed(b.profit)}</div><div class="mute">Revenue ${m(b.rev)} · costs ${m(b.cost)}</div>
        <ul class="plain small">${b.why.map((w) => `<li>${esc(w)}</li>`).join('')}</ul>
        <details><summary class="small">Income & expense lines</summary><table>${b.lines.map(([k, v]) => `<tr><td>${esc(k)}</td><td class="n ${v >= 0 ? 'good' : 'bad'}">${v >= 0 ? '+' : '-'}${m(Math.abs(v))}</td></tr>`).join('')}</table></details></div>`;
    }
    if (r.re) o += `<div class="card"><b>🏘️ Real estate</b><div class="mute">${r.re.units} units · rent in ${m(r.re.rev)} · costs ${m(r.re.cost)} · net ${UI.signed(r.re.rev - r.re.cost)}</div></div>`;
    const evs = r.events.filter((e) => e.type !== 'news');
    if (evs.length) o += `<div class="card"><h3 style="margin-top:0">What happened (${evs.length})</h3>${evs.slice(0, 60).map(UI.ev).join('')}</div>`;
    if (r.decisions.length) o += `<div class="card"><h3 style="margin-top:0">Decisions made</h3>${r.decisions.map((d) => `<div class="ev ${d.outcome === 'bad' ? 'bad' : d.outcome === 'good' ? 'good' : 'info'}"><b>${esc(d.by)}</b>${d.biz ? ` (${esc(d.biz)})` : ''}: ${esc(d.text)}${d.outcome ? ` ${UI.pill(d.outcome === 'good' ? 'good call' : d.outcome === 'bad' ? 'bad call' : 'ok call', d.outcome === 'good' ? 'good' : d.outcome === 'bad' ? 'bad' : '')}` : ''}</div>`).join('')}</div>`;
    if (r.staff.length) o += `<div class="card"><h3 style="margin-top:0">Staff changes</h3>${r.staff.map((s) => `<div class="small">👥 ${s.biz ? esc(s.biz) + ': ' : ''}${esc(s.text)}</div>`).join('')}</div>`;
    if (r.news.length) o += `<div class="card"><h3 style="margin-top:0">News</h3>${r.news.map((n) => `<div class="ev ${n.tone}">📰 ${esc(n.text)}</div>`).join('')}</div>`;
    if (r.warns.length) o += `<div class="card"><h3 style="margin-top:0">Warning signs</h3>${r.warns.map((w) => `<div class="ev warn">${w.biz ? esc(w.biz) + ': ' : ''}${esc(w.text)}${w.p ? ` (${U.pct(w.p, 1)})` : ''}<div class="why">${esc(w.why || '')}</div></div>`).join('')}</div>`;
    o += `<div class="card"><details><summary>Full money flow</summary>${plTable(r.inc, r.exp)}
      ${Object.keys(r.capOut || {}).length || Object.keys(r.capIn || {}).length ? `<div class="mute" style="margin-top:6px">Not counted as profit (buying/selling assets, loans):</div><table>${Object.entries(r.capIn || {}).map(([k, v]) => `<tr><td>${esc(k)}</td><td class="n">+${m(v)}</td></tr>`).join('')}${Object.entries(r.capOut || {}).map(([k, v]) => `<tr><td>${esc(k)}</td><td class="n">-${m(v)}</td></tr>`).join('')}</table>` : ''}</details></div>`;
    return o;
  };
  UI.showReport = (r) => {
    const g = TG.G;
    UI.modal(`📄 ${r.date} report`, UI.reportHtml(r) + `<div class="btns">${g.decisions.length ? UI.btn(`⚠️ ${g.decisions.length} decision(s) waiting`, 'decisions', null, 'pri') : ''}${UI.btn('Close', 'closeModal')}</div>`);
  };
  UI.A.lastReport = () => { if (TG.G.lastReport) UI.showReport(TG.G.lastReport); };

  // ---------- skip summary ----------
  UI.showSkip = (s) => {
    let o = `<div class="card"><div class="mute">${s.from} to ${s.to}: ${s.months} months (${U.yrsMo(s.months)}) simulated one by one${s.months < s.asked ? `, stopped early of ${s.asked}` : ''}</div>
      ${s.stopped ? `<div class="ev bad"><b>Stopped early (${esc(s.stopped.date)}):</b> ${esc(s.stopped.text)}</div>` : ''}
      <div class="row sp" style="margin-top:6px"><div><div class="mute">Total profit</div><div class="big">${UI.signed(s.profit)}</div></div><div><div class="mute">Cash</div><div class="big">${m(s.cash1)}</div><div class="mute">from ${m(s.cash0)}</div></div><div><div class="mute">Net worth</div><div class="big">${m(s.nw1)}</div><div class="mute">from ${m(s.nw0)}</div></div></div></div>`;
    const bt = Object.entries(s.bizTot);
    if (bt.length) o += `<div class="card"><h3 style="margin-top:0">By business</h3><table>${bt.map(([n, t]) => `<tr><td>${esc(n)}</td><td class="n">rev ${m(t.rev)}</td><td class="n">${UI.signed(t.profit)}</td></tr>`).join('')}</table></div>`;
    o += `<div class="card"><h3 style="margin-top:0">Major events (${s.majorCount})</h3>${s.majors.length ? s.majors.slice(-40).reverse().map((e) => `<div class="ev bad"><b>${esc(e.date)}</b> ${e.biz ? esc(e.biz) + ': ' : ''}${esc(e.text)}<div class="why">${esc(e.why || '')}</div></div>`).join('') : '<div class="mute">None. Quiet stretch.</div>'}</div>`;
    o += `<div class="card"><h3 style="margin-top:0">Manager decisions (${s.decisionCount})</h3>${s.decisions.length ? s.decisions.slice(-30).reverse().map((d) => `<div class="ev ${d.outcome === 'bad' ? 'bad' : d.outcome === 'good' ? 'good' : 'info'}"><b>${esc(d.date)}</b> ${esc(d.by)}: ${esc(d.text)}</div>`).join('') : '<div class="mute">No manager decisions. Without managers, problems sat unhandled.</div>'}</div>`;
    o += `<div class="card"><details><summary>Money flow over the skip</summary>${plTable(s.inc, s.exp)}</details></div>`;
    UI.modal(`⏩ Skip summary`, o + `<div class="btns">${s.pending ? UI.btn(`⚠️ ${s.pending} decision(s) waiting`, 'decisions', null, 'pri') : ''}${UI.btn('Close', 'closeModal')}</div>`);
  };

  // ---------- decisions ----------
  UI.A.decisions = () => {
    const g = TG.G;
    if (!g.decisions.length) { UI.closeModal(); UI.toast('No decisions waiting.'); UI.render(); return; }
    const o = g.decisions.map((d) => {
      const b = d.bizId ? TG.B.get(g, d.bizId) : null; const h = TG.D.handler(g, b, d.kind);
      return `<div class="card"><div class="row sp"><b>${esc(d.title)}</b>${b ? `<span class="mute">${esc(b.name)}</span>` : ''}</div><div>${esc(d.text || '')}</div>${d.why ? `<div class="mute">Why: ${esc(d.why)}</div>` : ''}
      <div class="btns">${d.options.map((o) => UI.btn(esc(o.label), 'decide', `${d.id}|${o.id}`, 'sm')).join('')}</div>
      <div class="mute" style="margin-top:4px">If you don't choose: ${h ? `${esc(h.label)} decides (${U.pct(h.p)} chance of a good call)` : d.def != null ? `default "${esc((d.options.find((x) => x.id === d.def) || {}).label || d.def)}"` : 'it stays open until the deadline'}</div></div>`;
    }).join('');
    UI.modal('⚠️ Decisions', o);
  };
  UI.A.decide = (arg) => {
    const g = TG.G; const [id, opt] = arg.split('|'); const d = g.decisions.find((x) => x.id === id); if (!d) return;
    TG.D.resolve(g, d, opt, null);
    UI.toast('Done.'); UI.save();
    if (g.decisions.length) UI.A.decisions(); else { UI.closeModal(); UI.render(); }
  };

  // ---------- new game ----------
  UI.newGameScreen = (first) => {
    const sc = TG.Game.scenarios;
    const o = `<div class="card"><p>A turn-based business sim. Buy property, start businesses, hire people, manage risk. Every outcome is a probability, and each month's report explains what happened and why.</p>
      <div class="kv"><span>Your name</span><span><input type="text" id="ngName" value="${esc((TG.G && TG.G.player.name) || 'You')}" maxlength="24"></span>
      <span>Starting money</span><span><select id="ngMoney"><option value="random">Random ($90k-$260k)</option><option value="low">Low</option><option value="high">High</option></select></span>
      <span>Event frequency</span><span><select id="ngFreq"><option value="normal">Normal</option><option value="calm">Calm (fewer bad events)</option></select></span>
      <span>Gambling & high-risk investing</span><span><select id="ngGamble"><option value="1">On</option><option value="0">Off (hidden)</option></select></span>
      <span>Seed (optional)</span><span><input type="number" id="ngSeed" placeholder="random"></span></div></div>
      <h3>Choose a start</h3>${Object.entries(sc).map(([id, s]) => `<div class="card"><div class="row sp"><div class="grow"><b>${esc(s.label)}</b><div class="mute">${esc(s.desc)}</div></div>${UI.btn('Start', 'newGame', id, 'pri')}</div></div>`).join('')}
      ${first ? '' : '<div class="mute">Starting a new game replaces the current autosave (export it first in Settings if you want to keep it).</div>'}`;
    if (first) { document.querySelector('#app').innerHTML = `<header class="top"><span class="date">🏢 Tycoon</span></header><main><h2>New game</h2>${o}</main>`; }
    else UI.modal('New game', o);
  };
  UI.A.newGame = (scenario) => {
    const seedV = UI.num('ngSeed', NaN);
    const g = TG.Game.newGame({ scenario, name: UI.val('ngName') || 'You', money: UI.val('ngMoney'), seed: Number.isFinite(seedV) ? seedV : undefined, settings: { eventFreq: UI.val('ngFreq') || 'normal', gambling: UI.val('ngGamble') !== '0' } });
    TG.G = g; UI.closeModal(); UI.save(); UI.go(scenario === 'farm' ? 'biz' : 'home');
    UI.toast('New game started. Good luck!');
  };
})();

</script>
<script>/* js/ui/ui-market.js */
/* ui-market.js - property market (filtered by the business you want), buying/leasing, starting a business. */
(function () {
  const TG = globalThis.TG; const U = TG.U; const UI = TG.UI; const esc = UI.esc, m = UI.m;
  UI.S.mkType = UI.S.mkType || 'cafe'; UI.S.mkSort = UI.S.mkSort || 'suit'; UI.S.mkMax = UI.S.mkMax || '';

  const tierLbl = { small: 'Small business', between: 'Grows with time & money', corp: 'Corporation' };
  UI.typeOptions = (sel) => {
    const C = TG.CONFIG.businesses; let o = '';
    for (const t of ['small', 'between', 'corp']) {
      o += `<optgroup label="${tierLbl[t]}">`;
      for (const [id, d] of Object.entries(C)) if (d.tier === t) o += `<option value="${id}"${id === sel ? ' selected' : ''}>${d.icon} ${esc(d.name)} (setup ~${m(d.setupCost)})</option>`;
      o += '</optgroup>';
    }
    return o;
  };

  UI.screens.market = () => {
    const g = TG.G, C = TG.CONFIG; const type = UI.S.mkType, d = C.businesses[type];
    let o = `<h2>🗺️ Pick a business</h2><div class="card"><div class="btns">${Object.entries(C.businesses).map(([k, x]) => `<button class="btn ${k === type ? 'pri' : ''}" style="font-size:26px;min-width:56px" data-act="mkType" data-arg="${k}" title="${esc(x.name)}">${x.icon}</button>`).join('')}</div></div>`;
    o += `<div class="card"><div class="row"><span class="small">I want to start a</span><select data-change="mkType">${UI.typeOptions(type)}</select></div>
      <div class="mute" style="margin-top:4px">${d.icon} <b>${esc(d.name)}</b> (${tierLbl[d.tier]}): ${esc(d.blurb || '')}</div>
      <div class="mute">Setup ${m(TG.B.setupCost(g, type, { acres: 0 }, null))} plus equipment and staff · needs ${d.space.unit === 'acres' ? `about ${d.space.ideal} acres` : `about ${d.space.ideal.toLocaleString()} sq ft`}${d.license ? ` · license takes ${d.license.months} months` : ''}</div>
      <div class="row" style="margin-top:6px"><span class="small">Sort</span><select data-change="mkSort">${[['suit', 'Best fit'], ['price', 'Cheapest'], ['priceD', 'Most expensive'], ['size', 'Biggest'], ['loc', 'Location']].map(([v, l]) => `<option value="${v}"${UI.S.mkSort === v ? ' selected' : ''}>${l}</option>`).join('')}</select>
      <span class="small">Max price</span><input type="number" id="mkMax" value="${esc(UI.S.mkMax)}" placeholder="any" data-change="mkMax"></div></div>`;
    // owned/leased empty properties first
    const free = g.properties.filter((p) => !p.bizId);
    if (free.length) {
      o += `<h3>Your empty properties</h3>`;
      for (const p of free) o += propCard(p, type, true);
    }
    let L = g.listings.map((p) => ({ p, s: TG.P.suit(p, type) }));
    const mx = Number(UI.S.mkMax); if (mx > 0) L = L.filter((x) => x.p.price <= mx);
    const sorters = { suit: (a, b) => b.s - a.s, price: (a, b) => a.p.price - b.p.price, priceD: (a, b) => b.p.price - a.p.price, size: (a, b) => (b.p.sqft + b.p.acres * 40000) - (a.p.sqft + a.p.acres * 40000), loc: (a, b) => (a.p.loc + a.p.region).localeCompare(b.p.loc + b.p.region) };
    L.sort(sorters[UI.S.mkSort] || sorters.suit);
    o += `<h3>For sale (${L.length})</h3><div class="mute" style="margin:-4px 0 6px">New listings appear every month. Lease = no big purchase, but monthly rent and nothing to sell later.</div>`;
    for (const x of L) o += propCard(x.p, type, false, x.s);
    return o;
  };
  UI.A.mkType = (v) => { UI.S.mkType = v; UI.render(); };
  UI.A.mkSort = (v) => { UI.S.mkSort = v; UI.render(); };
  UI.A.mkMax = (v) => { UI.S.mkMax = v; UI.render(); };

  function propCard(p, type, mine, s) {
    const g = TG.G, C = TG.CONFIG; if (s == null) s = TG.P.suit(p, type);
    const sl = TG.P.suitLabel(s); const pc = TG.P.prosCons(p, type);
    const kind = C.propertyKinds[p.kind]; const fees = Math.round(p.price * C.property.buyCostPct);
    const down = Math.round(p.price * C.property.mortgageDown); const rent = TG.P.leaseRent(g, p);
    const mort = TG.F.payment(p.price - down, TG.F.rateFor(g, 'mortgage'), C.finance.loans.mortgage.term);
    let btns = '';
    if (mine) btns = UI.btn(`Start ${esc(C.businesses[type].name)} here`, 'startHere', p.id, 'pri') + UI.btn('Start another type…', 'startPick', p.id) + UI.btn(p.leased ? 'End lease' : `Sell (~${m(TG.P.value(g, p) * (1 - C.property.sellCostPct))})`, 'sellProp', p.id, 'badb');
    else btns = UI.btn(`Buy ${m(p.price + fees)}`, 'acq', `${p.id}|cash`, 'pri', g.cash < p.price + fees) + UI.btn(`🏦 Mortgage (${m(down + fees)} down, ~${m(mort)}/mo)…`, 'propFin', p.id, '', g.cash < down + fees) + UI.btn(`Lease ${m(rent)}/mo`, 'acq', `${p.id}|lease`, '', g.cash < rent * (1 + C.property.leaseDeposit));
    return `<div class="card"><div class="row sp"><b>${kind.icon || '🏠'} ${esc(kind.label)} · ${esc(p.name)}</b>${UI.pill(`${sl.label} fit ${Math.round(s * 100)}%`, sl.tone)}</div>
      <div class="mute">${esc(TG.P.locLabel(p))} · ${esc(TG.P.sizeLabel(p))}${mine ? ` · ${p.leased ? `leased ${m(p.rent)}/mo` : `owned, worth ~${m(TG.P.value(g, p))}`}` : ` · <b>${m(p.price)}</b>`}</div>
      <div class="grid2 small" style="margin-top:4px"><div>${pc.pros.map((x) => `<div class="good">+ ${esc(x)}</div>`).join('') || '<div class="mute">No standout pros</div>'}</div><div>${pc.cons.map((x) => `<div class="bad">− ${esc(x)}</div>`).join('') || '<div class="mute">No obvious cons</div>'}</div></div>
      <div class="btns">${btns}</div></div>`;
  }

  UI.A.acq = (arg) => {
    const [id, mode] = arg.split('|'); const g = TG.G;
    const r = TG.P.acquire(g, id, mode); if (!UI.res(r)) return;
    UI.toast(mode === 'lease' ? 'Lease signed.' : 'Property bought.'); UI.refresh();
    UI.startDialog(r.prop.id, UI.S.mkType);
  };
  UI.A.startHere = (pid) => UI.startDialog(pid, UI.S.mkType);
  UI.A.startPick = (pid) => {
    UI.modal('Start which business?', `<div class="card"><select id="spType">${UI.typeOptions(UI.S.mkType)}</select><div class="btns">${UI.btn('Next', 'startPick2', pid, 'pri')}</div></div>`);
  };
  UI.A.startPick2 = (pid) => UI.startDialog(pid, UI.val('spType'));
  UI.A.sellProp = (pid) => { const v = TG.P.sell(TG.G, pid); UI.toast(v > 0 ? `Sold for ${m(v)}.` : 'Done.'); UI.refresh(); };

  UI.startDialog = (pid, type) => {
    const g = TG.G, C = TG.CONFIG, d = C.businesses[type]; const p = g.properties.find((x) => x.id === pid); if (!p) return;
    const s = TG.P.suit(p, type), sl = TG.P.suitLabel(s);
    let extra = '';
    if (d.model === 'farm') {
      const best = TG.M.bestEnterprise(p);

        <div class="mute">Suggested for this land: ${esc(best)}. This only sets how your acres start: later you can move acres between 🐄 cow, 🌾 crop and 🍎 orchard areas (costs money and a month or two). New orchards take ${d.farm.enterprises.orchard.rampMonths} months to bear fruit unless one is already planted; cows need a herd. Crop farms include the first season's seed.</div>`;
    }
    if (d.model === 'franchise') {
      const own = g.businesses.filter((b) => C.businesses[b.type].tier === 'small');
      extra = `<div class="kv"><span>Concept to franchise</span><span><select id="stFrom">${own.map((b) => `<option value="biz:${b.id}">Your ${esc(b.name)} (rep ${Math.round(b.rep)}, 30% cheaper setup)</option>`).join('')}${Object.entries(C.businesses).filter(([, x]) => x.tier === 'small').map(([id, x]) => `<option value="c:${id}">New ${esc(x.name)} concept</option>`).join('')}</select></span></div><div class="mute">A proven concept you already run starts with a better reputation.</div>`;
    }
    const cost = TG.B.setupCost(g, type, p, d.model === 'farm' ? { ent: TG.M.bestEnterprise(p) } : null);
    UI.modal(`Start a ${esc(d.name)}`, `<div class="card"><div class="row sp"><b>${d.icon} ${esc(d.name)} at ${esc(p.name)}</b>${UI.pill(`${sl.label} fit`, sl.tone)}</div>
      <div class="mute">${esc(d.blurb || '')}</div>
      <div class="kv" style="margin-top:6px"><span>Name</span><span><input type="text" id="stName" value="${esc(d.name)}" maxlength="30"></span>
      <span>Setup cost (fit-out, permits${d.license ? ', license' : ''})</span><span>${m(cost)}</span><span>Your cash</span><span>${m(g.cash)}</span></div>${extra}
      ${s < 0.4 ? '<div class="ev bad">This property is a poor fit: expect weak demand or high costs.</div>' : ''}
      <div class="kv" style="margin-top:6px"><span>Quick setup: buy basic equipment & hire a starting team</span><span><select id="stQuick"><option value="standard">Yes, standard gear</option><option value="budget">Yes, budget gear</option><option value="used">Yes, used gear (cheap, breaks more)</option><option value="">No, I'll do it myself</option></select></span></div>
      <div class="btns">${UI.btn('Open the business', 'startGo', `${pid}|${type}`, 'goodb')}</div></div>`);
  };
  UI.A.startGo = (arg) => {
    const [pid, type] = arg.split('|'); const g = TG.G, d = TG.CONFIG.businesses[type];
    const opts = { name: UI.val('stName') || d.name };
    if (d.model === 'farm') opts.ent = UI.val('stEnt');
    if (d.model === 'franchise') { const v = UI.val('stFrom'); if (v.startsWith('biz:')) opts.fromBiz = v.slice(4); else opts.concept = v.slice(2); }
    const q = UI.val('stQuick');
    const r = TG.B.start(g, type, pid, opts); if (!UI.res(r)) return;
    if (q) { const qs = TG.B.quickSetup(g, r.biz, true, q); UI.toast(`Opened ${r.biz.name}. Quick setup spent ~${m(qs.cost)} on gear and hired staff.`); }
    else UI.toast(`Opened ${r.biz.name}. Hire staff and buy equipment before next month.`);
    UI.closeModal(); UI.bizId = r.biz.id; UI.tab.biz = 'overview'; UI.go('bizd');
  };
})();

<script>/* js/ui/ui-biz.js */
/* ui-biz.js - business list and business detail: overview, staff, equipment, upgrades & insurance, marketing, ownership. */
(function () {
  const TG = globalThis.TG; const U = TG.U; const UI = TG.UI; const esc = UI.esc, m = UI.m;
  const biz = () => TG.B.get(TG.G, UI.bizId);

  UI.screens.biz = () => {
    const g = TG.G;
    let o = `<h2>🏢 Your businesses</h2>`;
    if (!g.businesses.length) o += `<div class="card">No businesses yet. ${UI.btn('🗺️ Find a property', 'go', 'market', 'pri')}</div>`;
    for (const b of g.businesses) o += UI.bizCard(b);
    const free = g.properties.filter((p) => !p.bizId);
    o += `<div class="btns">${UI.btn('➕ Start another business', 'go', 'market', 'pri')}${free.length ? UI.btn(`${free.length} empty propert${free.length > 1 ? 'ies' : 'y'}`, 'go', 'market') : ''}${UI.btn('👔 Managers & CEO', 'goMoreTab', 'mgr')}</div>`;
    return o;
  };

  UI.screens.bizd = () => {
    const g = TG.G, b = biz(); if (!b) { UI.screen = 'biz'; return UI.screens.biz(); }
    const d = TG.B.def(b);
    const tabs = [['overview', '📋 Now'], ['rep', '📊 Reports'], ['staff', '👥 Staff'], ['mgr', '🧑‍💼 Manager'], ['equip', '🛠️ Gear'], ['upg', '⬆️ Extras'], ['mkt', '📣 Ads']];
    if (TG.UI.modelPanel[d.model]) tabs.splice(2, 0, ['model', TG.UI.modelPanel[d.model].label]);
    tabs.push(['own', '🔑 Owner']);
    const t = UI.curTab('biz', 'overview');
    const body = { overview, rep: () => UI.reportsTab(g, b), staff, mgr, equip, upg, mkt, own, model: () => TG.UI.modelPanel[d.model].render(g, b) }[t] || overview;
    return `<div class="row sp"><h2>${d.icon} ${esc(b.name)}</h2>${UI.btn('◀ All', 'go', 'biz', 'sm')}</div>${UI.tabs('biz', tabs)}${body(g, b)}`;
  };

  // ---------- overview (icon-first) ----------
  const PR = () => TG.PR;
  const toneRep = (v) => (v >= 60 ? 'g' : v >= 35 ? 'y' : 'r');
  function overview(g, b) {
    const d = TG.B.def(b), lc = UI.lc(b); const h = b.hist; const last = h[h.length - 1];
    let o = `<div class="tiles">
      ${(() => { const v = last ? (last.cash != null ? last.cash : last.profit) : null; return UI.tile('t_profit', '💰', last ? (v >= 0 ? '+' : '−') + m(Math.abs(v)) : '–', 'True result last month', last ? (v >= 0 ? 'g' : 'r') : '', last ? `Everything this business really cost and made last month, including machines bought, repairs, damage and its loan payments. Profit on paper (without buying machines or paying down loans): ${UI.signed(last.profit).replace(/<[^>]+>/g, '')}.` : 'Not open a full month yet.'); })()}
      ${UI.tile('t_rep', '⭐', Math.round(b.rep), 'Reputation', toneRep(b.rep), 'What customers think of you (0-100). Good quality and fair prices raise it.')}
      ${UI.tile('t_q', '🎯', lc.quality != null ? lc.quality : '–', 'Quality', lc.quality == null ? '' : toneRep(lc.quality), `Staff skill ${lc.skill != null ? lc.skill : '?'}, morale ${lc.morale != null ? lc.morale : '?'}, equipment condition.`)}
      ${UI.tile('t_cap', '📊', lc.cap ? Math.round((lc.served || 0) / lc.cap * 100) + '%' : '–', 'Busy', lc.cap ? ((lc.served || 0) / lc.cap > 0.95 ? 'y' : 'g') : '', lc.cap ? `This month with your setup as it is now: about ${Math.round(lc.served || 0).toLocaleString()} of ${Math.round(lc.cap).toLocaleString()} possible (updates as soon as you change something). Customers wanted ${Math.round(lc.demand || 0).toLocaleString()}.` : '')}</div>`;
    if (b.licensePending > 0) o += `<div class="banner">⏳ License: ${b.licensePending} month(s) to go. No sales yet.</div>`;
    const cb = UI.closedBanner(g, b); o += cb;
    if (lc.note && !cb) o += `<div class="ev info">💡 ${esc(lc.note)}</div>`;
    o += UI.todoCard(g, b); // v6: jobs nobody does for you (no manager)
    o += UI.stockCard(g, b);
    if (PR().hasPrice(b)) o += UI.priceCard(g, b);
    { const ss = UI.salesSummary(g, b); if (ss) o += `<div class="card">${ss}</div>`; }
    o += UI.workCard(g, b);
    // how it runs
    o += `<div class="card"><h3>⚙️ How it runs</h3>
      ${UI.irow('pace', '🏃', 'Work pace', null, 'Rush = more output, more wear and accidents. Careful = safer, less output.', ['careful', 'normal', 'rush'].map((p) => UI.btn({ careful: '🐢', normal: '🚶', rush: '🏃' }[p] + ' ' + p, 'bizPace', p, 'xs' + (b.pace === p ? ' pri' : ''))).join(''))}</div>`;
    o += `<div class="btns">${UI.btn('📊 Reports: this month, next month, forecast', 'tab', 'biz:rep', 'sm')}</div>`;
    return o;
  }
  UI.A.bizPace = (p) => { biz().pace = p; UI.refresh(); };
  UI.A.bizSet = (v, el) => { const b = biz(); b[el.dataset.k] = v; UI.toast('Updated.'); UI.refresh(); };

  // "this month" flow + "next month"
  UI.flowCard = (g, b) => {
    const f = b.flow; if (!f || !f.rows || !f.rows.length) return `<div class="card"><h3>📅 This month</h3><div class="mute">Press ▶ Next Month to see what happens.</div></div>`;
    const row = (x, i, pre) => { const key = pre + b.id + i; return `<div class="irow"><span class="dot ${x.c}"></span><span class="ic">${x.i}</span><span class="lb" data-act="tip" data-arg="${key}" data-nosave="1">${esc(x.t)}</span><span class="vl">${UI.fmtN(x.v, x.u)}</span>${x.why ? UI.tipBtn(key) : ''}${UI.tipLine(key, x.why)}</div>`; };
    return `<div class="card"><h3>📅 This month</h3>${f.rows.map((x, i) => row(x, i, 'fr')).join('')}</div>` + (f.next && f.next.length ? `<div class="card"><h3>🔮 Next month</h3>${f.next.map((x, i) => row(x, i, 'fn')).join('')}</div>` : '');
  };

  // price: market price next to yours
  UI.priceCard = (g, b) => {
    const mk = PR().market(g, b); const r = PR().ratio(g, b); const gd = PR().good(b) || {};
    const ask = b.ask != null ? b.ask : null; const dec = mk < 50 ? 2 : 0; const fmt = (v) => '$' + Number(v).toLocaleString(undefined, { minimumFractionDigits: dec, maximumFractionDigits: dec });
    const kind = gd.kind === 'commodity' || b.farm ? 'Buyers can buy elsewhere: above market they buy less from you and unsold goods sit, spoil or rot.' : 'Above market: fewer customers and your reputation drops. Below market: more customers but less profit each.';
    return `<div class="card"><h3>🏷️ Price ${gd.icon || ''} <span class="mute">per ${esc(gd.unit || 'unit')}</span> ${UI.tipBtn('price' + b.id)}</h3>${UI.tipLine('price' + b.id, kind)}
      <div class="pricebox"><span class="mk">📉 Market ${fmt(mk)}</span><span class="mk">🏷️ You ${ask != null ? fmt(ask) : 'follow market'}</span>${UI.pill(PR().label(r) + (ask != null ? ` (${Math.round(r * 100)}%)` : ''), { g: 'good', y: 'warn', r: 'bad' }[PR().tone(r)])}</div>
      <div class="row" style="margin-top:8px"><input type="number" id="askIn" step="${dec ? '0.01' : '1'}" min="0" value="${(ask != null ? ask : mk).toFixed(dec)}">${UI.btn('✅ Set', 'askSet', null, 'sm pri')}${UI.btn('➖10%', 'askStep', '-1', 'sm')}${UI.btn('➕10%', 'askStep', '1', 'sm')}${UI.btn('= Market', 'askMkt', null, 'sm')}</div></div>`;
  };
  UI.A.askSet = () => { const b = biz(); const v = UI.num('askIn', 0); if (!(v > 0)) return UI.toast('Type a price.', true); const r = PR().set(TG.G, b, v); UI.toast(`Price set to ${m(r.price)}.`); UI.refresh(); };
  UI.A.askStep = (s) => { const g = TG.G, b = biz(); const cur = b.ask != null ? b.ask : PR().market(g, b); PR().set(g, b, cur * (1 + 0.1 * Number(s))); UI.refresh(); };
  UI.A.askMkt = () => { biz().ask = null; UI.toast('Following the market price.'); UI.refresh(); };

  // capacity = weakest link
  UI.linksCard = (g, b) => {
    const d = TG.B.def(b); const ctx = TG.B.ctx(g, b); const lc = UI.lc(b); let L = [];
    const cats = TG.CONFIG.equipCats;
    if (d.model === 'service') {
      const k = TG.M.models.service.caps(g, b, ctx);
      L.push({ i: '👥', t: 'Staff', v: k.keyCap, tip: 'What your key workers can handle. Hire, train, or buy tools that speed them up.' });
      for (const l of k.links) { const ed = TG.E.def(b, l.id); const c = (d.equipCatsLabel && d.equipCatsLabel[ed.cat]) || cats[ed.cat] || ['⚙️', ed.label]; L.push({ i: c[0], t: c[1], v: l.cap, tip: `${ed.label}s and anything in the same group. Buy more in Equipment.` }); }
      if (Number.isFinite(k.spaceCap)) L.push({ i: '📐', t: 'Space', v: k.spaceCap, tip: 'The most your building can fit. Needs a bigger property.' });
      if (Number.isFinite(k.supCap)) L.push({ i: '🧹', t: 'Helpers', v: k.supCap, tip: 'Support staff (cleaners, desk...).' });
      if (b.stock) L.push({ i: TG.ST.def(b).icon, t: 'Storage', v: TG.ST.cap(b), tip: 'How much stock fits. Run out and you turn customers away.' });
    } else if (b.farm) {
      const cv = TG.M.models.farm.cover(g, b, ctx); const f = b.farm;
      L.push({ i: '🚜', t: 'Tractors', v: cv.tcov * 100, u: '%', tip: `${cv.tcap.toFixed(1)} of ${cv.tneed.toFixed(1)} tractors' worth working.` });
      L.push({ i: '👩‍🌾', t: 'Farmhands', v: cv.hcov * 100, u: '%', tip: 'Enough hands for the land or herd?' });
      if (f.areas && f.areas.crops.acres > 0) { L.push({ i: '🌱', t: 'Planting', v: cv.pcov * 100, u: '%', tip: 'Tractors + planters.' }); L.push({ i: '🌾', t: 'Harvest', v: cv.hvcov * 100, u: '%', tip: 'Tractors + combines.' }); }
    } else if (b.tech) { L.push({ i: '🖥️', t: 'Servers', v: TG.E.capacity(b, 'server'), tip: 'Users your servers handle. More users than this = outages.' }); }
    else if (b.factory) { L.push({ i: '🏭', t: 'Lines', v: TG.E.capacity(b, 'line'), tip: 'Units per month your lines can make.' }); if (b.stock) L.push({ i: '🪨', t: 'Raw storage', v: TG.ST.cap(b), tip: 'Raw materials you can hold.' }); }
    if (!L.length) return '';
    const isPct = L[0].u === '%';
    const caps = L.map((x) => x.v); const mn = Math.min(...caps); const mx = Math.max(...caps.filter(Number.isFinite), 1);
    const dem = lc.demand;
    return `<div class="card"><h3>⛓️ What limits you ${UI.tipBtn('links' + b.id)}</h3>${UI.tipLine('links' + b.id, 'You can only serve as many as your weakest link. Fix the red one first: hire, buy equipment, add storage or move.')}
      ${L.map((x, i) => `<div class="link ${x.v === mn && (isPct ? x.v < 100 : true) ? 'weak' : ''}" data-act="tip" data-arg="ln${b.id}${i}" data-nosave="1"><span class="ico">${x.i}</span><span class="grow">${esc(x.t)}${UI.bar(x.v, isPct ? 100 : mx)}</span><b>${UI.fmtN(x.v, x.u)}</b></div>${UI.tipLine('ln' + b.id + i, x.tip)}`).join('')}
      ${dem != null && !isPct && d.model === 'service' ? `<div class="link"><span class="ico">🧲</span><span class="grow">Customers wanted</span><b>${Math.round(dem).toLocaleString()}</b></div>` : ''}</div>`;
  };
  // ---------- staff ----------
  const traitTxt = (e) => {
    const t = [];
    t.push(e.revealed && e.revealed.reliability ? `reliability ${e.reliability}` : 'reliability ?');
    t.push(e.revealed && e.revealed.honesty ? `honesty ${e.honesty}` : 'honesty ?');
    t.push(e.revealed && e.revealed.temper ? `temper ${e.temper}` : 'temper ?');
    if (e.trait) t.push(`style: ${e.trait === 'dishonest' && !(e.revealed && e.revealed.honesty) ? '?' : e.trait}`);
    return t.join(' · ');
  };
  // ---------- staff: work needed vs what the team can do, spare people, unfinished work ----------
  const spareTone = (sp) => (sp < 0.05 ? 'bad' : sp < 0.15 ? 'warn' : 'good');
  UI.staffWorkCard = (g, b) => {
    const C = TG.CONFIG, d = TG.B.def(b); const bl = TG.B.backlogMult(b); const unf = b.unf || 0;
    const W = UI.wk(b).filter((w) => w.kind === 'staff' && w.role);
    const risk = (C.unfinishedRisk && C.unfinishedRisk[b.type]) || 'accidents, unhappy customers and failed inspections';
    let o = `<div class="card"><h3>🧯 Work vs your team ${UI.tipBtn('uw' + b.id)}</h3>${UI.tipLine('uw' + b.id, `Every month some people call out sick or slack off (about ${U.pct(C.staff.calloutBase)} each; more if unreliable or unhappy). Spare people cover for them. With no spare, work is left undone and the odds of ${risk} go up until it is caught up.`)}
      <div class="tiles">${UI.tile('uwu' + b.id, '🧺', b.hist.length ? U.pct(unf) : '–', 'Left undone', unf > 0.05 ? 'r' : unf > 0 ? 'y' : 'g', 'Share of last month\'s work nobody got to.')}
      ${UI.tile('uwb' + b.id, '⚠️', 'x' + bl.toFixed(2), 'Disaster odds', bl > 1.3 ? 'r' : bl > 1.01 ? 'y' : 'g', `Undone work raises the odds of ${risk}. It fades when the team catches up (no undone work for a month or two).`)}</div>`;
    if (!W.length) o += `<div class="mute">Press ▶ Next Month to see how much work there is.</div>`;
    for (const w of W) {
      const rd = TG.S.roleDef(b, w.role) || {}; const n = b.staff.filter((e) => e.role === w.role).length;
      const sp = w.load > 0 ? w.cap / w.load - 1 : 1; const k = 'sw' + b.id + w.role; const per = n ? w.cap / n : 0;
      const need15 = per > 0 && w.load > 0 ? Math.max(0, Math.ceil((w.load * 1.15 - w.cap) / per)) : 0;
      o += `<div class="link" data-act="tip" data-arg="${k}" data-nosave="1"><span class="ico">${w.i}</span><span class="grow"><b>${esc(rd.label || w.t)}</b> <span class="mute">x${n}</span>
        <div class="bar ${sp < 0 ? 'bad' : sp < 0.15 ? 'warn' : ''}"><i style="width:${Math.round(U.clamp(w.load / Math.max(1, w.cap), 0, 1) * 100)}%"></i></div>
        <small>needs ${N(w.load)} · can do ${N(w.cap)} ${esc(w.u)}${w.out ? ` · ${w.out} called out` : ''}${w.unf > 0 ? ` · <span class="bad">${U.pct(w.unf)} undone</span>` : ''}</small></span>${UI.pill(sp >= 0 ? U.pct(sp) + ' spare' : U.pct(-sp) + ' short', spareTone(sp))}</div>
        ${UI.tipLine(k, `${n} ${esc((rd.label || '').toLowerCase())}(s) can do ${N(w.cap)} ${w.u} a month; the work needs ${N(w.load)}. ${sp >= 0.15 ? 'Enough spare to cover a sick day or two.' : sp >= 0 ? `Thin: one person out means undone work. ${need15 ? `${need15} more would give 15% spare.` : ''}` : `Short: ${U.pct(-sp)} of the work can't get done even with everyone in. ${need15 ? `Hire ${need15} more for 15% spare.` : ''}`}`)}
        <div class="btns" style="margin:0 0 8px 48px">${UI.btn('➕ Hire ' + esc((rd.label || 'worker').toLowerCase()), 'hireRole', w.role, 'xs' + (sp < 0.05 ? ' pri' : ''))}</div>`;
    }
    return o + `<div class="mute">Payroll: ${m(TG.S.payroll(b))}/mo. Set how many to keep, and spare staff, in the 🧑‍💼 Manager tab.</div></div>`;
  };
  function staff(g, b) {
    const d = TG.B.def(b); const C = TG.CONFIG;
    if (!b.target) TG.D.syncTargets(b);
    const roles = Object.keys(d.roles);
    let o = UI.staffWorkCard(g, b);

    const hr = UI.S.hireRole && (d.roles[UI.S.hireRole] || C.specialists[UI.S.hireRole]) ? UI.S.hireRole : roles[0];
    const pool = TG.S.poolFor(g, b, hr);

      <div class="mute">${esc((C.specialists[hr] || d.roles[hr] || {}).desc || '')}</div>
      ${UI.hrHiring(g, b, hr)}
      <div class="mute">${pool.length} applicant(s) this month. Skill shown is an interview estimate; a background check (${m(C.staff.backgroundCheck)}) reveals the truth.</div>`;
    for (const c of pool) o += `<div class="ev"><div class="row sp"><b>${esc(c.name)}</b><span>${m(c.wage)}/mo</span></div><div class="small">Skill ~${c.skillSeen}${c.revealed.honesty ? ` (true ${c.skill})` : ''} · ${c.years} yrs exp · attitude ${c.attitude}</div><div class="mute">${traitTxt(c)}</div>${candInfo(g, b, c)}${UI.hrCand(c)}
      <div class="btns">${UI.btn('Hire', 'hire', c.id, 'sm pri')}${c.revealed.honesty ? '' : UI.btn(`Check ${m(C.staff.backgroundCheck)}`, 'bgCheck', c.id, 'sm')}</div></div>`;
    if (!pool.length) o += `<div class="ev warn">Nobody applied this month. Small labor pools make hiring slow; try next month or move to a bigger town.</div>`;
    o += `</div>`;

    if (specs.length) o += `<div class="card"><h3 style="margin-top:0">Managers & specialists</h3>${specs.map(([r, e]) => empRow(b, e, TG.S.roleDef(b, r).label)).join('')}</div>`;

        o += UI.irow('eq' + ed.id, ed.icon || cd[0], ed.label, `${n}${mx < 999 ? '/' + mx : ''}`, `${effectTxt(g, b, ed)}. Costs ${m(pr)}${lease ? ' (or ' + m(pr * C.equipment.leaseMonthlyPct) + '/mo leased)' : ''}. Wears out with use.`, UI.btn(lease ? `📄 ${m(pr * C.equipment.leaseMonthlyPct)}/mo` : `🛒 ${m(pr)}`, 'eqBuy', ed.id, 'xs goodb', n >= mx), sub);
      }
      const mine = b.equip.filter((it) => { const ed = E.def(b, it.type); return ed && (ed.cat || 'other') === c; });
      if (mine.length) o += `<details><summary>🔧 Yours (${mine.length})${mine.some((x) => x.broken) ? ' <span class="pill bad">broken!</span>' : ''}</summary>${mine.map((it) => itemRow(g, b, it)).join('')}</details>`;
      o += '</div>';
    }
    return o;
  }
  function itemRow(g, b, it) {
    const C = TG.CONFIG, E = TG.E; const bc = it.broken ? null : E.breakChance(g, b, it); const w = E.effWear(it);
    const st = it.broken === 'destroyed' ? UI.pill('gone', 'bad') : it.broken ? UI.pill('broken', 'bad') : UI.risk(bc.p);
    const wearShown = it.hidden > 0 && !it.inspected ? `${Math.round(it.wear)}%+?` : `${Math.round(w)}%`;
    const k = 'it' + it.id;
    return `<div class="ev ${it.broken ? 'bad' : w > 70 ? 'warn' : 'good'}"><div class="row sp"><b data-act="tip" data-arg="${k}" data-nosave="1">${esc(it.label)} #${E.num(b, it)}</b>${st}</div>
      <div class="row"><span class="small">⏳ ${(it.age / 12).toFixed(1)} yrs · 🔩 wear ${wearShown}${it.leased ? ' · 📄 leased' : ''}${it.maint ? ' · 🛡️ plan' : ''}</span>${UI.tipBtn(k)}</div>${UI.bar(w, 100, true)}
      ${UI.tipLine(k, `${C.equipTiers[it.tier].label}. Worth ${m(E.resale(g, b, it))}.${it.leased ? ' Lease ' + m(it.leasePay) + '/mo.' : ''}${it.warranty > 0 ? ' Warranty ' + it.warranty + ' mo.' : ''}${bc ? ' Break risk: ' + bc.factors.join(', ') + '.' : ''}`)}
      <div class="btns">${it.broken && it.broken !== 'destroyed' ? UI.btn(`🔧 Fix ${it.warranty > 0 || it.leased ? '(free)' : m(E.repairCost(g, b, it))}`, 'eqDo', `${it.id}|repair`, 'xs goodb') : ''}
      ${!it.broken ? UI.btn(`🧰 Service ${m(E.def(b, it.type).price * C.equipment.serviceCostPct * g.world.priceIdx)}${TG.USES.used(it, 'service', g.month) ? ' ✓' : ''}`, 'eqDo', `${it.id}|service`, 'xs') : ''}
      ${!it.leased ? UI.btn(it.maint ? '🛡️ Stop plan' : `🛡️ Plan ${m(E.def(b, it.type).price * C.equipment.maintPlanCostPct * g.world.priceIdx)}/mo`, 'eqDo', `${it.id}|maint`, 'xs') : ''}
      ${it.hidden > 0 && !it.inspected ? UI.btn(`🔍 ${m(E.def(b, it.type).price * C.equipment.inspectCost * g.world.priceIdx)}`, 'eqDo', `${it.id}|inspect`, 'xs') : ''}
      ${UI.btn(it.leased ? '↩️ Return' : '💵 Sell', 'eqDo', `${it.id}|sell`, 'xs badb')}</div></div>`;
  }
  UI.A.eqTierSet = (k) => { UI.S.eqTier = k; if (k === 'used') UI.S.eqLease = false; UI.refresh(); };
  UI.A.eqLeaseSet = () => { if ((UI.S.eqTier || 'standard') === 'used') return UI.toast('Used gear cannot be leased.', true); UI.S.eqLease = !UI.S.eqLease; UI.refresh(); };
  UI.A.eqBuy = (type) => {
    const g = TG.G, b = biz(); const tier = UI.S.eqTier || 'standard'; const lease = !!UI.S.eqLease && tier !== 'used';
    if (TG.E.count(b, type) >= TG.E.maxCount(b, type)) return UI.toast('No room for more of these.', true);
    const it = TG.E.buy(g, b, type, tier, lease ? { leased: true } : null);
    if (!it) return UI.toast(`Not enough cash (${m(TG.E.price(g, b, type, tier))}).`, true);
    UI.toast(`${lease ? 'Leased' : 'Bought'} ${it.label}.`); UI.refresh();
  };
  UI.A.eqDo = (arg) => {
    const g = TG.G, b = biz(); const [id, act] = arg.split('|'); const it = b.equip.find((x) => x.id === id); if (!it) return;
    if (act === 'repair') TG.E.repair(g, b, id, 'You');
    if (act === 'service') { const r = TG.E.service(g, b, id); if (r === 'again') UI.toast('Already serviced this month: that visit did nothing (one service a month).', true); }
    if (act === 'maint') it.maint = !it.maint;
    if (act === 'inspect') { TG.E.inspect(g, b, id); UI.toast(`True wear: ${Math.round(it.wear)}%`); }
    if (act === 'sell') { const v = TG.E.sell(g, b, id); UI.toast(v ? `Sold for ${m(v)}.` : 'Returned.'); }
    TG.D.removeFor(g, (dd) => dd.itemId === id && !b.equip.some((x) => x.id === id && x.broken));
    UI.refresh();
  };

  // ---------- upgrades & insurance ----------
  // Every upgrade says exactly what it does, in numbers, built from the same values the game uses.
  UI.fixDesc = (g, b, f) => {
    const d = TG.B.def(b), out = [], P = (x, dg) => U.pct(x, dg || 0); const eqL = (id) => { const e = d.equip.find((x) => x.id === id); return e ? e.label.toLowerCase() : id; };
    const risk = (k) => { const r = d.risks.find((x) => x.id === k); return r ? r.label.toLowerCase() : k; };
    for (const [k, v] of Object.entries(f.reduces || {})) out.push(`${risk(k)} odds ${v === 0 ? 'gone' : '−' + P(1 - v)}`);
    if (f.equipBreak) for (const [k, v] of Object.entries(f.equipBreak)) out.push(`${eqL(k)} breakdown odds −${P(1 - v)}`);
    if (f.skillGrowth) out.push(`staff learn ${P(f.skillGrowth - 1)} faster`);
    if (f.cogsAdd) out.push(f.cogsAdd > 0 ? `supplies cost +${P(f.cogsAdd)} of sales` : `supplies cost ${P(-f.cogsAdd)} of sales less`);
    if (f.demand) out.push(f.demand > 0 ? `+${P(f.demand)} customers` : `${P(-f.demand)} fewer customers`);
    if (f.hitSoften) out.push(`bad-news sales drops ${P(f.hitSoften)} smaller`);
    if (f.qualityShield) out.push('quality does not drop when people quit');
    if (f.revCostPct) out.push(`costs ${P(f.revCostPct)} of sales each month`);
    if (f.morale) out.push(`staff morale +${f.morale}`);
    if (f.seasonFloor) out.push(`slow season never below ${P(f.seasonFloor)} of normal sales`);
    if (f.repTarget) out.push(`reputation settles ${f.repTarget} points higher`);
    if (f.seasonDamp) out.push(`seasonal ups and downs ${P(f.seasonDamp)} smaller`);
    if (f.wearMult) out.push(`machines wear ${P(1 - f.wearMult)} slower`);
    if (f.payrollAdd) out.push(`wages +${P(f.payrollAdd)}`);
    if (f.materialAdd) out.push(`materials +${P(f.materialAdd)}`);
    if (f.otaCut) out.push(`booking-site fees −${P(f.otaCut)}`);
    if (f.ticketMult) out.push(`+${P(f.ticketMult - 1)} per client`);
    if (f.badDebtMult) out.push(`unpaid bills −${P(1 - f.badDebtMult)}`);
    if (f.loadMult) out.push(`each truck hauls +${P(f.loadMult - 1)} loads`);
    if (f.fuelCut) out.push(`fuel −${P(f.fuelCut)}`);
    if (f.unitCostCut) out.push(`each item costs ${P(f.unitCostCut)} less to make`);
    if (f.packerMult) out.push(`packers ship ${f.packerMult}x as much`);
    if (f.workerCut) out.push(`needs ${P(f.workerCut)} fewer line workers`);
    if (f.lineFailMult) out.push(`line breakdowns +${P(f.lineFailMult - 1)} (more complex)`);
    if (f.rnd) out.push(`${P(f.rnd)} chance a month of a new product: +4% price (max +30%)`);
    if (f.materialCut) out.push(`materials −${P(f.materialCut)} for ${f.lockMonths} months (price locked, even if the market drops)`);
    if (f.driftCut) out.push(`shops slipping in quality −${P(f.driftCut)}`);
    if (f.scandalCut) out.push(`franchisee scandal odds −${P(1 - f.scandalCut)}`);
    if (f.appMult) out.push(`${P(1 - f.appMult)} fewer join requests`);
    if (f.cannibalCut) out.push(`shops steal ${P(f.cannibalCut)} fewer of each other's customers`);
    if (f.perUnitMonthly) out.push(`${m(f.perUnitMonthly * g.world.priceIdx)}/mo for each ${b.type === 'tech' ? 'server' : 'truck'}`);
    const S = {
      plant: () => { const v = TG.M.plantVolume ? TG.M.plantVolume(b) : 0; return [`sells grain & fruit for +${P(f.valueMult - 1)} and milk & beef for +20% (you sell flour, juice, cheese and packed meat instead of raw goods)`, `only runs with ${N(f.minVolume)} t a year through it (you had ${N(v)} t in the last 12 months); below that it sits idle`, `${P(0.012, 1)} chance a month it breaks (repair ${m(9000000 * 0.02 * g.world.priceIdx)}, idle that month)`]; },
      integrate: () => ['seed, feed, spray and new orchard trees cost 20% less', 'you own your supplier, so seed and feed prices are yours to set'],
      rotation: () => [`crop-area pest & disease odds −${U.pct(1 - TG.CONFIG.businesses.farm.farm.water.rotationCut)}`],
      safetytrain: () => ['truck crash odds −40%'],
      gps: () => ['stolen or vandalized truck odds −70%'],
      inspect: () => (b.type === 'brand' ? ['factory quality-issue odds −70%', 'each batch costs 2% more'] : []),
      pm: () => ['budget-overrun odds −50%', 'failed-inspection odds −40%'],
      backup: () => (b.type === 'tech' ? ['server outage odds −70%'] : []),
      certified: () => ['every trainer you hire has skill 45 or more'],
      contingency: () => ['bids 6% higher: overruns cost you half as much', 'you win 15% fewer bids'],
      bonds: () => ['lets you bid on large projects', 'bond costs 1.5% of each project'],
      test: () => ['lets you order 150-unit test batches', 'test items cost 30% more each'],
      research: () => ['product fit +30% of the gap to perfect', 'shows a rough fit estimate before launch'],
      bulk: () => [],
    };
    if (S[f.id]) out.push(...S[f.id]());
    if (f.note && !out.length) out.push(f.note);
    return out;
  };
  const N = (x) => Math.round(x || 0).toLocaleString();
  function upg(g, b) {
    const d = TG.B.def(b), C = TG.CONFIG;
    let o = `<div class="card"><h3 style="margin-top:0">⬆️ Upgrades</h3><div class="mute">Each one says exactly what it changes, in numbers.</div>`;
    for (const f of d.fixes) {
      const on = !!b.fixes[f.id]; const what = UI.fixDesc(g, b, f);
      o += `<div class="ev ${on ? 'good' : ''}"><div class="row sp"><b>${esc(f.label)}</b>${on ? UI.pill('active', 'good') : ''}</div><div class="small">💵 ${f.cost ? `${m(f.cost * g.world.priceIdx)} once` : 'No upfront cost'}${f.monthly ? ` + ${m(f.monthly * g.world.priceIdx)}/mo` : ''}</div>
        <ul class="fx">${what.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>
        <div class="btns">${on ? (b.fixes[f.id].until > g.month ? `<span class="mute">Locked in until ${U.dateStr(b.fixes[f.id].until)}</span>` : UI.btn('Drop', 'fix', `${f.id}|0`, 'sm')) : UI.btn('Add', 'fix', `${f.id}|1`, 'sm pri')}</div></div>`;
    }
    o += `</div><div class="card"><h3 style="margin-top:0">Insurance</h3><div class="mute">Insurance pays most of a covered loss. Premiums rise after claims.</div><table>`;
    for (const t of d.insurance) {
      const I = C.finance.insurance[t]; if (!I) continue;
      o += `<tr><td>${esc(I.label)}</td><td class="n">${m(TG.F.premium(g, b, t))}/mo</td><td class="n">${b.ins[t] ? UI.btn('Covered ✓ (cancel)', 'ins', t, 'sm goodb') : UI.btn('Buy', 'ins', t, 'sm')}</td></tr>`;
    }
    return o + `</table></div>`;
  }
  UI.A.fix = (arg) => { const g = TG.G, b = biz(); const [id, on] = arg.split('|'); if (on === '1') UI.res(TG.B.buyFix(g, b, id), 'Added.'); else { TG.B.dropFix(g, b, id); UI.toast('Dropped.'); } UI.refresh(); };
  UI.A.ins = (t) => { const b = biz(); b.ins[t] = !b.ins[t]; UI.refresh(); };

  // ---------- marketing ----------
  function mkt(g, b) {
    const C = TG.CONFIG.reputation; const ab = TG.B.adBoost(g, b);
    let o = `<div class="card"><h3 style="margin-top:0">Advertising</h3><div class="kv"><span>Monthly budget</span><span><input type="number" id="adBudget" value="${b.ads.budget || 0}" min="0" step="100"></span>
      <span>Channel</span><span><select id="adCh">${Object.entries(C.adChannels).map(([k, c]) => `<option value="${k}"${b.ads.channel === k ? ' selected' : ''}>${c.label} (flop risk ${U.pct(c.flop)})</option>`).join('')}</select></span></div>
      <div class="btns">${UI.btn('Save ad plan', 'adSave', null, 'pri')}</div>
      <div class="mute">Current effect: about +${U.pct(ab.boost || 0)} demand. Ads have diminishing returns and work worse with a poor reputation${b.spec.ads ? '; your ads manager makes spend go further' : ''}.</div></div>`;
    o += `<div class="card"><h3 style="margin-top:0">Reputation & PR</h3><div>Reputation ${Math.round(b.rep)}/100 ${UI.bar(b.rep, 100)}</div><div class="mute">PR can speed up recovery after a hit, but can flop.</div>${UI.irow('prUse' + b.id, '📣', 'PR left this month', `${TG.USES.left(b, 'pr', g.month, TG.CONFIG.reputation.prPerMonth)}/${TG.CONFIG.reputation.prPerMonth}`, 'You get 2 PR moves a month. The 2nd does half as much. Any more looks spammy or desperate and LOSES reputation.')}<div class="btns">${Object.entries(C.pr).map(([k, p]) => UI.btn(`${p.label} (${p.cost != null ? m(p.cost * g.world.priceIdx) : m(b.revAvg * p.costRev)}, ${U.pct(p.fail)} flop)`, 'pr', k, 'sm')).join('')}</div></div>`;
    return o;
  }
  UI.A.adSave = () => { const b = biz(); b.ads.budget = Math.max(0, Math.round(UI.num('adBudget', 0))); b.ads.channel = UI.val('adCh') || 'social'; UI.toast('Ad plan saved.'); UI.refresh(); };
  UI.A.pr = (k) => { TG.B.doPR(TG.G, biz(), k, 'You'); const d = TG.G.cur.decisions[TG.G.cur.decisions.length - 1]; UI.toast(d ? d.text : 'Done.', d && d.outcome === 'bad'); UI.refresh(); };

  // ---------- ownership ----------
  function own(g, b) {
    const F = TG.F, C = TG.CONFIG.finance; const v = F.bizValue(g, b);
    const prop = g.properties.find((p) => p.id === b.propId);
    let o = `<div class="card"><div class="kv"><span>Estimated business value</span><span>${m(v)}</span><span>Outside owners</span><span>${U.pct(b.outside || 0)}${b.public ? ' (public)' : ''}</span><span>Sale price (incl. owned property)</span><span>${m(TG.B.saleValue(g, b))}</span></div><div class="mute">Value is based on recent profit, assets and reputation.</div></div>`;
    o += `<div class="card"><h3 style="margin-top:0">Raise money</h3><div class="mute">Investors pay cash now and take that share of profits forever (until you buy them back at a premium).</div><div class="btns">${[0.1, 0.2, 0.3].map((p) => { const off = F.investorOffer(g, b, p); return UI.btn(`Sell ${U.pct(p)} for ${m(off.cash)}`, 'invTake', p, 'sm', off.cash < 10000 || (b.outside || 0) + p > 0.9); }).join('')}
      ${UI.btn(`IPO (needs ${m(C.ipoMinValue)} value)`, 'ipo', null, 'sm', b.public || v < C.ipoMinValue)}${UI.btn(`Buy back (${m(v * (b.outside || 0) * 1.2)})`, 'buyBack', null, 'sm', !b.outside)}</div></div>`;
    o += `<div class="card"><h3 style="margin-top:0">Exit</h3><div class="btns">${UI.btn(`Sell business ${m(TG.B.saleValue(g, b))}`, 'bizSell', null, 'sm')}${UI.btn('Close (sell equipment, keep property)', 'bizClose', null, 'sm')}${UI.btn('Business bankruptcy', 'bizBk', null, 'sm badb')}</div>
      <div class="mute">Business bankruptcy is only allowed when this business's debts exceed its assets: it wipes linked loans but hurts your credit${prop ? '' : ''}.</div>
      <div class="row" style="margin-top:6px"><span class="small">Rename</span><input type="text" id="bizName" value="${esc(b.name)}" maxlength="30">${UI.btn('Save', 'bizRename', null, 'sm')}</div></div>`;
    return o;
  }
  UI.A.invTake = (p) => { UI.res(TG.F.takeInvestor(TG.G, biz(), Number(p)), 'Investors are in.'); UI.refresh(); };
  UI.A.ipo = () => { UI.res(TG.F.ipo(TG.G, biz()), 'IPO complete!'); UI.refresh(); };
  UI.A.buyBack = () => { UI.res(TG.F.buyBack(TG.G, biz()), 'Bought back all shares.'); UI.refresh(); };
  UI.A.bizSell = () => UI.confirm('Sell this business (and its owned property)?', 'bizSellGo');
  UI.A.bizSellGo = () => { const v = TG.B.sell(TG.G, UI.bizId); UI.closeModal(); UI.toast(`Sold for ${m(v)}.`); UI.go('biz'); };
  UI.A.bizClose = () => UI.confirm('Close this business? Equipment is sold, staff let go, property kept.', 'bizCloseGo');
  UI.A.bizCloseGo = () => { const g = TG.G, b = biz(); for (const e of TG.S.allStaff(b).slice()) TG.S.fire(g, b, e.id, 'business closed'); TG.B.close(g, b, 'closed by owner', false); UI.closeModal(); UI.toast('Closed.'); UI.go('biz'); };
  UI.A.bizBk = () => UI.confirm('File business bankruptcy? Only allowed if this business owes more than it owns.', 'bizBkGo');
  UI.A.bizBkGo = () => { const r = TG.F.businessBankruptcy(TG.G, UI.bizId); UI.closeModal(); if (UI.res(r, 'Filed.')) UI.go('biz'); };
  UI.A.bizRename = () => { const b = biz(); const n = UI.val('bizName').trim(); if (n) b.name = n.slice(0, 30); UI.refresh(); };

  UI.confirm = (text, act, arg) => UI.modal('Are you sure?', `<div class="card"><p>${esc(text)}</p><div class="btns">${UI.btn('Yes', act, arg, 'badb')}${UI.btn('Cancel', 'closeModal')}</div></div>`);
})();

</script>
<script>/* js/ui/ui-models.js */
/* ui-models.js - icon-first stock rows ("cow rows") for every business + each model's extra panel. */
(function () {
  const TG = globalThis.TG; const U = TG.U; const UI = TG.UI; const esc = UI.esc, m = UI.m;
  const biz = () => TG.B.get(TG.G, UI.bizId);
  const P = (UI.modelPanel = {});
  const after = (r, msg) => { UI.res(r, msg); UI.refresh(); };
  const N = (x) => Math.round(x || 0).toLocaleString();
  const qty = (id, def) => `<input type="number" id="${id}" min="1" value="${Math.max(1, Math.round(def || 1))}" aria-label="how many">`;
  const FD = () => TG.CONFIG.businesses.farm.farm;

  // ================= STOCK CARD (every business) =================
  UI.stockCard = (g, b) => {
    const d = TG.B.def(b); let rows = ''; let title = '📦 What you have';
    if (b.farm) { const r = farmRows(g, b); rows = r.rows; title = r.title; }
    else if (d.model === 'service') rows = serviceRows(g, b);
    else if (b.brand) rows = brandRows(g, b);
    else if (b.factory) rows = factoryRows(g, b);
    else if (b.tech) rows = techRows(g, b);
    else if (b.proj) rows = projRows(g, b);
    else if (b.fr) rows = frRows(g, b);
    else if (d.model === 'freight') rows = freightRows(g, b);
    return rows ? `<div class="card"><h3>${title}</h3>${rows}<div class="btns">${UI.btn(b.farm && TG.M.isLivestock(b.farm) ? '🐄 See all cows' : '🔍 See all', 'detail', 'stock', 'sm')}</div></div>` : '';
  };

  // ---- services: supplies + what you sell + who you serve ----
  function serviceRows(g, b) {
    const d = TG.B.def(b), gd = TG.PR.good(b) || {}, lc = UI.lc(b); let o = '';
    const s = TG.ST.def(b);
    if (s) {
      const st = TG.ST.ensure(b); const cap = TG.ST.cap(b); const uc = TG.ST.unitCost(g, b);
      const per = Math.max(1, Math.round(lc.served || cap / 3));
      o += UI.irow('sup' + b.id, s.icon, s.label, `${N(st.qty)}/${N(cap)}`, `${s.desc || 'Used up by every sale.'} ${m(uc)} each. ${U.pct(s.spoil, 0)} of leftovers spoil each month. Run out = customers turned away.`,
        qty('qSup', per) + UI.btn('🛒 Buy', 'stBuy', null, 'xs goodb') + UI.btn('Sell', 'stSell', null, 'xs') + UI.btn(st.auto ? '🤖 Auto ✓' : '🤖 Auto ✗', 'stAuto', null, 'xs' + (st.auto ? ' pri' : '')),
        `last month: +${N(st.inM)} in · −${N(st.usedM)} used${st.spoilM ? ' · −' + N(st.spoilM) + ' spoiled' : ''}${st.lastBy ? ' · ordered by ' + esc(st.lastBy) : ''}`);
      o += `<div style="margin:0 0 6px 48px">${UI.bar(st.qty, Math.max(cap, 1))}</div>`;
    }
    const gIcon = gd.icon || d.icon;
    if (b.type === 'gym') o += UI.irow('mem' + b.id, '🏋️', 'Members', `${N(b.members || lc.served)}/${N(lc.cap)}`, `Members pay monthly. About ${U.pct((d.svc || {}).churn || 0.045)} leave each month; new ones join if you have room and a good reputation.`);
    else if (b.type === 'hotel') { const rooms = Math.max(1, Math.round((lc.cap || 0) / 30)); o += UI.irow('rm' + b.id, '🛏️', 'Rooms filled', `${N((lc.served || 0) / 30)}/${N(rooms)}`, 'Average rooms sold per night last month. Empty rooms earn nothing.'); }
    else o += UI.irow('sv' + b.id, gIcon, gd.label ? gd.label + ' sold' : 'Sold', `${N(lc.served)}/${N(lc.cap)}`, `Last month you sold ${N(lc.served)}. You could do ${N(lc.cap)}. Customers wanted ${N(lc.demand)}.`);
