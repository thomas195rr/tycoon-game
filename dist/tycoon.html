<style>
/* Tycoon - kid-friendly, mobile-first. Light background, big rounded cards & buttons, a few bright colors, no animations. */
:root { --bg:#eef6ff; --card:#fff; --ink:#1e293b; --mute:#64748b; --line:#dbe4f0; --good:#16a34a; --goodbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --warn:#b45309; --warnbg:#fef3c7; --info:#2563eb; --infobg:#dbeafe; --accent:#2563eb; --accent2:#7c3aed; --sun:#f59e0b; }
* { box-sizing: border-box; transition: none !important; animation: none !important; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); font: 17px/1.45 "Nunito", "Segoe UI", -apple-system, Roboto, Helvetica, Arial, sans-serif; }
button, input, select { font: inherit; }
#app { max-width: 820px; margin: 0 auto; min-height: 100vh; padding-bottom: 170px; }
header.top { position: sticky; top: 0; z-index: 5; background: #fff; border-bottom: 3px solid var(--line); padding: 8px 10px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
header.top .chip { display: inline-flex; align-items: center; gap: 4px; background: var(--bg); border-radius: 99px; padding: 4px 11px; font-size: 15px; font-weight: 700; white-space: nowrap; }
header.top .chip.cash { background: var(--goodbg); color: var(--good); } header.top .chip.cash.neg { background: var(--badbg); color: var(--bad); }
header.top .chip.dec { background: var(--warnbg); color: var(--warn); cursor: pointer; }
header.top .chip.save { margin-left: auto; font-size: 13px; cursor: pointer; } header.top .chip.save.ok { background: var(--goodbg); color: var(--good); } header.top .chip.save.no { background: var(--badbg); color: var(--bad); }
main { padding: 10px; }
h2 { font-size: 23px; margin: 6px 0 12px; }
h3 { font-size: 19px; margin: 4px 0 8px; }
.card { background: var(--card); border: 2px solid var(--line); border-radius: 20px; padding: 12px 14px; margin: 0 0 12px; }
.card.tap { cursor: pointer; }
.card.hi { border-color: var(--accent); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row.sp { justify-content: space-between; }
.grow { flex: 1 1 auto; min-width: 0; }
.mute { color: var(--mute); font-size: 14.5px; }
.small { font-size: 15px; }
.big { font-size: 24px; font-weight: 800; }
.good { color: var(--good); } .bad { color: var(--bad); } .warn { color: var(--warn); }
.pill { display: inline-block; padding: 2px 10px; border-radius: 99px; font-size: 13.5px; font-weight: 700; background: var(--line); color: var(--ink); white-space: nowrap; }
.pill.good { background: var(--goodbg); color: var(--good); } .pill.bad { background: var(--badbg); color: var(--bad); } .pill.warn { background: var(--warnbg); color: var(--warn); } .pill.info { background: var(--infobg); color: var(--info); }
.btn { border: 2px solid var(--line); background: #fff; color: var(--ink); border-radius: 16px; padding: 9px 15px; cursor: pointer; min-height: 46px; font-weight: 700; }
.btn:active { background: var(--bg); }
.btn.pri { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn.goodb { background: var(--good); color: #fff; border-color: var(--good); }
.btn.badb { background: var(--bad); color: #fff; border-color: var(--bad); }
.btn.sm { padding: 6px 12px; min-height: 40px; font-size: 15px; border-radius: 14px; }
.btn.xs { padding: 3px 9px; min-height: 34px; font-size: 14px; border-radius: 12px; }
.btn[disabled] { opacity: .4; cursor: not-allowed; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.tabs { display: flex; gap: 6px; overflow-x: auto; margin: 0 0 12px; padding-bottom: 4px; }
.tabs .btn { white-space: nowrap; }
.tabs .btn.on { background: var(--accent); color: #fff; border-color: var(--accent); }
table { width: 100%; border-collapse: collapse; font-size: 15.5px; }
td, th { padding: 6px 4px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
td.n, th.n { text-align: right; white-space: nowrap; }
.kv { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, auto); gap: 4px 10px; font-size: 16px; }
.kv > :nth-child(2n) { text-align: right; font-weight: 700; }
.bar { height: 12px; background: var(--line); border-radius: 6px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--good); }
.bar.warn > i { background: var(--sun); } .bar.bad > i { background: var(--bad); }
ul.plain { margin: 4px 0; padding-left: 18px; }
input[type=number], input[type=text], select, textarea { border: 2px solid #c7d4e6; border-radius: 14px; padding: 8px 10px; background: #fff; max-width: 100%; min-height: 44px; }
input[type=number] { width: 120px; }
.ev { border-left: 6px solid var(--line); padding: 6px 10px; margin: 6px 0; background: #f8fbff; border-radius: 12px; }
.ev.good { border-color: var(--good); } .ev.bad, .ev.major { border-color: var(--bad); } .ev.warn { border-color: var(--sun); } .ev.info { border-color: var(--info); }
.ev .why { color: var(--mute); font-size: 14px; }
footer.turn { position: fixed; left: 0; right: 0; bottom: 64px; z-index: 6; background: #fff; border-top: 3px solid var(--line); }
footer.turn .in { max-width: 820px; margin: 0 auto; padding: 6px 8px; display: flex; gap: 6px; align-items: center; flex-wrap: nowrap; }
footer.turn .btn { padding: 8px 10px; white-space: nowrap; }
footer.turn .next { flex: 1 1 100px; background: var(--good); border-color: var(--good); color: #fff; font-weight: 800; min-height: 50px; font-size: 18px; }
footer.turn input { width: 66px; flex: 0 0 66px; }
footer.turn .yrs { font-size: 12px; line-height: 1.1; color: var(--mute); width: 50px; flex: 0 0 50px; }
nav.bottom { position: fixed; left: 0; right: 0; bottom: 0; z-index: 7; background: #fff; border-top: 3px solid var(--line); }
nav.bottom .in { max-width: 820px; margin: 0 auto; display: flex; }
nav.bottom button { flex: 1; background: none; border: 0; color: var(--mute); padding: 4px 2px; font-size: 12.5px; font-weight: 700; cursor: pointer; min-height: 64px; }
nav.bottom button .ic { display: block; font-size: 27px; line-height: 1.2; }
nav.bottom button.on { color: var(--accent); background: var(--infobg); border-radius: 16px; }
.modal { position: fixed; inset: 0; z-index: 20; background: rgba(15,23,42,.45); display: flex; align-items: flex-start; justify-content: center; overflow-y: auto; padding: 16px 8px; }
.modal .box { background: var(--bg); border-radius: 22px; width: 100%; max-width: 760px; padding: 12px; }
.modal .box > .row.sp:first-child { position: sticky; top: -16px; background: var(--bg); padding: 4px 0; z-index: 1; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); top: 70px; z-index: 30; background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 14px; max-width: 92%; font-size: 16px; font-weight: 700; }
.toast.bad { background: var(--bad); }
.grid2 { display: grid; grid-template-columns: 1fr; gap: 10px; }
@media (min-width: 640px) { .grid2 { grid-template-columns: 1fr 1fr; } }
.ico { font-size: 28px; width: 38px; text-align: center; flex: 0 0 38px; }
details > summary { cursor: pointer; font-weight: 800; padding: 4px 0; font-size: 17px; }
.spark { display: block; width: 100%; height: 46px; }
select { max-width: 100%; }
.kv select, .kv input[type=text] { max-width: 58vw; }
@media (min-width: 640px) { .kv select, .kv input[type=text] { max-width: 360px; } }
.row > select { min-width: 0; flex: 1 1 160px; }
/* --- v2 icon-first pieces --- */
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-bottom: 12px; }
@media (min-width: 560px) { .tiles { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.tile { background: #fff; border: 2px solid var(--line); border-radius: 18px; padding: 8px 10px; text-align: center; cursor: pointer; }
.tile .ti { font-size: 28px; line-height: 1.1; } .tile .tv { font-size: 21px; font-weight: 800; } .tile .tl { font-size: 13px; color: var(--mute); font-weight: 700; }
.tile.g { border-color: #86efac; background: #f0fdf4; } .tile.y { border-color: #fcd34d; background: #fffbeb; } .tile.r { border-color: #fca5a5; background: #fef2f2; }
.irow { display: flex; align-items: center; gap: 8px; padding: 8px 2px; border-bottom: 2px dashed var(--line); flex-wrap: wrap; }
.irow:last-child { border-bottom: 0; }
.irow .ic { font-size: 30px; width: 40px; text-align: center; flex: 0 0 40px; }
.irow .lb { flex: 1 1 120px; min-width: 0; font-weight: 700; cursor: pointer; }
.irow .lb small { display: block; font-weight: 600; color: var(--mute); font-size: 13.5px; }
.irow .vl { font-weight: 800; font-size: 19px; white-space: nowrap; }
.irow .acts { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.irow .acts input[type=number] { width: 84px; }
.tipb { border: 0; background: var(--infobg); color: var(--info); border-radius: 99px; width: 30px; height: 30px; font-weight: 800; cursor: pointer; flex: 0 0 30px; }
.tip { flex: 1 1 100%; background: var(--infobg); color: #1e3a8a; border-radius: 12px; padding: 6px 10px; font-size: 15px; margin: 2px 0 2px 48px; }
.dot { display: inline-block; width: 14px; height: 14px; border-radius: 50%; background: var(--line); flex: 0 0 14px; }
.dot.g { background: #22c55e; } .dot.y { background: #f59e0b; } .dot.r { background: #ef4444; }
.cathead { display: flex; align-items: center; gap: 8px; font-size: 19px; font-weight: 800; margin: 2px 0 4px; }
.cathead .ic { font-size: 30px; }
.link { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 12px; margin: 3px 0; background: #f8fbff; }
.link.weak { background: var(--badbg); font-weight: 800; }
.link .grow .bar { margin-top: 3px; }
.banner { background: var(--badbg); border: 2px solid #fca5a5; border-radius: 18px; padding: 10px 12px; margin: 0 0 12px; font-weight: 700; }
.pricebox { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.pricebox .mk { background: var(--bg); border-radius: 14px; padding: 6px 12px; font-weight: 800; }
.age { display: flex; gap: 2px; align-items: flex-end; height: 44px; margin: 6px 0 2px; }
.age i { flex: 1; background: #93c5fd; border-radius: 4px 4px 0 0; min-height: 2px; }
.age i.rd { background: #22c55e; }

</style>

<!-- engine (order matters) -->
<script>/* js/core.js */
/* core.js - shared helpers, seeded RNG, formatting. Loaded first. */
(function () {
  const TG = (globalThis.TG = globalThis.TG || {});
  TG.G = null; // current game state

  // ---------- Seeded RNG (mulberry32); state lives in the save so runs are reproducible ----------
  const R = {
    next() {
      const g = TG.G;
      let s = g ? g.rngState : (R._s = (R._s || 12345));
      s = (s + 0x6d2b79f5) >>> 0;
      let t = s;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      if (g) g.rngState = s; else R._s = s;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    },
    range(a, b) { return a + (b - a) * R.next(); },
    int(a, b) { return Math.floor(R.range(a, b + 1)); },
    chance(p) { return R.next() < p; },
    pick(arr) { return arr[Math.floor(R.next() * arr.length)]; },
    normal(mu = 0, sd = 1) {
      let u = 0, v = 0;
      while (u === 0) u = R.next();
      v = R.next();
      return mu + sd * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
    },
    weighted(obj) { // {key: weight}
      let tot = 0; for (const k in obj) tot += Math.max(0, obj[k]);
      let r = R.next() * tot;
      for (const k in obj) { r -= Math.max(0, obj[k]); if (r <= 0) return k; }
      return Object.keys(obj)[0];
    },
    shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(R.next() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; },
  };
  TG.R = R;

  const U = {
    clamp: (x, a, b) => Math.max(a, Math.min(b, x)),
    lerp: (a, b, t) => a + (b - a) * t,
    num(x, d = 0) { return Number.isFinite(x) ? x : d; },
    sum: (arr, f) => arr.reduce((s, x) => s + (f ? f(x) : x), 0),
    avg: (arr, f, d = 0) => (arr.length ? U.sum(arr, f) / arr.length : d),
    uid(prefix) { const g = TG.G; g.nextId = (g.nextId || 1) + 1; return (prefix || 'id') + g.nextId; },
    money(x, opts) {
      if (!Number.isFinite(x)) return '$0';
      const neg = x < 0; const a = Math.abs(x);
      let s;
      if (a >= 1e12) s = (a / 1e12).toFixed(2) + 'T';
      else if (a >= 1e9) s = (a / 1e9).toFixed(2) + 'B';
      else if (a >= 1e6) s = (a / 1e6).toFixed(2) + 'M';
      else if (a >= 1e4) s = (a / 1e3).toFixed(1) + 'k';
      else s = Math.round(a).toLocaleString('en-US');
      return (neg ? '-$' : '$') + s;
    },
    pct(x, d = 0) { return (Number.isFinite(x) ? (x * 100).toFixed(d) : '0') + '%'; },
    months: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'],
    moy(m) { return ((m % 12) + 12) % 12; },
    dateStr(m) { const c = TG.CONFIG; return U.months[U.moy(m)] + ' ' + (c.start.year + Math.floor(m / 12)); },
    yrsMo(n) {
      n = Math.max(0, Math.floor(n || 0));
      const y = Math.floor(n / 12), mo = n % 12;
      if (!y) return mo + ' mo';
      return y + (y === 1 ? ' yr' : ' yrs') + (mo ? ' ' + mo + ' mo' : '');
    },
    riskLabel(p) {
      const t = TG.CONFIG.riskLabels;
      if (p >= t.critical) return { label: 'Critical', tone: 'bad' };
      if (p >= t.high) return { label: 'High', tone: 'bad' };
      if (p >= t.moderate) return { label: 'Moderate', tone: 'warn' };
      return { label: 'Low', tone: 'good' };
    },
    esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); },
    stars(q) { const n = U.clamp(Math.round(q * 5), 1, 5); return '★'.repeat(n) + '☆'.repeat(5 - n); },
    clone: (o) => JSON.parse(JSON.stringify(o)),
  };
  TG.U = U;
})();

</script>
<script>/* js/config.js */
/* =====================================================================
   config.js  -  THE ONE PLACE FOR TUNABLE NUMBERS.
   Every odds value, cost, price, wage, margin, market size and event
   rate in the game lives here (businesses are in the same object, split
   across config.js + config-businesses.js only to keep files readable).
   Game numbers are game numbers: none are real-world statistics.
   ===================================================================== */
(function () {
  const TG = (globalThis.TG = globalThis.TG || {});

<script>/* js/config-extras.js */
/* config-extras.js - v2 additions to TG.CONFIG (all tunable):
   - pricing: a market for every sellable good, elasticity and fairness rules
   - equipment categories, per-business capacity items (seating, machines, storage, boosts) with upkeep
   - supplies / stock (what each business consumes, spoil rates, storage)
   - farm v2: seeds, storage bins, planters/combines, cattle life cycle, dairy
   - icons used by the UI.

      phase, phaseLeft: R.int(ph.dur[0], ph.dur[1]), econ: ph.econ, baseRate: ph.rate + R.range(-0.005, 0.005),

      crime: 0, shortage: {}, driverShortage: 0, hoursReg: 0, licenseFees: {}, recessionMonths: 0,
    };

    for (const r in C.regions) g.world.weather[r] = { kind: 'mild', sev: 0 };
    g.markets = {};
    for (const id in C.markets) {
      const m = C.markets[id];
      g.markets[id] = { demand12: m.demand12, comp: R.range(0.9, 1.1), player12: 0, sales: [], price: m.base, hist: [] };
      g.markets[id].price = W.price(g, id, 0);

  // market price given an extra amount of player supply this year
  W.price = (g, id, extra) => {
    const C = TG.CONFIG, m = C.markets[id], st = g.markets[id];
    const share = U.clamp((st.player12 + (extra || 0)) / st.demand12, 0, 1.5);
    const curve = Math.max(0.12, 1 - m.drop * Math.pow(share, m.shape));
    const trend = g.world.trends[m.trendCat] || 1;
    const p = m.base * Math.pow(g.world.econ, m.sens) * trend * Math.pow(st.comp, -m.compElast) * curve * g.world.priceIdx;
    return Math.max(0.01, p);
  };
  W.share = (g, id) => U.clamp(g.markets[id].player12 / g.markets[id].demand12, 0, 2);
  // record player sales into a market (rolling 12 months)
  W.sell = (g, id, qty) => {
    const st = g.markets[id];
    st.cur = (st.cur || 0) + qty;
  };

  W.month = (g) => {
    const C = TG.CONFIG, w = g.world, ec = C.economy;
    // economy phase
    w.phaseLeft--;
    if (w.phaseLeft <= 0) {
      const next = R.weighted(ec.phases[w.phase].next);
      w.phase = next; const ph = ec.phases[next];
      w.phaseLeft = R.int(ph.dur[0], ph.dur[1]);
      TG.rep.news(g, `Economy enters a ${ph.label.toLowerCase()}`, next === 'recession' ? 'bad' : next === 'boom' ? 'good' : 'info');
    }
    const ph = ec.phases[w.phase];
    w.econ += (ph.econ - w.econ) * 0.15 + R.normal(0, 0.006);
    w.econ = U.clamp(w.econ, 0.7, 1.25);
    if (w.phase === 'recession') w.recessionMonths++;
    w.baseRate += (ph.rate - w.baseRate) * ec.rateDrift + R.normal(0, ec.rateNoise);
    w.baseRate = U.clamp(w.baseRate, ec.rateMin, ec.rateMax);
    w.priceIdx *= 1 + ec.inflationPerMonth * (w.phase === 'boom' ? 1.4 : w.phase === 'recession' ? 0.4 : 1);
    w.wageIdx *= 1 + ec.inflationPerMonth * (w.phase === 'boom' ? 1.3 : 0.8);
    w.fuel = U.clamp(w.fuel + (1 - w.fuel) * 0.06 + R.normal(0, ec.fuelNoise), 0.6, 2.2);
    w.housing *= 1 + ph.housing + R.normal(0, ec.housingNoise) - (w.baseRate - 0.04) * 0.05;
    if (R.chance(ec.crashChance * (w.phase === 'slowdown' || w.phase === 'recession' ? 3 : 0.5))) {
      const d = R.range(ec.crashDrop[0], ec.crashDrop[1]); w.housing *= 1 - d;
      TG.rep.news(g, `Housing market crash: property values fall ${U.pct(d)}`, 'bad', true);
    }
    w.housing = U.clamp(w.housing, 0.3, 6);
    // timers
    ['rentCap', 'emissions', 'crime', 'driverShortage', 'hoursReg'].forEach((k) => { if (w[k] > 0) w[k]--; });
    for (const k in w.shortage) { w.shortage[k]--; if (w.shortage[k] <= 0) delete w.shortage[k]; }
    for (const k in w.trends) w.trends[k] += (1 - w.trends[k]) * 0.04;
    // weather per region
    const moy = U.moy(g.month);
    for (const r in C.regions) {
      const cl = C.regions[r].climate; let kind = 'mild', sev = 0;
      for (const k in C.weather.kinds) {
        const wk = C.weather.kinds[k];
        if (wk.months && wk.months.indexOf(moy) < 0) continue;
        if (R.chance(wk.base * (cl[k] || 1))) { if (wk.sev > sev) { kind = k; sev = wk.sev; } }
      }
      w.weather[r] = { kind, sev };
      if (sev >= 0.6) TG.rep.news(g, `${C.weather.kinds[kind].label} in ${C.regions[r].label}`, 'warn');
    }
    // world events
    const freq = C.difficulty.eventFreq[g.settings.eventFreq] || 1;
    for (const ev of C.worldEvents) {
      if (!R.chance(ev.p * freq)) continue;
      const e = ev.effect; let txt = ev.label;
      if (e.wageIdx) { const d = R.range(e.wageIdx[0], e.wageIdx[1]); w.wageIdx *= 1 + d; W.minWage(g, d); txt += `: wages up ${U.pct(d)}`; }
      if (e.licenseFee) { const ids = Object.keys(C.businesses); const t = R.pick(ids); const fee = Math.round(R.range(e.licenseFee[0], e.licenseFee[1])); w.licenseFees[t] = fee; txt += ` for ${C.businesses[t].name} (${U.money(fee)} fee per business)`; W.chargeLicense(g, t, fee); }
      if (e.rentCap) { w.rentCap = R.int(e.rentCap[0], e.rentCap[1]); txt += ` (${U.yrsMo(w.rentCap)})`; }
      if (e.emissions) { w.emissions = R.int(e.emissions[0], e.emissions[1]); txt += ' hits factories and fleets'; }
      if (e.rate) { const d = R.range(e.rate[0], e.rate[1]); w.baseRate = U.clamp(w.baseRate + d, ec.rateMin, ec.rateMax); txt += ` (base rate now ${U.pct(w.baseRate, 1)})`; W.repriceVariable(g); }
      if (e.trend) { const cat = R.pick(C.trendCats); const d = R.range(e.trend[0], e.trend[1]); w.trends[cat] = U.clamp(w.trends[cat] + d, 0.5, 1.8); txt += `: ${cat} demand ${d > 0 ? 'up' : 'down'} ${U.pct(Math.abs(d))}`; }
      if (e.crime) w.crime = R.int(e.crime[0], e.crime[1]);
      if (e.shortage) { const cat = R.pick(['food', 'auto', 'home', 'health', 'fashion']); w.shortage[cat] = R.int(e.shortage[0], e.shortage[1]); txt += ` in ${cat} supplies`; }
      if (e.fuel) { const d = R.range(e.fuel[0], e.fuel[1]); w.fuel = U.clamp(w.fuel * (1 + d), 0.6, 2.5); txt += ` (+${U.pct(d)})`; }
      if (e.driverShortage) w.driverShortage = R.int(e.driverShortage[0], e.driverShortage[1]);
      if (e.hoursReg) w.hoursReg = R.int(e.hoursReg[0], e.hoursReg[1]);
      TG.rep.news(g, txt, e.trend && e.trend[0] > 0 ? 'good' : 'warn');
    }
    // markets
    const mr = C.marketRules;
    for (const id in g.markets) {
      const st = g.markets[id], m = C.markets[id];
      st.sales.push(st.cur || 0); st.cur = 0; if (st.sales.length > 12) st.sales.shift();
      st.player12 = U.sum(st.sales);
      st.demand12 *= 1 + mr.demandGrowth + (w.econ - 1) * 0.004;
      const p = W.price(g, id, 0);
      const rel = p / (m.base * g.world.priceIdx);
      if (rel > 1.05) st.comp = Math.min(mr.compMax, st.comp * (1 + mr.compReactUp * (rel - 1) * 4));
      else if (rel < 0.85) {
        st.comp = Math.max(mr.compMin, st.comp * (1 - mr.compReactDown * (1 - rel) * 4));
        if (R.chance(0.05)) TG.rep.news(g, `Low ${m.label.toLowerCase()} prices push a competitor into bankruptcy`, 'info');
      }
      st.comp = U.clamp(st.comp + R.normal(0, 0.004), mr.compMin, mr.compMax);
      st.price = W.price(g, id, 0);
      st.hist.push(Math.round(st.price * 100) / 100); if (st.hist.length > 120) st.hist.shift();
    }
  };

  W.minWage = (g, d) => {
    for (const b of g.businesses) for (const e of TG.S.allStaff(b)) {
      const rd = TG.S.roleDef(b, e.role); if (!rd) continue;
      const floor = rd.wage[0] * g.world.wageIdx;
      if (e.wage < floor) e.wage = Math.round(floor);
    }
  };
  W.chargeLicense = (g, type, fee) => {
    for (const b of g.businesses) if (b.type === type) { TG.F.spend(g, fee, 'Licenses & permits', b.id); TG.rep.event(g, b, 'bad', `New license rules cost ${U.money(fee)}`, 'Regulation change (world event)'); }
  };
  W.repriceVariable = (g) => { if (g.loc) g.loc.rate = TG.F.rateFor(g, 'loc'); };

  W.phaseLabel = (g) => TG.CONFIG.economy.phases[g.world.phase].label;
  W.econMult = (g, sens) => Math.pow(g.world.econ, sens == null ? 1 : sens);
  W.weatherOf = (g, region) => g.world.weather[region] || { kind: 'mild', sev: 0 };
  TG.W = W;
})();

</script>
<script>/* js/pricing.js */
/* pricing.js - v2: live market prices with player-set sale prices (TG.P) and supplies/stock (TG.ST).
   Price effects are deliberately steep above market so a huge price is never the winning move. */
(function () {
  const TG = globalThis.TG; const R = TG.R, U = TG.U;
  const P = {};
  const cfg = () => TG.CONFIG.pricing;
  // the good a business sells (farm depends on enterprise)
  P.good = (b) => {
    const d = TG.CONFIG.businesses[b.type];
    if (b.farm) return TG.CONFIG.farmGoods[b.farm.ent] || TG.CONFIG.farmGoods.crops;
    return d.good || null;
  };
  // market price per unit right now (moves with economy, trends, competitors and everyone's supply incl. yours)
  P.market = (g, b) => {
    const gd = P.good(b); if (!gd || !g.markets[gd.market]) return 0;
    let p = TG.W.price(g, gd.market, 0);
    if (gd.base) p = p / TG.CONFIG.markets[gd.market].base * gd.base; // e.g. tech ARPU vs software index
    return p;
  };
  P.hasPrice = (b) => !!P.good(b) && !b.proj && !b.fr;
  // the player's price (null = follow market)
  P.ask = (g, b) => (b.ask != null && b.ask > 0 ? b.ask : P.market(g, b));
  P.ratio = (g, b) => {
    if (b.ask == null || !(b.ask > 0)) return 1;
    const m = P.market(g, b); if (!(m > 0)) return 1;
    return U.clamp(b.ask / m, cfg().minRatio, cfg().maxRatio);
  };
  // how many customers you keep at price ratio r (service-type goods)
  P.demandF = (r) => {
    const c = cfg();
    if (r <= 1) return Math.min(c.maxBoost, Math.pow(r, -c.elasticDown));
    let f = Math.pow(r, -c.elasticUp);
    if (r > c.collapseAt) f *= Math.exp(-c.collapseK * (r - c.collapseAt));
    return f;
  };
  // share of what you offer that buyers take at your ask (commodities: many other sellers)
  P.sellF = (r) => (r <= 1 ? 1 : Math.pow(r, -cfg().commodityUp) * (r > cfg().collapseAt ? Math.exp(-cfg().collapseK * (r - cfg().collapseAt)) : 1));
  // reputation target shift from pricing fairness
  P.fair = (r) => {
    const c = cfg();
    if (r > 1 + c.fairFreeBand) return -(r - 1 - c.fairFreeBand) * c.fairUp;
    if (r < 1 - c.fairFreeBand) return Math.min(c.fairDownMax, (1 - c.fairFreeBand - r) * c.fairDown);
    return 0;
  };
  P.set = (g, b, price) => {
    if (price == null || price === '' || !(Number(price) > 0)) { b.ask = null; return { ok: true, follow: true }; }
    const m = P.market(g, b); const p = Number(price);
    const lo = m * cfg().minRatio, hi = m * cfg().maxRatio;
    b.ask = Math.round(U.clamp(p, lo, hi) * 100) / 100;
    return { ok: true, price: b.ask };
  };
  P.label = (r) => (r > 1.25 ? 'way over market' : r > 1.05 ? 'over market' : r < 0.8 ? 'way under market' : r < 0.95 ? 'under market' : 'at market');
  P.tone = (r) => (r > 1.25 || r < 0.75 ? 'r' : r > 1.08 || r < 0.92 ? 'y' : 'g');
  TG.PR = P;

  // ================= SUPPLIES / STOCK =================
  const ST = {};
  ST.def = (b) => TG.CONFIG.businesses[b.type].supply || null;
  ST.unitCost = (g, b) => {
    const d = TG.CONFIG.businesses[b.type], s = ST.def(b); if (!s) return 0;
    let c;
    if (s.unitCostFrom === 'materialCost') c = d.factory.materialCost;
    else c = d.svc.cogs * d.svc.ticket;
    if (g.world.shortage[d.cat]) c *= 1.15;
    if (d.svc && TG.B.owner(g, b)) c *= Math.max(0.5, 1 - TG.CONFIG.owner.operatedCogsCut / d.svc.cogs);
    if (d.factory && b.fixes && b.fixes.bulk && b.fixes.bulk.until > g.month) c *= 0.85;
    return c * g.world.priceIdx;
  };
  ST.cap = (b) => {
    const s = ST.def(b); if (!s) return 0;
    const d = TG.CONFIG.businesses[b.type];
    let base = s.baseStore || 0;
    if (s.perSqft) base += b.sqft * s.perSqft;
    else if (d.svc) {
      // built-in storage (shelves, the truck's own fridge...) holds about 3/4 of what your machines can serve in a month
      const pools = TG.E.pools(b); let eq = Infinity; for (const p of pools) eq = Math.min(eq, TG.E.capacity(b, p.pool));
      if (!pools.length) eq = 0; const sp = d.svc.mobile ? Infinity : b.sqft * d.svc.perSpace;
      base = Math.max(base, 0.75 * Math.min(eq, sp));
    }
    let add = 0;
    for (const it of b.equip) { const ed = TG.E.def(b, it.type); if (ed && ed.store && !it.broken) add += ed.store; }
    return Math.round(base + add);
  };
  ST.ensure = (b) => { if (ST.def(b) && !b.stock) b.stock = { qty: 0, auto: true, inM: 0, usedM: 0, spoilM: 0, wasteM: 0 }; return b.stock; };
  // buy supplies; premium = extra % paid (staff ordering without a manager); returns qty bought
  ST.buy = (g, b, qty, premium, label) => {
    const st = ST.ensure(b); if (!st) return 0;
    const room = Math.max(0, ST.cap(b) - st.qty);
    qty = Math.max(0, Math.min(Math.round(qty), room));
    const unit = ST.unitCost(g, b) * (1 + (premium || 0));
    if (qty * unit > Math.max(0, g.cash)) qty = Math.max(0, Math.floor(Math.max(0, g.cash) / unit));
    if (qty <= 0) return 0;
    TG.F.spend(g, Math.round(qty * unit), label || 'Supplies & cost of sales', b.id);
    st.qty += qty; st.inM = (st.inM || 0) + qty;
    return qty;
  };
  // sell leftover supplies back (half price)
  ST.sell = (g, b, qty) => {
    const st = ST.ensure(b); if (!st) return 0; qty = Math.max(0, Math.min(Math.round(qty), Math.floor(st.qty)));
    if (!qty) return 0;
    const v = Math.round(qty * ST.unitCost(g, b) * TG.CONFIG.supply.sellBack);
    st.qty -= qty; TG.F.earn(g, v, 'Asset sales', b.id, true); return v;
  };
  // monthly restock before serving. need = units expected to be used this month.
  ST.restock = (g, b, need) => {
    const st = ST.ensure(b); if (!st) return null;
    st.inM = 0; st.usedM = 0; st.spoilM = 0; st.wasteM = 0;
    if (!st.auto) return { by: 'off' };
    const S = TG.CONFIG.supply;
    let who = null, mult, prem = 0, out = 'ok';
    const h = TG.D.handler(g, b, 'stock');
    const own = TG.B.owner(g, b);
    if (h && !(own && h.role === 'ceo')) { out = TG.D.roll(h); who = h.label; mult = out === 'good' ? R.range(1.04, 1.1) : out === 'ok' ? R.range(0.98, 1.14) : (R.chance(0.5) ? R.range(0.75, 0.9) : R.range(1.25, 1.4)); }
    else if (own) { who = 'You'; mult = R.range(1.0, 1.1); }
    else { who = 'Staff'; mult = R.range(S.staffReorderCover[0], S.staffReorderCover[1]); prem = S.staffReorderPremium; }
    const want = Math.max(0, need * mult - st.qty);
    const got = ST.buy(g, b, want, prem);
    st.lastBy = who; st.lastOut = out; st.short = got < want - 0.5 ? (ST.cap(b) - st.qty < 1 ? 'room' : 'cash') : '';
    if (out === 'bad' && h && got > 0 && R.chance(0.4)) TG.rep.decision(g, b, h.label, mult > 1 ? `Over-ordered ${TG.CONFIG.businesses[b.type].supply.label.toLowerCase()} (${Math.round(mult * 100)}% of need)` : `Under-ordered ${TG.CONFIG.businesses[b.type].supply.label.toLowerCase()} (${Math.round(mult * 100)}% of need)`, 'bad');
    return { by: who, got, prem };
  };
  // use stock; returns units actually used
  ST.use = (b, n) => { const st = b.stock; if (!st) return n; const u = Math.min(st.qty, Math.max(0, n)); st.qty -= u; st.usedM += u; return u; };
  ST.spoil = (b) => { const st = b.stock, s = ST.def(b); if (!st || !s) return 0; const x = st.qty * s.spoil; st.qty -= x; st.spoilM = x; return x; };
  ST.value = (g, b) => (b.stock ? b.stock.qty * ST.unitCost(g, b) * 0.8 : 0);
  // cheapest storage item per unit of space
  ST.bestStore = (b) => TG.CONFIG.businesses[b.type].equip.filter((x) => x.store).sort((x, y) => x.price / x.store - y.price / y.store)[0] || null;
  // buy enough storage to hold `need` units; returns count bought
  ST.addStorage = (g, b, need, tier) => {
    const it = ST.bestStore(b); if (!it) return 0; let n = 0;
    while (ST.cap(b) < need && n < 20) { const x = TG.E.buy(g, b, it.id, tier || 'standard'); if (!x) break; n++; }
    return n;
  };
  TG.ST = ST;

  // ================= FLOW (this month / next month) =================
  // rows: {i: icon, t: label, v: value, u: unit, c: 'g'|'y'|'r'|'' , why}
  const FL = {};
  FL.start = (b) => { b.flowNew = { rows: [], next: [] }; return b.flowNew; };
  FL.row = (b, i, t, v, u, c, why) => { if (!b.flowNew) FL.start(b); b.flowNew.rows.push({ i, t, v: Math.round(v), u: u || '', c: c || '', why: why || '' }); };
  FL.next = (b, i, t, v, u, c, why) => { if (!b.flowNew) FL.start(b); b.flowNew.next.push({ i, t, v: Math.round(v), u: u || '', c: c || '', why: why || '' }); };
  FL.commit = (g, b) => { if (b.flowNew) { b.flow = Object.assign({ m: g.month }, b.flowNew); b.flowNew = null; } };
  TG.FL = FL;
})();

</script>
<script>/* js/property.js */
/* property.js - property market: listings, suitability per business (a guide only), pros/cons, value, buy/lease/sell. */
(function () {
  const TG = globalThis.TG; const R = TG.R, U = TG.U;
  const P = {};
  const STREETS = ['Oak', 'Main', 'Mill', 'River', 'Cedar', 'Station', 'Market', 'Lake', 'Hill', 'Church', 'Ridge', 'Elm', 'Harbor', 'Quarry', 'Orchard', 'Prairie', 'Canyon', 'Pine', 'Willow', 'Bridge'];
  const hash = (s) => { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return ((h >>> 0) % 10000) / 10000; };

  P.gen = (g, opts) => {
    const C = TG.CONFIG; opts = opts || {};
    const kindId = opts.kind || R.weighted({ storefront: 5, office: 3, lot: 3, warehouse: 2.5, farmland: 3.5, ranch: 1.5, hillside: 1.5, hotelbldg: 1, medical: 1 });
    const k = C.propertyKinds[kindId];
    const loc = opts.loc && k.locs.indexOf(opts.loc) >= 0 ? opts.loc : R.pick(k.locs);
    const L = C.locations[loc];
    const region = opts.region || R.pick(Object.keys(C.regions));
    let landType = 'urban';
    if (kindId === 'farmland') landType = R.weighted({ flat: 0.35, floodplain: 0.15, frostvalley: 0.15, dry: 0.15, grassland: 0.2 });
    else if (kindId === 'ranch') landType = R.weighted({ grassland: 0.55, dry: 0.45 });
    else if (kindId === 'hillside') landType = 'hillside';
    else if (loc === 'rural' || loc === 'remote') landType = R.weighted({ dry: 0.4, grassland: 0.4, urban: 0.2 });
    if (opts.landType) landType = opts.landType;
    const lt = C.landTypes[landType];
    const sizeT = Math.pow(R.next(), 1.6);
    const sqft = Math.round(U.lerp(k.sqft[0], k.sqft[1], opts.big ? R.range(0.5, 1) : sizeT) / 10) * 10;
    let acres = U.lerp(k.acres[0], k.acres[1], opts.big ? R.range(0.5, 1) : Math.pow(R.next(), 1.5));
    acres = acres >= 10 ? Math.round(acres) : Math.round(acres * 100) / 100;
    const soil = R.range(lt.soil[0], lt.soil[1]), water = R.range(lt.water[0], lt.water[1]);
    const roadR = { city: [0.85, 1], suburb: [0.7, 0.95], town: [0.5, 0.85], rural: [0.25, 0.7], remote: [0.05, 0.35] }[loc];
    const road = R.range(roadR[0], roadR[1]);
    const cl = C.regions[region].climate;
    const climate = U.clamp(1 - (cl.drought - 0.6) * 0.25 - (cl.frost * lt.frost - 0.6) * 0.25 - lt.flood * 3 - (landType === 'dry' ? 0.15 : 0), 0, 1);
    const cond = R.range(0.4, 1);
    const farmKind = kindId === 'farmland' || kindId === 'ranch' || kindId === 'hillside';
    const orchard = kindId === 'hillside' && R.chance(0.35);
    let price = sqft * L.pps * (0.6 + 0.6 * cond) + acres * L.ppa * (farmKind ? 0.75 + 0.5 * soil : 1) + (orchard ? acres * 1500 : 0);
    price *= C.regions[region].price * R.range(0.85, 1.15) * (g.world ? g.world.housing : 1);
    price = Math.round(price / 1000) * 1000;
    const p = {
      id: U.uid('p'), kind: kindId, loc, region, landType, sqft, acres, soil, water, road, climate, cond, orchard,
      traffic: R.range(L.traffic[0], L.traffic[1]), labor: R.range(L.labor[0], L.labor[1]),
      price, tax: L.tax * R.range(0.8, 1.25), listed: g.month || 0,
      name: `${R.int(10, 9800)} ${R.pick(STREETS)} ${R.pick(['Rd', 'St', 'Ave', 'Ln', 'Way', 'Pike'])}`,
    };
    return p;
  };

  // which property kinds / locations fit a business best (for targeted listing generation)
  P.idealFor = (type) => {
    const d = TG.CONFIG.businesses[type];
    let kind = 'storefront';
    if (type === 'farm') kind = R.pick(['farmland', 'farmland', 'ranch', 'hillside']);
    else if (type === 'hotel') kind = 'hotelbldg';
    else if (type === 'clinic') kind = 'medical';
    else if (type === 'factory' || type === 'brand') kind = 'warehouse';
    else if (type === 'freight' || type === 'construction') kind = 'lot';
    else if (type === 'law' || type === 'tech' || type === 'franchise') kind = 'office';
    else if (d.space.ideal >= 4000) kind = R.pick(['warehouse', 'storefront', 'lot']);
    else if (d.svc && d.svc.mobile) kind = R.pick(['lot', 'storefront']);
    const locs = Object.keys(d.locPref).sort((a, b) => d.locPref[b] - d.locPref[a]);
    const allowed = TG.CONFIG.propertyKinds[kind].locs;
    const loc = locs.find((l) => allowed.indexOf(l) >= 0 && R.chance(0.7)) || locs.find((l) => allowed.indexOf(l) >= 0);
    return { kind, loc };
  };

  P.spaceFit = (p, d) => {
    const v = d.space.unit === 'acres' ? p.acres : p.sqft;
    const { min, ideal } = d.space;
    if (v < min) return 0.15 * v / min;
    if (v <= ideal) return 0.6 + 0.4 * (v - min) / Math.max(1, ideal - min);
    if (v <= ideal * 4) return 1 - 0.3 * (v - ideal) / (ideal * 3);
    return 0.6;
  };

  // factor scores 0..1 for a property & business
  P.factors = (p, type) => {
    const d = TG.CONFIG.businesses[type];
    const f = { traffic: p.traffic, labor: p.labor, road: p.road, soil: p.soil, water: p.water, climate: p.climate, space: P.spaceFit(p, d), loc: d.locPref[p.loc] };
    if (type === 'farm') {
      const ents = d.farm.enterprises; let best = 0;
      for (const k in ents) if (ents[k].best === p.landType) best = 0.12;
      f.soil = U.clamp(p.soil + best, 0, 1);
      if (p.landType === 'dry') f.water = Math.min(f.water, 0.3);
    }
    return f;
  };
  P.suit = (p, type) => {
    const d = TG.CONFIG.businesses[type];
    const f = P.factors(p, type); let s = 0, tot = 0;
    for (const k in d.site) { s += d.site[k] * (f[k] == null ? 0.5 : f[k]); tot += d.site[k]; }
    s = s / tot;
    if (f.space < 0.15) s *= 0.5; // far too small is a deal-breaker
    if (f.loc < 0.1) s *= 0.7;
    const noise = (hash(p.id + type) - 0.5) * 2 * TG.CONFIG.property.suitNoise;
    return U.clamp(s + noise, 0, 1);
  };
  P.suitLabel = (s) => { for (const [t, label, tone] of TG.CONFIG.property.suitBands) if (s >= t) return { label, tone }; return { label: 'Poor', tone: 'bad' }; };

  P.prosCons = (p, type) => {
    const C = TG.CONFIG, d = C.businesses[type], f = P.factors(p, type);
    const pros = [], cons = [];
    const w = d.site;
    const licensed = Object.values(d.roles).some((r) => r.licensed);
    if ((w.traffic || 0) >= 0.1) { if (f.traffic >= 0.7) pros.push('Busy area: lots of passing customers'); else if (f.traffic <= 0.3) cons.push('Little foot traffic: few walk-in customers'); }
    if ((w.labor || 0) >= 0.1) { if (f.labor >= 0.7) pros.push('Large skilled labor pool: easier hiring'); else if (f.labor <= 0.35) cons.push(licensed ? 'Tiny labor pool: licensed pros rarely want to move here' : 'Small labor pool: harder to hire and keep staff'); }
    if ((w.road || 0) >= 0.1) { if (f.road >= 0.8) pros.push('Close to highways'); else if (f.road <= 0.4) cons.push('Poor road access: slower routes, more fuel and wear'); }
    if ((w.soil || 0) >= 0.1) { if (f.soil >= 0.75) pros.push('Rich soil raises full-harvest odds'); else if (f.soil <= 0.45) cons.push('Poor soil lowers crop yields'); }
    if ((w.water || 0) >= 0.1) { if (f.water >= 0.75) pros.push('Reliable water (wells / creek)'); else if (f.water <= 0.35) cons.push('Little water: high drought risk unless irrigated'); }
    if ((w.climate || 0) >= 0.1) { if (f.climate >= 0.75) pros.push('Mild climate'); else if (f.climate <= 0.45) cons.push('Harsh climate: frost or drought prone'); }
    if (f.space < 0.15) cons.push(`Far too small for a ${d.name.toLowerCase()} (${d.space.unit === 'acres' ? p.acres + ' acres' : p.sqft.toLocaleString() + ' sq ft'})`);
    else if (f.space < 0.6) cons.push('Smaller than ideal: caps how big this can get');
    else if (f.space > 0.95) pros.push('Good size for the business');
    else if ((d.space.unit === 'acres' ? p.acres : p.sqft) > d.space.ideal * 4) cons.push('Much more space than needed: you pay tax on unused space');
    else if ((d.space.unit === 'acres' ? p.acres : p.sqft) > d.space.ideal) pros.push('Room to expand later');
    if (f.loc >= 0.85) pros.push(`${C.locations[p.loc].label} location suits a ${d.name.toLowerCase()}`);
    else if (f.loc <= 0.3) cons.push(`${C.locations[p.loc].label} location is a poor fit for a ${d.name.toLowerCase()}`);
    if (type === 'farm') {
      if (p.landType === 'floodplain') { pros.push('Flood plain soil is excellent'); cons.push('Real chance of losing a season to flooding'); }
      if (p.landType === 'frostvalley') cons.push('Frost-prone valley: early frost can wipe out a harvest');
      if (p.landType === 'hillside') pros.push('Hillside drainage: good for orchards, less so for field crops');
      if (p.landType === 'grassland') pros.push('Grassland: healthy herd and low feed costs for cattle');
      if (p.landType === 'dry') cons.push('Dry land: ranching at best without irrigation');
      if (p.orchard) pros.push('Mature orchard already planted (no 30-month wait)');
      if (p.loc === 'remote') cons.push('Remote: seasonal workers are hard to find');
    }
    if (p.cond < 0.55) cons.push('Building needs work (higher upkeep)');
    if (p.tax > C.locations[p.loc].tax * 1.12) cons.push('High local tax rate');
    else if (p.tax < C.locations[p.loc].tax * 0.9) pros.push('Low local tax rate');
    return { pros, cons };
  };

  P.value = (g, p) => Math.round((p.baseValue || p.price) * (g.world.housing / (p.housingAtBuy || 1)) * (p.improve || 1));
  P.monthlyTax = (g, p) => Math.round(P.value(g, p) * p.tax / 12);
  P.leaseRent = (g, p) => { const C = TG.CONFIG.property; return Math.round(p.price * (C.landLeaseKinds.includes(p.kind) ? C.landLeaseRatePerMonth : C.leaseRatePerMonth)); };

  P.initListings = (g) => {
    const C = TG.CONFIG; g.listings = [];
    for (const type in C.businesses) for (let i = 0; i < 2; i++) { const id = P.idealFor(type); g.listings.push(P.gen(g, id)); }
    while (g.listings.length < C.start.listings) g.listings.push(P.gen(g));
    // make sure some cheap starter listings exist
    for (let i = 0; i < 3; i++) g.listings.push(P.gen(g, { kind: 'lot', loc: R.pick(['town', 'rural']) }));
  };
  P.month = (g) => {
    const C = TG.CONFIG;
    g.listings = g.listings.filter((p) => g.month - p.listed < 14 || R.chance(0.5));
    for (let i = 0; i < C.start.newListingsPerMonth; i++) {
      const t = R.pick(Object.keys(C.businesses));
      g.listings.push(R.chance(0.5) ? P.gen(g, P.idealFor(t)) : P.gen(g));
    }
    if (R.chance(0.08)) g.listings.push(P.gen(g, { kind: R.pick(['farmland', 'warehouse', 'hotelbldg']), big: true }));
    while (g.listings.length > C.start.maxListings) g.listings.shift();
  };

  // Buy a listing: mode 'cash' | 'mortgage' | 'lease'
  P.acquire = (g, listingId, mode) => {
    const C = TG.CONFIG; const p = g.listings.find((x) => x.id === listingId);
    if (!p) return { ok: false, msg: 'Listing is gone.' };
    const fees = Math.round(p.price * C.property.buyCostPct);
    if (mode === 'lease') {
      const rent = P.leaseRent(g, p), dep = rent * C.property.leaseDeposit;
      if (g.cash < dep + rent) return { ok: false, msg: `Need ${U.money(dep + rent)} for deposit and first month.` };
      TG.F.spend(g, dep + rent, 'Lease deposits', null, true);
      p.leased = true; p.rent = rent; p.deposit = dep;
    } else if (mode === 'mortgage') {
      const down = Math.round(p.price * C.property.mortgageDown);
      if (g.cash < down + fees) return { ok: false, msg: `Need ${U.money(down + fees)} for the down payment and fees.` };
      const ok = TG.F.canBorrow(g, 'mortgage', p.price - down);
      if (!ok.ok) return { ok: false, msg: ok.msg };
      TG.F.spend(g, down + fees, 'Property purchases', null, true);
      const loan = TG.F.newLoan(g, 'mortgage', p.price - down, { collateral: { kind: 'property', id: p.id }, label: 'Mortgage: ' + p.name, noCash: true });
      p.owned = true; p.mortgageId = loan.id;
    } else {
      if (g.cash < p.price + fees) return { ok: false, msg: `Need ${U.money(p.price + fees)}.` };
      TG.F.spend(g, p.price + fees, 'Property purchases', null, true);
      p.owned = true;
    }
    p.baseValue = p.price; p.housingAtBuy = g.world.housing; p.bought = g.month;
    g.listings = g.listings.filter((x) => x.id !== listingId);
    g.properties.push(p);
    return { ok: true, prop: p };
  };

  P.sell = (g, propId) => {
    const C = TG.CONFIG; const p = g.properties.find((x) => x.id === propId); if (!p) return 0;
    if (p.bizId) return -1;
    if (p.leased) { g.properties = g.properties.filter((x) => x !== p); TG.F.earn(g, p.deposit || 0, 'Lease deposits returned', null, true); return 0; }
    const v = Math.round(P.value(g, p) * (1 - C.property.sellCostPct));
    TG.F.earn(g, v, 'Property sales', null, true);
    if (p.mortgageId) TG.F.payoff(g, p.mortgageId, true);
    g.properties = g.properties.filter((x) => x !== p);
    return v;
  };
  P.locLabel = (p) => `${TG.CONFIG.locations[p.loc].label}, ${TG.CONFIG.regions[p.region].label}`;
  P.sizeLabel = (p) => (p.acres >= 5 ? `${p.acres.toLocaleString()} acres` : `${p.sqft.toLocaleString()} sq ft${p.acres >= 0.3 ? ' on ' + p.acres + ' ac' : ''}`);
  TG.P = P;
})();

</script>
<script>/* js/staff.js */
/* staff.js - employees, candidates, hiring, training, morale, quitting, theft, poaching. */
(function () {
  const TG = globalThis.TG; const R = TG.R, U = TG.U;
  const S = {};
  const FIRST = ['Alex','Sam','Jordan','Taylor','Casey','Riley','Morgan','Jamie','Avery','Quinn','Drew','Reese','Parker','Rowan','Skyler','Blake','Cameron','Dana','Elliot','Frankie','Harper','Jesse','Kai','Logan','Marley','Noel','Oakley','Peyton','Remy','Sasha','Toni','Val','Wren','Zion','Luis','Maria','Wei','Aisha','Omar','Priya','Kenji','Sofia','Mateo','Nina','Ivan','Leah','Marco','Tess','Hugo','Iris'];
  const LAST = ['Smith','Garcia','Chen','Patel','Johnson','Okafor','Nguyen','Kowalski','Rossi','Murphy','Silva','Kim','Novak','Brown','Ali','Haddad','Larsen','Moreau','Tanaka','Diaz','Fischer','Reyes','Walsh','Ito','Mensah','Costa','Price','Hughes','Ward','Bell'];
  S.name = () => R.pick(FIRST) + ' ' + R.pick(LAST);

  // role info for a business role or specialist
  S.roleDef = (b, role) => {
    if (TG.CONFIG.specialists[role]) {
      const sp = TG.CONFIG.specialists[role]; const d = b && b.type ? TG.CONFIG.businesses[b.type] : null;
      const k = d ? TG.CONFIG.staff.specWageByTier[d.tier] || 1 : 1;
      return Object.assign({ specialist: true }, sp, { wage: [Math.round(sp.wage[0] * k), Math.round(sp.wage[1] * k)] });
    }
    if (role === 'ceo') return { label: 'CEO', wage: TG.CONFIG.ceo.wage, specialist: true };
    if (role === 'rem') return { label: 'Property manager', wage: [3500, 8000], specialist: true };
    return TG.CONFIG.businesses[b.type].roles[role];
  };

  // Generate a candidate. labor = property labor pool (0..1)
  S.candidate = (g, b, role, labor) => {
    const C = TG.CONFIG, rd = S.roleDef(b, role);
    labor = U.clamp(labor == null ? 0.5 : labor, 0.02, 1);
    const quals = U.clamp(Math.pow(R.next(), 1.25 - labor * 0.6), 0, 1);
    const skill = U.clamp(Math.round(C.staff.skillByQuals[0] + quals * C.staff.skillByQuals[1] + R.normal(0, C.staff.skillNoise)), 5, 99);
    const regionWage = b && b.region ? C.regions[b.region].wage : 1;
    const locWage = b && b.loc ? C.locations[b.loc].wage : 1;
    const scarcity = 1 + (1 - labor) * 0.3;
    const wage = Math.round(U.lerp(rd.wage[0], rd.wage[1], U.clamp(quals * 0.75 + R.next() * 0.25, 0, 1)) * regionWage * locWage * scarcity * g.world.wageIdx / 10) * 10;
    const e = {
      id: U.uid('e'), name: S.name(), role, wage, quals: Math.round(quals * 100), skill,
      years: Math.round(quals * 15 + R.next() * 3),
      attitude: U.clamp(Math.round(R.normal(55 + quals * 10, 18)), 5, 99),
      reliability: U.clamp(Math.round(R.normal(60 + quals * 10, 16)), 5, 99),
      honesty: U.clamp(Math.round(R.normal(70, 18)), 5, 99),
      temper: U.clamp(Math.round(R.normal(35, 18)), 1, 99),
      ambition: U.clamp(Math.round(R.normal(45 + quals * 15, 20)), 1, 99),
      learning: R.chance(C.staff.learnNoResponse) ? R.range(0.05, 0.25) : R.range(0.6, 1.5),
      loyalty: Math.round(R.range(10, 40)),
      morale: Math.round(R.range(55, 75)), months: 0,
      revealed: { reliability: false, honesty: false, temper: false },
      skillSeen: U.clamp(skill + Math.round(R.normal(0, 9)), 1, 99),
    };
    if (rd.specialist) {
      e.trait = R.chance(C.traits.reckless) ? 'reckless' : R.chance(C.traits.cautious) ? 'cautious' : R.chance(C.traits.dishonest) ? 'dishonest' : 'steady';
      if (e.trait === 'dishonest') e.honesty = Math.min(e.honesty, 30);
    }
    if (role === 'ceo') e.profitShare = +(U.lerp(C.ceo.profitShare[0], C.ceo.profitShare[1], quals)).toFixed(3);
    return e;
  };

  S.poolFor = (g, b, role) => {
    b.pools = b.pools || {};
    const key = role;
    if (b.pools[key] && b.pools[key].month === g.month) return b.pools[key].list;
    const C = TG.CONFIG, rd = S.roleDef(b, role);
    let labor = b.labor == null ? 0.5 : b.labor;
    let n = R.int(C.staff.poolSize[0], C.staff.poolSize[1]);
    if (rd.licensed || role === 'lawyer' || role === 'ceo') n = Math.round(n * Math.pow(labor, 1.2) + (labor > 0.5 ? 1 : 0));
    else n = Math.max(1, Math.round(n * (0.4 + labor * 0.8)));
    if (role === 'driver' && g.world.driverShortage > 0) n = Math.max(0, Math.round(n * 0.4));
    const list = [];
    for (let i = 0; i < n; i++) list.push(S.candidate(g, b, role, labor));
    b.pools[key] = { month: g.month, list };
    return list;
  };

  S.allStaff = (b) => {
    const out = (b.staff || []).slice();
    for (const k in b.spec || {}) if (b.spec[k]) out.push(b.spec[k]);
    return out;
  };
  S.keyStaff = (b) => (b.staff || []).filter((e) => { const r = TG.CONFIG.businesses[b.type].roles[e.role]; return r && r.key; });

  S.hire = (g, b, cand, by) => {
    const pool = b.pools && b.pools[cand.role];
    if (pool) pool.list = pool.list.filter((c) => c.id !== cand.id);
    cand.hired = g.month; cand.months = 0;
    if (TG.CONFIG.specialists[cand.role]) { b.spec = b.spec || {}; if (b.spec[cand.role]) S.removeSpec(g, b, cand.role, 'replaced'); b.spec[cand.role] = cand; }
    else b.staff.push(cand);
    if (b.fixes && b.fixes.certified) cand.skill = Math.max(cand.skill, 45);
    TG.rep.staff(g, b, `${by ? by + ' hired' : 'Hired'} ${cand.name} as ${S.roleDef(b, cand.role).label} (${U.money(cand.wage)}/mo)`);
    return cand;
  };
  S.removeSpec = (g, b, role, why) => { const e = b.spec[role]; if (!e) return; b.spec[role] = null; TG.rep.staff(g, b, `${e.name} (${S.roleDef(b, role).label}) left: ${why}`); };

  S.fire = (g, b, empId, reason) => {
    const C = TG.CONFIG;
    let e = b.staff.find((x) => x.id === empId), spec = null;
    if (!e) for (const k in b.spec) if (b.spec[k] && b.spec[k].id === empId) { e = b.spec[k]; spec = k; }
    if (!e) return false;
    const sev = Math.round(e.wage * C.staff.severanceMonths);
    TG.F.spend(g, sev, 'Severance', b.id);
    if (spec) b.spec[spec] = null; else b.staff = b.staff.filter((x) => x.id !== empId);
    for (const o of S.allStaff(b)) o.morale = U.clamp(o.morale - 3, 0, 100);
    TG.rep.staff(g, b, `Let go ${e.name} (${reason || 'fired'}), severance ${U.money(sev)}`);
    if (!e.revealed.honesty || e.honesty > 40) {
      if (R.chance(C.staff.wrongfulFireChance)) TG.B.lawsuit(g, b, 'Wrongful termination claim by ' + e.name, Math.max(C.lawsuits.suitMin, e.wage * R.range(3, 10)), 'liability', 'Fired employee with no documented cause');
    }
    return true;
  };

  S.train = (g, b, empId, level) => {
    const C = TG.CONFIG, t = level === 'advanced' ? C.staff.trainAdvanced : C.staff.trainBasic;
    const e = S.allStaff(b).find((x) => x.id === empId); if (!e) return null;
    if (g.cash < t.cost) return null;
    TG.F.spend(g, t.cost, 'Training', b.id, true);
    const growth = (b.fixesOn && b.fixesOn.skillGrowth) || 1;
    const gain = Math.round(R.range(t.skill[0], t.skill[1]) * e.learning * growth);
    const att = Math.round(R.range(t.attitude[0], t.attitude[1]) * e.learning);
    e.skill = U.clamp(e.skill + gain, 1, 99); e.skillSeen = e.skill; e.attitude = U.clamp(e.attitude + att, 1, 99);
    e.morale = U.clamp(e.morale + 4, 0, 100);
    return { gain, att };
  };

  S.raise = (g, b, empId) => {
    const e = S.allStaff(b).find((x) => x.id === empId); if (!e) return;
    e.wage = Math.round(e.wage * (1 + TG.CONFIG.staff.raisePct)); e.morale = U.clamp(e.morale + TG.CONFIG.staff.raiseMorale, 0, 100); e.loyalty = U.clamp(e.loyalty + 5, 0, 100);
  };
  S.bonus = (g, b, empId) => {
    const e = S.allStaff(b).find((x) => x.id === empId); if (!e) return;
    TG.F.spend(g, Math.round(e.wage * 0.5), 'Bonuses', b.id); e.morale = U.clamp(e.morale + TG.CONFIG.staff.bonusMorale, 0, 100);
  };
  S.backgroundCheck = (g, b, cand) => {
    TG.F.spend(g, TG.CONFIG.staff.backgroundCheck, 'Background checks', b.id);
    cand.revealed.honesty = true; cand.revealed.temper = true; cand.revealed.reliability = true; cand.skillSeen = cand.skill;
  };
  // promote a regular employee to a specialist / manager role. Their manager skill can surprise you.
  S.promote = (g, b, empId, role) => {
    const e = b.staff.find((x) => x.id === empId); if (!e) return null;
    b.staff = b.staff.filter((x) => x.id !== empId);
    e.role = role; e.wage = Math.round(e.wage * 1.35);
    e.skill = U.clamp(Math.round(e.skill * 0.6 + R.normal(25, 15)), 5, 99); e.skillSeen = e.skill;
    e.trait = R.chance(0.12) ? 'reckless' : R.chance(0.15) ? 'cautious' : 'steady';
    e.morale = U.clamp(e.morale + 15, 0, 100); e.loyalty = U.clamp(e.loyalty + 15, 0, 100);
    b.spec = b.spec || {}; if (b.spec[role]) S.removeSpec(g, b, role, 'replaced by a promotion');
    b.spec[role] = e;
    TG.rep.staff(g, b, `Promoted ${e.name} to ${S.roleDef(b, role).label}`);
    return e;
  };

  // Monthly staff simulation for one business. ctx from business sim.
  S.month = (g, b, ctx) => {
    const C = TG.CONFIG, cs = C.staff;
    const all = S.allStaff(b);
    const hasHR = !!(b.spec && b.spec.hr), hasGM = !!(b.spec && b.spec.gm);
    const cams = !!(b.fixes && b.fixes.cameras);
    const fixMorale = (b.fixesOn && b.fixesOn.morale) || 0;
    const payrollAdd = (b.fixesOn && b.fixesOn.payrollAdd) || 0;
    for (const e of all) {
      e.months++;
      if (e.months >= 3) e.revealed.reliability = true;
      if (e.months >= 2) e.skillSeen = e.skill;
      // experience growth
      const growth = (b.fixesOn && b.fixesOn.skillGrowth) || 1;
      if (e.skill < 95 && R.chance(0.5)) e.skill = U.clamp(e.skill + (cs.expSkillPerYear / 6) * e.learning * growth * (e.skill > 80 ? 0.4 : 1), 1, 99);
      e.loyalty = U.clamp(e.loyalty + 0.6, 0, 100);
      // morale target
      const rd = S.roleDef(b, e.role) || { wage: [e.wage, e.wage] };
      const fair = U.lerp(rd.wage[0], rd.wage[1], e.skill / 100) * g.world.wageIdx;
      const payDelta = U.clamp((e.wage * (1 + payrollAdd) - fair) / fair, -0.5, 0.5);
      let target = 58 + payDelta * 60 + (hasHR ? 8 : 0) + (hasGM ? 4 : 0) + fixMorale - Math.max(0, (ctx.busy || 0) - 0.95) * 60;
      if (ctx.missedPayroll) target -= 30;
      if (b.ownerOp) target += 3;
      target = U.clamp(target, 0, 100);
      e.morale = U.clamp(e.morale + (target - e.morale) * cs.moraleDrift + R.normal(0, 2), 0, 100);
      if (ctx.missedPayroll) e.morale = U.clamp(e.morale + cs.missedPayrollMorale * 0.5, 0, 100);
    }
    // quitting
    for (const e of all.slice()) {
      const low = e.morale < 35 ? cs.quitLowMorale * (35 - e.morale) / 35 : 0;
      let p = (cs.quitBase + low) * (0.6 + e.ambition / 100) * (1.2 - e.loyalty / 125) * (hasHR ? 0.75 : 1);
      if (ctx.missedPayroll) p += 0.1;
      if (R.chance(p)) {
        S.leave(g, b, e, e.morale < 35 ? `low morale (${Math.round(e.morale)}/100)` : 'personal reasons / better offer', true);
        continue;
      }
      // poaching
      if (e.skill >= cs.poachSkill && R.chance(cs.poachBase * (1.3 - e.loyalty / 100))) {
        TG.D.add(g, { kind: 'poach', bizId: b.id, empId: e.id, title: `${e.name} is being poached`,
          text: `A competitor offered ${e.name} (${S.roleDef(b, e.role).label}, skill ${Math.round(e.skill)}) about ${Math.round(cs.counterOfferPct * 100)}% more pay.`,
          why: `High skill (${Math.round(e.skill)}) makes them a target; loyalty ${Math.round(e.loyalty)}/100.`,
          options: [{ id: 'counter', label: `Counter-offer (+${Math.round(cs.counterOfferPct * 100)}% pay)` }, { id: 'let', label: 'Let them go' }], def: 'let' });
      }
    }
    // theft
    for (const e of S.allStaff(b)) {
      if (e.honesty < 50) {
        const p = cs.theftBase * (1.6 - e.honesty / 100) * (cams ? 0.4 : 1) * (g.world.crime > 0 ? 1.4 : 1);
        if (R.chance(p)) {
          const amt = Math.round(R.range(200, 2500) * Math.max(1, Math.sqrt(ctx.revAvg / 20000)));
          TG.F.spend(g, amt, 'Theft losses', b.id);
          const catchP = (b.spec && b.spec.accountant ? 0.6 : 0.25) + (cams ? 0.25 : 0);
          if (R.chance(catchP)) {
            e.revealed.honesty = true;
            TG.rep.event(g, b, 'bad', `${e.name} was caught stealing (${U.money(amt)})`, `Honesty ${Math.round(e.honesty)}/100${cams ? '' : ', no cameras'}; theft chance ${U.pct(p, 1)}/mo`);
            TG.D.add(g, { kind: 'theft', bizId: b.id, empId: e.id, title: `${e.name} caught stealing`, text: `${U.money(amt)} went missing and the trail leads to ${e.name}.`, why: `Low honesty and ${cams ? 'cameras caught it' : 'no cameras'}.`, options: [{ id: 'fire', label: 'Fire them' }, { id: 'warn', label: 'Give a warning' }], def: 'warn' });
          } else TG.rep.event(g, b, 'bad', `Unexplained cash and stock shrinkage (${U.money(amt)})`, `Someone is stealing; ${b.spec && b.spec.accountant ? 'the accountant could not trace it' : 'no accountant to trace it'}${cams ? '' : ', no cameras'}`);
        }
      }
      // fights
      if (e.temper > 60 && R.chance(cs.fightBase * (e.temper / 60) * (1 + Math.max(0, (ctx.busy || 0) - 0.9) * 2) * (hasHR ? 0.5 : 1))) {
        e.revealed.temper = true;
        const repHit = R.range(1, 5);
        b.rep = U.clamp(b.rep - repHit, 0, 100);
        TG.rep.event(g, b, 'bad', `${e.name} got into a fight with ${R.chance(0.5) ? 'a coworker' : 'a customer'}`, `Hidden temper revealed (${Math.round(e.temper)}/100), workload ${U.pct(ctx.busy || 0)}${hasHR ? '' : ', no HR manager'}`);
        if (R.chance(0.15)) TG.B.lawsuit(g, b, 'Injury claim after a fight', Math.max(C.lawsuits.suitMin, ctx.revAvg * R.range(0.2, 1)), 'liability', `${e.name}'s temper`);
        for (const o of S.allStaff(b)) o.morale = U.clamp(o.morale - 2, 0, 100);
      }
      // dishonest managers skim
      if (e.trait === 'dishonest' && R.chance(C.decisions.skimChance * 4)) {
        const amt = Math.round(ctx.revAvg * R.range(0.01, 0.03));
        if (amt > 0) {
          TG.F.spend(g, amt, 'Theft losses', b.id);
          if (b.spec && b.spec.accountant && b.spec.accountant !== e && R.chance(0.4)) { e.revealed.honesty = true; TG.rep.event(g, b, 'bad', `Accountant caught ${e.name} skimming ${U.money(amt)}`, 'Dishonest manager trait'); }
        }
      }
    }
    // strikes at big businesses
    const n = b.staff.length;
    if (n >= cs.strikeMinStaff) {
      const avgM = U.avg(b.staff, (e) => e.morale, 60);
      if (avgM < 45) {
        const def = TG.CONFIG.businesses[b.type];
        const red = (def.fixes.find((f) => f.id === 'fairwages') && b.fixes.fairwages) ? 0.3 : 1;
        const p = cs.strikeBase * (45 - avgM) / 10 * red;
        if (R.chance(p)) {
          const d = R.range(0.4, 1);
          ctx.down = U.clamp((ctx.down || 0) + d, 0, 1);
          TG.rep.event(g, b, 'major', `Workers went on strike (${U.pct(d)} of the month lost)`, `Average morale ${Math.round(avgM)}/100 across ${n} staff; strike chance ${U.pct(p, 1)}`, { major: 'strike' });
        }
      }
    }
  };

  // someone leaves: if a key role, managers may replace later
  S.leave = (g, b, e, why, natural) => {
    let spec = null;
    for (const k in b.spec || {}) if (b.spec[k] && b.spec[k].id === e.id) spec = k;
    if (spec) b.spec[spec] = null; else b.staff = b.staff.filter((x) => x.id !== e.id);
    const label = S.roleDef(b, e.role).label;
    const isKey = spec === 'gm' || spec === 'ops' || (TG.CONFIG.businesses[b.type].roles[e.role] || {}).licensed || e.skill >= 70;
    TG.rep.event(g, b, isKey ? 'major' : 'bad', `${e.name} (${label}) quit`, `Why: ${why}. Morale ${Math.round(e.morale)}, loyalty ${Math.round(e.loyalty)}, ambition ${e.ambition > 60 ? 'high' : 'normal'}`, isKey ? { major: 'keyQuit' } : null);
    TG.rep.staff(g, b, `${e.name} (${label}) quit: ${why}`);
  };

  S.payroll = (b) => U.sum(S.allStaff(b), (e) => e.wage);
  TG.S = S;
})();

</script>
<script>/* js/equipment.js */
/* equipment.js - machines, vehicles: age, wear, quality tier, break odds, maintenance, repair/replace, leasing, resale. */
(function () {
  const TG = globalThis.TG; const R = TG.R, U = TG.U;
  const E = {};
  E.def = (b, typeId) => TG.CONFIG.businesses[b.type].equip.find((x) => x.id === typeId);
  E.price = (g, b, typeId, tier) => Math.round(E.def(b, typeId).price * TG.CONFIG.equipTiers[tier].price * g.world.priceIdx);

  E.create = (g, b, typeId, tier, opts) => {
    const C = TG.CONFIG, t = C.equipTiers[tier], d = E.def(b, typeId);
    const it = {
      id: U.uid('q'), type: typeId, tier, label: d.label,
      age: tier === 'used' ? R.int(t.age[0], t.age[1]) : 0,
      wear: R.range(t.wear[0], t.wear[1]),
      hidden: tier === 'used' ? R.range(C.equipment.usedHiddenWear[0], C.equipment.usedHiddenWear[1]) : 0,
      broken: null, maint: false, warranty: t.warranty, leased: !!(opts && opts.leased), paid: 0, n: 0,
    };
    it.paid = E.price(g, b, typeId, tier);
    if (it.leased) { it.leasePay = Math.round(it.paid * C.equipment.leaseMonthlyPct); it.maint = true; }
    return it;
  };

  // Buy (or lease) equipment for a business. Returns item or null if cannot afford.
  E.buy = (g, b, typeId, tier, opts) => {
    opts = opts || {};
    const price = E.price(g, b, typeId, tier);
    if (!opts.free && E.count(b, typeId) >= E.maxCount(b, typeId)) return null;
    if (!opts.leased && !opts.free && g.cash < price && !opts.allowDebt) return null;
    const it = E.create(g, b, typeId, tier, opts);
    if (opts.leased) TG.F.spend(g, it.leasePay, 'Equipment lease', b.id, true);
    else if (!opts.free) TG.F.spend(g, price, 'Equipment purchases', b.id, true);
    b.equip.push(it);
    return it;
  };

  E.effWear = (it) => U.clamp(it.wear + (it.hidden || 0), 0, 100);
  E.hasMech = (b) => !!(b.spec && b.spec.mechanic);
  E.mechCoverage = (b) => {
    if (!E.hasMech(b)) return 0;
    const m = b.spec.mechanic; const n = Math.max(1, b.equip.length);
    return U.clamp((TG.CONFIG.equipment.mechanicCovers * (0.6 + m.skill / 125)) / n, 0, 1);
  };

  // monthly break chance for an item; returns {p, factors[]}
  E.breakChance = (g, b, it) => {
    const C = TG.CONFIG, eq = C.equipment, d = E.def(b, it.type), t = C.equipTiers[it.tier];
    const f = eq.breakFormula;
    const ageF = 1 + (it.age / d.life) * f.ageWeight;
    const w = E.effWear(it) / 100;
    const wearF = f.wearBase + f.wearMult * w * w;
    const cov = E.mechCoverage(b);
    const mechF = 1 - (1 - eq.mechanicBreakMult) * cov * (0.6 + (b.spec && b.spec.mechanic ? b.spec.mechanic.skill : 0) / 250);
    const fixF = (b.fixesOn && b.fixesOn.equipBreak && b.fixesOn.equipBreak[it.type]) || 1;
    const paceF = b.pace === 'rush' ? 1.35 : b.pace === 'careful' ? 0.85 : 1;
    let advF = 1;
    if (t.advanced && !E.hasMech(b) && TG.CONFIG.businesses[b.type].tier !== 'small') advF = 1;
    const lineF = (it.type === 'line' && b.fixesOn && b.fixesOn.lineFailMult) || 1;
    const p = U.clamp(d.brk * t.brk * ageF * wearF * mechF * fixF * paceF * advF * lineF, 0, 0.9);
    const factors = [];
    factors.push(`${(it.age / 12).toFixed(1)} yrs old`);
    factors.push(`${Math.round(E.effWear(it))}% wear`);
    factors.push(`${t.label.toLowerCase()} quality`);
    factors.push(it.maint ? 'on maintenance plan' : 'no maintenance plan');
    if (cov > 0) factors.push('mechanic on staff'); else factors.push('no mechanic');
    if (b.pace === 'rush') factors.push('rushed pace');
    return { p, factors };
  };

  // output multiplier of a working item
  E.out = (it) => (it.broken ? 0 : TG.CONFIG.equipTiers[it.tier].out);

  // capacity of a pool: every item whose pool (default: its own id) matches adds its cap
  E.poolOf = (ed) => ed.pool || ed.id;
  E.capacity = (b, poolId) => U.sum(b.equip, (x) => { const ed = E.def(b, x.type); return ed && E.poolOf(ed) === poolId ? E.out(x) * (ed.cap || 0) : 0; });
  // critical capacity pools of a business: [{pool, primary (first item def), label}]
  E.pools = (b) => { const out = [], seen = {}; for (const ed of TG.CONFIG.businesses[b.type].equip) { if (!ed.critical) continue; const p = E.poolOf(ed); if (seen[p]) continue; seen[p] = 1; out.push({ pool: p, primary: TG.CONFIG.businesses[b.type].equip.find((x) => E.poolOf(x) === p && x.critical) }); } return out; };
  // a boost field (ticketBoost, staffBoost, demandBoost): one working item per type counts
  E.boost = (b, field) => { const seen = {}; let t = 0; for (const it of b.equip) { if (it.broken || seen[it.type]) continue; const ed = E.def(b, it.type); if (ed && ed[field]) { seen[it.type] = 1; t += ed[field]; } } return t; };
  E.sumField = (b, field) => U.sum(b.equip, (x) => { const ed = E.def(b, x.type); return ed && ed[field] && !x.broken ? ed[field] * (field === 'store' || field === 'storeTons' || field === 'storeUnits' || field === 'head' ? 1 : E.out(x)) : 0; });
  E.count = (b, typeId) => b.equip.filter((x) => x.type === typeId && x.broken !== 'destroyed').length;
  // most of an item you can own (seats limited by floor space; boosts are one-per-type but extras act as spares)
  E.maxCount = (b, typeId) => {
    const ed = E.def(b, typeId); if (!ed) return 0;
    if (ed.seat) { const s = TG.CONFIG.businesses[b.type].svc; return Math.max(1, Math.ceil(b.sqft * s.perSpace / ed.cap)); }
    if (ed.perTruck) return Math.max(1, E.count(b, 'truck'));
    if (ed.max) return ed.max;
    if (ed.ticketBoost || ed.staffBoost || ed.demandBoost) return 2;
    return 999;
  };

  E.resale = (g, b, it) => {
    const eq = TG.CONFIG.equipment;
    if (it.leased) return 0;
    const base = E.def(b, it.type).price * TG.CONFIG.equipTiers[it.tier].price * g.world.priceIdx;
    const v = base * eq.resaleBase * Math.exp(-eq.resaleAgeDecay * it.age) * (1 - eq.resaleWearWeight * E.effWear(it) / 100) * (it.broken === 'destroyed' ? 0.05 : it.broken ? 0.5 : 1);
    return Math.max(0, Math.round(v));
  };

  E.repairCost = (g, b, it) => {
    const eq = TG.CONFIG.equipment, d = E.def(b, it.type);
    let c = d.price * g.world.priceIdx * (it.broken === 'major' ? eq.repairPct.major : eq.repairPct.minor);
    if (E.hasMech(b)) c *= eq.mechanicRepairMult;
    if (TG.CONFIG.equipTiers[it.tier].advanced && !E.hasMech(b)) c *= eq.advancedNoMechRepairMult;
    if (d.efficiency) c *= 2;
    return Math.round(c);
  };

  E.repair = (g, b, itId, by) => {
    const it = b.equip.find((x) => x.id === itId); if (!it || !it.broken || it.broken === 'destroyed') return false;
    const cost = it.warranty > 0 || it.leased ? 0 : E.repairCost(g, b, it);
    TG.F.spend(g, cost, 'Repairs', b.id);
    it.broken = null; it.wear = U.clamp(it.wear - 15, 0, 100);
    TG.rep.decision(g, b, by, `Repaired ${it.label}${cost ? ' for ' + U.money(cost) : ' (covered)'}`);
    return true;
  };
  E.service = (g, b, itId) => {
    const it = b.equip.find((x) => x.id === itId); if (!it || it.broken) return false;
    const eq = TG.CONFIG.equipment; const cost = Math.round(E.def(b, it.type).price * eq.serviceCostPct * g.world.priceIdx);
    TG.F.spend(g, cost, 'Maintenance', b.id);
    it.wear = U.clamp(it.wear - eq.serviceWearCut, 0, 100); it.hidden = Math.max(0, (it.hidden || 0) - 10);
    return true;
  };
  E.inspect = (g, b, itId) => {
    const it = b.equip.find((x) => x.id === itId); if (!it) return;
    TG.F.spend(g, Math.round(E.def(b, it.type).price * TG.CONFIG.equipment.inspectCost * g.world.priceIdx), 'Inspections', b.id);
    it.wear = E.effWear(it); it.hidden = 0; it.inspected = true;
  };
  E.sell = (g, b, itId) => {
    const it = b.equip.find((x) => x.id === itId); if (!it) return 0;
    const v = E.resale(g, b, it);
    b.equip = b.equip.filter((x) => x.id !== itId);
    if (v) TG.F.earn(g, v, 'Asset sales', b.id, true);
    return v;
  };

  // Monthly wear, breakdowns, theft. Returns nothing; pushes events and decisions.
  E.month = (g, b, ctx) => {
    const C = TG.CONFIG, eq = C.equipment;
    const cov = E.mechCoverage(b);
    const wearFix = (b.fixesOn && b.fixesOn.wearMult) || 1;
    for (const it of b.equip.slice()) {
      if (it.broken === 'destroyed') continue;
      it.age++; if (it.warranty > 0) it.warranty--;
      const d = E.def(b, it.type);
      const use = it.broken ? 0.2 : (ctx.util == null ? 1 : 0.4 + 0.8 * U.clamp(ctx.util, 0, 1.2)) * (b.pace === 'rush' ? 1.3 : b.pace === 'careful' ? 0.85 : 1);
      let wg = eq.wearPerMonth * use * (it.maint ? eq.maintPlanWearMult : 1) * (1 - (1 - eq.mechanicWearMult) * cov) * wearFix * (120 / d.life);
      it.wear = U.clamp(it.wear + wg * R.range(0.6, 1.4), 0, 100);
      if (it.maint && !it.leased) TG.F.spend(g, Math.round(d.price * eq.maintPlanCostPct * g.world.priceIdx), 'Maintenance plans', b.id);
      if (it.leased) TG.F.spend(g, it.leasePay, 'Equipment lease', b.id);
      if (it.broken) continue;
      if (d.upkeep) TG.F.spend(g, Math.round(d.upkeep * g.world.priceIdx), 'Equipment upkeep', b.id);
      const bc = E.breakChance(g, b, it);
      it.lastP = bc.p;
      if (bc.p >= eq.warnAt && R.chance(0.6)) ctx.warnings.push({ text: `${it.label} #${E.num(b, it)} is making a strange noise`, why: `${U.pct(bc.p, 0)} monthly break chance: ${bc.factors.join(', ')}`, p: bc.p });
      if (R.chance(bc.p * (ctx.streakMult || 1))) E.breakItem(g, b, it, bc, ctx);
      // theft / vandalism for vehicles and sites without security
      if ((d.id === 'truck' || d.id === 'mower' || d.id === 'trailer' || d.heavy) && R.chance(eq.theftBase * (C.locations[b.loc] ? C.locations[b.loc].crime : 1) * (g.world.crime > 0 ? 2 : 1) * (b.fixes.gps ? 0.3 : 1))) {
        it.broken = 'major';
        TG.rep.event(g, b, 'bad', `${it.label} #${E.num(b, it)} was vandalized`, `Location crime level and ${b.fixes.gps ? 'tracking helped little' : 'no security or tracking'}`);
        E.queueBroken(g, b, it);
      }
    }
  };
  E.num = (b, it) => b.equip.filter((x) => x.type === it.type).indexOf(it) + 1;

  E.breakItem = (g, b, it, bc, ctx) => {
    const C = TG.CONFIG, eq = C.equipment, d = E.def(b, it.type);
    const w = E.effWear(it) / 100;
    const sev = R.weighted({ minor: eq.severity.minor * (1.2 - w), major: eq.severity.major, catastrophic: eq.severity.catastrophic * (0.4 + w * 1.6) });
    const why = `${it.label} #${E.num(b, it)}: ${bc.factors.join(', ')}; ${U.pct(bc.p, 1)} monthly break chance`;
    if (it.inspected === undefined && it.hidden > 5) it.hidden = 0; // problems surface
    if (sev === 'minor') {
      const cost = it.warranty > 0 || it.leased ? 0 : Math.round(E.repairCost(g, b, Object.assign({}, it, { broken: 'minor' })));
      TG.F.spend(g, cost, 'Repairs', b.id);
      ctx.down = U.clamp((ctx.down || 0) + (d.critical ? eq.minorDowntime / Math.max(1, b.equip.filter((x) => x.type === it.type).length) : 0.02), 0, 1);
      TG.rep.event(g, b, 'bad', `${it.label} #${E.num(b, it)} had a minor breakdown (slow day, ${U.money(cost)} fix)`, why);
      it.wear = U.clamp(it.wear + 3, 0, 100);
      return;
    }
    if (sev === 'major') {
      it.broken = 'major';
      if (d.breakRevLoss) TG.F.spend(g, Math.round(ctx.revAvg * d.breakRevLoss), 'Spoiled stock', b.id);
      TG.rep.event(g, b, d.critical || d.harvestCritical ? 'major' : 'bad', `${it.label} #${E.num(b, it)} broke down`, why, d.critical ? { major: 'breakdown' } : null);
      E.queueBroken(g, b, it);
      return;
    }
    it.broken = 'destroyed';
    let loss = 0;
    if (!it.leased) {
      loss = E.resale(g, b, Object.assign({}, it, { broken: null }));
      const cov = TG.F.claim(g, b, 'equipment', loss, `${it.label} destroyed`);
      if (cov) loss -= cov;
    }
    TG.rep.event(g, b, 'major', `${it.label} #${E.num(b, it)} was destroyed in a catastrophic failure`, why, { major: 'breakdown' });
    if (d.injuryOnCat && R.chance(d.injuryOnCat)) TG.B.lawsuit(g, b, `Injury from ${it.label} failure`, Math.max(C.lawsuits.suitMin, ctx.revAvg * R.range(0.5, 2)), 'liability', why);
    E.queueBroken(g, b, it);
  };

  E.queueBroken = (g, b, it) => {
    const d = E.def(b, it.type);
    const destroyed = it.broken === 'destroyed';
    const opts = [];
    if (!destroyed) opts.push({ id: 'repair', label: `Repair (${it.warranty > 0 || it.leased ? 'covered' : U.money(E.repairCost(g, b, it))})` });
    for (const tier of ['used', 'budget', 'standard', 'premium']) opts.push({ id: 'replace_' + tier, label: `Replace with ${TG.CONFIG.equipTiers[tier].label.toLowerCase()} (${U.money(E.price(g, b, it.type, tier))})` });
    opts.push({ id: 'leave', label: destroyed ? 'Scrap it, no replacement' : 'Leave it broken' });
    TG.D.add(g, { kind: 'broken', bizId: b.id, itemId: it.id, title: `${d.label} ${destroyed ? 'destroyed' : 'broken'}`,
      text: `${it.label} #${E.num(b, it)} (${TG.CONFIG.equipTiers[it.tier].label}, ${(it.age / 12).toFixed(1)} yrs, ${Math.round(E.effWear(it))}% wear) is out of action.${d.critical ? ' It is critical: capacity drops until it is fixed.' : ''}`,
      why: `Break chance was ${U.pct(it.lastP || 0, 1)} per month.`, options: opts, def: 'leave' });
  };

  // replace a broken/destroyed item (or add new)
  E.replace = (g, b, itId, tier, by) => {
    const it = b.equip.find((x) => x.id === itId);
    const typeId = it ? it.type : null; if (!typeId) return false;
    const price = E.price(g, b, typeId, tier);
    if (g.cash < price) { TG.rep.decision(g, b, by, `Could not afford a replacement ${it.label} (${U.money(price)})`, 'bad'); return false; }
    const sold = E.resale(g, b, it);
    b.equip = b.equip.filter((x) => x.id !== itId);
    if (sold) TG.F.earn(g, sold, 'Asset sales', b.id, true);
    const n = E.buy(g, b, typeId, tier);
    if (n) n.maint = !!(it.maint);
    TG.rep.decision(g, b, by, `Replaced ${it.label} with a ${TG.CONFIG.equipTiers[tier].label.toLowerCase()} one (${U.money(price)})`);
    return true;
  };

  E.avgWear = (b, filter) => { const l = b.equip.filter((x) => !filter || filter(x)); return l.length ? U.avg(l, E.effWear) : 0; };
  E.value = (g, b) => U.sum(b.equip, (x) => E.resale(g, b, x));
  TG.E = E;
})();

</script>
<script>/* js/finance.js */
/* finance.js - cash flow, loans, credit line, credit score, taxes, insurance, investors, valuation, bankruptcy. */
(function () {
  const TG = globalThis.TG; const R = TG.R, U = TG.U;
  const F = {};
  const acc = (g) => (g.acc = g.acc || F.newAcc());
  F.newAcc = () => ({ inc: {}, exp: {}, capIn: {}, capOut: {} });

  F.earn = (g, amt, label, bizId, capital) => {
    amt = U.num(amt); if (!amt) return;
    g.cash += amt; const a = acc(g);
    const bucket = capital ? a.capIn : a.inc; bucket[label] = (bucket[label] || 0) + amt;
    if (bizId && !capital) { const b = g.businesses.find((x) => x.id === bizId); if (b && b.m) { b.m.rev += amt; b.m.lines[label] = (b.m.lines[label] || 0) + amt; } }
  };
  F.spend = (g, amt, label, bizId, capital) => {
    amt = U.num(amt); if (!amt) return;
    g.cash -= amt; const a = acc(g);
    const bucket = capital ? a.capOut : a.exp; bucket[label] = (bucket[label] || 0) + amt;
    if (bizId && !capital) { const b = g.businesses.find((x) => x.id === bizId); if (b && b.m) { b.m.cost += amt; b.m.lines[label] = (b.m.lines[label] || 0) - amt; } }
  };

  // accounting-only expense (e.g. cost of goods sold for stock that was paid for when ordered): hits profit, not cash
  F.book = (g, amt, label, bizId) => {
    amt = U.num(amt); if (!amt) return;
    const a = acc(g); a.exp[label] = (a.exp[label] || 0) + amt; a.capIn[label + ' (non-cash)'] = (a.capIn[label + ' (non-cash)'] || 0) + amt;
    if (bizId) { const b = g.businesses.find((x) => x.id === bizId); if (b && b.m) { b.m.cost += amt; b.m.lines[label] = (b.m.lines[label] || 0) - amt; } }
  };
  // ---------- rates & credit ----------
  F.rateFor = (g, type) => {
    const C = TG.CONFIG.finance;
    const spread = type === 'loc' ? C.loc.spread : C.loans[type].spread;
    return U.clamp(g.world.baseRate + spread + Math.max(0, 800 - g.player.credit) * C.creditSpreadPerPoint, 0.01, 0.45);
  };
  F.payment = (P, rate, n) => { const r = rate / 12; return r === 0 ? P / n : (P * r) / (1 - Math.pow(1 + r, -n)); };
  F.assets = (g) => Math.max(0, F.netWorth(g, true).assets);

  F.maxLoan = (g, type) => {
    const C = TG.CONFIG.finance, L = C.loans[type];
    const nw = F.netWorth(g);
    const cf = U.clamp((g.player.credit - 500) / 300, 0.1, 1.2);
    if (type === 'business') return Math.max(0, Math.round((L.maxBase + L.maxNW * Math.max(0, nw) + 4 * Math.max(0, F.avgProfit(g))) * cf));
    if (type === 'emergency') return Math.round(L.maxBase + L.maxAssets * F.assets(g));
    return Infinity;
  };
  F.canBorrow = (g, type, amount) => {
    const C = TG.CONFIG.finance, L = C.loans[type];
    if (type !== 'emergency' && g.player.noLoanUntil > g.month) return { ok: false, msg: 'Lenders refuse: recent bankruptcy.' };
    if (g.player.credit < L.minCredit) return { ok: false, msg: `Credit score too low (need ${L.minCredit}).` };
    const max = F.maxLoan(g, type);
    if (amount > max) return { ok: false, msg: `Lender caps this loan at ${U.money(max)}.` };
    const pay = F.payment(amount, F.rateFor(g, type), L.term);
    const income = Math.max(0, F.avgProfit(g)) + F.totalPayments(g);
    if (type === 'business' && F.totalPayments(g) + pay > Math.max(4000, income * 0.9 + F.netWorth(g) * 0.02)) return { ok: false, msg: 'Debt payments would be too high for your income.' };
    return { ok: true, pay };
  };
  F.newLoan = (g, type, amount, opts) => {
    opts = opts || {};
    const L = TG.CONFIG.finance.loans[type];
    const rate = F.rateFor(g, type);
    const term = opts.term || L.term;
    const loan = { id: U.uid('l'), type, label: opts.label || L.label, principal: Math.round(amount), balance: Math.round(amount), rate, term, left: term,
      payment: Math.round(F.payment(amount, rate, term)), missed: 0, collateral: opts.collateral || null, bizId: opts.bizId || null, start: g.month };
    g.loans.push(loan);
    if (!opts.noCash) F.earn(g, amount, 'Loan proceeds', null, true);
    return loan;
  };
  F.takeLoan = (g, type, amount, opts) => {
    amount = Math.round(amount);
    if (!(amount > 0)) return { ok: false, msg: 'Enter an amount.' };
    const ok = F.canBorrow(g, type, amount); if (!ok.ok) return ok;
    return { ok: true, loan: F.newLoan(g, type, amount, opts) };
  };
  F.payoff = (g, loanId, fromSale) => {
    const l = g.loans.find((x) => x.id === loanId); if (!l) return;
    F.spend(g, l.balance, 'Loan payoff', null, true);
    g.loans = g.loans.filter((x) => x !== l);
  };
  F.prepay = (g, loanId, amt) => {
    const l = g.loans.find((x) => x.id === loanId); if (!l) return;
    amt = Math.min(Math.round(amt), l.balance, Math.max(0, g.cash)); if (amt <= 0) return;
    F.spend(g, amt, 'Loan prepayment', null, true); l.balance -= amt;
    if (l.balance <= 1) g.loans = g.loans.filter((x) => x !== l);
    else { l.payment = Math.round(F.payment(l.balance, l.rate, Math.max(1, l.left))); }
  };
  F.totalPayments = (g) => U.sum(g.loans, (l) => l.payment) + (g.loc ? Math.round(g.loc.balance * TG.CONFIG.finance.loc.minPayPct) : 0);
  F.debt = (g) => U.sum(g.loans, (l) => l.balance) + (g.loc ? g.loc.balance : 0) + (g.invest ? g.invest.marginDebt : 0);
  F.avgProfit = (g) => { const h = g.history.slice(-6); return h.length ? U.avg(h, (x) => x.profit) : 0; };

  F.locLimit = (g) => {
    const C = TG.CONFIG.finance.loc;
    if (g.player.credit < C.minCredit || g.player.noLoanUntil > g.month) return 0;
    const cf = U.clamp((g.player.credit - 600) / 200, 0.2, 1.3);
    return Math.round((C.limitBase + C.limitNW * Math.max(0, F.netWorth(g))) * cf / 1000) * 1000;
  };
  F.locDraw = (g, amt, by) => {
    const lim = F.locLimit(g); amt = Math.min(Math.round(amt), lim - g.loc.balance);
    if (amt <= 0) return 0;
    g.loc.balance += amt; F.earn(g, amt, 'Credit line draw', null, true);
    return amt;
  };
  F.locRepay = (g, amt) => { amt = Math.min(Math.round(amt), g.loc.balance, Math.max(0, g.cash)); if (amt <= 0) return 0; g.loc.balance -= amt; F.spend(g, amt, 'Credit line repayment', null, true); return amt; };

  // ---------- monthly debt service ----------
  F.monthLoans = (g) => {
    const C = TG.CONFIG.finance;
    for (const l of g.loans.slice()) {
      const interest = l.balance * l.rate / 12;
      const pay = Math.min(l.payment, l.balance + interest);
      if (g.cash >= pay || F.autoCredit(g, pay - g.cash)) {
        F.spend(g, Math.round(interest), 'Loan interest');
        F.spend(g, Math.round(pay - interest), 'Loan principal', null, true);
        l.balance = Math.max(0, l.balance - (pay - interest)); l.left--; l.missed = 0;
        g.player.credit = Math.min(C.creditMax, g.player.credit + C.onTimeCredit);
