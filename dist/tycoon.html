    if (to === 'free') return { cost: 0, months: 0, why: 'Leaving land empty is free and instant.' };
    const ad = FD().areas[to]; const per = to === 'orchard' ? ent('orchard').establishPerAcre : ad.convCost;
    return { cost: Math.round(acres * per * g.world.priceIdx * (b.fixes.integrate && to === 'orchard' ? 0.8 : 1)), months: ad.convMonths, per: per * g.world.priceIdx, why: `${ad.convWhy}: ${U.money(per * g.world.priceIdx)} an acre, ready in ${ad.convMonths} month${ad.convMonths > 1 ? 's' : ''}` };
  };
  M.farmMove = (g, b, from, to, acres) => {
    const f = M.farmEnsure(b); acres = Math.round(acres);
    if (!(acres > 0)) return { ok: false, msg: 'Pick how many acres.' };
    if (from === to) return { ok: false, msg: 'Pick two different places.' };
    const have = from === 'free' ? M.farmFree(f) : f.areas[from].acres;
    if (acres > have) return { ok: false, msg: `Only ${Math.round(have)} acres there.` };
    const c = M.farmMoveCost(g, b, to, acres);
    if (g.cash < c.cost) return { ok: false, msg: `Costs ${U.money(c.cost)}.` };
    // take the acres out of where they were
    let soil = f.freeSoil;
    if (from !== 'free') {
      const a = f.areas[from]; soil = a.soil; const keep = (a.acres - acres) / a.acres;
      if (from === 'crops') { a.planted *= keep; a.toHarvest *= keep; }
      a.acres -= acres;
      if (from === 'cows' && a.herd > M.farmHeadCap(b) * 1.05) TG.rep.event(g, b, 'bad', 'Less grass than cows now', `${Math.round(a.herd)} cows, room for ${M.farmHeadCap(b)}: sell some or they eat expensive feed`);
    } else { /* free soil stays as it was */ }
    if (c.cost) TG.F.spend(g, c.cost, 'Land conversion', b.id, true);
    if (to === 'free') { const fr = M.farmFree(f) - acres; f.freeSoil = (f.freeSoil * Math.max(0, fr) + soil * acres) / Math.max(1, fr + acres); }
    else f.moving.push({ to, acres, soil, ready: g.month + c.months, cost: c.cost });
    return { ok: true, cost: c.cost, months: c.months };
  };
  // spray pesticide & fertilizer on one area: soil goes up (less when it is already high). Once a month per area.
  M.farmTreatCost = (g, b, k, waste) => Math.round(b.farm.areas[k].acres * FD().areas[k].treat * g.world.priceIdx * (b.fixes.integrate ? 0.8 : 1) * (waste || 1));
  M.farmTreat = (g, b, k, by, waste) => {
    const f = M.farmEnsure(b), a = f.areas[k]; if (k === 'cows') return { ok: false, msg: 'Cows need feed, not spray.' }; if (!a || !a.acres) return { ok: false, msg: 'No acres in that area.' };
    if (TG.USES.used(a, 'treat', g.month)) return { ok: false, again: true, msg: 'Already sprayed this month. Spraying again does nothing.' };
    const cost = M.farmTreatCost(g, b, k, waste); if (g.cash < cost) return { ok: false, msg: `Costs ${U.money(cost)}.` };
    TG.USES.take(a, 'treat', g.month);
    TG.F.spend(g, cost, 'Spray & fertilizer', b.id, by === 'You');
    const from = a.soil; a.soil = Math.min(1, a.soil + M.soilAdd(a.soil));
    return { ok: true, cost, from, to: a.soil };
  };
  M.farmSetAsk = (b, k, step) => { const a = b.farm.areas[k]; if (step == null) a.askR = null; else a.askR = U.clamp(Math.round(((a.askR == null ? 1 : a.askR) + step) * 100) / 100, 0.5, 2); return a.askR; };
  M.farmStorage = (g, b, tons) => {
    const cost = Math.round(tons * 20 * g.world.priceIdx); if (g.cash < cost) return { ok: false, msg: `Costs ${U.money(cost)}.` };
    TG.F.spend(g, cost, 'Storage construction', b.id, true); b.farm.storageCap += Math.round(tons); return { ok: true, cost };
  };
  M.farmExpected = (b, k) => { const a = b.farm.areas[k], e = ent(k); return (k === 'crops' ? a.acres : a.acres * U.clamp(a.age / e.rampMonths, 0, 1)) * e.yield; };
  M.farmFutures = (g, b, k, qty) => {
    const f = M.farmEnsure(b), fd = FD(); if (k !== 'crops' && k !== 'orchard') return { ok: false, msg: 'Price locks are for grain and fruit.' };
    const good = GOOD[k]; const locked = U.sum(f.futures.filter((x) => (x.mk || 'grain') === good), (x) => x.qty);
    qty = Math.min(Math.round(qty), Math.round(M.farmExpected(b, k) * fd.futuresMax - locked)); if (qty <= 0) return { ok: false, msg: `You can lock at most ${U.pct(fd.futuresMax)} of the expected harvest.` };
    const price = TG.W.price(g, good, 0) * fd.futuresDiscount;
    f.futures.push({ mk: good, qty, price, done: 0, month: g.month });
    return { ok: true, qty, price };
  };
  M.farmBuySeeds = (g, b, acres) => { M.farmEnsure(b); const n = M.models.farm.buySeeds(g, b, acres, 0); return n > 0 ? { ok: true, acres: n } : { ok: false, msg: M.farmStoreFree(b) < 1 ? 'Storage is full.' : 'Not enough cash.' }; };
  M.farmSellSeeds = (g, b, acres) => { const f = M.farmEnsure(b); acres = Math.min(Math.round(acres), Math.floor(f.seeds || 0)); if (acres <= 0) return { ok: false, msg: 'No seed.' }; const v = Math.round(acres * M.models.farm.seedCost(g, b) * 0.5); f.seeds -= acres; TG.F.earn(g, v, 'Asset sales', b.id, true); return { ok: true, rev: v }; };
  M.farmSetupExtra = (g, prop, entK) => {
    const fd = FD(); let c = 0;
    if (entK === 'orchard' && !prop.orchard) c += fd.enterprises.orchard.establishPerAcre * prop.acres * g.world.priceIdx;
    const share = entK === 'cows' || entK === 'cattle' || entK === 'dairy' ? 1 : entK === 'mixed' ? 0.5 : 0;
    if (share) { const n = Math.round(M.farmHerdCap({ acres: prop.acres * share }) * (fd.herdStart || 0.5)); c += n * TG.W.price(g, 'beef', 0) * 0.85 + n * 0.45 * 2 * M.feedPrice(g); }
    if (entK === 'mixed') c += prop.acres * 0.5 * fd.areas.crops.convCost * g.world.priceIdx * 0.5;
    const cropShare = entK === 'crops' ? 1 : entK === 'mixed' ? 0.5 : 0; c += cropShare * prop.acres * fd.enterprises.crops.seedPerAcre * g.world.priceIdx;
    return c;
  };
})();

</script>
<script>/* js/herd.js */
/* herd.js - v6 cows. One herd gives milk AND meat:
   calf -> heifer (no milk) -> milking cow -> dry/old cow -> sell;  calf -> steer -> market-ready -> sell.
   Cows eat grass from the cow area and FEED from storage (you buy it, a manager can keep it topped up).
   No feed = health drops, less milk, more sickness and deaths. Calves come from bulls + cows: small herds breed faster per cow,
   full pasture or hunger stops breeding. */
(function () {
  const TG = globalThis.TG; const R = TG.R, U = TG.U; const M = TG.M;
  const HC = () => TG.CONFIG.cows; const FD = () => TG.CONFIG.businesses.farm.farm;
  const ST = ['calf', 'heifer', 'steer', 'ready', 'milker', 'dry', 'bull'];
  M.cowStages = ST;
  const blank = () => ({ calf: 0, heifer: 0, steer: 0, ready: 0, milker: 0, dry: 0, bull: 0 });
  const E = () => FD().enterprises.cows;
  M.herdSync = (a) => { if (!a.st) a.st = blank(); for (const k of ST) a.st[k] = Math.max(0, a.st[k] || 0); a.herd = U.sum(ST, (k) => a.st[k]); return a.herd; };
  M.herdInit = (a, total) => { // a balanced starter herd
    total = Math.max(0, Math.round(total)); const bull = total > 0 ? Math.max(1, Math.round(total / 40)) : 0; const t = Math.max(0, total - bull);
    a.st = { calf: t * 0.16, heifer: t * 0.12, steer: t * 0.1, ready: t * 0.04, milker: t * 0.48, dry: t * 0.1, bull };
    if (a.health == null) a.health = 0.9; M.herdSync(a);
  };
  M.pastureCap = (b, a) => Math.round((a || b.farm.areas.cows).acres * E().headPerAcre);
  M.farmHeadCap = (b) => M.pastureCap(b) + Math.round(TG.E.sumField(b, 'head'));
  M.farmHerdCap = (prop) => Math.round(prop.acres * E().headPerAcre);
  M.breeders = (a) => a.st.milker + 0.3 * a.st.dry;
  M.breedRate = (n) => HC().breed.base * 2 / (1 + n / HC().breed.half); // per breeding cow per month
  // grass this month (tons) and what the herd needs
  M.grass = (g, b, w, moyOverride) => {
    const c = HC(), a = b.farm.areas.cows; const moy = moyOverride || U.moy(g.month);
    const wf = w && w.kind && c.grassWeather[w.kind] ? c.grassWeather[w.kind] : 1;
    return a.acres * E().headPerAcre * c.grassPerHead * c.grassSeason[moy] * wf * (0.7 + 0.3 * (b.farm.rain || 0.6));
  };
  M.feedNeed = (a) => U.sum(ST, (k) => (a.st[k] || 0) * HC().stages[k].feed);
  M.feedPrice = (g) => HC().feedPrice * g.world.priceIdx * (TG.IN ? TG.IN.cost(g, 'farming') : 1);
  M.feedMonths = (g, b) => { const a = b.farm.areas.cows; const need = Math.max(0, M.feedNeed(a) - M.grass(g, b, null, U.moy(g.month + 1))); return need > 0.1 ? (b.farm.feed || 0) / need : 99; };
  M.farmBuyFeed = (g, b, tons, by, premium) => {
    const f = M.farmEnsure(b); tons = Math.floor(Math.max(0, tons));
    tons = Math.min(tons, Math.floor(M.farmStoreFree(b) / HC().feedTonsCap));
    const per = M.feedPrice(g) * (1 + (premium || 0)) * (b.fixes.integrate ? 0.85 : 1); tons = Math.min(tons, Math.floor(Math.max(0, g.cash) / per));
    if (tons <= 0) return { ok: false, msg: M.farmStoreFree(b) < 1 ? 'Storage is full: build more storage.' : 'Not enough cash.' };
    TG.F.spend(g, Math.round(tons * per), 'Feed & hay', b.id); f.feed = (f.feed || 0) + tons; f.m.feedIn = (f.m.feedIn || 0) + tons;
    return { ok: true, tons, cost: Math.round(tons * per) };
  };
  M.cowValue = (g, k) => TG.W.price(g, 'beef', 0) * HC().stages[k].value;
  M.cowPrice = (g, b, k) => M.cowValue(g, k || 'milker') * HC().buyMarkup;
  M.farmBuyCattle = (g, b, head, k) => {
    const a = M.farmEnsure(b).areas.cows; k = k || 'milker'; head = Math.round(head); if (!(head > 0)) return { ok: false, msg: 'Pick how many.' };
    if (!a.acres) return { ok: false, msg: 'Give some acres to the cow area first.' };
    if (!HC().stages[k]) return { ok: false };
    const cost = Math.round(head * M.cowPrice(g, b, k));
    if (g.cash < cost) return { ok: false, msg: `Costs ${U.money(cost)}.` }; TG.F.spend(g, cost, 'Livestock purchases', b.id, true);
    M.herdSync(a); a.st[k] += head; M.herdSync(a); return { ok: true, cost };
  };
  // sell for meat: buyers pay the beef price x the stage value (big sales push the price down a little)
  M.farmSellCattle = (g, b, head, k) => {
    const a = M.farmEnsure(b).areas.cows; M.herdSync(a); k = k === 'cows' ? 'dry' : (k || 'ready');
    head = Math.min(Math.max(0, Math.round(head)), Math.floor(a.st[k] || 0));
    if (!head) return { ok: false, msg: `No ${HC().stages[k].label.toLowerCase()} to sell.` };
    const rev = Math.round(head * TG.W.price(g, 'beef', head / 2) * HC().stages[k].value * HC().sellDrop * M.plantMult(b, 'cows'));
    a.st[k] -= head; TG.F.earn(g, rev, 'Cattle sales', b.id); TG.W.sell(g, 'beef', head * HC().stages[k].value);
    a.m.soldHead = (a.m.soldHead || 0) + head; a.m.meatRev = (a.m.meatRev || 0) + rev; M.herdSync(a);
    return { ok: true, rev, head };
  };
  M.sickOdds = (g, b, w) => {
    const f = b.farm, a = f.areas.cows; if (!a.herd) return { p: 0, why: '' };
    const over = a.herd / Math.max(1, M.farmHeadCap(b)); const hp = a.health == null ? 0.9 : a.health; const bl = TG.B.backlogMult(b);
    const p = U.clamp(E().diseaseBase * (1 + 3 * Math.max(0, over - 1)) * (1 + HC().hunger.sickK * (1 - hp)) * (b.spec.ops ? 0.6 : 1) * bl, 0, 0.9);
    return { p, why: `herd at ${U.pct(over)} of room, health ${U.pct(hp)}${hp < 0.8 ? ' (hungry cows get sick more)' : ''}${b.spec.ops ? ', ops manager helps' : ''}${bl > 1.05 ? `, unfinished work x${bl.toFixed(2)}` : ''}` };
  };
  M.herdForecast = (g, b) => {
    const a = b.farm.areas.cows, c = HC(); M.herdSync(a);
    const room = a.herd / Math.max(1, M.farmHeadCap(b)); const bullF = M.bullF(a);
    const births = M.breeders(a) * M.breedRate(a.herd) * bullF * M.roomF(room) * Math.pow(Math.min(1, M.feedMonths(g, b) > 1 ? 1 : 0.6), 2) * (a.health || 0.9);
    const deaths = U.sum(ST, (k) => a.st[k] * c.stages[k].death);
    const need = M.feedNeed(a), grass = M.grass(g, b, null, U.moy(g.month + 1));
    return { births, deaths, culls: 0, matured: a.st.steer * c.grow.steer, ready: a.st.ready + a.st.steer * c.grow.steer, need, grass, buy: Math.max(0, need - grass), feed: Math.max(0, need - grass) * M.feedPrice(g), months: M.feedMonths(g, b) };
  };
  M.bullF = (a) => { const br = M.breeders(a); if (br < 0.5) return 0; return a.st.bull >= 0.5 ? Math.min(1, a.st.bull * HC().breed.bullPer / br) : HC().breed.noBull; };
  M.roomF = (room) => U.clamp((1 - room) / (1 - HC().breed.roomFull), 0, 1); // full rate up to 85% of room, none when full

  M.models.farm.feedCost = (g, b) => M.herdForecast(g, b).feed;
  M.models.farm.herdMonth = function (g, b, ctx, cov, q) {
    const f = b.farm, a = f.areas.cows, c = HC(), m = a.m; M.herdSync(a);
    if (a.health == null) a.health = 0.9;
    if (!a.herd) { m.feedEaten = 0; return; }
    const cap = M.farmHeadCap(b), room = a.herd / Math.max(1, cap);
    // 1) eat: grass first, then feed from storage
    const need = M.feedNeed(a) * (1 + Math.max(0, room - 1)), grass = Math.min(need, M.grass(g, b, ctx.weather));
    const fromStore = Math.min(f.feed || 0, need - grass); f.feed = (f.feed || 0) - fromStore;
    const fed = need > 0 ? (grass + fromStore) / need : 1; m.grass = grass; m.feedEaten = fromStore; m.fed = fed;
    const work = 0.6 + 0.4 * cov.hcov; // farmhands do the feeding and care
    a.health = U.clamp(fed >= 0.99 ? a.health + c.hunger.healthGain * work : a.health - c.hunger.healthDrop * (1 - fed), 0.2, 1);
    if (fed < 0.99) TG.rep.event(g, b, fed < 0.7 ? 'major' : 'bad', `Cows went hungry: only ${U.pct(fed)} of the food they needed`, `Grass gave ${Math.round(grass)} t, storage had ${Math.round(fromStore)} t of ${Math.round(need - grass)} t needed. Health now ${U.pct(a.health)}: less milk, more sickness and deaths. Buy feed (Cows) ${TG.D.handler(g, b, 'farm') ? '' : '- no manager, you must do this yourself'}.`, fed < 0.7 ? { major: 'harvest' } : null);
    // 2) deaths (more when hungry or crowded or short of farmhands)
    const stress = (1 - a.health) * c.hunger.deathK + Math.max(0, room - 1) * 0.02 + (1 - cov.hcov) * 0.01;
    let died = 0; for (const k of ST) { const d = a.st[k] * (c.stages[k].death + stress); a.st[k] -= d; died += d; }
    const sk = M.sickOdds(g, b, ctx.weather);
    if (R.chance(sk.p)) { const x = R.range(0.05, 0.2); let lost = 0; for (const k of ST) { lost += a.st[k] * x; a.st[k] *= 1 - x; } died += lost; TG.rep.event(g, b, 'major', `Sick cows: lost ${Math.round(lost)} head`, `${U.pct(sk.p, 1)} odds this month: ${sk.why}`, { major: 'harvest' }); }
    m.died = died;
    // 3) growing up
    const G = c.grow; const cg = a.st.calf * G.calf, hg = a.st.heifer * G.heifer, sg = a.st.steer * G.steer, md = a.st.milker * G.milkerDry;
    a.st.calf -= cg; a.st.heifer += cg / 2 - hg; a.st.steer += cg / 2 - sg; a.st.milker += hg - md; a.st.ready += sg; a.st.dry += md;
    m.newMilkers = hg; m.newReady = sg; m.newDry = md;
    // 4) calves: bulls + cows; small herds faster per cow; stops near full room; hunger and poor health cut it
    M.herdSync(a);
    const births = M.breeders(a) * M.breedRate(a.herd) * M.bullF(a) * M.roomF(room) * fed * fed * a.health * work;
    a.st.calf += births; m.born = births;
    // 5) milk: milking cows that fit in the parlors, every day (collected and sold for you at your milk price)
    const milked = Math.min(a.st.milker, M.farmParlorCap(b));
    const milk = milked * E().milkPerCow * (0.4 + 0.6 * a.health) * Math.min(1, 0.5 + 0.5 * fed) * work * q;
    m.milk = milk; m.notMilked = Math.max(0, a.st.milker - milked);
    if (milk > 0) { const o = this.offer(g, b, 'cows', milk, 'Milk sales'); m.lost = (m.lost || 0) + o.unsold; TG.M.logVolX(g, f, o.sold); }
    // 6) manager orders: sell market-ready, cull dry cows, keep within room, keep feed topped up
    TG.D.farmCowOrders(g, b);
    M.herdSync(a);
  };
  M.models.farm.inventoryHerd = (g, b) => { const a = b.farm.areas.cows; if (!a.st) return 0; return U.sum(ST, (k) => a.st[k] * M.cowValue(g, k)) * HC().inventoryValue + (b.farm.feed || 0) * M.feedPrice(g) * 0.8; };

  // ---------- old saves: beef / dairy cow areas become one mixed herd ----------
  M.herdMigrate = (g, b) => {
    const f = b.farm; if (!f || !f.areas) return; const a = f.areas.cows;
    const old = a.kind != null || a.cows != null || a.young != null || a.ready != null;
    if (a.st && !old) return; if (!old && !(a.herd > 0)) { M.herdSync(a); return; }
    const dairy = a.kind === 'dairy'; const total = a.herd || 0; const cows = Math.min(total, a.cows != null ? a.cows : total / 2.07);
    const ready = Math.min(a.ready || 0, Math.max(0, total - cows)); const young = Math.max(U.sum(a.young || [], (x) => x.n), total - cows - ready); // anything not counted is young stock
    a.st = { calf: young * 0.45, heifer: young * 0.3, steer: young * 0.25, ready, milker: cows * (dairy ? 0.85 : 0.8), dry: cows * (dairy ? 0.15 : 0.2), bull: 0 };
    a.st.bull = (cows + young + ready) > 0 ? Math.max(1, Math.round((cows + young + ready) / 40)) : 0;
    const fromM = Math.min(a.st.bull, a.st.milker); a.st.milker -= fromM; a.st.dry = Math.max(0, a.st.dry - (a.st.bull - fromM)); // bulls are part of the old head count
    a.health = 0.9; delete a.kind; delete a.cows; delete a.young; delete a.ready; M.herdSync(a);
    const need = M.feedNeed(a); f.feed = Math.round(need); // one month of feed so nobody starves on load
    if (f.orders && f.orders.spray) delete f.orders.spray.cows;
    if (f.orders && !f.orders.cows) f.orders.cows = M.cowOrderDefaults();
    const spr = b.equip.filter((x) => x.type === 'sprCow'); // cow sprinklers are gone: sold back at a fair used price
    if (spr.length) { const v = Math.round(spr.length * 25000 * g.world.priceIdx * 0.45); TG.F.earn(g, v, 'Asset sales', b.id, true); }
    b.equip = b.equip.filter((x) => x.type !== 'sprCow');
  };
  M.cowOrderDefaults = () => ({ sellReady: true, cullDry: true, keepRoom: true, feedMonths: 2 });
})();

<script>/* js/managers.js */
/* managers.js - decision cards (player choices) and the manager / CEO AI that handles them.
   Managers decide from context; decision quality depends on skill, morale, traits. No standing orders. */
(function () {
  const TG = globalThis.TG; const R = TG.R, U = TG.U;
  const D = {};
  const COVER = {
    broken: ['ops', 'gm'], poach: ['hr', 'gm'], theft: ['hr', 'gm', 'accountant'], lawsuit: ['lawyer'],
    pr: ['ads', 'gm'], evict: [], hire: ['hr', 'gm'], maint: [], raise: ['hr', 'gm'],
    stock: ['ops', 'gm'], bid: ['gm', 'ops'], franchise: ['gm', 'ops'], farm: ['gm', 'ops'], expand: ['ops', 'gm'],
  };

  D.add = (g, dec) => {
    const dup = g.decisions.find((d) => d.kind === dec.kind && d.bizId === dec.bizId && ((dec.itemId && d.itemId === dec.itemId) || (dec.empId && d.empId === dec.empId) || (dec.suitId && d.suitId === dec.suitId) || (dec.reId && d.reId === dec.reId && d.unit === dec.unit) || (dec.kind === 'pr' && d.kind === 'pr')));
    if (dup) return dup;
    dec.id = U.uid('d'); dec.month = g.month; g.decisions.push(dec); return dec;
  };
  D.removeFor = (g, pred) => { g.decisions = g.decisions.filter((d) => !pred(d)); };

  // manager quality: chance a decision is a good one
  D.pGood = (g, e, isCeo) => {
    const C = TG.CONFIG.decisions;
    let p = C.baseGood + e.skill * C.skillWeight + (e.morale - 50) * C.moraleWeight;
    if (isCeo) { const n = g.businesses.length; p -= Math.max(0, n - TG.CONFIG.ceo.spanFree) * TG.CONFIG.ceo.spanPenalty; }
    return U.clamp(p, C.minGood, C.maxGood);
  };
  D.handler = (g, b, kind) => {
    const roles = COVER[kind] || [];
    if (b && b.spec) for (const r of roles) { const e = b.spec[r]; if (e) return { e, label: `${TG.CONFIG.specialists[r].label} ${e.name}`, role: r, p: D.pGood(g, e) }; }
    if (g.ceo && (kind !== 'evict')) return { e: g.ceo, label: `CEO ${g.ceo.name}`, role: 'ceo', p: D.pGood(g, g.ceo, true) };
    if (kind === 'evict' && g.re.manager) return { e: g.re.manager, label: `Property manager ${g.re.manager.name}`, role: 'rem', p: D.pGood(g, g.re.manager) };
    return null;
  };
  // roll good / ok / bad
  D.roll = (h) => { const C = TG.CONFIG.decisions; if (R.chance(h.p)) return 'good'; return R.chance(C.okShare) ? 'ok' : 'bad'; };
  const biz = (g, d) => (d.bizId ? TG.B.get(g, d.bizId) : null);

  // apply a chosen option
  D.resolve = (g, dec, opt, by) => {
    const b = biz(g, dec);
    g.decisions = g.decisions.filter((x) => x !== dec);
    if ((dec.bizId && !b) || opt == null) return;
    const S = TG.S, E = TG.E, cs = TG.CONFIG.staff;
    switch (dec.kind) {
      case 'broken':
        if (opt === 'repair') E.repair(g, b, dec.itemId, by);
        else if (opt.startsWith('replace_')) E.replace(g, b, dec.itemId, opt.slice(8), by);
        else if (by) TG.rep.decision(g, b, by, `Left ${dec.title.toLowerCase()} as is`);
        break;
      case 'poach': {
        const e = S.allStaff(b).find((x) => x.id === dec.empId); if (!e) break;
        if (opt === 'counter') {
          e.wage = Math.round(e.wage * (1 + cs.counterOfferPct)); e.loyalty = U.clamp(e.loyalty + 15, 0, 100); e.morale = U.clamp(e.morale + 8, 0, 100);
          if (R.chance(cs.counterAccept || 0.75)) TG.rep.staff(g, b, `${by ? by + ': ' : ''}${e.name} accepted a counter-offer (now ${U.money(e.wage)}/mo)`);
          else S.leave(g, b, e, 'took the competitor offer anyway', false);
        } else S.leave(g, b, e, 'poached by a competitor', false);
        break;
      }
      case 'theft': {
        const e = S.allStaff(b).find((x) => x.id === dec.empId); if (!e) break;
        if (opt === 'fire') S.fire(g, b, e.id, 'caught stealing'); else { e.morale = U.clamp(e.morale - 6, 0, 100); e.honesty = U.clamp(e.honesty + 8, 0, 100); TG.rep.staff(g, b, `${by ? by + ' gave' : 'Gave'} ${e.name} a warning for theft`); }
        break;
      }
      case 'pr': if (opt !== 'none') TG.B.doPR(g, b, opt, by); break;
      case 'lawsuit': TG.B.resolveSuit(g, dec.suitId, opt, by); break;
      case 'evict': if (opt === 'evict') TG.RE.evict(g, dec.reId, dec.unit, by || 'You'); break;
      default: if (dec.apply) dec.apply(g, opt, by);
    }
  };

  // a manager picks an option for a card (context-aware); returns { opt, outcome, why }
  D.choose = (g, dec, h) => {
    const b = biz(g, dec); const out = D.roll(h); const trait = h.e.trait;
    const good = out === 'good'; const bad = out === 'bad';
    switch (dec.kind) {
      case 'broken': {
        const it = b.equip.find((x) => x.id === dec.itemId); if (!it) return { opt: null };
        const d = TG.E.def(b, it.type); const destroyed = it.broken === 'destroyed';
        const old = it.age / (d.life || 120); const wear = TG.E.effWear(it);
        const mech = TG.E.hasMech(b); const cash = g.cash; const std = TG.E.price(g, b, it.type, 'standard');
        const profitable = U.sum(b.hist.slice(-3), (x) => x.profit) > 0;
        let best, why;
        if (false) { /* v6: managers never repair; only replace or scrap destroyed machines */ }
        else if (cash < std * 1.5) { best = mech ? 'replace_used' : (destroyed ? 'replace_budget' : 'repair'); why = mech ? `cash is tight (${U.money(cash)}) and a mechanic can keep a used one running` : `cash is tight (${U.money(cash)}) and there is no mechanic to keep a used one alive`; }
        else if (cash > std * 6 && profitable) { best = d.critical ? 'replace_premium' : 'replace_standard'; why = `cash is healthy (${U.money(cash)}) and ${d.critical ? 'it is critical, so reliability pays' : 'standard is good value'}`; }
        else { best = mech ? 'replace_used' : 'replace_standard'; why = mech ? 'a mechanic on staff makes used gear a good deal' : 'no mechanic, so newer gear avoids breakdowns'; }
        if (trait === 'reckless' && !good) { best = 'replace_premium'; why = 'reckless: wants the best regardless of cash'; }
        if (best === 'repair') best = 'replace_used';
        if (bad) {
          const alts = ['replace_premium', 'leave'];
          const alt = R.pick(alts.filter((x) => x !== best)) || 'leave';
          why = alt === 'leave' ? 'did not get around to it' : alt === 'repair' ? `patched a worn-out machine (${Math.round(wear)}% wear) that will likely break again` : `bought top-tier with only ${U.money(cash)} in the bank`;
          best = alt;
        }

        return { opt: best, outcome: out, why };
      }
      case 'poach': {
        const e = TG.S.allStaff(b).find((x) => x.id === dec.empId); if (!e) return { opt: null };
        const worth = e.skill >= 65 && (e.role in (b.spec || {}) || TG.CONFIG.businesses[b.type].roles[e.role]?.licensed || e.skill >= 75);
        let opt = worth ? 'counter' : 'let'; if (bad) opt = opt === 'counter' ? 'let' : 'counter';
        return { opt, outcome: out, why: worth ? `${e.name} (skill ${Math.round(e.skill)}) is hard to replace` : `${e.name} can be replaced` };
      }
      case 'theft': return { opt: bad ? 'warn' : 'fire', outcome: out, why: bad ? 'went soft on it' : 'zero tolerance for theft' };
      case 'pr': {

      }
      case 'lawsuit': {
        const ls = g.lawsuits.find((x) => x.id === dec.suitId); if (!ls) return { opt: null };
        const win = TG.B.winChance(g, b); const cfg = TG.CONFIG.lawsuits;
        const settleCost = ls.amount * (cfg.settleShare[0] + cfg.settleShare[1]) / 2;
        const fightCost = ls.amount * cfg.fees * (b && b.spec && b.spec.lawyer ? 0.4 : 1) + (1 - win) * ls.amount;
        let opt = fightCost < settleCost ? 'fight' : 'settle'; if (bad) opt = opt === 'fight' ? 'settle' : 'fight';
        return { opt, outcome: out, why: `win odds ${U.pct(win)}: expected cost to fight ${U.money(fightCost)} vs settle ${U.money(settleCost)}` };
      }

  };

  // Called at the start of each month: anything the player left unanswered goes to a manager, else default.

        D.resolve(g, dec, c.opt, h.label);
        h.e.decisions = (h.e.decisions || 0) + 1; if (c.outcome === 'bad') h.e.badCalls = (h.e.badCalls || 0) + 1;

    }
  };

  // ---------- proactive management each month ----------
  const counts = (b) => { const c = {}; for (const e of b.staff) c[e.role] = (c[e.role] || 0) + 1; return c; };

  D.manage = (g, b) => {
    if (!b.target) D.syncTargets(b);

    const profit3 = U.sum(b.hist.slice(-3), (x) => x.profit);

          if (!cand) { TG.rep.decision(g, b, h.label, `Could not find a ${S.roleDef(b, role).label.toLowerCase()} to hire (thin labor pool)`, 'ok'); break; }
          S.hire(g, b, cand, h.label); missing--;

    // 3b) your order: keep spare staff so call-outs don't leave work undone

      if (w.kind !== 'staff' || !w.role || !(w.load > 0) || !w.cap) continue;
      const n = b.staff.filter((e) => e.role === w.role).length; const per = w.cap / Math.max(1, n);

        b.target[w.role] = n + Math.min(add, 3);
        TG.rep.decision(g, b, h.label, `Added ${Math.min(add, 3)} ${TG.S.roleDef(b, w.role).label.toLowerCase()} position(s): your order is ${U.pct(spare)} spare, they had ${U.pct(Math.max(0, w.cap / w.load - 1))}`, 'good');
      }
    }

        const r = M.brandOrder(g, b, units, false);

          if (o.bond && !b.fixes.bonds) continue;

    }

        if (need > have) {

          const it = E.buy(g, b, kind, out === 'bad' ? 'premium' : 'standard', { leased: lease });
          if (it) TG.rep.decision(g, b, h.label, `${lease ? 'Leased' : 'Bought'} a ${it.label.toLowerCase()} because active projects need ${need} and only ${have} work`, out);
        }
      }
    }

    }

    // 4b) staff-limited: add a key worker when demand clearly exceeds capacity and it pays
    h = D.handler(g, b, 'hire');
    if (h && lc.limit === 'staff' && lc.demand > lc.cap * 1.2 && profit3 > 0 && b.hist.length >= 3) {
      const kr = TG.M.keyRole(TG.CONFIG.businesses[b.type]);
      if (kr && R.chance(0.5)) { b.target[kr] = (b.target[kr] || 0) + 1; TG.rep.decision(g, b, h.label, `Added a ${S.roleDef(b, kr).label.toLowerCase()} position: demand ${Math.round(lc.demand)} vs capacity ${Math.round(lc.cap)}, limited by staff`, 'good'); }
    }
    if (h && lc.limit === 'support' && lc.demand > lc.cap * 1.1 && b.hist.length >= 3) {
      const d0 = TG.CONFIG.businesses[b.type]; const sr = Object.keys(d0.roles).find((r) => d0.roles[r].support);
      if (sr) { b.target[sr] = (b.target[sr] || 0) + 1; TG.rep.decision(g, b, h.label, `Added a ${S.roleDef(b, sr).label.toLowerCase()} position: support staff were the bottleneck`, 'good'); }
    }
    // 5) capacity: buy another machine when demand outstrips it (context-aware tier)
    h = D.handler(g, b, 'expand');
    if (h && lc.demand && lc.cap && lc.demand > lc.cap * 1.15 && (!lc.limit || lc.limit === 'equipment') && profit3 > 0 && (b.hist.length >= 3) && b.svc !== false) {
      const d = TG.CONFIG.businesses[b.type];

  };

  // farm sell-vs-store policy ('auto'): managers judge today's price vs the yearly average
  D.farmPolicy = (g, b, good) => {
    const f = b.farm; const mk = g.markets[good || 'grain']; if (!mk) return 'sell';
    const hist = mk.hist || []; const avg = hist.length ? U.avg(hist.slice(-12), (x) => x.p || x) : mk.price;
    const now = TG.W.price(g, good || 'grain', 0);
    const h = D.handler(g, b, 'farm'); if (!h) return 'sell';
    let ratio = now / Math.max(1, avg);
    if (h && (!f.policyRoll || f.policyRoll.m !== g.month)) f.policyRoll = { m: g.month, out: D.roll(h) };
    if (f.policyRoll && f.policyRoll.out === 'bad') ratio = 2 - ratio;
    return ratio < 0.92 && TG.M.farmStoreFree(b) > 1 ? 'store' : 'sell';
  };
  // with no manager, your most skilled worker carries out standing orders (less reliably)
  D.foreman = (g, b) => {
    const kr = TG.M.keyRole(TG.CONFIG.businesses[b.type]); const best = b.staff.filter((e) => e.role === kr).sort((x, y) => y.skill - x.skill)[0];
    if (!best) return null;
    return { e: best, label: `Head ${TG.S.roleDef(b, kr).label.toLowerCase()} ${best.name}`, role: 'foreman', p: U.clamp(0.25 + best.skill / 250, 0.25, 0.6), foreman: true };
  };
  D.orderTaker = (g, b, kind) => D.handler(g, b, kind); // v6: no manager = nobody carries out orders (you do it yourself)

  D.farmOrders = (g, b) => {
    const f = b.farm, o = f.orders || (f.orders = TG.M.farmDefaultOrders());
    for (const k of TG.M.farmAreas) {
      const so = o.spray && o.spray[k]; const a = f.areas[k]; if (!so || !so.on || !a.acres || a.soil >= so.below) continue;
      const h = D.orderTaker(g, b, 'farm'); if (!h) continue;
      const out = D.roll(h); const L = TG.M.areaLabel(k);
      if (out === 'bad' && R.chance(0.5)) { TG.rep.decision(g, b, h.label, `Forgot your order to spray the ${L} (soil ${U.pct(a.soil)}, your line ${U.pct(so.below)})`, 'bad'); continue; }
      if (out === 'ok' && h.foreman && R.chance(0.4)) continue; // a busy head worker gets to it next month
      const r = TG.M.farmTreat(g, b, k, h.label, out === 'bad' ? 1.5 : 1);
      if (r.ok) TG.rep.decision(g, b, h.label, `Sprayed & fed the ${L}: soil ${U.pct(r.from)} → ${U.pct(r.to)} for ${U.money(r.cost)}${out === 'bad' ? ' (used 50% too much spray)' : ''}`, out === 'bad' ? 'bad' : 'good');
    }
  };
  // v6 cow orders (ONLY with a farm manager / ops / CEO): sell market-ready cattle, cull dry cows, keep the herd within room,
  // keep N months of feed in storage. Without one nothing happens: you do it yourself in the Cows card.
  D.farmCowOrders = (g, b) => {
    const f = b.farm, a = f.areas.cows; if (!a.herd) return; const o = (f.orders = f.orders || TG.M.farmDefaultOrders()).cows || (f.orders.cows = TG.M.cowOrderDefaults());
    const h = D.handler(g, b, 'farm'); if (!h) return;
    const out = D.roll(h); const M = TG.M;
    if (o.sellReady && a.st.ready >= 1) { const r = M.farmSellCattle(g, b, out === 'bad' ? a.st.ready * 0.5 : a.st.ready, 'ready'); if (r.ok) TG.rep.decision(g, b, h.label, `Sold ${r.head} market-ready cattle for ${U.money(r.rev)}`, out === 'bad' ? 'bad' : 'good'); }
    if (o.cullDry && a.st.dry >= 1) { const keep = out === 'bad' ? a.st.dry * 0.5 : 0; const r = M.farmSellCattle(g, b, a.st.dry - keep, 'dry'); if (r.ok) TG.rep.decision(g, b, h.label, `Sold ${r.head} dry/old cows for meat (${U.money(r.rev)})`); }
    if (o.keepRoom) { const cap = M.farmHeadCap(b); const over = a.herd - cap * 0.95; if (over >= 1) { const k = a.st.steer >= over ? 'steer' : a.st.heifer >= over ? 'heifer' : 'calf'; const r = M.farmSellCattle(g, b, Math.min(over, a.st[k]), k); if (r.ok) TG.rep.decision(g, b, h.label, `Herd was over room: sold ${r.head} ${TG.CONFIG.cows.stages[k].label.toLowerCase()} (${U.money(r.rev)})`); } }
    if (o.feedMonths > 0) {
      const fc = M.herdForecast(g, b); let want = 0; for (let i = 1; i <= o.feedMonths; i++) { const moy = U.moy(g.month + i); want += Math.max(0, M.feedNeed(a) - M.grass(g, b, null, moy)); }
      let need = want - (f.feed || 0); if (out === 'bad') need *= R.chance(0.5) ? 0.5 : 1.4;
      if (need >= 1) { const r = M.farmBuyFeed(g, b, need, h.label); if (r.ok) TG.rep.decision(g, b, h.label, `Bought ${r.tons} t of feed (${U.money(r.cost)}) to keep ${o.feedMonths} months in storage`); else TG.rep.decision(g, b, h.label, `Could not buy feed: ${r.msg}`, 'bad'); }
      void fc;
    }
  };
  // farm order: buy seed before planting (a manager buys at the normal price; a head farmhand pays a little more)
  D.farmSeedOrder = (g, b, cov) => {
    const f = b.farm, a = f.areas.crops, e = TG.M.areaE(b, 'crops'), moy = U.moy(g.month);
    if (!f.orders || !f.orders.seed || !a.acres) return;
    const left = e.plant.filter((m) => m >= moy).length || e.plant.length; const pcv = Math.min(cov.pcov, Math.pow(cov.hcov, 0.5));
    let need = a.acres / e.plant.length * left * pcv - f.seeds; if (need <= 0.5) return;
    const h = D.orderTaker(g, b, 'farm'); if (!h) return;
    const out = D.roll(h); if (out === 'bad') need *= R.chance(0.5) ? 1.3 : 0.6;
    const n = TG.M.models.farm.buySeeds(g, b, need, h.foreman ? TG.CONFIG.supply.staffReorderPremium : 0);
    if (out === 'bad' && n > 0) TG.rep.decision(g, b, h.label, `Bought seed for ${n} acres, ${need > a.acres / e.plant.length * left ? 'more than needed' : 'not enough'} for ${Math.round(a.acres)} crop acres`, 'bad');
  };

  // ---------- CEO ----------
  D.ceoPool = (g) => {
    if (g.ceoPool && g.ceoPool.month === g.month) return g.ceoPool.list;
    const hub = g.businesses[0] || { region: 'harbor', loc: 'city' };
    g.ceoPool = { month: g.month, list: [0, 1, 2].map(() => TG.S.candidate(g, { region: hub.region, loc: hub.loc }, 'ceo', 0.7)) };
    return g.ceoPool.list;
  };
  D.hireCeo = (g, cand) => { g.ceo = cand; cand.hired = g.month; cand.months = 0; TG.rep.staff(g, null, `Hired ${cand.name} as CEO (${U.money(cand.wage)}/mo + ${U.pct(cand.profitShare, 1)} of profit)`); };
  D.fireCeo = (g) => { if (!g.ceo) return; const sev = g.ceo.wage * 3; TG.F.spend(g, sev, 'Severance'); TG.rep.staff(g, null, `Let CEO ${g.ceo.name} go (${U.money(sev)} severance)`); g.ceo = null; };
  D.ceoMonth = (g, profit) => {
    const c = g.ceo; if (!c) return;
    c.months++;
    TG.F.spend(g, c.wage, 'CEO salary');
    if (profit > 0) TG.F.spend(g, Math.round(profit * c.profitShare), 'CEO profit share');
    const target = 60 + (profit > 0 ? 8 : -10) - Math.max(0, g.businesses.length - TG.CONFIG.ceo.spanFree) * 3;
    c.morale = U.clamp(c.morale + (target - c.morale) * 0.15 + R.normal(0, 2), 0, 100);
    if (c.skill < 95 && R.chance(0.3)) c.skill = U.clamp(c.skill + 0.3, 1, 99);
    const quitP = 0.004 + (c.morale < 35 ? 0.04 : 0) + (c.skill > 75 ? 0.006 : 0);
    if (R.chance(quitP)) { TG.rep.event(g, null, 'major', `CEO ${c.name} quit`, c.morale < 35 ? `Morale ${Math.round(c.morale)}/100` : 'Poached by a bigger company', { major: 'keyQuit' }); g.ceo = null; }
  };
  TG.D = D;
})();
