    const C = TG.CONFIG, d = C.businesses[type];
    const prop = g.properties.find((p) => p.id === propId);
    if (!prop) return { ok: false, msg: 'Pick a property you own or lease.' };
    if (prop.bizId) return { ok: false, msg: 'That property already hosts a business.' };
    if (d.model === 'farm' && !opts.ent) opts.ent = TG.M.bestEnterprise(prop);
    const cost = B.setupCost(g, type, prop, opts);
    if (g.cash < cost) return { ok: false, msg: `Setup costs ${U.money(cost)}.` };
    TG.F.spend(g, cost, 'Business setup', null, true);
    const n = g.businesses.filter((x) => x.type === type).length;
    const b = {
      id: U.uid('b'), type, name: opts.name || (d.name + (n ? ' #' + (n + 1) : '')), propId, region: prop.region, loc: prop.loc,
      labor: prop.labor, traffic: prop.traffic, sqft: prop.sqft, acres: prop.acres, founded: g.month,
      rep: d.startRep != null ? d.startRep : C.reputation.start, staff: [], spec: {}, equip: [], fixes: {}, ins: {},
      ads: { budget: 0, channel: 'social' }, pace: 'normal', price: 'normal', hits: [], boost: null, recv: [], hist: [],
      m: { rev: 0, cost: 0, lines: {} }, revAvg: 0, outside: 0, closed: 0, licensePending: d.license ? d.license.months : 0,
      qHits: [], bad: [], insHike: 1, lastUtil: 0.8, setup: cost,
    };
    prop.bizId = b.id;
    TG.M.init(g, b, prop, opts);
    g.businesses.push(b);
    if (!g.player.ownerBiz) g.player.ownerBiz = b.id;
    TG.rep.event(g, b, 'info', `Opened ${b.name}`, `Setup cost ${U.money(cost)}${d.license ? `; license takes ${d.license.months} months before opening` : ''}`);
    return { ok: true, biz: b };
  };

  // Minimal equipment + staff to open the doors. Returns the cost list (dry run if !apply).
  B.quickSetup = (g, b, apply, tierPref) => {
    const d = B.def(b); const plan = TG.M.needs(g, b);
    let cost = 0; const steps = [];
    for (const n of plan.equip) {
      const have = b.equip.filter((x) => x.type === n.type && x.broken !== 'destroyed').length;
      for (let i = have; i < n.count; i++) { const tier = tierPref || 'standard'; const pr = TG.E.price(g, b, n.type, tier); cost += pr; steps.push({ kind: 'equip', type: n.type, tier, cost: pr }); }
    }
    for (const n of plan.staff) {
      const have = b.staff.filter((e) => e.role === n.role).length;
      for (let i = have; i < n.count; i++) steps.push({ kind: 'staff', role: n.role });
    }
    if (!apply) return { cost, steps };
    for (const s of steps) {
      if (s.kind === 'equip') { if (g.cash >= s.cost) TG.E.buy(g, b, s.type, s.tier); }
      else { const pool = TG.S.poolFor(g, b, s.role); if (pool.length) { const best = pool.slice().sort((x, y) => (y.skill + y.attitude * 0.5) / y.wage - (x.skill + x.attitude * 0.5) / x.wage)[0]; TG.S.hire(g, b, best); } }
    }
    if (TG.D) TG.D.syncTargets(b);
    for (const t of d.insurance) if (t === 'liability' || t === 'malpractice' || (t === 'property' && g.properties.find((p) => p.id === b.propId && p.owned))) b.ins[t] = true;
    return { cost, steps };
  };

  // aggregate active fix effects
  B.fixAgg = (b) => {
    const d = B.def(b); const o = { equipBreak: {}, demand: 0, morale: 0, cogsAdd: 0, revCostPct: 0, skillGrowth: 1, repTarget: 0 };
    for (const f of d.fixes) {
      if (!b.fixes[f.id]) continue;
      for (const k in f) {
        if (['id', 'label', 'cost', 'monthly', 'reduces', 'note'].indexOf(k) >= 0) continue;
        const v = f[k];
        if (k === 'equipBreak') { for (const t in v) o.equipBreak[t] = (o.equipBreak[t] || 1) * v[t]; }
        else if (k === 'demand' || k === 'morale' || k === 'cogsAdd' || k === 'revCostPct' || k === 'repTarget' || k === 'payrollAdd' || k === 'materialAdd') o[k] = (o[k] || 0) + v;
        else if (k === 'skillGrowth') o.skillGrowth = Math.max(o.skillGrowth, v);
        else o[k] = v;
      }
    }
    b.fixesOn = o; return o;
  };
  B.fixMonthly = (g, b) => {
    const d = B.def(b); let t = 0;
    const units = b.equip.filter((x) => { const ed = TG.E.def(b, x.type); return ed && (ed.critical || ed.cap) && !ed.support; }).length;
    for (const f of d.fixes) if (b.fixes[f.id]) { t += (f.monthly || 0) * g.world.priceIdx; if (f.perUnitMonthly) t += f.perUnitMonthly * Math.max(1, units) * g.world.priceIdx; }
    return Math.round(t);
  };
  B.buyFix = (g, b, fixId) => {
    const f = B.def(b).fixes.find((x) => x.id === fixId); if (!f || b.fixes[fixId]) return { ok: false };
    const cost = Math.round((f.cost || 0) * g.world.priceIdx);
    if (g.cash < cost) return { ok: false, msg: `Costs ${U.money(cost)}.` };
    TG.F.spend(g, cost, 'Upgrades', b.id, true); b.fixes[fixId] = { since: g.month };
    if (fixId === 'bulk') b.fixes[fixId].until = g.month + (f.lockMonths || 24);
    if (fixId === 'research' && b.tech) TG.M.techResearch(g, b);
    B.fixAgg(b);
    return { ok: true };
  };
  B.dropFix = (g, b, fixId) => { delete b.fixes[fixId]; B.fixAgg(b); };

  B.baseRev = (g, b) => TG.M.baseRev(g, b);
  B.space = (b) => (B.def(b).space.unit === 'acres' ? (b.farm ? b.farm.acres : b.acres) : b.sqft);
  B.owner = (g, b) => g.player.ownerBiz === b.id;

  // ---------- context: staff stats & risk modifiers ----------
  B.ctx = (g, b) => {
    const C = TG.CONFIG, d = B.def(b);
    const key = TG.S.keyStaff(b), all = TG.S.allStaff(b);
    const own = B.owner(g, b);
    const avg = (f, def) => (key.length ? U.avg(key, f) : def);
    const ctx = {
      key, all, own, down: 0, warnings: [], revAvg: Math.max(b.revAvg || 0, B.baseRev(g, b) * 0.3, 2000),
      skill: avg((e) => e.skill, own ? 55 : 35), attitude: avg((e) => e.attitude, own ? 65 : 45), reliability: avg((e) => e.reliability, 60),
      honesty: all.length ? U.avg(all, (e) => e.honesty) : 70, temper: avg((e) => e.temper, 30), morale: all.length ? U.avg(all, (e) => e.morale) : 60,
      ambition: avg((e) => e.ambition, 40), busy: b.lastUtil || 0.8, util: b.lastUtil || 0.8,
      weather: TG.W.weatherOf(g, b.region), streakMult: 1,
    };
    const recentBad = (b.bad || []).filter((m) => g.month - m <= C.streak.window).length;
    if (recentBad >= C.streak.threshold) ctx.streakMult = C.streak.mult;
    // quality
    const exp = g.player.exp[b.type] || 0;
    let q = 50 + (ctx.skill - 50) * 0.5 + (ctx.attitude - 50) * 0.25;
    const eqList = b.equip.filter((x) => x.broken !== 'destroyed');
    if (eqList.length) { q += (1 - TG.E.avgWear(b) / 100) * 10 - 5; q += (U.avg(eqList, (x) => C.equipTiers[x.tier].out) - 1) * 25; }
    if (own) q += C.owner.operatedQuality + Math.min(C.owner.expQualityCap, (exp / 12) * C.owner.expQualityPerYear);
    else if (!b.spec.gm) q += C.owner.absentQuality;
    for (const h of b.qHits) q -= h.amt;
    ctx.quality = U.clamp(q, 0, 100);
    return ctx;
  };

  B.mod = (g, b, ctx, key) => {
    const s = b.spec || {}; const w = ctx.weather;
    switch (key) {
      case 'skill': return 1.6 - ctx.skill / 100;
      case 'attitude': return 1.6 - ctx.attitude / 100;
      case 'temper': return 0.6 + ctx.temper / 100;
      case 'honestyLow': return 1.8 - ctx.honesty / 100;
      case 'reliability': return 1.6 - ctx.reliability / 100;
      case 'morale': return 1.7 - ctx.morale / 85;
      case 'ambition': return 0.6 + ctx.ambition / 100;
      case 'busy': return 0.7 + 0.6 * U.clamp(ctx.busy, 0, 1.3);
      case 'noHR': return s.hr ? 0.7 : 1.15;
      case 'noOps': return s.ops ? 0.6 : s.gm ? 0.85 : 1.2;
      case 'noSafety': return s.safety ? 0.45 : 1.2;
      case 'noMech': return s.mechanic ? 0.6 : 1.2;
      case 'noAccountant': return s.accountant ? 0.6 : 1.2;
      case 'noLawyer': return s.lawyer ? 0.6 : 1.1;
      case 'equipWear': return 0.5 + TG.E.avgWear(b) / 60;
      case 'supportWear': {
        const sup = b.equip.filter((x) => TG.E.def(b, x.type) && TG.E.def(b, x.type).support);
        if (!sup.length) return 2.2;
        if (sup.some((x) => x.broken)) return 3;
        const wv = U.avg(sup, TG.E.effWear) / 100; return 0.4 + 2 * Math.pow(wv, 1.5);
      }
      case 'scale': return U.clamp(Math.sqrt(Math.max(1, b.staff.length) / 5), 0.6, 8);
      case 'econ': return { boom: 0.85, slowdown: 1.1, recession: 1.4, recovery: 1 }[g.world.phase];
      case 'weather': return w.sev > 0 ? 0.5 + w.sev * 3 : 0.4;
      case 'drought': return w.kind === 'drought' || w.kind === 'heat' ? 4 : 0.5;
      case 'rush': return b.pace === 'rush' ? 1.6 : b.pace === 'careful' ? 0.7 : 1;
      case 'priceHigh': return b.price === 'premium' ? 2 : b.price === 'low' ? 0.6 : 1;
      case 'world_shortage': return g.world.shortage[B.def(b).cat] ? 3 : 0.7;
      case 'crime': return (TG.CONFIG.locations[b.loc] || { crime: 1 }).crime * (g.world.crime > 0 ? 2 : 1);
      case 'rep': return b.rep < 30 ? 1.4 : b.rep > 70 ? 0.7 : 1;
      case 'labor': return 1.6 - b.labor;
      case 'emissions': return g.world.emissions > 0 ? 2.5 : 1;
      case 'launched': return b.tech && b.tech.phase === 'live' ? 1 : 0;
      default: return 1;
    }
  };
  const MODWORDS = {
    skill: (c) => `avg skill ${Math.round(c.skill)}`, attitude: (c) => `staff attitude ${Math.round(c.attitude)}`, temper: () => 'hot tempers on staff',
    honestyLow: (c) => `staff honesty`, reliability: (c) => `reliability ${Math.round(c.reliability)}`, morale: (c) => `morale ${Math.round(c.morale)}`,
    ambition: () => 'ambitious staff', busy: (c) => `workload ${U.pct(c.busy)}`, noHR: () => 'HR manager', noOps: () => 'ops manager',
    noSafety: () => 'safety officer', noMech: () => 'mechanic', noAccountant: () => 'accountant', noLawyer: () => 'lawyer',
    equipWear: () => 'equipment wear', supportWear: () => 'support equipment condition', scale: (c, b) => `${b.staff.length} staff`,
    econ: (c, b, g) => `${TG.W.phaseLabel(g).toLowerCase()} economy`, weather: (c) => (c.weather.sev ? TG.CONFIG.weather.kinds[c.weather.kind].label.toLowerCase() : 'mild weather'),
    drought: (c) => (c.weather.kind === 'drought' ? 'drought' : 'normal water'), rush: (c, b) => `${b.pace} pace`, priceHigh: (c, b) => `${b.price} pricing`,
    world_shortage: () => 'supply shortage', crime: () => 'local crime', rep: (c, b) => `reputation ${Math.round(b.rep)}`, labor: () => 'labor pool', emissions: () => 'emissions rules',
  };
  const NO = { noHR: 1, noOps: 1, noSafety: 1, noMech: 1, noAccountant: 1, noLawyer: 1 };
  B.riskP = (g, b, ctx, r) => {
    const d = B.def(b); let p = r.base; const parts = [];
    for (const k of r.mods || []) {
      const m = B.mod(g, b, ctx, k); p *= m;
      if (MODWORDS[k] && (m > 1.12 || m < 0.88)) {
        const w = MODWORDS[k](ctx, b, g);
        parts.push(NO[k] ? (m > 1 ? 'no ' + w : w + ' helps') : (m > 1 ? w + ' (raises odds)' : w + ' (lowers odds)'));
      }
    }
    for (const f of d.fixes) if (b.fixes[f.id] && f.reduces && f.reduces[r.id]) { p *= f.reduces[r.id]; parts.push('with ' + f.label.toLowerCase()); }
    p *= (TG.CONFIG.difficulty.eventFreq[g.settings.eventFreq] || 1) * ctx.streakMult;
    return { p: U.clamp(p, 0, 0.95), parts };
  };

  B.rollRisks = (g, b, ctx) => {
    const d = B.def(b);
    for (const r of d.risks) {
      if (!r.base) continue;
      if (r.sev.harvestOnly && !(b.farm && TG.M.isHarvest(g, b))) continue;
      const { p, parts } = B.riskP(g, b, ctx, r);
      if (R.chance(p)) B.applyRisk(g, b, ctx, r, p, parts);
    }
  };
  B.applyRisk = (g, b, ctx, r, p, parts, extraWhy) => {
    const C = TG.CONFIG, s = r.sev;
    const why = `${U.pct(p, 1)} chance this month` + (parts && parts.length ? ': ' + parts.join(', ') : '') + (extraWhy ? '. ' + extraWhy : '');
    let loss = 0, txt = r.label; const bits = [];
    if (s.revPct) loss += ctx.revAvg * R.range(s.revPct[0], s.revPct[1]);
    if (s.cash) loss += R.range(s.cash[0], s.cash[1]) * g.world.priceIdx;
    if (loss > 0) {
      loss = Math.round(loss);
      TG.F.spend(g, loss, 'Incidents', b.id); bits.push(`cost ${U.money(loss)}`);
      if (s.ins) TG.F.claim(g, b, s.ins, loss, r.label);
    }
    if (s.rep) { const x = R.range(s.rep[0], s.rep[1]) * (b.rep > 70 ? 0.75 : b.rep < 30 ? 1.25 : 1); b.rep = U.clamp(b.rep - x, 0, 100); bits.push(`reputation -${Math.round(x)}`); B.prCard(g, b, r.label, x); }
    if (s.down) { const x = R.range(s.down[0], s.down[1]); ctx.down = U.clamp(ctx.down + x, 0, 1); bits.push(`${U.pct(x)} of capacity lost`); }
    if (s.demandHit) { const soft = (b.fixesOn && b.fixesOn.hitSoften) || 0; const mult = 1 - (1 - s.demandHit[0]) * (1 - soft); b.hits.push({ mult, months: s.demandHit[1], label: r.label }); bits.push(`demand x${mult.toFixed(2)} for ${s.demandHit[1]} mo`); }
    if (s.quit) {
      const pool = ctx.key.length ? ctx.key : b.staff;
      if (pool.length) { const e = s.quit === 'best' ? pool.slice().sort((x, y) => y.skill - x.skill)[0] : R.pick(pool); TG.S.leave(g, b, e, r.label.toLowerCase()); }
    }
    if (s.quality && !(b.fixesOn && b.fixesOn.qualityShield)) { b.qHits.push({ amt: s.quality[0], months: s.quality[1] }); bits.push(`quality -${s.quality[0]} for ${s.quality[1]} mo`); }
    if (s.delayExtra) { const x = R.int(s.delayExtra[0], s.delayExtra[1]); for (const rv of b.recv) rv.due += x; bits.push(`payments delayed ${x} mo`); }
    if (s.churn && b.tech) { const x = R.range(s.churn[0], s.churn[1]); b.tech.users = Math.round(b.tech.users * (1 - x)); bits.push(`${U.pct(x)} of users left`); }
    if (s.yield && b.farm) { const x = R.range(s.yield[0], s.yield[1]); b.farm.seasonYield *= x; bits.push(`harvest outlook x${x.toFixed(2)}`); }
    let sued = false;
    if (s.suit && (!s.suitChance || R.chance(s.suitChance))) {
      const amt = Math.max(C.lawsuits.suitMin, ctx.revAvg * R.range(s.suit[0], s.suit[1]));
      B.lawsuit(g, b, 'Lawsuit: ' + r.label, amt, s.ins, why); sued = true;
    }
    if (s.injury && !sued && R.chance(s.injury * C.lawsuits.injurySuitChance)) { B.lawsuit(g, b, 'Injury lawsuit: ' + r.label, Math.max(C.lawsuits.suitMin, ctx.revAvg * R.range(0.3, 1.5)), s.ins || 'liability', why); }
    b.bad.push(g.month); if (b.bad.length > 10) b.bad.shift();
    TG.rep.event(g, b, sued || (s.rep && s.rep[1] >= 12) ? 'major' : 'bad', txt + (bits.length ? ` (${bits.join(', ')})` : ''), why, sued ? { major: 'lawsuit' } : null);
  };

  B.prCard = (g, b, label, hit) => {
    if (hit < 6) return;
    const P = TG.CONFIG.reputation.pr;
    const opts = Object.keys(P).map((k) => ({ id: k, label: `${P[k].label} (${P[k].cost != null ? U.money(P[k].cost) : U.money(b.revAvg * P[k].costRev)})` }));
    opts.push({ id: 'none', label: 'Do nothing (reputation recovers slowly)' });
    TG.D.add(g, { kind: 'pr', bizId: b.id, title: `Reputation hit at ${b.name}`, text: `${label}. Reputation is now ${Math.round(b.rep)}/100.`, why: 'Reputation falls fast and recovers slowly; PR can speed it up but can also flop.', options: opts, def: 'none' });
  };
  B.doPR = (g, b, kind, by) => {
    const P = TG.CONFIG.reputation.pr[kind]; if (!P) return;
    const cost = Math.round(P.cost != null ? P.cost * g.world.priceIdx : b.revAvg * P.costRev);
    TG.F.spend(g, cost, 'PR & marketing', b.id);
    if (R.chance(P.fail)) { TG.rep.decision(g, b, by, `${P.label} flopped (${U.money(cost)})`, 'bad'); return; }
    const x = R.range(P.rep[0], P.rep[1]); b.rep = U.clamp(b.rep + x, 0, 100);
    TG.rep.decision(g, b, by, `${P.label}: reputation +${Math.round(x)} (${U.money(cost)})`, 'good');
  };

  // ---------- lawsuits ----------
  B.lawsuit = (g, b, label, amount, insType, why) => {
    const C = TG.CONFIG.lawsuits;
    amount = Math.round(amount);
    const ls = { id: U.uid('s'), bizId: b ? b.id : null, label, amount, ins: insType || null, left: R.int(C.months[0], C.months[1]), status: 'open', why };
    g.lawsuits.push(ls);
    const win = B.winChance(g, b);
    TG.rep.event(g, b, 'major', `${label}: sued for ${U.money(amount)}`, why || 'See risk factors', { major: 'lawsuit' });
    TG.D.add(g, { kind: 'lawsuit', bizId: b ? b.id : null, suitId: ls.id, title: label, text: `Claim of ${U.money(amount)}${insType && b && b.ins[insType] ? ` (your ${TG.CONFIG.finance.insurance[insType].label.toLowerCase()} insurance covers most of a loss)` : ' (not insured)'}. Decide within ${ls.left} months.`,
      why: `Estimated chance to win in court: ${U.pct(win)}. Legal fees about ${U.money(amount * C.fees)}.`,
      options: [{ id: 'settle', label: `Settle (about ${U.money(amount * (C.settleShare[0] + C.settleShare[1]) / 2)})` }, { id: 'fight', label: `Fight it (${U.pct(win)} win odds)` }], def: null, persist: true });
    return ls;
  };
  B.winChance = (g, b) => {
    const C = TG.CONFIG.lawsuits;
    const lawyer = (b && b.spec && b.spec.lawyer) || (b && b.type === 'law' && b.staff.filter((e) => e.role === 'attorney').sort((x, y) => y.skill - x.skill)[0]);
    return U.clamp(C.baseWin + (lawyer ? C.lawyerWinBonus * (0.5 + lawyer.skill / 100) : 0) + (b ? (b.rep - 50) * C.repWin : 0), 0.05, 0.9);
  };
  B.resolveSuit = (g, suitId, how, by) => {
    const C = TG.CONFIG.lawsuits; const ls = g.lawsuits.find((x) => x.id === suitId); if (!ls || ls.status !== 'open') return;
    const b = ls.bizId ? B.get(g, ls.bizId) : null;
    if (how === 'settle') {
      const amt = Math.round(ls.amount * R.range(C.settleShare[0], C.settleShare[1]));
      TG.F.spend(g, amt, 'Legal settlements', b && b.id); if (b) TG.F.claim(g, b, ls.ins, amt, ls.label);
      ls.status = 'settled'; TG.rep.decision(g, b, by, `Settled "${ls.label}" for ${U.money(amt)}`);
      g.lawsuits = g.lawsuits.filter((x) => x !== ls);
    } else {
      const fees = Math.round(ls.amount * C.fees * (b && b.spec && b.spec.lawyer ? 0.4 : 1));
      TG.F.spend(g, fees, 'Legal fees', b && b.id); ls.status = 'fighting'; ls.win = B.winChance(g, b);
      TG.rep.decision(g, b, by, `Chose to fight "${ls.label}" (${U.pct(ls.win)} win odds, fees ${U.money(fees)})`);
    }
  };
  B.monthSuits = (g) => {
    const C = TG.CONFIG.lawsuits;
    for (const ls of g.lawsuits.slice()) {
      ls.left--;
      if (ls.left > 0) continue;
      const b = ls.bizId ? B.get(g, ls.bizId) : null;
      if (ls.status === 'open') {
        const amt = Math.round(ls.amount * C.defaultMult);
        TG.F.spend(g, amt, 'Court judgments', b && b.id); if (b) TG.F.claim(g, b, ls.ins, amt, ls.label);
        TG.rep.event(g, b, 'major', `Default judgment: ${ls.label} (${U.money(amt)})`, 'Nobody responded to the lawsuit in time (no lawyer or CEO to handle it)', { major: 'lawsuit' });
        TG.D.removeFor(g, (d) => d.suitId === ls.id);
      } else if (ls.status === 'fighting') {
        if (R.chance(ls.win)) { TG.rep.event(g, b, 'good', `Won the lawsuit: ${ls.label}`, `${U.pct(ls.win)} odds`); if (b) b.rep = U.clamp(b.rep + 2, 0, 100); }
        else { TG.F.spend(g, ls.amount, 'Court judgments', b && b.id); if (b) { TG.F.claim(g, b, ls.ins, ls.amount, ls.label); b.rep = U.clamp(b.rep - 4, 0, 100); } TG.rep.event(g, b, 'major', `Lost the lawsuit: ${ls.label} (${U.money(ls.amount)})`, `Had ${U.pct(ls.win)} odds to win`, { major: 'lawsuit' }); }
      }
      g.lawsuits = g.lawsuits.filter((x) => x !== ls);
    }
  };

  // ---------- receivables ----------
  B.addRecv = (g, b, amt, delay, label) => { if (amt > 0) b.recv.push({ amt: Math.round(amt), due: g.month + delay, label: label || 'Invoices' }); };
  B.collect = (g, b) => {
    const d = B.def(b); const bad = ((d.receivable && d.receivable.badDebt) || 0) * ((b.fixesOn && b.fixesOn.badDebtMult) || 1);
    const keep = [];
    for (const r of b.recv) {
      if (r.due > g.month) { keep.push(r); continue; }
      if (R.chance(bad)) { TG.rep.event(g, b, 'bad', `A client never paid ${U.money(r.amt)}`, `${U.pct(bad, 0)} chance per invoice of bad debt`); continue; }
      TG.F.earn(g, r.amt, 'Revenue', b.id);
    }
    b.recv = keep;
  };

  // ---------- marketing ----------
  B.adBoost = (g, b) => {
    const C = TG.CONFIG.reputation; const a = b.ads; if (!a || !(a.budget > 0)) return { boost: 0 };
    const ch = C.adChannels[a.channel] || C.adChannels.social;
    const mgr = b.spec && b.spec.ads;
    let eff = (a.budget / ch.costPer) * ch.eff * (mgr ? 1 + mgr.skill / 150 : 1);
    const ref = Math.max(500, B.baseRev(g, b) * C.adBoostScale);
    let boost = C.adMaxBoost * (1 - Math.exp(-eff / ref));
    if (b.rep < 30) boost /= C.lowRepAdPenalty;
    const flop = R.chance(ch.flop * (mgr ? 0.5 : 1));
    if (flop) boost *= 0.15;
    return { boost, flop };
  };

  // ---------- fixed costs ----------
  B.fixedCosts = (g, b, ctx) => {
    const C = TG.CONFIG, d = B.def(b);
    const payroll = TG.S.payroll(b) * (1 + ((b.fixesOn && b.fixesOn.payrollAdd) || 0));
    if (g.cash < payroll && g.cash - payroll < -(TG.F.locLimit(g) - g.loc.balance)) ctx.missedPayroll = true;
    TG.F.spend(g, Math.round(payroll), 'Wages', b.id);
    TG.F.spend(g, Math.round(payroll * C.staff.payrollTax), 'Payroll tax', b.id);
    const prop = g.properties.find((p) => p.id === b.propId);
    if (prop) {
      b.propValue = prop.owned ? TG.P.value(g, prop) : 0;
      if (prop.leased) TG.F.spend(g, prop.rent, 'Rent', b.id);
      else TG.F.spend(g, TG.P.monthlyTax(g, prop), 'Property tax', b.id);
      const upkeep = Math.round(b.propValue * 0.0006 * (1.6 - prop.cond));
      if (upkeep) TG.F.spend(g, upkeep, 'Building upkeep', b.id);
    }
    const util = Math.round((d.svc ? d.svc.utilPerSpace : d.space.unit === 'acres' ? 1.5 : 0.3) * Math.min(B.space(b), d.space.ideal * 4) * g.world.priceIdx);
    TG.F.spend(g, util, 'Utilities', b.id);
    let ins = 0; for (const t in b.ins) if (b.ins[t]) ins += TG.F.premium(g, b, t);
    TG.F.spend(g, ins, 'Insurance', b.id);
    b.insHike = Math.max(1, (b.insHike || 1) - C.finance.insHikeDecay);
    TG.F.spend(g, B.fixMonthly(g, b), 'Risk reducers & upgrades', b.id);
    if (b.ads && b.ads.budget > 0) TG.F.spend(g, Math.round(b.ads.budget), 'Advertising', b.id);
    const n = TG.S.allStaff(b).length;
    if (n > C.staff.overheadPerStaffAbove) TG.F.spend(g, Math.round((n - C.staff.overheadPerStaffAbove) * C.staff.overheadPerStaff * g.world.priceIdx), 'Bureaucracy & compliance', b.id);
  };

  // ---------- reputation ----------
  B.repMonth = (g, b, ctx) => {
    const C = TG.CONFIG.reputation, d = B.def(b);
    let target = ctx.quality + (C.priceFairness[b.price] || 0) + ((b.fixesOn && b.fixesOn.repTarget) || 0);
    if (ctx.util > 1.0) target -= 5; // turning customers away
    target = U.clamp(target, 0, 100);
    const rate = (d.svc && d.svc.repRate) || C.upRate;
    if (target > b.rep) b.rep = Math.min(target, b.rep + Math.min(rate, (target - b.rep) * 0.12));
    else b.rep = Math.max(target, b.rep - (b.rep - target) * 0.08);
    b.rep = U.clamp(b.rep + R.normal(0, 0.4), 0, 100);
    if (R.chance(C.viralBad * (b.rep < 40 ? 2 : 1))) { const x = R.range(6, 14); b.rep = U.clamp(b.rep - x, 0, 100); TG.rep.event(g, b, 'bad', `A bad review went viral (reputation -${Math.round(x)})`, `Rare event; ${b.rep < 40 ? 'weak reputation makes it more likely' : 'bad luck'}`); }
  };
  B.goodEvents = (g, b, ctx) => {
    const C = TG.CONFIG, d = B.def(b);
    for (const id of d.goodEvents || []) {
      const ev = C.goodEvents[id]; if (!ev) continue;
      if (id === 'bumper') continue;
      if (!R.chance(ev.p * (0.6 + b.rep / 100))) continue;
      const bits = [];
      if (ev.rep) { const x = R.range(ev.rep[0], ev.rep[1]); b.rep = U.clamp(b.rep + x, 0, 100); bits.push(`reputation +${Math.round(x)}`); }
      if (ev.boost) { const x = R.range(ev.boost[0], ev.boost[1]); b.boost = { mult: x, months: 1 }; bits.push(`demand x${x.toFixed(2)} next month`); }
      if (ev.cashRev) { const x = Math.round(ctx.revAvg * R.range(ev.cashRev[0], ev.cashRev[1])); TG.F.earn(g, x, 'Lucky breaks', b.id); bits.push(`+${U.money(x)}`); }
      TG.rep.event(g, b, 'good', ev.label + (bits.length ? ` (${bits.join(', ')})` : ''), `Lucky break (${U.pct(ev.p, 1)} base chance, higher with good reputation)`);
    }
  };

  // demand multiplier shared by models
  B.demandMult = (g, b, ctx, opts) => {
    const d = B.def(b); opts = opts || {};
    const moy = U.moy(g.month);
    let season = d.season[moy];
    const fo = b.fixesOn || {};
    if (fo.seasonDamp) season = 1 + (season - 1) * (1 - fo.seasonDamp);
    if (fo.seasonFloor) season = Math.max(season, fo.seasonFloor);
    let m = season * TG.W.econMult(g, d.econSens) * (g.world.trends[d.cat] || 1) * TG.CONFIG.regions[b.region].demand;
    for (const h of b.hits) m *= h.mult;
    if (b.boost) m *= b.boost.mult;
    const ad = opts.noAds ? { boost: 0 } : B.adBoost(g, b); if (!opts.noAds) { ctx.adFlop = ad.flop; ctx.adBoost = ad.boost; }
    m *= 1 + ad.boost + (fo.demand || 0);
    if (!opts.noPrice) m *= TG.CONFIG.reputation.priceDemand[b.price] || 1;
    m *= 1 - (d.weatherSens || 0) * ctx.weather.sev * 0.35;
    for (const it of b.equip) { const ed = TG.E.def(b, it.type); if (ed && ed.demandBoost && !it.broken) { m *= 1 + ed.demandBoost; break; } }
    return m;
  };

  // ---------- monthly orchestration ----------
  B.month = (g, b) => {
    b.m = { rev: 0, cost: 0, lines: {} };
    B.fixAgg(b);
    const ctx = B.ctx(g, b);
    // license pending (clinic): costs run, no revenue
    if (b.licensePending > 0) {
      b.licensePending--;
      TG.E.month(g, b, ctx); TG.S.month(g, b, ctx); B.fixedCosts(g, b, ctx);
      if (b.licensePending === 0) TG.rep.event(g, b, 'good', `${b.name} received its license and opened`, 'Licensing period complete');
      B.endMonth(g, b, ctx); return ctx;
    }
    if (B.owner(g, b)) g.player.exp[b.type] = (g.player.exp[b.type] || 0) + 1;
    TG.E.month(g, b, ctx);
    B.rollRisks(g, b, ctx);
    TG.M.month(g, b, ctx);
    B.fixedCosts(g, b, ctx);
    TG.S.month(g, b, ctx);
    B.repMonth(g, b, ctx);
    B.goodEvents(g, b, ctx);
    if (ctx.adFlop) TG.rep.event(g, b, 'bad', 'Ad campaign flopped this month', `${TG.CONFIG.reputation.adChannels[b.ads.channel].label} campaigns flop ${U.pct(TG.CONFIG.reputation.adChannels[b.ads.channel].flop)} of the time${b.spec.ads ? '' : '; no ads manager'}`);
    B.endMonth(g, b, ctx);
    return ctx;
  };
  B.endMonth = (g, b, ctx) => {
    B.collect(g, b);
    b.hits = b.hits.filter((h) => --h.months > 0);
    if (b.boost && --b.boost.months <= 0) b.boost = null;
    b.qHits = b.qHits.filter((h) => --h.months > 0);
    b.lastUtil = ctx.util == null ? b.lastUtil : ctx.util;
    const profit = b.m.rev - b.m.cost;
    // investor dividends
    if (b.outside > 0 && profit > 0) { const div = Math.round(profit * b.outside); TG.F.spend(g, div, 'Investor dividends', b.id); }
    const pr = b.m.rev - b.m.cost;
    b.hist.push({ m: g.month, rev: Math.round(b.m.rev), cost: Math.round(b.m.cost), profit: Math.round(pr), rep: Math.round(b.rep), util: ctx.util || 0, lines: b.m.lines });
    if (b.hist.length > TG.CONFIG.maxHistory) b.hist.shift();
    const last3 = b.hist.slice(-3);
    b.revAvg = U.avg(last3, (x) => x.rev);
    b.lastCtx = { quality: Math.round(ctx.quality), skill: Math.round(ctx.skill), morale: Math.round(ctx.morale), cap: ctx.cap, served: ctx.served, demand: ctx.demand, down: ctx.down, adBoost: ctx.adBoost || 0, note: ctx.note || '', limit: ctx.limit || null, limitEquip: ctx.limitEquip || null };
    for (const w of ctx.warnings) TG.rep.warn(g, b, w.text, w.why, w.p);
    // takeover by investors
    const C = TG.CONFIG.finance;
    if (b.outside > C.takeoverOutside) {
      const p12 = U.sum(b.hist.slice(-12), (x) => x.profit);
      const red = b.fixes.terms ? 0.3 : 1;
      if (p12 < 0 && R.chance(C.takeoverChance * red * (b.type === 'tech' ? 1.5 : 1))) {
        const payout = Math.round(TG.F.bizValue(g, b) * (1 - b.outside) * 0.5);
        TG.rep.event(g, b, 'major', `Investors took control of ${b.name} and pushed you out`, `Outside owners hold ${U.pct(b.outside)} and the last 12 months lost money. You were bought out for ${U.money(payout)}.`, { major: 'keyQuit' });
        B.close(g, b, 'investor takeover', false, true);
        TG.F.earn(g, payout, 'Buy-out payment', null, true);
      }
    }
  };

  B.topRisks = (g, b) => {
    const d = B.def(b); const ctx = B.ctx(g, b); const out = [];
    for (const r of d.risks) { if (!r.base) continue; const { p, parts } = B.riskP(g, b, ctx, r); out.push({ label: r.label, p, why: parts.join(', ') }); }
    for (const it of b.equip) if (!it.broken) { const bc = TG.E.breakChance(g, b, it); out.push({ label: `${it.label} #${TG.E.num(b, it)} breaks down`, p: bc.p, why: bc.factors.join(', ') }); }
    for (const x of TG.M.extraRisks(g, b, ctx)) out.push(x);
    return out.sort((a, c) => c.p - a.p);
  };

  B.inventoryValue = (g, b) => TG.M.inventoryValue(g, b);

  B.close = (g, b, why, forced, keepProp) => {
    const fs = forced ? TG.CONFIG.finance.bankruptcy.fireSale : 1;
    for (const it of b.equip) { const v = Math.round(TG.E.resale(g, b, it) * fs); if (v && !forced) TG.F.earn(g, v, 'Asset sales', null, true); else if (v && forced) TG.F.earn(g, v, 'Fire-sale proceeds', null, true); }
    b.equip = [];
    const prop = g.properties.find((p) => p.id === b.propId); if (prop) prop.bizId = null;
    g.businesses = g.businesses.filter((x) => x !== b);
    g.decisions = g.decisions.filter((d) => d.bizId !== b.id);
    if (g.player.ownerBiz === b.id) g.player.ownerBiz = null;
    for (const ls of g.lawsuits) if (ls.bizId === b.id) ls.bizId = null;
    TG.rep.event(g, null, forced ? 'major' : 'info', `${b.name} closed`, why);
  };
  // Sell a business (with its property if owned). mult < 1 for fire sales.
  B.saleValue = (g, b) => {
    const prop = g.properties.find((p) => p.id === b.propId);
    return Math.round(TG.F.bizValue(g, b) * (1 - (b.outside || 0)) + (prop && prop.owned ? TG.P.value(g, prop) * (1 - TG.CONFIG.property.sellCostPct) : 0));
  };
  B.sell = (g, bizId, mult, forced) => {
    const b = B.get(g, bizId); if (!b) return 0;
    const prop = g.properties.find((p) => p.id === b.propId);
    const v = Math.round(B.saleValue(g, b) * (mult || 1));
    b.equip = [];
    B.close(g, b, forced ? 'sold in a forced liquidation' : `sold for ${U.money(v)}`, false);
    TG.F.earn(g, v, forced ? 'Fire-sale proceeds' : 'Business sales', null, true);
    if (prop) { if (prop.mortgageId) TG.F.payoff(g, prop.mortgageId); g.properties = g.properties.filter((p) => p !== prop); }
    return v;
  };
  TG.B = B;
})();

</script>
<script>/* js/models.js */
/* models.js - business models: service (most businesses), farm, freight. models2.js adds brand, factory, projects, tech, franchise. */
(function () {
  const TG = globalThis.TG; const R = TG.R, U = TG.U;
  const M = { models: {} };
  const mdl = (b) => M.models[TG.CONFIG.businesses[b.type].model];
  M.init = (g, b, prop, opts) => { const m = mdl(b); if (m.init) m.init(g, b, prop, opts || {}); };
  M.needs = (g, b) => mdl(b).needs(g, b);
  M.month = (g, b, ctx) => mdl(b).month(g, b, ctx);
  M.baseRev = (g, b) => U.num(mdl(b).baseRev(g, b), 10000);
  M.extraRisks = (g, b, ctx) => (mdl(b).extraRisks ? mdl(b).extraRisks(g, b, ctx) : []);
  M.inventoryValue = (g, b) => (mdl(b).inventoryValue ? U.num(mdl(b).inventoryValue(g, b)) : 0);
  M.keyRole = (d) => Object.keys(d.roles).find((r) => d.roles[r].key);
  M.staffEff = (e) => (0.6 + e.skill / 250) * (1 - TG.CONFIG.staff.noShowBase * (1.6 - e.reliability / 100));
  M.paceMult = (b) => (b.pace === 'rush' ? 1.15 : b.pace === 'careful' ? 0.92 : 1);
  M.priceMult = (b) => TG.CONFIG.reputation.priceMult[b.price] || 1;
  M.repF = (b, exp) => U.clamp(Math.pow(Math.max(b.rep, 3) / 50, exp == null ? 1 : exp), 0.04, 2.6);

  // ============ SERVICE ============
  M.models.service = {
    spaceCap(b) { const s = TG.CONFIG.businesses[b.type].svc; return s.mobile ? Infinity : b.sqft * s.perSpace; },
    demandBase(g, b) {
      const d = TG.CONFIG.businesses[b.type], s = d.svc;
      if (s.occupancy) return this.spaceCap(b) * s.occupancy;
      const tf = s.mobile ? 0.55 + 0.6 * b.traffic : 0.25 + 0.95 * Math.pow(b.traffic, 0.8);
      return s.baseDemand * tf;
    },
    baseRev(g, b) { const s = TG.CONFIG.businesses[b.type].svc; return Math.min(this.demandBase(g, b), this.spaceCap(b)) * s.ticket * g.world.priceIdx; },
    needs(g, b) {
      const d = TG.CONFIG.businesses[b.type]; const est = Math.min(this.demandBase(g, b) * M.repF(b, d.svc.repExp) * 1.1, this.spaceCap(b));
      const out = { equip: [], staff: [] };
      for (const ed of d.equip) {
        if (ed.support) out.equip.push({ type: ed.id, count: 1 });
        else if (ed.critical) out.equip.push({ type: ed.id, count: Math.max(1, Math.ceil(est / ed.cap)) });
      }
      for (const r in d.roles) {
        const rd = d.roles[r];
        if (rd.key) out.staff.push({ role: r, count: Math.max(rd.min || 0, Math.ceil(est / (rd.cap * 0.8)) - (B().owner(g, b) && d.tier === 'small' ? 1 : 0), d.tier === 'small' ? 0 : 1) });
        else if (rd.support) out.staff.push({ role: r, count: Math.max(0, Math.round(est / rd.per - 0.5)) });
      }
      return out;
    },
    month(g, b, ctx) {
      const C = TG.CONFIG, d = C.businesses[b.type], s = d.svc;
      let keyCap = 0; const kr = M.keyRole(d);
      for (const e of ctx.key) keyCap += d.roles[e.role].cap * M.staffEff(e);
      if (ctx.own && d.tier === 'small') keyCap += d.roles[kr].cap * 0.6;
      let supCap = Infinity;
      for (const r in d.roles) if (d.roles[r].support) { const have = b.staff.filter((e) => e.role === r).length; supCap = Math.min(supCap, (have + 0.5) * d.roles[r].per); }
      let eqCap = Infinity, prod = 1;
      let limEq = null;
      for (const ed of d.equip) { if (ed.support) continue; const c = TG.E.capacity(b, ed.id); if (ed.critical) { if (c < eqCap) limEq = ed.id; eqCap = Math.min(eqCap, c); } else if (c > 0 && !ed.demandBoost) prod *= 1.06; }
      const spaceCap = this.spaceCap(b);
      const cap = Math.max(0, Math.min(keyCap * prod, eqCap, spaceCap, supCap) * M.paceMult(b) * (1 - ctx.down));
      const qualF = 0.85 + 0.3 * ctx.quality / 100;
      let demand = this.demandBase(g, b) * M.repF(b, s.repExp) * qualF * B().demandMult(g, b, ctx);
      if (s.staffDemand && ctx.key.length) demand *= 1 + s.staffDemand * (ctx.skill - 50) / 100;
      const served = Math.min(demand, cap);
      const ticket = s.ticket * M.priceMult(b) * ((b.fixesOn && b.fixesOn.ticketMult) || 1) * g.world.priceIdx;
      const rev = served * ticket;
      if (d.receivable) B().addRecv(g, b, rev, d.receivable.delay - (b.fixes.billing ? 1 : 0));
      else TG.F.earn(g, rev, 'Revenue', b.id);
      const fo = b.fixesOn || {};
      let cogsPct = s.cogs + (fo.cogsAdd || 0) - (ctx.own ? C.owner.operatedCogsCut : 0);
      if (g.world.shortage[d.cat]) cogsPct *= 1.15;
      TG.F.spend(g, Math.round(rev * Math.max(0, cogsPct)), 'Supplies & cost of sales', b.id);
      if (s.ota) TG.F.spend(g, Math.round(rev * s.ota * (fo.otaCut ? 1 - fo.otaCut : 1)), 'Booking site fees', b.id);
      if (fo.revCostPct) TG.F.spend(g, Math.round(rev * fo.revCostPct), 'Commissions & warranties', b.id);
      ctx.cap = Math.round(cap); ctx.demand = Math.round(demand); ctx.served = Math.round(served);
      ctx.limitEquip = limEq;
      ctx.limit = keyCap * prod <= Math.min(eqCap, spaceCap, supCap) ? 'staff' : eqCap <= Math.min(spaceCap, supCap) ? 'equipment' : spaceCap <= supCap ? 'space' : 'support';
      ctx.util = cap > 0 ? demand / cap : 1.5; ctx.busy = cap > 0 ? served / cap : 1;
      if (cap === 0) ctx.note = 'No capacity: you need ' + (keyCap === 0 ? 'key staff' : eqCap === 0 ? 'working critical equipment' : 'space');
      else if (demand > cap * 1.15) ctx.note = `Turning away ${U.pct(1 - cap / demand)} of customers: capacity limited by ${keyCap * prod <= Math.min(eqCap, spaceCap, supCap) ? 'staff' : eqCap <= Math.min(spaceCap, supCap) ? 'equipment' : spaceCap <= supCap ? 'space (hard cap)' : 'support staff'}`;
      else if (demand < cap * 0.6) ctx.note = 'Lots of idle capacity: more customers needed (marketing, reputation, location)';
    },
  };
  const B = () => TG.B;

  // ============ FARM ============
  M.farmHerdCap = (prop, e) => Math.round(prop.acres * e.headPerAcre * (0.6 + 0.4 * prop.water) * (0.7 + 0.3 * prop.soil));
  M.bestEnterprise = (prop) => (prop.orchard ? 'orchard' : prop.landType === 'grassland' || prop.landType === 'dry' || prop.landType === 'hillside' ? 'cattle' : 'crops');
  M.isHarvest = (g, b) => { const e = TG.CONFIG.businesses.farm.farm.enterprises[b.farm.ent]; return !!(e.harvest && e.harvest.indexOf(U.moy(g.month)) >= 0); };
  M.models.farm = {
    init(g, b, prop, opts) {
      const fd = TG.CONFIG.businesses.farm.farm; const ent = opts.ent || M.bestEnterprise(prop);
      b.farm = { ent, acres: prop.acres, irrigated: 0, storageCap: 0, stored: 0, seasonYield: 1, planted: 0, toHarvest: 0, futures: [], herd: 0,
        orchardAge: prop.orchard ? 999 : 0, sellPolicy: 'sell', landType: prop.landType, soil: prop.soil, water: prop.water, yearTons: 0, lastHarvest: null, plantBroken: false };
      if (ent === 'cattle') b.farm.herd = Math.round(M.farmHerdCap(prop, fd.enterprises.cattle) * 0.5);
    },
    e(b) { return TG.CONFIG.businesses.farm.farm.enterprises[b.farm.ent]; },
    tractorNeed(b) { const e = this.e(b); return Math.max(1, b.farm.acres / e.acresPerTractor); },
    handNeed(b) { const e = this.e(b); return Math.max(0.3, b.farm.ent === 'cattle' ? b.farm.herd / e.headPerHand : b.farm.acres / e.acresPerHand); },
    needs(g, b) {
      const own = B().owner(g, b);
      return { equip: [{ type: 'tractor', count: Math.ceil(this.tractorNeed(b) - 0.15) }], staff: [{ role: 'hand', count: Math.max(own ? 0 : 1, Math.ceil(this.handNeed(b) - (own ? 0.7 : 0))) }] };
    },
    baseRev(g, b) {
      const f = b.farm; const e = this.e(b);
      if (f.ent === 'cattle') return f.herd * TG.CONFIG.markets.beef.base * e.saleRate / 12 * g.world.priceIdx;
      return f.acres * e.yield * TG.CONFIG.markets[e.market].base / 12 * g.world.priceIdx;
    },
    cover(g, b, ctx) {
      const f = b.farm, e = this.e(b);
      let tcap = 0, robotCap = 0;
      for (const it of b.equip) { const ed = TG.E.def(b, it.type); if (!ed) continue; if (it.type === 'tractor' || ed.countsAs === 'tractor') { const c = ed.cap * TG.E.out(it); tcap += c; if (ed.efficiency) robotCap += c; } }
      const tneed = this.tractorNeed(b);
      const robotShare = tcap > 0 ? robotCap / tcap : 0;
      let heff = U.sum(ctx.key, M.staffEff) + (ctx.own ? 0.7 : 0);
      const hneed = this.handNeed(b) * (1 - robotShare * 0.85 * Math.min(1, tcap / tneed));
      return { tcov: U.clamp(tcap / tneed, 0, 1), hcov: U.clamp(heff / Math.max(0.3, hneed), 0, 1), tcap, tneed };
    },
    weather(g, b, ctx, growing) {
      const f = b.farm, e = this.e(b), C = TG.CONFIG, w = ctx.weather, lt = C.landTypes[f.landType] || C.landTypes.flat;
      const irr = f.acres ? f.irrigated / f.acres : 0;
      if (!growing) return;
      let m = 1, why = '';
      if (w.kind === 'drought') { m = 1 - 0.28 * (e.droughtSens || 0.8) * (1 - irr * C.businesses.farm.farm.irrigationDroughtCut); why = `Drought; ${U.pct(irr)} of land irrigated`; }
      else if (w.kind === 'heat') { m = 1 - 0.08 * (1 - irr); why = 'Heat wave'; }
      else if (w.kind === 'frost') { m = 1 - 0.22 * (e.frostSens || 0.5) * lt.frost; why = `Frost; land frost risk x${lt.frost}`; }
      else if (w.kind === 'storm') { m = 0.96; why = 'Storm damage'; }
      if ((w.kind === 'flood' && lt.flood > 0.005) || R.chance(lt.flood / 6)) { m = Math.min(m, R.range(0.35, 0.7)); why = `Flooding on ${lt.label.toLowerCase()} (flood risk ${U.pct(lt.flood, 0)}/yr)`; }
      if (m < 0.995) { f.seasonYield *= m; TG.rep.event(g, b, m < 0.8 ? 'major' : 'bad', `${why.split(';')[0]} hurt the crop outlook (x${m.toFixed(2)})`, why, m < 0.8 ? { major: 'weather' } : null); }
      if (R.chance(C.goodEvents.bumper.p / 4)) { const x = R.range(C.goodEvents.bumper.yield[0], C.goodEvents.bumper.yield[1]); f.seasonYield *= x; TG.rep.event(g, b, 'good', `Bumper crop conditions (outlook x${x.toFixed(2)})`, 'Ideal weather this month'); }
    },
    sell(g, b, tons, label) {
      const f = b.farm, e = this.e(b), C = TG.CONFIG;
      let rev = 0;
      // futures first
      for (const fu of f.futures) { if (tons <= 0) break; const q = Math.min(fu.qty - fu.done, tons); if (q <= 0) continue; fu.done += q; tons -= q; rev += q * fu.price; }
      f.futures = f.futures.filter((fu) => fu.done < fu.qty || fu.month === g.month);
      const plant = b.fixes.plant && !f.plantBroken && f.yearTons >= C.businesses.farm.fixes.find((x) => x.id === 'plant').minVolume * 0.5;
      const vm = plant ? C.businesses.farm.fixes.find((x) => x.id === 'plant').valueMult : 1;
      let stored = 0;
      if (tons > 0) {
        const policy = f.sellPolicy === 'auto' ? TG.D.farmPolicy(g, b) : f.sellPolicy;
        if (policy === 'store' && e.market !== 'beef') { stored = Math.min(tons, Math.max(0, f.storageCap - f.stored)); f.stored += stored; tons -= stored; }
        if (tons > 0) { const p = TG.W.price(g, e.market, tons / 2) * vm; rev += tons * p; TG.W.sell(g, e.market, tons); }
      }
      if (rev > 0) TG.F.earn(g, Math.round(rev), label || 'Crop sales', b.id);
      return { rev, stored };
    },
    month(g, b, ctx) {
      const C = TG.CONFIG, f = b.farm, e = this.e(b), fd = C.businesses.farm.farm, moy = U.moy(g.month);
      f.acres = Math.max(f.acres, 1);
      const cov = this.cover(g, b, ctx);
      const soilF = 1 + (e.soilW || 0.3) * (f.soil - 0.6) * 2;
      const irr = f.irrigated / f.acres;
      const waterF = 1 + (e.waterW || 0.3) * (Math.max(f.water, irr * 0.85) - 0.6) * 2;
      const inputCut = b.fixes.integrate ? 0.2 : 0;
      const qMult = 0.9 + 0.2 * ctx.quality / 100;
      ctx.cap = Math.round(f.acres); ctx.util = Math.min(cov.tcov, cov.hcov); ctx.busy = 1 / Math.max(0.3, ctx.util);
      // storage costs & spoilage
      if (f.stored > 0) {
        TG.F.spend(g, Math.round(f.stored * e.storageCost * g.world.priceIdx), 'Storage', b.id);
        const sp = f.stored * e.spoil; f.stored -= sp;
        const policy = f.sellPolicy === 'auto' ? TG.D.farmPolicy(g, b) : f.sellPolicy;
        if (policy === 'sell') { this.sellStored(g, b, f.stored); }
      }
      // processing plant breakdowns
      f.plantBroken = false;
      if (b.fixes.plant && R.chance(0.012)) { f.plantBroken = true; const c = Math.round(9000000 * 0.02); TG.F.spend(g, c, 'Repairs', b.id); TG.rep.event(g, b, 'major', `Processing plant broke down (${U.money(c)} repair, no processing this month)`, '1.2% monthly plant failure chance', { major: 'breakdown' }); }
      for (const it of b.equip) { const ed = TG.E.def(b, it.type); if (ed && ed.glitch && !it.broken && R.chance(ed.glitch)) { it.broken = 'major'; TG.rep.event(g, b, 'bad', `Software glitch took a robot tractor offline`, `${U.pct(ed.glitch)} monthly glitch chance; specialist repairs cost double`); TG.E.queueBroken(g, b, it); } }

      if (f.ent === 'crops') {
        const growing = moy >= 3 && moy <= 9;
        if (e.plant.indexOf(moy) >= 0) {
          const want = f.acres / e.plant.length; const pc = Math.min(cov.tcov, Math.pow(cov.hcov, 0.5));
          let acres = want * pc;
          const costPer = e.inputPerAcre * g.world.priceIdx * (1 - inputCut);
          const afford = Math.max(0, g.cash) / costPer;
          if (acres > afford) { TG.rep.event(g, b, 'bad', `Could only afford seed for ${Math.round(afford)} of ${Math.round(acres)} acres`, 'Cash crunch at planting time'); acres = afford; }
          TG.F.spend(g, Math.round(acres * costPer), 'Seed, fertilizer & fuel', b.id);
          f.planted += acres;
          if (pc < 0.95) TG.rep.event(g, b, 'bad', `Only planted ${Math.round(acres)} of ${Math.round(want)} acres this month`, `Tractor coverage ${U.pct(cov.tcov)} (${cov.tcap.toFixed(1)} of ${cov.tneed.toFixed(1)} needed), farmhand coverage ${U.pct(cov.hcov)}`);
          if (moy === e.plant[e.plant.length - 1]) f.toHarvest = f.planted;
        }
        this.weather(g, b, ctx, growing && f.planted > 0);
        if (e.harvest.indexOf(moy) >= 0 && f.toHarvest > 0) this.harvest(g, b, ctx, cov, f.toHarvest / e.harvest.length, soilF * waterF * qMult);
        if (moy === e.harvest[e.harvest.length - 1]) this.endSeason(g, b);
      } else if (f.ent === 'orchard') {
        f.orchardAge++;
        const prodShare = U.clamp(f.orchardAge / e.rampMonths, 0, 1);
        TG.F.spend(g, Math.round(f.acres * e.inputPerAcre / 12 * g.world.priceIdx * (1 - inputCut) * (0.35 + 0.65 * prodShare)), 'Orchard upkeep', b.id);
        this.weather(g, b, ctx, moy >= 2 && moy <= 8);
        if (e.harvest.indexOf(moy) >= 0) {
          if (prodShare < 0.05) { if (moy === e.harvest[0]) TG.rep.event(g, b, 'info', 'Young orchard: no fruit yet', `${f.orchardAge} of ${e.rampMonths} months to full production`); }
          else this.harvest(g, b, ctx, cov, f.acres * prodShare / e.harvest.length, soilF * waterF * qMult);
        }
        if (moy === e.harvest[e.harvest.length - 1]) this.endSeason(g, b);
      } else this.cattle(g, b, ctx, cov, soilF, waterF);
      ctx.served = Math.round(f.acres * ctx.util);
      if (cov.tcov < 1) ctx.note = `Tractor coverage ${U.pct(cov.tcov)}: ${cov.tcap.toFixed(1)} of ${cov.tneed.toFixed(1)} tractors' worth working`;
      else if (cov.hcov < 1) ctx.note = `Short on farmhands (${U.pct(cov.hcov)} coverage)`;
    },
    harvest(g, b, ctx, cov, acres, mult) {
      const C = TG.CONFIG, f = b.farm, e = this.e(b);
      const hc = Math.min(1, cov.tcov) * (0.45 + 0.55 * cov.hcov);
      const full = acres * e.yield * f.seasonYield * mult;
      const tons = full * hc;
      TG.F.spend(g, Math.round(acres * e.seasonalPerAcre * g.world.wageIdx * (b.labor < 0.2 ? 1.25 : 1)), 'Seasonal labor', b.id);
      const res = this.sell(g, b, tons, e.market === 'fruit' ? 'Fruit sales' : 'Crop sales');
      f.yearTons += tons;
      const lost = full - tons;
      const broken = b.equip.filter((x) => (x.type === 'tractor' || TG.E.def(b, x.type).countsAs === 'tractor') && x.broken);
      TG.rep.event(g, b, 'good', `Harvested ${Math.round(tons).toLocaleString()} tons (${U.money(res.rev)} sold${res.stored ? ', ' + Math.round(res.stored) + ' t stored' : ''})`, `Season outlook x${f.seasonYield.toFixed(2)}, soil ${Math.round(f.soil * 100)}, water ${Math.round(f.water * 100)}, harvest coverage ${U.pct(hc)}`);
      if (lost > full * 0.1) TG.rep.event(g, b, 'major', `${Math.round(lost).toLocaleString()} tons rotted in the field`, broken.length ? `${broken.map((x) => x.label + ' #' + TG.E.num(b, x) + ' (' + (x.age / 12).toFixed(0) + ' yrs, ' + Math.round(TG.E.effWear(x)) + '% wear)').join(', ')} broken during harvest; tractor coverage ${U.pct(cov.tcov)}` : `Tractor coverage ${U.pct(cov.tcov)}, farmhand coverage ${U.pct(cov.hcov)}`, { major: 'harvest' });
      f.lastHarvest = { m: g.month, tons: Math.round(tons), lost: Math.round(lost) };
    },
    endSeason(g, b) {
      const f = b.farm;
      for (const fu of f.futures) if (fu.done < fu.qty) {
        const short = fu.qty - fu.done; const cost = Math.round(short * TG.W.price(g, this.e(b).market, 0) * 1.05);
        TG.F.spend(g, cost, 'Futures shortfall', b.id);
        TG.rep.event(g, b, 'bad', `Futures contract short by ${Math.round(short)} t: bought back for ${U.money(cost)}`, 'Harvest came in below the amount you locked');
      }
      f.futures = []; f.planted = 0; f.toHarvest = 0; f.seasonYield = 1; f.yearTons = 0;
    },
    sellStored(g, b, tons) {
      const f = b.farm, e = this.e(b); tons = Math.min(tons, f.stored); if (tons <= 0) return 0;
      const p = TG.W.price(g, e.market, tons / 2); const rev = Math.round(tons * p);
      f.stored -= tons; TG.W.sell(g, e.market, tons); TG.F.earn(g, rev, 'Crop sales', b.id); return rev;
    },
    cattle(g, b, ctx, cov, soilF, waterF) {
      const C = TG.CONFIG, f = b.farm, e = this.e(b), moy = U.moy(g.month);
      const cap = Math.max(1, Math.round(f.acres * e.headPerAcre * (0.6 + 0.4 * f.water) * (0.7 + 0.3 * f.soil)));
      const over = f.herd / cap;
      if ([2, 3, 4].indexOf(moy) >= 0) f.herd += f.herd * 0.5 * e.calving / 3 * (0.6 + 0.4 * cov.hcov);
      const deaths = f.herd * (0.003 + (1 - cov.hcov) * 0.02 + Math.max(0, over - 1) * 0.02);
      f.herd = Math.max(0, f.herd - deaths);
      if (R.chance(e.diseaseBase * (1 + Math.max(0, over - 1) * 3) * (b.spec.ops ? 0.6 : 1))) {
        const x = R.range(0.05, 0.2); const lost = Math.round(f.herd * x); f.herd -= lost;
        TG.rep.event(g, b, 'major', `Herd disease: lost ${lost} head`, `${U.pct(e.diseaseBase * (1 + Math.max(0, over - 1) * 3), 1)} monthly chance; herd at ${U.pct(over)} of pasture capacity`, { major: 'harvest' });
      }
      const drought = ctx.weather.kind === 'drought' || ctx.weather.kind === 'heat';
      const feed = f.herd * e.feed * g.world.priceIdx * (drought ? e.droughtFeed * (1 - (f.irrigated / f.acres) * 0.6) : 1) * (over > 1 ? 1 + (over - 1) * 2 : 1) * (1 + 0.3 * (1 - cov.tcov)) * (b.fixes.integrate ? 0.8 : 1);
      TG.F.spend(g, Math.round(feed), 'Feed & hay', b.id);
      let sell = f.herd * e.saleRate / 12 * (f.sellPolicy === 'store' ? 0.3 : 1);
      if (over > 1.05) sell += f.herd - cap;
      sell = Math.max(0, Math.min(sell, f.herd)); f.herd -= sell;
      const q = 0.9 + 0.2 * ctx.quality / 100;
      const price = TG.W.price(g, 'beef', sell / 2) * q * (b.fixes.plant && !f.plantBroken ? 1.2 : 1);
      if (sell > 0) { TG.F.earn(g, Math.round(sell * price), 'Cattle sales', b.id); TG.W.sell(g, 'beef', sell); }
      if (drought) TG.rep.event(g, b, 'bad', 'Drought: feed costs up', `Feed x${e.droughtFeed}; irrigation helps`);
      ctx.cap = cap; ctx.served = Math.round(f.herd);
    },
    baseYieldNote(b) { return ''; },
    extraRisks(g, b, ctx) {
      const cov = this.cover(g, b, ctx); const out = [];
      if (cov.tcov < 1) out.push({ label: 'Not enough working tractors for planting / harvest', p: 1 - cov.tcov, why: `${cov.tcap.toFixed(1)} of ${cov.tneed.toFixed(1)} tractors' worth working` });
      if (cov.hcov < 1) out.push({ label: 'Not enough farmhands', p: 1 - cov.hcov, why: 'Coverage below 100%' });
      return out;
    },
    inventoryValue(g, b) {
      const f = b.farm, e = this.e(b);
      let v = f.stored * TG.W.price(g, e.market, 0) * 0.9;
      if (f.ent === 'cattle') v += f.herd * TG.W.price(g, 'beef', 0) * 0.7;
      return Math.round(v);
    },
  };
  // farm actions
  M.farmBuyLand = (g, b, acres, mortgage) => {
    acres = Math.round(acres); if (!(acres > 0)) return { ok: false, msg: 'Enter acres.' };
    const prop = g.properties.find((p) => p.id === b.propId);
    const L = TG.CONFIG.locations[b.loc];
    const per = L.ppa * (0.75 + 0.5 * b.farm.soil) * TG.CONFIG.regions[b.region].price * g.world.housing * TG.CONFIG.businesses.farm.farm.landPriceMult * (1 + acres / 20000);
    const cost = Math.round(acres * per);
    if (mortgage) {
      const down = Math.round(cost * TG.CONFIG.property.mortgageDown);
      if (g.cash < down) return { ok: false, msg: `Need ${U.money(down)} down.` };
      const ok = TG.F.canBorrow(g, 'mortgage', cost - down); if (!ok.ok) return ok;
      TG.F.spend(g, down, 'Land purchases', null, true);
      TG.F.newLoan(g, 'mortgage', cost - down, { collateral: { kind: 'property', id: prop.id }, label: `Land mortgage (${acres} ac)`, bizId: b.id, noCash: true });
    } else { if (g.cash < cost) return { ok: false, msg: `Costs ${U.money(cost)}.` }; TG.F.spend(g, cost, 'Land purchases', null, true); }
    b.farm.acres += acres; b.acres = b.farm.acres;
    if (prop) { prop.acres += acres; if (prop.owned) prop.baseValue = (prop.baseValue || prop.price) + cost * (prop.housingAtBuy || 1) / g.world.housing; else prop.landOwned = (prop.landOwned || 0) + cost / g.world.housing; }
    if (b.farm.ent === 'orchard') { const est = Math.round(acres * TG.CONFIG.businesses.farm.farm.enterprises.orchard.establishPerAcre * g.world.priceIdx); TG.F.spend(g, est, 'Orchard planting', b.id, true); }
    TG.rep.event(g, b, 'info', `Bought ${acres} acres of neighbouring land for ${U.money(cost)}`, `${U.money(per)} per acre`);
    return { ok: true, cost };
  };
  M.farmLandPrice = (g, b) => { const L = TG.CONFIG.locations[b.loc]; return L.ppa * (0.75 + 0.5 * b.farm.soil) * TG.CONFIG.regions[b.region].price * g.world.housing * TG.CONFIG.businesses.farm.farm.landPriceMult; };
  M.farmIrrigate = (g, b, acres) => {
    const fd = TG.CONFIG.businesses.farm.farm; acres = Math.min(Math.round(acres), b.farm.acres - b.farm.irrigated); if (acres <= 0) return { ok: false, msg: 'All land is irrigated.' };
    const cost = Math.round(acres * fd.irrigationPerAcre * g.world.priceIdx); if (g.cash < cost) return { ok: false, msg: `Costs ${U.money(cost)}.` };
    TG.F.spend(g, cost, 'Irrigation', b.id, true); b.farm.irrigated += acres; return { ok: true, cost };
  };
  M.farmStorage = (g, b, tons) => {
    const cost = Math.round(tons * 20 * g.world.priceIdx); if (g.cash < cost) return { ok: false, msg: `Costs ${U.money(cost)}.` };
    TG.F.spend(g, cost, 'Storage construction', b.id, true); b.farm.storageCap += Math.round(tons); return { ok: true, cost };
  };
  M.farmFutures = (g, b, qty) => {
    const f = b.farm, e = M.models.farm.e(b), fd = TG.CONFIG.businesses.farm.farm;
    if (f.ent === 'cattle') return { ok: false, msg: 'Futures are for crops and fruit.' };
    const expected = (f.ent === 'crops' ? f.acres : f.acres * U.clamp(f.orchardAge / e.rampMonths, 0, 1)) * e.yield;
    const locked = U.sum(f.futures, (x) => x.qty);
    qty = Math.min(Math.round(qty), Math.round(expected * fd.futuresMax - locked)); if (qty <= 0) return { ok: false, msg: `You can lock at most ${U.pct(fd.futuresMax)} of expected harvest.` };
    const price = TG.W.price(g, e.market, 0) * fd.futuresDiscount;
    f.futures.push({ qty, price, done: 0, month: g.month });
    return { ok: true, qty, price };
  };
  M.farmBuyCattle = (g, b, head) => {
    const e = TG.CONFIG.businesses.farm.farm.enterprises.cattle; head = Math.round(head); const cost = Math.round(head * e.stockCost * g.world.priceIdx);
    if (g.cash < cost) return { ok: false, msg: `Costs ${U.money(cost)}.` }; TG.F.spend(g, cost, 'Livestock purchases', b.id, true); b.farm.herd += head; return { ok: true, cost };
  };
  M.farmSwitch = (g, b, ent) => {
    const fd = TG.CONFIG.businesses.farm.farm; if (ent === b.farm.ent) return { ok: false };
    let cost = 0; const prop = g.properties.find((p) => p.id === b.propId);
    if (ent === 'orchard') cost = b.farm.acres * fd.enterprises.orchard.establishPerAcre * g.world.priceIdx;
    if (ent === 'cattle') cost = Math.round(M.farmHerdCap(prop || { acres: b.farm.acres, water: b.farm.water, soil: b.farm.soil }, fd.enterprises.cattle) * 0.4) * fd.enterprises.cattle.stockCost * g.world.priceIdx;
    cost = Math.round(cost);
    if (g.cash < cost) return { ok: false, msg: `Switching costs ${U.money(cost)}.` };
    TG.F.spend(g, cost, 'Farm conversion', b.id, true);
    if (b.farm.ent === 'cattle' && b.farm.herd > 0) { const v = Math.round(b.farm.herd * TG.W.price(g, 'beef', b.farm.herd / 2) * 0.85); TG.F.earn(g, v, 'Cattle sales', b.id, true); b.farm.herd = 0; }
    b.farm.ent = ent; b.farm.planted = 0; b.farm.toHarvest = 0; b.farm.seasonYield = 1; b.farm.futures = [];
    if (ent === 'orchard') b.farm.orchardAge = 0;
    if (ent === 'cattle') b.farm.herd = Math.round(M.farmHerdCap(prop || { acres: b.farm.acres, water: b.farm.water, soil: b.farm.soil }, fd.enterprises.cattle) * 0.4);
    return { ok: true, cost };
  };

  // ============ FREIGHT ============
  M.models.freight = {
    needs(g, b) { const n = Math.max(1, b.equip.filter((x) => x.type === 'truck').length); return { equip: [{ type: 'truck', count: n }], staff: [{ role: 'driver', count: B().owner(g, b) ? Math.max(0, n - 1) : n }] }; },
    baseRev(g, b) { return Math.max(1, b.equip.filter((x) => x.type === 'truck').length) * 13 * TG.CONFIG.markets.freight.base * g.world.priceIdx; },
    month(g, b, ctx) {
      const C = TG.CONFIG, d = C.businesses.freight, fr = d.freight, w = g.world;
      const fo = b.fixesOn || {};
      const trucks = b.equip.filter((x) => x.type === 'truck');
      const roadM = 0.72 + 0.35 * b.traffic * 0 + 0.35 * (g.properties.find((p) => p.id === b.propId) || { road: 0.6 }).road;
      const truckCap = U.sum(trucks, (x) => TG.E.out(x) * d.equip[0].cap) * roadM * (fo.loadMult || 1);
      let driverCap = U.sum(ctx.key, (e) => d.roles.driver.cap * (0.7 + e.skill / 300) * (1 - C.staff.noShowBase * (1.6 - e.reliability / 100)));
      if (ctx.own) driverCap += d.roles.driver.cap * 0.6;
      let cap = Math.min(truckCap, driverCap) * (w.hoursReg > 0 ? 0.9 : 1) * M.paceMult(b) * (1 - ctx.down);
      const st = g.markets.freight;
      const avail = U.clamp(0.78 + 0.22 * (b.rep / 50) - 0.35 * (st.comp - 1), 0.35, 1.05) * B().demandMult(g, b, ctx, { noPrice: true });
      const loads = Math.max(0, Math.min(cap, cap * avail));
      const price = TG.W.price(g, 'freight', loads * 6);
      TG.F.earn(g, Math.round(loads * price), 'Freight revenue', b.id); TG.W.sell(g, 'freight', loads);
      const road = (g.properties.find((p) => p.id === b.propId) || { road: 0.6 }).road;
      const fuelIdx = b.hedge && b.hedge.until > g.month ? b.hedge.idx : w.fuel;
      TG.F.spend(g, Math.round(loads * fr.fuelPerLoad * fuelIdx * Math.pow(2 - road, 0.3) * (1 - (fo.fuelCut || 0)) * (w.emissions > 0 ? 1.05 : 1) * w.priceIdx), 'Fuel', b.id);
      TG.F.spend(g, Math.round(loads * fr.tollsPerLoad * w.priceIdx), 'Tolls & fees', b.id);
      // crashes per active truck
      const active = Math.min(trucks.filter((x) => !x.broken).length, Math.ceil(loads / 12));
      for (let i = 0; i < active; i++) {
        const t = trucks.filter((x) => !x.broken)[i]; if (!t) break;
        const p = fr.crashBase * (1.6 - ctx.skill / 100) * (0.5 + TG.E.effWear(t) / 60) * (b.pace === 'rush' ? 1.6 : b.pace === 'careful' ? 0.75 : 1) * (b.fixes.safetytrain ? 0.6 : 1) * (b.spec.safety ? 0.6 : 1) * (w.hoursReg > 0 ? 0.85 : 1) * ctx.streakMult;
        if (R.chance(p)) {
          t.broken = R.chance(0.4) ? 'destroyed' : 'major';
          const why = `${U.pct(p, 2)} monthly crash chance per truck: driver skill ${Math.round(ctx.skill)}, truck wear ${Math.round(TG.E.effWear(t))}%, ${b.pace} pace${b.fixes.safetytrain ? ', safety training' : ', no safety training'}`;
          TG.rep.event(g, b, 'major', `${t.label} #${TG.E.num(b, t)} crashed`, why, { major: 'breakdown' });
          if (t.broken === 'destroyed') TG.F.claim(g, b, 'equipment', TG.E.resale(g, b, Object.assign({}, t, { broken: null })), 'truck crash');
          TG.E.queueBroken(g, b, t);
          B().lawsuit(g, b, 'Truck crash lawsuit', R.range(fr.crashSuit[0], fr.crashSuit[1]) * w.priceIdx, 'liability', why);
          b.rep = U.clamp(b.rep - R.range(2, 6), 0, 100);
        }
      }
      ctx.cap = Math.round(cap); ctx.served = Math.round(loads); ctx.demand = Math.round(cap * avail);
      ctx.util = cap > 0 ? avail : 1; ctx.busy = U.clamp(avail, 0, 1.2);
      if (truckCap > driverCap * 1.2) ctx.note = 'Trucks sitting idle: not enough drivers';
      else if (driverCap > truckCap * 1.2) ctx.note = 'Drivers waiting: not enough working trucks';
      if (avail < 0.7) ctx.note = 'Too many trucks chasing the same freight: loads are scarce';
    },
    extraRisks(g, b, ctx) {
      const fr = TG.CONFIG.businesses.freight.freight; const t = b.equip.filter((x) => x.type === 'truck' && !x.broken);
      if (!t.length) return [];
      const p = fr.crashBase * (1.6 - ctx.skill / 100) * (0.5 + TG.E.avgWear(b) / 60) * (b.fixes.safetytrain ? 0.6 : 1) * (b.spec.safety ? 0.6 : 1) * t.length;
      return [{ label: 'A truck crash (lawsuit)', p: 1 - Math.pow(1 - p / t.length, t.length), why: `${t.length} trucks on the road, driver skill ${Math.round(ctx.skill)}` }];
    },
  };
  M.freightHedge = (g, b) => {
    const cost = Math.round(b.equip.filter((x) => x.type === 'truck').length * 13 * 12 * 620 * 0.02 * g.world.priceIdx);
    if (g.cash < cost) return { ok: false, msg: `Hedge costs ${U.money(cost)}.` };
    TG.F.spend(g, cost, 'Fuel hedging', b.id, true);
    b.hedge = { idx: g.world.fuel * 1.03, until: g.month + 12 };
    return { ok: true, cost };
  };
  TG.M = M;
})();

</script>
<script>/* js/models2.js */
/* models2.js - brand (e-commerce), factory, projects (construction), tech, franchise models. */
(function () {
  const TG = globalThis.TG; const R = TG.R, U = TG.U; const M = TG.M;
  const B = () => TG.B;
  const poisson = (l) => { let k = 0, p = Math.exp(-Math.min(l, 50)), s = p; const u = R.next(); while (u > s && k < 200) { k++; p *= l / k; s += p; } return k; };

  // ============ BRAND / E-COMMERCE ============
  M.models.brand = {
    init(g, b) { b.brand = { stock: 0, stockCost: 0, incoming: [], followers: 0, lastOrders: 0, lostSales: 0 }; },
    needs() { return { equip: [{ type: 'shelving', count: 1 }], staff: [] }; },
    baseRev(g, b) { return Math.max(25000, (b.brand ? b.brand.lastOrders : 0) * 42) * g.world.priceIdx; },
    month(g, b, ctx) {
      const C = TG.CONFIG, d = C.businesses.brand, br = d.brand, s = b.brand, fo = b.fixesOn || {};
      // arrivals
      for (const inc of s.incoming.slice()) {
        if (inc.due > g.month) continue;
        s.incoming = s.incoming.filter((x) => x !== inc);
        let units = inc.units;
        const pIssue = br.factoryIssue * (b.fixes.inspect ? 0.3 : 1);
        if (R.chance(pIssue)) { const x = R.range(br.defect[0], br.defect[1]); const lost = Math.round(units * x); units -= lost; TG.rep.event(g, b, 'bad', `Factory quality issue: ${lost.toLocaleString()} of ${inc.units.toLocaleString()} items unsellable`, `${U.pct(pIssue)} chance per batch${b.fixes.inspect ? ' (inspections cut it)' : '; no factory inspections'}`); }
        s.stock += units; s.stockCost += inc.cost;
        TG.rep.event(g, b, 'info', `Batch of ${units.toLocaleString()} items arrived`, `Ordered ${br.leadMonths} months ago`);
      }
      const share = TG.W.share(g, 'apparel');
      const adMgr = b.spec.ads;
      const adVisitors = b.ads.budget > 0 ? (b.ads.budget / (br.cpv * (1 + 3 * share) * g.world.priceIdx)) * (adMgr ? 1 + adMgr.skill / 150 : 1) * (b.rep < 30 ? 0.6 : 1) : 0;
      const flop = b.ads.budget > 0 && R.chance(C.reputation.adChannels[b.ads.channel].flop * (adMgr ? 0.5 : 1));
      const visitors = adVisitors * (flop ? 0.2 : 1) + b.rep * br.organicPerRep;
      if (flop) TG.rep.event(g, b, 'bad', 'Ad spend burned with almost no sales', `${C.reputation.adChannels[b.ads.channel].label} campaigns flop ${U.pct(C.reputation.adChannels[b.ads.channel].flop)} of the time${adMgr ? '' : '; no experienced ads manager'}`);
      const qualF = 0.8 + 0.4 * ctx.quality / 100;
      const dm = B().demandMult(g, b, ctx, { noAds: true });
      let orders = (visitors * br.conv * qualF + s.followers * br.followerConv) * dm * (1 - share * 0.5);
      if (R.chance(br.viral * (0.5 + b.rep / 100))) { const x = R.range(br.viralMult[0], br.viralMult[1]); orders *= x; TG.rep.event(g, b, 'good', `Went viral! Orders x${x.toFixed(1)} this month`, 'Rare viral moment'); }
      let packCap = U.sum(ctx.key, (e) => d.roles.packer.cap * M.staffEff(e)) * (fo.packerMult || 1) + (ctx.own ? 900 : 0);
      if (b.equip.some((x) => x.type === 'shelving' && !x.broken)) packCap *= 1.15;
      packCap *= M.paceMult(b) * (1 - ctx.down);
      const sold = Math.max(0, Math.floor(Math.min(orders, s.stock, packCap)));
      const lost = Math.max(0, orders - sold);
      if (lost > 200 && lost > orders * 0.25) TG.rep.event(g, b, 'bad', `Missed ${Math.round(lost).toLocaleString()} orders`, sold >= s.stock - 1 ? 'Stock ran out' : `Fulfilment capacity ${Math.round(packCap)} orders`);
      const avgCost = s.stock > 0 ? s.stockCost / s.stock : 0;
      const price = TG.W.price(g, 'apparel', sold * 6) * M.priceMult(b);
      TG.F.earn(g, Math.round(sold * price), 'Online sales', b.id); TG.W.sell(g, 'apparel', sold);
      TG.F.book(g, Math.round(sold * avgCost), 'Cost of goods sold', b.id);
      s.stockCost -= sold * avgCost; s.stock -= sold;
      TG.F.spend(g, Math.round(sold * br.shipPerUnit * g.world.priceIdx), 'Shipping', b.id);
      const room = b.sqft * br.unitsPerSqft;
      const storage = s.stock * br.storagePerUnit * (s.stock > room ? 3 : 1) * g.world.priceIdx;
      TG.F.spend(g, Math.round(storage), 'Storage', b.id);
      s.followers = Math.max(0, s.followers + sold * br.followerRate - s.followers * br.followerChurn);
      s.lastOrders = orders; s.lostSales = lost; s.avgOrders = s.avgOrders == null ? orders : s.avgOrders * 0.7 + orders * 0.3;
      ctx.cap = Math.round(packCap); ctx.demand = Math.round(orders); ctx.served = sold;
      ctx.util = packCap > 0 ? orders / packCap : 1.5; ctx.busy = U.clamp(sold / Math.max(1, packCap), 0, 1.3);
      if (s.stock === 0 && !s.incoming.length) ctx.note = 'No stock and nothing on order: order a batch';
      else if (s.stock > orders * 8 && orders > 0) ctx.note = 'Warehouse full of slow-moving stock: consider a clearance sale';
    },
    inventoryValue(g, b) { return Math.round(b.brand.stockCost * 0.8 + U.sum(b.brand.incoming, (x) => x.cost) * 0.9); },
    extraRisks(g, b) { const br = TG.CONFIG.businesses.brand.brand; return [{ label: 'Next batch has a factory quality issue', p: br.factoryIssue * (b.fixes.inspect ? 0.3 : 1), why: b.fixes.inspect ? 'factory inspections' : 'no factory inspections' }]; },
  };
  M.brandOrder = (g, b, units, test) => {
    const br = TG.CONFIG.businesses.brand.brand; units = Math.round(units);
    const min = test ? br.testBatch : br.minBatch;
    if (test && !b.fixes.test) return { ok: false, msg: 'Enable small test batches first.' };
    if (units < min) return { ok: false, msg: `Minimum batch is ${min}.` };
    const unit = br.unitCost * g.world.priceIdx * (test ? br.testMarkup : 1) * (1 - ((b.fixesOn && b.fixesOn.unitCostCut) || 0)) * (b.fixes.inspect ? 1.02 : 1) * Math.max(0.8, 1 - Math.log10(units / 500) * 0.06);
    const cost = Math.round(units * unit);
    if (g.cash < cost) return { ok: false, msg: `Costs ${U.money(cost)}.` };
    TG.F.spend(g, cost, 'Inventory orders', b.id, true);
    b.brand.incoming.push({ units, cost, due: g.month + br.leadMonths });
    return { ok: true, cost };
  };
  M.brandClearance = (g, b, pct) => {
    const s = b.brand; const units = Math.floor(s.stock * pct); if (units <= 0) return { ok: false };
    const rev = Math.round(units * TG.W.price(g, 'apparel', units) * 0.4);
    const costPart = s.stockCost * units / s.stock;
    s.stock -= units; s.stockCost -= costPart; TG.W.sell(g, 'apparel', units);
    TG.F.earn(g, rev, 'Clearance sales', b.id); TG.F.book(g, Math.round(costPart), 'Cost of goods sold', b.id); b.rep = U.clamp(b.rep - 1, 0, 100);
    return { ok: true, rev, units };
  };

  // ============ FACTORY ============
  M.models.factory = {
    init(g, b) { b.factory = { stock: 0, policy: 'hold', premium: 0 }; },
    lines(b) { return b.equip.filter((x) => x.type === 'line'); },
    maxLines(b) { return Math.max(1, Math.floor(b.sqft / TG.CONFIG.businesses.factory.factory.sqftPerLine)); },
    needs(g, b) { const n = Math.max(1, this.lines(b).length); const d = TG.CONFIG.businesses.factory; return { equip: [{ type: 'line', count: n }, { type: 'forklift', count: 1 }], staff: [{ role: 'worker', count: Math.ceil(n * d.equip[0].cap / d.roles.worker.cap * (1 - ((b.fixesOn && b.fixesOn.workerCut) || 0))) }] }; },
    baseRev(g, b) { return Math.max(1, this.lines(b).length) * 12000 * TG.CONFIG.markets.goods.base * g.world.priceIdx; },
    month(g, b, ctx) {
      const C = TG.CONFIG, d = C.businesses.factory, fd = d.factory, f = b.factory, fo = b.fixesOn || {};
      const lineCap = TG.E.capacity(b, 'line');
      const wc = (fo.workerCut || 0);
      const workerUnits = U.sum(ctx.key, (e) => d.roles.worker.cap * M.staffEff(e)) / Math.max(0.2, 1 - wc);
      let prod = Math.max(0, Math.min(lineCap, workerUnits) * M.paceMult(b) * (1 - ctx.down));
      const bulk = b.fixes.bulk && b.fixes.bulk.until > g.month;
      if (b.fixes.bulk && !bulk) { delete b.fixes.bulk; TG.rep.event(g, b, 'info', 'Bulk supplier contract ended', 'Contract term over'); }
      const matMult = 1 + (fo.materialAdd || 0) - (bulk ? 0.15 : 0);
      const matCost = prod * fd.materialCost * g.world.priceIdx * matMult * (g.world.shortage.home ? 1.2 : 1);
      if (g.cash < matCost && g.cash > 0) prod *= g.cash / matCost;
      TG.F.spend(g, Math.round(prod * fd.materialCost * g.world.priceIdx * matMult * (g.world.shortage.home ? 1.2 : 1)), 'Raw materials', b.id);
      f.stock += prod;
      if (fo.rnd && R.chance(fo.rnd)) { f.premium = Math.min(0.3, f.premium + 0.04); g.markets.goods.demand12 *= 1.02; TG.rep.event(g, b, 'good', 'R&D launched a new product line (+4% price premium)', '3% monthly chance with an R&D department'); }
      const pNow = TG.W.price(g, 'goods', f.stock * 6) * (1 + f.premium) * (0.9 + 0.2 * ctx.quality / 100);
      const floor = fd.materialCost * g.world.priceIdx * 1.5;
      let sell = f.stock;
      if (f.policy === 'hold' && pNow < floor) sell = Math.max(0, f.stock - prod * fd.maxStockMonths);
      sell = Math.min(sell, f.stock);
      if (sell > 0) { TG.F.earn(g, Math.round(sell * pNow), 'Product sales', b.id); TG.W.sell(g, 'goods', sell); f.stock -= sell; }
      TG.F.spend(g, Math.round(f.stock * fd.storagePerUnit * g.world.priceIdx), 'Storage', b.id);
      ctx.cap = Math.round(lineCap); ctx.served = Math.round(prod); ctx.demand = Math.round(lineCap);
      ctx.util = lineCap > 0 ? prod / lineCap : 0; ctx.busy = U.clamp(workerUnits > 0 ? lineCap / workerUnits : 1.3, 0, 1.3);
      if (lineCap === 0) ctx.note = 'All production lines are down';
      else if (workerUnits < lineCap * 0.9) ctx.note = `Short on line workers: running at ${U.pct(prod / lineCap)}`;
      if (pNow < floor) ctx.note = (ctx.note ? ctx.note + '. ' : '') + 'Market price is below cost-plus: oversupply';
    },
    inventoryValue(g, b) { return Math.round(b.factory.stock * TG.CONFIG.businesses.factory.factory.materialCost * g.world.priceIdx); },
    extraRisks(g, b, ctx) {
      if (b.staff.length < TG.CONFIG.staff.strikeMinStaff) return [];
      const m = U.avg(b.staff, (e) => e.morale, 60);
      return m < 45 ? [{ label: 'Union strike', p: TG.CONFIG.staff.strikeBase * (45 - m) / 10 * (b.fixes.fairwages ? 0.3 : 1), why: `average morale ${Math.round(m)}` }] : [];
    },
  };

  // ============ PROJECTS (CONSTRUCTION) ============
  M.models.projects = {
    init(g, b) { b.proj = { offers: [], active: [], done: 0, markup: 'normal', autoBid: true }; this.offers(g, b); },
    cfg() { return TG.CONFIG.businesses.construction.projects; },
    offers(g, b) {
      const P = this.cfg(); b.proj.offers = b.proj.offers.filter((o) => o.expires > g.month);
      const n = R.int(P.offers[0], P.offers[1]);
      for (let i = 0; i < n; i++) {
        const sizes = Object.keys(P.sizes).filter((k) => b.rep >= P.sizes[k].minRep || R.chance(0.15));
        const k = R.pick(sizes); const s = P.sizes[k];
        b.proj.offers.push({ id: U.uid('o'), size: k, label: `${s.label}: ${R.pick(['school', 'warehouse', 'offices', 'homes', 'retail center', 'clinic', 'apartments', 'road works', 'parking garage'])}`,
          cost: Math.round(R.range(s.value[0], s.value[1]) * g.world.priceIdx / 1000) * 1000, months: R.int(s.months[0], s.months[1]), crew: R.int(s.crew[0], s.crew[1]), heavy: s.heavy, crane: s.crane, bond: !!s.bond, expires: g.month + 2 });
      }
      if (b.proj.offers.length > 8) b.proj.offers = b.proj.offers.slice(-8);
    },
    winChance(g, b, o, markup) { const P = this.cfg(); return U.clamp(P.winChance[markup] * (0.6 + b.rep / 100) * (b.fixes.contingency ? P.contingencyWinMult : 1) * Math.pow(g.world.econ, 0.5), 0.02, 0.95); },
    needs(g, b) { const need = b && b.proj ? Math.ceil(U.sum(b.proj.active, (p) => p.crew)) : 0; return { equip: [{ type: 'tools', count: Math.max(1, Math.ceil(need / 60)) }], staff: [{ role: 'laborer', count: Math.max(6, need) }] }; },
    baseRev(g, b) { return Math.max(150000, U.sum(b.proj ? b.proj.active : [], (p) => p.price / p.months)); },
    crew(b, ctx) { return U.sum(ctx.key, M.staffEff) / 0.8; },
    month(g, b, ctx) {
      const C = TG.CONFIG, P = this.cfg(), pr = b.proj;
      const toolsCap = TG.E.capacity(b, 'tools');
      let crew = Math.min(this.crew(b, ctx) + (ctx.own ? 1 : 0), toolsCap) * M.paceMult(b) * (1 - ctx.down);
      let heavy = b.equip.filter((x) => x.type === 'excavator' && !x.broken).length;
      let cranes = b.equip.filter((x) => x.type === 'crane' && !x.broken).length;
      const moy = U.moy(g.month); const season = C.businesses.construction.season[moy] * (1 - ctx.weather.sev * 0.4);
      const totalCrewNeed = U.sum(pr.active, (p) => p.crew); let used = 0;
      for (const p of pr.active.slice()) {
        p.elapsed++;
        const assign = Math.min(Math.max(0, crew), p.crew); crew -= assign; used += assign;
        const hf = p.heavy ? U.clamp(heavy / p.heavy, 0, 1) : 1; heavy = Math.max(0, heavy - p.heavy);
        const cf = p.crane ? (cranes > 0 ? 1 : 0.2) : 1; if (p.crane) cranes = Math.max(0, cranes - 1);
        const rate = (assign / p.crew) * (0.4 + 0.6 * hf) * cf;
        const dp = Math.min(1 - p.progress, rate / p.months * season * (0.85 + 0.3 * ctx.skill / 100));
        p.progress += dp;
        const mat = p.cost * P.materialShare * dp * (g.world.shortage.home ? 1.2 : 1) * (1 + p.overrun * (b.fixes.contingency ? 0.5 : 1));
        TG.F.spend(g, Math.round(mat), 'Materials & subcontractors', b.id);
        B().addRecv(g, b, p.price * dp, P.billingDelay, p.id);
        // risks per project
        const pmF = b.fixes.pm ? 0.5 : 1;
        if (R.chance(P.overrunChance * pmF * (1.6 - ctx.skill / 100) * ctx.streakMult)) { const x = R.range(P.overrunPct[0], P.overrunPct[1]); p.overrun += x; TG.rep.event(g, b, 'bad', `${p.label} is running over budget (+${U.pct(x)} material costs)`, `${U.pct(P.overrunChance * pmF, 1)} monthly overrun chance${b.fixes.pm ? ' with project managers' : ', no dedicated project manager'}${b.fixes.contingency ? '; contingency absorbs half' : ''}`); }
        if (R.chance(P.inspectFail * (b.fixes.pm ? 0.6 : 1) * (1.6 - ctx.skill / 100) * ctx.streakMult)) { const c = Math.round(p.cost * R.range(P.reworkPct[0], P.reworkPct[1])); TG.F.spend(g, c, 'Rework', b.id); p.progress = Math.max(0, p.progress - 0.03); TG.rep.event(g, b, 'bad', `${p.label} failed a building inspection (${U.money(c)} rework)`, `Crew skill ${Math.round(ctx.skill)}`); }
        if (R.chance(P.clientBankrupt * (g.world.phase === 'recession' ? 2.5 : 1))) {
          const lostRecv = U.sum(b.recv.filter((r) => r.label === p.id), (r) => r.amt);
          b.recv = b.recv.filter((r) => r.label !== p.id);
          pr.active = pr.active.filter((x) => x !== p);
          TG.rep.event(g, b, 'major', `Client went bankrupt mid-project: ${p.label} cancelled (${U.money(lostRecv)} unpaid)`, `${U.pct(P.clientBankrupt * (g.world.phase === 'recession' ? 2.5 : 1), 1)} monthly chance; ${TG.W.phaseLabel(g).toLowerCase()} economy`, { major: 'cash' });
          continue;
        }
        if (p.elapsed > p.deadline && (p.penalty || 0) < p.price * P.latePenaltyCap) { const pen = Math.round(Math.min(p.price * P.latePenaltyPct, p.price * P.latePenaltyCap - (p.penalty || 0))); p.penalty = (p.penalty || 0) + pen; TG.F.spend(g, pen, 'Late penalties', b.id); if (p.elapsed === p.deadline + 1) TG.rep.event(g, b, 'bad', `${p.label} is late: ${U.money(pen)}/month penalty`, `Planned ${p.months} months; crew assigned ${Math.round(assign)} of ${p.crew}`); }
        if (p.progress >= 0.999) {
          pr.active = pr.active.filter((x) => x !== p); pr.done++;
          const late = p.elapsed > p.deadline; const dr = late ? -R.range(1, 4) : R.range(1, 5); b.rep = U.clamp(b.rep + dr, 0, 100);
          TG.rep.event(g, b, late ? 'bad' : 'good', `Completed ${p.label}${late ? ' late' : ' on time'}`, `Contract ${U.money(p.price)}; reputation ${dr > 0 ? '+' : ''}${Math.round(dr)}`);
        }
      }
      this.offers(g, b);
      const avail = this.crew(b, ctx);
      ctx.cap = Math.round(avail); ctx.demand = Math.round(totalCrewNeed); ctx.served = Math.round(used);
      ctx.util = avail > 0 ? totalCrewNeed / avail : (totalCrewNeed ? 1.5 : 0); ctx.busy = U.clamp(ctx.util, 0, 1.3);
      if (!pr.active.length) ctx.note = 'No active projects: crews are idle (bid on contracts)';
      else if (totalCrewNeed > avail * 1.1) ctx.note = 'Over-committed: projects will run late';
    },
    extraRisks(g, b) { const P = this.cfg(); const n = b.proj.active.length; if (!n) return []; return [{ label: 'A project runs over budget', p: 1 - Math.pow(1 - P.overrunChance * (b.fixes.pm ? 0.5 : 1), n), why: `${n} active projects` }, { label: 'A client goes bankrupt', p: 1 - Math.pow(1 - P.clientBankrupt, n), why: 'economy dependent' }]; },
  };
  M.bid = (g, b, offerId, markup, by) => {
    const P = TG.CONFIG.businesses.construction.projects; const m = M.models.projects;
    const o = b.proj.offers.find((x) => x.id === offerId); if (!o) return { ok: false, msg: 'Offer expired.' };
    if (o.bond && !b.fixes.bonds) return { ok: false, msg: 'Large projects require performance bonds.' };
    if (b.proj.active.length >= P.maxActive) return { ok: false, msg: 'Too many active projects.' };
    b.proj.offers = b.proj.offers.filter((x) => x !== o);
    const win = m.winChance(g, b, o, markup);
    if (!R.chance(win)) { TG.rep.decision(g, b, by, `Lost the bid on ${o.label} (${U.pct(win)} odds)`, 'ok'); return { ok: true, won: false, win }; }
    const price = Math.round(o.cost * (1 + P.markups[markup] + (b.fixes.contingency ? P.contingency : 0)));
    if (o.bond) TG.F.spend(g, Math.round(price * P.bondPct), 'Performance bonds', b.id);
    b.proj.active.push({ id: o.id, label: o.label, size: o.size, cost: o.cost, price, months: o.months, crew: o.crew, heavy: o.heavy, crane: o.crane, progress: 0, elapsed: 0, deadline: Math.round(o.months * 1.15), overrun: 0 });
    TG.rep.decision(g, b, by, `Won the bid on ${o.label} at ${U.money(price)} (${U.pct(win)} odds)`, 'good');
    return { ok: true, won: true, win, price };
  };

  // ============ TECH ============
  M.models.tech = {
    init(g, b) {
      const T = TG.CONFIG.businesses.tech.tech;
      b.tech = { phase: 'build', dev: 0, pmf: U.clamp(Math.pow(R.next(), 1.7), 0.02, 0.98), pmfEst: null, users: 0, researched: false, peak: 0 };
    },
    needs() { return { equip: [{ type: 'server', count: 1 }], staff: [{ role: 'engineer', count: 3 }] }; },
    baseRev(g, b) { return Math.max(40000, b.tech.users * TG.CONFIG.businesses.tech.tech.arpu * g.world.priceIdx); },
    month(g, b, ctx) {
      const C = TG.CONFIG, T = C.businesses.tech.tech, t = b.tech;
      const engEff = U.sum(ctx.key, (e) => 0.5 + e.skill / 100) + (ctx.own ? 0.4 : 0);
      if (t.phase === 'build') {
        t.dev += engEff * M.paceMult(b) * (1 - ctx.down);
        ctx.cap = Math.round(t.dev); ctx.demand = T.devPoints; ctx.served = 0; ctx.util = 1; ctx.busy = 1;
        ctx.note = `Building the product: ${Math.min(100, Math.round(t.dev / T.devPoints * 100))}% done`;
        if (t.dev >= T.devPoints) { t.phase = 'live'; t.users = Math.round(300 + 3000 * t.pmf * (0.5 + b.rep / 100)); TG.rep.event(g, b, 'good', `Product launched with ${t.users.toLocaleString()} early users`, t.pmfEst != null ? `Research estimated product-market fit around ${U.pct(t.pmfEst)}` : 'No market research: fit unknown until users show up'); }
        return;
      }
      const share = U.clamp(t.users / g.markets.software.demand12, 0, 1);
      const cac = T.cacBase * (1 + 4 * Math.pow(share, 1.5)) * g.world.priceIdx;
      const adMgr = b.spec.ads; const flop = b.ads.budget > 0 && R.chance(C.reputation.adChannels[b.ads.channel].flop * (adMgr ? 0.5 : 1));
      if (flop) TG.rep.event(g, b, 'bad', 'Ad campaign flopped', 'Campaigns can flop');
      let paid = b.ads.budget > 0 ? (b.ads.budget / cac) * (0.3 + 1.4 * t.pmf) * (adMgr ? 1 + adMgr.skill / 150 : 1) * (flop ? 0.2 : 1) : 0;
