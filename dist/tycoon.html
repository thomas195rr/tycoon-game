    o += UI.irow('so' + id, '🟫', 'Soil', `${Math.round(a.soil * 100)}%`, `Soil drops every month (faster when it is high: −${(drop * 100).toFixed(1)} pts next month at ${Math.round(a.soil * 100)}%). Nothing is sprayed unless YOU tap Spray (or a manager follows your spray order). No spray = no cost, and soil keeps dropping. Spray brings it back: +${Math.round(add * 100)} pts now (less when soil is already high). Yield x${M.soilYield(a.soil).toFixed(2)} at this soil (x${M.soilYield(1).toFixed(2)} at 100%, x${M.soilYield(0.4).toFixed(2)} at 40%).${k !== 'cows' ? ` Poor soil also raises pest odds.` : ' Good grass feeds more cows.'}`,
      sprayed ? '<span class="mute">sprayed ✓</span>' : UI.btn(`🧪 Spray ${m(tc)}`, 'farmSpray', k, 'xs goodb'), `yield x${M.soilYield(a.soil).toFixed(2)} · next month −${(drop * 100).toFixed(1)} pts · spray +${Math.round(add * 100)}`);
    o += `<div style="margin:0 0 6px 48px">${UI.bar(a.soil * 100, 100)}</div>`;
    // water
    const wtr = M.areaWater(b, k), cov = M.sprAcres(b, k); const ed = TG.E.def(b, ad.spr); const sp = TG.E.price(g, b, ad.spr, 'standard');
    const odds = k === 'cows' ? M.sickOdds(g, b, W) : M.dryOdds(g, b, k, W);
    o += UI.irow('wa' + id, '💧', 'Water', `${Math.round(wtr * 100)}%`, `Sprinklers cover ${N(Math.min(cov, a.acres))} of ${N(a.acres)} acres. Each ${ed.label.toLowerCase()} covers ${ed.acres} acres (${m(sp)}, wears out like other machines). ${k === 'cows' ? 'Watered pasture grows more grass (more room for cows) and keeps cows healthy in heat.' : `Water adds up to +${U.pct(FD().water.yieldK)} yield and lowers the odds of a dry-out.`} Rain on this land: ${U.pct(f.rain)}.`,
      UI.btn(`+ Sprinkler ${m(sp)}`, 'farmSpr', k, 'xs'), `${N(Math.min(cov, a.acres))}/${N(a.acres)} ac covered`);
    o += `<div style="margin:0 0 6px 48px">${UI.bar(wtr * 100, 100)}</div>`;
    if (k === 'cows') o += UI.irow('sk' + id, '🤒', 'Sick cows odds', UI.risk(odds.p), `This month: ${odds.why || 'no herd'}.`);
    else { o += UI.irow('dr' + id, '🥀', 'Dry-out odds', UI.risk(odds.p), `If it happens, ${U.pct(FD().water.lossRange[0])}-${U.pct(FD().water.lossRange[1])} of the ${ad.label.toLowerCase()} dies. Why: ${odds.why}.`, null, M.growing(k, U.moy(g.month)) ? 'this month' : 'off season (no risk now)');
      const po = M.pestOdds(g, b, k); o += UI.irow('pe' + id, '🐛', 'Pest & disease odds', UI.risk(po.p), `If it happens, ${U.pct(FD().water.pestRange[0])}-${U.pct(FD().water.pestRange[1])} of the crop is lost. Why: ${po.why}.`, null, 'this month'); }
    // price
    const r = M.models.farm.ratio(b, k); const mk = M.models.farm.market(g, b, k, 0); const unit = k === 'cows' ? (a.kind === 'dairy' ? 't milk' : 'head') : 't';
    o += UI.irow('pr' + id, '🏷️', 'Your price', a.askR == null ? 'market' : `x${r.toFixed(2)}`, `Market ${m(mk)} per ${unit}. Above market buyers take less (the rest is stored or spoils); below market you sell everything for less.`,
      UI.btn('➖', 'farmAsk', `${k}|-0.05`, 'xs') + UI.btn('➕', 'farmAsk', `${k}|0.05`, 'xs') + UI.btn('=', 'farmAsk', `${k}|0`, 'xs'), `${m(mk * r)} per ${unit}`);
    // area specifics
    if (k === 'crops') {
      const sc = M.models.farm.seedCost(g, b);
      o += UI.irow('sd' + id, '🌱', 'Seed', `${N(f.seeds)} ac`, `Buy seed before planting (Mar-Apr): ${m(sc)} per acre. ${TG.D.handler(g, b, 'farm') ? 'Your manager buys it (Manager tab).' : 'No manager: you must buy it yourself.'}`, qty('qSeed', Math.max(1, a.acres - (f.seeds || 0))) + UI.btn('🛒 Buy', 'seedBuy', null, 'xs goodb') + UI.btn('Sell', 'seedSell', null, 'xs'), `for ${N(a.acres)} acres`);
      o += UI.irow('gr' + id, '🌿', 'Growing', a.planted ? `${N(a.planted)} ac` : '—', `Planted Mar-Apr, harvested Aug-Sep. Outlook x${(a.seasonYield || 1).toFixed(2)}.`);
    }
    if (k === 'orchard') { const e = M.areaE(b, k); o += UI.irow('ag' + id, '🌳', 'Trees', a.age >= e.rampMonths ? 'grown' : `${Math.round(a.age)}/${e.rampMonths} mo`, `New trees give little fruit for ${e.rampMonths} months. Fruit Jul-Aug, spoils fast in storage (${U.pct(e.spoil)}/mo).`); }
    return o + '</div>';
  }
  UI.A.farmSpray = (k) => { const r = TG.M.farmTreat(TG.G, biz(), k, 'You'); after(r, r.ok ? `Soil ${Math.round(r.from * 100)}% → ${Math.round(r.to * 100)}% for ${m(r.cost)}.` : null); };
  UI.A.farmSpr = (k) => { const g = TG.G, b = biz(); const t = AD()[k].spr; const it = TG.E.buy(g, b, t, 'standard'); after(it ? { ok: true } : { ok: false, msg: TG.E.count(b, t) >= TG.E.maxCount(b, t) ? 'No room for more.' : `Costs ${m(TG.E.price(g, b, t, 'standard'))}.` }, 'Sprinkler bought: water goes up.'); };
  UI.A.farmAsk = (arg) => { const [k, s] = arg.split('|'); TG.M.farmSetAsk(biz(), k, Number(s) ? Number(s) : null); UI.refresh(); };
  UI.A.farmFut = (k) => { const g = TG.G; const r = TG.M.farmFutures(g, biz(), k, UI.num('fq' + (k === 'orchard' ? 'fruit' : 'grain'), 0)); after(r, r.ok ? `Locked ${r.qty} t at ${m(r.price)}.` : null); };
  // buy land (small modal)
  UI.A.landModal = () => {
    const g = TG.G, b = biz(); const per = TG.M.farmLandPrice(g, b);
    UI.modal('➕ Buy land', `<div class="card"><div class="small">Neighbouring land: about ${m(per)} an acre (big buys cost a bit more per acre). It arrives as ⬜ free land: then move it into an area.</div>
      <div class="row" style="margin-top:8px">${qty('farmAc', 50)}<span class="small">acres</span></div>
      <div class="btns">${UI.btn('💵 Pay cash', 'farmLand', 'cash', 'sm goodb')}${UI.btn('🏦 Mortgage', 'farmLand', 'loan', 'sm')}${UI.btn('Cancel', 'closeModal', null, 'sm')}</div></div>`);
  };
  UI.A.farmLand = (how) => { const r = TG.M.farmBuyLand(TG.G, biz(), UI.num('farmAc', 0), how === 'loan'); UI.closeModal(); after(r, r.ok ? `Land bought for ${m(r.cost)}.` : null); };
  // move acres between areas (modal shows cost and time)
  UI.A.moveModal = (from) => {
    const g = TG.G, b = biz(), f = TG.M.farmEnsure(b); UI.S.mv = UI.S.mv || {};
    if (from) { UI.S.mv.from = from; if (!UI.S.mv.to || UI.S.mv.to === from) UI.S.mv.to = from === 'free' ? (TG.M.farmAreas.find((k) => f.areas[k].acres) || 'crops') : 'free'; }
    const mv = UI.S.mv; const have = mv.from === 'free' ? TG.M.farmFree(f) : f.areas[mv.from].acres; const n = Math.min(have, Math.max(1, mv.n || Math.min(50, have)));
    const c = TG.M.farmMoveCost(g, b, mv.to, n); const lbl = (k) => (k === 'free' ? '⬜ Free land' : `${AD()[k].icon} ${AD()[k].label}`);
    const opts = (sel, act, skip) => ['free'].concat(TG.M.farmAreas).filter((k) => k !== skip).map((k) => UI.btn(lbl(k), act, k, 'xs' + (sel === k ? ' pri' : ''))).join('');
    UI.modal('↔️ Move acres', `<div class="card"><div class="small"><b>From</b> (${N(have)} ac there)</div><div class="btns">${opts(mv.from, 'mvFrom')}</div>
      <div class="small"><b>To</b></div><div class="btns">${opts(mv.to, 'mvTo', mv.from)}</div>
      <div class="row" style="margin-top:6px"><input type="number" id="mvN" min="1" max="${Math.round(have)}" value="${Math.round(n)}" aria-label="acres">${UI.btn('Update', 'mvN', null, 'xs')}</div>
      <div class="ev ${c.cost ? 'warn' : ''}">💵 ${c.cost ? m(c.cost) : 'free'} · ⏳ ${c.months ? c.months + ' month' + (c.months > 1 ? 's' : '') : 'right away'}<div class="mute">${esc(c.why)}${mv.from !== 'free' ? ' Acres keep their soil. Moving them out of an area drops what grows there.' : ''}</div></div>
      <div class="btns">${UI.btn('✅ Move', 'mvGo', null, 'sm pri', !(have >= 1))}${UI.btn('Cancel', 'closeModal', null, 'sm')}</div></div>`);
  };
  UI.A.mvFrom = (k) => { UI.S.mv.from = k; if (UI.S.mv.to === k) UI.S.mv.to = k === 'free' ? 'crops' : 'free'; UI.A.moveModal(); };
  UI.A.mvTo = (k) => { UI.S.mv.to = k; UI.A.moveModal(); };
  UI.A.mvN = () => { UI.S.mv.n = UI.num('mvN', 1); UI.A.moveModal(); };
  UI.A.mvGo = () => { const mv = UI.S.mv; const n = UI.num('mvN', 0); const r = TG.M.farmMove(TG.G, biz(), mv.from, mv.to, n); UI.closeModal(); after(r, r.ok ? (r.months ? `${n} acres on the way: ready in ${r.months} month${r.months > 1 ? 's' : ''}.` : `${n} acres moved.`) + (r.cost ? ` Cost ${m(r.cost)}.` : '') : null); };

  P.projects = { label: '📝 Bids', render(g, b) {
    const pr = b.proj, PC = TG.CONFIG.businesses.construction.projects; const M = TG.M.models.projects;
    let o = `<div class="card"><h3>🏷️ Your markup</h3><div class="btns">${Object.keys(PC.markups).map((k) => UI.btn(`${k} +${U.pct(PC.markups[k])}`, 'cxMarkup', k, 'sm' + (pr.markup === k ? ' pri' : ''))).join('')}</div>
      ${UI.irow('cxa' + b.id, '🤖', 'Managers bid for me', null, 'Higher markup = more profit per job but you win fewer. Too many jobs for your crew = late penalties.', UI.btn(pr.autoBid ? '✅ On' : 'Off', 'cxAuto', null, 'xs' + (pr.autoBid ? ' goodb' : '')))}</div>`;
    o += `<div class="card"><h3>📝 Jobs you can bid on</h3>${pr.offers.map((x) => { const w = M.winChance(g, b, x, pr.markup); return UI.irow('cxo' + x.id, '🏠', x.label, m(x.cost), `${x.months} months · ${x.crew} crew${x.heavy ? ' · excavator' : ''}${x.crane ? ' · crane' : ''}${x.bond ? ' · bond needed' : ''}. Expires ${U.dateStr(x.expires)}.`, UI.btn(`Bid (${U.pct(w)} win)`, 'cxBid', x.id, 'xs pri'), 'cost to build'); }).join('') || '<div class="mute">No jobs this month.</div>'}</div>`;
    return o;
  } };
  UI.A.cxMarkup = (v) => { biz().proj.markup = v; UI.refresh(); };
  UI.A.cxAuto = () => { const b = biz(); b.proj.autoBid = !b.proj.autoBid; UI.refresh(); };
  UI.A.cxBid = (id) => { const b = biz(); const r = TG.M.bid(TG.G, b, id, b.proj.markup, 'You'); if (!UI.res(r)) return UI.refresh(); UI.toast(r.won ? `Won! Contract ${m(r.price)}.` : `Lost the bid (${U.pct(r.win)} odds).`, !r.won); UI.refresh(); };

  P.franchise = { label: '📝 Join requests', render(g, b) {
    const s = b.fr, fr = TG.CONFIG.businesses.franchise.franchise;
    return `<div class="card"><h3>📝 Want to open a shop (${s.apps.length})</h3><div class="mute">You get ${m(fr.fee * g.world.priceIdx)} per shop, then ${U.pct(fr.royalty)} of its sales. Weak owners look fine at first.</div>${s.apps.map((a) => UI.irow('fa' + a.id, a.signal > 0.7 ? '😀' : a.signal > 0.45 ? '🙂' : '😟', a.name, m(a.capital), `Looks ${a.signal > 0.7 ? 'strong' : a.signal > 0.45 ? 'okay' : 'weak'}. Expires ${U.dateStr(a.expires)}.`, UI.btn('✅', 'frApp', a.id, 'xs goodb') + UI.btn('❌', 'frRej', a.id, 'xs'), 'their savings')).join('') || '<div class="mute">Nobody yet. Good reputation and ads bring people.</div>'}</div>`;
  } };
  UI.A.frApp = (id) => after(TG.M.franchiseApprove(TG.G, biz(), id, 'You'), 'Approved: opening in ~3 months.');
  UI.A.frRej = (id) => after(TG.M.franchiseReject(TG.G, biz(), id), 'Rejected.');
})();

</script>
<script>/* js/ui/ui-detail.js */
/* ui-detail.js - work-capacity card, sales card and the "See all" detail screens for stock, staff and equipment. */
(function () {
  const TG = globalThis.TG; const U = TG.U; const UI = TG.UI; const esc = UI.esc, m = UI.m;
  const biz = () => TG.B.get(TG.G, UI.bizId);
  const N = (x) => Math.round(x || 0).toLocaleString();
  const qty = (id, def) => `<input type="number" id="${id}" min="1" value="${Math.max(1, Math.round(def || 1))}" aria-label="how many">`;
  const tone = { g: 'good', y: 'warn', r: 'bad' };

  // ---------- 💪 work: each team / machine group, load vs capacity ----------
  UI.workCard = (g, b) => {
    const W = UI.wk(b);
    if (!W.length) return `<div class="card"><h3>💪 Work</h3><div class="mute">Press ▶ Next Month to see how busy everyone is.</div></div>`;
    let worst = -1, wu = -1; W.forEach((w, i) => { if (w.cap != null && w.util > wu) { wu = w.util; worst = i; } });
    const rows = W.map((w, i) => {
      const t = TG.WK.tone(w.util); const k = 'wk' + b.id + i; const pct = w.cap ? Math.round(w.util * 100) : null;
      const each = w.n > 0 && w.cap ? ` About ${N(w.cap / w.n)} ${w.u} each.` : '';
      const eff = w.kind === 'eq' ? ` Wear speed x${TG.WK.wearMult(w.util).toFixed(1)} (busier = wears faster).` : w.kind === 'staff' ? (w.util > 1 ? ' Over 100%: they get tired, morale drops, mistakes rise.' : w.util < 0.4 ? ' Lots of idle time: you pay wages for little work.' : ' A healthy workload.') : '';
      return `<div class="link ${i === worst && w.util > 0.9 ? 'weak' : ''}" data-act="tip" data-arg="${k}" data-nosave="1"><span class="ico">${w.i}</span><span class="grow">${esc(w.t)}${w.kind !== 'space' ? ` <span class="mute">x${w.n}</span>` : ''}${w.cap ? `<div class="bar ${t === 'r' ? 'bad' : t === 'y' ? 'warn' : ''}"><i style="width:${Math.round(Math.min(1, w.util) * 100)}%"></i></div>` : ''}</span><span style="text-align:right"><b>${N(w.load)}/${w.cap == null ? '–' : N(w.cap)}</b><br>${pct != null ? UI.pill(pct + '%', tone[t]) : UI.pill('none!', 'bad')}</span></div>${UI.tipLine(k, `${w.tip}${each}${eff} (${w.u})`)}`;
    }).join('');
    return `<div class="card"><h3>💪 Work this month ${UI.tipBtn('wk' + b.id)}</h3>${UI.tipLine('wk' + b.id, 'Each team and machine group can do a set amount of work. Busy = number on the left, most they can do = right. The red one is what holds you back.')}${rows}
      <div class="btns">${UI.btn('👥 See staff', 'detail', 'staff', 'sm')}${UI.btn('🛠️ See machines', 'detail', 'equip', 'sm')}</div></div>`;
  };

  // ---------- 🛒 sales vs sales capacity ----------
  UI.salesCard = (g, b) => {
    const lc = UI.lc(b); if (lc.cap == null || b.proj || b.fr) return '';
    const d = TG.B.def(b); const gd = TG.PR.good(b) || {}; const unit = gd.unit || 'sale';
    if (b.farm || b.tech || b.factory) return ''; // these show their own sales rows (harvest, users, production)
    const r = lc.priceR || 1; const pf = TG.PR.demandF(r);
    const sold = lc.served || 0, cap = lc.cap || 0, dem = lc.demand || 0;
    const lim = sold >= dem - 0.5 ? 'demand' : (lc.limit || 'staff');
    const L = { demand: ['🧲', 'Not enough customers', 'You could have served more than wanted to buy. Better reputation, ads, a busier location or a lower price bring more customers.'],
      staff: ['👥', 'Not enough staff', 'Your workers were full. Hire or train more.'], equipment: ['🛠️', 'Not enough equipment', 'A machine group was full. Buy more of the red one in Gear.'],
      space: ['📐', 'Not enough space', 'Your building is full. A bigger place is needed.'], support: ['🧹', 'Not enough helpers', 'Support staff were full.'], stock: ['📦', 'Ran out of stock', 'Supplies ran out. Buy more yourself (a manager can reorder for you) or add storage.'] }[lim] || ['❓', lim, ''];
    const k = 'sl' + b.id;
    return `<div class="card"><h3>🛒 Sales ${UI.tipBtn(k)}</h3>${UI.tipLine(k, 'Sales = the smallest of: customers who want to buy, and how much you can serve (staff, machines, space, stock).')}
      <div class="tiles">${UI.tile(k + 's', '🛒', N(sold), 'Sold', sold >= cap * 0.95 ? 'y' : 'g', `You sold ${N(sold)} ${unit}s last month.`)}${UI.tile(k + 'c', '🧱', N(cap), 'Could sell', '', 'The most your staff, machines and space could handle.')}${UI.tile(k + 'd', '🧲', N(dem), 'Wanted', dem > cap ? 'y' : 'g', 'Customers who wanted to buy at your price. Reputation, ads, the economy and price change it.')}${UI.tile(k + 'p', '🏷️', Math.round(pf * 100) + '%', 'Price effect', r > 1.05 ? 'r' : r < 0.95 ? 'y' : 'g', `Your price is ${Math.round(r * 100)}% of market, so you get about ${Math.round(pf * 100)}% of the normal number of customers.`)}</div>
      ${UI.irow(k + 'l', L[0], 'Held back by: ' + L[1], null, L[2])}</div>`;
  };

  // ---------- detail screens ----------
  UI.A.detail = (what) => {
    const g = TG.G, b = biz(); if (!b) return;
    const f = { stock: stockDetail, staff: staffDetail, equip: equipDetail }[what];
    UI.modal({ stock: '📦 Everything in stock', staff: '👥 Your team', equip: '🛠️ Your machines' }[what], f(g, b) + `<div class="btns">${UI.btn('Close', 'closeModal', null, 'pri')}</div>`);
  };
  const grp = (b, kind, test) => UI.wk(b).find((w) => w.kind === kind && test(w));
  function staffDetail(g, b) {
    const d = TG.B.def(b); const all = TG.S.allStaff(b);
    if (!all.length) return '<div class="card mute">No staff yet.</div>';
    const byRole = {}; for (const e of all) (byRole[e.role] = byRole[e.role] || []).push(e);
    let o = '';
    for (const [r, list] of Object.entries(byRole)) {
      const rd = d.roles[r] || TG.CONFIG.specialists[r] || {}; const w = grp(b, 'staff', (x) => x.t.toLowerCase().startsWith(String(rd.label || r).toLowerCase().slice(0, 5)));
      o += `<div class="card"><h3>${esc(rd.label || r)} x${list.length}</h3>${w ? `<div class="mute">Team load ${N(w.load)} / ${N(w.cap)} ${w.u} (${Math.round(w.util * 100)}%) · about ${N(w.load / Math.max(1, w.n))} each</div>` : ''}
        <table><tr><th>Name</th><th class="n">🎓 Skill</th><th class="n">😊 Mood</th><th class="n">⏰ Shows up</th>${rd.cap ? '<th class="n">💪 Can do</th>' : ''}</tr>${list.map((e) => `<tr><td>${esc(e.name)}</td><td class="n">${Math.round(e.skill)}</td><td class="n ${e.morale < 40 ? 'bad' : e.morale > 70 ? 'good' : ''}">${Math.round(e.morale)}</td><td class="n">${Math.round(e.reliability)}%</td>${rd.cap ? `<td class="n">${N(rd.cap * TG.M.staffEff(e))}</td>` : ''}</tr>`).join('')}</table></div>`;
    }
    return o + '<div class="mute">Training (Staff tab) raises skill, and skill raises how much each person can do.</div>';
  }
  function equipDetail(g, b) {
    if (!b.equip.length) return '<div class="card mute">No machines yet.</div>';
    const C = TG.CONFIG; const by = {};
    for (const it of b.equip) { const ed = TG.E.def(b, it.type); if (!ed) continue; const p = TG.E.poolOf(ed); (by[p] = by[p] || []).push(it); }
    let o = '';
    for (const [p, list] of Object.entries(by)) {
      const w = UI.wk(b).find((x) => x.kind !== 'staff' && x.pools.indexOf(p) >= 0); const work = list.filter((x) => !x.broken).length;
      const ed = TG.E.def(b, list[0].type); const cat = C.equipCats[ed.cat] || ['⚙️', ed.label];
      o += `<div class="card"><h3>${cat[0]} ${esc(cat[1])} · ${esc(ed.label)}${list.length > 1 ? 's' : ''}</h3>${w ? `<div class="mute">Group load ${N(w.load)} / ${N(w.cap)} ${w.u} (${Math.round(w.util * 100)}%) · each working one does about ${N(w.load / Math.max(1, work))} · wear speed x${TG.WK.wearMult(w.util).toFixed(1)}</div>` : `<div class="mute">${esc(ed.desc || 'Helps the business; not a capacity group.')}</div>`}
        <table><tr><th>#</th><th>Kind</th><th class="n">⏳ Age</th><th class="n">🔩 Wear</th><th class="n">🎲 Break</th></tr>${list.map((it) => `<tr><td>${TG.E.num(b, it)}</td><td>${esc(C.equipTiers[it.tier].label)}${it.leased ? ' 📄' : ''}</td><td class="n">${(it.age / 12).toFixed(1)}y</td><td class="n ${TG.E.effWear(it) > 70 ? 'bad' : ''}">${it.hidden > 0 && !it.inspected ? Math.round(it.wear) + '%+?' : Math.round(TG.E.effWear(it)) + '%'}</td><td class="n">${it.broken ? '<span class="bad">broken</span>' : U.pct(it.lastP || 0, 1)}</td></tr>`).join('')}</table></div>`;
    }
    return o;
  }
  function lotsTable(b) {
    const st = TG.ST.ensure(b); const sh = TG.ST.shelf(b); if (!st) return '';
    const lots = st.lots.slice().sort((x, y) => x.a - y.a);

// ---------- 🔮 next-month forecast and last month's forecast vs actual ----------
(function () {
  const TG = globalThis.TG; const U = TG.U; const UI = TG.UI; const esc = UI.esc, m = UI.m;
  const ICON = (k) => (/Revenue|sales|Sales|income/.test(k) ? '💰' : /Wage|Payroll/.test(k) ? '👥' : /Rent|Property|Building/.test(k) ? '🏠' : /Supplies|cost|Cost|Feed|Fuel|Seed/.test(k) ? '📦' : /Advert|PR/.test(k) ? '📣' : /Repair|Mainten|lease|Equipment/.test(k) ? '🛠️' : /Insurance/.test(k) ? '🛡️' : /Utilit/.test(k) ? '💡' : '•');
  UI.forecastCard = (g, b) => {
    const f = UI.fc(b); if (!f) return `<div class="card"><h3>🔮 Next month forecast</h3><div class="mute">Play a month first.</div></div>`;
    const L = Object.entries(f.lines).sort((a, c) => c[1] - a[1]);
    const k0 = 'fc' + b.id;
    let o = `<div class="card"><h3>🔮 Next month forecast ${UI.tipBtn(k0)}</h3>${UI.tipLine(k0, 'Wages, rent, taxes, ads and leases are known. Sales and other costs are estimated from recent months and the season (or the same month last year). Luck and events can change it.')}`;
    o += L.map(([k, v], i) => UI.irow(k0 + i, ICON(k), k, UI.signed(Math.round(v)), f.why[k] || '')).join('');
    o += `<div class="irow"><span class="ic">${f.profit >= 0 ? '📈' : '📉'}</span><span class="lb">Expected profit</span><span class="vl">${UI.signed(Math.round(f.profit))}</span></div>`;
    if (f.loans) o += UI.irow(k0 + 'ln', '🏦', 'Loan payments (from your cash)', m(f.loans), 'Loans tied to this business or its building are paid from your cash, outside its profit.');
    o += '</div>';
    const p = b.fcPrev, h = b.hist[b.hist.length - 1];
    if (p && h && p.m === h.m) {
      const keys = [...new Set(Object.keys(p.lines).concat(Object.keys(h.lines || {})))].filter((k) => Math.abs(p.lines[k] || 0) > 1 || Math.abs((h.lines || {})[k] || 0) > 1)
        .sort((a, c) => Math.abs((h.lines[c] || 0) - (p.lines[c] || 0)) - Math.abs((h.lines[a] || 0) - (p.lines[a] || 0)));
      const kc = 'fa' + b.id;
      o += `<div class="card"><h3>📊 Last month: forecast vs actual ${UI.tipBtn(kc)}</h3>${UI.tipLine(kc, 'What we expected before the month, and what really happened. Biggest differences first.')}
        <table><tr><th></th><th class="n">Forecast</th><th class="n">Actual</th><th class="n">Diff</th></tr>${keys.map((k) => { const a = (h.lines || {})[k] || 0, fv = p.lines[k] || 0; return `<tr><td>${ICON(k)} ${esc(k)}</td><td class="n">${m(fv)}</td><td class="n">${m(a)}</td><td class="n">${UI.signed(Math.round(a - fv))}</td></tr>`; }).join('')}
        <tr><td><b>Profit</b></td><td class="n"><b>${m(p.profit)}</b></td><td class="n"><b>${m(h.profit)}</b></td><td class="n">${UI.signed(Math.round(h.profit - p.profit))}</td></tr></table></div>`;
    }
    return o;
  };
})();

    return o;

  const equipCap = (g) => Math.max(0, Math.round(U.sum(g.businesses, (b) => TG.E.value(g, b)) * 0.7 - U.sum(g.loans.filter((l) => l.type === 'equipment'), (l) => l.balance)));

      <div class="btns">${UI.btn('Start renovation', 'reFlipGo', id, 'pri')}</div></div>`);

  UI.A.reFlipGo = (id) => { const r = TG.RE.startFlip(TG.G, id, UI.val('flLvl'), UI.val('flCon'), UI.val('flCt') === '1'); UI.closeModal(); after(r, r.ok ? `Renovation started (budget ${m(r.budget)}).` : null); };
  UI.A.reDev = (id) => {
    const D = TG.CONFIG.realEstate.develop; const h = TG.G.re.holdings.find((x) => x.id === id);
    UI.modal('Develop land', `<div class="card"><div class="row"><span>Units</span><input type="number" id="devU" value="${Math.min(D.maxUnits, Math.round(h.acres * D.unitsPerAcre / 2))}"><span class="mute">max ${Math.min(D.maxUnits, h.acres * D.unitsPerAcre)}</span></div>
      <div class="mute">Permits take ${D.permitMonths[0]}-${D.permitMonths[1]} months and can stall. Building costs ${m(D.costPerUnit[0])}-${m(D.costPerUnit[1])} per unit over ${D.buildMonths[0]}-${D.buildMonths[1]} months, often with overruns. Finished units become rentals.</div>
      <div class="btns">${UI.btn('Start (pay permits now)', 'reDevGo', id, 'pri')}</div></div>`);
  };
  UI.A.reDevGo = (id) => { const r = TG.RE.develop(TG.G, id, UI.num('devU', 10)); UI.closeModal(); after(r, r.ok ? `Development of ${r.dev.units} units started.` : null); };
  UI.A.reMgr = () => {
    const pool = TG.RE.managerPool(TG.G);
    UI.modal('Hire a property manager', pool.map((c) => `<div class="card"><div class="row sp"><b>${esc(c.name)}</b><span>${m(c.wage)}/mo</span></div><div class="small">Skill ~${c.skillSeen} · ${c.years} yrs · tenants ${c.skillSeen >= 60 ? '👍 better' : c.skillSeen >= 40 ? '≈ average' : '👎 worse'} · searches & repairs x${U.clamp(1.2 - c.skillSeen / 250, 0.8, 1.2).toFixed(2)}</div><div class="mute">Plus ${U.pct(TG.CONFIG.realEstate.managerFeePct)} of the rent they collect.</div><div class="btns">${UI.btn('Hire', 'reMgrGo', c.id, 'sm pri')}</div></div>`).join(''));
  };
  UI.A.reMgrGo = (id) => { const c = TG.G.re.pool.list.find((x) => x.id === id); if (c) TG.RE.hireManager(TG.G, c); UI.closeModal(); UI.refresh(); };
  UI.A.reMgrFire = () => { TG.G.re.manager = null; UI.refresh(); };
  UI.A.reHandy = () => { TG.G.re.handyman = !TG.G.re.handyman; UI.refresh(); };
  UI.A.reFund = () => after(TG.RE.raiseFund(TG.G), 'Fund raised.');

  // ---------- investing ----------
  function inv(g) {
    const I = TG.I, A = TG.CONFIG.invest.assets, iv = g.invest;
    let o = `<div class="card"><div class="kv"><span>Portfolio</span><span>${m(I.posValue(g))}</span><span>Margin debt</span><span>${m(iv.marginDebt)}</span><span>Angel stakes (est.)</span><span>${m(I.angelValue(g))}</span></div>
      ${iv.marginDebt > 0 ? `<div class="row" style="margin-top:6px"><input type="number" id="mgAmt" placeholder="amount">${UI.btn('Repay margin', 'mgRepay', null, 'sm')}</div><div class="mute">If equity falls below ${U.pct(TG.CONFIG.invest.margin.callAt)} of the position, a margin call force-sells.</div>` : ''}</div>`;
    o += `<div class="card"><h3 style="margin-top:0">Markets</h3><div class="mute">Prices move randomly with the economy. Penny stocks and coins drift down on average and can go to zero. No patterns to exploit.</div>`;
    for (const [s, a] of Object.entries(A)) {
      if (a.kind !== 'stock' && !g.settings.gambling) continue;
      const p = iv.prices[s]; const h = iv.hist[s] || []; const pos = iv.pos[s]; const val = pos ? pos.qty * p : 0; const prev = h.length > 12 ? h[h.length - 13] : h[0];
      o += `<div class="ev ${a.kind !== 'stock' ? 'warn' : ''}"><div class="row sp"><b>${s} · ${esc(a.label)}</b><span>${p > 0 ? p.toFixed(p < 5 ? 3 : 2) : 'delisted'} ${prev ? `<span class="${UI.tone(p - prev)} small">${p >= prev ? '+' : ''}${U.pct((p - prev) / prev)} 1y</span>` : ''}</span></div>
        <div class="small">${a.kind === 'stock' ? `volatility ${U.pct(a.sd)}/mo` : UI.pill(`high risk: ${U.pct(a.zero || 0, 1)}/mo chance of going to zero`, 'bad')}${pos ? ` · you own ${m(val)} (cost ${m(pos.cost)}, ${UI.signed(val - pos.cost)})` : ''}</div>
        ${UI.spark(h.slice(-60), '#1d4ed8')}
        <div class="row"><input type="number" id="amt_${s}" placeholder="$ amount">${UI.btn('Buy', 'invBuy', `${s}|0`, 'sm')}${g.settings.gambling ? UI.btn('Buy w/ margin', 'invBuy', `${s}|1`, 'sm') : ''}${pos ? UI.btn('Sell half', 'invSell', `${s}|0.5`, 'sm') + UI.btn('Sell all', 'invSell', `${s}|1`, 'sm') : ''}</div></div>`;
    }
    o += '</div>';
    if (g.settings.gambling) {
      o += `<div class="card"><h3 style="margin-top:0">Angel investing</h3><div class="mute">Most startups fail (about two in three return nothing). A rare few return 15x+. Money is locked for years.</div>
        ${iv.angelOffers.map((a) => `<div class="ev"><div class="row sp"><b>${esc(a.name)}</b><span>min ${m(a.min)}</span></div><div class="small">${esc(a.sector)} · ${esc(a.buzz)}</div><div class="row"><input type="number" id="ang_${a.id}" value="${a.min}">${UI.btn('Invest', 'angel', a.id, 'sm')}</div></div>`).join('') || '<div class="mute">No pitches right now.</div>'}
        ${iv.angels.length ? `<h3>Your stakes</h3>${iv.angels.map((a) => `<div class="small">${esc(a.name)} (${esc(a.sector)}): ${m(a.amt)} in, ${a.left} mo to exit${a.mark != null ? `, marked at ${a.mark.toFixed(2)}x` : ''}</div>`).join('')}` : ''}</div>`;
    }
    return o;
  }
  UI.A.invBuy = (arg) => { const [s, mg] = arg.split('|'); after(TG.I.buy(TG.G, s, UI.num('amt_' + s, 0), mg === '1'), 'Bought.'); };
  UI.A.invSell = (arg) => { const [s, f] = arg.split('|'); const v = TG.I.sell(TG.G, s, Number(f)); UI.toast(`Sold for ${m(v)}.`); UI.refresh(); };
  UI.A.mgRepay = () => { TG.I.repayMargin(TG.G, UI.num('mgAmt', 0)); UI.refresh(); };
  UI.A.angel = (id) => after(TG.I.angelInvest(TG.G, id, UI.num('ang_' + id, 0)), 'Invested.');

  // ---------- casino ----------
  function casino(g) {
    const CC = TG.CONFIG.casino, c = g.invest.casino, I = TG.I;
    const amt = UI.S.betAmt || 100;
    let o = `<div class="card"><div class="kv"><span>Net this month</span><span>${UI.signed(c.net)}</span><span>Lifetime</span><span>${UI.signed(c.lifetimeNet)}</span><span>Bets left this month</span><span>${Math.max(0, CC.betsPerMonth - c.bets)}</span><span>Table limit</span><span>${m(I.betLimit(g))}</span></div>
      <div class="row" style="margin-top:6px"><span>Bet</span><input type="number" id="betAmt" value="${amt}" min="${CC.minBet}" max="${I.betLimit(g)}"></div>
      <div class="mute">Every game has a house edge: over time you lose. Limits keep it from becoming a strategy.${g.invest.habit > 40 ? ' <b class="warn">Your gambling habit is growing: you may start chasing losses on your own.</b>' : ''}${c.banned ? ' <b class="bad">You are banned from the casino.</b>' : ''}</div>
      ${UI.S.lastBet ? `<div class="ev ${UI.S.lastBet.win ? 'good' : 'bad'}">${esc(UI.S.lastBet.text)}</div>` : ''}</div>`;
    o += `<div class="card"><h3 style="margin-top:0">🎰 Casino</h3><div class="btns">${Object.entries(CC.games).map(([k, gm]) => UI.btn(`${esc(gm.label)}${gm.pays ? ` (pays ${gm.pays}:1)` : ` (${U.pct(gm.rtp)} return)`}`, 'bet', `c|${k}`, 'sm')).join('')}</div></div>`;
    const r = g.invest.race;
    o += `<div class="card"><h3 style="margin-top:0">🏇 Horse race</h3>${r.horses.map((h, i) => `<div class="row sp small"><span>${esc(h.name)}</span><span>${h.odds.toFixed(2)}x ${UI.btn('Bet', 'bet', `h|${i}`, 'sm')}</span></div>`).join('')}</div>`;
    const gm = g.invest.game;
    o += `<div class="card"><h3 style="margin-top:0">🏈 Sports</h3><div class="row sp small"><span>${esc(gm.a)}</span><span>${gm.oddsA.toFixed(2)}x ${UI.btn('Bet', 'bet', 's|a', 'sm')}</span></div><div class="row sp small"><span>${esc(gm.b)}</span><span>${gm.oddsB.toFixed(2)}x ${UI.btn('Bet', 'bet', 's|b', 'sm')}</span></div></div>`;
    return o;
  }
  UI.A.bet = (arg) => {
    const g = TG.G; const [k, x] = arg.split('|'); const a = UI.num('betAmt', 0); UI.S.betAmt = a;
    const r = k === 'c' ? TG.I.casinoBet(g, x, a) : k === 'h' ? TG.I.betHorse(g, Number(x), a) : TG.I.betSports(g, x, a);
    if (!r.ok) return UI.toast(r.msg, true);
    UI.S.lastBet = r; UI.refresh();
  };
  UI.A.setToggle = (k) => { TG.G.settings[k] = !TG.G.settings[k]; UI.refresh(); };
})();

</script>
<script>/* js/ui/ui-misc.js */
/* ui-misc.js - "More" screen: managers & CEO, news, event log, achievements & leaderboard, settings, help. */
(function () {
  const TG = globalThis.TG; const U = TG.U; const UI = TG.UI; const esc = UI.esc, m = UI.m; const N = (x) => Math.round(x).toLocaleString();

  UI.screens.more = () => {
    const tabs = [['mgr', '👔 Managers'], ['news', '📰 News'], ['log', '📜 Log'], ['ach', '🏆 Goals'], ['set', '⚙️ Settings'], ['help', '❓ Help']];
    const t = UI.curTab('more', 'mgr');
    return `<div class="row sp"><h2>☰ More</h2>${UI.btn('📈 Industry Outlook', 'go', 'ind', 'sm')}</div>${UI.tabs('more', tabs)}${({ mgr, news, log, ach, set, help }[t] || mgr)(TG.G)}`;
  };

  // ---------- managers & CEO ----------
  function mgr(g) {
    const C = TG.CONFIG;
    let o = `<div class="card"><h3 style="margin-top:0">How managers work</h3><div class="mute">Problems (breakdowns, thefts, poaching, lawsuits, bad PR) create decision cards. If you don't answer by next month, the right manager decides: their skill and happiness set the chance of a good call. Reckless managers take risks, cautious ones play safe, and dishonest ones may skim. With nobody to cover, the default happens and problems pile up. There are no spending limits: watch who you trust.</div></div>`;
    o += `<div class="card"><h3 style="margin-top:0">CEO</h3>`;
    if (g.ceo) { const c = g.ceo; o += `<div class="kv"><span>Name</span><span>${esc(c.name)}</span><span>Skill</span><span>~${c.skillSeen}</span><span>Morale</span><span>${Math.round(c.morale)}</span><span>Pay</span><span>${m(c.wage)}/mo + ${U.pct(c.profitShare, 1)} of profit</span><span>Good-call chance</span><span>${U.pct(TG.D.pGood(g, c, true))}</span><span>Style</span><span>${esc(c.trait || 'steady')}</span></div>
        <div class="kv" style="margin-top:6px"><span>CEO makes big moves (expansions, equipment, hiring)</span><span>${UI.btn(g.settings.ceoBigMoves ? 'On' : 'Off', 'setToggle', 'ceoBigMoves', 'sm')}</span></div>
        <div class="btns">${UI.btn(`Fire (severance ${m(c.wage * 3)})`, 'ceoFire', null, 'sm badb')}</div><div class="mute">A CEO covers every business when no specialist does, but gets worse past ${C.ceo.spanFree} businesses (spread thin).</div>`; }
    else {
      o += `<div class="mute">A CEO handles decisions across all businesses. Expensive: worth it once you run several.</div>`;
      for (const c of TG.D.ceoPool(g)) o += `<div class="ev"><div class="row sp"><b>${esc(c.name)}</b><span>${m(c.wage)}/mo + ${U.pct(c.profitShare, 1)} profit</span></div><div class="small">Skill ~${c.skillSeen} · ${c.years} yrs · style ${esc(c.trait || '?')}</div><div class="btns">${UI.btn('Hire', 'ceoHire', c.id, 'sm pri')}</div></div>`;
    }
    o += `</div><div class="card"><h3 style="margin-top:0">Managers by business</h3>`;
    for (const b of g.businesses) {
      const sp = Object.entries(b.spec || {}).filter(([, e]) => e);
      o += `<div class="ev"><div class="row sp"><b>${esc(b.name)}</b>${UI.btn('Open', 'go', `bizd:${b.id}`, 'sm')}</div><div class="small">${sp.length ? sp.map(([r, e]) => `${esc(C.specialists[r].label)}: ${esc(e.name)} (skill ~${e.skillSeen}, morale ${Math.round(e.morale)}, ${U.pct(TG.D.pGood(g, e))} good calls)`).join('<br>') : '<span class="warn">No managers: problems wait for you.</span>'}</div></div>`;
    }
    if (g.re.holdings.length) o += `<div class="ev"><b>Real estate</b><div class="small">${g.re.manager ? `Property manager ${esc(g.re.manager.name)}` : 'No property manager'}</div></div>`;
    return o + '</div>';
  }
  UI.A.ceoHire = (id) => { const c = (TG.G.ceoPool && TG.G.ceoPool.list || []).find((x) => x.id === id); if (c) { TG.D.hireCeo(TG.G, c); UI.toast(`${c.name} is your CEO.`); } UI.refresh(); };
  UI.A.ceoFire = () => { TG.D.fireCeo(TG.G); UI.refresh(); };

  // ---------- news / log ----------
  function news(g) {
    const n = (g.newsFeed || []).slice().reverse().slice(0, 80);
    return `<div class="card"><div class="mute">World events move prices, demand and wages. Economy: <b>${esc(TG.W.phaseLabel(g))}</b> · interest ${U.pct(g.world.baseRate, 1)} · prices x${g.world.priceIdx.toFixed(2)} · wages x${g.world.wageIdx.toFixed(2)} · housing x${g.world.housing.toFixed(2)}</div></div>` +
      (n.length ? n.map((e) => `<div class="ev ${e.tone}"><span class="mute">${U.dateStr(e.m)}</span> ${e.big ? '<b>' : ''}${esc(e.text)}${e.big ? '</b>' : ''}</div>`).join('') : '<div class="card mute">No news yet.</div>');
  }
  function log(g) {
    const f = UI.S.logF || 'all';
    let L = g.log.slice().reverse(); if (f !== 'all') L = L.filter((e) => (f === 'bad' ? e.type === 'bad' || e.type === 'major' : e.type === f));
    return `<div class="row"><span class="small">Show</span><select data-change="logF">${[['all', 'Everything'], ['bad', 'Problems'], ['good', 'Good news'], ['decision', 'Decisions'], ['staff', 'Staff']].map(([v, l]) => `<option value="${v}"${f === v ? ' selected' : ''}>${l}</option>`).join('')}</select></div><div class="card" style="margin-top:8px">` +
      (L.slice(0, 200).map((e) => `<div class="small" style="border-bottom:1px solid #eee;padding:3px 0"><span class="mute">${U.dateStr(e.m)}</span> ${e.type === 'major' ? '🔴' : e.type === 'bad' ? '🟠' : e.type === 'good' ? '🟢' : e.type === 'decision' ? '🧭' : e.type === 'staff' ? '👥' : e.type === 'news' ? '📰' : '•'} ${e.biz ? `<b>${esc(e.biz)}</b>: ` : ''}${e.by ? `${esc(e.by)}: ` : ''}${esc(e.text)}${e.why ? `<div class="mute">Why: ${esc(e.why)}</div>` : ''}</div>`).join('') || '<div class="mute">Nothing yet.</div>') + '</div>';
  }
  UI.A.logF = (v) => { UI.S.logF = v; UI.refresh(); };

  // ---------- achievements & leaderboard ----------
  function ach(g) {
    const A = TG.CONFIG.achievements;
    let o = `<div class="card"><h3 style="margin-top:0">Achievements (${Object.keys(g.achievements).length}/${Object.keys(A).length})</h3>${Object.entries(A).map(([k, l]) => `<div class="small">${g.achievements[k] != null ? `🏆 <b>${esc(l)}</b> <span class="mute">${U.dateStr(g.achievements[k])}</span>` : `<span class="mute">🔒 ${esc(l)}</span>`}</div>`).join('')}</div>`;
    o += `<div class="card"><h3 style="margin-top:0">Milestones</h3>${TG.CONFIG.leaderboardTargets.map((t) => `<div class="small">${g.stats.reached && g.stats.reached[t] != null ? '✅' : '⬜'} Net worth ${m(t)}${g.stats.reached && g.stats.reached[t] != null ? ` in ${U.yrsMo(g.stats.reached[t])}` : ''}</div>`).join('')}<div class="mute">Peak net worth: ${m(g.stats.peakNW)}</div></div>`;
    const lb = TG.LB.all();
    o += `<div class="card"><h3 style="margin-top:0">Leaderboard (this device)</h3><table><tr><th>Player</th><th class="n">Peak</th><th class="n">Time</th></tr>${lb.map((e) => `<tr${e.id === g.gameId ? ' style="font-weight:700"' : ''}><td>${esc(e.name)} <span class="mute">${esc(e.scenario || '')}${e.bankruptcies ? `, ${e.bankruptcies} bankrupt` : ''}</span></td><td class="n">${m(e.peak)}</td><td class="n">${U.yrsMo(e.months)}</td></tr>`).join('') || '<tr><td class="mute">Play a few months to appear here.</td></tr>'}</table></div>`;
    return o;
  }

  // ---------- settings ----------
  function set(g) {
    const s = g.settings, MT = { breakdown: 'Equipment breakdowns', keyQuit: 'Key staff quitting', cash: 'Cash crunch / bankruptcy', lawsuit: 'Lawsuits', strike: 'Strikes & walkouts', harvest: 'Harvests', weather: 'Weather disasters' };
    const tg = (k, label, note) => `<span>${label}${note ? `<div class="mute">${note}</div>` : ''}</span><span>${UI.btn(s[k] ? 'On' : 'Off', 'setToggle', k, 'sm' + (s[k] ? ' goodb' : ''))}</span>`;
    let o = `<div class="card"><h3 style="margin-top:0">Gameplay</h3><div class="kv">
      ${tg('stopOnMajor', 'Stop a skip early on major events', 'Off by default. Choose the event types below.')}
      ${tg('confirmPending', 'Warn before Next Month if decisions are waiting')}
      ${tg('gambling', 'Gambling & high-risk investing', 'Casino, betting, penny stocks, coins, margin, angel deals')}
      ${tg('crime', '🕶️ Crime side', 'Street deals, bank jobs, sabotage. Off hides it and freezes everything there.')}
      ${tg('habit', 'Gambling habit can build up', 'Big bets can lead to chasing losses on their own')}
      ${tg('ceoBigMoves', 'CEO may make big moves for me')}
      <span>Event frequency</span><span><select data-change="setFreq"><option value="normal"${s.eventFreq === 'normal' ? ' selected' : ''}>Normal</option><option value="calm"${s.eventFreq === 'calm' ? ' selected' : ''}>Calm</option></select></span></div></div>`;
    o += `<div class="card"><h3 style="margin-top:0">Stop the skip on…</h3><div class="kv">${Object.entries(MT).map(([k, l]) => `<span>${l}</span><span>${UI.btn(s.majorTypes[k] ? 'Yes' : 'No', 'setMajor', k, 'sm' + (s.majorTypes[k] ? ' goodb' : ''))}</span>`).join('')}</div></div>`;
    o += `<div class="card"><h3 style="margin-top:0">Save</h3><div class="mute">The game autosaves after every month and action${TG.store.ok ? ' in this browser' : '. <b class="bad">Browser storage is blocked here, so autosave only lasts this session: use Export to keep your progress.</b>'}.</div>
      <div class="btns">${UI.btn('Export save code', 'exportSave', null, 'sm')}${UI.btn('Import save code', 'importSave', null, 'sm')}${UI.btn('New game', 'newGameOpen', null, 'sm pri')}${UI.btn('Delete save', 'clearSave', null, 'sm badb')}</div>
      <div class="mute">Seed ${g.seed} · month ${g.month} · version ${TG.VERSION}</div></div>`;
    return o;
  }
  UI.A.setMajor = (k) => { const s = TG.G.settings; s.majorTypes[k] = !s.majorTypes[k]; UI.refresh(); };
  UI.A.setFreq = (v) => { TG.G.settings.eventFreq = v; UI.refresh(); };
  UI.A.exportSave = () => { const c = TG.Game.exportCode(TG.G); UI.modal('Export save', `<div class="card"><div class="mute">Copy this code somewhere safe. Paste it into Import to continue later (any browser).</div><textarea id="expCode" style="width:100%;height:160px" readonly>${esc(c)}</textarea><div class="btns">${UI.btn('Copy', 'copyCode', null, 'sm pri')}</div></div>`); };
  UI.A.copyCode = () => { const t = document.getElementById('expCode'); t.select(); try { document.execCommand('copy'); UI.toast('Copied.'); } catch (e) { UI.toast('Select and copy it manually.'); } };
  UI.A.importSave = () => UI.modal('Import save', `<div class="card"><textarea id="impCode" style="width:100%;height:160px" placeholder="TYC1:..."></textarea><div class="btns">${UI.btn('Load this save', 'importGo', null, 'pri')}</div></div>`);
  UI.A.importGo = () => { try { TG.Game.importCode(UI.val('impCode')); UI.closeModal(); UI.save(); UI.toast('Save loaded.'); UI.go('home'); } catch (e) { UI.toast(e.message || 'Invalid code.', true); } };
  UI.A.newGameOpen = () => UI.newGameScreen(false);
  UI.A.clearSave = () => UI.confirm('Delete the saved game and start over?', 'clearGo');
  UI.A.clearGo = () => { TG.Game.clearSave(); if (TG.IDB) TG.IDB.put('tycoon_save_v1', null); TG.G = null; UI.closeModal(); UI.newGameScreen(true); };

  // ---------- help ----------
  const MONEY = {
    cafe: 'Drinks and food. Price × cups sold, minus beans, milk and wages.', foodtruck: 'Meals sold where the truck parks. Events and good spots pay most.',
    bakery: 'Bread and cakes baked each morning. Unsold stock goes stale fast.', salon: 'Haircuts and color per visit. Good stylists keep regulars.',
    carwash: 'Price per wash × cars. Sunny weeks busy, rainy weeks quiet.', lawn: 'Mowing jobs in spring and summer, little in winter.',
    auto: 'Repair jobs: labor plus parts. Honest work brings repeat customers.', gym: 'Monthly memberships. January rush, then people quit.',
    farm: 'Crops sold at harvest; milk collected daily; cattle sold for meat when you (or your manager) sell them.', freight: 'Rate per load × loads hauled, minus diesel, tolls and drivers.',
    brand: 'Buy batches of clothes, sell them online. Hits sell out; flops sit in the warehouse.', hotel: 'Room-nights × room rate. Busy seasons and reviews drive it.',
    law: 'Billable case hours × hourly rate.', clinic: 'Patient visits paid by insurance, often late.',
    construction: 'Win bids, build, get paid by stages. Overruns eat profit.', factory: 'Products made on lines and sold in bulk at market price.',
    tech: 'Users who pay a subscription. Growth costs engineers and servers first.', franchise: 'Fees and royalties from every shop that franchisees run.',
  };
  const TIPS = {
    cafe: ['Watch the Baristas bar: over 100% means lost customers.', 'Fresh stock spoils in about 2 months: buy small, often.'],
    foodtruck: ['A spare generator fund helps: if the truck stops, sales stop.', 'Food spoils in a month.'],
    bakery: ['Match what you buy to what sells: leftovers spoil.', 'Ovens and mixers both limit output.'],
    salon: ['Chairs without stylists earn nothing, and the reverse too.', 'Happy stylists stay; leaving ones can take clients.'],
    carwash: ['Weather moves sales a lot: keep cash for slow months.', 'A running tunnel near 100% wears out much faster.'],
    lawn: ['Winter is slow: do not overhire in spring.', 'Mowers wear quickly when every crew is maxed.'],
    auto: ['Each tech needs a lift and the scanner keeps up with all of them.', 'Cutting corners raises lawsuit odds.'],

  function help(g) {

    if (t0 === 'crime') return `<div class="card">${pick}</div>${crimeHelp(g, C)}`;
    if (t0 === 'how' || !C.businesses[t0]) return `<div class="card">${pick}</div>${howTo(C)}`;
    const d = C.businesses[t0]; const k = t0; let o = `<div class="card">${pick}</div><div class="card"><h3 style="margin-top:0">${d.icon} ${esc(d.name)}</h3><div class="mute">${esc(d.blurb || '')}</div>`;

    o += `<h4>🛠️ Equipment</h4>` + d.equip.map((e) => { const cat = C.equipCats[e.cat] || ['🛠️']; return UI.irow('he' + k + e.id, cat[0], e.label, U.money(e.price), `${e.desc || ''} Lasts about ${Math.round(e.life / 12)} yrs. Breaks about ${(e.brk * 100).toFixed(1)}% a month when new; more when old or run near 100%.`); }).join('');
    if (d.supply) o += `<h4>📦 Supplies</h4>` + UI.irow('hs' + k, d.supply.icon || '📦', d.supply.label || 'Supplies', '', `${d.supply.desc || 'Bought ahead and used as you sell.'} ${d.supply.shelf && d.supply.shelf < 900 ? `Goes bad after about ${d.supply.shelf} months.` : 'Does not go bad.'} Storage limits how much you can hold.`);
    else if (k === 'farm') o += `<h4>📦 Supplies</h4>` + UI.irow('hs' + k, '🌱', 'Seed, feed, animals', '', 'Seed is bought before planting and limited by storage. Animals need feed and get older each month: calves grow, cows give milk, old cows retire.');
    else o += `<h4>📦 Stock</h4>` + UI.irow('hs' + k, '📋', { construction: 'Jobs', tech: 'Users', franchise: 'Shops', brand: 'Batches', factory: 'Materials and products' }[k] || 'Stock', '', { construction: 'Each job goes bid → build → paid. Materials are bought per job.', tech: 'Users sign up, use the app, and some leave each month.', franchise: 'Shops open, grow, and some close.' }[k] || 'Bought or made, kept in storage, then sold.');
    const risks = (d.risks || []).filter((r) => r.base).slice().sort((a, b) => b.base - a.base).slice(0, 5);
    o += `<h4>⚠️ Main risks</h4>` + risks.map((r) => UI.irow('hk' + k + r.id, '⚠️', r.label, `~${(r.base * 100).toFixed(1)}%/mo`, `Usual odds before your choices change them. Caused by: ${r.why || 'bad luck'}.`)).join('');
    o += `<h4>💡 Tips</h4><ul class="plain small">${(TIPS[k] || []).map((x) => `<li>${esc(x)}</li>`).join('')}<li>Nothing is guaranteed: every month is rolled from odds.</li></ul></div>`;

  function crimeHelp(g, C) {

      ${r(1, '💵', 'Street cash', 'Crime money is dirty. It pays crew and goods. Clean it through your businesses (🧼) to use it normally: you lose a fee and pay tax on it.')}

      ${r(7, '⛓️', 'Jail', 'Months pass while managers run your businesses. You can only skip time. On conviction the street business is taken, and businesses used for laundering can be seized.')}
      ${r(8, '⚖️', 'Lawyers & bribes', 'Lower the odds at a real monthly cost. Never to zero. Bribes can blow up in a scandal.')}
      ${r(9, '🎯', 'Jobs', 'Bank jobs (plan, gear, pros raise odds), hitting a rival business, insider trades, car theft. Each shows its odds before you go.')}
      <ul class="plain small"><li>Crime can pay big, and it ruins people often. Careful play earns about as much as a good legit business, with far bigger swings.</li><li>Nothing is guaranteed.</li></ul></div>`;
  }
  function howTo(C) {
    const rows = [['🏪', 'Start', 'Pick a business and a place in Market. The place decides how many customers come.'], ['🛠️', 'Equip', 'Machines and space set how much you can make or serve each month.'], ['👥', 'Staff', 'Each worker handles a set amount. Training raises it. Too much work makes people unhappy.'],
      ['📦', 'Stock', 'Buy supplies ahead. Storage limits how much. Old stock goes bad.'], ['🏷️', 'Price', 'Follow the market, or set your own price. Higher = fewer buyers.'], ['📊', 'Work bars', 'Green = fine, yellow = busy or idle, red = over 100%: lost sales and fast wear.'],
      ['▶️', 'Next month', 'Press it to play a month. The report shows money in and out and why things happened.'], ['⚠️', 'Risk', 'Bad events have odds you can see. Upkeep, managers and insurance lower them.'], ['📈', 'Grow', 'Hire managers, open more businesses, buy property, invest. No ending.']];

  }
})();
