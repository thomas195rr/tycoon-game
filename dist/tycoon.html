      <div class="btns">${UI.btn('Save ad plan', 'adSave', null, 'pri')}</div>
      <div class="mute">Current effect: about +${U.pct(ab.boost || 0)} demand. Ads have diminishing returns and work worse with a poor reputation${b.spec.ads ? '; your ads manager makes spend go further' : ''}.</div></div>`;
    o += `<div class="card"><h3 style="margin-top:0">Reputation & PR</h3><div>Reputation ${Math.round(b.rep)}/100 ${UI.bar(b.rep, 100)}</div><div class="mute">PR can speed up recovery after a hit, but can flop.</div><div class="btns">${Object.entries(C.pr).map(([k, p]) => UI.btn(`${p.label} (${p.cost != null ? m(p.cost * g.world.priceIdx) : m(b.revAvg * p.costRev)}, ${U.pct(p.fail)} flop)`, 'pr', k, 'sm')).join('')}</div></div>`;
    return o;
  }
  UI.A.adSave = () => { const b = biz(); b.ads.budget = Math.max(0, Math.round(UI.num('adBudget', 0))); b.ads.channel = UI.val('adCh') || 'social'; UI.toast('Ad plan saved.'); UI.refresh(); };
  UI.A.pr = (k) => { TG.B.doPR(TG.G, biz(), k, 'You'); const d = TG.G.cur.decisions[TG.G.cur.decisions.length - 1]; UI.toast(d ? d.text : 'Done.', d && d.outcome === 'bad'); UI.refresh(); };

  // ---------- ownership ----------
  function own(g, b) {
    const F = TG.F, C = TG.CONFIG.finance; const v = F.bizValue(g, b);
    const prop = g.properties.find((p) => p.id === b.propId);
    let o = `<div class="card"><div class="kv"><span>Estimated business value</span><span>${m(v)}</span><span>Outside owners</span><span>${U.pct(b.outside || 0)}${b.public ? ' (public)' : ''}</span><span>Sale price (incl. owned property)</span><span>${m(TG.B.saleValue(g, b))}</span></div><div class="mute">Value is based on recent profit, assets and reputation.</div></div>`;
    o += `<div class="card"><h3 style="margin-top:0">Raise money</h3><div class="mute">Investors pay cash now and take that share of profits forever (until you buy them back at a premium).</div><div class="btns">${[0.1, 0.2, 0.3].map((p) => { const off = F.investorOffer(g, b, p); return UI.btn(`Sell ${U.pct(p)} for ${m(off.cash)}`, 'invTake', p, 'sm', off.cash < 10000 || (b.outside || 0) + p > 0.9); }).join('')}
      ${UI.btn(`IPO (needs ${m(C.ipoMinValue)} value)`, 'ipo', null, 'sm', b.public || v < C.ipoMinValue)}${UI.btn(`Buy back (${m(v * (b.outside || 0) * 1.2)})`, 'buyBack', null, 'sm', !b.outside)}</div></div>`;
    o += `<div class="card"><h3 style="margin-top:0">Exit</h3><div class="btns">${UI.btn(`Sell business ${m(TG.B.saleValue(g, b))}`, 'bizSell', null, 'sm')}${UI.btn('Close (sell equipment, keep property)', 'bizClose', null, 'sm')}${UI.btn('Business bankruptcy', 'bizBk', null, 'sm badb')}</div>
      <div class="mute">Business bankruptcy is only allowed when this business's debts exceed its assets: it wipes linked loans but hurts your credit${prop ? '' : ''}.</div>
      <div class="row" style="margin-top:6px"><span class="small">Rename</span><input type="text" id="bizName" value="${esc(b.name)}" maxlength="30">${UI.btn('Save', 'bizRename', null, 'sm')}</div></div>`;
    return o;
  }
  UI.A.invTake = (p) => { UI.res(TG.F.takeInvestor(TG.G, biz(), Number(p)), 'Investors are in.'); UI.refresh(); };
  UI.A.ipo = () => { UI.res(TG.F.ipo(TG.G, biz()), 'IPO complete!'); UI.refresh(); };
  UI.A.buyBack = () => { UI.res(TG.F.buyBack(TG.G, biz()), 'Bought back all shares.'); UI.refresh(); };
  UI.A.bizSell = () => UI.confirm('Sell this business (and its owned property)?', 'bizSellGo');
  UI.A.bizSellGo = () => { const v = TG.B.sell(TG.G, UI.bizId); UI.closeModal(); UI.toast(`Sold for ${m(v)}.`); UI.go('biz'); };
  UI.A.bizClose = () => UI.confirm('Close this business? Equipment is sold, staff let go, property kept.', 'bizCloseGo');
  UI.A.bizCloseGo = () => { const g = TG.G, b = biz(); for (const e of TG.S.allStaff(b).slice()) TG.S.fire(g, b, e.id, 'business closed'); TG.B.close(g, b, 'closed by owner', false); UI.closeModal(); UI.toast('Closed.'); UI.go('biz'); };
  UI.A.bizBk = () => UI.confirm('File business bankruptcy? Only allowed if this business owes more than it owns.', 'bizBkGo');
  UI.A.bizBkGo = () => { const r = TG.F.businessBankruptcy(TG.G, UI.bizId); UI.closeModal(); if (UI.res(r, 'Filed.')) UI.go('biz'); };
  UI.A.bizRename = () => { const b = biz(); const n = UI.val('bizName').trim(); if (n) b.name = n.slice(0, 30); UI.refresh(); };

  UI.confirm = (text, act, arg) => UI.modal('Are you sure?', `<div class="card"><p>${esc(text)}</p><div class="btns">${UI.btn('Yes', act, arg, 'badb')}${UI.btn('Cancel', 'closeModal')}</div></div>`);
})();

</script>
<script>/* js/ui/ui-models.js */
/* ui-models.js - icon-first stock rows ("cow rows") for every business + each model's extra panel. */
(function () {
  const TG = globalThis.TG; const U = TG.U; const UI = TG.UI; const esc = UI.esc, m = UI.m;
  const biz = () => TG.B.get(TG.G, UI.bizId);
  const P = (UI.modelPanel = {});
  const after = (r, msg) => { UI.res(r, msg); UI.refresh(); };
  const N = (x) => Math.round(x || 0).toLocaleString();
  const qty = (id, def) => `<input type="number" id="${id}" min="1" value="${Math.max(1, Math.round(def || 1))}" aria-label="how many">`;
  const FD = () => TG.CONFIG.businesses.farm.farm;

  // ================= STOCK CARD (every business) =================
  UI.stockCard = (g, b) => {
    const d = TG.B.def(b); let rows = ''; let title = '📦 What you have';
    if (b.farm) { const r = farmRows(g, b); rows = r.rows; title = r.title; }
    else if (d.model === 'service') rows = serviceRows(g, b);
    else if (b.brand) rows = brandRows(g, b);
    else if (b.factory) rows = factoryRows(g, b);
    else if (b.tech) rows = techRows(g, b);
    else if (b.proj) rows = projRows(g, b);
    else if (b.fr) rows = frRows(g, b);
    else if (d.model === 'freight') rows = freightRows(g, b);
    return rows ? `<div class="card"><h3>${title}</h3>${rows}</div>` : '';
  };

  // ---- services: supplies + what you sell + who you serve ----
  function serviceRows(g, b) {
    const d = TG.B.def(b), gd = TG.PR.good(b) || {}, lc = b.lastCtx || {}; let o = '';
    const s = TG.ST.def(b);
    if (s) {
      const st = TG.ST.ensure(b); const cap = TG.ST.cap(b); const uc = TG.ST.unitCost(g, b);
      const per = Math.max(1, Math.round(lc.served || cap / 3));
      o += UI.irow('sup' + b.id, s.icon, s.label, `${N(st.qty)}/${N(cap)}`, `${s.desc || 'Used up by every sale.'} ${m(uc)} each. ${U.pct(s.spoil, 0)} of leftovers spoil each month. Run out = customers turned away.`,
        qty('qSup', per) + UI.btn('🛒 Buy', 'stBuy', null, 'xs goodb') + UI.btn('Sell', 'stSell', null, 'xs') + UI.btn(st.auto ? '🤖 Auto ✓' : '🤖 Auto ✗', 'stAuto', null, 'xs' + (st.auto ? ' pri' : '')),
        `last month: +${N(st.inM)} in · −${N(st.usedM)} used${st.spoilM ? ' · −' + N(st.spoilM) + ' spoiled' : ''}${st.lastBy ? ' · ordered by ' + esc(st.lastBy) : ''}`);
      o += `<div style="margin:0 0 6px 48px">${UI.bar(st.qty, Math.max(cap, 1))}</div>`;
    }
    const gIcon = gd.icon || d.icon;
    if (b.type === 'gym') o += UI.irow('mem' + b.id, '🏋️', 'Members', `${N(b.members || lc.served)}/${N(lc.cap)}`, `Members pay monthly. About ${U.pct((d.svc || {}).churn || 0.045)} leave each month; new ones join if you have room and a good reputation.`);
    else if (b.type === 'hotel') { const rooms = Math.max(1, Math.round((lc.cap || 0) / 30)); o += UI.irow('rm' + b.id, '🛏️', 'Rooms filled', `${N((lc.served || 0) / 30)}/${N(rooms)}`, 'Average rooms sold per night last month. Empty rooms earn nothing.'); }
    else o += UI.irow('sv' + b.id, gIcon, gd.label ? gd.label + ' sold' : 'Sold', `${N(lc.served)}/${N(lc.cap)}`, `Last month you sold ${N(lc.served)}. You could do ${N(lc.cap)}. Customers wanted ${N(lc.demand)}.`);
    if (d.svc && d.svc.makeAhead) o += UI.irow('mk' + b.id, '🧺', 'Made fresh, not sold', N(b.stock ? b.stock.wasteM : 0), 'Fresh goods are made ahead each morning. Unsold ones go in the bin.');
    const keyR = TG.M.keyRole(d); const key = b.staff.filter((e) => e.role === keyR).length;
    o += UI.irow('kst' + b.id, '👥', (d.roles[keyR] || {}).label || 'Workers', N(key), 'Your key workers. Each can serve a set amount per month.', UI.btn('Hire', 'tab', 'biz:staff', 'xs'));
    const eq = b.equip.filter((x) => x.broken !== 'destroyed'); const br = eq.filter((x) => x.broken).length; const wear = TG.E.avgWear(b);
    o += UI.irow('eqw' + b.id, '🛠️', 'Equipment', `${eq.length - br}/${eq.length}`, `Working / total. Average wear ${Math.round(wear)}%. Worn gear breaks more often.`, UI.btn('Open', 'tab', 'biz:equip', 'xs'), br ? `<span class="bad">${br} broken</span>` : `wear ${Math.round(wear)}%`);
    return o;
  }
  UI.A.stBuy = () => { const g = TG.G, b = biz(); const n = TG.ST.buy(g, b, UI.num('qSup', 0), 0); after(n > 0 ? { ok: true } : { ok: false, msg: 'No room or not enough cash.' }, `Bought ${N(n)}.`); };
  UI.A.stSell = () => { const g = TG.G, b = biz(); const v = TG.ST.sell(g, b, UI.num('qSup', 0)); after(v > 0 ? { ok: true } : { ok: false, msg: 'Nothing to sell.' }, `Sold back for ${m(v)} (half price).`); };
  UI.A.stAuto = () => { const b = biz(); const st = TG.ST.ensure(b); st.auto = !st.auto; UI.toast(st.auto ? 'Staff/manager will reorder each month.' : 'Only you order now. Watch the count!'); UI.refresh(); };

  // ---- farm: cows / crops ----
  function farmRows(g, b) {
    const f = b.farm, fd = FD(), e = fd.enterprises[f.ent]; let o = '';
    if (TG.M.isLivestock(f)) {
      if (f.cows == null) TG.M.herdInit(f, f.herd || 0);
      const cap = TG.M.farmHeadCap(b); const cp = TG.M.cowPrice(g, b); const beef = TG.W.price(g, 'beef', 0);
      const youngN = U.sum(f.young || [], (x) => x.n); const fc = TG.M.herdForecast(g, b);
      o += UI.irow('cow' + b.id, f.ent === 'dairy' ? '🐄' : '🐄', 'Cows', `${N(f.cows)}`, `Grown-up mothers. Each has about ${U.pct(e.calving)} chance of a calf each spring. They retire at ${Math.round(e.lifespan / 12)} years. Buy ${m(cp)} each, sell ${m(beef * 0.75)}.`,
        qty('qCow', 10) + UI.btn('🛒 Buy', 'cowBuy', null, 'xs goodb') + UI.btn('Sell', 'cowSell', 'cows', 'xs'), `whole herd ${N(f.herd)}/${N(cap)} space`);
      o += `<div style="margin:0 0 6px 48px">${UI.bar(f.herd, cap, true)}</div>`;
      const bars = []; let mx = 1; for (let a = 0; a < e.matureAge; a++) { const n = U.sum((f.young || []).filter((x) => x.age === a), (x) => x.n); bars.push(n); mx = Math.max(mx, n); }
      o += UI.irow('yng' + b.id, '🐮', 'Calves & young', N(youngN), `Born Mar-May. They grow for ${e.matureAge} months, then are ready to sell (some girls stay as new cows). Calves eat less.`, null, `0 → ${e.matureAge} months old`);
      o += `<div class="age" style="margin-left:48px" title="age in months">${bars.map((n) => `<i style="height:${Math.round(n / mx * 100)}%"></i>`).join('')}<i class="rd" style="height:${Math.round(Math.min(1, (f.ready || 0) / mx) * 100)}%"></i></div><div class="mute" style="margin-left:48px">age 0 → ${e.matureAge} months · <span class="good">green = ready</span></div>`;
      o += UI.irow('rdy' + b.id, '🐂', 'Ready to sell', N(f.ready), `Market age ${e.matureAge} months. Sold each month at your price (${m(TG.PR.ask(g, b))}) if buyers agree. Market ${m(beef)}.`,
        qty('qRdy', f.ready || 1) + UI.btn('💵 Sell', 'cowSell', 'ready', 'xs goodb'));
      if (f.ent === 'dairy') { const pc = TG.M.farmParlorCap(b); o += UI.irow('mlk' + b.id, '🥛', 'Cows milked', `${N(Math.min(f.cows, pc))}/${N(f.cows)}`, `A milking parlor milks ${N(160)} cows. Unmilked cows make nothing. Milk can't be stored: unsold milk spoils.`, UI.btn('+ Parlor', 'tab', 'biz:equip', 'xs'), `about ${N(Math.min(f.cows, pc) * e.milkPerCow)} t milk / month`); }
      o += UI.irow('fd' + b.id, '🌽', 'Feed next month', m(fc.feed), 'Every animal eats every month. Pasture is cheap; barn spaces cost more.');
      o += UI.irow('lf' + b.id, '📅', 'Next month', `+${N(fc.births)} / −${N(fc.deaths + fc.culls)}`, `Births ${N(fc.births)} · reaching market age ${N(fc.matured)} · deaths ~${N(fc.deaths)} · old cows retiring ~${N(fc.culls)}.`, null, `born / lost`);
      return { title: f.ent === 'dairy' ? '🐄 Dairy herd' : '🐄 Herd', rows: o };
    }
    // crops & orchards
    const cap = TG.M.farmStoreCap(b), used = TG.M.farmStoreUsed(b); const price = TG.W.price(g, e.market, 0);
    o += UI.irow('crp' + b.id, f.ent === 'orchard' ? '🍎' : '🌾', f.ent === 'orchard' ? 'Fruit stored' : 'Grain stored', `${N(f.stored)} t`, `Harvest goes here if you don't sell it. Costs ${m(e.storageCost || 0)}/t a month and ${U.pct(e.spoil || 0, 1)} spoils. Full storage = the rest is sold cheap or rots.`,
      qty('qCrop', f.stored || 1) + UI.btn('💵 Sell', 'cropSell', null, 'xs goodb'), `market ${m(price)}/t`);
    if (f.ent === 'crops') {
      const sc = TG.M.models.farm.seedCost(g, b);
      o += UI.irow('sd' + b.id, '🌱', 'Seed', `${N(f.seeds)} / ${N(f.acres)} acres`, `You must buy seed before planting (${m(sc)} per acre). Seed takes storage space. Auto buys just enough before planting.`,
        qty('qSeed', Math.max(1, f.acres - (f.seeds || 0))) + UI.btn('🛒 Buy', 'seedBuy', null, 'xs goodb') + UI.btn('Sell', 'seedSell', null, 'xs') + UI.btn(f.autoSeeds ? '🤖 Auto ✓' : '🤖 Auto ✗', 'seedAuto', null, 'xs' + (f.autoSeeds ? ' pri' : '')));
      o += UI.irow('pl' + b.id, '🌿', 'Growing', f.planted ? `${N(f.planted)} acres` : '—', 'Planted in spring, harvested in fall.');
    } else o += UI.irow('tr' + b.id, '🌳', 'Trees', f.orchardAge >= 999 ? 'grown' : `${Math.round(f.orchardAge || 0)}/${e.rampMonths} mo`, 'Young trees give little fruit until fully grown.');
    o += UI.irow('sto' + b.id, '🏚️', 'Storage', `${N(used)}/${N(cap)} t`, 'Grain and seed share this. Add bins or silos in Equipment.', UI.btn('+ Bins', 'tab', 'biz:equip', 'xs'));
    o += `<div style="margin:0 0 6px 48px">${UI.bar(used, Math.max(cap, 1), true)}</div>`;
    o += UI.irow('pol' + b.id, '🧺', 'At harvest', null, 'Sell now, store and wait, or let your manager decide each month.', ['sell', 'store', 'auto'].map((p) => UI.btn({ sell: '💵 Sell', store: '🏚️ Store', auto: '🤖 Auto' }[p], 'farmPol', p, 'xs' + (f.sellPolicy === p ? ' pri' : ''))).join(''));
    return { title: f.ent === 'orchard' ? '🍎 Orchard' : '🌾 Crops', rows: o };
  }
  UI.A.cowBuy = () => after(TG.M.farmBuyCattle(TG.G, biz(), UI.num('qCow', 0)), 'Bought.');
  UI.A.cowSell = (w) => { const r = TG.M.farmSellCattle(TG.G, biz(), UI.num(w === 'cows' ? 'qCow' : 'qRdy', 0), w); after(r, r.ok ? `Sold ${r.head} for ${m(r.rev)}.` : null); };
  UI.A.cropSell = () => { const g = TG.G, b = biz(); const t = Math.min(UI.num('qCrop', 0), b.farm.stored); if (!(t > 0)) return UI.toast('Nothing stored.', true); const v = TG.M.models.farm.sellStored(g, b, t); UI.toast(v > 0 ? `Sold for ${m(v)}.` : 'Buyers said no at your price.', !(v > 0)); UI.refresh(); };
  UI.A.seedBuy = () => after(TG.M.farmBuySeeds(TG.G, biz(), UI.num('qSeed', 0)), 'Seed bought.');
  UI.A.seedSell = () => after(TG.M.farmSellSeeds(TG.G, biz(), UI.num('qSeed', 0)), 'Seed sold (half price).');
  UI.A.seedAuto = () => { const f = biz().farm; f.autoSeeds = !f.autoSeeds; UI.refresh(); };
  UI.A.farmPol = (v) => { biz().farm.sellPolicy = v; UI.refresh(); };

  // ---- brand ----
  function brandRows(g, b) {
    const s = b.brand, br = TG.CONFIG.businesses.brand.brand; const room = TG.M.brandRoom(b); const inc = U.sum(s.incoming, (x) => x.units);
    let o = UI.irow('bst' + b.id, '👕', 'In the warehouse', `${N(s.stock)}/${N(room)}`, `Clothes ready to ship. Out of stock = lost orders. Old stock slowly goes out of style (${U.pct(0.015, 1)} a month).`,
      qty('brUnits', Math.max(br.minBatch, Math.round((s.avgOrders || 300) * 3 / 100) * 100)) + UI.btn('🏭 Order', 'brOrder', '0', 'xs goodb') + UI.btn('🧪 Test', 'brOrder', '1', 'xs'), `about ${m(br.unitCost * g.world.priceIdx)} each · min ${br.minBatch}`);
    o += `<div style="margin:0 0 6px 48px">${UI.bar(s.stock, Math.max(1, room), true)}</div>`;
    o += UI.irow('binc' + b.id, '🚚', 'On the way', N(inc), `Orders take ${br.leadMonths} months to arrive.`, null, s.incoming.map((x) => `${N(x.units)} in ${x.due - g.month} mo`).join(' · ') || 'nothing ordered');
    o += UI.irow('bord' + b.id, '🛒', 'Orders last month', N(s.lastOrders), 'How many people bought. Lost orders mean you ran out.', null, s.lostSales > 0 ? `<span class="bad">${N(s.lostSales)} lost: out of stock</span>` : `average ${N(s.avgOrders)}`);
    o += UI.irow('bfol' + b.id, '❤️', 'Followers', N(s.followers), 'Fans bring steady orders. Ads and good reviews grow them.');
    o += UI.irow('bclr' + b.id, '🏷️', 'Clearance sale', null, 'Sell old stock fast at about 40% of price. Hurts reputation a little.', [0.25, 0.5, 1].map((p) => UI.btn(U.pct(p), 'brClear', p, 'xs')).join(''));
    return o;
  }
  UI.A.brOrder = (t) => { const r = TG.M.brandOrder(TG.G, biz(), UI.num('brUnits', 0), t === '1'); after(r, r.ok ? `Ordered for ${m(r.cost)}.` : null); };
  UI.A.brClear = (p) => { const r = TG.M.brandClearance(TG.G, biz(), Number(p)); after(r.ok ? r : { ok: false, msg: 'Nothing to clear.' }, r.ok ? `Cleared ${r.units} units for ${m(r.rev)}.` : null); };

  // ---- factory ----
  function factoryRows(g, b) {
    const f = b.factory, fd = TG.CONFIG.businesses.factory.factory, M = TG.M.models.factory; const st = TG.ST.ensure(b); const cap = TG.ST.cap(b); const lc = b.lastCtx || {};
    let o = UI.irow('fraw' + b.id, '🪨', 'Raw materials', `${N(st.qty)}/${N(cap)}`, `Every unit made uses one. ${m(TG.ST.unitCost(g, b))} each. Space depends on your building and silos.`,
      qty('qSup', Math.max(1, lc.served || 1000)) + UI.btn('🛒 Buy', 'stBuy', null, 'xs goodb') + UI.btn('Sell', 'stSell', null, 'xs') + UI.btn(st.auto ? '🤖 Auto ✓' : '🤖 Auto ✗', 'stAuto', null, 'xs' + (st.auto ? ' pri' : '')));
    o += `<div style="margin:0 0 6px 48px">${UI.bar(st.qty, Math.max(1, cap))}</div>`;
    o += UI.irow('fln' + b.id, '🏭', 'Production lines', `${M.lines(b).length}/${M.maxLines(b)}`, 'More lines need more space and more workers.', UI.btn('+ Line', 'tab', 'biz:equip', 'xs'), `made ${N(lc.served)} of ${N(lc.cap)} last month`);
    o += UI.irow('ffin' + b.id, '📦', 'Finished goods', N(f.stock), `Waiting to be sold. Storage costs ${m(fd.storagePerUnit * g.world.priceIdx)} each a month.`, ['hold', 'sell'].map((p) => UI.btn(p === 'hold' ? '⏸️ Hold if cheap' : '💵 Sell all', 'facPol', p, 'xs' + ((f.policy === 'hold') === (p === 'hold') ? ' pri' : ''))).join(''));
    return o;
  }
  UI.A.facPol = (v) => { biz().factory.policy = v; UI.refresh(); };

  // ---- tech ----
  function techRows(g, b) {
    const t = b.tech, T = TG.CONFIG.businesses.tech.tech; const sc = TG.E.capacity(b, 'server'); const eng = b.staff.filter((e) => e.role === TG.M.keyRole(TG.B.def(b))).length;
    let o = t.phase === 'build' ? UI.irow('tdev' + b.id, '🧱', 'App being built', `${Math.min(100, Math.round(t.dev / T.devPoints * 100))}%`, 'Engineers build the app. No users until it launches.') + `<div style="margin:0 0 6px 48px">${UI.bar(t.dev, T.devPoints)}</div>` : '';
    o += UI.irow('tus' + b.id, '📱', 'Users', `${N(t.users)}/${N(sc)}`, 'Each user pays every month. More users than servers can handle = outages and people leave.', UI.btn('+ Server', 'tab', 'biz:equip', 'xs'), `best ever ${N(t.peak)}`);
    o += UI.irow('tfit' + b.id, '🎯', 'Do people love it?', t.pmfEst != null ? '~' + U.pct(t.pmfEst) : '?', 'Product fit. Most apps never find it. Research gives a rough guess.', t.researched ? '' : UI.btn(`🔍 ${m(T.researchCost * g.world.priceIdx)}`, 'fix', 'research|1', 'xs'));
    o += UI.irow('teng' + b.id, '🧑‍💻', 'Engineers', N(eng), 'Build faster and keep users happy.', UI.btn('Hire', 'tab', 'biz:staff', 'xs'));
    o += UI.irow('tpv' + b.id, '🔄', 'Start over (pivot)', null, `Costs ${m(100000 * g.world.priceIdx)} and you lose 80% of users. New, unknown fit.`, UI.btn('Pivot', 'techPivot', null, 'xs badb'));
    return o;
  }
  UI.A.techPivot = () => UI.confirm('Pivot the product? You restart development with a new, unknown fit.', 'techPivotGo');
  UI.A.techPivotGo = () => { const r = TG.M.techPivot(TG.G, biz()); UI.closeModal(); after(r, 'Pivoted. Back to building.'); };

  // ---- construction ----
  function projRows(g, b) {
    const pr = b.proj, PC = TG.CONFIG.businesses.construction.projects; const crew = b.staff.filter((e) => e.role === 'laborer').length; const need = U.sum(pr.active, (p) => p.crew);
    let o = UI.irow('cja' + b.id, '🏗️', 'Jobs going', `${pr.active.length}/${PC.maxActive}`, 'Win bids in the Projects tab. Late jobs pay penalties.', UI.btn('Bids', 'tab', 'biz:model', 'xs'), `${pr.done || 0} finished so far`);
    o += UI.irow('ccr' + b.id, '🦺', 'Crew', `${crew}/${need}`, 'Workers you have / workers your jobs need. Short crew = late jobs.', UI.btn('Hire', 'tab', 'biz:staff', 'xs'));
    for (const p of pr.active) o += UI.irow('cp' + p.id, p.elapsed > p.deadline ? '⏰' : '🧱', p.label, `${Math.round(p.progress * 100)}%`, `Month ${p.elapsed} of ${p.months}, deadline ${p.deadline}. Pays ${m(p.price)}.`, null, `${UI.bar(p.progress, 1)}`);
    return o;
  }
  // ---- franchise ----
  function frRows(g, b) {
    const s = b.fr; const L = (st) => s.locations.filter((l) => l.status === st).length;
    let o = UI.irow('fop' + b.id, '🏪', 'Shops open', N(L('open')), 'Each one pays you a share of its sales every month.', null, `${L('building')} opening soon · ${L('closed')} closed`);
    o += UI.irow('fap' + b.id, '📝', 'People asking to join', N(s.apps.length), 'Approve good ones in the Franchisees tab. Weak owners can hurt your brand later.', UI.btn('See', 'tab', 'biz:model', 'xs'));
    o += UI.irow('frg' + b.id, '🧭', 'Area managers', N(b.staff.filter((e) => e.role === 'regional').length), `Each looks after about ${TG.CONFIG.businesses.franchise.roles.regional.cap} shops.`, UI.btn('Hire', 'tab', 'biz:staff', 'xs'));
    return o;
  }
  // ---- freight ----
  function freightRows(g, b) {
    const tr = b.equip.filter((x) => x.type === 'truck' && x.broken !== 'destroyed'); const dr = b.staff.filter((e) => e.role === 'driver').length; const lc = b.lastCtx || {};
    let o = UI.irow('ftr' + b.id, '🚛', 'Trucks working', `${tr.filter((x) => !x.broken).length}/${tr.length}`, 'Each truck can do a set number of loads a month if it has a driver.', UI.btn('+ Truck', 'tab', 'biz:equip', 'xs'), `average wear ${Math.round(TG.E.avgWear(b, (x) => x.type === 'truck'))}%`);
    o += UI.irow('fdr' + b.id, '🧑‍✈️', 'Drivers', `${dr}/${tr.length}`, 'About one driver per truck.', UI.btn('Hire', 'tab', 'biz:staff', 'xs'));
    o += UI.irow('fld' + b.id, '📦', 'Loads', `${N(lc.served)}/${N(lc.cap)}`, 'Loads hauled / loads you could haul last month.');
    o += UI.irow('ffu' + b.id, '⛽', 'Fuel price', `x${g.world.fuel.toFixed(2)}`, 'Locking (hedging) fuel for 12 months wins if fuel spikes, loses if it falls.', UI.btn(b.hedge && b.hedge.until > g.month ? '🔒 Locked' : '🔒 Lock 12 mo', 'frHedge', null, 'xs'));
    return o;
  }
  UI.A.frHedge = () => { const r = TG.M.freightHedge(TG.G, biz()); after(r, r.ok ? `Hedged for ${m(r.cost)}.` : null); };

  // ================= EXTRA TABS =================
  P.farm = { label: '🌄 Land', render(g, b) {
    const f = b.farm, fd = FD(), e = fd.enterprises[f.ent]; const st = g.markets[e.market];
    let o = `<div class="card"><h3>🌄 Your land</h3>
      ${UI.irow('ac' + b.id, '🗺️', 'Land', `${N(f.acres)} acres`, `Neighbouring land costs about ${m(TG.M.farmLandPrice(g, b))} an acre.`, qty('farmAc', 50) + UI.btn('💵 Buy', 'farmDo', 'land', 'xs goodb') + UI.btn('🏦 Loan', 'farmDo', 'landM', 'xs'))}
      ${UI.irow('ir' + b.id, '💧', 'Watered (irrigated)', `${N(f.irrigated)}/${N(f.acres)}`, `Cuts drought losses by ${U.pct(fd.irrigationDroughtCut)}. ${m(fd.irrigationPerAcre * g.world.priceIdx)} an acre (uses the acres box above).`, UI.btn('💧 Add', 'farmDo', 'irr', 'xs'))}
      ${UI.irow('so' + b.id, '🟫', 'Soil', Math.round(f.soil * 100), 'Good soil grows more. Same crop every year wears it out a little.')}
      ${st && st.hist ? `<div class="mute">📉 ${esc(e.market)} price, last 5 years</div>${UI.spark(st.hist.slice(-60), '#f59e0b')}` : ''}</div>`;
    if (!TG.M.isLivestock(f)) o += `<div class="card"><h3>🔒 Lock a price</h3>${UI.irow('fut' + b.id, '📜', 'Sold ahead', `${N(U.sum(f.futures, (x) => x.qty - (x.done || 0)))} t`, `Lock ${U.pct(fd.futuresDiscount)} of today's price now. You must still deliver even after a bad harvest. Max ${U.pct(fd.futuresMax)} of the expected crop.`, qty('futQty', 100) + UI.btn('🔒 Lock', 'farmDo', 'futures', 'xs'))}</div>`;
    o += `<div class="card"><h3>🔁 Farm something else</h3><div class="btns">${Object.entries(fd.enterprises).filter(([k]) => k !== f.ent).map(([k, x]) => UI.btn(`${{ crops: '🌾', cattle: '🐄', orchard: '🍎', dairy: '🥛' }[k] || ''} ${esc(x.label)}`, 'farmSw', k, 'sm')).join('')}</div><div class="mute">Orchards take ~${fd.enterprises.orchard.rampMonths} months to grow. Cattle and dairy need a herd.</div></div>`;
    return o;
  } };
  UI.A.farmDo = (k) => {
    const g = TG.G, b = biz();
    if (k === 'futures') { const r = TG.M.farmFutures(g, b, UI.num('futQty', 0)); return after(r, r.ok ? `Locked ${r.qty} t at ${m(r.price)}.` : null); }
    if (k === 'land' || k === 'landM') return after(TG.M.farmBuyLand(g, b, UI.num('farmAc', 0), k === 'landM'), 'Land bought.');
    if (k === 'irr') return after(TG.M.farmIrrigate(g, b, UI.num('farmAc', 0) || b.farm.acres), 'Watering installed.');
  };
  UI.A.farmSw = (k) => after(TG.M.farmSwitch(TG.G, biz(), k), 'Switched.');

  P.projects = { label: '📝 Bids', render(g, b) {
    const pr = b.proj, PC = TG.CONFIG.businesses.construction.projects; const M = TG.M.models.projects;
    let o = `<div class="card"><h3>🏷️ Your markup</h3><div class="btns">${Object.keys(PC.markups).map((k) => UI.btn(`${k} +${U.pct(PC.markups[k])}`, 'cxMarkup', k, 'sm' + (pr.markup === k ? ' pri' : ''))).join('')}</div>
      ${UI.irow('cxa' + b.id, '🤖', 'Managers bid for me', null, 'Higher markup = more profit per job but you win fewer. Too many jobs for your crew = late penalties.', UI.btn(pr.autoBid ? '✅ On' : 'Off', 'cxAuto', null, 'xs' + (pr.autoBid ? ' goodb' : '')))}</div>`;
    o += `<div class="card"><h3>📝 Jobs you can bid on</h3>${pr.offers.map((x) => { const w = M.winChance(g, b, x, pr.markup); return UI.irow('cxo' + x.id, '🏠', x.label, m(x.cost), `${x.months} months · ${x.crew} crew${x.heavy ? ' · excavator' : ''}${x.crane ? ' · crane' : ''}${x.bond ? ' · bond needed' : ''}. Expires ${U.dateStr(x.expires)}.`, UI.btn(`Bid (${U.pct(w)} win)`, 'cxBid', x.id, 'xs pri'), 'cost to build'); }).join('') || '<div class="mute">No jobs this month.</div>'}</div>`;
    return o;
  } };
  UI.A.cxMarkup = (v) => { biz().proj.markup = v; UI.refresh(); };
  UI.A.cxAuto = () => { const b = biz(); b.proj.autoBid = !b.proj.autoBid; UI.refresh(); };
  UI.A.cxBid = (id) => { const b = biz(); const r = TG.M.bid(TG.G, b, id, b.proj.markup, 'You'); if (!UI.res(r)) return UI.refresh(); UI.toast(r.won ? `Won! Contract ${m(r.price)}.` : `Lost the bid (${U.pct(r.win)} odds).`, !r.won); UI.refresh(); };

  P.franchise = { label: '📝 Join requests', render(g, b) {
    const s = b.fr, fr = TG.CONFIG.businesses.franchise.franchise;
    return `<div class="card"><h3>📝 Want to open a shop (${s.apps.length})</h3><div class="mute">You get ${m(fr.fee * g.world.priceIdx)} per shop, then ${U.pct(fr.royalty)} of its sales. Weak owners look fine at first.</div>${s.apps.map((a) => UI.irow('fa' + a.id, a.signal > 0.7 ? '😀' : a.signal > 0.45 ? '🙂' : '😟', a.name, m(a.capital), `Looks ${a.signal > 0.7 ? 'strong' : a.signal > 0.45 ? 'okay' : 'weak'}. Expires ${U.dateStr(a.expires)}.`, UI.btn('✅', 'frApp', a.id, 'xs goodb') + UI.btn('❌', 'frRej', a.id, 'xs'), 'their savings')).join('') || '<div class="mute">Nobody yet. Good reputation and ads bring people.</div>'}</div>`;
  } };
  UI.A.frApp = (id) => after(TG.M.franchiseApprove(TG.G, biz(), id, 'You'), 'Approved: opening in ~3 months.');
  UI.A.frRej = (id) => after(TG.M.franchiseReject(TG.G, biz(), id), 'Rejected.');
})();

</script>
<script>/* js/ui/ui-money.js */
/* ui-money.js - finance (loans, credit line, taxes, net worth), real estate, investments, casino & betting. */
(function () {
  const TG = globalThis.TG; const U = TG.U; const UI = TG.UI; const esc = UI.esc, m = UI.m;
  const after = (r, msg) => { UI.res(r, msg); UI.refresh(); };

  UI.screens.money = () => {
    const g = TG.G; const tabs = [['fin', '🏦 Finance'], ['re', '🏘️ Real estate'], ['inv', '📈 Investing']];
    if (g.settings.gambling) tabs.push(['casino', '🎰 Casino & bets']);
    const t = UI.curTab('money', 'fin');
    return `<h2>💰 Money</h2>${UI.tabs('money', tabs)}${({ fin, re, inv, casino }[t] || fin)(g)}`;
  };

  // ---------- finance ----------
  function fin(g) {
    const F = TG.F, C = TG.CONFIG.finance; const nwd = F.netWorth(g, true);
    let o = `<div class="card"><div class="kv"><span>Cash</span><span class="${g.cash < 0 ? 'bad' : ''}">${m(g.cash)}</span><span>Total assets</span><span>${m(nwd.assets)}</span><span>Total debt</span><span>${m(nwd.liab)}</span><span>Net worth</span><span>${m(nwd.nw)}</span>
      <span>Credit score</span><span>${Math.round(g.player.credit)} ${UI.pill(g.player.credit >= 740 ? 'excellent' : g.player.credit >= 670 ? 'good' : g.player.credit >= 600 ? 'fair' : 'poor', g.player.credit >= 670 ? 'good' : g.player.credit >= 600 ? 'warn' : 'bad')}</span>
      <span>Debt payments</span><span>${m(F.totalPayments(g))}/mo</span><span>Income tax rate</span><span>${U.pct(C.incomeTax)}${g.businesses.some((b) => b.spec && b.spec.accountant) || g.ceo ? ` (−${U.pct(C.accountantTaxCut)} with accountant)` : ''}</span>
      <span>Tax losses carried forward</span><span>${m(g.taxLoss)}</span><span>Tax paid last 12 months</span><span>${m(U.sum(g.taxPaid))}</span></div>
      ${g.player.noLoanUntil > g.month ? `<div class="ev bad">Lenders refuse new loans for ${g.player.noLoanUntil - g.month} more months (bankruptcy).</div>` : ''}
      ${g.cash < 0 ? `<div class="ev bad">Cash is negative: ${C.bankruptcyMonths - g.negMonths} month(s) until creditors force a fire sale. Interest and fees pile up.</div>` : ''}
      <div class="mute">Without an accountant, tax audits are ${C.auditMessyMult}x more likely.</div></div>`;
    // loans
    o += `<div class="card"><h3 style="margin-top:0">Borrow</h3><div class="row"><select id="lnType">${['business', 'emergency', 'equipment'].map((t) => `<option value="${t}">${esc(C.loans[t].label)} (~${U.pct(F.rateFor(g, t), 1)}, ${C.loans[t].term} mo)</option>`).join('')}</select><input type="number" id="lnAmt" placeholder="amount">${UI.btn('Borrow', 'loan', null, 'pri')}</div>
      <div class="mute">Business loan limit ~${m(F.maxLoan(g, 'business'))} (credit, net worth and profit). Emergency loans are easy to get but expensive. Equipment loans are capped at 70% of your equipment's value (${m(equipCap(g))}). Mortgages come with property purchases.</div></div>`;
    o += `<div class="card"><h3 style="margin-top:0">Loans (${g.loans.length})</h3>${g.loans.map((l) => `<div class="ev ${l.missed ? 'bad' : ''}"><div class="row sp"><b>${esc(l.label)}</b><span>${m(l.balance)} left</span></div><div class="small">${U.pct(l.rate, 2)} · ${m(l.payment)}/mo · ${l.left} months left${l.missed ? ` · ${l.missed} missed payment(s)!` : ''}</div>
      <div class="btns">${UI.btn(`Pay off ${m(l.balance)}`, 'loanDo', `${l.id}|off`, 'sm', g.cash < l.balance)}${UI.btn('Prepay 10k', 'loanDo', `${l.id}|10000`, 'sm', g.cash < 10000)}</div></div>`).join('') || '<div class="mute">No loans.</div>'}</div>`;
    const lim = F.locLimit(g);
    o += `<div class="card"><h3 style="margin-top:0">Credit line</h3><div class="kv"><span>Limit</span><span>${m(lim)}</span><span>Owed</span><span>${m(g.loc.balance)}</span><span>Rate</span><span>~${U.pct(F.rateFor(g, 'loc'), 1)}</span></div>
      <div class="row" style="margin-top:6px"><input type="number" id="locAmt" placeholder="amount">${UI.btn('Draw', 'loc', 'draw', 'sm')}${UI.btn('Repay', 'loc', 'repay', 'sm')}</div>
      <div class="kv" style="margin-top:6px"><span>Auto-draw to cover shortfalls</span><span>${UI.btn(g.settings.autoCredit ? 'On' : 'Off', 'setToggle', 'autoCredit', 'sm')}</span></div></div>`;
    if (g.lawsuits.length) o += `<div class="card"><h3 style="margin-top:0">Lawsuits</h3>${g.lawsuits.map((ls) => `<div class="ev bad"><b>${esc(ls.label)}</b> ${m(ls.amount)} · ${ls.status === 'fighting' ? `in court (${U.pct(ls.win || 0)} win odds)` : 'awaiting your decision'} · ${ls.left} mo left<div class="why">${esc(ls.why || '')}</div></div>`).join('')}</div>`;
    o += `<div class="card"><h3 style="margin-top:0">Last resort</h3><div class="btns">${UI.btn('Declare personal bankruptcy', 'bk', null, 'sm badb')}</div><div class="mute">Wipes everything: you keep ${m(C.bankruptcy.keepCash)}, credit drops, no loans for ${C.bankruptcy.noLoanMonths} months. The game continues.</div></div>`;
    return o;
  }
  const equipCap = (g) => Math.max(0, Math.round(U.sum(g.businesses, (b) => TG.E.value(g, b)) * 0.7 - U.sum(g.loans.filter((l) => l.type === 'equipment'), (l) => l.balance)));
  UI.A.loan = () => {
    const g = TG.G, t = UI.val('lnType'), a = UI.num('lnAmt', 0);
    if (t === 'equipment' && a > equipCap(g)) return UI.toast(`Equipment loans are capped at ${m(equipCap(g))}.`, true);
    after(TG.F.takeLoan(g, t, a), `Borrowed ${m(a)}.`);
  };
  UI.A.loanDo = (arg) => { const g = TG.G; const [id, how] = arg.split('|'); if (how === 'off') TG.F.payoff(g, id); else TG.F.prepay(g, id, Number(how)); UI.toast('Paid.'); UI.refresh(); };
  UI.A.loc = (how) => { const g = TG.G, a = UI.num('locAmt', 0); const v = how === 'draw' ? TG.F.locDraw(g, a, 'You') : TG.F.locRepay(g, a); UI.toast(v ? `${how === 'draw' ? 'Drew' : 'Repaid'} ${m(v)}.` : 'Nothing to do (check limit / cash).', !v); UI.refresh(); };
  UI.A.bk = () => UI.confirm('Declare full personal bankruptcy? You lose almost everything.', 'bkGo');
  UI.A.bkGo = () => { TG.F.bankrupt(TG.G, 'You declared bankruptcy'); UI.closeModal(); UI.go('home'); };

  // ---------- real estate ----------
  function re(g) {
    const RC = TG.CONFIG.realEstate, RE = TG.RE, r = g.re;
    let o = `<div class="card"><div class="kv"><span>Portfolio value</span><span>${m(RE.totalValue(g))}</span><span>Units</span><span>${RE.unitsOwned(g)}</span><span>Last month</span><span>rent ${m(r.m.rev)} · costs ${m(r.m.cost)}</span><span>Housing market</span><span>x${g.world.housing.toFixed(2)}</span>
      <span>Flips done</span><span>${r.flipsDone} (${r.flipsProfit} profitable)</span></div>
      ${r.hist.length > 2 ? UI.spark(r.hist.slice(-48).map((x) => x.rev - x.cost), '#1d4ed8') : ''}
      <div class="kv" style="margin-top:6px"><span>Property manager</span><span>${r.manager ? `${esc(r.manager.name)} (skill ${r.manager.skillSeen}) ${UI.btn('Fire', 'reMgrFire', null, 'sm')}` : UI.btn('Hire one', 'reMgr', null, 'sm')}</span>
      <span>Handyman on call</span><span>${UI.btn(r.handyman ? 'Yes' : 'No', 'reHandy', null, 'sm')}</span></div>
      <div class="mute">Self-managing more than ${RC.selfManageLimit} units gets sloppy. A manager screens tenants, handles evictions, and takes ${U.pct(RC.managerFeePct)} of rent plus wage.</div>
      ${RE.totalValue(g) >= RC.fund.minPortfolio && !r.fund ? `<div class="btns">${UI.btn(`Raise a fund (${U.pct(RC.fund.raisePct)} of value, investors get ${U.pct(RC.fund.investorShare)} of rent)`, 'reFund', null, 'sm')}</div>` : ''}</div>`;
    o += `<h3>Your properties (${r.holdings.length})</h3>`;
    for (const h of r.holdings) {
      const k = RC.kinds[h.kind]; const occ = h.tenants.filter((t) => t).length; const v = RE.value(g, h);
      const loan = h.mortgageId ? g.loans.find((l) => l.id === h.mortgageId) : null;
      o += `<div class="card"><div class="row sp"><b>${k.icon} ${esc(k.label)} · ${esc(h.name)}</b>${UI.pill(h.mode === 'sale' ? `for sale ${m(h.ask)}` : h.mode === 'reno' ? 'renovating' : h.mode === 'hold' ? 'empty' : 'renting', h.mode === 'rent' ? 'good' : 'warn')}</div>
        <div class="small">Worth ~${m(v)}${loan ? ` · mortgage ${m(loan.balance)}` : ''} · condition ${Math.round(h.cond)}/100 · ${h.units ? `${occ}/${h.units} units rented, market rent ${m(RE.marketRent(g, h))}/unit` : `${h.acres} acres`}</div>
        ${h.flip ? `<div class="ev info">Renovation: ${esc(RC.flip.levels[h.flip.level].label)} by ${esc(RC.flip.contractors[h.flip.contractor].label.toLowerCase())}, ${h.flip.left} month(s) left, budget ${m(h.flip.budget)}${h.flip.overrun ? `, overrun ${m(h.flip.overrun)}` : ''}</div>` : ''}
        ${h.dev ? `<div class="ev info">Development: ${h.dev.units} units, stage ${esc(h.dev.stage)}, ${h.dev.left} month(s) left, ${m(h.dev.paid)} of ~${m(h.dev.cost)} spent</div>` : ''}
        <div class="row small" style="margin-top:4px"><span>Upkeep</span><select data-change="reSet" data-k="upkeep" data-h="${h.id}">${['low', 'normal', 'high'].map((x) => `<option${h.upkeep === x ? ' selected' : ''}>${x}</option>`).join('')}</select>
        <span>Screen tenants (${m(RC.screeningCost)} each)</span><select data-change="reSet" data-k="screen" data-h="${h.id}"><option value="1"${h.screen ? ' selected' : ''}>yes</option><option value="0"${!h.screen ? ' selected' : ''}>no</option></select>
        <span>Insured</span><select data-change="reSet" data-k="insured" data-h="${h.id}"><option value="1"${h.insured ? ' selected' : ''}>yes</option><option value="0"${!h.insured ? ' selected' : ''}>no</option></select></div>
        <div class="btns">${!h.flip && !h.dev && h.kind !== 'land' ? UI.btn('Renovate…', 'reFlip', h.id, 'sm') : ''}${h.kind === 'land' && !h.dev ? UI.btn('Develop…', 'reDev', h.id, 'sm') : ''}
        ${h.mode === 'sale' ? UI.btn('Unlist', 'reDo', `${h.id}|unlist`, 'sm') : !h.flip && !h.dev ? UI.btn('List at value', 'reDo', `${h.id}|list`, 'sm') + UI.btn('List +10%', 'reDo', `${h.id}|list110`, 'sm') : ''}
        ${h.mode === 'hold' && h.units && !h.flip ? UI.btn('Start renting', 'reDo', `${h.id}|rent`, 'sm') : ''}
        ${UI.btn('Refinance', 'reDo', `${h.id}|refi`, 'sm')}${UI.btn(`Quick sale (${m(v * 0.9 * (1 - TG.CONFIG.property.sellCostPct))})`, 'reDo', `${h.id}|quick`, 'sm badb')}</div></div>`;
    }
    o += `<h3>For sale (${r.listings.length})</h3><div class="mute" style="margin:-4px 0 6px">Distressed homes are cheap flip candidates but may hide problems: an inspection (${m(RC.flip.inspectionCost)}) finds most of them.</div>`;
    for (const l of r.listings.slice().sort((a, b) => a.price - b.price)) {
      const k = RC.kinds[l.kind]; const ltv = k.commercial ? 0.75 : 0.8; const down = Math.round(l.price * (1 - ltv) + l.price * TG.CONFIG.property.buyCostPct);
      const rent = l.units ? Math.round(l.price * k.rentPct * l.units / Math.max(1, l.units)) : 0;
      o += `<div class="card"><div class="row sp"><b>${k.icon} ${esc(k.label)}</b><b>${m(l.price)}</b></div><div class="small">${esc(l.name)} · ${esc(TG.CONFIG.locations[l.loc].label)}, ${esc(TG.CONFIG.regions[l.region].label)} · grade ${l.grade} · condition ${Math.round(l.cond)}/100 · ${l.units ? `${l.units} unit(s)` : `${l.acres} acres`}${l.distressed ? ' · ' + UI.pill('distressed', 'warn') : ''}</div>
        ${l.units ? `<div class="mute">Rent roughly ${m(rent * l.units)}/mo if fully rented, before costs (tax, upkeep, insurance, vacancies).</div>` : '<div class="mute">No income: land is for developing.</div>'}
        ${l.inspected ? `<div class="ev ${l.found ? 'bad' : 'good'}">${l.found ? `Inspection found hidden problems (~${m(l.hidden * l.price)})` : 'Inspection found nothing major'}</div>` : ''}
        <div class="btns">${UI.btn('Buy cash', 'reBuy', `${l.id}|0`, 'sm pri', g.cash < l.price * 1.02)}${UI.btn(`Mortgage (${m(down)} down)`, 'reBuy', `${l.id}|1`, 'sm', g.cash < down)}${l.inspected ? '' : UI.btn(`Inspect ${m(RC.flip.inspectionCost)}`, 'reInspect', l.id, 'sm')}</div></div>`;
    }
    return o;
  }
  UI.A.reBuy = (arg) => { const [id, mo] = arg.split('|'); after(TG.RE.buy(TG.G, id, mo === '1'), 'Bought.'); };
  UI.A.reInspect = (id) => { const t = TG.RE.inspect(TG.G, id); if (t) UI.toast(t); UI.refresh(); };
  UI.A.reSet = (v, el) => { const h = TG.G.re.holdings.find((x) => x.id === el.dataset.h); if (!h) return; const k = el.dataset.k; h[k] = k === 'upkeep' ? v : v === '1'; UI.refresh(); };
  UI.A.reDo = (arg) => {
    const g = TG.G; const [id, act] = arg.split('|'); const h = g.re.holdings.find((x) => x.id === id); if (!h) return;
    if (act === 'list') TG.RE.list(g, id, 1); if (act === 'list110') TG.RE.list(g, id, 1.1); if (act === 'unlist') TG.RE.unlist(g, id); if (act === 'rent') h.mode = 'rent';
    if (act === 'refi') { const r = TG.RE.refinance(g, id); return after(r, r.ok ? `Cash out ${m(r.cashOut)}.` : null); }
    if (act === 'quick') { const v = TG.RE.sell(g, id, 0.9); UI.toast(`Sold for ${m(v)}.`); }
    UI.refresh();
  };
  UI.A.reFlip = (id) => {
    const RC = TG.CONFIG.realEstate.flip;
    UI.modal('Renovate', `<div class="card"><div class="kv"><span>Level</span><span><select id="flLvl">${Object.entries(RC.levels).map(([k, l]) => `<option value="${k}">${l.label}: ~${U.pct(l.cost)} of value, ${l.months} mo, +${U.pct(l.value)} value</option>`).join('')}</select></span>
      <span>Contractor</span><span><select id="flCon">${Object.entries(RC.contractors).map(([k, c]) => `<option value="${k}">${c.label}: cost x${c.costMult}, ${U.pct(c.overrun)} overrun risk, ${U.pct(c.delay)} delay risk${c.vanish > 0.01 ? ', may vanish' : ''}</option>`).join('')}</select></span>
      <span>Contingency fund (+${U.pct(RC.contingencyPct)})</span><span><select id="flCt"><option value="1">yes</option><option value="0">no</option></select></span></div>
      <div class="mute">You pay 30% upfront, the rest monthly. Tenants move out during work. Luxury remodels above the neighbourhood's level may not pay back.</div>
      <div class="btns">${UI.btn('Start renovation', 'reFlipGo', id, 'pri')}</div></div>`);
  };
  UI.A.reFlipGo = (id) => { const r = TG.RE.startFlip(TG.G, id, UI.val('flLvl'), UI.val('flCon'), UI.val('flCt') === '1'); UI.closeModal(); after(r, r.ok ? `Renovation started (budget ${m(r.budget)}).` : null); };
  UI.A.reDev = (id) => {
    const D = TG.CONFIG.realEstate.develop; const h = TG.G.re.holdings.find((x) => x.id === id);
    UI.modal('Develop land', `<div class="card"><div class="row"><span>Units</span><input type="number" id="devU" value="${Math.min(D.maxUnits, Math.round(h.acres * D.unitsPerAcre / 2))}"><span class="mute">max ${Math.min(D.maxUnits, h.acres * D.unitsPerAcre)}</span></div>
      <div class="mute">Permits take ${D.permitMonths[0]}-${D.permitMonths[1]} months and can stall. Building costs ${m(D.costPerUnit[0])}-${m(D.costPerUnit[1])} per unit over ${D.buildMonths[0]}-${D.buildMonths[1]} months, often with overruns. Finished units become rentals.</div>
      <div class="btns">${UI.btn('Start (pay permits now)', 'reDevGo', id, 'pri')}</div></div>`);
  };
  UI.A.reDevGo = (id) => { const r = TG.RE.develop(TG.G, id, UI.num('devU', 10)); UI.closeModal(); after(r, r.ok ? `Development of ${r.dev.units} units started.` : null); };
  UI.A.reMgr = () => {
    const pool = TG.RE.managerPool(TG.G);
    UI.modal('Hire a property manager', pool.map((c) => `<div class="card"><div class="row sp"><b>${esc(c.name)}</b><span>${m(c.wage)}/mo</span></div><div class="small">Skill ~${c.skillSeen} · ${c.years} yrs</div><div class="btns">${UI.btn('Hire', 'reMgrGo', c.id, 'sm pri')}</div></div>`).join(''));
  };
  UI.A.reMgrGo = (id) => { const c = TG.G.re.pool.list.find((x) => x.id === id); if (c) TG.RE.hireManager(TG.G, c); UI.closeModal(); UI.refresh(); };
  UI.A.reMgrFire = () => { TG.G.re.manager = null; UI.refresh(); };
  UI.A.reHandy = () => { TG.G.re.handyman = !TG.G.re.handyman; UI.refresh(); };
  UI.A.reFund = () => after(TG.RE.raiseFund(TG.G), 'Fund raised.');

  // ---------- investing ----------
  function inv(g) {
    const I = TG.I, A = TG.CONFIG.invest.assets, iv = g.invest;
    let o = `<div class="card"><div class="kv"><span>Portfolio</span><span>${m(I.posValue(g))}</span><span>Margin debt</span><span>${m(iv.marginDebt)}</span><span>Angel stakes (est.)</span><span>${m(I.angelValue(g))}</span></div>
      ${iv.marginDebt > 0 ? `<div class="row" style="margin-top:6px"><input type="number" id="mgAmt" placeholder="amount">${UI.btn('Repay margin', 'mgRepay', null, 'sm')}</div><div class="mute">If equity falls below ${U.pct(TG.CONFIG.invest.margin.callAt)} of the position, a margin call force-sells.</div>` : ''}</div>`;
    o += `<div class="card"><h3 style="margin-top:0">Markets</h3><div class="mute">Prices move randomly with the economy. Penny stocks and coins drift down on average and can go to zero. No patterns to exploit.</div>`;
    for (const [s, a] of Object.entries(A)) {
      if (a.kind !== 'stock' && !g.settings.gambling) continue;
      const p = iv.prices[s]; const h = iv.hist[s] || []; const pos = iv.pos[s]; const val = pos ? pos.qty * p : 0; const prev = h.length > 12 ? h[h.length - 13] : h[0];
      o += `<div class="ev ${a.kind !== 'stock' ? 'warn' : ''}"><div class="row sp"><b>${s} · ${esc(a.label)}</b><span>${p > 0 ? p.toFixed(p < 5 ? 3 : 2) : 'delisted'} ${prev ? `<span class="${UI.tone(p - prev)} small">${p >= prev ? '+' : ''}${U.pct((p - prev) / prev)} 1y</span>` : ''}</span></div>
        <div class="small">${a.kind === 'stock' ? `volatility ${U.pct(a.sd)}/mo` : UI.pill(`high risk: ${U.pct(a.zero || 0, 1)}/mo chance of going to zero`, 'bad')}${pos ? ` · you own ${m(val)} (cost ${m(pos.cost)}, ${UI.signed(val - pos.cost)})` : ''}</div>
        ${UI.spark(h.slice(-60), '#1d4ed8')}
        <div class="row"><input type="number" id="amt_${s}" placeholder="$ amount">${UI.btn('Buy', 'invBuy', `${s}|0`, 'sm')}${g.settings.gambling ? UI.btn('Buy w/ margin', 'invBuy', `${s}|1`, 'sm') : ''}${pos ? UI.btn('Sell half', 'invSell', `${s}|0.5`, 'sm') + UI.btn('Sell all', 'invSell', `${s}|1`, 'sm') : ''}</div></div>`;
    }
    o += '</div>';
    if (g.settings.gambling) {
      o += `<div class="card"><h3 style="margin-top:0">Angel investing</h3><div class="mute">Most startups fail (about two in three return nothing). A rare few return 15x+. Money is locked for years.</div>
        ${iv.angelOffers.map((a) => `<div class="ev"><div class="row sp"><b>${esc(a.name)}</b><span>min ${m(a.min)}</span></div><div class="small">${esc(a.sector)} · ${esc(a.buzz)}</div><div class="row"><input type="number" id="ang_${a.id}" value="${a.min}">${UI.btn('Invest', 'angel', a.id, 'sm')}</div></div>`).join('') || '<div class="mute">No pitches right now.</div>'}
        ${iv.angels.length ? `<h3>Your stakes</h3>${iv.angels.map((a) => `<div class="small">${esc(a.name)} (${esc(a.sector)}): ${m(a.amt)} in, ${a.left} mo to exit${a.mark != null ? `, marked at ${a.mark.toFixed(2)}x` : ''}</div>`).join('')}` : ''}</div>`;
    }
    return o;
  }
  UI.A.invBuy = (arg) => { const [s, mg] = arg.split('|'); after(TG.I.buy(TG.G, s, UI.num('amt_' + s, 0), mg === '1'), 'Bought.'); };
  UI.A.invSell = (arg) => { const [s, f] = arg.split('|'); const v = TG.I.sell(TG.G, s, Number(f)); UI.toast(`Sold for ${m(v)}.`); UI.refresh(); };
  UI.A.mgRepay = () => { TG.I.repayMargin(TG.G, UI.num('mgAmt', 0)); UI.refresh(); };
  UI.A.angel = (id) => after(TG.I.angelInvest(TG.G, id, UI.num('ang_' + id, 0)), 'Invested.');

  // ---------- casino ----------
  function casino(g) {
    const CC = TG.CONFIG.casino, c = g.invest.casino, I = TG.I;
    const amt = UI.S.betAmt || 100;
    let o = `<div class="card"><div class="kv"><span>Net this month</span><span>${UI.signed(c.net)}</span><span>Lifetime</span><span>${UI.signed(c.lifetimeNet)}</span><span>Bets left this month</span><span>${Math.max(0, CC.betsPerMonth - c.bets)}</span><span>Table limit</span><span>${m(I.betLimit(g))}</span></div>
      <div class="row" style="margin-top:6px"><span>Bet</span><input type="number" id="betAmt" value="${amt}" min="${CC.minBet}" max="${I.betLimit(g)}"></div>
      <div class="mute">Every game has a house edge: over time you lose. Limits keep it from becoming a strategy.${g.invest.habit > 40 ? ' <b class="warn">Your gambling habit is growing: you may start chasing losses on your own.</b>' : ''}${c.banned ? ' <b class="bad">You are banned from the casino.</b>' : ''}</div>
      ${UI.S.lastBet ? `<div class="ev ${UI.S.lastBet.win ? 'good' : 'bad'}">${esc(UI.S.lastBet.text)}</div>` : ''}</div>`;
    o += `<div class="card"><h3 style="margin-top:0">🎰 Casino</h3><div class="btns">${Object.entries(CC.games).map(([k, gm]) => UI.btn(`${esc(gm.label)}${gm.pays ? ` (pays ${gm.pays}:1)` : ` (${U.pct(gm.rtp)} return)`}`, 'bet', `c|${k}`, 'sm')).join('')}</div></div>`;
    const r = g.invest.race;
    o += `<div class="card"><h3 style="margin-top:0">🏇 Horse race</h3>${r.horses.map((h, i) => `<div class="row sp small"><span>${esc(h.name)}</span><span>${h.odds.toFixed(2)}x ${UI.btn('Bet', 'bet', `h|${i}`, 'sm')}</span></div>`).join('')}</div>`;
    const gm = g.invest.game;
    o += `<div class="card"><h3 style="margin-top:0">🏈 Sports</h3><div class="row sp small"><span>${esc(gm.a)}</span><span>${gm.oddsA.toFixed(2)}x ${UI.btn('Bet', 'bet', 's|a', 'sm')}</span></div><div class="row sp small"><span>${esc(gm.b)}</span><span>${gm.oddsB.toFixed(2)}x ${UI.btn('Bet', 'bet', 's|b', 'sm')}</span></div></div>`;
    return o;
  }
  UI.A.bet = (arg) => {
    const g = TG.G; const [k, x] = arg.split('|'); const a = UI.num('betAmt', 0); UI.S.betAmt = a;
    const r = k === 'c' ? TG.I.casinoBet(g, x, a) : k === 'h' ? TG.I.betHorse(g, Number(x), a) : TG.I.betSports(g, x, a);
    if (!r.ok) return UI.toast(r.msg, true);
    UI.S.lastBet = r; UI.refresh();
  };
  UI.A.setToggle = (k) => { TG.G.settings[k] = !TG.G.settings[k]; UI.refresh(); };
})();

</script>
<script>/* js/ui/ui-misc.js */
/* ui-misc.js - "More" screen: managers & CEO, news, event log, achievements & leaderboard, settings, help. */
(function () {
  const TG = globalThis.TG; const U = TG.U; const UI = TG.UI; const esc = UI.esc, m = UI.m;

  UI.screens.more = () => {
    const tabs = [['mgr', '👔 Managers'], ['news', '📰 News'], ['log', '📜 Log'], ['ach', '🏆 Goals'], ['set', '⚙️ Settings'], ['help', '❓ Help']];
    const t = UI.curTab('more', 'mgr');
    return `<h2>☰ More</h2>${UI.tabs('more', tabs)}${({ mgr, news, log, ach, set, help }[t] || mgr)(TG.G)}`;
  };

  // ---------- managers & CEO ----------
  function mgr(g) {
    const C = TG.CONFIG;
    let o = `<div class="card"><h3 style="margin-top:0">How managers work</h3><div class="mute">Problems (breakdowns, thefts, poaching, lawsuits, bad PR) create decision cards. If you don't answer by next month, the right manager decides: their skill and happiness set the chance of a good call. Reckless managers take risks, cautious ones play safe, and dishonest ones may skim. With nobody to cover, the default happens and problems pile up. There are no spending limits: watch who you trust.</div></div>`;
    o += `<div class="card"><h3 style="margin-top:0">CEO</h3>`;
    if (g.ceo) { const c = g.ceo; o += `<div class="kv"><span>Name</span><span>${esc(c.name)}</span><span>Skill</span><span>~${c.skillSeen}</span><span>Morale</span><span>${Math.round(c.morale)}</span><span>Pay</span><span>${m(c.wage)}/mo + ${U.pct(c.profitShare, 1)} of profit</span><span>Good-call chance</span><span>${U.pct(TG.D.pGood(g, c, true))}</span><span>Style</span><span>${esc(c.trait || 'steady')}</span></div>
        <div class="kv" style="margin-top:6px"><span>CEO makes big moves (expansions, equipment, hiring)</span><span>${UI.btn(g.settings.ceoBigMoves ? 'On' : 'Off', 'setToggle', 'ceoBigMoves', 'sm')}</span></div>
        <div class="btns">${UI.btn(`Fire (severance ${m(c.wage * 3)})`, 'ceoFire', null, 'sm badb')}</div><div class="mute">A CEO covers every business when no specialist does, but gets worse past ${C.ceo.spanFree} businesses (spread thin).</div>`; }
    else {
      o += `<div class="mute">A CEO handles decisions across all businesses. Expensive: worth it once you run several.</div>`;
      for (const c of TG.D.ceoPool(g)) o += `<div class="ev"><div class="row sp"><b>${esc(c.name)}</b><span>${m(c.wage)}/mo + ${U.pct(c.profitShare, 1)} profit</span></div><div class="small">Skill ~${c.skillSeen} · ${c.years} yrs · style ${esc(c.trait || '?')}</div><div class="btns">${UI.btn('Hire', 'ceoHire', c.id, 'sm pri')}</div></div>`;
    }
    o += `</div><div class="card"><h3 style="margin-top:0">Managers by business</h3>`;
    for (const b of g.businesses) {
      const sp = Object.entries(b.spec || {}).filter(([, e]) => e);
      o += `<div class="ev"><div class="row sp"><b>${esc(b.name)}</b>${UI.btn('Open', 'go', `bizd:${b.id}`, 'sm')}</div><div class="small">${sp.length ? sp.map(([r, e]) => `${esc(C.specialists[r].label)}: ${esc(e.name)} (skill ~${e.skillSeen}, morale ${Math.round(e.morale)}, ${U.pct(TG.D.pGood(g, e))} good calls)`).join('<br>') : '<span class="warn">No managers: problems wait for you.</span>'}</div></div>`;
    }
    if (g.re.holdings.length) o += `<div class="ev"><b>Real estate</b><div class="small">${g.re.manager ? `Property manager ${esc(g.re.manager.name)}` : 'No property manager'}</div></div>`;
    return o + '</div>';
  }
  UI.A.ceoHire = (id) => { const c = (TG.G.ceoPool && TG.G.ceoPool.list || []).find((x) => x.id === id); if (c) { TG.D.hireCeo(TG.G, c); UI.toast(`${c.name} is your CEO.`); } UI.refresh(); };
  UI.A.ceoFire = () => { TG.D.fireCeo(TG.G); UI.refresh(); };

  // ---------- news / log ----------
  function news(g) {
    const n = (g.newsFeed || []).slice().reverse().slice(0, 80);
    return `<div class="card"><div class="mute">World events move prices, demand and wages. Economy: <b>${esc(TG.W.phaseLabel(g))}</b> · interest ${U.pct(g.world.baseRate, 1)} · prices x${g.world.priceIdx.toFixed(2)} · wages x${g.world.wageIdx.toFixed(2)} · housing x${g.world.housing.toFixed(2)}</div></div>` +
      (n.length ? n.map((e) => `<div class="ev ${e.tone}"><span class="mute">${U.dateStr(e.m)}</span> ${e.big ? '<b>' : ''}${esc(e.text)}${e.big ? '</b>' : ''}</div>`).join('') : '<div class="card mute">No news yet.</div>');
  }
  function log(g) {
    const f = UI.S.logF || 'all';
    let L = g.log.slice().reverse(); if (f !== 'all') L = L.filter((e) => (f === 'bad' ? e.type === 'bad' || e.type === 'major' : e.type === f));
    return `<div class="row"><span class="small">Show</span><select data-change="logF">${[['all', 'Everything'], ['bad', 'Problems'], ['good', 'Good news'], ['decision', 'Decisions'], ['staff', 'Staff']].map(([v, l]) => `<option value="${v}"${f === v ? ' selected' : ''}>${l}</option>`).join('')}</select></div><div class="card" style="margin-top:8px">` +
      (L.slice(0, 200).map((e) => `<div class="small" style="border-bottom:1px solid #eee;padding:3px 0"><span class="mute">${U.dateStr(e.m)}</span> ${e.type === 'major' ? '🔴' : e.type === 'bad' ? '🟠' : e.type === 'good' ? '🟢' : e.type === 'decision' ? '🧭' : e.type === 'staff' ? '👥' : e.type === 'news' ? '📰' : '•'} ${e.biz ? `<b>${esc(e.biz)}</b>: ` : ''}${e.by ? `${esc(e.by)}: ` : ''}${esc(e.text)}${e.why ? `<div class="mute">Why: ${esc(e.why)}</div>` : ''}</div>`).join('') || '<div class="mute">Nothing yet.</div>') + '</div>';
  }
  UI.A.logF = (v) => { UI.S.logF = v; UI.refresh(); };

  // ---------- achievements & leaderboard ----------
  function ach(g) {
    const A = TG.CONFIG.achievements;
    let o = `<div class="card"><h3 style="margin-top:0">Achievements (${Object.keys(g.achievements).length}/${Object.keys(A).length})</h3>${Object.entries(A).map(([k, l]) => `<div class="small">${g.achievements[k] != null ? `🏆 <b>${esc(l)}</b> <span class="mute">${U.dateStr(g.achievements[k])}</span>` : `<span class="mute">🔒 ${esc(l)}</span>`}</div>`).join('')}</div>`;
    o += `<div class="card"><h3 style="margin-top:0">Milestones</h3>${TG.CONFIG.leaderboardTargets.map((t) => `<div class="small">${g.stats.reached && g.stats.reached[t] != null ? '✅' : '⬜'} Net worth ${m(t)}${g.stats.reached && g.stats.reached[t] != null ? ` in ${U.yrsMo(g.stats.reached[t])}` : ''}</div>`).join('')}<div class="mute">Peak net worth: ${m(g.stats.peakNW)}</div></div>`;
    const lb = TG.LB.all();
    o += `<div class="card"><h3 style="margin-top:0">Leaderboard (this device)</h3><table><tr><th>Player</th><th class="n">Peak</th><th class="n">Time</th></tr>${lb.map((e) => `<tr${e.id === g.gameId ? ' style="font-weight:700"' : ''}><td>${esc(e.name)} <span class="mute">${esc(e.scenario || '')}${e.bankruptcies ? `, ${e.bankruptcies} bankrupt` : ''}</span></td><td class="n">${m(e.peak)}</td><td class="n">${U.yrsMo(e.months)}</td></tr>`).join('') || '<tr><td class="mute">Play a few months to appear here.</td></tr>'}</table></div>`;
    return o;
  }

  // ---------- settings ----------
  function set(g) {
    const s = g.settings, MT = { breakdown: 'Equipment breakdowns', keyQuit: 'Key staff quitting', cash: 'Cash crunch / bankruptcy', lawsuit: 'Lawsuits', strike: 'Strikes & walkouts', harvest: 'Harvests', weather: 'Weather disasters' };
    const tg = (k, label, note) => `<span>${label}${note ? `<div class="mute">${note}</div>` : ''}</span><span>${UI.btn(s[k] ? 'On' : 'Off', 'setToggle', k, 'sm' + (s[k] ? ' goodb' : ''))}</span>`;
    let o = `<div class="card"><h3 style="margin-top:0">Gameplay</h3><div class="kv">
      ${tg('stopOnMajor', 'Stop a skip early on major events', 'Off by default. Choose the event types below.')}
      ${tg('confirmPending', 'Warn before Next Month if decisions are waiting')}
      ${tg('gambling', 'Gambling & high-risk investing', 'Casino, betting, penny stocks, coins, margin, angel deals')}
      ${tg('habit', 'Gambling habit can build up', 'Big bets can lead to chasing losses on their own')}
      ${tg('autoCredit', 'Auto-draw credit line when cash runs short')}
      ${tg('ceoBigMoves', 'CEO may make big moves for me')}
      <span>Event frequency</span><span><select data-change="setFreq"><option value="normal"${s.eventFreq === 'normal' ? ' selected' : ''}>Normal</option><option value="calm"${s.eventFreq === 'calm' ? ' selected' : ''}>Calm</option></select></span></div></div>`;
    o += `<div class="card"><h3 style="margin-top:0">Stop the skip on…</h3><div class="kv">${Object.entries(MT).map(([k, l]) => `<span>${l}</span><span>${UI.btn(s.majorTypes[k] ? 'Yes' : 'No', 'setMajor', k, 'sm' + (s.majorTypes[k] ? ' goodb' : ''))}</span>`).join('')}</div></div>`;
    o += `<div class="card"><h3 style="margin-top:0">Save</h3><div class="mute">The game autosaves after every month and action${TG.store.ok ? ' in this browser' : '. <b class="bad">Browser storage is blocked here, so autosave only lasts this session: use Export to keep your progress.</b>'}.</div>
      <div class="btns">${UI.btn('Export save code', 'exportSave', null, 'sm')}${UI.btn('Import save code', 'importSave', null, 'sm')}${UI.btn('New game', 'newGameOpen', null, 'sm pri')}${UI.btn('Delete save', 'clearSave', null, 'sm badb')}</div>
      <div class="mute">Seed ${g.seed} · month ${g.month} · version ${TG.VERSION}</div></div>`;
    return o;
  }
  UI.A.setMajor = (k) => { const s = TG.G.settings; s.majorTypes[k] = !s.majorTypes[k]; UI.refresh(); };
  UI.A.setFreq = (v) => { TG.G.settings.eventFreq = v; UI.refresh(); };
  UI.A.exportSave = () => { const c = TG.Game.exportCode(TG.G); UI.modal('Export save', `<div class="card"><div class="mute">Copy this code somewhere safe. Paste it into Import to continue later (any browser).</div><textarea id="expCode" style="width:100%;height:160px" readonly>${esc(c)}</textarea><div class="btns">${UI.btn('Copy', 'copyCode', null, 'sm pri')}</div></div>`); };
  UI.A.copyCode = () => { const t = document.getElementById('expCode'); t.select(); try { document.execCommand('copy'); UI.toast('Copied.'); } catch (e) { UI.toast('Select and copy it manually.'); } };
  UI.A.importSave = () => UI.modal('Import save', `<div class="card"><textarea id="impCode" style="width:100%;height:160px" placeholder="TYC1:..."></textarea><div class="btns">${UI.btn('Load this save', 'importGo', null, 'pri')}</div></div>`);
  UI.A.importGo = () => { try { TG.Game.importCode(UI.val('impCode')); UI.closeModal(); UI.save(); UI.toast('Save loaded.'); UI.go('home'); } catch (e) { UI.toast(e.message || 'Invalid code.', true); } };
  UI.A.newGameOpen = () => UI.newGameScreen(false);
  UI.A.clearSave = () => UI.confirm('Delete the saved game and start over?', 'clearGo');
  UI.A.clearGo = () => { TG.Game.clearSave(); if (TG.IDB) TG.IDB.put('tycoon_save_v1', null); TG.G = null; UI.closeModal(); UI.newGameScreen(true); };

  // ---------- help ----------
  function help() {
    const C = TG.CONFIG;
    return `<div class="card"><h3 style="margin-top:0">How to play</h3><ol class="plain"><li><b>Pick a business and a property</b> in Market. Listings are scored for the business you choose; read the pros and cons.</li>
      <li><b>Set it up</b>: equipment gives capacity, staff run it, the location brings customers. Quick setup does the basics.</li>
      <li><b>Press Next Month</b> (or type a number of months and Skip). The report shows income, expenses, events and <i>why</i> they happened, with the numbers.</li>
      <li><b>Manage risk</b>: every risk shows its monthly odds. Maintenance, upgrades, insurance and good managers lower them; rushing, cheap gear and neglect raise them.</li>
      <li><b>Grow</b>: hire managers so things run without you, open more businesses, buy real estate, invest. There is no ending: play as long as you like.</li></ol></div>
      <div class="card"><h3 style="margin-top:0">Business types</h3>${['small', 'between', 'corp'].map((t) => `<p><b>${esc(C.tiers[t].label)}</b>: ${esc(C.tiers[t].desc)}<br>${Object.values(C.businesses).filter((d) => d.tier === t).map((d) => `${d.icon} ${esc(d.name)}`).join(' · ')}</p>`).join('')}</div>
      <div class="card"><h3 style="margin-top:0">Colors</h3><div>${UI.pill('green', 'good')} good / low risk ${UI.pill('yellow', 'warn')} warning ${UI.pill('red', 'bad')} risk / loss</div></div>
      <div class="card"><h3 style="margin-top:0">Tips</h3><ul class="plain small"><li>Small businesses earn good margins but hit a ceiling: one location, your time.</li><li>Farms, trucking and clothing brands start cheap and have no ceiling, but growth costs lots of time and money, and prices fall if everyone floods the market (including you).</li><li>Corporations need big capital and good managers. Big wins, big blowups.</li><li>Gambling always has a house edge. It can't be a strategy.</li><li>Negative cash for ${C.finance.bankruptcyMonths} months triggers a forced fire sale or bankruptcy. Bankruptcy isn't game over.</li></ul></div>`;
  }
})();

</script>
