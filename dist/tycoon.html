<script>/* js/realestate.js */
/* realestate.js - the real estate path: rentals, tenants, vacancies, repairs, flipping, development,
   refinancing, property managers, neighborhoods, market cycles, and a late-game fund. */
(function () {
  const TG = globalThis.TG; const R = TG.R, U = TG.U;
  const RE = {};
  const RC = () => TG.CONFIG.realEstate;
  const STREETS = ['Maple', 'Birch', 'Sunset', 'Park', 'Grove', 'Union', 'Liberty', 'Spring', 'Garden', 'Highland', 'Bay', 'Summit'];
  const condF = (c) => 0.7 + 0.5 * c / 100;

  RE.init = (g) => { g.re = { holdings: [], listings: [], manager: null, handyman: false, fund: null, flipsDone: 0, flipsProfit: 0, m: { rev: 0, cost: 0 }, hist: [] }; RE.refill(g, RC().listingCount); };

  RE.gen = (g, kindId, opts) => {
    const C = TG.CONFIG, k = RC().kinds[kindId]; opts = opts || {};
    const region = R.pick(Object.keys(C.regions));
    const loc = kindId === 'land' ? R.pick(['suburb', 'town', 'rural']) : R.weighted({ city: 2, suburb: 3, town: 2, rural: 0.7 });
    const grade = R.weighted({ A: 1, B: 2, C: 1.5 });
    const distressed = opts.distressed != null ? opts.distressed : (kindId === 'house' || kindId === 'condo' || kindId === 'duplex') && R.chance(0.3);
    const units = Array.isArray(k.units) ? R.int(k.units[0], k.units[1]) : k.units;
    let price = R.range(k.price[0], k.price[1]) * C.regions[region].price * (grade === 'A' ? 1.25 : grade === 'C' ? 0.78 : 1) * g.world.housing;
    const cond = distressed ? R.range(15, 40) : R.range(45, 95);
    const nb = R.range(0.9, 1.1);
    const trend = R.range(-1, 1);
    price *= condF(cond) / condF(70);
    if (distressed) price *= R.range(RC().flip.distressDiscount[0], RC().flip.distressDiscount[1]);
    price = Math.round(price / 1000) * 1000;
    const acres = kindId === 'land' ? Math.round(R.range(2, 40)) : 0;
    return { id: U.uid('r'), kind: kindId, name: `${R.int(1, 999)} ${R.pick(STREETS)} ${R.pick(['St', 'Ave', 'Ct', 'Blvd'])}`, region, loc, grade, units, price, cond, nb, trend, distressed, acres,
      age: R.int(2, 80), hidden: R.chance(RC().flip.hiddenProblem * (distressed ? 1.5 : 0.6)) ? R.range(RC().flip.hiddenCost[0], RC().flip.hiddenCost[1]) : 0, listed: g.month };
  };
  RE.refill = (g, n) => {
    for (let i = 0; i < n; i++) {
      const w = { condo: 3, house: 4, duplex: 2.5, smallapt: 1.6, apartment: 0.8, strip: 0.6, officebldg: 0.4, warehouse: 0.5, land: 0.8, tower: 0.15 };
      g.re.listings.push(RE.gen(g, R.weighted(w)));
    }
  };
  RE.marketRent = (g, h) => {
    const k = RC().kinds[h.kind]; if (!k.rentPct) return 0;
    const perUnit = (h.basePrice || h.price) * k.rentPct / Math.max(1, h.units);
    return Math.round(perUnit * Math.pow(g.world.housing / (h.housingAtBuy || g.world.housing), 0.6) * h.nb * condF(h.cond) / condF(70) * (h.rentBump || 1));
  };
  // v6: the rent YOU set (share of market rent), applicants and tenant search
  const TC = () => TG.CONFIG.tenants;
  RE.askRent = (g, h) => Math.round(RE.marketRent(g, h) * (h.rentR || 1));
  RE.estRent = (g, l) => Math.round(RE.marketRent(g, l) * Math.max(1, l.units || 0) * 0.92);
  RE.vacant = (h) => (h.tenants || []).filter((t) => !t).length;
  // v7: ONE tenant per home / unit. Every empty unit is filled by its own search (one applicant at a time).
  const mgrSkill = (g) => (g.re.manager ? (g.re.manager.skill || 50) : null);
  RE.mgrCostMult = (g) => { const s = mgrSkill(g); return s == null ? 1 : U.clamp(1.2 - s / 250, 0.8, 1.2); }; // a skilled manager gets better vendor prices
  RE.searchCost = (g, h, byMgr) => { const S = TC().search; return Math.round((S.base + S.perRent * RE.askRent(g, h)) * g.world.priceIdx * (byMgr ? RE.mgrCostMult(g) : 1)); };
  RE.poolPreview = (g, h, byMgr) => { // what ONE unit's search is likely to bring, shown before you pay
    const T = TC(), r = h.rentR || 1, k = RC().kinds[h.kind];
    const n = Math.min(T.pool.max, T.pool.atMarket * Math.exp(-(r - 1) * T.pool.slope) * (k.lease ? T.pool.commercial : 1));
    const sk = byMgr ? mgrSkill(g) : null;
    const q = U.clamp(T.quality.atMarket + T.quality.slope * (1 - r) + (h.cond - 60) * T.quality.cond + (sk != null ? (sk - 50) / 500 : 0), 0.1, 0.88);
    return { n, q, label: q >= 0.65 ? 'great' : q >= 0.5 ? 'good' : q >= 0.35 ? 'mixed' : 'risky' };
  };
  RE.ensureUnits = (h) => {
    h.searches = h.searches || {}; h.issues = h.issues || [];
    if (h.search) { const u = (h.tenants || []).findIndex((t) => !t); if (u >= 0 && h.search.list) h.searches[u] = h.search; delete h.search; } // v6 saves: one search per building
    return h;
  };
  RE.unitIssues = (h, u) => (h.issues || []).filter((x) => x.unit === u);
  // which unit a call is about: the one asked for, or the first empty unit (with an open search when one is wanted)
  RE.pickUnit = (g, h, unit, wantSearch) => {
    RE.ensureUnits(h);
    if (unit != null && unit !== '') return Number(unit);
    if (wantSearch) { for (let i = 0; i < h.tenants.length; i++) if (!h.tenants[i] && RE.current(g, h, i)) return i; }
    for (let i = 0; i < h.tenants.length; i++) if (!h.tenants[i] && !RE.current(g, h, i) && !RE.unitIssues(h, i).length) return i;
    for (let i = 0; i < h.tenants.length; i++) if (!h.tenants[i]) return i;
    return -1;
  };
  RE.search = (g, hid, by, unit) => {
    const h = g.re.holdings.find((x) => x.id === hid); if (!h || !RC().kinds[h.kind].rentPct || h.flip || h.dev || h.mode === 'sale') return { ok: false, msg: 'Not a rental right now.' };
    RE.ensureUnits(h); const u = RE.pickUnit(g, h, unit, false);
    if (u < 0 || h.tenants[u]) return { ok: false, msg: 'No empty units.' };
    if (RE.unitIssues(h, u).length) return { ok: false, msg: 'Fix the repair in this unit first: nobody signs a lease for a broken home.' };
    const byMgr = !!(by && g.re.manager);
    const cost = RE.searchCost(g, h, byMgr); if (g.cash < cost) return { ok: false, msg: `A tenant search costs ${U.money(cost)}.` };
    TG.F.spend(g, cost, 'Tenant search'); g.re.m.cost = (g.re.m.cost || 0) + cost;
    const pv = RE.poolPreview(g, h, byMgr); const n = Math.max(0, Math.round(pv.n * R.range(0.55, 1.35)));
    const list = []; for (let i = 0; i < n; i++) list.push(RE.applicant(g, h, R.normal(pv.q, TC().quality.sd)));
    h.searches[u] = { m: g.month, rent: RE.askRent(g, h), list, i: 0 };
    if (by) TG.rep.decision(g, null, by, `Paid ${U.money(cost)} for a tenant search for unit ${u + 1} at ${h.name}: ${n} applicant(s)`);
    return { ok: true, n, cost, unit: u };
  };
  RE.current = (g, h, unit) => {
    if (!h) return null; RE.ensureUnits(h);
    if (unit == null) { for (const k in h.searches) { const a = RE.current(g, h, Number(k)); if (a && !h.tenants[k]) return a; } return null; }
    const s = h.searches[unit]; if (!s || g.month - s.m > TC().search.expires) return null; return s.list[s.i] || null;
  };
  RE.decide = (g, hid, accept, unit) => {
    const h = g.re.holdings.find((x) => x.id === hid); if (!h) return { ok: false };
    const u = RE.pickUnit(g, h, unit, true); if (u < 0) return { ok: false, msg: 'No empty units.' };
    const s = h.searches[u]; const a = RE.current(g, h, u); if (!s || !a) return { ok: false, msg: 'No applicants left.' };
    s.i++; // no going back either way
    if (!accept) return { ok: true, left: s.list.length - s.i, unit: u };
    if (h.tenants[u]) return { ok: false, msg: 'That unit is already rented.' };
    h.tenants[u] = RE.makeTenant(g, h, a, s.rent); delete h.searches[u];
    return { ok: true, tenant: h.tenants[u], left: 0, unit: u };
  };
  RE.leaseLeft = (g, t) => { const held = g.month - t.since; if (held < t.lease) return t.lease - held; const x = 12 - ((held - t.lease) % 12); return x; };
  RE.quality = (t) => (t.rel >= 0.65 ? { label: 'reliable', tone: 'good', stars: 3 } : t.rel >= 0.45 ? { label: 'okay', tone: 'warn', stars: 2 } : { label: 'risky', tone: 'bad', stars: 1 });
  // repairs: with a property manager they are paid at once; without one they wait for YOU (tap Fix)
  RE.addIssue = (g, h, unit, what, cost, big) => {
    RE.ensureUnits(h); const mgr = g.re.manager;
    if (mgr) {
      const c = Math.round(cost * RE.mgrCostMult(g) * (g.re.handyman ? 0.8 : 1));
      TG.F.spend(g, c, 'Real estate repairs'); g.re.m.cost += c; if (big) h.cond = U.clamp(h.cond + 6, 0, 100);
      TG.rep.decision(g, null, 'Property manager ' + mgr.name, `Fixed ${what} at ${h.name}${unit != null ? ' (unit ' + (unit + 1) + ')' : ''} for ${U.money(c)}`);
      return null;
    }
    const it = { id: U.uid('i'), unit: unit == null ? null : unit, what, cost: Math.round(cost), m: g.month, big: !!big };
    h.issues.push(it);
    TG.rep.event(g, null, big ? 'major' : 'bad', `${h.name}${unit != null && h.units > 1 ? ' unit ' + (unit + 1) : ''} needs a repair: ${what} (~${U.money(cost)})`, 'No property manager: it waits until you tap Fix. Unfixed repairs annoy tenants, wear the building and can bring city fines.');
    return it;
  };
  RE.fixCost = (g, it) => Math.round(it.cost * (g.re.handyman ? 0.8 : 1));
  RE.fixIssue = (g, hid, iid) => {
    const h = g.re.holdings.find((x) => x.id === hid); if (!h) return { ok: false }; RE.ensureUnits(h);
    const it = h.issues.find((x) => x.id === iid); if (!it) return { ok: false, msg: 'Already fixed.' };
    const c = RE.fixCost(g, it); if (g.cash < c) return { ok: false, msg: `The repair costs ${U.money(c)}.` };
    TG.F.spend(g, c, 'Real estate repairs'); g.re.m.cost += c; h.issues = h.issues.filter((x) => x !== it);
    if (it.big) h.cond = U.clamp(h.cond + 6, 0, 100);
    return { ok: true, cost: c };
  };
  const FIRST = ['Alex', 'Sam', 'Jordan', 'Taylor', 'Casey', 'Riley', 'Morgan', 'Jamie', 'Drew', 'Avery', 'Quinn', 'Rosa', 'Omar', 'Mei', 'Luis', 'Priya', 'Ben', 'Nia'];
  const LAST = ['Lee', 'Patel', 'Garcia', 'Smith', 'Nguyen', 'Brown', 'Khan', 'Lopez', 'Clark', 'Young', 'Diaz', 'Hill'];
  const BIZN = ['Corner Deli', 'Bright Dental', 'QuickPrint', 'Zen Yoga', 'Metro Phones', 'Sunny Nails', 'Pro Tax', 'Bean Cafe', 'City Logistics', 'Apex Labs'];
  RE.applicant = (g, h, q) => {
    const k = RC().kinds[h.kind]; const T = TC();
    q = U.clamp(q, 0.02, 0.98);
    const ev = R.chance(Math.pow(1 - q, 2) * 1.1) ? 1 + (R.chance((1 - q) * 0.5) ? 1 : 0) : 0;
    const inc = U.clamp(1.6 + 3.2 * q + R.normal(0, 0.5), 0.8, 8);
    const cs = Math.round(U.clamp(470 + 360 * q + R.normal(0, 45), 350, 840));
    return { name: k.commercial ? R.pick(BIZN) : `${R.pick(FIRST)} ${R.pick(LAST)}`, evictions: ev, income: Math.round(inc * 10) / 10, credit: cs, rel: U.clamp(q + R.normal(0, 0.12), 0.02, 0.98) };
  };
  RE.applicantMarks = (a) => [ // good / okay / bad markers the player reads
    { label: 'Past evictions', val: String(a.evictions), mark: a.evictions === 0 ? 'good' : 'bad' },
    { label: 'Income vs rent', val: a.income.toFixed(1) + 'x', mark: a.income >= 3 ? 'good' : a.income >= 2.3 ? 'ok' : 'bad' },
    { label: 'Credit score', val: String(a.credit), mark: a.credit >= 680 ? 'good' : a.credit >= 600 ? 'ok' : 'bad' },
  ];
  RE.makeTenant = (g, h, a, rent) => {
    const k = RC().kinds[h.kind];
    return { name: a.name, rel: a.rel, ev: a.evictions, inc: a.income, cs: a.credit, rent: rent || RE.askRent(g, h), late: 0, evict: 0, since: g.month, lease: k.lease || (a.rel > 0.65 && R.chance(0.5) ? 24 : 12) };
  };
  // property manager: runs searches and screens applicants for you (better skill = better reading of the signals)
  RE.mgrFill = (g, h) => {
    const mgr = g.re.manager; if (!mgr || !RE.vacant(h) || h.mode !== 'rent') return;
    RE.ensureUnits(h);
    const bar = 0.42 + mgr.skill / 600; const err = 0.22 - mgr.skill / 600;
    for (let u = 0; u < h.tenants.length; u++) {
      if (h.tenants[u]) continue;
      if (!RE.current(g, h, u)) { const k = 'u' + u; h.mgrSearchM = h.mgrSearchM && typeof h.mgrSearchM === 'object' ? h.mgrSearchM : {}; if (h.mgrSearchM[k] === g.month) continue; h.mgrSearchM[k] = g.month; const r = RE.search(g, h.id, 'Property manager ' + mgr.name, u); if (!r.ok) continue; }
      let a; while (!h.tenants[u] && (a = RE.current(g, h, u))) {
        const seen = 0.5 * (a.credit - 470) / 360 + 0.3 * U.clamp((a.income - 1.6) / 3.2, 0, 1) + 0.2 * (a.evictions ? 0 : 1) + R.normal(0, err);
        RE.decide(g, h.id, seen >= bar, u);
      }
    }
  };
  RE.value = (g, h) => Math.round((h.base || h.price) * g.world.housing * h.nb * condF(h.cond) * (h.over ? 0.92 : 1));
  RE.totalValue = (g) => (g.re ? U.sum(g.re.holdings, (h) => RE.value(g, h)) : 0);
  RE.unitsOwned = (g) => U.sum(g.re.holdings, (h) => h.units || 0);

  RE.buy = (g, listingId, mortgage, term) => {
    const C = TG.CONFIG; const l = g.re.listings.find((x) => x.id === listingId); if (!l) return { ok: false, msg: 'Listing gone.' };
    const fees = Math.round(l.price * C.property.buyCostPct);
    if (mortgage) {
      const ltv = RC().kinds[l.kind].commercial ? 0.75 : 0.8; const down = Math.round(l.price * (1 - ltv));
      if (g.cash < down + fees) return { ok: false, msg: `Need ${U.money(down + fees)} down.` };
      const ok = TG.CREDIT.apply(g, 'mortgage', l.price - down, { collateral: { kind: 'property', id: l.id }, label: 'Mortgage: ' + l.name, noCash: true, ltv, asset: l.price, extraIncome: RE.estRent(g, l), term });  if (!ok.ok) return ok;
      TG.F.spend(g, down + fees, 'Real estate purchases', null, true); const loan = ok.loan;
      l.mortgageId = loan.id;
    } else { if (g.cash < l.price + fees) return { ok: false, msg: `Need ${U.money(l.price + fees)}.` }; TG.F.spend(g, l.price + fees, 'Real estate purchases', null, true); }
    g.re.listings = g.re.listings.filter((x) => x !== l);
    l.base = l.price / (g.world.housing * l.nb * condF(l.cond)); l.basePrice = l.price; l.housingAtBuy = g.world.housing; l.bought = g.month; l.paid = l.price + fees;
    l.tenants = []; for (let i = 0; i < l.units; i++) l.tenants.push(R.chance(l.distressed ? 0.2 : 0.6) ? RE.newTenant(g, l, true) : null);
    l.rentR = 1; l.searches = {}; l.issues = [];
    l.screen = false; l.upkeep = 'normal'; l.insured = true; l.taxMult = 1; l.mode = l.distressed ? 'hold' : 'rent'; l.spent = 0; l.inspected = false;
    g.re.holdings.push(l);
    return { ok: true, h: l };
  };
  // tenants that come with a building you buy: you did not pick them (unknown, mixed quality)
  RE.newTenant = (g, h) => { const a = RE.applicant(g, h, R.normal(0.5, 0.22)); const t = RE.makeTenant(g, h, a, RE.marketRent(g, h)); t.since = g.month - R.int(0, 11); t.inherited = true; return t; };
  RE.inspect = (g, listingId) => {
    const l = g.re.listings.find((x) => x.id === listingId); if (!l || l.inspected) return null;
    TG.F.spend(g, RC().flip.inspectionCost * g.world.priceIdx, 'Inspections', null, true);
    l.inspected = true; l.found = l.hidden > 0 && R.chance(RC().flip.inspectReveal);
    return l.found ? `Inspection found a problem: about ${U.money(l.hidden * l.price)} of hidden repairs (mold, foundation or wiring)` : 'Inspection found nothing major (it can still miss things)';
  };

  RE.startFlip = (g, hid, level, contractor, contingency) => {
    const F = RC().flip; const h = g.re.holdings.find((x) => x.id === hid); if (!h || h.flip) return { ok: false };
    const L = F.levels[level], K = F.contractors[contractor];
    const budget = Math.round(RE.value(g, h) / condF(h.cond) * condF(70) * L.cost * K.costMult * g.world.priceIdx / g.world.housing * g.world.housing);
    const total = Math.round(budget * (contingency ? 1 + F.contingencyPct : 1));
    if (g.cash < total * 0.3) return { ok: false, msg: `Need at least ${U.money(total * 0.3)} to start (30% upfront).` };
    TG.F.spend(g, Math.round(total * 0.3), 'Renovations', null, true);
    h.flip = { level, contractor, months: L.months, left: L.months, budget, contingency: contingency ? Math.round(budget * F.contingencyPct) : 0, paid: Math.round(total * 0.3), overrun: 0 };
    h.mode = 'reno'; for (let i = 0; i < h.tenants.length; i++) h.tenants[i] = null; h.searches = {}; h.issues = []; // the renovation fixes everything
    return { ok: true, budget };
  };
  RE.list = (g, hid, askMult) => { const h = g.re.holdings.find((x) => x.id === hid); if (!h || h.flip || h.dev) return; h.mode = 'sale'; h.ask = Math.round(RE.value(g, h) * (askMult || 1)); };
  RE.unlist = (g, hid) => { const h = g.re.holdings.find((x) => x.id === hid); if (h && h.mode === 'sale') h.mode = 'rent'; };
  RE.sell = (g, hid, mult) => {
    const C = TG.CONFIG; const h = g.re.holdings.find((x) => x.id === hid); if (!h) return 0;
    const v = Math.round((h.mode === 'sale' && h.ask && !mult ? h.ask : RE.value(g, h) * (mult || 1)) * (1 - C.property.sellCostPct));
    TG.F.earn(g, v, 'Real estate sales', null, true);
    if (h.mortgageId) { const l = g.loans.find((x) => x.id === h.mortgageId); if (l) TG.F.payoff(g, l.id); }
    g.re.holdings = g.re.holdings.filter((x) => x !== h);
    if (h.flipped) { const prof = v - h.paid - h.spent; g.re.flipsDone++; if (prof > 0) g.re.flipsProfit++; TG.rep.event(g, null, prof > 0 ? 'good' : 'bad', `Flip of ${h.name} ${prof > 0 ? 'made' : 'lost'} ${U.money(Math.abs(prof))}`, `Bought ${U.money(h.paid)}, renovation ${U.money(h.spent)}, sold ${U.money(v)} after fees`); }
    return v;
  };
  RE.refinance = (g, hid) => {
    const C = RC(); const h = g.re.holdings.find((x) => x.id === hid); if (!h) return { ok: false };
    const v = RE.value(g, h); const old = h.mortgageId ? g.loans.find((x) => x.id === h.mortgageId) : null;
    const bal = old ? old.balance : 0; const newAmt = Math.round(v * C.refinanceLtv);
    const cashOut = newAmt - bal - Math.round(newAmt * C.refinanceFee);
    if (cashOut < 5000) return { ok: false, msg: 'Not enough equity to refinance.' };
    const ok = TG.CREDIT.apply(g, 'mortgage', newAmt, { collateral: { kind: 'property', id: h.id }, label: 'Refi mortgage: ' + h.name, noCash: true, ltv: C.refinanceLtv }); if (!ok.ok) return ok;
    if (old) g.loans = g.loans.filter((x) => x !== old);
    const loan = ok.loan;
    h.mortgageId = loan.id; TG.F.earn(g, cashOut, 'Refinance cash-out', null, true); TG.F.spend(g, 0, 'Refinance fees', null, true);
    return { ok: true, cashOut };
  };
  RE.develop = (g, hid, units) => {
    const D = RC().develop; const h = g.re.holdings.find((x) => x.id === hid); if (!h || h.kind !== 'land' || h.dev) return { ok: false };
    units = Math.round(U.clamp(units, 4, Math.min(D.maxUnits, h.acres * D.unitsPerAcre)));
    const cpu = R.range(D.costPerUnit[0], D.costPerUnit[1]) * g.world.priceIdx;
    h.dev = { stage: 'permit', left: R.int(D.permitMonths[0], D.permitMonths[1]), units, cpu, cost: Math.round(units * cpu), paid: 0, buildMonths: R.int(D.buildMonths[0], D.buildMonths[1]) };
    TG.F.spend(g, Math.round(25000 * g.world.priceIdx + units * 800), 'Permits & architects', null, true);
    return { ok: true, dev: h.dev };
  };
  RE.hireManager = (g, cand) => { g.re.manager = cand; TG.rep.staff(g, null, `Hired ${cand.name} as property manager (${U.money(cand.wage)}/mo + ${U.pct(RC().managerFeePct)} of rent)`); };
  RE.managerPool = (g) => {
    g.re.pool = g.re.pool && g.re.pool.month === g.month ? g.re.pool : { month: g.month, list: [0, 1, 2, 3].map(() => TG.S.candidate(g, { region: 'harbor', loc: 'suburb' }, 'rem', 0.6)) };
    return g.re.pool.list;
  };
  RE.raiseFund = (g) => {
    const F = RC().fund; const v = RE.totalValue(g);
    if (g.re.fund) return { ok: false, msg: 'Fund already raised.' };
    if (v < F.minPortfolio) return { ok: false, msg: `Needs a ${U.money(F.minPortfolio)} portfolio.` };
    const cash = Math.round(v * F.raisePct); g.re.fund = { share: F.investorShare, raised: cash, since: g.month };
    TG.F.earn(g, cash, 'Fund raise', null, true);
    return { ok: true, cash };
  };

  RE.month = (g) => {
    const C = TG.CONFIG, rc = RC(), w = g.world; const mgr = g.re.manager;
    g.re.m = { rev: 0, cost: 0 };
    const earn = (amt, label) => { amt = Math.round(amt); if (amt <= 0) return; TG.F.earn(g, amt, label); g.re.m.rev += amt; };
    const spend = (amt, label) => { amt = Math.round(amt); if (amt <= 0) return; TG.F.spend(g, amt, label); g.re.m.cost += amt; };
    const units = RE.unitsOwned(g);
    const overSelf = !mgr ? Math.max(0, units - rc.selfManageLimit) : 0;
    // shared costs are split over the properties by units, so each property's line shows its true result
    const share = (h) => (units > 0 ? Math.max(0, h.units || 0) / units : 1 / Math.max(1, g.re.holdings.length));
    if (mgr) { mgr.months++; mgr.morale = U.clamp(mgr.morale + R.normal(0, 3), 0, 100); }
    const mgrWage = mgr ? mgr.wage : 0, handy = g.re.handyman && g.re.holdings.length ? Math.round(RC().handymanFee * g.world.priceIdx) : 0;
    for (const h of g.re.holdings.slice()) {
      if (!g.re.holdings.includes(h)) continue;
      const prevOwn = g._own; g._own = 'r:' + h.id;
      try { RE.holdingMonth(g, h, { C, rc, w, mgr, earn, spend, overSelf, mgrPart: mgrWage * share(h), handyPart: handy * share(h) }); } finally { g._own = prevOwn; }
    }
    if (mgr && !g.re.holdings.length) spend(mgrWage, 'Property manager');
    if (mgr && R.chance(0.01 * (mgr.morale < 40 ? 4 : 1))) { TG.rep.event(g, null, 'bad', `Property manager ${mgr.name} quit`, `Morale ${Math.round(mgr.morale)}`, { major: 'keyQuit' }); g.re.manager = null; }
    // fund distributions
    const net = g.re.m.rev - g.re.m.cost;
    if (g.re.fund && net > 0) spend(net * g.re.fund.share, 'Fund investor distributions');
    g.re.hist.push({ m: g.month, rev: Math.round(g.re.m.rev), cost: Math.round(g.re.m.cost) }); if (g.re.hist.length > 120) g.re.hist.shift();
    // listings
    g.re.listings = g.re.listings.filter((l) => g.month - l.listed < 10 || R.chance(0.5));
    RE.refill(g, rc.newPerMonth);
    while (g.re.listings.length > 20) g.re.listings.shift();
  };
  RE.holdingMonth = (g, h, X) => {
    const { C, rc, w, mgr, earn, spend, overSelf } = X; const k = rc.kinds[h.kind];
    RE.ensureUnits(h);
    if (X.mgrPart) spend(X.mgrPart, 'Property manager');
    if (X.handyPart) spend(X.handyPart, 'Handyman retainer');
    // neighborhood & condition
    h.trend = U.clamp(h.trend + R.normal(0, 0.08), -1, 1);
    h.nb = U.clamp(h.nb * (1 + h.trend * rc.neighborhoodShift / 6), 0.5, 2);
    const decay = rc.conditionDecay * (h.upkeep === 'low' ? 1.8 : h.upkeep === 'high' ? 0.4 : 1);
    h.cond = U.clamp(h.cond - decay * R.range(0.5, 1.5) - 0.6 * h.issues.length, 0, 100); // open repairs wear the building faster
    const v = RE.value(g, h);
    spend(v * rc.propertyTax / 12 * h.taxMult, 'Real estate property tax');
    spend(v * rc.upkeepPct * (h.upkeep === 'low' ? 0.4 : h.upkeep === 'high' ? 2.2 : 1), 'Real estate upkeep');
    if (h.upkeep === 'high') h.cond = U.clamp(h.cond + 0.4, 0, 100);
    if (h.insured) spend(v * rc.insurancePct, 'Real estate insurance');
    if (R.chance(rc.taxHikeChance)) { h.taxMult *= 1.2; TG.rep.event(g, null, 'bad', `Property tax hike on ${h.name} (+20%)`, 'Local tax reassessment'); }
    if (h.flip) { RE.flipMonth(g, h, spend); return; }
    if (h.dev) { RE.devMonth(g, h, spend); return; }
    if (h.mode === 'sale') {
      const pChance = rc.flip.saleChanceBase * Math.pow(w.econ, 2) * Math.pow(h.ask / Math.max(1, RE.value(g, h)), -4) * (w.baseRate > 0.06 ? 0.7 : 1);
      if (R.chance(U.clamp(pChance, 0.01, 0.9))) { const sold = RE.sell(g, h.id); TG.rep.event(g, null, 'good', `Sold ${h.name} for ${U.money(sold)} (after fees)`, `Asking price ${U.money(h.ask)}`); }
      return;
    }
    if (!k.rentPct) return; // land
    const rentCapOn = w.rentCap > 0; const T = TC();
    // a manager pays for open repairs right away; without one they wait for you, and old ones bring city fines
    if (mgr && h.issues.length) for (const it of h.issues.slice()) { h.issues = h.issues.filter((x) => x !== it); RE.addIssue(g, h, it.unit, it.what, it.cost, it.big); }
    for (const it of h.issues) if (g.month - it.m >= 3 && R.chance(0.35)) { const f = Math.round(it.cost * 0.25 + 150 * g.world.priceIdx); spend(f, 'Code violation fines'); TG.rep.event(g, null, 'bad', `City fined you ${U.money(f)}: unfixed ${it.what} at ${h.name}`, `Open for ${g.month - it.m} months. Fix it (Money → Real estate) or hire a property manager.`); }
    if (mgr) RE.mgrFill(g, h); // with no manager, empty units stay empty until YOU run a search
    for (let i = 0; i < h.tenants.length; i++) {
      const t = h.tenants[i]; if (!t) continue;
      if (t.rel == null) t.rel = t.bad ? 0.3 : 0.72;
      if (t.evict > 0) { t.evict--; if (t.evict === 0) { h.tenants[i] = null; spend(t.rent * TC().turnover * 2, 'Unit turnover'); TG.rep.event(g, null, 'info', `Eviction completed at ${h.name}${h.units > 1 ? ' unit ' + (i + 1) : ''}`, 'Unit is empty again: run a tenant search'); } continue; }
      if (R.chance(T.lifeEvent)) { t.rel = Math.max(0.05, t.rel - T.lifeDrop); t.life = true; }
      const broken = RE.unitIssues(h, i).length + h.issues.filter((x) => x.unit == null).length;
      if (broken) t.rel = Math.max(0.05, t.rel - 0.01 * broken); // living with a broken home wears down even good tenants
      const lateP = (T.late.base + T.late.k * Math.pow(1 - t.rel, T.late.pow)) * (w.phase === 'recession' ? T.late.recession : 1) * (overSelf ? 1.3 : 1);
      const fee = mgr ? 1 - rc.managerFeePct : 1;
      const withhold = broken && R.chance(0.3) ? 0.5 : 0;
      if (R.chance(lateP)) {
        const miss = R.chance(T.late.missShare[0] + T.late.missShare[1] * (1 - t.rel));
        if (miss) { t.late++; if (t.late >= 2 && !t.evict) RE.evictCard(g, h, i); }
        else { earn(t.rent * (1 + T.lateFee) * fee * (1 - withhold), 'Rent'); t.lates = (t.lates || 0) + 1; }
      } else { earn(t.rent * fee * (1 - withhold), 'Rent'); t.late = Math.max(0, t.late - 1); }
      if (withhold) TG.rep.event(g, null, 'bad', `Tenant at ${h.name}${h.units > 1 ? ' unit ' + (i + 1) : ''} paid only half the rent`, 'They are waiting for a repair to be fixed.');
      if (mgr && R.chance(0.02) && mgr.honesty < 40) { const sk = Math.round(t.rent * 0.5); spend(sk, 'Theft losses'); }
      if (R.chance(T.damage.base + T.damage.k * Math.pow(1 - t.rel, 2))) { const c = v / Math.max(1, h.units) * R.range(rc.damageCost[0], rc.damageCost[1]) * 4; h.cond = U.clamp(h.cond - 5, 0, 100); RE.addIssue(g, h, i, t.rel < 0.45 ? 'damage left by a risky tenant' : 'accidental damage', c); }
      // lease end: they may leave; rent resets to YOUR asking rent (capped by rent control)
      const held = g.month - t.since;
      if (held >= t.lease && held % 12 === t.lease % 12) {
        const ask = RE.askRent(g, h), mr = RE.marketRent(g, h);
        const leaveP = T.leave.base + T.leave.k * (1 - t.rel) + (ask > mr * 1.08 ? T.leave.overRent * (ask / mr - 1.08) * 5 : 0) + 0.2 * Math.min(2, broken);
        if (R.chance(U.clamp(leaveP, 0, 0.95))) { h.tenants[i] = null; spend(t.rent * T.turnover, 'Unit turnover'); TG.rep.event(g, null, 'info', `A tenant moved out of ${h.name}${h.units > 1 ? ' unit ' + (i + 1) : ''}`, `Lease ended${ask > mr * 1.08 ? '; your rent is above market' : ''}${broken ? '; repairs were left unfixed' : ''}. ${mgr ? 'Your manager will find a new one.' : 'Run a tenant search to fill it.'}`); continue; }
        t.rent = rentCapOn ? Math.round(Math.min(ask, t.rent * 1.02)) : ask;
      }
    }
    // repairs & disasters (repairs go through the manager, or wait for you)
    const nUnits = Math.max(1, h.units);
    const repP = rc.repairChance * Math.sqrt(nUnits) * (1.6 - h.cond / 100) * (h.upkeep === 'low' ? 1.5 : h.upkeep === 'high' ? 0.6 : 1);
    if (R.chance(repP)) { const c = v * R.range(rc.repairCost[0], rc.repairCost[1]) / Math.sqrt(nUnits); RE.addIssue(g, h, nUnits > 1 ? R.int(0, nUnits - 1) : 0, R.pick(['water heater', 'furnace', 'roof leak', 'plumbing', 'appliances']), c); }
    if (R.chance(rc.bigRepairChance * (1.6 - h.cond / 100))) { const c = v * R.range(rc.bigRepairCost[0], rc.bigRepairCost[1]); RE.addIssue(g, h, null, R.pick(['roof replacement', 'foundation work', 'boiler replacement', 'sewer line']), c, true); }
    if (R.chance(rc.injuryChance * nUnits * (1.5 - h.cond / 100))) TG.B.lawsuit(g, null, `Tenant injury at ${h.name}`, R.range(rc.injurySuit[0], rc.injurySuit[1]) * w.priceIdx, null, `Condition ${Math.round(h.cond)}%`);
    if (R.chance(rc.disasterChance)) { const c = v * R.range(rc.disasterCost[0], rc.disasterCost[1]); const cov = h.insured ? c * C.finance.insCover : 0; spend(c - cov, 'Disaster damage'); h.cond = U.clamp(h.cond - 30, 0, 100); TG.rep.event(g, null, 'major', `${R.pick(['Fire', 'Flood', 'Storm'])} damaged ${h.name} (${U.money(c)}${h.insured ? ', insurance paid ' + U.money(cov) : ', NOT insured'})`, 'Rare disaster'); }
  };
  RE.evictCard = (g, h, i) => {
    const rc = RC(); const t = h.tenants[i];
    if (g.re.manager) { RE.evict(g, h.id, i, 'Property manager ' + g.re.manager.name); return; }
    TG.D.add(g, { kind: 'evict', reId: h.id, unit: i, title: `Tenant behind on rent at ${h.name}`, text: `A tenant is ${t.late} months behind.`, why: t.rel < 0.45 ? 'Risky tenants are far more likely to miss rent.' : 'Even good tenants fall behind sometimes, more often in a recession.',
      options: [{ id: 'evict', label: `Start eviction (${U.money(rc.evictionCost[0])}-${U.money(rc.evictionCost[1])}, ${rc.evictionMonths[0]}-${rc.evictionMonths[1]} months)` }, { id: 'wait', label: 'Wait and hope they pay' }], def: 'wait' });
  };
  RE.evict = (g, hid, i, by) => {
    const rc = RC(); const h = g.re.holdings.find((x) => x.id === hid); if (!h || !h.tenants[i]) return;
    const lawyer = g.businesses.some((b) => b.spec && b.spec.lawyer);
    const cost = Math.round(R.range(rc.evictionCost[0], rc.evictionCost[1]) * g.world.priceIdx * (lawyer ? 1 - rc.lawyerEvictionCut : 1));
    TG.F.spend(g, cost, 'Evictions'); g.re.m.cost += cost;
    h.tenants[i].evict = R.int(rc.evictionMonths[0], rc.evictionMonths[1]);
    TG.rep.decision(g, null, by, `Started an eviction at ${h.name} (${U.money(cost)})`);
  };
  RE.flipMonth = (g, h, spend) => {
    const F = RC().flip, f = h.flip, K = F.contractors[f.contractor], L = F.levels[f.level];
    const per = f.budget * 0.7 / f.months;
    spend(per, 'Renovations'); h.spent += per; f.paid += per;
    if (R.chance(K.vanish / f.months * 2)) { const lost = Math.round(f.budget * 0.25); spend(lost, 'Renovations'); h.spent += lost; f.left += 2; TG.rep.event(g, null, 'major', `Contractor disappeared with a ${U.money(lost)} deposit at ${h.name}`, `${K.label}: ${U.pct(K.vanish)} chance per job`); return; }
    if (h.hidden > 0 && R.chance(0.35)) { const c = Math.round(h.hidden * h.basePrice); const cov = Math.min(c, f.contingency); f.contingency -= cov; spend(c - cov, 'Renovations'); h.spent += c; TG.rep.event(g, null, 'bad', `Hidden problem found at ${h.name}: ${R.pick(['mold', 'foundation cracks', 'old wiring', 'rotten joists'])} (${U.money(c)})`, `${h.inspected ? 'The inspection missed it' : 'No pre-purchase inspection'}${cov ? '; contingency covered ' + U.money(cov) : ''}`); h.hidden = 0; }
    if (R.chance(K.overrun / f.months)) { const c = Math.round(f.budget * R.range(0.08, 0.25)); const cov = Math.min(c, f.contingency); f.contingency -= cov; spend(c - cov, 'Renovations'); h.spent += c; TG.rep.event(g, null, 'bad', `Renovation cost overrun at ${h.name} (${U.money(c)})`, `${K.label}; ${cov ? 'contingency covered ' + U.money(cov) : 'no contingency budget'}`); }
    if (R.chance(K.delay / f.months)) { f.left += R.int(1, 2); TG.rep.event(g, null, 'bad', `Contractor delay at ${h.name}`, `${K.label}; holding costs keep piling up`); }
    f.left--;
    if (f.left <= 0) {
      h.cond = U.clamp(h.cond + L.cond * K.quality, 0, 100);
      if (L.overNeighborhood && h.grade !== 'A') h.over = true;
      h.base *= 1 + L.value * K.quality * 0.25;
      h.flip = null; h.mode = 'hold'; h.flipped = true;
      TG.rep.event(g, null, 'good', `Renovation finished at ${h.name}: now worth about ${U.money(RE.value(g, h))}`, `${L.label} by ${K.label.toLowerCase()}${h.over ? '; over-renovated for the neighborhood' : ''}. List it for sale or rent it out.`);
    }
  };
  RE.devMonth = (g, h, spend) => {
    const D = RC().develop, d = h.dev;
    if (d.stage === 'permit') {
      if (R.chance(D.stallChance)) { d.left += R.int(2, 6); TG.rep.event(g, null, 'bad', `Zoning approval for ${h.name} stalled (city politics)`, 'Big developments can stall for years'); }
      if (--d.left <= 0) { d.stage = 'build'; d.left = d.buildMonths; TG.rep.event(g, null, 'good', `Permits approved for ${h.name}: construction starts (${d.units} units)`, 'Permit stage complete'); }
      return;
    }
    let per = d.cost / d.buildMonths;
    if (R.chance(D.overrun / d.buildMonths * 2)) { const x = R.range(D.overrunPct[0], D.overrunPct[1]); per *= 1 + x * 3; TG.rep.event(g, null, 'bad', `Development cost overrun at ${h.name}`, 'Construction costs and delays'); }
    spend(per, 'Development construction'); d.paid += per;
    if (--d.left <= 0) {
      h.kind = d.units >= 20 ? 'apartment' : 'smallapt'; h.units = d.units; h.cond = 95; h.age = 0; h.dev = null; h.mode = 'rent';
      h.basePrice = d.cost * 1.25; h.base = (h.base * g.world.housing * h.nb * condF(h.cond) + d.cost * 1.25) / (g.world.housing * h.nb * condF(h.cond));
      h.housingAtBuy = g.world.housing; h.tenants = Array(d.units).fill(null); h.searches = {}; h.issues = [];
      TG.rep.event(g, null, 'good', `Development finished: ${h.name} now has ${d.units} units`, `Total build cost ${U.money(d.paid)}`);
    }
  };
  TG.RE = RE;
})();

</script>
<script>/* js/invest.js */
/* invest.js - stocks, penny stocks & coins, margin, angel investing, casino, horse & sports betting.
   House edges and negative drifts are real; there are no patterns to exploit. */
(function () {
  const TG = globalThis.TG; const R = TG.R, U = TG.U;
  const I = {};
  const IC = () => TG.CONFIG.invest, CC = () => TG.CONFIG.casino;

  I.init = (g) => {
    const A = IC().assets; g.invest = { prices: {}, hist: {}, pos: {}, marginDebt: 0, angels: [], angelOffers: [], casino: { net: 0, bets: 0, banned: false, lifetimeNet: 0 }, habit: 0, gambleNet: 0, betsNet: 0, race: null, game: null };
    for (const s in A) { g.invest.prices[s] = A[s].start; g.invest.hist[s] = [A[s].start]; }
    I.newRace(g); I.newGame(g);
  };
  I.high = (s) => IC().assets[s].kind !== 'stock';
  I.posValue = (g) => U.sum(Object.keys(g.invest.pos), (s) => g.invest.pos[s].qty * g.invest.prices[s]);
  I.angelValue = (g) => U.sum(g.invest.angels, (a) => a.amt * (a.mark != null ? a.mark : 0.7));
  I.value = (g) => (g.invest ? Math.round(I.posValue(g) + I.angelValue(g)) : 0);
  I.equity = (g) => I.posValue(g) - g.invest.marginDebt;
  I.marginRoom = (g) => Math.max(0, Math.round(I.equity(g) * (IC().margin.maxLev - 1) - g.invest.marginDebt));

  I.buy = (g, sym, amount, useMargin) => {
    amount = Math.round(amount); if (!(amount > 0)) return { ok: false, msg: 'Enter an amount.' };
    if (I.high(sym) && !g.settings.gambling) return { ok: false, msg: 'High-risk assets are turned off in settings.' };
    const p = g.invest.prices[sym]; if (!(p > 0)) return { ok: false, msg: 'Not trading.' };
    let fromMargin = 0;
    if (useMargin) {
      if (!g.settings.gambling) return { ok: false, msg: 'Margin is turned off with high-risk investing.' };
      const room = Math.max(0, Math.round((I.equity(g) + amount) * (IC().margin.maxLev - 1) - g.invest.marginDebt));
      fromMargin = Math.min(room, Math.round(amount / 2));
    }
    const cashPart = amount - fromMargin;
    if (g.cash < cashPart) return { ok: false, msg: `Need ${U.money(cashPart)} in cash.` };
    const fee = Math.round(amount * IC().tradeFee);
    TG.F.spend(g, cashPart, 'Investments bought', null, true); TG.F.spend(g, fee, 'Trading fees');
    g.invest.marginDebt += fromMargin;
    const pos = g.invest.pos[sym] || (g.invest.pos[sym] = { qty: 0, cost: 0 });
    pos.qty += amount / p; pos.cost += amount;
    return { ok: true, fromMargin };
  };
  I.sell = (g, sym, frac, mult, quiet) => {
    const pos = g.invest.pos[sym]; if (!pos || pos.qty <= 0) return 0;
    frac = U.clamp(frac == null ? 1 : frac, 0, 1);
    const q = pos.qty * frac; let v = q * g.invest.prices[sym] * (mult || 1);
    const fee = v * IC().tradeFee; v -= fee;
    const costPart = pos.cost * frac; pos.qty -= q; pos.cost -= costPart;
    if (pos.qty < 1e-9) delete g.invest.pos[sym];
    // repay margin first
    const repay = Math.min(g.invest.marginDebt, v); g.invest.marginDebt -= repay;
    TG.F.earn(g, Math.round(v - repay), 'Investments sold', null, true);
    const gain = v - costPart; if (gain > 0) g.invest.realized = (g.invest.realized || 0) + gain;
    if (!quiet) TG.rep.event(g, null, gain >= 0 ? 'good' : 'bad', `Sold ${TG.CONFIG.invest.assets[sym].label}: ${gain >= 0 ? 'gain' : 'loss'} of ${U.money(Math.abs(gain))}`, `Cost basis ${U.money(costPart)}`);
    return v;
  };
  I.repayMargin = (g, amt) => { amt = Math.min(Math.round(amt), g.invest.marginDebt, Math.max(0, g.cash)); if (amt <= 0) return; TG.F.spend(g, amt, 'Margin repayment', null, true); g.invest.marginDebt -= amt; };

  I.month = (g) => {
    const A = IC().assets, iv = g.invest, w = g.world, C = IC();
    const drift = { boom: 0.006, recovery: 0.004, slowdown: -0.004, recession: -0.012 }[w.phase] || 0;
    let mkt = drift + R.normal(0, C.econShockSd);
    const crashP = 0.004 * (w.phase === 'slowdown' || w.phase === 'recession' ? 3 : 0.6);
    if (R.chance(crashP)) { const d = R.range(C.crashDrop[0], C.crashDrop[1]); mkt -= d; TG.rep.news(g, `Stock market crash: index falls about ${U.pct(d)}`, 'bad', true); }
    for (const s in A) {
      const a = A[s]; let p = iv.prices[s];
      if (!(p > 0)) { // relaunch a dead ticker as a fresh one
        iv.prices[s] = a.start; iv.hist[s] = [a.start]; continue;
      }
      if (a.zero && R.chance(a.zero)) {
        if (iv.pos[s]) { TG.rep.event(g, null, 'major', `${a.label} collapsed to zero: you lost ${U.money(iv.pos[s].cost)}`, `${a.kind === 'coin' ? 'Coins' : 'Penny stocks'} carry a ${U.pct(a.zero, 1)} monthly wipe-out risk`, { major: 'cash' }); delete iv.pos[s]; }
        iv.prices[s] = 0; iv.hist[s].push(0); continue;
      }
      const r = a.mu + a.beta * mkt + R.normal(0, a.sd) - a.sd * a.sd / 2;
      p = Math.max(a.start * 0.0005, p * Math.exp(r));
      iv.prices[s] = p; iv.hist[s].push(+p.toFixed(4)); if (iv.hist[s].length > 120) iv.hist[s].shift();
    }
    // margin interest & calls
    if (iv.marginDebt > 0) {
      const int = Math.round(iv.marginDebt * (w.baseRate + C.margin.spread) / 12);
      TG.F.spend(g, int, 'Margin interest');
      const pv = I.posValue(g);
      if (pv <= 0 || (pv - iv.marginDebt) / pv < C.margin.callAt) {
        const before = iv.marginDebt;
        for (const s of Object.keys(iv.pos)) I.sell(g, s, 1, 1, true);
        if (iv.marginDebt > 0) { TG.F.spend(g, iv.marginDebt, 'Margin call shortfall', null, true); iv.marginDebt = 0; }
        TG.rep.event(g, null, 'major', `Margin call! Broker sold all your positions`, `Equity fell below ${U.pct(C.margin.callAt)} of positions; margin debt was ${U.money(before)}`, { major: 'cash' });
      }
    }
    // angel investments
    for (const a of iv.angels.slice()) {
      a.left--;
      if (a.left === Math.floor(a.horizon / 2)) { a.mark = a.outcome[1] === 0 ? R.range(0.1, 0.5) : R.range(0.6, 1.6); TG.rep.event(g, null, 'info', `${a.name} update: ${a.mark < 0.6 ? 'struggling to raise more money' : 'growing, raising a new round'}`, 'Startup progress is noisy; early signals can mislead'); }
      if (a.left <= 0) {
        const pay = Math.round(a.amt * a.mult);
        iv.angels = iv.angels.filter((x) => x !== a);
        if (pay > 0) TG.F.earn(g, pay, 'Angel exits', null, true);
        TG.rep.event(g, null, pay > a.amt ? 'good' : 'bad', pay > 0 ? `${a.name} ${a.mult >= 3 ? 'was acquired' : 'returned money'}: you got ${U.money(pay)} (${a.mult.toFixed(1)}x)` : `${a.name} failed: ${U.money(a.amt)} lost`, 'Most startups fail; a few return many times the money');
      }
    }
    // offers
    iv.angelOffers = iv.angelOffers.filter((o) => o.expires > g.month);
    while (iv.angelOffers.length < IC().angel.offers) iv.angelOffers.push(I.angelOffer(g));
    // casino & habit
    iv.casino.bets = 0;
    iv.habit = Math.max(0, iv.habit - CC().habitDecay);
    if (g.settings.gambling && g.settings.habit && iv.habit >= CC().habitChase && g.cash > 20000) {
      const loss = Math.round(g.cash * R.range(CC().chaseLoss[0], CC().chaseLoss[1]));
      TG.F.spend(g, loss, 'Gambling losses'); iv.gambleNet -= loss;
      TG.rep.event(g, null, 'bad', `You chased losses at the casino (${U.money(loss)})`, `Gambling habit ${Math.round(iv.habit)}/100: big bets build a habit; it fades if you stop`);
    }
    I.newRace(g); I.newGame(g);
  };
  I.angelOffer = (g) => {
    const A = IC().angel; const sectors = ['food delivery app', 'battery startup', 'pet tech', 'farm robotics', 'fintech', 'biotech lab', 'fashion marketplace', 'logistics software', 'game studio'];
    const roll = R.next(); let acc = 0, oc = A.outcomes[0];
    for (const o of A.outcomes) { acc += o[0]; if (roll < acc) { oc = o; break; } }
    const signal = U.clamp((oc[1] > 0 ? 0.6 : 0.4) + R.normal(0, 0.25), 0, 1);
    return { id: U.uid('a'), name: `${R.pick(['Nova', 'Bright', 'Kite', 'Atlas', 'Ember', 'Pivot', 'Orbit', 'Juniper'])} ${R.pick(['Labs', 'Works', 'AI', 'Co', 'Systems'])}`, sector: R.pick(sectors),
      min: Math.round(R.range(A.min, A.max / 4) / 5000) * 5000, buzz: signal > 0.66 ? 'Strong team, early traction' : signal > 0.45 ? 'Promising idea, unproven' : 'Heavy competition, thin traction', outcome: oc, expires: g.month + 2 };
  };
  I.angelInvest = (g, offerId, amt) => {
    if (!g.settings.gambling) return { ok: false, msg: 'High-risk investing is off in settings.' };
    const o = g.invest.angelOffers.find((x) => x.id === offerId); if (!o) return { ok: false, msg: 'Offer gone.' };
    amt = Math.round(Math.max(o.min, Math.min(amt || o.min, IC().angel.max)));
    if (g.cash < amt) return { ok: false, msg: `Need ${U.money(amt)}.` };
    TG.F.spend(g, amt, 'Angel investments', null, true);
    const H = IC().angel.horizon; const horizon = R.int(H[0], H[1]);
    g.invest.angels.push({ id: o.id, name: o.name, sector: o.sector, amt, horizon, left: horizon, outcome: o.outcome, mult: o.outcome[1] === 0 ? 0 : R.range(o.outcome[1], o.outcome[2]), mark: null });
    g.invest.angelOffers = g.invest.angelOffers.filter((x) => x !== o);
    return { ok: true };
  };

  // ---------- casino ----------
  I.betLimit = (g) => { const c = g.invest.casino; let m = CC().maxBet; if (c.net > CC().limitShrinkAt) m *= 0.4; return Math.round(m); };
  I.canBet = (g, amt) => {
    const c = g.invest.casino;
    if (!g.settings.gambling) return 'Gambling is turned off in settings.';
    if (c.banned) return 'The casino has banned you for winning too much.';
    if (c.bets >= CC().betsPerMonth) return `Bet limit reached (${CC().betsPerMonth} per month). Come back next month.`;
    if (!(amt >= CC().minBet)) return `Minimum bet ${U.money(CC().minBet)}.`;
    if (amt > I.betLimit(g)) return `Table limit is ${U.money(I.betLimit(g))}.`;
    if (amt > g.cash) return 'Not enough cash.';
    return null;
  };
  // net > 0 = winnings, net < 0 = loss
  I.settle = (g, amt, net) => {
    const c = g.invest.casino, iv = g.invest; c.bets++;
    if (amt > Math.max(1000, g.cash * 0.02)) iv.habit = Math.min(100, iv.habit + CC().habitPerBigBet);
    net = Math.round(net);
    if (net > 0) TG.F.earn(g, net, 'Gambling winnings'); else if (net < 0) TG.F.spend(g, -net, 'Gambling losses');
    c.net += net; c.lifetimeNet += net; iv.gambleNet += net;
    if (!c.banned && c.net > CC().banAtNetWin) { c.banned = true; TG.rep.event(g, null, 'warn', 'The casino banned you after your winning streak', `Net winnings over ${U.money(CC().banAtNetWin)}`); }
    return net;
  };
  I.casinoBet = (g, game, amt) => {
    amt = Math.round(amt); const err = I.canBet(g, amt); if (err) return { ok: false, msg: err };
    const G = CC().games[game]; if (!G) return { ok: false, msg: 'Unknown game.' };
    if (game === 'slots') {
      // paytable (total returned per $1): 0.1% x200, 1% x20, 5% x5, 20% x1.5 -> 0.95, scaled to the configured RTP
      const r = R.next(); let mult = r < 0.001 ? 200 : r < 0.011 ? 20 : r < 0.061 ? 5 : r < 0.261 ? 1.5 : 0;
      mult *= G.rtp / 0.95;
      const net = I.settle(g, amt, amt * (mult - 1));
      return { ok: true, win: net > 0, text: mult > 0 ? `Slots returned ${mult.toFixed(2)}x (${net >= 0 ? '+' : '-'}${U.money(Math.abs(net))})` : `Slots: nothing (-${U.money(amt)})` };
    }
    const won = R.chance(G.p);
    I.settle(g, amt, won ? amt * G.pays : -amt);
    return { ok: true, win: won, text: won ? `${G.label}: won ${U.money(amt * G.pays)}` : `${G.label}: lost ${U.money(amt)}` };
  };
  I.newRace = (g) => {
    const H = CC().horses; const raw = []; for (let i = 0; i < H.field; i++) raw.push(Math.pow(R.range(0.3, 1), 2.2));
    const tot = U.sum(raw, (x) => x);
    const names = ['Copper Dash', 'Midnight Rye', 'Lucky Seven', 'Paper Moon', 'Iron Lady', 'Quick Sand', 'Blue Comet', 'Old Faithful', 'Silver Bell', 'Prairie Fire'];
    const pick = R.shuffle(names.slice()).slice(0, H.field);
    g.invest.race = { horses: raw.map((x, i) => { const p = x / tot; return { name: pick[i], p, odds: +(1 / (p * H.overround)).toFixed(2) }; }) };
  };
  I.betHorse = (g, idx, amt) => {
    amt = Math.round(amt); const err = I.canBet(g, amt); if (err) return { ok: false, msg: err };
    const hs = g.invest.race.horses; const r = R.next(); let acc = 0, winner = hs.length - 1;
    for (let i = 0; i < hs.length; i++) { acc += hs[i].p; if (r < acc) { winner = i; break; } }
    const won = winner === idx; I.settle(g, amt, won ? amt * (hs[idx].odds - 1) : -amt);
    const txt = `${hs[winner].name} won the race. ${won ? `You won ${U.money(amt * (hs[idx].odds - 1))}` : `You lost ${U.money(amt)}`}`;
    I.newRace(g);
    return { ok: true, win: won, text: txt };
  };
  I.newGame = (g) => {
    const teams = ['Harbor Hawks', 'Maple Miners', 'Mesa Suns', 'River Kings', 'Valley Bears', 'Coast Pilots', 'Ridge Wolves', 'Lake Comets'];
    const [a, c] = R.shuffle(teams.slice()).slice(0, 2); const p = R.range(0.3, 0.7); const v = CC().sports.vig;
    g.invest.game = { a, b: c, p, oddsA: +(1 / (p * (1 + v))).toFixed(2), oddsB: +(1 / ((1 - p) * (1 + v))).toFixed(2) };
  };
  I.betSports = (g, side, amt) => {
    amt = Math.round(amt); const err = I.canBet(g, amt); if (err) return { ok: false, msg: err };
    const gm = g.invest.game; const aWins = R.chance(gm.p); const won = (side === 'a') === aWins; const odds = side === 'a' ? gm.oddsA : gm.oddsB;
    I.settle(g, amt, won ? amt * (odds - 1) : -amt);
    const txt = `${aWins ? gm.a : gm.b} won. ${won ? `You won ${U.money(amt * (odds - 1))}` : `You lost ${U.money(amt)}`}`;
    I.newGame(g);
    return { ok: true, win: won, text: txt };
  };

  I.liquidateAll = (g, mult) => { for (const s of Object.keys(g.invest.pos)) I.sell(g, s, 1, mult || 1, true); for (const a of g.invest.angels) { const v = Math.round(a.amt * (a.mark || 0.5) * 0.3); if (v > 0) TG.F.earn(g, v, 'Angel stakes sold', null, true); } g.invest.angels = []; };
  I.wipe = (g) => { g.invest.pos = {}; g.invest.marginDebt = 0; g.invest.angels = []; };
  TG.I = I;
})();

</script>
<script>/* js/crime.js */
/* crime.js - the optional crime side: street empire (fictional goods), crew, turf, heat, raids, jail, laundering, one-off jobs.
   Money from crime is "dirty" (g.crime.dirty) and can only become normal cash through laundering. Every bad event has odds and a reason. */
(function () {
  const TG = globalThis.TG; const R = TG.R, U = TG.U;
  const K = () => TG.CONFIG.crime;
  const CR = {};
  const N = (x) => Math.round(x).toLocaleString();

  CR.on = (g) => g.settings.crime !== false;
  CR.ensure = (g) => {
    if (g.crime) return g.crime;
    const c = (g.crime = { started: false, dirty: 0, heat: 0, rep: 40, clients: 0, blocks: 0, stock: {}, ask: {}, idx: {}, crew: [], gear: [], cands: [], candM: -1,
      supplier: 'plug', lawyer: 'none', bribe: 'none', racket: false, launder: 0, laund: {}, jail: 0, record: 0, plan: null, cd: {}, flow: [], next: [], hist: [],
      last: {}, stats: { earned: 0, seized: 0, laundered: 0, raids: 0, arrests: 0, heists: 0, jailMonths: 0 }, selfDeal: true });
    for (const p in K().products) { c.stock[p] = 0; c.ask[p] = null; c.idx[p] = 1; }
    return c;
  };
  CR.jailed = (g) => !!(g.crime && g.crime.jail > 0);
  CR.started = (g) => !!(g.crime && g.crime.started);

  // ---------- prices & stock ----------
  CR.street = (g, p) => K().products[p].street * CR.ensure(g).idx[p] * g.world.priceIdx;
  CR.wholesale = (g, p) => K().products[p].buy * CR.ensure(g).idx[p] * g.world.priceIdx;
  CR.price = (g, p) => { const a = CR.ensure(g).ask[p]; return a != null ? a : CR.street(g, p); };
  CR.ratio = (g, p) => CR.price(g, p) / Math.max(0.01, CR.street(g, p));
  CR.unlocked = (g, u) => { const c = CR.ensure(g); return c.blocks >= (u.turf || 0) && c.rep >= (u.rep || 0); };
  CR.units = (g) => U.sum(Object.values(CR.ensure(g).stock), (x) => x);
  CR.room = (g) => K().baseStore + U.sum(CR.ensure(g).gear.filter((x) => x.type === 'stash'), () => K().gear.stash.store);
  CR.setAsk = (g, p, v) => { const c = CR.ensure(g); if (!K().products[p]) return; c.ask[p] = v == null || !(v > 0) ? null : Math.round(Math.min(v, CR.street(g, p) * 4)); };
  CR.stockValue = (g) => U.sum(Object.keys(K().products), (p) => CR.ensure(g).stock[p] * CR.wholesale(g, p));

  // move normal cash into dirty cash (always allowed; big amounts get noticed)
  CR.withdraw = (g, amt) => {
    const c = CR.ensure(g); amt = Math.floor(Math.min(amt, Math.max(0, g.cash))); if (!(amt > 0)) return { ok: false, msg: 'No cash to move.' };
    TG.F.spend(g, amt, 'Cash moved to the street', null, true); c.dirty += amt; c.started = true;
    const h = Math.max(0, (amt - 10000) / 50000) * 2; c.heat = U.clamp(c.heat + h, 0, 100);
    return { ok: true, heat: h };
  };

  // ---------- buying from a supplier: the order may arrive full, short, not at all, or be a police sting ----------
  CR.supOdds = (g, s) => { const S = K().suppliers[s]; const none = Math.max(0, 1 - S.ok - S.short - S.sting); return { ok: S.ok, short: S.short, none, sting: S.sting }; };
  CR.orderCost = (g, s, p, q) => Math.round(q * CR.wholesale(g, p) * K().suppliers[s].mult);
  CR.buy = (g, s, p, q) => {
    const c = CR.ensure(g), S = K().suppliers[s], P = K().products[p];
    if (CR.jailed(g)) return { ok: false, msg: 'You are in jail.' };
    if (!S || !P) return { ok: false, msg: 'Pick a supplier and a product.' };
    if (!CR.unlocked(g, S.unlock)) return { ok: false, msg: `${S.label} only deals with crews holding ${S.unlock.turf}+ blocks and ${S.unlock.rep}+ street rep.` };
    if (!CR.unlocked(g, P.unlock)) return { ok: false, msg: `${P.label} needs ${P.unlock.turf}+ blocks and ${P.unlock.rep}+ street rep.` };
    if (!S.goods.includes(p)) return { ok: false, msg: `${S.label} does not sell ${P.label}.` };
    q = Math.floor(Math.min(q, S.maxOrder, CR.room(g) - CR.units(g)));
    if (!(q > 0)) return { ok: false, msg: 'No room in your stash. Get a stash house or sell first.' };
    const cost = CR.orderCost(g, s, p, q);
    if (S.minOrder && cost < S.minOrder) return { ok: false, msg: `${S.label} wants orders of at least ${U.money(S.minOrder)}.` };
    if (c.dirty < cost) return { ok: false, msg: `Costs ${U.money(cost)} in street cash. Move cash to the street first.` };
    c.dirty -= cost; c.started = true; c.last.spent = (c.last.spent || 0) + cost;
    if (S.orderHeat) c.heat = U.clamp(c.heat + S.orderHeat, 0, 100);
    const o = CR.supOdds(g, s); const r = R.next();
    if (r < o.sting) { c.heat = U.clamp(c.heat + 25, 0, 100); CR.log(g, 'bad', `The ${S.label} deal was a police sting! Lost ${U.money(cost)}`, `${U.pct(o.sting)} sting odds with ${S.label}`); CR.raid(g, 'a sting deal', 0.25); return { ok: true, got: 0, cost, out: 'sting' }; }
    if (r < o.sting + o.none) { const back = Math.round(cost * (1 - K().noShowLoss)); c.dirty += back; CR.log(g, 'bad', `${S.label} never showed. Got back ${U.money(back)} of ${U.money(cost)}`, `${U.pct(o.none)} no-show odds`); return { ok: true, got: 0, cost: cost - back, out: 'none' }; }
    let got = q; if (r < o.sting + o.none + o.short) { got = Math.floor(q * R.range(0.4, 0.8)); }
    c.stock[p] += got;
    return { ok: true, got, cost, out: got < q ? 'short' : 'ok' };
  };
  CR.dump = (g, p, q) => {
    const c = CR.ensure(g); q = Math.floor(Math.min(q, c.stock[p] || 0)); if (!(q > 0)) return { ok: false, msg: 'Nothing to sell back.' };
    const v = Math.round(q * CR.wholesale(g, p) * K().sellBackShare); c.stock[p] -= q; c.dirty += v; return { ok: true, v };
  };

  // ---------- crew ----------
  const capOf = (e) => K().crew[e.role].cap * (0.6 + 0.8 * e.skill / 100) * (e.inj ? 0.5 : 1);
  CR.capOf = capOf;
  CR.candidates = (g) => {
    const c = CR.ensure(g);
    if (c.candM !== g.month) {
      c.candM = g.month; c.cands = [];
      for (const role in K().crew) for (let i = 0; i < 2; i++) {
        const skill = Math.round(U.clamp(R.normal(45 + c.rep / 5, 15), 5, 95)); const loyal = Math.round(U.clamp(R.normal(55, 18), 5, 95));
        c.cands.push({ id: U.uid('k'), name: TG.S.name(), role, skill, loyalty: loyal, wage: Math.round(K().crew[role].wage * (0.75 + skill / 200)) });
      }
    }
    return c.cands;
  };
  CR.hire = (g, id) => {
    const c = CR.ensure(g); if (CR.jailed(g)) return { ok: false, msg: 'You are in jail.' };
    const k = c.cands.find((x) => x.id === id); if (!k) return { ok: false, msg: 'They moved on.' };
    const fee = Math.round(k.wage * K().hireCost); if (c.dirty < fee) return { ok: false, msg: `Needs ${U.money(fee)} street cash up front.` };
    c.dirty -= fee; c.cands = c.cands.filter((x) => x !== k); c.crew.push(Object.assign({}, k, { since: g.month })); c.started = true;
    return { ok: true };
  };
  CR.fire = (g, id) => { const c = CR.ensure(g); const e = c.crew.find((x) => x.id === id); if (!e) return; c.crew = c.crew.filter((x) => x !== e); for (const o of c.crew) o.loyalty = U.clamp(o.loyalty - 2, 0, 100); };
  // anti-spam: 1 training and 1 bonus per person per month; more backfires (loyalty down, no gain)
  CR.train = (g, id) => {
    const c = CR.ensure(g); const e = c.crew.find((x) => x.id === id); if (!e) return { ok: false };
    if (c.dirty < K().trainCost) return { ok: false, msg: `Costs ${U.money(K().trainCost)} street cash.` };
    c.dirty -= K().trainCost;
    if (TG.USES.take(e, 'train', g.month) > K().trainPerMonth) { e.loyalty = U.clamp(e.loyalty - 3, 0, 100); return { ok: true, spam: true }; }
    const x = Math.round(R.range(K().trainSkill[0], K().trainSkill[1])); e.skill = U.clamp(e.skill + x, 1, 99); return { ok: true, gain: x };
  };
  CR.bonus = (g, id) => {
    const c = CR.ensure(g); const e = c.crew.find((x) => x.id === id); if (!e) return { ok: false };
    const v = Math.round(e.wage * 0.5); if (c.dirty < v) return { ok: false, msg: `Costs ${U.money(v)} street cash.` };
    c.dirty -= v;
    if (TG.USES.take(e, 'bonus', g.month) > K().bonusPerMonth) { e.loyalty = U.clamp(e.loyalty - 3, 0, 100); return { ok: true, spam: true }; }
    e.loyalty = U.clamp(e.loyalty + 10, 0, 100); return { ok: true };
  };
  CR.count = (g, role) => CR.ensure(g).crew.filter((e) => e.role === role).length;
  CR.capacity = (g) => {
    const c = CR.ensure(g); const J = CR.jailed(g) ? 0.5 : 1; const me = !CR.jailed(g) && c.selfDeal;
    const sum = (r) => U.sum(c.crew.filter((e) => e.role === r), capOf);
    const vans = c.gear.filter((x) => x.type === 'van' && !x.broken).length;
    const shops = c.gear.filter((x) => x.type === 'workshop' && !x.broken).length * K().gear.workshop.cap;

    const room = Math.round((60 + c.blocks * k.perBlock) * (r > 1 ? Math.pow(1 / r, k.dearRoom) : 1)); c.last.room = room;
    if (active) {
      const add = (1 + c.blocks) * k.newPerBlock * Math.sqrt(c.rep / 50) * Math.pow(1 / r, k.cheapGrowth) * (sold > 0 ? 1 : 0.3);
      const churn = c.clients * k.churn * Math.pow(r, k.dearChurn) * (out > wanted * 0.2 ? 1.6 : 1);
      c.clients = Math.max(0, Math.min(c.clients + Math.min(add, Math.max(0, room - c.clients)) - churn, Math.max(room, c.clients * 0.9)));
      const target = U.clamp(50 + 40 * (1 - r) - (out > wanted * 0.2 ? k.outOfStockRep : 0), 5, 95);
      c.rep = U.clamp(c.rep + (target - c.rep) * k.repDrift, 0, 100);
    }
    c.last.ratio = r;
    // wages, upkeep, law costs
    const wages = U.sum(c.crew, (e) => e.wage); const pay = Math.min(wages, Math.max(0, c.dirty)); c.dirty -= pay;
    if (pay < wages - 1) { for (const e of c.crew) e.loyalty = U.clamp(e.loyalty - 20, 0, 100); const q = c.crew.filter(() => R.chance(0.25)); c.crew = c.crew.filter((e) => !q.includes(e)); CR.log(g, 'bad', `Couldn't pay the crew in full${q.length ? `: ${q.length} walked` : ''}`, 'Wages come out of street cash'); }
    const up = U.sum(c.gear, (x) => k.gear[x.type].upkeep || 0); c.dirty = Math.max(0, c.dirty - up);
    const lw = CR.lawyer(g).cost; if (lw) TG.F.spend(g, lw * g.world.priceIdx, 'Legal retainer');
    const bb = CR.bribeDef(g).cost; let bribed = true; if (bb) { if (c.dirty >= bb) c.dirty -= bb; else bribed = false; }
    // gear wear: vans wear with how busy they are; everything ages
    const runUtil = cap.run > 0 ? Math.min(1.5, sold > 0 ? workNeed * f / cap.run : 0) : 0;
    for (const it of c.gear) { const G = k.gear[it.type]; it.age++; it.wear = U.clamp(it.wear + 100 / G.life * (G.wear ? TG.WK.wearMult(it.type === 'van' ? runUtil : (c.last.cookUtil || 0)) : 1), 0, 100); if (it.wear >= 100 && !it.broken) { it.broken = true; CR.log(g, 'warn', `${G.label} wore out`, `Lasts about ${Math.round(G.life / 12)} years; busy use wears it faster`); } }
    // racket
    let rk = 0; if (active && c.racket && c.blocks > 0 && !J) { rk = c.blocks * k.racket.perBlock * (cap.guard >= c.blocks / 2 ? 1 : 0.5) * g.world.priceIdx; c.dirty += rk; c.stats.earned += rk; }
    // laundering
    let cleaned = 0;
    if (active && c.launder > 0 && c.dirty > 0) {
      const L = CR.launderCap(g); const want = Math.min(c.launder, c.dirty); let viaBiz = Math.min(want, L.total);
      const shady = Math.min(want - viaBiz, L.shady);
      const auditP = CR.auditOdds(g, viaBiz);
      c.dirty -= viaBiz + shady;
      const net = viaBiz * (1 - k.launderFee) + shady * (1 - k.shadyFee);
      if (net > 0) TG.F.earn(g, Math.round(net), 'Laundered income');
      cleaned = net; c.stats.laundered += net;
      for (const x of L.rows) if (L.total > 0) c.laund[x.b.id] = (c.laund[x.b.id] || 0) * 0.92 + viaBiz * x.cap / L.total;
      if (viaBiz > 0 && R.chance(auditP)) {
        const tot = U.sum(Object.values(c.laund), (x) => x); const fine = Math.round(tot * k.audit.fine);
        TG.F.spend(g, fine, 'Tax fraud fines'); c.heat = U.clamp(c.heat + 15, 0, 100);
        const top = L.rows.slice().sort((a, b2) => b2.cap - a.cap)[0];
        CR.log(g, 'bad', `Auditors found laundering: fine ${U.money(fine)}`, `${U.pct(auditP)} audit odds this month: you cleaned ${U.money(viaBiz)} of ${U.money(L.total)} capacity`, true);
        if (top && R.chance(k.audit.seize)) { CR.log(g, 'major', `${top.b.name} was seized by the state`, `${U.pct(k.audit.seize)} odds after a failed audit`, true); CR.seizeBiz(g, top.b); }
      }
    }
    // heat: sales, crew, turf, workshops, racket; decays slowly
    const shops = c.gear.filter((x) => x.type === 'workshop' && !x.broken).length;
    const gain = heatS + c.crew.length * k.crewHeat + c.blocks * k.blockHeat + shops * k.gear.workshop.heat + (rk ? c.blocks * k.racket.heat : 0);
    const cool = c.heat * k.heatDecay + k.heatFlat + cap.watch / 2 * k.lookoutCool + (J ? 2 : 0);
    const h0 = c.heat; c.heat = U.clamp(c.heat + gain - cool, 0, 100);
    // bad events
    const O = CR.odds(g); const P = {}; for (const o of O) P[o.id] = o.p; if (!bribed) P.scandal = 0;
    if (R.chance(P.raid)) CR.raid(g, `heat ${Math.round(c.heat)}`);
    if (R.chance(P.rob)) { const t = R.range(k.rob.take[0], k.rob.take[1]); const safe = c.gear.some((x) => x.type === 'safe') ? 0.6 : 1; const d = Math.round(c.dirty * t * safe); c.dirty -= d; let su = 0; for (const p in c.stock) { const q = Math.floor(c.stock[p] * t); c.stock[p] -= q; su += q; } CR.hurt(g, 1, 'robbery'); CR.log(g, 'bad', `Rivals robbed you: ${U.money(d)} and ${N(su)} units gone`, `${U.pct(P.rob)} odds: ${O.find((o) => o.id === 'rob').why}`, true); }
    if (c.crew.length && R.chance(P.snitch)) { const e = c.crew.slice().sort((a, b2) => a.loyalty - b2.loyalty)[0]; c.crew = c.crew.filter((x) => x !== e); c.heat = U.clamp(c.heat + 15, 0, 100); CR.log(g, 'bad', `${e.name} (loyalty ${Math.round(e.loyalty)}) snitched to the police`, `${U.pct(P.snitch)} odds: low loyalty and high heat`, true); if (R.chance(0.5)) CR.raid(g, 'a snitch', 0.15); }
    if (R.chance(P.war)) { const lost = c.blocks > 0 && R.chance(0.6) ? 1 : 0; c.blocks -= lost; c.clients = Math.min(c.clients, 60 + c.blocks * k.perBlock); c.heat = U.clamp(c.heat + 6, 0, 100); CR.hurt(g, 1, 'turf war'); CR.log(g, 'bad', `Turf war${lost ? ': lost a block' : ': held on'}`, `${U.pct(P.war)} odds`); }
    if (R.chance(P.bust)) { const w = c.gear.find((x) => x.type === 'workshop'); if (w) { c.gear = c.gear.filter((x) => x !== w); c.heat = U.clamp(c.heat + 20, 0, 100); CR.log(g, 'bad', 'A workshop burned down and police came', `${U.pct(P.bust)} odds`, true); if (R.chance(0.4)) CR.raid(g, 'the workshop', 0.1); } }
    if (R.chance(P.scandal)) { c.heat = U.clamp(c.heat + 20, 0, 100); c.bribe = 'none'; CR.log(g, 'bad', 'A bribed official talked. Bribes stopped, heat +20', `${U.pct(P.scandal)} odds`, true); }
    // crew loyalty and skill drift
    for (const e of c.crew) { const tgt = 55 + (e.wage / k.crew[e.role].wage - 1) * 60 + (c.rep - 50) / 4 - c.heat / 6 - (J ? 15 : 0); e.loyalty = U.clamp(e.loyalty + (tgt - e.loyalty) * 0.1 + R.normal(0, 2), 0, 100); e.skill = U.clamp(e.skill + 0.25, 1, 99); }
    // jobs being planned
    if (c.plan && !J) { if (c.plan.left > 0) { c.plan.months0 = (c.plan.months0 || 0) + 1; c.plan.left--; if (R.chance(K().heistPlan.leak)) { c.plan = null; c.heat = U.clamp(c.heat + 10, 0, 100); CR.log(g, 'bad', 'Word of your planned job leaked. Called off.', `${U.pct(K().heistPlan.leak)} leak odds per month of planning`); } else if (c.plan.left === 0) CR.runHeist(g); } }
    // This month / Next month rows
    row(c, '💵', 'Street sales', rev, '$', rev > 0 ? 'g' : 'y', `${N(sold)} of ${N(wanted)} units wanted. Held back by: ${c.last.limit}`);
    if (rk) row(c, '🛡️', 'Protection money', rk, '$', 'g', '');
    row(c, '👥', 'Crew wages', -wages, '$', 'y', '');
    if (up) row(c, '🏚️', 'Gear upkeep', -up, '$', 'y', '');
    if (bb) row(c, '💸', 'Bribes', -bb, '$', 'y', '');
    if (cleaned) row(c, '🧼', 'Laundered to clean cash', cleaned, '$', 'g', `Fee ${U.pct(k.launderFee)}; counts as business income and is taxed`);
    row(c, '🚨', 'Heat change', Math.round(c.heat - h0) || 0, '', c.heat > h0 ? 'r' : 'g', `+${gain.toFixed(1)} from sales, crew, turf; -${cool.toFixed(1)} cooling`);
    const nf = Math.min(1, Math.min(cap.deal, cap.run) / Math.max(1, workNeed));
    nrow(c, '🧲', 'Clients', c.clients, '/' + N(room), c.clients > room * 0.9 ? 'y' : 'g', 'More blocks hold more clients');
    nrow(c, '🛒', 'Expected sales', U.sum(Object.keys(k.products), (p) => Math.min(c.stock[p], dem[p] * nf) * CR.price(g, p)), '$', 'g', 'If your stock lasts');
    nrow(c, '👥', 'Wages due', -wages, '$', c.dirty < wages ? 'r' : 'y', c.dirty < wages ? 'Not enough street cash: crew will be angry' : '');
    nrow(c, '🚔', 'Raid odds', P.raid * 100, '%', P.raid > 0.08 ? 'r' : P.raid > 0.03 ? 'y' : 'g', '');
    c.hist.push({ m: g.month, rev: Math.round(rev), dirty: Math.round(c.dirty), heat: Math.round(c.heat), clients: Math.round(c.clients) }); if (c.hist.length > 60) c.hist.shift();
  };
  CR.raid = (g, why, extraArrest) => {
    const c = CR.ensure(g), k = K().raid; c.stats.raids++;
    const watch = CR.cover(g, 'watch'); const cam = c.gear.some((x) => x.type === 'cameras' && !x.broken) ? 0.15 : 0;
    const sh = R.range(k.stash[0], k.stash[1]) * (1 - 0.3 * watch - cam); let su = 0; for (const p in c.stock) { const q = Math.floor(c.stock[p] * sh); c.stock[p] -= q; su += q; }
    const safe = c.gear.some((x) => x.type === 'safe') ? 0.6 : 1; const d = Math.round(c.dirty * R.range(k.dirty[0], k.dirty[1]) * safe); c.dirty -= d; c.stats.seized += d;
    let gone = 0; for (let i = R.int(k.crew[0], k.crew[1]); i > 0 && c.crew.length; i--) { c.crew.splice(Math.floor(R.next() * c.crew.length), 1); gone++; }
    c.gear = c.gear.filter((x) => x.type !== 'workshop' || R.chance(0.5));
    const pYou = U.clamp((k.you + (extraArrest || 0)) * (1 - 0.4 * watch) * (c.gear.some((x) => x.type === 'phones' && !x.broken) ? 0.85 : 1) * (c.selfDeal ? 1.3 : 1), 0.03, 0.9);
    CR.log(g, 'bad', `Police raid (${why}): ${N(su)} units and ${U.money(d)} seized, ${gone} crew arrested`, `Raid odds come from heat. ${U.pct(pYou)} odds they get you too (lookouts, burner phones and not dealing yourself lower it)`, true);
    if (!CR.jailed(g) && R.chance(pYou)) CR.arrest(g, 'dealing');
  };
  // net worth share: dirty cash at face, stock at half wholesale, gear resale
  CR.value = (g) => { const c = g.crime; if (!c) return 0; return Math.max(0, c.dirty) * 0.6 + CR.stockValue(g) * 0.4 + U.sum(c.gear, (x) => CR.gearValue(g, x)); };
  TG.CR = CR;
})();

</script>
<script>/* js/ledger.js */
/* ledger.js - v7: where every dollar went, and WHO it belongs to.
   Every cash move (F.earn / F.spend) is recorded against an owner: a business ('b:id'), a rental property ('r:id'),
   a business building not in use ('p:id'), shared real estate costs ('rePort'), investments ('inv'), crime ('crime')
   or you personally ('you': income tax, personal loans, the credit line, CEO pay...).
   The monthly money report is built from this, so the lines always add up to your real cash change. */
(function () {
  const TG = globalThis.TG; const U = TG.U;
  const LG = {};
  // ---------- owners ----------
  LG.resolve = (g, key) => {
    if (key && key.slice(0, 2) === 'p:') { const p = g.properties.find((x) => x.id === key.slice(2)); if (p && p.bizId) return 'b:' + p.bizId; }
    return key || 'you';
  };
  LG.nameOf = (g, key) => {
    const id = key.slice(2);
    if (key.slice(0, 2) === 'b:') { const b = g.businesses.find((x) => x.id === id); if (b) return { n: b.name, i: TG.CONFIG.businesses[b.type].icon, grp: 'biz' }; return null; }
    if (key.slice(0, 2) === 'r:') { const h = (g.re.holdings || []).find((x) => x.id === id) || (g.re.listings || []).find((x) => x.id === id); if (h) return { n: h.name, i: TG.CONFIG.realEstate.kinds[h.kind].icon, grp: 're' }; return null; }
    if (key.slice(0, 2) === 'p:') { const p = g.properties.find((x) => x.id === id) || g.listings.find((x) => x.id === id); if (p) return { n: p.name || 'Building', i: '🏢', grp: 'prop' }; return null; }
    if (key === 'rePort') return { n: 'All rentals (shared costs)', i: '🏘️', grp: 're' };
    if (key === 'inv') return { n: 'Investments & bets', i: '📈', grp: 'inv' };
    if (key === 'crime') return { n: 'Crime', i: '🕶️', grp: 'crime' };
    return { n: 'You (personal & company costs)', i: '👤', grp: 'you' };
  };
  LG.setName = (g, key, nm) => { const a = g.acc || (g.acc = TG.F.newAcc()); a.names = a.names || {}; a.names[key] = nm; };
  // who owns a loan's payments
  LG.loanOwner = (g, l) => {
    if (l.bizId && g.businesses.some((b) => b.id === l.bizId)) return 'b:' + l.bizId;
    const c = l.collateral;
    if (c && c.kind === 'property') {
      if ((g.re.holdings || []).some((h) => h.id === c.id)) return 'r:' + c.id;
      const p = g.properties.find((x) => x.id === c.id); if (p) return LG.resolve(g, 'p:' + p.id);
    }
    if (c && c.kind === 'equip') { const b = g.businesses.find((x) => x.equip.some((e) => e.id === c.id)); if (b) return 'b:' + b.id; }
    return 'you';
  };
  // record one cash move (delta > 0 = money in)
  LG.rec = (g, delta, label, bizId) => {
    if (!delta || !Number.isFinite(delta)) return;
    const a = g.acc; if (!a) return; a.led = a.led || {}; a.names = a.names || {};
    const k = LG.resolve(g, bizId ? 'b:' + bizId : g._own);
    const o = a.led[k] || (a.led[k] = { i: {}, o: {} });
    if (delta > 0) o.i[label] = (o.i[label] || 0) + delta; else o.o[label] = (o.o[label] || 0) - delta;
    if (!a.names[k]) { const nm = LG.nameOf(g, k); if (nm) a.names[k] = nm; }
  };
  LG.within = (g, key, fn) => { const prev = g._own; g._own = key; try { return fn(); } finally { g._own = prev; } };
  LG.net = (led) => { let t = 0; for (const k in led || {}) { for (const l in led[k].i) t += led[k].i[l]; for (const l in led[k].o) t -= led[k].o[l]; } return t; };
  // run a module's functions "on behalf of" an owner, so the money they move lands on the right line
  const wrap = (obj, keyFn) => {
    for (const name of Object.keys(obj)) {
      const f = obj[name]; if (typeof f !== 'function' || f.__lg) continue;
      const w = function (g, a1) {
        if (!g || typeof g !== 'object' || !Array.isArray(g.businesses)) return f.apply(this, arguments);
        const key = keyFn(name, g, a1); if (!key) return f.apply(this, arguments);
        const prev = g._own; g._own = key; try { return f.apply(this, arguments); } finally { g._own = prev; }
      };
      w.__lg = true; obj[name] = w;
    }
  };
  const idOf = (x) => (typeof x === 'string' ? x : x && typeof x === 'object' && typeof x.id === 'string' ? x.id : null);
  LG.install = () => {
    if (TG.RE) wrap(TG.RE, (n, g, a) => { if (n === 'month') return 'rePort'; const id = idOf(a); return id ? 'r:' + id : null; });
    if (TG.I) wrap(TG.I, () => 'inv');
    if (TG.CR) wrap(TG.CR, () => 'crime');
    if (TG.P) wrap(TG.P, (n, g, a) => { const id = idOf(a); return id && (g.properties.some((p) => p.id === id) || g.listings.some((p) => p.id === id)) ? LG.resolve(g, 'p:' + id) : null; });
  };

  // ---------- categories (Thomas's layout: money in first, then expense groups with subtotals) ----------
  LG.IN = [
    ['sales', '🛒', 'Sales'], ['rent', '🔑', 'Rent from tenants'], ['inv', '📈', 'Investments'],
    ['borrow', '🏦', 'Borrowed money (loans, credit line, investors)'], ['sold', '🏷️', 'Things you sold (machines, buildings, businesses)'], ['other', '✨', 'Other money in'],
  ];
  LG.OUT = [
    ['loans', '🏦', 'Loans'], ['property', '🏠', 'Property'], ['wages', '👥', 'Wages'], ['product', '📦', 'Cost of product'],
    ['equip', '🛠️', 'Equipment'], ['buy', '🏗️', 'Buying property & businesses'], ['tax', '🧾', 'Taxes'], ['inv', '📈', 'Investing & bets'], ['other', '📎', 'Other'],
  ];
  const T = (re) => (l) => re.test(l);
  const IN_RULES = [
    ['rent', T(/^Rent$/)],
    ['borrow', T(/Loan proceeds|Credit line draw|Refinance cash-out|Investor funding|IPO proceeds|Fund raise/)],
    ['inv', T(/Trading gains|Gambling winnings|Investments sold|Angel exits|Angel stakes sold/)],
    ['sold', T(/Asset sales|Business sales|Fire-sale|Property sales|Real estate sales|Repossession surplus|Lease deposits returned|Buy-out payment/)],
    ['sales', T(/Revenue|sales|Subscriptions|Royalties|Franchise fees|Freight/i)],
  ];
  const OUT_RULES = [
    ['loans', T(/Loan|Credit line|Margin|Refinance fees|Late fees/)],
    ['tax', T(/Income tax|Tax audit/)],
    ['property', T(/Real estate (property tax|upkeep|insurance|repairs)|Tenant|Disaster damage|Evictions|Property manager|Handyman|Unit turnover|^Rent|Property tax|Building upkeep|Code violation/)],
    ['wages', T(/Wages|Payroll tax|Bonuses|Severance|Training|Seasonal labor|CEO salary|CEO profit share|Background checks|HR /)],
    ['product', T(/Supplies|cost of sales|Raw materials|Feed|Seed|Inventory orders|Fuel|Materials|Spray|Planting|Orchard care|Livestock|Hosting|Shipping|Storage$|Spoiled|Tolls/)],
    ['equip', T(/Equipment|Repairs|Maintenance|Inspections|Storage construction/)],
    ['buy', T(/Business setup|Property purchases|Real estate purchases|Land purchases|Land conversion|Renovations|Permits|Development|Lease deposits|Share buy-back|Pivot/)],
    ['inv', T(/Investments bought|Angel investments|Trading|Gambling|Cash moved to the street/)],
  ];
  LG.catIn = (l) => { for (const [c, f] of IN_RULES) if (f(l)) return c; return 'other'; };
  LG.catOut = (l) => { for (const [c, f] of OUT_RULES) if (f(l)) return c; return 'other'; };
  // friendlier names for a few lines that are capital, not running costs
  LG.NOTE = { 'Loan principal': 'paid down what you owe', 'Loan payoff': 'paid off early', 'Loan prepayment': 'extra payment', 'Credit line repayment': 'paid down the line', 'Loan proceeds': 'borrowed', 'Credit line draw': 'borrowed on the line', 'Equipment purchases': 'new machines', 'Property purchases': 'down payment / price', 'Real estate purchases': 'down payment / price' };

  // build the report from a ledger: totals by group, by owner, and the bottom line
  LG.summary = (g, led, names, cashStart, cashEnd) => {
    names = names || {};
    const inG = {}, outG = {}; for (const [k] of LG.IN) inG[k] = { t: 0, lines: {} }; for (const [k] of LG.OUT) outG[k] = { t: 0, lines: {} };
    const owners = []; let tin = 0, tout = 0;
    for (const k in led || {}) {
      const L = led[k]; let oi = 0, oo = 0; const og = {};
      for (const l in L.i) { const v = L.i[l]; const c = LG.catIn(l); inG[c].t += v; inG[c].lines[l] = (inG[c].lines[l] || 0) + v; oi += v; og['+' + c] = (og['+' + c] || 0) + v; }
      for (const l in L.o) { const v = L.o[l]; const c = LG.catOut(l); outG[c].t += v; outG[c].lines[l] = (outG[c].lines[l] || 0) + v; oo += v; og['-' + c] = (og['-' + c] || 0) + v; }
      tin += oi; tout += oo;
      const nm = names[k] || LG.nameOf(g, k) || { n: k.slice(0, 2) === 'b:' ? 'Closed business' : k.slice(0, 2) === 'r:' ? 'Sold property' : 'Other', i: '•', grp: k.slice(0, 2) === 'b:' ? 'biz' : k.slice(0, 2) === 'r:' ? 're' : 'you' };
      const borrowed = og['+borrow'] || 0;
      owners.push({ k, n: nm.n, i: nm.i, grp: nm.grp, in: oi, out: oo, net: oi - oo, borrowed, groups: og, lines: L });
    }
    owners.sort((a, b) => (LG.GRP_ORDER.indexOf(a.grp) - LG.GRP_ORDER.indexOf(b.grp)) || b.net - a.net);
    const net = tin - tout;
    return { inG, outG, tin, tout, net, owners, cashStart, cashEnd, diff: cashEnd - cashStart - net };
  };
  LG.GRP_ORDER = ['biz', 'prop', 're', 'inv', 'crime', 'you'];
  // add one month's ledger into a running total (skips)
  LG.add = (into, led) => { for (const k in led || {}) { const t = into[k] || (into[k] = { i: {}, o: {} }); for (const l in led[k].i) t.i[l] = (t.i[l] || 0) + led[k].i[l]; for (const l in led[k].o) t.o[l] = (t.o[l] || 0) + led[k].o[l]; } return into; };
  LG.ownerNets = (led) => { const o = {}; for (const k in led || {}) { let t = 0; for (const l in led[k].i) t += led[k].i[l]; for (const l in led[k].o) t -= led[k].o[l]; o[k] = Math.round(t); } return o; };
  TG.LG = LG;
  LG.install(); // loaded after realestate / invest / crime / property
})();

</script>
<script>/* js/engine.js */
/* engine.js - game creation, the monthly turn, time skip, reports, achievements, leaderboard, save/load. */
(function () {
  const TG = globalThis.TG; const R = TG.R, U = TG.U;
  const VERSION = 7;
  TG.VERSION = VERSION;

  // ================= REPORT HELPERS =================
  const rep = {};
  rep.newBuf = (m) => ({ month: m, events: [], staff: [], decisions: [], news: [], warns: [] });
  const buf = (g) => (g.cur = g.cur || rep.newBuf(g.month));

      return IDB.open().then((db) => new Promise((res) => { if (!db) return res(false);
        try { const tx = db.transaction('saves', 'readwrite'); tx.objectStore('saves').put(v, k);
          tx.oncomplete = () => res(true); tx.onerror = () => res(false); tx.onabort = () => res(false);
        } catch (e) { res(false); } })); },
    get(k) { return IDB.open().then((db) => new Promise((res) => { if (!db) return res(null);
        try { const rq = db.transaction('saves', 'readonly').objectStore('saves').get(k);
          rq.onsuccess = () => res(rq.result == null ? null : rq.result); rq.onerror = () => res(null);
        } catch (e) { res(null); } })); },
    del(k) { return IDB.open().then((db) => { if (!db) return;
      return IDB.put(k, null); }); },
  };
  TG.IDB = IDB;
  E.save = (g) => {
    let txt; try { g.savedAt = Date.now(); txt = E.serialize(g); } catch (e) { E.saveState = { ok: false, at: Date.now(), where: '', err: 'could not package the game' }; return false; }
    const lsOk = E.saveText(txt); const st = { ok: lsOk, at: Date.now(), where: lsOk ? 'device' : 'memory only', err: lsOk ? '' : 'browser storage blocked or full' }; E.saveState = st;
    E.saveIdb(txt, st);
    if (E.onSaved) E.onSaved(st); return lsOk; };
  E.loadAsync = () => IDB.get(SAVE_KEY).then((s2) => { let a = null, b = null; const s1 = store.get(SAVE_KEY);
    try { if (s1) a = E.deserialize(s1); } catch (e) { a = null; } try { if (s2) b = E.deserialize(s2); } catch (e) { b = null; }
    const g = a && b ? ((b.savedAt || 0) > (a.savedAt || 0) ? b : a) : a || b; if (g) TG.G = g; return g; });
  E.saveIdb = (txt, st) => IDB.put(SAVE_KEY, txt).then((ok) => {
    if (ok && !st.ok) { st.ok = true; st.where = 'device (database)'; st.err = ''; } if (E.onSaved) E.onSaved(st); return ok; });
  E.load = () => { const s = store.get(SAVE_KEY); if (!s) return null; try { const g = E.deserialize(s); TG.G = g; return g; } catch (e) { return null; } };
  E.clearSave = () => store.del(SAVE_KEY);
  const b64e = (s) => (typeof btoa === 'function' ? btoa(unescape(encodeURIComponent(s))) : Buffer.from(s, 'utf8').toString('base64'));
  const b64d = (s) => (typeof atob === 'function' ? decodeURIComponent(escape(atob(s))) : Buffer.from(s, 'base64').toString('utf8'));
  E.exportCode = (g) => 'TYC1:' + b64e(E.serialize(g));
  E.importCode = (code) => {
    code = String(code || '').trim(); if (code.startsWith('TYC1:')) code = code.slice(5);
    let s; try { s = b64d(code); } catch (e) { throw new Error('That code is not valid'); }
    const g = E.deserialize(s); TG.G = g; return g;
  };

  // ================= LOCAL LEADERBOARD =================
  const LB = {};
  const LB_KEY = 'tycoon_leaderboard_v1';
  LB.all = () => { try { return JSON.parse(store.get(LB_KEY) || '[]'); } catch (e) { return []; } };
  LB.record = (g) => {
    if (g.month % 6 !== 0 && !Object.keys(g.stats.reached).length) return;
    const list = LB.all(); let e = list.find((x) => x.id === g.gameId);
    if (!e) { e = { id: g.gameId, name: g.player.name, scenario: g.scenario }; list.push(e); }
    Object.assign(e, { peak: Math.round(g.stats.peakNW), nw: Math.round(g.lastNW), months: g.month, bankruptcies: g.player.bankruptcies, reached: g.stats.reached, when: Date.now() });
    list.sort((a, c) => c.peak - a.peak); store.set(LB_KEY, JSON.stringify(list.slice(0, 30)));
  };
  TG.LB = LB;
  TG.Game = E;
})();
