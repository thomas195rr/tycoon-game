      } finally { g._own = prevOwn; }
    }
  };

  // ---------- receivables ----------
  B.addRecv = (g, b, amt, delay, label) => { if (amt > 0) b.recv.push({ amt: Math.round(amt), due: g.month + delay, label: label || 'Invoices' }); };
  B.collect = (g, b) => {
    const d = B.def(b); const bad = ((d.receivable && d.receivable.badDebt) || 0) * ((b.fixesOn && b.fixesOn.badDebtMult) || 1);
    const keep = [];
    for (const r of b.recv) {
      if (r.due > g.month) { keep.push(r); continue; }
      if (R.chance(bad)) { TG.rep.event(g, b, 'bad', `A client never paid ${U.money(r.amt)}`, `${U.pct(bad, 0)} chance per invoice of bad debt`); continue; }
      TG.F.earn(g, r.amt, 'Revenue', b.id);
    }
    b.recv = keep;
  };

  // ---------- marketing ----------
  B.adBoost = (g, b) => {
    const C = TG.CONFIG.reputation; const a = b.ads; if (!a || !(a.budget > 0)) return { boost: 0 };
    const ch = C.adChannels[a.channel] || C.adChannels.social;
    const mgr = b.spec && b.spec.ads;
    let eff = (a.budget / ch.costPer) * ch.eff * (mgr ? 1 + mgr.skill / 150 : 1);
    const ref = Math.max(500, B.baseRev(g, b) * C.adBoostScale);
    let boost = C.adMaxBoost * (1 - Math.exp(-eff / ref));
    if (b.rep < 30) boost /= C.lowRepAdPenalty;
    const flop = R.chance(ch.flop * (mgr ? 0.5 : 1));
    if (flop) boost *= 0.15;
    return { boost, flop };
  };

  // ---------- fixed costs ----------
  B.fixedCosts = (g, b, ctx) => {
    const C = TG.CONFIG, d = B.def(b);
    const payroll = TG.S.payroll(b) * (1 + ((b.fixesOn && b.fixesOn.payrollAdd) || 0));
    if (g.cash < payroll && g.cash - payroll < -(TG.F.locLimit(g) - g.loc.balance)) ctx.missedPayroll = true;
    TG.F.spend(g, Math.round(payroll), 'Wages', b.id);
    TG.F.spend(g, Math.round(payroll * C.staff.payrollTax), 'Payroll tax', b.id);
    const prop = g.properties.find((p) => p.id === b.propId);
    if (prop) {
      b.propValue = prop.owned ? TG.P.value(g, prop) : 0;
      if (prop.leased) TG.F.spend(g, prop.rent, 'Rent', b.id);
      else TG.F.spend(g, TG.P.monthlyTax(g, prop), 'Property tax', b.id);
      const upkeep = Math.round(b.propValue * 0.0006 * (1.6 - prop.cond));
      if (upkeep) TG.F.spend(g, upkeep, 'Building upkeep', b.id);
    }
    const util = Math.round((d.svc ? d.svc.utilPerSpace : d.space.unit === 'acres' ? 1.5 : 0.3) * Math.min(B.space(b), d.space.ideal * 4) * g.world.priceIdx);
    TG.F.spend(g, util, 'Utilities', b.id);
    let ins = 0; for (const t in b.ins) if (b.ins[t]) ins += TG.F.premium(g, b, t);
    TG.F.spend(g, ins, 'Insurance', b.id);
    b.insHike = Math.max(1, (b.insHike || 1) - C.finance.insHikeDecay);
    TG.F.spend(g, B.fixMonthly(g, b), 'Risk reducers & upgrades', b.id);
    if (b.ads && b.ads.budget > 0) TG.F.spend(g, Math.round(b.ads.budget), 'Advertising', b.id);
    const n = TG.S.allStaff(b).length;
    if (n > C.staff.overheadPerStaffAbove) TG.F.spend(g, Math.round((n - C.staff.overheadPerStaffAbove) * C.staff.overheadPerStaff * g.world.priceIdx), 'Bureaucracy & compliance', b.id);
  };

  // ---------- reputation ----------
  B.repMonth = (g, b, ctx) => {
    const C = TG.CONFIG.reputation, d = B.def(b);
    let target = ctx.quality + (TG.PR.hasPrice(b) && TG.PR.good(b) && TG.PR.good(b).kind === 'service' ? TG.PR.fair(TG.PR.ratio(g, b)) : 0) + ((b.fixesOn && b.fixesOn.repTarget) || 0);
    if (ctx.util > 1.0) target -= 5; // turning customers away
    target = U.clamp(target, 0, 100);
    const rate = (d.svc && d.svc.repRate) || C.upRate;
    if (target > b.rep) b.rep = Math.min(target, b.rep + Math.min(rate, (target - b.rep) * 0.12));
    else b.rep = Math.max(target, b.rep - (b.rep - target) * 0.08);
    b.rep = U.clamp(b.rep + R.normal(0, 0.4), 0, 100);
    if (R.chance(C.viralBad * (b.rep < 40 ? 2 : 1))) { const x = R.range(6, 14); b.rep = U.clamp(b.rep - x, 0, 100); TG.rep.event(g, b, 'bad', `A bad review went viral (reputation -${Math.round(x)})`, `Rare event; ${b.rep < 40 ? 'weak reputation makes it more likely' : 'bad luck'}`); }
  };
  B.goodEvents = (g, b, ctx) => {
    const C = TG.CONFIG, d = B.def(b);
    for (const id of d.goodEvents || []) {
      const ev = C.goodEvents[id]; if (!ev) continue;
      if (id === 'bumper') continue;
      if (!R.chance(ev.p * (0.6 + b.rep / 100))) continue;
      const bits = [];
      if (ev.rep) { const x = R.range(ev.rep[0], ev.rep[1]); b.rep = U.clamp(b.rep + x, 0, 100); bits.push(`reputation +${Math.round(x)}`); }
      if (ev.boost) { const x = R.range(ev.boost[0], ev.boost[1]); b.boost = { mult: x, months: 1 }; bits.push(`demand x${x.toFixed(2)} next month`); }
      if (ev.cashRev) { const x = Math.round(ctx.revAvg * R.range(ev.cashRev[0], ev.cashRev[1])); TG.F.earn(g, x, 'Lucky breaks', b.id); bits.push(`+${U.money(x)}`); }
      TG.rep.event(g, b, 'good', ev.label + (bits.length ? ` (${bits.join(', ')})` : ''), `Lucky break (${U.pct(ev.p, 1)} base chance, higher with good reputation)`);
    }
  };

  // demand multiplier shared by models
  B.demandMult = (g, b, ctx, opts) => {
    const d = B.def(b); opts = opts || {};
    const moy = U.moy(g.month);
    let season = d.season[moy];
    const fo = b.fixesOn || {};
    if (fo.seasonDamp) season = 1 + (season - 1) * (1 - fo.seasonDamp);
    if (fo.seasonFloor) season = Math.max(season, fo.seasonFloor);
    let m = season * TG.W.econMult(g, d.econSens) * TG.IN.demand(g, d.ind) * TG.CONFIG.regions[b.region].demand;
    for (const h of b.hits) m *= h.mult;
    if (b.boost) m *= b.boost.mult;
    if (b.sab && b.sab.until > g.month) m *= b.sab.mult;
    m *= 1 + TG.S.perk(b, 'demand');
    const ad = opts.noAds ? { boost: 0 } : B.adBoost(g, b); if (!opts.noAds) { ctx.adFlop = ad.flop; ctx.adBoost = ad.boost; }
    m *= 1 + ad.boost + (fo.demand || 0);
    m *= 1 - (d.weatherSens || 0) * ctx.weather.sev * 0.35;
    m *= 1 + TG.E.boost(b, 'demandBoost');
    return m;
  };

  // ---------- monthly orchestration ----------
  B.month = (g, b) => {
    // v6: money you spent on this business between months (supplies, feed, seed, repairs) counts in this month's results
    b.m = b.m && b.m.carry ? { rev: b.m.rev, cost: b.m.cost, lines: b.m.lines } : { rev: 0, cost: 0, lines: {} };
    B.fixAgg(b);
    const ctx = B.ctx(g, b);
    // license pending (clinic): costs run, no revenue
    if (b.licensePending > 0) {
      b.licensePending--;
      TG.E.month(g, b, ctx); TG.S.month(g, b, ctx); B.fixedCosts(g, b, ctx);
      if (b.licensePending === 0) TG.rep.event(g, b, 'good', `${b.name} received its license and opened`, 'Licensing period complete');
      B.endMonth(g, b, ctx); return ctx;
    }
    if (B.owner(g, b)) g.player.exp[b.type] = (g.player.exp[b.type] || 0) + 1;
    TG.E.month(g, b, ctx);
    B.rollRisks(g, b, ctx);
    TG.M.month(g, b, ctx);
    B.shutCheck(g, b, ctx);
    B.fixedCosts(g, b, ctx);
    TG.S.month(g, b, ctx);
    B.shutStaff(g, b, ctx);
    B.repMonth(g, b, ctx);
    B.goodEvents(g, b, ctx);
    if (ctx.adFlop) TG.rep.event(g, b, 'bad', 'Ad campaign flopped this month', `${TG.CONFIG.reputation.adChannels[b.ads.channel].label} campaigns flop ${U.pct(TG.CONFIG.reputation.adChannels[b.ads.channel].flop)} of the time${b.spec.ads ? '' : '; no ads manager'}`);
    B.endMonth(g, b, ctx);
    return ctx;
  };
  // ---------- v7: no supplies = the doors stay shut ----------
  // Without a manager, staff never buy supplies or run the shop for you. If nobody bought any, there is nothing to sell:
  // the business is CLOSED (no sales) but wages, rent and bills keep coming. Idle staff may quit or stick around.
  B.shutCheck = (g, b, ctx) => {
    const st = b.stock; if (!TG.ST.def(b) || !st) { b.shut = 0; ctx.closed = null; return; }
    const empty = (st.qty || 0) < 1 && (st.usedM || 0) < 0.5 && (st.inM || 0) < 0.5;
    const wanted = (ctx.demand || 0) > 0.5 && !b.licensePending; // off-season with no customers is not 'closed'
    if (empty && wanted) {
      const h = TG.D.handler(g, b, 'stock'); const mgrTried = !!(h && st.auto);
      b.shut = (b.shut || 0) + 1; ctx.closed = mgrTried ? 'nocash' : 'nomgr';
      ctx.note = mgrTried ? `Closed: no supplies (${st.short === 'room' ? 'no storage room' : 'not enough cash'} for your manager to buy any)` : 'Closed: no supplies, no manager';
      ctx.served = 0; ctx.busy = 0;
      b.rep = U.clamp(b.rep - 1.5, 0, 100); // customers find the doors shut
      if (b.shut === 1) TG.rep.event(g, b, 'major', `${b.name} is CLOSED: no supplies`, mgrTried ? 'Your manager could not buy supplies.' : 'No manager buys supplies for you and you did not buy any. Nothing to sell, but wages and bills still run. Buy supplies (Now tab) or hire a manager.', { major: 'cash' });
    } else { b.shut = 0; ctx.closed = null; }
  };
  // idle staff while closed: each closed month the odds they walk out rise, more if unhappy; the rest stay (and get paid)
  B.shutQuitP = (b, e) => U.clamp(0.05 * (b.shut || 0) + (e.morale < 50 ? (50 - e.morale) / 200 : 0), 0, 0.6);
  B.shutStaff = (g, b, ctx) => {
    if (!ctx.closed) return;
    for (const e of b.staff.slice()) {
      e.morale = U.clamp(e.morale - 5, 0, 100);
      const p = B.shutQuitP(b, e);
      if (R.chance(p)) TG.S.leave(g, b, e, `the shop has been closed ${b.shut} month${b.shut > 1 ? 's' : ''} with nothing to do (${U.pct(p)} chance)`, true);
    }
  };
  // ---------- next-month forecast: known costs exactly, the rest from recent months and the season ----------
  B.forecast = (g, b) => {
    const C = TG.CONFIG, d = B.def(b); const H = b.hist; if (!H.length) return null;
    const nm = U.moy(g.month + 1); const last3 = H.slice(-3);
    const seasNow = U.avg(last3, (h) => d.season[U.moy(h.m)] || 1) || 1; const seasF = (d.season[nm] || 1) / seasNow;
    const yr = H.length >= 13 ? H[H.length - 12] : null; // same month last year (for harvests and seasonal swings)
    const trend = yr ? U.clamp(b.revAvg / Math.max(1, U.avg(H.slice(-15, -12), (h) => h.rev) || b.revAvg), 0.5, 2) : 1;
    const lines = {}; const why = {};
    const keys = new Set(); for (const h of last3.concat(yr ? [yr] : [])) for (const k in h.lines) keys.add(k);
    for (const k of keys) {
      const avg = U.avg(last3, (h) => h.lines[k] || 0);
      if (avg > 0 || (yr && (yr.lines[k] || 0) > 0)) { // money in: sales follow the season
        if (yr && (b.farm || Math.abs(seasF - 1) > 0.15)) { lines[k] = (yr.lines[k] || 0) * trend; why[k] = 'Same month last year, adjusted for how you are doing now'; }
        else { lines[k] = avg * seasF; why[k] = `Average of the last ${last3.length} months x season (${seasF.toFixed(2)})`; }
      } else { lines[k] = avg; why[k] = `Average of the last ${last3.length} months`; }
    }
    const rr = (lines.Revenue || 0) && U.avg(last3, (h) => h.lines.Revenue || 0) ? lines.Revenue / U.avg(last3, (h) => h.lines.Revenue || 0) : 1;
    for (const k of Object.keys(lines)) if (/Supplies|cost of sales|Cost of goods|Fuel|Feed/.test(k)) { lines[k] *= rr; why[k] = 'Moves with expected sales'; }
    // known amounts
    const pay = TG.S.payroll(b) * (1 + ((b.fixesOn && b.fixesOn.payrollAdd) || 0)); lines.Wages = -pay; why.Wages = 'Everyone on staff now';
    lines['Payroll tax'] = -pay * C.staff.payrollTax; why['Payroll tax'] = `${U.pct(C.staff.payrollTax)} of wages`;
    const prop = g.properties.find((p) => p.id === b.propId);
    if (prop) { if (prop.leased) { lines.Rent = -prop.rent; why.Rent = 'Your lease'; } else { lines['Property tax'] = -TG.P.monthlyTax(g, prop); why['Property tax'] = 'Set by the property value'; } }
    if (b.ads && b.ads.budget) { lines.Advertising = -b.ads.budget; why.Advertising = 'Your ad budget'; }
    const lease = U.sum(b.equip.filter((x) => x.leased), (x) => x.leasePay || 0); if (lease) { lines['Equipment lease'] = -lease; why['Equipment lease'] = 'Lease payments'; }
    for (const k in lines) if (Math.abs(lines[k]) < 1) delete lines[k];
    const loans = U.sum(g.loans.filter((l) => l.bizId === b.id || (prop && l.id === prop.mortgageId)), (l) => l.payment || 0);
    const profit = U.sum(Object.values(lines), (x) => x);
    return { m: g.month + 1, lines, why, profit, loans };
  };
  // ---------- unfinished work: people call out or slack off; with no spare staff some work is left undone ----------
  // Each worker has a chance each month to be out part of the month (more if unreliable or unhappy). Spare capacity covers it.
  // Work left undone piles up as a backlog that raises the odds of every disaster (and breakdowns) until it is caught up.
  B.calloutP = (e) => TG.CONFIG.staff.calloutBase * (1.6 - (e.reliability == null ? 75 : e.reliability) / 100) * (e.morale < 40 ? 1.5 : 1);
  B.unfinished = (g, b, ctx) => {
    let worst = 0;
    for (const w of b.work || []) {
      if (w.kind !== 'staff' || !(w.load > 0) || w.cap == null) continue;
      const ppl = w.role ? b.staff.filter((e) => e.role === w.role) : ctx.key;
      const per = w.cap / Math.max(1, ppl.length); let lost = 0, out = 0;
      for (const e of ppl) if (R.chance(B.calloutP(e))) { lost += per * R.range(0.2, 0.5); out++; }
      const capReal = w.cap * 1.04 - lost; // cap already allows for the average no-show (~4%)
      const uf = U.clamp((w.load - capReal) / w.load, 0, 1);

    if (b.backlog < 0.005) b.backlog = 0;
    if (worst > 0.05) TG.rep.event(g, b, 'bad', `${U.pct(worst)} of the work was left undone`, `People called out or slacked and nobody was spare to cover. Disaster odds are x${B.backlogMult(b).toFixed(2)} until it is caught up. Spare staff (Staff tab) prevent this.`);
  };
  B.backlogMult = (b) => Math.min(TG.CONFIG.staff.backlogMax || 2.5, 1 + (TG.CONFIG.staff.backlogK || 3) * (b.backlog || 0));
  B.endMonth = (g, b, ctx) => {
    B.collect(g, b);
    if (TG.E.hasMech(b)) { const nm = TG.E.mechs(b).length; TG.WK.add(ctx, 'staff', '🔧', 'Mechanics', nm, TG.E.mechCap(b), TG.E.machines(b), 'machines', [], `Each mechanic looks after about ${TG.CONFIG.mechanic.per} machines (more if skilled). Machines over that get no care.`, 'mech'); }
    TG.FL.commit(g, b); TG.WK.commit(b, ctx);
    B.unfinished(g, b, ctx);
    b.hits = b.hits.filter((h) => --h.months > 0);
    if (b.boost && --b.boost.months <= 0) b.boost = null;
    b.qHits = b.qHits.filter((h) => --h.months > 0);
    b.lastUtil = ctx.util == null ? b.lastUtil : ctx.util;
    const profit = b.m.rev - b.m.cost;
    // investor dividends
    if (b.outside > 0 && profit > 0) { const div = Math.round(profit * b.outside); TG.F.spend(g, div, 'Investor dividends', b.id); }
    const pr = b.m.rev - b.m.cost;
    b.hist.push({ m: g.month, rev: Math.round(b.m.rev), cost: Math.round(b.m.cost), profit: Math.round(pr), rep: Math.round(b.rep), util: ctx.util || 0, lines: b.m.lines });
    b.m = { rev: 0, cost: 0, lines: {}, carry: true };
    if (b.hist.length > TG.CONFIG.maxHistory) b.hist.shift();
    const last3 = b.hist.slice(-3);
    b.revAvg = U.avg(last3, (x) => x.rev);
    b.fcPrev = b.fc || null; b.fc = B.forecast(g, b); // forecast for next month; last month's kept to compare with what happened
    b.lastCtx = { quality: Math.round(ctx.quality), skill: Math.round(ctx.skill), morale: Math.round(ctx.morale), cap: ctx.cap, served: ctx.served, demand: ctx.demand, down: ctx.down, adBoost: ctx.adBoost || 0, note: ctx.note || '', closed: ctx.closed || null, shut: b.shut || 0, limit: ctx.limit || null, limitEquip: ctx.limitEquip || null, links: ctx.links || null, limitNow: ctx.limitNow || null, priceR: ctx.priceR || 1 };
    for (const w of ctx.warnings) TG.rep.warn(g, b, w.text, w.why, w.p);
    // takeover by investors
    const C = TG.CONFIG.finance;
    if (b.outside > C.takeoverOutside) {
      const p12 = U.sum(b.hist.slice(-12), (x) => x.profit);
      const red = b.fixes.terms ? 0.3 : 1;
      if (p12 < 0 && R.chance(C.takeoverChance * red * (b.type === 'tech' ? 1.5 : 1))) {
        const payout = Math.round(TG.F.bizValue(g, b) * (1 - b.outside) * 0.5);
        TG.rep.event(g, b, 'major', `Investors took control of ${b.name} and pushed you out`, `Outside owners hold ${U.pct(b.outside)} and the last 12 months lost money. You were bought out for ${U.money(payout)}.`, { major: 'keyQuit' });
        B.close(g, b, 'investor takeover', false, true);
        TG.F.earn(g, payout, 'Buy-out payment', null, true);
      }
    }
  };

  B.topRisks = (g, b) => {
    const d = B.def(b); const ctx = B.ctx(g, b); const out = [];
    for (const r of d.risks) { if (!r.base) continue; const { p, parts } = B.riskP(g, b, ctx, r); out.push({ label: r.label, p, why: parts.join(', ') }); }
    for (const it of b.equip) if (!it.broken) { const bc = TG.E.breakChance(g, b, it); out.push({ label: `${it.label} #${TG.E.num(b, it)} breaks down`, p: bc.p, why: bc.factors.join(', ') }); }
    for (const x of TG.M.extraRisks(g, b, ctx)) out.push(x);
    return out.sort((a, c) => c.p - a.p);
  };

  B.inventoryValue = (g, b) => TG.M.inventoryValue(g, b);

  B.close = (g, b, why, forced, keepProp) => {
    const fs = forced ? TG.CONFIG.finance.bankruptcy.fireSale : 1;
    for (const it of b.equip) { const v = Math.round(TG.E.resale(g, b, it) * fs); if (v && !forced) TG.F.earn(g, v, 'Asset sales', b.id, true); else if (v && forced) TG.F.earn(g, v, 'Fire-sale proceeds', b.id, true); }
    b.equip = [];
    const prop = g.properties.find((p) => p.id === b.propId); if (prop) prop.bizId = null;
    g.businesses = g.businesses.filter((x) => x !== b);
    g.decisions = g.decisions.filter((d) => d.bizId !== b.id);
    if (g.player.ownerBiz === b.id) g.player.ownerBiz = null;
    for (const ls of g.lawsuits) if (ls.bizId === b.id) ls.bizId = null;
    TG.rep.event(g, null, forced ? 'major' : 'info', `${b.name} closed`, why);
  };
  // Sell a business (with its property if owned). mult < 1 for fire sales.
  B.saleValue = (g, b) => {
    const prop = g.properties.find((p) => p.id === b.propId);
    return Math.round(TG.F.bizValue(g, b) * (1 - (b.outside || 0)) + (prop && prop.owned ? TG.P.value(g, prop) * (1 - TG.CONFIG.property.sellCostPct) : 0));
  };
  B.sell = (g, bizId, mult, forced) => {
    const b = B.get(g, bizId); if (!b) return 0;
    const prop = g.properties.find((p) => p.id === b.propId);
    const v = Math.round(B.saleValue(g, b) * (mult || 1));
    b.equip = [];
    TG.F.earn(g, v, forced ? 'Fire-sale proceeds' : 'Business sales', b.id, true);
    if (prop && prop.mortgageId) { const own = () => TG.F.payoff(g, prop.mortgageId); if (TG.LG) TG.LG.within(g, 'b:' + b.id, own); else own(); }
    B.close(g, b, forced ? 'sold in a forced liquidation' : `sold for ${U.money(v)}`, false);
    if (prop) g.properties = g.properties.filter((p) => p !== prop);
    return v;
  };
  // ---------- v6: instant updates ----------
  // The ONE recompute for everything derived from a business's current setup: team and machine capacity, work bars,
  // spare/short %, what limits you, and the next-month forecast. It runs the coming month on a throw-away copy of
  // the game (same random draws, nothing is kept), so any change (hire, fire, buy a machine, move acres, change a
  // price, buy feed, change an order) shows its effect at once. Next Month still simulates the month for real.
  // Results are cached per business and recomputed only when the business, cash or month changed.
  const LIVE = new WeakMap();
  B.liveSig = (g, b) => JSON.stringify(b, (k, v) => (k === 'hist' || k === 'log' || k === 'fcPrev' ? undefined : v)) + '|' + g.month + '|' + Math.round(g.cash / 500) + '|' + g.businesses.length;
  B.live = (g, b) => {
    if (!g || !b || !g.businesses.includes(b)) return null;
    const sig = B.liveSig(g, b); const c = LIVE.get(b); if (c && c.sig === sig) return c;
    const out = { sig, m: g.month, work: b.work || [], ctx: b.lastCtx || {}, fc: b.fc || null, ok: false };
    const G0 = TG.G;
    try {
      const g2 = JSON.parse(JSON.stringify(g)); const b2 = g2.businesses.find((x) => x.id === b.id);
      TG.G = g2; B.month(g2, b2);
      if (b2.lastCtx) { out.work = b2.work || []; out.ctx = b2.lastCtx; out.ok = true; }
    } catch (e) { out.err = e.message; } finally { TG.G = G0; }
    const m0 = g.month; // the forecast is built "at the end of last month", so look from there
    try { g.month = m0 - 1; out.fc = b.hist.length ? B.forecast(g, b) : null; } catch (e) { out.fc = b.fc || null; } finally { g.month = m0; }
    LIVE.set(b, out); return out;
  };
  B.liveReset = (b) => { if (b) LIVE.delete(b); };
  TG.B = B;
})();

</script>
<script>/* js/models.js */
/* models.js - business models: service (most businesses), farm, freight. models2.js adds brand, factory, projects, tech, franchise. */
(function () {
  const TG = globalThis.TG; const R = TG.R, U = TG.U;
  const M = { models: {} };
  const mdl = (b) => M.models[TG.CONFIG.businesses[b.type].model];
  M.init = (g, b, prop, opts) => { const m = mdl(b); if (m.init) m.init(g, b, prop, opts || {}); };
  M.needs = (g, b) => mdl(b).needs(g, b);
  M.month = (g, b, ctx) => mdl(b).month(g, b, ctx);
  M.baseRev = (g, b) => U.num(mdl(b).baseRev(g, b), 10000);
  M.extraRisks = (g, b, ctx) => (mdl(b).extraRisks ? mdl(b).extraRisks(g, b, ctx) : []);
  M.inventoryValue = (g, b) => (mdl(b).inventoryValue ? U.num(mdl(b).inventoryValue(g, b)) : 0) + Math.round(TG.ST.value(g, b));
  M.keyRole = (d) => Object.keys(d.roles).find((r) => d.roles[r].key);
  M.staffEff = (e) => (0.6 + e.skill / 250) * (1 - TG.CONFIG.staff.noShowBase * (1.6 - e.reliability / 100));
  M.paceMult = (b) => (b.pace === 'rush' ? 1.15 : b.pace === 'careful' ? 0.92 : 1);
  M.priceMult = (g, b) => TG.PR.ratio(g, b);
  M.repF = (b, exp) => U.clamp(Math.pow(Math.max(b.rep, 3) / 50, exp == null ? 1 : exp), 0.04, 2.6);

  // ============ SERVICE ============
  M.models.service = {
    spaceCap(b) { const s = TG.CONFIG.businesses[b.type].svc; return s.mobile ? Infinity : b.sqft * s.perSpace; },
    demandBase(g, b) {
      const d = TG.CONFIG.businesses[b.type], s = d.svc;
      if (s.occupancy) return this.spaceCap(b) * s.occupancy;
      const tf = s.mobile ? 0.55 + 0.6 * b.traffic : 0.25 + 0.95 * Math.pow(b.traffic, 0.8);
      return s.baseDemand * tf;
    },
    baseRev(g, b) { const s = TG.CONFIG.businesses[b.type].svc; return Math.min(this.demandBase(g, b), this.spaceCap(b)) * s.ticket * g.world.priceIdx; },
    needs(g, b) {
      const d = TG.CONFIG.businesses[b.type]; const est = Math.min(this.demandBase(g, b) * M.repF(b, d.svc.repExp) * 1.1, this.spaceCap(b));
      const out = { equip: [], staff: [] };
      for (const ed of d.equip) if (ed.support) out.equip.push({ type: ed.id, count: 1 });
      for (const pl of TG.E.pools(b)) out.equip.push({ type: pl.primary.id, count: Math.max(1, Math.ceil(est / pl.primary.cap)) });
      // storage: enough to hold about a month of supplies
      const sd = d.supply;
      if (sd) {
        const room = Math.max(sd.baseStore || 0, est * 0.75) + U.sum(d.equip.filter((x) => x.support && x.store), (x) => x.store);
        const sto = TG.ST.bestStore(b);
        if (sto && est * 1.08 > room) out.equip.push({ type: sto.id, count: Math.ceil((est * 1.08 - room) / sto.store) + (sto.support ? 1 : 0) });
      }
      for (const r in d.roles) {
        const rd = d.roles[r];
        if (rd.key) out.staff.push({ role: r, count: Math.max(rd.min || 0, Math.ceil(est / (rd.cap * 0.8)) - (B().owner(g, b) && d.tier === 'small' ? 1 : 0), d.tier === 'small' ? 0 : 1) });
        else if (rd.support) out.staff.push({ role: r, count: Math.max(0, Math.round(est / rd.per - 0.5)) });
      }
      return out;
    },
    caps(g, b, ctx) {
      const C = TG.CONFIG, d = C.businesses[b.type];
      let keyCap = 0; const kr = M.keyRole(d);
      for (const e of ctx.key) keyCap += d.roles[e.role].cap * M.staffEff(e);
      if (ctx.own && d.tier === 'small') keyCap += d.roles[kr].cap * 0.6;
      keyCap *= 1 + TG.E.boost(b, 'staffBoost');
      let supCap = Infinity;
      for (const r in d.roles) if (d.roles[r].support) { const have = b.staff.filter((e) => e.role === r).length; supCap = Math.min(supCap, (have + 0.5) * d.roles[r].per); }
      let eqCap = Infinity, prod = 1, limEq = null; const links = [];
      for (const pl of TG.E.pools(b)) { const c = TG.E.capacity(b, pl.pool); links.push({ pool: pl.pool, id: pl.primary.id, cat: pl.primary.cat, cap: c }); if (c < eqCap) { limEq = pl.primary.id; eqCap = c; } }
      for (const ed of d.equip) { if (ed.support || ed.critical || !ed.cap || ed.demandBoost) continue; if (TG.E.capacity(b, TG.E.poolOf(ed)) > 0) prod *= 1.06; }
      const spaceCap = this.spaceCap(b);
      return { keyCap: keyCap * prod, eqCap, spaceCap, supCap, limEq, links };
    },
    month(g, b, ctx) {
      const C = TG.CONFIG, d = C.businesses[b.type], s = d.svc, P = TG.PR, ST = TG.ST, FL = TG.FL;
      FL.start(b);
      const k = this.caps(g, b, ctx);
      const pace = M.paceMult(b) * (1 - ctx.down);
      const cap = Math.max(0, Math.min(k.keyCap, k.eqCap, k.spaceCap, k.supCap) * pace);
      const qualF = 0.85 + 0.3 * ctx.quality / 100;
      const r = P.ratio(g, b); const pf = P.demandF(r);
      let demand = this.demandBase(g, b) * M.repF(b, s.repExp) * qualF * B().demandMult(g, b, ctx) * pf;
      if (s.staffDemand && ctx.key.length) demand *= 1 + s.staffDemand * (ctx.skill - 50) / 100;
      let served = Math.min(demand, cap), made = 0, waste = 0, stockLimited = false;
      const sd = ST.def(b);
      if (sd) {
        ST.ensure(b);
        const ahead = s.makeAhead || 1;
        ST.restock(g, b, served * ahead);
        if (s.makeAhead) {
          made = Math.min(b.stock.qty, Math.min(demand * R.range(0.95, 1.05) * ahead, cap * 1.05));
          ST.use(b, made);
          const sold = Math.min(served, made); if (sold < served - 0.5) stockLimited = true;
          served = sold; waste = Math.max(0, made - served); b.stock.wasteM = waste;
        } else {
          const u = ST.use(b, served); if (u < served - 0.5) stockLimited = true; served = u;
        }
      }
      const base = s.ticket * g.world.priceIdx;
      const tb = TG.E.boost(b, 'ticketBoost');
      const ticket = P.ask(g, b) * (1 + tb) * ((b.fixesOn && b.fixesOn.ticketMult) || 1);
      const rev = served * ticket;
      if (d.receivable) B().addRecv(g, b, rev, d.receivable.delay - (b.fixes.billing ? 1 : 0));
      else TG.F.earn(g, rev, 'Revenue', b.id);
      if (P.good(b)) TG.W.sell(g, P.good(b).market, served);
      const fo = b.fixesOn || {};
      if (!sd) {
        let cogsPct = s.cogs + (fo.cogsAdd || 0) - (ctx.own ? C.owner.operatedCogsCut : 0);
        if (g.world.shortage[d.cat]) cogsPct *= 1.15;
        TG.F.spend(g, Math.round(served * base * Math.max(0, cogsPct)), 'Supplies & cost of sales', b.id);
      } else if (fo.cogsAdd) TG.F.spend(g, Math.round(served * base * fo.cogsAdd), 'Supplies & cost of sales', b.id);
      if (tb) TG.F.spend(g, Math.round(served * base * tb * 0.5), 'Supplies & cost of sales', b.id);
      if (s.ota) TG.F.spend(g, Math.round(rev * s.ota * (fo.otaCut ? 1 - fo.otaCut : 1)), 'Booking site fees', b.id);
      if (fo.revCostPct) TG.F.spend(g, Math.round(rev * fo.revCostPct), 'Commissions & warranties', b.id);
      const spoiled = sd ? ST.spoil(b) : 0;
      ctx.cap = Math.round(cap); ctx.demand = Math.round(demand); ctx.served = Math.round(served);
      ctx.limitEquip = k.limEq; ctx.links = k.links;
      { // work-capacity report
        const WK = TG.WK, kr = M.keyRole(d), unit = (P.good(b) || {}).unit || 'customer', nk = ctx.key.length + (ctx.own ? 1 : 0);
        WK.add(ctx, 'staff', '👥', (d.roles[kr].label || kr) + 's', nk, k.keyCap * pace, served, unit + 's', [], `Each handles about ${Math.round(d.roles[kr].cap).toLocaleString()} ${unit}s a month at normal skill. Training and skill raise it; over 100% they get tired and grumpy.`);
        for (const r in d.roles) if (d.roles[r].support) WK.add(ctx, 'staff', '🧹', (d.roles[r].label || r) + 's', b.staff.filter((e) => e.role === r).length, k.supCap, served, unit + 's', [], `Each supports about ${Math.round(d.roles[r].per).toLocaleString()} ${unit}s.`, r);
        WK.poolGroups(g, b, ctx, served, unit + 's');
        if (Number.isFinite(k.spaceCap)) WK.add(ctx, 'space', '📐', 'Space', 1, k.spaceCap * pace, served, unit + 's', [], 'How many your building fits. Needs a bigger place.');
      }
      const mn = Math.min(k.keyCap, k.eqCap, k.spaceCap, k.supCap);
      ctx.limit = stockLimited ? 'stock' : k.keyCap <= mn ? 'staff' : k.eqCap <= mn ? 'equipment' : k.spaceCap <= mn ? 'space' : 'support';
      if (demand < cap * 0.98 && !stockLimited) ctx.limitNow = 'demand';
      ctx.util = cap > 0 ? demand / cap : 1.5; ctx.busy = cap > 0 ? served / cap : 1;
      ctx.priceR = r;
      const lim = { staff: 'staff', equipment: 'equipment', space: 'space', support: 'helpers', stock: 'stock ran out' }[ctx.limit];
      if (cap === 0) ctx.note = 'No capacity: you need ' + (k.keyCap === 0 ? 'key staff' : k.eqCap === 0 ? 'working equipment' : 'space');
      else if (stockLimited) ctx.note = b.stock && b.stock.short === 'cash' ? 'Ran out of stock: not enough cash to buy supplies' : b.stock && b.stock.short === 'room' ? 'Ran out of stock: storage is too small' : (TG.D.handler(g, b, 'stock') ? 'Ran out of stock: order more' : 'Ran out of stock: no manager reorders, buy supplies yourself');
      else if (demand > cap * 1.15) ctx.note = `Turning away ${U.pct(1 - cap / demand)} of customers: limited by ${lim}`;
      else if (demand < cap * 0.6) ctx.note = r > 1.08 ? 'Lots of empty capacity: your price is above market' : 'Lots of empty capacity: need more customers';
      // flow
      const gd = P.good(b); const unit = d.supply ? '' : '';
      if (sd) FL.row(b, '📥', 'Stock in', b.stock.inM, '', b.stock.inM > 0 ? 'g' : 'y', b.stock.lastBy ? 'Ordered by ' + b.stock.lastBy : 'Auto-order off');
      if (s.makeAhead) FL.row(b, '🍳', 'Made', made, '', 'g');
      if (b.type === 'gym') {
        const prev = b.members == null ? served : b.members; const left = prev * s.churn * (r > 1.05 ? 1 + (r - 1) * 2 : 1);
        const joined = Math.max(0, served - prev + left); b.members = served;
        FL.row(b, '🙋', 'Joined', joined, 'members', 'g'); FL.row(b, '👋', 'Left', left, 'members', left > joined ? 'r' : 'y', `${U.pct(s.churn)} leave each month`);
      }
      FL.row(b, gd.icon, 'Sold', served, gd.unit, 'g', `at ${U.money(ticket)} each`);
      const lost = Math.max(0, demand - served);
      if (lost > 0.5) FL.row(b, '🚪', 'Turned away', lost, gd.unit, lost > demand * 0.15 ? 'r' : 'y', 'Limited by ' + lim);
      if (waste > 0.5) FL.row(b, '🗑️', 'Unsold (wasted)', waste, '', waste > made * 0.1 ? 'r' : 'y', 'Made ahead, not sold');
      if (spoiled > 0.5) FL.row(b, '🗑️', 'Spoiled', spoiled, '', spoiled > (b.stock.usedM || 1) * 0.1 ? 'r' : 'y', `${U.pct(sd.spoil)} of leftover stock spoils each month`);
      if (sd) FL.row(b, sd.icon, 'Stock left', b.stock.qty, '/' + ST.cap(b), b.stock.qty < served * 0.2 ? 'y' : 'g');
      const moy = U.moy(g.month), nm = (moy + 1) % 12; const sf = d.season[nm] / Math.max(0.1, d.season[moy]);
      const expD = demand * sf;
      FL.next(b, '🧲', 'Customers expected', expD, gd.unit, expD > cap ? 'y' : 'g', expD > cap ? 'More than you can serve (' + Math.round(cap) + ')' : '');
      if (sd) { const need = Math.min(expD, cap) * (s.makeAhead || 1); FL.next(b, sd.icon, 'Stock needed', need, '', need > ST.cap(b) ? 'r' : 'g', need > ST.cap(b) ? 'More than storage holds (' + ST.cap(b) + ')' : ''); FL.next(b, '🗑️', 'Will spoil', Math.max(0, b.stock.qty) * sd.spoil, '', 'y'); }
      if (b.type === 'gym') FL.next(b, '👋', 'Will leave', served * s.churn, 'members', 'y');
    },
  };
  const B = () => TG.B;

  // ============ FARM: see farm.js ============
  // ============ FREIGHT ============
  M.models.freight = {
    needs(g, b) { const n = Math.max(1, b.equip.filter((x) => x.type === 'truck').length); return { equip: [{ type: 'truck', count: n }], staff: [{ role: 'driver', count: B().owner(g, b) ? Math.max(0, n - 1) : n }] }; },
    baseRev(g, b) { return Math.max(1, b.equip.filter((x) => x.type === 'truck').length) * 13 * TG.CONFIG.markets.freight.base * g.world.priceIdx; },
    month(g, b, ctx) {
      const C = TG.CONFIG, d = C.businesses.freight, fr = d.freight, w = g.world;
      const fo = b.fixesOn || {};
      const trucks = b.equip.filter((x) => x.type === 'truck');
      const roadM = 0.72 + 0.35 * b.traffic * 0 + 0.35 * (g.properties.find((p) => p.id === b.propId) || { road: 0.6 }).road;
      const truckCap = U.sum(trucks, (x) => TG.E.out(x) * d.equip[0].cap) * roadM * (fo.loadMult || 1);
      let driverCap = U.sum(ctx.key, (e) => d.roles.driver.cap * (0.7 + e.skill / 300) * (1 - C.staff.noShowBase * (1.6 - e.reliability / 100)));
      if (ctx.own) driverCap += d.roles.driver.cap * 0.6;
      let cap = Math.min(truckCap, driverCap) * (w.hoursReg > 0 ? 0.9 : 1) * M.paceMult(b) * (1 - ctx.down);
      const st = g.markets.freight;
      const r = TG.PR.ratio(g, b);
      const avail = U.clamp(0.78 + 0.22 * (b.rep / 50) - 0.35 * (st.comp - 1), 0.35, 1.05) * B().demandMult(g, b, ctx, { noPrice: true }) * TG.PR.demandF(r);
      let loads = Math.max(0, Math.min(cap, cap * avail));
      // diesel comes out of the tanks; bad roads and emission rules burn more, fuel-saving upgrades less
      const road = (g.properties.find((p) => p.id === b.propId) || { road: 0.6 }).road;
      const burn = Math.pow(2 - road, 0.3) * (1 - (fo.fuelCut || 0)) * (w.emissions > 0 ? 1.05 : 1);
      TG.ST.ensure(b); TG.ST.restock(g, b, loads * burn);
      const usedF = TG.ST.use(b, loads * burn); const noFuel = Math.max(0, loads - usedF / burn); loads -= noFuel;
      const nTr = trucks.filter((x) => !x.broken).length;
      const reef = b.equip.filter((x) => x.type === 'reefer' && !x.broken).length;
      const reefB = nTr ? Math.min(1, reef / nTr) * TG.E.def(b, 'reefer').ticketBoost : 0;
      const price = (b.ask != null ? TG.PR.ask(g, b) : TG.W.price(g, 'freight', loads * 6)) * (1 + reefB);
      TG.F.earn(g, Math.round(loads * price), 'Freight revenue', b.id); TG.W.sell(g, 'freight', loads);
      ctx.priceR = r;
      { const FL = TG.FL; FL.start(b);
        FL.row(b, '🚛', 'Trucks working', nTr, '/' + trucks.length, nTr < trucks.length ? 'y' : 'g', nTr < trucks.length ? 'Some trucks broken' : '');
        FL.row(b, '📦', 'Loads hauled', loads, '', 'g', `at ${U.money(price)} each`);
        FL.row(b, '⛽', 'Diesel used', usedF, 'tanks', 'g', `${U.money(TG.ST.unitCost(g, b))} a tank now${b.hedge && b.hedge.until > g.month ? ' (locked price)' : ''}`);
        if (noFuel > 0.5) FL.row(b, '🚫', 'Loads lost: no diesel', noFuel, '', 'r', b.stock.short === 'cash' ? 'Not enough cash for fuel' : 'Tanks empty: buy diesel or turn on auto');
        FL.next(b, '⛽', 'Diesel in tanks', b.stock.qty, '/' + TG.ST.cap(b), b.stock.qty < loads ? 'y' : 'g', 'Enough for about this many loads');
        if (cap * (1 - avail) > 0.5 && avail < 1) FL.row(b, '🅿️', 'Empty truck days', cap - loads, 'loads', avail < 0.75 ? 'r' : 'y', r > 1.05 ? 'Your rate is over market' : 'Not enough freight around');
        if (truckCap > driverCap * 1.2) FL.row(b, '🧑‍✈️', 'Trucks without drivers', (truckCap - driverCap) / 14, '', 'r', 'Hire drivers');
        FL.next(b, '📦', 'Loads expected', loads, '', 'g'); }
      TG.F.spend(g, Math.round(loads * fr.tollsPerLoad * w.priceIdx), 'Tolls & fees', b.id); TG.ST.spoil(b);
      // crashes per active truck
      const active = Math.min(trucks.filter((x) => !x.broken).length, Math.ceil(loads / 12));
      for (let i = 0; i < active; i++) {
        const t = trucks.filter((x) => !x.broken)[i]; if (!t) break;
        const p = fr.crashBase * (1.6 - ctx.skill / 100) * (0.5 + TG.E.effWear(t) / 60) * (b.pace === 'rush' ? 1.6 : b.pace === 'careful' ? 0.75 : 1) * (b.fixes.safetytrain ? 0.6 : 1) * (b.spec.safety ? 0.6 : 1) * (w.hoursReg > 0 ? 0.85 : 1) * ctx.streakMult;
        if (R.chance(p)) {
          t.broken = R.chance(0.4) ? 'destroyed' : 'major';
          const why = `${U.pct(p, 2)} monthly crash chance per truck: driver skill ${Math.round(ctx.skill)}, truck wear ${Math.round(TG.E.effWear(t))}%, ${b.pace} pace${b.fixes.safetytrain ? ', safety training' : ', no safety training'}`;
          TG.rep.event(g, b, 'major', `${t.label} #${TG.E.num(b, t)} crashed`, why, { major: 'breakdown' });
          if (t.broken === 'destroyed') TG.F.claim(g, b, 'equipment', TG.E.resale(g, b, Object.assign({}, t, { broken: null })), 'truck crash');
          TG.E.queueBroken(g, b, t);
          B().lawsuit(g, b, 'Truck crash lawsuit', R.range(fr.crashSuit[0], fr.crashSuit[1]) * w.priceIdx, 'liability', why);
          b.rep = U.clamp(b.rep - R.range(2, 6), 0, 100);
        }
      }
      TG.WK.add(ctx, 'eq', '🚛', 'Trucks', trucks.filter((x) => !x.broken).length, truckCap, loads, 'loads', ['truck'], `About ${d.equip[0].cap} loads a month per truck. Good roads add a little. Busy trucks wear faster.`);
      TG.WK.add(ctx, 'staff', '🧑‍✈️', 'Drivers', ctx.key.length + (ctx.own ? 1 : 0), driverCap, loads, 'loads', [], `About ${d.roles.driver.cap} loads a month per driver (legal driving hours). Skill and reliability raise it.`);
      ctx.cap = Math.round(cap); ctx.served = Math.round(loads); ctx.demand = Math.round(cap * avail);
      ctx.util = cap > 0 ? avail : 1; ctx.busy = U.clamp(avail, 0, 1.2);
      if (truckCap > driverCap * 1.2) ctx.note = 'Trucks sitting idle: not enough drivers';
      else if (driverCap > truckCap * 1.2) ctx.note = 'Drivers waiting: not enough working trucks';
      if (avail < 0.7) ctx.note = 'Too many trucks chasing the same freight: loads are scarce';
    },
    extraRisks(g, b, ctx) {
      const fr = TG.CONFIG.businesses.freight.freight; const t = b.equip.filter((x) => x.type === 'truck' && !x.broken);
      if (!t.length) return [];
      const p = fr.crashBase * (1.6 - ctx.skill / 100) * (0.5 + TG.E.avgWear(b) / 60) * (b.fixes.safetytrain ? 0.6 : 1) * (b.spec.safety ? 0.6 : 1) * t.length;
      return [{ label: 'A truck crash (lawsuit)', p: 1 - Math.pow(1 - p / t.length, t.length), why: `${t.length} trucks on the road, driver skill ${Math.round(ctx.skill)}` }];
    },
  };
  M.freightHedge = (g, b) => {
    const cost = Math.round(b.equip.filter((x) => x.type === 'truck').length * 13 * 12 * 620 * 0.02 * g.world.priceIdx);
    if (g.cash < cost) return { ok: false, msg: `Hedge costs ${U.money(cost)}.` };
    TG.F.spend(g, cost, 'Fuel hedging', b.id, true);
    b.hedge = { idx: g.world.fuel * 1.03, until: g.month + 12 };
    return { ok: true, cost };
  };
  TG.M = M;
})();

</script>
<script>/* js/models2.js */
/* models2.js - brand (e-commerce), factory, projects (construction), tech, franchise models. */
(function () {
  const TG = globalThis.TG; const R = TG.R, U = TG.U; const M = TG.M;
  const B = () => TG.B;
  const poisson = (l) => { let k = 0, p = Math.exp(-Math.min(l, 50)), s = p; const u = R.next(); while (u > s && k < 200) { k++; p *= l / k; s += p; } return k; };

  // ============ BRAND / E-COMMERCE ============
  M.models.brand = {
    init(g, b) { b.brand = { stock: 0, stockCost: 0, incoming: [], followers: 0, lastOrders: 0, lostSales: 0 }; },
    needs(g, b) { const sold = b && b.lastCtx ? b.lastCtx.served || 0 : 0; return { equip: [{ type: 'shelving', count: 1 }], staff: [{ role: 'packer', count: Math.max(1, Math.ceil(sold * 1.2 / TG.CONFIG.businesses.brand.roles.packer.cap)) }] }; },
    baseRev(g, b) { return Math.max(25000, (b.brand ? b.brand.lastOrders : 0) * 42) * g.world.priceIdx; },
    month(g, b, ctx) {
      const C = TG.CONFIG, d = C.businesses.brand, br = d.brand, s = b.brand, fo = b.fixesOn || {};
      // arrivals
      for (const inc of s.incoming.slice()) {
        if (inc.due > g.month) continue;
        s.incoming = s.incoming.filter((x) => x !== inc);
        let units = inc.units;
        const pIssue = br.factoryIssue * (b.fixes.inspect ? 0.3 : 1);
        if (R.chance(pIssue)) { const x = R.range(br.defect[0], br.defect[1]); const lost = Math.round(units * x); units -= lost; TG.rep.event(g, b, 'bad', `Factory quality issue: ${lost.toLocaleString()} of ${inc.units.toLocaleString()} items unsellable`, `${U.pct(pIssue)} chance per batch${b.fixes.inspect ? ' (inspections cut it)' : '; no factory inspections'}`); }
        s.stock += units; s.stockCost += inc.cost; s.arrivedM = (s.arrivedM || 0) + units;
        TG.rep.event(g, b, 'info', `Batch of ${units.toLocaleString()} items arrived`, `Ordered ${br.leadMonths} months ago`);
      }
      const share = TG.W.share(g, 'apparel');
      const adMgr = b.spec.ads;
      const adVisitors = b.ads.budget > 0 ? (b.ads.budget / (br.cpv * (1 + 3 * share) * g.world.priceIdx)) * (adMgr ? 1 + adMgr.skill / 150 : 1) * (b.rep < 30 ? 0.6 : 1) : 0;
      const flop = b.ads.budget > 0 && R.chance(C.reputation.adChannels[b.ads.channel].flop * (adMgr ? 0.5 : 1));
      const visitors = adVisitors * (flop ? 0.2 : 1) + b.rep * br.organicPerRep;
      if (flop) TG.rep.event(g, b, 'bad', 'Ad spend burned with almost no sales', `${C.reputation.adChannels[b.ads.channel].label} campaigns flop ${U.pct(C.reputation.adChannels[b.ads.channel].flop)} of the time${adMgr ? '' : '; no experienced ads manager'}`);
      const qualF = 0.8 + 0.4 * ctx.quality / 100;
      const dm = B().demandMult(g, b, ctx, { noAds: true });
      const r = TG.PR.ratio(g, b);
      let orders = (visitors * br.conv * qualF + s.followers * br.followerConv) * dm * (1 - share * 0.5) * TG.PR.demandF(r);
      if (R.chance(br.viral * (0.5 + b.rep / 100))) { const x = R.range(br.viralMult[0], br.viralMult[1]); orders *= x; TG.rep.event(g, b, 'good', `Went viral! Orders x${x.toFixed(1)} this month`, 'Rare viral moment'); }
      let packCap = U.sum(ctx.key, (e) => d.roles.packer.cap * M.staffEff(e)) * (fo.packerMult || 1) + (ctx.own ? 900 : 0);
      if (b.equip.some((x) => x.type === 'shelving' && !x.broken)) packCap *= 1.15;
      packCap *= 1 + TG.E.boost(b, 'staffBoost');
      packCap *= M.paceMult(b) * (1 - ctx.down);
      const sold = Math.max(0, Math.floor(Math.min(orders, s.stock, packCap)));
      const lost = Math.max(0, orders - sold);
      if (lost > 200 && lost > orders * 0.25) TG.rep.event(g, b, 'bad', `Missed ${Math.round(lost).toLocaleString()} orders`, sold >= s.stock - 1 ? 'Stock ran out' : `Fulfilment capacity ${Math.round(packCap)} orders`);
      const avgCost = s.stock > 0 ? s.stockCost / s.stock : 0;
      const price = b.ask != null ? TG.PR.ask(g, b) : TG.W.price(g, 'apparel', sold * 6);
      TG.F.earn(g, Math.round(sold * price), 'Online sales', b.id); TG.W.sell(g, 'apparel', sold);
      TG.F.book(g, Math.round(sold * avgCost), 'Cost of goods sold', b.id);
      s.stockCost -= sold * avgCost; s.stock -= sold;
      TG.F.spend(g, Math.round(sold * br.shipPerUnit * g.world.priceIdx), 'Shipping', b.id);
      const room = M.brandRoom(b);
      // out-of-season fade
      const faded = Math.floor(s.stock * br.fade); const fadeCost = s.stock > 0 ? s.stockCost * faded / s.stock : 0;
      if (faded > 0) { s.stock -= faded; s.stockCost -= fadeCost; TG.F.book(g, Math.round(fadeCost), 'Out-of-season stock', b.id); }
      const FL = TG.FL; FL.start(b); const arrived = s.arrivedM || 0; s.arrivedM = 0;
      FL.row(b, '📥', 'Arrived', arrived, 'items', arrived ? 'g' : '');
      FL.row(b, '👕', 'Sold', sold, 'items', 'g', `at ${U.money(price)} each`);
      if (lost > 0.5) FL.row(b, '🚪', 'Missed orders', lost, '', lost > orders * 0.2 ? 'r' : 'y', sold >= s.stock + sold - 1 ? 'Out of stock' : 'Packing capacity');
      if (faded > 0) FL.row(b, '🍂', 'Went out of season', faded, 'items', faded > sold * 0.3 ? 'r' : 'y', `${U.pct(br.fade, 1)} of stock fades each month`);
      FL.row(b, '📦', 'In stock', s.stock, '/' + Math.round(room), s.stock > room ? 'r' : s.stock < orders ? 'y' : 'g', s.stock > room ? 'Over storage: costs triple' : '');
      const inc = U.sum(s.incoming.filter((x) => x.due === g.month + 1), (x) => x.units);
      FL.next(b, '🧲', 'Orders expected', s.avgOrders == null ? orders : s.avgOrders * 0.7 + orders * 0.3, '', 'g');
      if (inc) FL.next(b, '🚚', 'Arriving', inc, 'items', 'g');
      FL.next(b, '🍂', 'Will fade', s.stock * br.fade, 'items', 'y');
      const storage = s.stock * br.storagePerUnit * (s.stock > room ? 3 : 1) * g.world.priceIdx;
      TG.F.spend(g, Math.round(storage), 'Storage', b.id);
      s.followers = Math.max(0, s.followers + sold * br.followerRate - s.followers * br.followerChurn);
      s.lastOrders = orders; s.lostSales = lost; s.avgOrders = s.avgOrders == null ? orders : s.avgOrders * 0.7 + orders * 0.3;
      TG.WK.add(ctx, 'staff', '📦', 'Packers', ctx.key.length + (ctx.own ? 1 : 0), packCap, sold, 'orders', [], `Each packs and ships about ${d.roles.packer.cap.toLocaleString()} orders a month. Packing stations and shelving speed them up.`);
      TG.WK.add(ctx, 'space', '🏬', 'Warehouse room', 1, M.brandRoom(b), s.stock, 'units', ['shelving', 'racking'], 'How many clothes fit. Racking adds room.');
      ctx.cap = Math.round(packCap); ctx.demand = Math.round(orders); ctx.served = sold;
      ctx.util = packCap > 0 ? orders / packCap : 1.5; ctx.busy = U.clamp(sold / Math.max(1, packCap), 0, 1.3);
      if (s.stock === 0 && !s.incoming.length) ctx.note = 'No stock and nothing on order: order a batch';
      else if (s.stock > orders * 8 && orders > 0) ctx.note = 'Warehouse full of slow-moving stock: consider a clearance sale';
    },
    inventoryValue(g, b) { return Math.round(b.brand.stockCost * 0.8 + U.sum(b.brand.incoming, (x) => x.cost) * 0.9); },
    extraRisks(g, b) { const br = TG.CONFIG.businesses.brand.brand; return [{ label: 'Next batch has a factory quality issue', p: br.factoryIssue * (b.fixes.inspect ? 0.3 : 1), why: b.fixes.inspect ? 'factory inspections' : 'no factory inspections' }]; },
  };
  M.brandRoom = (b) => b.sqft * TG.CONFIG.businesses.brand.brand.unitsPerSqft + TG.E.sumField(b, 'storeUnits');
  M.brandOrder = (g, b, units, test) => {
    const br = TG.CONFIG.businesses.brand.brand; units = Math.round(units);
    const min = test ? br.testBatch : br.minBatch;
    if (test && !b.fixes.test) return { ok: false, msg: 'Enable small test batches first.' };
    if (units < min) return { ok: false, msg: `Minimum batch is ${min}.` };
    const unit = br.unitCost * g.world.priceIdx * (test ? br.testMarkup : 1) * (1 - ((b.fixesOn && b.fixesOn.unitCostCut) || 0)) * (b.fixes.inspect ? 1.02 : 1) * Math.max(0.8, 1 - Math.log10(units / 500) * 0.06);
    const cost = Math.round(units * unit);
    if (g.cash < cost) return { ok: false, msg: `Costs ${U.money(cost)}.` };
    TG.F.spend(g, cost, 'Inventory orders', b.id, true);
    b.brand.incoming.push({ units, cost, due: g.month + br.leadMonths });
    return { ok: true, cost };
  };
  M.brandClearance = (g, b, pct) => {
    const s = b.brand; const units = Math.floor(s.stock * pct); if (units <= 0) return { ok: false };
    const rev = Math.round(units * TG.W.price(g, 'apparel', units) * 0.4);
    const costPart = s.stockCost * units / s.stock;
    s.stock -= units; s.stockCost -= costPart; TG.W.sell(g, 'apparel', units);
    TG.F.earn(g, rev, 'Clearance sales', b.id); TG.F.book(g, Math.round(costPart), 'Cost of goods sold', b.id); b.rep = U.clamp(b.rep - 1, 0, 100);
    return { ok: true, rev, units };
  };

  // ============ FACTORY ============
  M.models.factory = {
    init(g, b) { b.factory = { stock: 0, policy: 'hold', premium: 0 }; },
    lines(b) { return b.equip.filter((x) => x.type === 'line'); },
    maxLines(b) { return Math.max(1, Math.floor(b.sqft / TG.CONFIG.businesses.factory.factory.sqftPerLine)); },
    needs(g, b) { const n = Math.max(1, this.lines(b).length); const d = TG.CONFIG.businesses.factory; return { equip: [{ type: 'line', count: n }, { type: 'forklift', count: 1 }].concat(TG.ST.cap({ type: 'factory', sqft: b.sqft, equip: [] }) < n * d.equip[0].cap * 1.05 ? [{ type: 'rawsilo', count: Math.ceil((n * d.equip[0].cap * 1.05 - TG.ST.cap({ type: 'factory', sqft: b.sqft, equip: [] })) / 20000) }] : []), staff: [{ role: 'worker', count: Math.ceil(n * d.equip[0].cap / d.roles.worker.cap * (1 - ((b.fixesOn && b.fixesOn.workerCut) || 0))) }] }; },
    baseRev(g, b) { return Math.max(1, this.lines(b).length) * 12000 * TG.CONFIG.markets.goods.base * g.world.priceIdx; },
    month(g, b, ctx) {
      const C = TG.CONFIG, d = C.businesses.factory, fd = d.factory, f = b.factory, fo = b.fixesOn || {};
      const lineCap = TG.E.capacity(b, 'line');
      const wc = (fo.workerCut || 0);
      const workerUnits = U.sum(ctx.key, (e) => d.roles.worker.cap * M.staffEff(e)) / Math.max(0.2, 1 - wc) * (1 + TG.E.boost(b, 'staffBoost'));
      let prod = Math.max(0, Math.min(lineCap, workerUnits) * M.paceMult(b) * (1 - ctx.down));
      const bulk = b.fixes.bulk && b.fixes.bulk.until > g.month;
      if (b.fixes.bulk && !bulk) { delete b.fixes.bulk; TG.rep.event(g, b, 'info', 'Bulk supplier contract ended', 'Contract term over'); }
      // raw materials: ordered into the raw-material store, then used by the lines
      // managers slow the lines when finished stock piles up (workers still get paid)
      if (f.stock > prod * fd.maxStockMonths) { const cut = U.clamp(1 - (f.stock - prod * fd.maxStockMonths) / Math.max(1, prod * 2), 0.25, 1); prod *= cut; }
      TG.ST.ensure(b); TG.ST.restock(g, b, prod);
      const want = prod; prod = TG.ST.use(b, prod);
      if (fo.materialAdd) TG.F.spend(g, Math.round(prod * fd.materialCost * g.world.priceIdx * fo.materialAdd), 'Raw materials', b.id);
      if (g.world.shortage.home) TG.F.spend(g, Math.round(prod * fd.materialCost * g.world.priceIdx * 0.05), 'Raw materials', b.id);
      f.stock += prod;
      if (fo.rnd && R.chance(fo.rnd)) { f.premium = Math.min(0.3, f.premium + 0.04); g.markets.goods.demand12 *= 1.02; TG.rep.event(g, b, 'good', 'R&D launched a new product line (+4% price premium)', '3% monthly chance with an R&D department'); }
      const pNow = TG.W.price(g, 'goods', f.stock * 6) * (1 + f.premium) * (0.9 + 0.2 * ctx.quality / 100);
      const floor = fd.materialCost * g.world.priceIdx * 1.5;
      let sell = f.stock;
      if (f.policy === 'hold' && pNow < floor && b.ask == null) sell = Math.max(0, f.stock - prod * fd.maxStockMonths);
      sell = Math.min(sell, f.stock);
      const r = b.ask != null ? U.clamp(b.ask / Math.max(0.01, pNow), 0.3, 4) : 1;
      // business buyers switch suppliers fast: factory goods are more price-sensitive than farm commodities
      // above market, buyers only take a share of a normal month's volume (a stockpile does not create extra buyers)
      const offered = sell; if (r > 1) sell = Math.min(sell, Math.floor(Math.max(prod, lineCap * 0.5) * Math.pow(TG.PR.sellF(r), TG.CONFIG.pricing.factorySens || 1)));
      const price = b.ask != null ? b.ask : pNow;
      if (sell > 0) { TG.F.earn(g, Math.round(sell * price), 'Product sales', b.id); TG.W.sell(g, 'goods', sell); f.stock -= sell; }
      TG.F.spend(g, Math.round(f.stock * fd.storagePerUnit * g.world.priceIdx), 'Storage', b.id);
      const spoiledRaw = TG.ST.spoil(b);
      ctx.priceR = r;
      const FL = TG.FL; FL.start(b);
      FL.row(b, '📥', 'Raw materials in', b.stock.inM, 'units', 'g', 'Ordered by ' + (b.stock.lastBy || 'nobody'));
      FL.row(b, '🏭', 'Made', prod, 'units', prod < want * 0.95 ? 'y' : 'g', prod < want * 0.95 ? 'Not enough raw materials' : '');
      FL.row(b, '🛒', 'Sold', sell, 'units', 'g', `at ${U.money(price)} each`);
      if (offered - sell > 0.5) FL.row(b, '🚫', 'Buyers said no', offered - sell, 'units', 'r', 'Your price is over market');
      FL.row(b, '📦', 'Finished stock', f.stock, 'units', f.stock > prod * 3 ? 'y' : 'g', `Storage ${U.money(fd.storagePerUnit * g.world.priceIdx)}/unit/mo`);
      FL.row(b, '🪨', 'Raw left', b.stock.qty, '/' + TG.ST.cap(b), 'g');
      FL.next(b, '🏭', 'Can make', Math.min(lineCap, workerUnits), 'units', 'g');
      FL.next(b, '🏷️', 'Market price', pNow, '$', pNow < floor ? 'r' : 'g', pNow < floor ? 'Below cost-plus: oversupply' : '');
      TG.WK.add(ctx, 'eq', '🏭', 'Production lines', this.lines(b).filter((x) => !x.broken).length, lineCap, prod, 'units', ['line'], 'Each line makes about 12,000 units a month. Busy lines wear faster.');
      TG.WK.add(ctx, 'staff', '👷', 'Line workers', ctx.key.length + (ctx.own ? 1 : 0), workerUnits, prod, 'units', [], `Each runs about ${d.roles.worker.cap} units a month. A robot arm makes them faster.`);
      ctx.cap = Math.round(lineCap); ctx.served = Math.round(prod); ctx.demand = Math.round(lineCap);
      ctx.util = lineCap > 0 ? prod / lineCap : 0; ctx.busy = U.clamp(workerUnits > 0 ? lineCap / workerUnits : 1.3, 0, 1.3);
      if (lineCap === 0) ctx.note = 'All production lines are down';
      else if (workerUnits < lineCap * 0.9) ctx.note = `Short on line workers: running at ${U.pct(prod / lineCap)}`;
      if (pNow < floor) ctx.note = (ctx.note ? ctx.note + '. ' : '') + 'Market price is below cost-plus: oversupply';
    },
    inventoryValue(g, b) { return Math.round(b.factory.stock * Math.min(TG.CONFIG.businesses.factory.factory.materialCost * g.world.priceIdx * 1.3, TG.W.price(g, 'goods', b.factory.stock * 6) * 0.6)); },
    extraRisks(g, b, ctx) {
      if (b.staff.length < TG.CONFIG.staff.strikeMinStaff) return [];
      const m = U.avg(b.staff, (e) => e.morale, 60);
      return m < 45 ? [{ label: 'Union strike', p: TG.CONFIG.staff.strikeBase * (45 - m) / 10 * (b.fixes.fairwages ? 0.3 : 1), why: `average morale ${Math.round(m)}` }] : [];
    },
  };

  // ============ PROJECTS (CONSTRUCTION) ============
  M.models.projects = {
    init(g, b) { b.proj = { offers: [], active: [], done: 0, markup: 'normal', autoBid: true }; this.offers(g, b); },
    cfg() { return TG.CONFIG.businesses.construction.projects; },
    offers(g, b) {
      const P = this.cfg(); b.proj.offers = b.proj.offers.filter((o) => o.expires > g.month);
      const n = R.int(P.offers[0], P.offers[1]);
      for (let i = 0; i < n; i++) {
        const sizes = Object.keys(P.sizes).filter((k) => b.rep >= P.sizes[k].minRep || R.chance(0.15));
        const k = R.pick(sizes); const s = P.sizes[k];
        b.proj.offers.push({ id: U.uid('o'), size: k, label: `${s.label}: ${R.pick(['school', 'warehouse', 'offices', 'homes', 'retail center', 'clinic', 'apartments', 'road works', 'parking garage'])}`,
          cost: Math.round(R.range(s.value[0], s.value[1]) * g.world.priceIdx / 1000) * 1000, months: R.int(s.months[0], s.months[1]), crew: R.int(s.crew[0], s.crew[1]), heavy: s.heavy, crane: s.crane, bond: !!s.bond, expires: g.month + 2 });
      }

      TG.WK.add(ctx, 'staff', '🧭', 'Area managers', ctx.key.length + (ctx.own ? 1 : 0), regCap, open.length, 'shops', [], `Each checks on about ${C.businesses.franchise.roles.regional.cap} shops. Unchecked shops slip.`);
      TG.WK.add(ctx, 'eq', '💻', 'Franchise systems', b.equip.filter((x) => x.type === 'systems' && !x.broken).length, TG.E.capacity(b, 'systems'), open.length, 'shops', ['systems'], 'Ordering and reporting software: about 60 shops per system.');
      ctx.cap = Math.round(regCap); ctx.demand = open.length; ctx.served = open.length; ctx.util = open.length / Math.max(1, regCap); ctx.busy = U.clamp(ctx.util, 0, 1.3);
      ctx.note = `${open.length} open locations, ${s.locations.length - open.length} being built, ${s.apps.length} applications waiting; regional coverage ${U.pct(cov)}`;
      if (cannibal < 0.85) ctx.note += `; locations cannibalizing each other (sales x${cannibal.toFixed(2)})`;
    },
    extraRisks(g, b) { const fr = TG.CONFIG.businesses.franchise.franchise; const bad = b.fr.locations.filter((l) => l.bad).length; return bad ? [{ label: 'A franchisee scandal', p: 1 - Math.pow(1 - fr.scandalPerBad * ((b.fixesOn && b.fixesOn.scandalCut) || 1), bad), why: 'some franchisees are weak (hidden)' }] : []; },
  };
  M.franchiseApprove = (g, b, appId, by) => {
    const fr = TG.CONFIG.businesses.franchise.franchise; const a = b.fr.apps.find((x) => x.id === appId); if (!a) return { ok: false };
    b.fr.apps = b.fr.apps.filter((x) => x !== a);
    const open = Math.round(fr.openCost * g.world.priceIdx);
    TG.F.earn(g, Math.round(fr.fee * g.world.priceIdx), 'Franchise fees', b.id);
    TG.F.spend(g, open, 'Location launch support', b.id);
    b.fr.locations.push({ id: a.id, name: a.name, q: a.q, bad: a.bad, age: 0, status: 'building' });
    TG.rep.decision(g, b, by, `Approved franchisee ${a.name} (looked ${a.signal > 0.7 ? 'strong' : a.signal > 0.45 ? 'okay' : 'weak'})`, a.bad ? 'bad' : 'good');
    return { ok: true };
  };
  M.franchiseReject = (g, b, appId) => { b.fr.apps = b.fr.apps.filter((x) => x.id !== appId); return { ok: true }; };
})();

</script>
<script>/* js/farm.js */
/* farm.js - v5 farm. The land is split into areas you choose: 🐄 cow area, 🌾 crop area, 🍎 orchard area (plus free acres).
   Each area has its own soil % (drops every month, faster when it is high; spraying brings it back), water % (how much of the
   area your sprinklers cover; low water RAISES THE ODDS of dry-outs and sick cows), price and work. Moving acres between
   areas costs money and takes a month or two. Farmhands and tractors are shared by all areas. */
(function () {
  const TG = globalThis.TG; const R = TG.R, U = TG.U; const M = TG.M;
  const FD = () => TG.CONFIG.businesses.farm.farm;
  const AR = ['cows', 'crops', 'orchard'];
  const GOOD = { crops: 'grain', orchard: 'fruit' };
  M.farmAreas = AR;
  const ent = (k) => FD().enterprises[k]; // v6: one cow herd (milk + meat)
  M.areaE = (b, k) => ent(k, b.farm.areas[k]);
  M.areaLabel = (k) => FD().areas[k].label.toLowerCase();
  const pct = (x) => U.pct(x, 0);
  const B = () => TG.B;

  M.newArea = (k, acres, soil) => {
    const a = { acres: acres || 0, soil: soil == null ? 0.7 : soil, askR: null, m: {} };
    if (k === 'cows') Object.assign(a, { herd: 0, st: { calf: 0, heifer: 0, steer: 0, ready: 0, milker: 0, dry: 0, bull: 0 }, health: 0.9 });
    if (k === 'crops') Object.assign(a, { planted: 0, toHarvest: 0, seasonYield: 1, lastHarvest: null });
    if (k === 'orchard') Object.assign(a, { age: 0, seasonYield: 1, lastHarvest: null });
    return a;
  };
  M.farmDefaultOrders = () => ({ spray: { crops: { on: true, below: 0.6 }, orchard: { on: true, below: 0.6 } }, seed: true, cows: M.cowOrderDefaults() }); // orders only run with a manager
  // old saves: one enterprise for the whole farm -> that becomes the matching area; everything else stays where it was
  M.farmEnsure = (b, prop) => {
    const f = b.farm; if (f.areas) return f;
    const old = Object.assign({}, f); const soil = old.soil != null ? old.soil : 0.6;
    const nf = { acres: old.acres || 1, landType: old.landType || 'flat', rain: old.water != null ? old.water : 0.6, baseSoil: soil, freeSoil: soil, areas: {}, moving: [],
      stored: { grain: 0, fruit: 0 }, seeds: old.seeds || 0, storageCap: old.storageCap || 0, sellPolicy: old.sellPolicy || 'sell', futures: [], orders: M.farmDefaultOrders(), harv: [], plantBroken: false, m: {} };
    for (const k of AR) nf.areas[k] = M.newArea(k, 0, soil);
    const e0 = old.ent || 'crops'; const k0 = e0 === 'cattle' || e0 === 'dairy' ? 'cows' : e0 === 'orchard' ? 'orchard' : 'crops';
    const a = nf.areas[k0]; a.acres = nf.acres; a.askR = null;
    if (k0 === 'cows') Object.assign(a, { kind: e0 === 'dairy' ? 'dairy' : 'beef', herd: old.herd || 0, cows: old.cows, young: old.young || [], ready: old.ready || 0 });
    if (k0 === 'crops') Object.assign(a, { planted: old.planted || 0, toHarvest: old.toHarvest || 0, seasonYield: old.seasonYield || 1, lastHarvest: old.lastHarvest || null });
    if (k0 === 'orchard') Object.assign(a, { age: Math.min(old.orchardAge || 0, FD().enterprises.orchard.rampMonths), seasonYield: old.seasonYield || 1, lastHarvest: old.lastHarvest || null });
    if (old.stored) nf.stored[k0 === 'orchard' ? 'fruit' : 'grain'] = old.stored;
    nf.feed = 0;
    nf.futures = (old.futures || []).map((x) => Object.assign({ mk: k0 === 'orchard' ? 'fruit' : 'grain' }, x));
    if (old.autoSeeds === false) nf.orders.seed = false;
    if (old.irrigated > 0) nf.legacyIrr = old.irrigated; // old irrigation becomes sprinklers (see migrateEquip)
    b.ask = null; // old saves: one price for the whole farm; areas now each follow their own market
    b.farm = nf; return nf;
  };
  // old irrigated acres turn into sprinklers in the area that was farmed (free: you already paid for them)
  M.farmMigrateEquip = (g, b) => {
    const f = b.farm; if (!f.legacyIrr) return; const k = AR.find((x) => f.areas[x].acres > 0) || 'crops';
    const t = FD().areas[k].spr; if (!t) { delete f.legacyIrr; return; } // v6: cows eat feed, they have no sprinklers
    const ed = TG.E.def(b, t); let n = Math.max(1, Math.round(f.legacyIrr / ed.acres));
    while (n-- > 0) { const it = TG.E.buy(g, b, t, 'standard', { free: true }); if (!it) break; }
    delete f.legacyIrr;
  };

  // ---------- land helpers ----------
  M.farmUsed = (f) => U.sum(AR, (k) => f.areas[k].acres) + U.sum(f.moving || [], (x) => x.acres);
  M.farmFree = (f) => Math.max(0, Math.round(f.acres - M.farmUsed(f)));
  M.farmAddAcres = (f, k, acres, soil) => {
    const a = f.areas[k]; const tot = a.acres + acres; if (tot <= 0) return;
    a.soil = (a.soil * a.acres + soil * acres) / tot;
    if (k === 'orchard') a.age = Math.min(a.age, FD().enterprises.orchard.rampMonths) * a.acres / tot; // young trees pull the average age down
    a.acres = tot;
  };
  M.sprAcres = (b, k) => { const t = FD().areas[k].spr; let c = 0; for (const it of b.equip) if (it.type === t && !it.broken) { const ed = TG.E.def(b, t); c += ed.acres * TG.E.out(it); } return c; };
  M.areaWater = (b, k) => { const a = b.farm.areas[k]; return a.acres > 0 ? U.clamp(M.sprAcres(b, k) / a.acres, 0, 1) : 0; };
  M.dryMult = (w) => (w && w.kind && w.sev !== 0 ? FD().water.dry[w.kind] || 1 : 1);
  const wLabel = (w) => (w && w.kind && TG.CONFIG.weather.kinds[w.kind] ? TG.CONFIG.weather.kinds[w.kind].label.toLowerCase() : 'normal weather');
  // soil -> yield multiplier, and the monthly drop
  M.soilYield = (s) => FD().soil.yieldBase + FD().soil.yieldK * s;
  M.soilDrop = (k, s) => FD().areas[k].decay * s * s;
  M.soilAdd = (s) => Math.max(0, Math.min(1 - s, FD().soil.add * (FD().soil.ceil - s)));
  M.waterYield = (w) => 1 + FD().water.yieldK * w;
  M.growing = (k, moy) => (k === 'crops' ? moy >= 3 && moy <= 9 : k === 'orchard' ? moy >= 2 && moy <= 8 : true);

  // ---------- odds (shown to the player and used by the monthly roll) ----------
  M.dryOdds = (g, b, k, w) => {
    const f = b.farm, a = f.areas[k], W = FD().water; if (!a.acres || k === 'cows') return { p: 0, why: '' };
    const water = M.areaWater(b, k); const bl = B().backlogMult(b);
    const p = U.clamp(W.lossBase * (1 - water) * M.dryMult(w) * (1.5 - f.rain) * bl, 0, 0.9);
    return { p, why: `water ${pct(water)} (sprinklers cover ${Math.round(Math.min(a.acres, M.sprAcres(b, k)))} of ${Math.round(a.acres)} acres), ${wLabel(w)}, rain on this land ${pct(f.rain)}${bl > 1.05 ? `, unfinished work x${bl.toFixed(2)}` : ''}` };
  };
  M.pestOdds = (g, b, k) => {
    const a = b.farm.areas[k], W = FD().water; if (!a.acres || k === 'cows') return { p: 0, why: '' };
    const rot = k === 'crops' && b.fixes.rotation; const bl = B().backlogMult(b);
    const p = U.clamp(W.pestBase * (1.7 - a.soil) * (rot ? W.rotationCut : 1) * bl, 0, 0.9);
    return { p, why: `soil ${pct(a.soil)} (poor soil = weak plants)${rot ? ', crop rotation helps' : ''}${bl > 1.05 ? `, unfinished work x${bl.toFixed(2)}` : ''}` };
  };

  M.farmParlorCap = (b) => Math.round(TG.E.sumField(b, 'milkCows'));
  // for the start screen / setup cost (no business yet)
  M.bestEnterprise = (prop) => (prop.orchard ? 'orchard' : prop.landType === 'grassland' || prop.landType === 'dry' || prop.landType === 'hillside' ? 'cows' : 'crops');
  M.isHarvest = (g, b) => { const moy = U.moy(g.month); const A = b.farm.areas; return (A.crops.acres > 0 && FD().enterprises.crops.harvest.indexOf(moy) >= 0) || (A.orchard.acres > 0 && FD().enterprises.orchard.harvest.indexOf(moy) >= 0); };
  M.isLivestock = (f) => !!(f && f.areas && f.areas.cows.acres > 0);
  // ---- storage (tons): base shed + bins/silos; grain, fruit and seed share it
  M.farmStoreCap = (b) => { const fd = FD(); return Math.round(fd.baseStoreTons + b.farm.acres * fd.storePerAcre + (b.farm.storageCap || 0) + TG.E.sumField(b, 'storeTons')); };
  M.farmStoreUsed = (b) => { const f = b.farm; return (f.stored.grain || 0) + (f.stored.fruit || 0) + (f.seeds || 0) * FD().enterprises.crops.seedTonsPerAcre + (f.feed || 0) * TG.CONFIG.cows.feedTonsCap; };
  M.farmStoreFree = (b) => Math.max(0, M.farmStoreCap(b) - M.farmStoreUsed(b));
  // processing plant: works only with enough volume through it (12-month sum; a cow counts as 0.5 t)
  M.plantVolume = (b) => U.sum(b.farm.harv || [], (x) => x.t);
  M.plantOn = (b) => { const fx = FD() && TG.CONFIG.businesses.farm.fixes.find((x) => x.id === 'plant'); return !!(b.fixes.plant && !b.farm.plantBroken && M.plantVolume(b) >= fx.minVolume); };
  M.plantMult = (b, k) => (M.plantOn(b) ? (k === 'cows' ? 1.2 : TG.CONFIG.businesses.farm.fixes.find((x) => x.id === 'plant').valueMult) : 1);
  const logVol = M.logVolX = (g, f, t) => { f.harv = (f.harv || []).filter((x) => x.m > g.month - 12); const cur = f.harv.find((x) => x.m === g.month); if (cur) cur.t += t; else f.harv.push({ m: g.month, t }); };

  M.models.farm = {
    init(g, b, prop, opts) {
      const e0 = opts.ent || M.bestEnterprise(prop);
      const f = b.farm = { acres: prop.acres, landType: prop.landType, rain: prop.water, baseSoil: prop.soil, freeSoil: prop.soil, areas: {}, moving: [], stored: { grain: 0, fruit: 0 }, seeds: 0, feed: 0, storageCap: 0, sellPolicy: 'sell', futures: [], orders: M.farmDefaultOrders(), harv: [], plantBroken: false, m: {} };
      for (const k of AR) f.areas[k] = M.newArea(k, 0, prop.soil);
      const split = { crops: { crops: 1 }, orchard: { orchard: 1 }, cows: { cows: 1 }, cattle: { cows: 1 }, dairy: { cows: 1 }, mixed: { cows: 0.5, crops: 0.5 } }[e0] || { crops: 1 };
      let left = prop.acres; const ks = Object.keys(split);
      ks.forEach((k, i) => { const n = i === ks.length - 1 ? left : Math.round(prop.acres * split[k]); f.areas[k].acres = n; left -= n; });
      f.seeds = Math.round(f.areas.crops.acres); // first season's seed comes with the start-up cost
      if (f.areas.orchard.acres) f.areas.orchard.age = prop.orchard ? FD().enterprises.orchard.rampMonths : 0;
      if (f.areas.cows.acres) { M.herdInit(f.areas.cows, Math.round(M.farmHerdCap({ acres: f.areas.cows.acres }) * (FD().herdStart || 0.5))); f.feed = Math.round(M.feedNeed(f.areas.cows) * 2); } // starter herd + 2 months of feed (in the setup cost)
    },
    e(b, k) { return ent(k || 'crops', b.farm.areas[k || 'crops']); },
    // work: tractors pull planters and trailers (acres each) or haul hay and feed (head each); farmhands per acre / per cow
    tractorNeed(b) { const A = b.farm.areas; const ec = ent('cows', A.cows); return A.crops.acres / ent('crops').acresPerTractor + A.orchard.acres / ent('orchard').acresPerTractor + (A.cows.herd || 0) / (ec.headPerTractor || 600); },
    handNeed(b) { const A = b.farm.areas; const ec = ent('cows', A.cows); return Math.max(0.3, A.crops.acres / ent('crops').acresPerHand + A.orchard.acres / ent('orchard').acresPerHand + (A.cows.herd || 0) / ec.headPerHand); },
    needs(g, b) {
      M.farmEnsure(b);
      const eq = [{ type: 'tractor', count: Math.max(1, Math.ceil(this.tractorNeed(b) - 0.15)) }];
      const A = b.farm.areas; if (A.cows.acres) { M.herdSync(A.cows); eq.push({ type: 'parlor', count: Math.max(1, Math.ceil((A.cows.st.milker || 1) / 160)) }); }
      return { equip: eq, staff: [{ role: 'hand', count: Math.max(1, Math.ceil(this.handNeed(b) * 1.1)) }] };
    },
    baseRev(g, b) {
      M.farmEnsure(b); const A = b.farm.areas, C = TG.CONFIG; let r = 0;
      if (A.cows.herd && A.cows.st) r += A.cows.st.milker * ent('cows').milkPerCow * C.markets.milk.base + A.cows.st.steer / 6 * C.markets.beef.base;
      r += A.crops.acres * ent('crops').yield * C.markets.grain.base / 12 + A.orchard.acres * ent('orchard').yield * C.markets.fruit.base / 12;
      return r * g.world.priceIdx;
    },
    cover(g, b) {
      let tcap = 0, robotCap = 0, plantX = 0, harvX = 0, combines = 0;
      for (const it of b.equip) {
        const ed = TG.E.def(b, it.type); if (!ed) continue;
        if (it.type === 'tractor' || ed.countsAs === 'tractor') { const c = ed.cap * TG.E.out(it); tcap += c; if (ed.efficiency) robotCap += c; }
        if (ed.plantEq && !it.broken) plantX += ed.plantEq * TG.E.out(it);
        if (ed.harvestEq && !it.broken) { harvX += ed.harvestEq * TG.E.out(it); combines++; }
      }
      const tneed = Math.max(0.01, this.tractorNeed(b));
      const robotShare = tcap > 0 ? robotCap / tcap : 0;
      const heff = U.sum(b.staff.filter((e) => e.role === 'hand'), M.staffEff);
      const hneed = this.handNeed(b) * (1 - robotShare * 0.85 * Math.min(1, tcap / tneed));
      const gear = tcap > 0 ? 1 : 0;
      return { tcov: U.clamp(tcap / tneed, 0, 1), pcov: U.clamp((tcap + plantX * gear) / tneed, 0, 1), hvcov: U.clamp((tcap + harvX * gear) / tneed, 0, 1), combines, hcov: U.clamp(heff / Math.max(0.3, hneed), 0, 1), tcap, tneed, heff, hneed, plantX: plantX * gear, harvX: harvX * gear };
    },
    ratio(b, k) { const a = b.farm.areas[k]; return a.askR == null ? 1 : U.clamp(a.askR, 0.3, 4); },
    market(g, b, k, qty) { return TG.W.price(g, ent(k, b.farm.areas[k]).market, (qty || 0) / 2); },
    // offer goods from an area to buyers at your price; returns {rev, sold, unsold}
    offer(g, b, k, units, label) {
      const a = b.farm.areas[k], e = ent(k, a);
      const r = this.ratio(b, k); const sold = units * TG.PR.sellF(r);
      const p = this.market(g, b, k, sold) * r * M.plantMult(b, k);
      if (sold > 0) { TG.F.earn(g, Math.round(sold * p), label, b.id); TG.W.sell(g, e.market, sold); }
      a.m.sold = (a.m.sold || 0) + sold; a.m.rev = (a.m.rev || 0) + sold * p;
      return { rev: sold * p, sold, unsold: units - sold };
    },
    // crops/fruit: fill price locks first, then sell or store (your harvest order)
    sell(g, b, k, tons, label) {
      const f = b.farm, a = f.areas[k], good = GOOD[k];
      let rev = 0;
      for (const fu of f.futures) { if (tons <= 0) break; if ((fu.mk || 'grain') !== good) continue; const q = Math.min(fu.qty - fu.done, tons); if (q <= 0) continue; fu.done += q; tons -= q; rev += q * fu.price; }
      if (rev > 0) TG.F.earn(g, Math.round(rev), label, b.id);
      let stored = 0, rotted = 0;
      if (tons > 0) {
        const policy = f.sellPolicy === 'auto' ? TG.D.farmPolicy(g, b, good) : f.sellPolicy;
        if (policy === 'store') { stored = Math.min(tons, M.farmStoreFree(b)); f.stored[good] += stored; tons -= stored; }
        if (tons > 0) {
          const o = this.offer(g, b, k, tons, label); rev += o.rev;
          if (o.unsold > 0) { const s2 = Math.min(o.unsold, M.farmStoreFree(b)); f.stored[good] += s2; stored += s2; rotted = o.unsold - s2; }
        }
      }
      if (rotted > 0) { a.m.lost = (a.m.lost || 0) + rotted; TG.rep.event(g, b, 'bad', `${Math.round(rotted).toLocaleString()} t of ${good} had nowhere to go and rotted`, 'Buyers refused your price and storage was full'); }
      return { rev, stored, rotted };
    },
    sellStored(g, b, good, tons) {
      const f = b.farm; tons = Math.min(tons, f.stored[good] || 0); if (tons <= 0) return 0;
      const o = this.offer(g, b, good === 'fruit' ? 'orchard' : 'crops', tons, good === 'fruit' ? 'Fruit sales' : 'Crop sales'); f.stored[good] -= o.sold; return Math.round(o.rev);
    },
    seedCost(g, b, premium) { return ent('crops').seedPerAcre * g.world.priceIdx * (1 + (premium || 0)) * (b.fixes.integrate ? 0.8 : 1); },
    buySeeds(g, b, acres, premium) {
      const e = ent('crops');
      acres = Math.max(0, Math.min(Math.floor(acres), Math.floor(M.farmStoreFree(b) / e.seedTonsPerAcre)));
      const per = this.seedCost(g, b, premium); acres = Math.min(acres, Math.floor(Math.max(0, g.cash) / per));
      if (acres <= 0) return 0;
      TG.F.spend(g, Math.round(acres * per), 'Seed', b.id); b.farm.seeds = (b.farm.seeds || 0) + acres; b.farm.m.seedsIn = (b.farm.m.seedsIn || 0) + acres;
      return acres;
    },
    month(g, b, ctx) {
      const f = M.farmEnsure(b); M.farmMigrateEquip(g, b); M.herdMigrate(g, b);
      const C = TG.CONFIG, fd = FD(), moy = U.moy(g.month), A = f.areas;
      f.m = f.mNext || {}; f.mNext = null; for (const k of AR) A[k].m = {};
      // land that was being converted is ready
      for (const mv of (f.moving || []).slice()) if (mv.ready <= g.month) { M.farmAddAcres(f, mv.to, mv.acres, mv.soil); f.moving.splice(f.moving.indexOf(mv), 1); TG.rep.event(g, b, 'info', `${mv.acres} acres are ready in the ${M.areaLabel(mv.to)}`, `Converted for ${U.money(mv.cost)}`); }
      if (M.farmFree(f) > 0) f.freeSoil = Math.min(Math.max(f.baseSoil, f.freeSoil), f.freeSoil + fd.soil.freeRegen); // resting land slowly recovers
      TG.D.farmOrders(g, b); // your manager carries out your standing orders (spray soil)
      const cov = this.cover(g, b);
      const qMult = 0.9 + 0.2 * ctx.quality / 100;
      ctx.cap = Math.round(f.acres); ctx.util = Math.min(cov.tcov, cov.hcov); ctx.busy = 1 / Math.max(0.3, ctx.util);
      { // work report: farmhand work in "acre-equivalents"
        const WK = TG.WK, load = Math.max(0.3, cov.hneed) * 100, per = 100;
        const nT = b.equip.filter((x) => (x.type === 'tractor' || x.type === 'robot') && !x.broken).length;
        WK.add(ctx, 'eq', '🚜', 'Tractors', nT, cov.tcap / cov.tneed * load, load, 'work pts', ['tractor', 'robot'], `Crops: about ${ent('crops').acresPerTractor} acres per tractor; orchard ${ent('orchard').acresPerTractor}; cows about ${ent('cows', A.cows).headPerTractor || 600} head. A robot tractor counts as 4.`);

    crops(g, b, ctx, cov, moy, inputCut, qMult) {
